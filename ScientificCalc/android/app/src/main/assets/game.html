<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scientific Calculator</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#3F51B5; --accent2:#1A237E; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:12px 12px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#display { background:var(--surface); border-radius:var(--radius); padding:12px 16px; margin-bottom:10px; flex-shrink:0; }
#expr { font-size:0.85rem; color:var(--muted); min-height:20px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#result { font-size:2.2rem; font-weight:700; color:var(--text); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#result.error { color:#F44336; font-size:1.1rem; }
#keypad { flex:1; display:grid; grid-template-rows:repeat(8, 1fr); gap:6px; padding-bottom:10px; }
.key-row { display:grid; gap:6px; }
.key-row.r5 { grid-template-columns:repeat(5,1fr); }
.key-row.r4 { grid-template-columns:repeat(4,1fr); }
button.key { min-height:44px; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; background:var(--card); color:var(--text); }
button.key.btn-pressed { opacity:0.65; }
button.key.sci { background:var(--surface); color:#aab; font-size:0.85rem; }
button.key.op { background:#1a2560; color:var(--accent); }
button.key.eq { background:var(--accent); color:#fff; }
button.key.clear { background:#3a1a1a; color:#F44336; }
button.key.back { background:#1a1a3a; color:var(--muted); }
button.key.zero { grid-column:span 2; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Scientific <span>Calc</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="display">
    <div id="expr"></div>
    <div id="result">0</div>
  </div>
  <div id="keypad">
    <div class="key-row r5">
      <button class="key sci" data-action="sin">sin</button>
      <button class="key sci" data-action="cos">cos</button>
      <button class="key sci" data-action="tan">tan</button>
      <button class="key sci" data-action="log">log</button>
      <button class="key sci" data-action="ln">ln</button>
    </div>
    <div class="key-row r5">
      <button class="key sci" data-action="sqrt">√</button>
      <button class="key sci" data-action="sq">x²</button>
      <button class="key sci" data-action="pow">xʸ</button>
      <button class="key sci" data-action="pi">π</button>
      <button class="key sci" data-action="e">e</button>
    </div>
    <div class="key-row r5">
      <button class="key sci" data-action="(">(</button>
      <button class="key sci" data-action=")">)</button>
      <button class="key sci" data-action="pct">%</button>
      <button class="key back" data-action="back">⌫</button>
      <button class="key clear" data-action="clear">C</button>
    </div>
    <div class="key-row r4">
      <button class="key" data-action="7">7</button>
      <button class="key" data-action="8">8</button>
      <button class="key" data-action="9">9</button>
      <button class="key op" data-action="÷">÷</button>
    </div>
    <div class="key-row r4">
      <button class="key" data-action="4">4</button>
      <button class="key" data-action="5">5</button>
      <button class="key" data-action="6">6</button>
      <button class="key op" data-action="×">×</button>
    </div>
    <div class="key-row r4">
      <button class="key" data-action="1">1</button>
      <button class="key" data-action="2">2</button>
      <button class="key" data-action="3">3</button>
      <button class="key op" data-action="-">−</button>
    </div>
    <div class="key-row r4">
      <button class="key zero" data-action="0">0</button>
      <button class="key" data-action=".">.</button>
      <button class="key op" data-action="+">+</button>
    </div>
    <div class="key-row r4">
      <button class="key sci" data-action="neg">+/−</button>
      <button class="key sci" data-action="inv">1/x</button>
      <button class="key sci" data-action="abs">|x|</button>
      <button class="key eq" data-action="=">=</button>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, expr:'', justEvaled:false };

var exprEl = document.getElementById('expr');
var resEl = document.getElementById('result');

function updateDisplay(){
  exprEl.textContent = state.expr || '';
}

function evaluate(expr){
  // Replace display chars with JS ops
  var e = expr
    .replace(/×/g,'*')
    .replace(/÷/g,'/')
    .replace(/−/g,'-')
    .replace(/π/g,'Math.PI')
    .replace(/e(?![0-9])/g,'Math.E');
  try {
    var r = Function('"use strict";return ('+e+')')();
    if(typeof r !== 'number' || !isFinite(r)) throw new Error();
    return r;
  } catch(ex){ return null; }
}

function showLive(){
  if(!state.expr){ resEl.textContent='0'; resEl.className=''; return; }
  var r = evaluate(state.expr);
  if(r !== null){
    resEl.textContent = parseFloat(r.toPrecision(12)).toString();
    resEl.className = '';
  } else {
    resEl.textContent = '...';
    resEl.className = '';
  }
}

function appendToExpr(s){
  if(state.justEvaled){
    // If appending an operator, keep the result; if digit, start fresh
    var ops = ['+','-','−','×','÷','*','/'];
    if(ops.indexOf(s) === -1){
      state.expr = '';
    }
    state.justEvaled = false;
  }
  state.expr += s;
  updateDisplay();
  showLive();
}

document.getElementById('keypad').addEventListener('click', function(e){
  var btn = e.target.closest('button.key');
  if(!btn) return;
  var a = btn.dataset.action;
  if(!a) return;
  handleAction(a);
});

function handleAction(a){
  var digits = '0123456789.';
  var ops = ['+','−','×','÷'];
  if(digits.indexOf(a)!==-1 || ops.indexOf(a)!==-1 || a==='(' || a===')'){
    appendToExpr(a==='-'?'−':a);
    return;
  }
  switch(a){
    case 'clear': state.expr=''; state.justEvaled=false; resEl.textContent='0'; resEl.className=''; updateDisplay(); break;
    case 'back':
      if(state.expr.length>0){ state.expr=state.expr.slice(0,-1); updateDisplay(); showLive(); }
      break;
    case '=':
      if(!state.expr) return;
      var r = evaluate(state.expr);
      exprEl.textContent = state.expr + ' =';
      if(r !== null){
        var rStr = parseFloat(r.toPrecision(12)).toString();
        resEl.textContent = rStr;
        resEl.className = '';
        state.expr = rStr;
        state.justEvaled = true;
      } else {
        resEl.textContent = 'Error';
        resEl.className = 'error';
        state.expr = '';
        state.justEvaled = false;
      }
      maybeInterstitial();
      break;
    case 'sin': appendToExpr('Math.sin('); break;
    case 'cos': appendToExpr('Math.cos('); break;
    case 'tan': appendToExpr('Math.tan('); break;
    case 'log': appendToExpr('Math.log10('); break;
    case 'ln': appendToExpr('Math.log('); break;
    case 'sqrt': appendToExpr('Math.sqrt('); break;
    case 'sq': appendToExpr('^2'); break; // handled below
    case 'pow': appendToExpr('^'); break;
    case 'pi': appendToExpr('π'); break;
    case 'e': appendToExpr('e'); break;
    case 'pct':
      // get last number and divide by 100
      var m = state.expr.match(/([\d.]+)$/);
      if(m){ state.expr = state.expr.slice(0,-m[1].length) + (parseFloat(m[1])/100).toString(); updateDisplay(); showLive(); }
      break;
    case 'neg':
      // wrap last number/group in -(...)
      var m2 = state.expr.match(/([\d.]+)$/);
      if(m2){ state.expr = state.expr.slice(0,-m2[1].length) + '(-'+m2[1]+')'; updateDisplay(); showLive(); }
      break;
    case 'inv':
      appendToExpr('^(-1)');
      break;
    case 'abs':
      appendToExpr('Math.abs(');
      break;
  }
}

// Handle ^ for power using regex before eval
var origEval = evaluate;
evaluate = function(expr){
  // Convert x^y to Math.pow(x,y) iteratively
  var e2 = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/e(?![0-9])/g,'Math.E');
  // Handle ^ operator
  while(e2.indexOf('^')!==-1){
    e2 = e2.replace(/([\d.]+|\))\^([\d.(]+|\()/,function(m,b,exp){
      return 'Math.pow('+b+','+exp;
    });
    // This simplified approach: just do full replacement
    break;
  }
  // Better ^ handling: split and rebuild
  if(expr.indexOf('^')!==-1){
    var e3 = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/e(?![0-9])/g,'Math.E');
    e3 = e3.replace(/([0-9.]+)\^([0-9.(]+)/g,'Math.pow($1,$2)');
    e3 = e3.replace(/\)\^([0-9.(]+)/g,',($1))');
    try{
      var rv = Function('"use strict";return ('+e3+')')();
      if(typeof rv!=='number'||!isFinite(rv)) throw 0;
      return rv;
    }catch(ex){ return null; }
  }
  try {
    var rv2 = Function('"use strict";return ('+e2+')')();
    if(typeof rv2!=='number'||!isFinite(rv2)) throw 0;
    return rv2;
  } catch(ex2){ return null; }
};

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

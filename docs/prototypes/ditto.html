<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ditto</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0e1726; --grid:#1b2942; --line:#24395e;
    --you:#37e0e0; --you-dim:#1d8f8f;
    --echo:#ff6b6b; --echo-dim:#a83b3b;
    --plate:#f2c14e; --exit:#9be37d;
    --ink:#dce8fb; --mute:#7d93b6;
    --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%,#13203a 0%,var(--bg) 70%);
    color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;overflow:hidden;
    padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
    user-select:none;touch-action:none}
  .top{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .brand{font-weight:800;letter-spacing:2px;font-size:1.25rem}
  .brand small{color:var(--echo);letter-spacing:0}
  .sub{color:var(--mute);font-size:.72rem;letter-spacing:.5px;margin-top:-2px}
  .meta{display:flex;gap:8px;align-items:center}
  .chip{background:var(--grid);border:1px solid var(--line);border-radius:11px;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--ink);display:flex;gap:5px;align-items:center}
  .chip b{color:var(--you)}
  .boardwrap{position:relative;margin:8px 0}
  #board{position:relative;background:
      repeating-linear-gradient(0deg,transparent 0 calc(100%/6 - 1px),var(--line) calc(100%/6 - 1px) calc(100%/6)),
      repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 1px),var(--line) calc(100%/6 - 1px) calc(100%/6)),
      var(--grid);
    border:2px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -18px #000}
  .cell{position:absolute;border-radius:9px;transition:transform .13s cubic-bezier(.3,1.4,.5,1)}
  .wall{position:absolute;background:linear-gradient(180deg,#0a1120,#070c16);border:1px solid #060a12;border-radius:7px;box-shadow:inset 0 1px 0 #1a2742}
  .exit{position:absolute;border-radius:9px;border:2.5px dashed var(--exit);box-shadow:inset 0 0 14px -2px var(--exit)}
  .plate{position:absolute;border-radius:50%;border:3px solid var(--plate);opacity:.85}
  .plate.held{background:radial-gradient(circle,var(--plate) 0%,transparent 70%);box-shadow:0 0 18px -2px var(--plate)}
  .you{background:linear-gradient(160deg,var(--you),var(--you-dim));box-shadow:0 4px 10px -2px #000,inset 0 1px 0 #bff;z-index:3}
  .echo{background:linear-gradient(160deg,var(--echo),var(--echo-dim));box-shadow:0 4px 10px -2px #000,inset 0 1px 0 #fcc;z-index:2;opacity:.92}
  .echo::after{content:"";position:absolute;inset:0;border-radius:9px;border:1.5px dashed #ffd1d1;opacity:.5}
  .shake{animation:sh .32s}
  @keyframes sh{0%,100%{transform:translate(var(--tx),var(--ty))}25%{transform:translate(calc(var(--tx) - 5px),var(--ty))}75%{transform:translate(calc(var(--tx) + 5px),var(--ty))}}
  .queue{display:flex;gap:6px;align-items:center;justify-content:center;height:26px;margin-top:8px;color:var(--echo);font-size:.74rem}
  .queue .lbl{color:var(--mute)}
  .q{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--echo-dim);display:grid;place-items:center;font-weight:800}
  .q.empty{opacity:.3;border-style:dashed}
  .controls{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:7px;margin-top:6px}
  .controls button{background:var(--grid);border:1px solid var(--line);border-radius:13px;color:var(--ink);font-size:1.3rem;font-weight:800;cursor:pointer;transition:transform .08s,background .12s}
  .controls button:active{transform:scale(.92);background:#22344f}
  .pad-u{grid-column:2;grid-row:1}.pad-l{grid-column:1;grid-row:2}.pad-d{grid-column:2;grid-row:2}.pad-r{grid-column:3;grid-row:2}
  .row{display:flex;gap:10px;margin-top:12px}
  .btn{background:var(--grid);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:700;
    font-size:.85rem;border-radius:12px;padding:11px 18px;cursor:pointer;display:flex;gap:7px;align-items:center;transition:transform .08s,background .12s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(135deg,var(--you),var(--you-dim));color:#04222a;border:none}
  .hint{color:var(--mute);font-size:.74rem;text-align:center;max-width:320px;margin-top:12px;line-height:1.5}
  .hint b{color:var(--echo)}
  .overlay{position:fixed;inset:0;background:rgba(6,11,22,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
  .overlay.on{display:flex}
  .card{background:var(--grid);border:1px solid var(--line);border-radius:20px;padding:26px 24px;text-align:center;max-width:340px;width:100%;box-shadow:0 24px 60px -20px #000}
  .card h2{font-size:1.5rem;letter-spacing:1px;margin-bottom:4px}
  .card .pz{color:var(--exit);font-weight:800;font-size:1rem;margin:8px 0}
  .card p{color:var(--mute);font-size:.85rem;margin-bottom:16px;line-height:1.5}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
    background:#22344f;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.8rem;font-weight:600;
    opacity:0;transition:.25s;pointer-events:none;z-index:30}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="brand">DIT<small>TO</small></div>
      <div class="sub" id="sub">Daily · your echo, 2 moves behind</div>
    </div>
    <div class="meta">
      <div class="chip">Moves <b id="moves">0</b></div>
      <div class="chip">Par <span id="par">–</span></div>
    </div>
  </div>

  <div class="boardwrap">
    <div id="board"></div>
    <div class="queue"><span class="lbl">echo plays next →</span><div class="q empty" id="q0">·</div><div class="q empty" id="q1">·</div></div>
  </div>

  <div class="controls">
    <button class="pad-u" data-d="U">↑</button>
    <button class="pad-l" data-d="L">←</button>
    <button class="pad-d" data-d="D">↓</button>
    <button class="pad-r" data-d="R">→</button>
  </div>

  <div class="row">
    <button class="btn" id="undo">↶ Undo</button>
    <button class="btn" id="reset">↺ Reset</button>
    <button class="btn" id="next">New ⟳</button>
  </div>

  <div class="hint">Move with swipes, arrows, or the pad. The <b>red echo</b> copies your moves, two behind. Land on the green exit while the echo sits on the gold plate.</div>

  <div class="overlay" id="ov">
    <div class="card">
      <h2 id="ovh">Synced.</h2>
      <div class="pz" id="ovp"></div>
      <p id="ovs"></p>
      <button class="btn primary" id="ovnext" style="width:100%;justify-content:center">Next puzzle →</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const N=6,DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},DK=['U','D','L','R'],ARROW={U:'↑',D:'↓',L:'←',R:'→'};
function step(walls,bp,cp,q,dir){
  const mv=(p,d)=>{if(d==null)return p;const[dx,dy]=DIRS[d];let nx=p[0]+dx,ny=p[1]+dy;if(nx<0||ny<0||nx>=N||ny>=N||walls.has(ny*N+nx))return p;return[nx,ny];};
  const nb=mv(bp,dir),nc=mv(cp,q[0]);
  const collide=(nb[0]===nc[0]&&nb[1]===nc[1])||(nb[0]===cp[0]&&nb[1]===cp[1]&&nc[0]===bp[0]&&nc[1]===bp[1]);
  return{nb,nc,nq:[q[1],dir],collide};
}
function solve(walls,bs,cs,exit,plate){
  const enc=(b,c,q)=>b+'|'+c+'|'+(q[0]??'n')+'|'+(q[1]??'n');
  let frontier=[[bs,cs,[null,null]]];const seen=new Set([enc(bs,cs,[null,null])]);let depth=0;
  while(frontier.length){depth++;const next=[];
    for(const[b,c,q]of frontier)for(const d of DK){
      const{nb,nc,nq,collide}=step(walls,b,c,q,d);if(collide)continue;
      const k=enc(nb,nc,nq);if(seen.has(k))continue;seen.add(k);
      if(nb[0]===exit[0]&&nb[1]===exit[1]&&nc[0]===plate[0]&&nc[1]===plate[1])return depth;
      next.push([nb,nc,nq]);
    }
    frontier=next;if(depth>40)break;
  }return -1;
}
function gen(seed){
  const rnd=mulberry32(seed);
  for(let t=0;t<5000;t++){
    const walls=new Set();const nW=4+Math.floor(rnd()*7);
    while(walls.size<nW)walls.add(Math.floor(rnd()*N*N));
    const cells=[];for(let i=0;i<N*N;i++)if(!walls.has(i))cells.push([i%N,Math.floor(i/N)]);
    const pick=()=>cells[Math.floor(rnd()*cells.length)];
    const bs=pick(),cs=pick(),exit=pick(),plate=pick();
    const key=p=>p[0]+','+p[1];
    if(new Set([bs,cs,exit,plate].map(key)).size<4)continue;
    const par=solve(walls,bs,cs,exit,plate);
    if(par>=7&&par<=22)return{walls,bs,cs,exit,plate,par};
  }return null;
}

let L,state,hist,moves,cell,gap,daySeed,puzzleNo;
const boardEl=document.getElementById('board');
function dayNum(){return Math.floor((Date.now()-Date.UTC(2026,0,1))/864e5);}
function layout(){
  const maxW=Math.min(window.innerWidth-28,420,window.innerHeight*0.52);
  const size=Math.floor(maxW);cell=Math.floor(size/N);gap=Math.round(cell*0.12);
  boardEl.style.width=boardEl.style.height=(cell*N)+'px';
}
function px(c){return c*cell+gap/2;}
function mkEnt(cls){const d=document.createElement('div');d.className='cell '+cls;d.style.width=d.style.height=(cell-gap)+'px';boardEl.appendChild(d);return d;}
let youEl,echoEl,plateEl,exitEl,wallEls=[];
function build(){
  boardEl.innerHTML='';wallEls=[];
  L.walls.forEach(i=>{const x=i%N,y=Math.floor(i/N);const w=document.createElement('div');w.className='wall';w.style.width=w.style.height=(cell-gap)+'px';w.style.left=px(x)+'px';w.style.top=px(y)+'px';boardEl.appendChild(w);});
  exitEl=document.createElement('div');exitEl.className='exit';exitEl.style.width=exitEl.style.height=(cell-gap+2)+'px';exitEl.style.left=(px(L.exit[0])-1)+'px';exitEl.style.top=(px(L.exit[1])-1)+'px';boardEl.appendChild(exitEl);
  plateEl=document.createElement('div');plateEl.className='plate';plateEl.style.width=plateEl.style.height=(cell-gap-6)+'px';plateEl.style.left=(px(L.plate[0])+3)+'px';plateEl.style.top=(px(L.plate[1])+3)+'px';boardEl.appendChild(plateEl);
  echoEl=mkEnt('echo');youEl=mkEnt('you');
}
function setPos(el,c){const tx=px(c[0])+'px',ty=px(c[1])+'px';el.style.setProperty('--tx',tx);el.style.setProperty('--ty',ty);el.style.transform=`translate(${tx},${ty})`;}
function render(){
  setPos(youEl,state.b);setPos(echoEl,state.c);
  const held=state.c[0]===L.plate[0]&&state.c[1]===L.plate[1];
  plateEl.classList.toggle('held',held);
  document.getElementById('moves').textContent=moves;
  const q0=document.getElementById('q0'),q1=document.getElementById('q1');
  q0.textContent=state.q[0]?ARROW[state.q[0]]:'·';q0.className='q'+(state.q[0]?'':' empty');
  q1.textContent=state.q[1]?ARROW[state.q[1]]:'·';q1.className='q'+(state.q[1]?'':' empty');
}
function load(seed,no){
  L=gen(seed);state={b:L.bs.slice(),c:L.cs.slice(),q:[null,null]};hist=[];moves=0;puzzleNo=no;
  document.getElementById('par').textContent=L.par;
  layout();build();render();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1400);}
function move(d){
  if(document.getElementById('ov').classList.contains('on'))return;
  const r=step(L.walls,state.b,state.c,state.q,d);
  if(r.collide){youEl.classList.add('shake');setTimeout(()=>youEl.classList.remove('shake'),320);toast("You and the echo can't overlap.");return;}
  hist.push({b:state.b.slice(),c:state.c.slice(),q:state.q.slice()});
  state.b=r.nb;state.c=r.nc;state.q=r.nq;moves++;
  render();
  if(r.nb[0]===L.exit[0]&&r.nb[1]===L.exit[1]&&r.nc[0]===L.plate[0]&&r.nc[1]===L.plate[1])win();
}
function undo(){if(!hist.length)return;const p=hist.pop();state.b=p.b;state.c=p.c;state.q=p.q;moves=Math.max(0,moves-1);render();}
function reset(){state={b:L.bs.slice(),c:L.cs.slice(),q:[null,null]};hist=[];moves=0;render();}
function win(){
  const ov=document.getElementById('ov');
  const delta=moves-L.par;
  document.getElementById('ovh').textContent=delta<=0?'Perfect sync.':'Synced.';
  document.getElementById('ovp').textContent=`Solved in ${moves} moves · par ${L.par}`;
  document.getElementById('ovs').textContent=delta<=0?'You matched the optimal route.':(delta+' over par. A tighter line exists.');
  ov.dataset.share=`Ditto #${puzzleNo} — ${moves} moves`+(delta<=0?' ⭐ par':'');
  setTimeout(()=>ov.classList.add('on'),260);
}
// input
document.querySelectorAll('.controls button').forEach(b=>b.addEventListener('click',()=>move(b.dataset.d)));
addEventListener('keydown',e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R'};if(m[e.key]){e.preventDefault();move(m[e.key]);}if(e.key==='z')undo();});
document.getElementById('undo').onclick=undo;
document.getElementById('reset').onclick=reset;
function newPuzzle(){load(Math.floor(Math.random()*1e9),'∞');document.getElementById('sub').textContent='Free play · your echo, 2 moves behind';document.getElementById('ov').classList.remove('on');}
document.getElementById('next').onclick=newPuzzle;
document.getElementById('ovnext').onclick=newPuzzle;
// swipe
let sx,sy;
boardEl.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
boardEl.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<18&&Math.abs(dy)<18){sx=null;return;}if(Math.abs(dx)>Math.abs(dy))move(dx>0?'R':'L');else move(dy>0?'D':'U');sx=null;});
addEventListener('resize',()=>{layout();build();render();});
// start: daily
puzzleNo=dayNum();
load(puzzleNo*2654435761%2147483647+1,puzzleNo);
</script>
</body>
</html>

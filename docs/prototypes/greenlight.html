<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Green Light</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#10130f; --panel:#181d15; --line:#2a3324;
    --ink:#eaf2e2; --mute:#8b9a7e;
    --go:#5dd672; --go-dim:#2f7a3d; --no:#e25b5b; --no-dim:#8f3030;
    --lit:#e9d54a; --off:#222a1c;
    --font:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --disp:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  }
  html,body{height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%,#1a2016 0%,var(--bg) 70%);color:var(--ink);
    font-family:var(--disp);display:flex;flex-direction:column;align-items:center;overflow:hidden;
    padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));user-select:none}
  .top{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .brand{font-weight:800;letter-spacing:1.5px;font-size:1.2rem;display:flex;align-items:center;gap:9px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--go);box-shadow:0 0 12px var(--go)}
  .sub{color:var(--mute);font-size:.72rem;margin-top:-2px;letter-spacing:.3px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 11px;font-size:.78rem;font-weight:700;font-family:var(--font)}
  .chip b{color:var(--lit)}
  .stage{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;margin-top:8px}
  .label{color:var(--mute);font-size:.72rem;letter-spacing:1px;text-transform:uppercase;margin:14px 0 8px;align-self:flex-start}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;aspect-ratio:1}
  .gc{border-radius:12px;background:var(--off);border:1px solid var(--line);cursor:pointer;transition:transform .08s,background .12s,box-shadow .12s}
  .gc.lit{background:radial-gradient(circle at 50% 40%,#fdf08a,var(--lit));box-shadow:0 0 16px -2px var(--lit),inset 0 1px 0 #fff7c4}
  .gc:active{transform:scale(.93)}
  .gc.ro{cursor:default}.gc.ro:active{transform:none}
  .test{margin-top:16px;width:100%;border:none;border-radius:14px;padding:16px;font-family:var(--disp);font-weight:800;
    font-size:1.05rem;letter-spacing:1px;color:#06210d;background:linear-gradient(135deg,var(--go),var(--go-dim));cursor:pointer;
    box-shadow:0 10px 24px -8px var(--go-dim);transition:transform .08s}
  .test:active{transform:scale(.97)}
  .verdict{height:30px;margin-top:10px;font-weight:800;letter-spacing:2px;font-size:1rem;opacity:0;transition:opacity .15s}
  .verdict.show{opacity:1}
  .verdict.go{color:var(--go)} .verdict.no{color:var(--no)}
  .history{width:100%;max-width:360px;margin-top:14px}
  .history .label{margin:0 0 8px}
  .hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .hitem{flex:0 0 auto}
  .mini{display:grid;grid-template-columns:repeat(4,8px);grid-template-rows:repeat(4,8px);gap:2px;padding:5px;border-radius:8px;border:2px solid var(--line);background:var(--panel)}
  .mini.go{border-color:var(--go)} .mini.no{border-color:var(--no)}
  .mc{width:8px;height:8px;border-radius:2px;background:var(--off)}
  .mc.lit{background:var(--lit)}
  .row{display:flex;gap:10px;margin-top:16px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:700;font-size:.85rem;
    border-radius:12px;padding:12px 18px;cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.96)}
  .btn.go{background:linear-gradient(135deg,var(--go),var(--go-dim));color:#06210d;border:none}
  .btn.ghost{background:transparent}
  .hint{color:var(--mute);font-size:.73rem;text-align:center;max-width:320px;margin-top:14px;line-height:1.5}
  /* guess mode */
  .guesses{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:6px}
  .guess{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center}
  .guess .gg{display:grid;grid-template-columns:repeat(4,16px);grid-template-rows:repeat(4,16px);gap:3px}
  .gg .c{width:16px;height:16px;border-radius:3px;background:var(--off)}
  .gg .c.lit{background:var(--lit)}
  .verdpick{display:flex;gap:8px;margin-left:auto}
  .pick{border:1.5px solid var(--line);background:transparent;color:var(--mute);border-radius:10px;padding:9px 12px;font-weight:800;font-family:inherit;cursor:pointer;font-size:.8rem}
  .pick.sel.go{background:var(--go);color:#06210d;border-color:var(--go)}
  .pick.sel.no{background:var(--no);color:#fff;border-color:var(--no)}
  .overlay{position:fixed;inset:0;background:rgba(8,11,7,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
  .overlay.on{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 24px;text-align:center;max-width:360px;width:100%}
  .card h2{font-size:1.5rem;letter-spacing:1px}
  .card .rule{color:var(--lit);font-weight:800;margin:12px 0;font-size:1.05rem;line-height:1.4}
  .card p{color:var(--mute);font-size:.85rem;margin-bottom:16px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="brand"><span class="dot" id="dot"></span>GREEN LIGHT</div>
      <div class="sub" id="sub">Daily · find the board's secret rule</div>
    </div>
    <div class="chip">Tests <b id="tests">0</b></div>
  </div>

  <!-- LAB -->
  <div class="stage" id="lab">
    <div class="label">Build a pattern, then test it</div>
    <div class="grid4" id="board"></div>
    <button class="test" id="testBtn">TEST</button>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="history" id="histWrap" style="display:none">
    <div class="label">Experiments</div>
    <div class="hscroll" id="hscroll"></div>
  </div>

  <div class="row" id="labRow">
    <button class="btn ghost" id="clearBtn">Clear</button>
    <button class="btn go" id="guessBtn">I know the rule →</button>
  </div>
  <div class="hint" id="labHint">Toggle cells, hit <b style="color:var(--go)">TEST</b>: green means your pattern obeys the hidden rule, red means it breaks it. Deduce the rule in as few tests as you can.</div>

  <!-- GUESS -->
  <div class="stage" id="guess" style="display:none">
    <div class="label">Mark each board: does it obey the rule?</div>
    <div class="guesses" id="guesses"></div>
    <div class="row">
      <button class="btn ghost" id="backBtn">← Keep testing</button>
      <button class="btn go" id="submitBtn">Submit</button>
    </div>
  </div>

  <div class="overlay" id="ov">
    <div class="card">
      <h2 id="ovh">Cracked.</h2>
      <div class="rule" id="ovrule"></div>
      <p id="ovs"></p>
      <button class="btn go" id="ovnext" style="width:100%">New rule →</button>
    </div>
  </div>

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RULES=[
 {name:'Exactly 6 cells are lit.',fn:g=>g.filter(x=>x).length===6},
 {name:'Exactly one cell is lit in every row.',fn:g=>{for(let r=0;r<4;r++){let c=0;for(let k=0;k<4;k++)if(g[r*4+k])c++;if(c!==1)return false;}return true;}},
 {name:'The pattern is mirror-symmetric: the left half mirrors the right.',fn:g=>{for(let r=0;r<4;r++)for(let c=0;c<2;c++)if(g[r*4+c]!==g[r*4+(3-c)])return false;return true;}},
 {name:'No two lit cells touch side-by-side or top-to-bottom.',fn:g=>{for(let r=0;r<4;r++)for(let c=0;c<4;c++){if(!g[r*4+c])continue;if(c<3&&g[r*4+c+1])return false;if(r<3&&g[(r+1)*4+c])return false;}return true;}},
 {name:'Every column has at least one lit cell.',fn:g=>{for(let c=0;c<4;c++){let any=false;for(let r=0;r<4;r++)if(g[r*4+c])any=true;if(!any)return false;}return true;}},
 {name:'An even number of cells are lit (at least two).',fn:g=>{const n=g.filter(x=>x).length;return n>=2&&n%2===0;}},
 {name:'The top half has more lit cells than the bottom half.',fn:g=>{let t=0,b=0;for(let i=0;i<16;i++)if(g[i])(i<8?t++:b++);return t>b;}},
 {name:'All lit cells form one connected group.',fn:g=>{const on=[];for(let i=0;i<16;i++)if(g[i])on.push(i);if(!on.length)return false;const seen=new Set([on[0]]),st=[on[0]];while(st.length){const i=st.pop(),r=(i/4|0),c=i%4;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{if(nr<0||nc<0||nr>=4||nc>=4)return;const j=nr*4+nc;if(g[j]&&!seen.has(j)){seen.add(j);st.push(j);}});}return seen.size===on.length;}},
];
function mysteryBoards(rule,rnd){const out=[];let p=0,f=0,guard=0;
  while(out.length<3&&guard++<6000){const g=[];for(let i=0;i<16;i++)g.push(rnd()<0.4);const res=rule.fn(g);
    if(res&&p<2){out.push({g,res});p++;}else if(!res&&f<2){out.push({g,res});f++;}}
  return(p>=1&&f>=1)?out:null;}

let rule,board,tests,history,dayNo,mystery,picks;
function dayNum(){return Math.floor((Date.now()-Date.UTC(2026,0,1))/864e5);}
const boardEl=document.getElementById('board');
function buildBoard(){boardEl.innerHTML='';board=new Array(16).fill(false);
  for(let i=0;i<16;i++){const c=document.createElement('div');c.className='gc';c.onclick=()=>{board[i]=!board[i];c.classList.toggle('lit',board[i]);clearVerdict();};boardEl.appendChild(c);}}
function clearVerdict(){document.getElementById('verdict').classList.remove('show');}
function loadRule(seed,no){
  const rnd=mulberry32(seed);rule=RULES[Math.floor(rnd()*RULES.length)];dayNo=no;
  tests=0;history=[];document.getElementById('tests').textContent=0;
  document.getElementById('hscroll').innerHTML='';document.getElementById('histWrap').style.display='none';
  buildBoard();clearVerdict();showLab();
}
function doTest(){
  const res=rule.fn(board);tests++;document.getElementById('tests').textContent=tests;
  const v=document.getElementById('verdict');v.textContent=res?'● GREEN — obeys':'● RED — breaks';
  v.className='verdict show '+(res?'go':'no');
  const dot=document.getElementById('dot');dot.style.background=res?'var(--go)':'var(--no)';dot.style.boxShadow='0 0 12px '+(res?'var(--go)':'var(--no)');
  // history
  document.getElementById('histWrap').style.display='block';
  const item=document.createElement('div');item.className='hitem';
  const mini=document.createElement('div');mini.className='mini '+(res?'go':'no');
  for(let i=0;i<16;i++){const mc=document.createElement('div');mc.className='mc'+(board[i]?' lit':'');mini.appendChild(mc);}
  item.appendChild(mini);document.getElementById('hscroll').prepend(item);
}
function showLab(){document.getElementById('lab').style.display='flex';document.getElementById('guess').style.display='none';
  document.getElementById('labRow').style.display='flex';document.getElementById('labHint').style.display='block';
  if(history)document.getElementById('histWrap').style.display=document.getElementById('hscroll').children.length?'block':'none';}
function showGuess(){
  const rnd=mulberry32((dayNo*7919+tests*13+1)>>>0);
  mystery=mysteryBoards(rule,rnd)||mysteryBoards(rule,mulberry32(dayNo+999));
  // shuffle order
  mystery.sort(()=>rnd()-0.5);picks=[null,null,null];
  const wrap=document.getElementById('guesses');wrap.innerHTML='';
  mystery.forEach((m,idx)=>{
    const row=document.createElement('div');row.className='guess';
    const gg=document.createElement('div');gg.className='gg';
    for(let i=0;i<16;i++){const c=document.createElement('div');c.className='c'+(m.g[i]?' lit':'');gg.appendChild(c);}
    const vp=document.createElement('div');vp.className='verdpick';
    const yes=document.createElement('button');yes.className='pick';yes.textContent='Obeys';
    const no=document.createElement('button');no.className='pick';no.textContent='Breaks';
    yes.onclick=()=>{picks[idx]=true;yes.className='pick sel go';no.className='pick';};
    no.onclick=()=>{picks[idx]=false;no.className='pick sel no';yes.className='pick';};
    vp.append(yes,no);row.append(gg,vp);wrap.appendChild(row);
  });
  document.getElementById('lab').style.display='none';document.getElementById('labRow').style.display='none';
  document.getElementById('labHint').style.display='none';document.getElementById('histWrap').style.display='none';
  document.getElementById('guess').style.display='flex';
}
function submit(){
  if(picks.some(p=>p===null)){flash();return;}
  const correct=mystery.every((m,i)=>picks[i]===m.res);
  if(correct){
    const ov=document.getElementById('ov');
    document.getElementById('ovrule').textContent=rule.name;
    document.getElementById('ovs').textContent=`Cracked in ${tests} test${tests===1?'':'s'}.`;
    ov.dataset.share=`Green Light #${dayNo} — cracked in ${tests} 🟢`;
    ov.classList.add('on');
  }else{
    const n=mystery.filter((m,i)=>picks[i]===m.res).length;
    showLab();
    const v=document.getElementById('verdict');v.textContent=`${n}/3 right — keep testing`;v.className='verdict show no';
  }
}
function flash(){const b=document.getElementById('submitBtn');b.animate?b.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260}):0;}
document.getElementById('testBtn').onclick=doTest;
document.getElementById('clearBtn').onclick=()=>{buildBoard();clearVerdict();};
document.getElementById('guessBtn').onclick=showGuess;
document.getElementById('backBtn').onclick=showLab;
document.getElementById('submitBtn').onclick=submit;
document.getElementById('ovnext').onclick=()=>{document.getElementById('ov').classList.remove('on');loadRule(Math.floor(Math.random()*1e9),dayNo);document.getElementById('sub').textContent='Free play · find the secret rule';};
// start daily
const d=dayNum();loadRule((d*2246822519)>>>0,d);
</script>
</body>
</html>

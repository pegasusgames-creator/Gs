<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Word Ladder</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #0a1f0a; color: #e8f5e9; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
:root { --accent: #66BB6A; --light: #A5D6A7; }
header { background: #1b3a1b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
header h1 { font-size: 1.3rem; color: var(--light); letter-spacing: 2px; }
.puzzle-header { background: #1b3a1b; padding: 10px 16px; display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--light); }
.ladder-area { flex: 1; overflow-y: auto; padding: 16px; }
.target-row { display: flex; justify-content: space-between; align-items: center; background: #0d2e0d; border-radius: 10px; padding: 10px 16px; margin-bottom: 12px; }
.target-word { font-size: 1.4rem; font-weight: 700; letter-spacing: 6px; }
.start-word { color: var(--light); }
.end-word { color: var(--accent); }
.arrow { color: #aaa; font-size: 1.2rem; }
.steps-list { display: flex; flex-direction: column; gap: 6px; }
.step { background: #1b3a1b; border: 2px solid #2a5a2a; border-radius: 10px; padding: 10px 16px; font-size: 1.3rem; letter-spacing: 6px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: space-between; }
.step.changed { border-color: var(--accent); }
.step.current { border-color: #fff; background: #0d2e0d; }
.step.error { border-color: #ef5350; animation: shake 0.3s; }
.step .diff-letter { color: var(--accent); }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.step-num { font-size: 0.75rem; color: #aaa; }
.input-area { background: #1b3a1b; border-top: 2px solid #2a5a2a; padding: 12px 16px; }
.word-editor { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.letter-cell { width: 44px; height: 50px; background: #0d2e0d; border: 2px solid #2a5a2a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.1s; }
.letter-cell.active { border-color: var(--accent); background: #1b4a1b; }
.keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-bottom: 10px; }
.key { background: #1b3a1b; border: 1px solid #2a5a2a; border-radius: 6px; padding: 10px 4px; text-align: center; font-size: 0.9rem; font-weight: 700; color: #e8f5e9; cursor: pointer; }
.key.btn-pressed { opacity: 0.6; transform: scale(0.9); }
.btn-row { display: flex; gap: 8px; }
.btn { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.15s; }
.btn.btn-pressed { opacity: 0.6; transform: scale(0.96); }
.btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--light); }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
.overlay.show { display: flex; }
.modal { background: #1b3a1b; border: 2px solid var(--accent); border-radius: 16px; padding: 24px; max-width: 320px; width: 90%; text-align: center; }
.modal h2 { color: var(--light); font-size: 1.4rem; margin-bottom: 8px; }
.big-num { font-size: 3rem; font-weight: 700; color: var(--accent); }
.solution-steps { text-align: left; margin: 12px 0; font-size: 0.9rem; color: #aaa; max-height: 200px; overflow-y: auto; }
.sol-step { padding: 4px 0; letter-spacing: 4px; }
.sol-step.ok { color: var(--light); }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:0.65rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:9999;letter-spacing:0.5px">Remove Ads</button>
<header>
  <h1>WORD LADDER</h1>
  <span style="color:var(--light);font-size:0.9rem">Puzzle <span id="puzzle-num">1</span>/50</span>
</header>
<div class="puzzle-header">
  <span>Steps: <strong id="step-count">0</strong></span>
  <span>Par: <strong id="par-count">0</strong></span>
</div>

<div class="ladder-area">
  <div class="target-row">
    <span class="target-word start-word" id="start-word">COLD</span>
    <span class="arrow">→</span>
    <span class="target-word end-word" id="end-word">WARM</span>
  </div>
  <div class="steps-list" id="steps-list"></div>
</div>

<div class="input-area">
  <div class="word-editor" id="word-editor"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="btn-row">
    <button class="btn btn-outline" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="undoStep()">Undo</button>
    <button class="btn btn-outline" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="showSolution()">Solution</button>
    <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="submitStep()">Submit</button>
  </div>
</div>

<div class="overlay" id="win-overlay">
  <div class="modal">
    <h2>Puzzle Solved! 🎉</h2>
    <div class="big-num" id="win-steps">0</div>
    <p style="color:#aaa;margin:4px 0 12px">steps (par: <span id="win-par"></span>)</p>
    <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="nextPuzzle()">Next Puzzle ▶</button>
  </div>
</div>

<div class="overlay" id="sol-overlay">
  <div class="modal">
    <h2>Solution</h2>
    <div class="solution-steps" id="solution-steps"></div>
    <button class="btn btn-outline" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="closeSolution()">Close</button>
    <button class="btn" style="margin-top:8px" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="closeSolution();nextPuzzle()">Next Puzzle</button>
  </div>
</div>

const DICT4 = new Set("able,acid,aged,back,bake,bald,band,bank,bare,barn,base,bath,bear,beat,beer,belt,bent,bird,bite,blow,blue,body,bold,bolt,bone,book,bore,bout,bran,brow,cage,cake,calm,camp,cane,card,care,cart,cave,chin,chip,clam,clay,clip,club,coal,coat,code,coil,coin,cola,comb,cone,cope,cord,core,corn,crab,crew,crop,crow,cube,curl,cute,dare,dart,dash,deal,dean,debt,deck,deed,deny,desk,dial,dice,dime,dirt,disk,dive,doll,dome,dove,drag,draw,drop,drum,duck,dull,dump,dusk,dust,duty,earn,ease,east,edge,emit,face,fail,fall,fare,fast,fate,fear,feat,feel,feet,fell,fill,find,fire,fish,fist,flag,flaw,flea,flee,flew,flex,flip,foam,fold,fond,ford,fork,form,fort,foul,four,frog,fuel,fume,fuse,gate,gear,germ,gist,glee,glob,glue,goal,goes,gold,gore,gown,grab,gram,grin,grip,grit,grow,gust,guts,hack,hail,half,hall,hand,hard,harm,hash,haze,head,hear,heap,heat,heel,helm,herb,herd,high,hike,hill,hire,hive,hold,hole,home,hope,horn,hose,host,hour,hull,hump,huge,hung,hunk,hymn,idle,iron,jerk,jest,jolt,jump,just,keen,kill,kind,knew,know,lace,lame,lamp,land,lane,lark,lash,last,late,lava,lawn,leaf,lean,left,lend,lens,levy,lick,life,limp,line,lint,lion,lips,list,live,load,long,look,lore,lost,loud,lump,lure,lurk,lust,made,main,make,mane,mark,mass,mask,mast,mean,meet,melt,mesh,mild,milk,mill,mind,mine,miss,mist,mock,mold,mole,monk,moon,more,moss,moth,move,much,muse,mute,myth,nail,name,neck,need,nest,news,nick,node,norm,noun,nude,numb,oath,obey,omen,once,open,oven,pace,pack,pact,pain,palm,pang,past,path,pave,peak,peat,peel,peep,peer,pest,pier,pike,pile,pill,pine,pink,pint,pipe,pity,plan,play,plea,plop,plow,ploy,plug,plum,poem,poet,pole,poll,pond,pore,port,pose,post,pout,prep,prey,prim,prod,prop,puck,puff,pump,pure,push,pull,race,rage,rain,ramp,rank,rant,rash,rasp,rate,rave,read,real,reed,reef,reel,rest,rice,ride,rife,rift,rind,ring,rink,riot,ripe,rise,rite,road,roam,roar,robe,rock,rode,role,roll,roof,room,root,rope,rose,rout,rove,ruby,rude,ruin,rule,ruse,rust,safe,sage,salt,same,sane,save,seam,seep,self,sell,send,shed,shin,ship,show,side,sigh,sign,silk,sill,silo,silt,sing,sink,sire,size,skin,slab,slap,slay,sled,slim,slip,slit,slop,slot,slug,slum,slur,slow,snap,snob,soak,soar,sock,soda,soft,soil,sole,some,song,soon,sore,sort,soul,sown,span,spar,spin,spit,spot,star,step,stew,stir,stop,stub,stud,stun,suck,suit,surf,swap,swat,sway,swim,tack,tail,take,talk,tall,tame,tang,task,taut,teal,teen,tell,tend,tent,test,toad,toil,tomb,tone,tool,tops,tore,tort,toss,tour,town,trap,tray,trek,trim,trio,trip,trod,trot,tuba,tuft,turf,turn,twig,twin,type,ugly,unit,vain,vale,vane,veer,veil,vend,verb,vest,veto,vial,vice,vine,vise,void,vole,volt,vote,waif,wake,walk,wane,ward,ware,warm,warn,wary,wasp,wash,wave,wear,weld,welt,well,went,west,wide,will,wilt,wind,wine,wing,wish,wisp,wood,word,work,worn,wrap,yard,year,yore,zeal,zinc,zero,zone,zoom,able,acid,also,arch,area,army,arts,aunt,auto,baby,bike,bill,bite,bold,bolt,bone,boom,boot,bore,boss,both,buck,bulk,bull,bunk".split(','));

function isValidWord(w) {
  const l = w.toLowerCase();
  return DICT3.has(l) || DICT4.has(l);
}

function differsBy1(a, b) {
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diff++;
  return diff === 1;
}

let currentPuz = 0, steps = [], editWord = [], activeCell = 0, gameOver = false;

function loadPuzzle(idx) {
  currentPuz = idx % PUZZLES.length;
  const puz = PUZZLES[currentPuz];
  steps = [puz.start];
  editWord = puz.start.split('');
  activeCell = 0; gameOver = false;
  document.getElementById('start-word').textContent = puz.start;
  document.getElementById('end-word').textContent = puz.end;
  document.getElementById('puzzle-num').textContent = currentPuz + 1;
  document.getElementById('par-count').textContent = puz.solution.length - 1;
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('sol-overlay').classList.remove('show');
  renderSteps();
  renderEditor();
  buildKeyboard();
}

function renderSteps() {
  const list = document.getElementById('steps-list');
  list.innerHTML = '';
  const start = PUZZLES[currentPuz].start;
  steps.forEach((word, i) => {
    const row = document.createElement('div');
    row.className = 'step' + (i > 0 ? ' changed' : '');
    const prev = steps[i - 1] || '';
    let html = '';
    for (let j = 0; j < word.length; j++) {
      if (prev && word[j] !== prev[j]) html += `<span class="diff-letter">${word[j]}</span>`;
      else html += word[j];
    }
    row.innerHTML = `<span>${html}</span><span class="step-num">${i === 0 ? 'Start' : 'Step ' + i}</span>`;
    list.appendChild(row);
  });
  document.getElementById('step-count').textContent = steps.length - 1;
  list.scrollTop = list.scrollHeight;
}

function renderEditor() {
  const editor = document.getElementById('word-editor');
  editor.innerHTML = '';
  editWord.forEach((l, i) => {
    const cell = document.createElement('div');
    cell.className = 'letter-cell' + (i === activeCell ? ' active' : '');
    cell.textContent = l;
    cell.addEventListener('click', () => { activeCell = i; renderEditor(); });
    editor.appendChild(cell);
  });
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
    const key = document.createElement('div');
    key.className = 'key';
    key.textContent = l;
    key.addEventListener('touchstart', e => { e.preventDefault(); key.classList.add('btn-pressed'); pressKey(l); });
    key.addEventListener('touchend', () => key.classList.remove('btn-pressed'));
    key.addEventListener('click', () => pressKey(l));
    kb.appendChild(key);
  });
}

function pressKey(l) {
  editWord[activeCell] = l;
  activeCell = Math.min(activeCell + 1, editWord.length - 1);
  renderEditor();
}

function submitStep() {
  if (gameOver) return;
  const puz = PUZZLES[currentPuz];
  const newWord = editWord.join('');
  const lastWord = steps[steps.length - 1];
  if (!differsBy1(newWord, lastWord)) {
    flashError(); return;
  }
  if (!isValidWord(newWord) && newWord !== puz.end) {
    flashError(); return;
  }
  steps.push(newWord);
  renderSteps();
  if (newWord === puz.end) {
    gameOver = true;
    document.getElementById('win-steps').textContent = steps.length - 1;
    document.getElementById('win-par').textContent = puz.solution.length - 1;
    setTimeout(() => document.getElementById('win-overlay').classList.add('show'), 500);
  } else {
    editWord = newWord.split('');
    activeCell = 0;
    renderEditor();
  }
}

function undoStep() {
  if (steps.length <= 1) return;
  steps.pop();
  editWord = steps[steps.length - 1].split('');
  activeCell = 0;
  renderSteps();
  renderEditor();
}

function flashError() {
  const list = document.getElementById('steps-list');
  const last = list.lastElementChild;
  if (last) { last.classList.add('error'); setTimeout(() => last.classList.remove('error'), 400); }
}

function showSolution() {
  const puz = PUZZLES[currentPuz];
  const sol = document.getElementById('solution-steps');
  sol.innerHTML = '';
  puz.solution.forEach((w, i) => {
    const d = document.createElement('div');
    d.className = 'sol-step' + (i > 0 ? ' ok' : '');
    d.textContent = (i === 0 ? 'Start: ' : 'Step ' + i + ': ') + w;
    sol.appendChild(d);
  });
  document.getElementById('sol-overlay').classList.add('show');
}

function closeSolution() { document.getElementById('sol-overlay').classList.remove('show'); }
function nextPuzzle() { loadPuzzle(currentPuz + 1); }

loadPuzzle(0);
window.onPurchaseComplete = function(sku) { console.log('Purchase:', sku); };

// ── AppLovin MAX / IAP bridge ──────────────────────────────────────────
var _adsRemoved = false;
var _interstitialCount = 0;

function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};

// Restore remove-ads state on load
if (window.Android) {
  try { if (Android.isPurchased && Android.isPurchased('remove_ads')) {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
  }} catch(e) {}
}

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aspect Ratio</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#78909C; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
/* Input grid */
.input-grid { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-bottom:10px; }
.input-grid input { padding:12px; border-radius:10px; border:none; background:var(--card); color:var(--text); font-size:1rem; text-align:center; width:100%; }
.input-grid span { text-align:center; color:var(--muted); font-size:1.2rem; }
.btn-calc { background:var(--accent); border:none; border-radius:10px; color:#fff; font-size:0.95rem; font-weight:700; padding:11px; cursor:pointer; width:100%; }
/* Result */
#result-area { text-align:center; padding:12px 0; }
#ratio-big { font-size:3rem; font-weight:700; color:var(--accent); letter-spacing:2px; }
#ratio-name { font-size:0.9rem; color:var(--muted); margin-top:4px; }
/* Scale section */
.scale-row { display:flex; gap:8px; align-items:center; margin-bottom:7px; }
.scale-row label { font-size:0.8rem; color:var(--muted); width:56px; flex-shrink:0; }
.scale-row input { flex:1; padding:9px 12px; border-radius:9px; border:none; background:var(--card); color:var(--text); font-size:0.9rem; text-align:center; }
.scale-row .result-val { flex:1; padding:9px 12px; border-radius:9px; background:rgba(120,144,156,0.1); text-align:center; font-size:0.9rem; color:var(--accent); font-weight:600; }
/* Fit calculator */
.fit-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.fit-grid input { padding:10px; border-radius:9px; border:none; background:var(--card); color:var(--text); font-size:0.88rem; text-align:center; }
.fit-grid label { font-size:0.75rem; color:var(--muted); display:block; margin-bottom:3px; }
#fit-result { background:var(--card); border-radius:10px; padding:10px 12px; font-size:0.85rem; color:var(--muted); min-height:36px; }
#fit-result strong { color:var(--accent); }
/* Known formats */
.format-row { display:flex; justify-content:space-between; padding:6px 8px; border-radius:7px; font-size:0.8rem; margin-bottom:3px; cursor:pointer; }
.format-row:hover, .format-row:active { background:var(--card); }
.fr-name { color:var(--muted); }
.fr-ratio { color:var(--accent); font-weight:600; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Aspect <span>Ratio</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Calculate Ratio</div>
      <div class="input-grid">
        <input type="number" id="in-w" placeholder="Width" min="1" value="">
        <span>×</span>
        <input type="number" id="in-h" placeholder="Height" min="1" value="">
      </div>
      <button class="btn-calc" onclick="calculate()">Calculate</button>
      <div id="result-area" style="display:none;">
        <div id="ratio-big">16:9</div>
        <div id="ratio-name"></div>
      </div>
    </div>

    <div class="card" id="scale-card" style="display:none;">
      <div class="card-title">Scale to Size</div>
      <div class="scale-row">
        <label>Width →</label>
        <input type="number" id="sc-w" placeholder="e.g. 1920" oninput="scaleFromW()">
        <div class="result-val" id="sc-h-out">—</div>
      </div>
      <div class="scale-row">
        <label>Height →</label>
        <input type="number" id="sc-h" placeholder="e.g. 1080" oninput="scaleFromH()">
        <div class="result-val" id="sc-w-out">—</div>
      </div>
    </div>

    <div class="card" id="fit-card" style="display:none;">
      <div class="card-title">Resize to Fit</div>
      <div class="fit-grid">
        <div><label>Max Width</label><input type="number" id="fit-mw" placeholder="1920"></div>
        <div><label>Max Height</label><input type="number" id="fit-mh" placeholder="1080"></div>
      </div>
      <button class="btn-calc" onclick="calcFit()" style="margin-bottom:8px;">Fit</button>
      <div id="fit-result">Enter max dimensions above.</div>
    </div>

    <div class="card">
      <div class="card-title">Common Formats — tap to load</div>
      <div id="formats-list"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var FORMATS=[
  {name:'HD / 1080p / 720p',   w:16,h:9},
  {name:'4K UHD',              w:16,h:9},
  {name:'Standard SD',         w:4, h:3},
  {name:'Widescreen Cinema',   w:21,h:9},
  {name:'Ultra-wide Monitor',  w:32,h:9},
  {name:'Instagram Square',    w:1, h:1},
  {name:'Instagram Portrait',  w:4, h:5},
  {name:'Instagram Story',     w:9, h:16},
  {name:'Twitter/X Card',      w:16,h:9},
  {name:'Classic Film (35mm)', w:3, h:2},
  {name:'Medium Format',       w:6, h:7},
  {name:'IMAX',                w:4, h:3},
];

var KNOWN={};
FORMATS.forEach(function(f){KNOWN[f.w+':'+f.h]=f.name;});

var S = { useCount:0, removeAds:false, w:0, h:0, gcdW:1, gcdH:1 };

function gcd(a,b){return b===0?a:gcd(b,a%b);}

function loadFormat(w,h){
  document.getElementById('in-w').value=w;
  document.getElementById('in-h').value=h;
  calculate();
}

function calculate(){
  var w=parseInt(document.getElementById('in-w').value)||0;
  var h=parseInt(document.getElementById('in-h').value)||0;
  if(!w||!h){alert('Enter width and height');return;}
  S.w=w;S.h=h;
  var g=gcd(w,h);
  S.gcdW=w/g; S.gcdH=h/g;
  var ratioStr=S.gcdW+':'+S.gcdH;
  var known=KNOWN[ratioStr]||('');
  document.getElementById('ratio-big').textContent=ratioStr;
  document.getElementById('ratio-name').textContent=known||('Original: '+w+'×'+h+' ('+((w/h).toFixed(3))+')');
  document.getElementById('result-area').style.display='block';
  document.getElementById('scale-card').style.display='block';
  document.getElementById('fit-card').style.display='block';
  maybeInterstitial();
}

function scaleFromW(){
  var sw=parseInt(document.getElementById('sc-w').value)||0;
  if(!sw||!S.gcdH){document.getElementById('sc-h-out').textContent='—';return;}
  var sh=Math.round(sw*S.gcdH/S.gcdW);
  document.getElementById('sc-h-out').textContent=sh+' px';
}

function scaleFromH(){
  var sh=parseInt(document.getElementById('sc-h').value)||0;
  if(!sh||!S.gcdW){document.getElementById('sc-w-out').textContent='—';return;}
  var sw=Math.round(sh*S.gcdW/S.gcdH);
  document.getElementById('sc-w-out').textContent=sw+' px';
}

function calcFit(){
  if(!S.w||!S.h){alert('Calculate ratio first');return;}
  var mw=parseInt(document.getElementById('fit-mw').value)||0;
  var mh=parseInt(document.getElementById('fit-mh').value)||0;
  if(!mw&&!mh){alert('Enter max dimensions');return;}
  var fw,fh;
  if(mw&&mh){
    // fit inside box
    var scale=Math.min(mw/S.w,mh/S.h);
    fw=Math.round(S.w*scale);fh=Math.round(S.h*scale);
  } else if(mw){
    fw=mw;fh=Math.round(mw*S.h/S.w);
  } else {
    fh=mh;fw=Math.round(mh*S.w/S.h);
  }
  document.getElementById('fit-result').innerHTML=
    '<strong>'+fw+'×'+fh+'</strong> (scale: '+((fw/S.w*100).toFixed(1))+'%)';
}

function renderFormats(){
  document.getElementById('formats-list').innerHTML=FORMATS.map(function(f){
    return '<div class="format-row" onclick="loadFormat('+f.w+','+f.h+')">'+
      '<span class="fr-name">'+f.name+'</span><span class="fr-ratio">'+f.w+':'+f.h+'</span></div>';
  }).join('');
}

renderFormats();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

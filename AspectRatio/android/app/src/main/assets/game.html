/* The embedded font carries Latin-1 only; scripts it lacks use the system face for whole words (Turkish too, so ğ/ş never mix faces). */
html[lang^="tr"]{--font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:2px;min-height:var(--appbar-h);padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;padding-inline-start:16px;background:var(--bg)}
.appbar.has-back{padding-inline-start:4px}
.ab-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ab-title{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sub{font-size:.82rem;font-weight:600;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:3rem;height:3rem;min-width:48px;min-height:48px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-grid;place-items:center;padding:0;transition:background .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.tint{color:var(--accent)}
[dir="rtl"] .flip{transform:scaleX(-1)}
#view:focus,.sheet:focus,.dialog:focus{outline:none}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:auto}
.page{max-width:760px;margin:0 auto;padding:4px 16px 28px}
/* Bottom nav = the utility 'footer': symmetric padding + safe-area inset + 6px buffer above
   the native banner (the banner lives outside the WebView, below it). */
.nav{flex:0 0 auto;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding:clamp(2px,.6vh,6px) 8px calc(clamp(2px,.6vh,6px) + env(safe-area-inset-bottom,0px) + 6px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav-btn{flex:1 1 0;min-width:0;min-height:var(--nav-h);border:0;background:transparent;color:var(--text-mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;padding:6px 2px}
.nav-btn .pill{display:grid;place-items:center;width:3.6rem;height:2rem;border-radius:1rem;transition:background .2s,color .2s}
.nav-btn[aria-current="page"]{color:var(--text)}
.nav-btn[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.nav-btn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cards, lists, rows */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card+.card,.group+.group{margin-top:14px}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.sec-h:first-child{margin-top:10px}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:3.5rem;padding:10px 16px;border:0;background:transparent;text-align:start;color:var(--text);font-size:1rem}
.group .row+.row,.group .row+.row-x,.group .row-x+.row{border-top:1px solid var(--border)}
button.row:active{background:var(--surface-2)}
.row .ri{width:2.25rem;height:2.25rem;border-radius:11px;display:grid;place-items:center;background:var(--menu-tile-bg);color:var(--menu-tile-fg);border:1px solid var(--menu-tile-border);flex:none}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rl{font-weight:650;overflow-wrap:break-word}
.row .rs{font-size:.84rem;color:var(--text-mute);overflow-wrap:break-word}
.row select.inp{width:42%;max-width:240px;min-height:2.75rem;flex:none;padding-inline:12px}
.row .rv{color:var(--text-mute);font-weight:650;font-size:.92rem;flex:none;max-width:45%;text-align:end}
.row .chev{color:var(--text-faint)}
.row-x{padding:12px 16px}
.row.danger,.row.danger .ri{color:var(--danger)}
.row.danger .ri{background:transparent;border:1.5px solid currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:transparent;color:var(--success);border:1.5px solid currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;min-width:48px;padding:0 20px;border-radius:14px;border:0;font-weight:750;font-size:1rem;line-height:1.15;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--g-play);color:var(--on-accent);box-shadow:0 6px 18px -6px var(--accent)}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-neutral{background:var(--btn-neutral-bg);color:var(--text)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}

/* form controls */
.field{display:block;margin:0 0 16px}
.field>.fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.inp{width:100%;min-height:3rem;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:1rem}
.inp::placeholder{color:var(--text-faint)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:6.5rem;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface-2);width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:2.75rem;border:0;border-radius:11px;background:transparent;color:var(--text-mute);font-weight:750;font-size:.88rem;line-height:1.15;padding:4px;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.switch{position:relative;flex:none;width:3.25rem;height:2rem;min-width:52px;border-radius:1rem;border:0;background:var(--border-strong);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(2rem - 6px);height:calc(2rem - 6px);border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(1.25rem)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-1.25rem)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:3rem;height:3rem;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center}
.sw i{width:2.1rem;height:2.1rem;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--text)}
.sw .lk{position:absolute;inset-inline-end:2px;bottom:2px;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.stepper button{width:2.75rem;height:2.75rem;min-width:44px;border-radius:11px;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper output{min-width:2.6rem;text-align:center;font-weight:800;font-size:1.15rem}

/* layers: sheets, dialogs, onboarding, toast */
.layer{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center}
.layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;border:0;padding:0;width:100%}
.layer.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.in .sheet{transform:none}
.sheet.full{height:calc(100% - 24px)}
.sheet-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0;padding-inline-start:20px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:1.2rem;font-weight:800;min-width:0}
.grab{position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px 20px 16px;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1 1 140px}
.layer.center{align-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:400px;background:var(--surface);color:var(--text);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:22px 20px 16px;transform:scale(.94);opacity:0;transition:transform .2s,opacity .2s}
.layer.in .dialog{transform:none;opacity:1}
.dialog h2{margin:0 0 8px;font-size:1.2rem;font-weight:800}
.dialog p{margin:0 0 18px;color:var(--text-mute)}
.dialog .btn-row{justify-content:flex-end}
.dialog .btn-row .btn{flex:0 1 auto}
#toast{position:fixed;left:50%;bottom:calc(var(--toast-b,16px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);z-index:var(--z-critical);width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;padding-inline:18px 8px;min-height:3.25rem;border-radius:16px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:650;font-size:.95rem}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .tm{flex:1;min-width:0;padding:6px 0}
#toast .ta{border:0;background:transparent;color:var(--bg);font-weight:850;min-height:44px;padding:0 14px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
.onb{position:fixed;inset:0;z-index:var(--z-tutorial);background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.onb-top{display:flex;justify-content:flex-end;padding:0 8px}
.onb-track{flex:1;display:flex;overflow:hidden;touch-action:pan-y}
.onb-card{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.onb-art{width:min(68vw,260px);height:min(68vw,260px);margin-bottom:28px}
.onb-art svg{width:100%;height:100%}
.onb h2{margin:0 0 10px;font-size:1.6rem;font-weight:850;letter-spacing:-.015em;max-width:440px}
.onb p{margin:0;color:var(--text-mute);font-size:1.05rem;max-width:400px}
.onb-foot{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border-strong);transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--accent)}
.onb-foot .btn{width:min(100%,420px)}
.empty{text-align:center;padding:28px 18px 8px}
.empty .ea{width:132px;height:132px;margin:0 auto 14px}
.empty h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.empty p{margin:0 auto 18px;color:var(--text-mute);max-width:360px}
.pro-hero{text-align:center;padding:2px 0 8px}
.pro-hero .em{width:84px;height:84px;margin:0 auto 10px}
.pro-hero h3{margin:0;font-size:1.4rem;font-weight:850}
.pro-hero p{margin:6px 0 0;color:var(--text-mute)}
.feat{list-style:none;margin:14px 0 6px;padding:0}
.feat li{display:flex;align-items:center;gap:12px;padding:9px 2px;font-weight:650}
.feat li .ri{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fine{font-size:.82rem;color:var(--text-mute);text-align:center;margin:10px 0 0}
.about-foot{text-align:center;color:var(--text-mute);font-size:.82rem;margin:22px 0 4px}
.lock-chip{display:inline-flex;align-items:center;gap:4px}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (min-width:600px){html{font-size:calc(17px * var(--fs))}.page{padding:8px 24px 32px}.appbar{padding-inline:20px 12px}.sheet-body,.sheet-foot{padding-inline:28px}}
@media (min-width:900px){html{font-size:calc(18px * var(--fs))}:root{--appbar-h:4rem}.ab-title{font-size:1.5rem}}

/*@@REGION TOOL_CSS*/
/* Aspect Ratio Calculator tool styles. Tokens only; logical properties for RTL. */
.pv-card{padding:14px 14px 12px;margin-bottom:14px}
.pv{position:relative;height:190px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--surface-2);background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:20px 20px;background-position:center;overflow:hidden}
.pvb{position:relative;border-radius:6px;background:var(--accent-soft);border:3px solid var(--accent);box-shadow:var(--shadow-1);transition:width .18s ease,height .18s ease}
.pvb::before,.pvb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--accent) calc(50% - 1px),var(--accent) calc(50% + 1px),transparent calc(50% + 1px));opacity:.28}
.pvb::after{transform:scaleX(-1)}
.reduce-motion .pvb{transition:none}
.pv-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 12px;margin-top:12px;text-align:center}
.pv-meta b{font-size:clamp(1.5rem,7vw,2rem);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.pv-meta span{font-weight:650;color:var(--text-mute);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lockbar{margin-bottom:14px}
.lockbar .fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.lockbar .seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.frm{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:14px 14px 4px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.frm .field{margin:0 0 14px;min-width:0}
.frm .swp{margin-bottom:14px;align-self:end}
.frm .inp,.rr .inp{font-variant-numeric:tabular-nums;text-align:center;font-weight:750}
.frm .inp[aria-invalid="true"],.rr .inp[aria-invalid="true"],.ta[aria-invalid="true"]{border-color:var(--danger)}
.frm .rr{grid-column:1/-1;display:flex;align-items:flex-end;gap:8px;margin-bottom:14px}
.rr .field{margin:0;flex:1 1 0;min-width:0}
.rr .colon{font-weight:800;font-size:1.4rem;padding-bottom:10px;color:var(--text-mute)}
.rr .btn{min-height:3rem;padding:0 12px;font-size:.88rem;flex:0 1 auto}
.info{padding:12px 14px;margin-bottom:14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--text);font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.info b{font-variant-numeric:tabular-nums}
.info.warn{background:var(--surface);border:1px solid var(--danger);color:var(--danger)}
.pgrp{margin:6px 0 10px}
.pchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr));gap:8px;margin-bottom:6px}
.pchip{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:3.4rem;min-width:0;padding:8px 12px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);text-align:start}
.pchip b{font-size:.98rem;font-weight:800;font-variant-numeric:tabular-nums}
.pchip span{font-size:.78rem;font-weight:650;color:var(--text-mute);overflow-wrap:anywhere;line-height:1.25}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pchip[aria-pressed="true"] b{color:var(--accent)}
.pchip.add{border-style:dashed;align-items:center;flex-direction:row;gap:6px;justify-content:center;color:var(--accent);font-weight:750}
.rrow{display:flex;align-items:center;gap:12px;width:100%;min-height:3.5rem;padding:10px 16px;border:0;background:transparent;text-align:start;color:var(--text)}
.group .rrow+.rrow{border-top:1px solid var(--border)}
.rrow:active{background:var(--surface-2)}
.rrow .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rrow .rl{font-size:.8rem;font-weight:750;color:var(--text-mute)}
.rrow .rv{font-size:1.08rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rrow .rs{font-size:.8rem;color:var(--text-mute);overflow-wrap:anywhere}
.rrow .cp{color:var(--accent);flex:none}
.fine.pad{padding:0 4px;margin:8px 0 0}
.btn-line{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btn-line .btn{flex:1 1 9rem}
.dpichips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.dpichips .pchip{min-height:2.75rem;padding:4px 14px;flex-direction:row;align-items:center}
.dpichips .inp{width:6.2rem;min-height:2.75rem;text-align:center;font-weight:750}
.hrow{display:flex;align-items:center;background:var(--surface)}
.hrow+.hrow{border-top:1px solid var(--border)}
.hrow .hmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:3.5rem;padding:9px 6px 9px 16px;padding-inline:16px 6px;border:0;background:transparent;text-align:start;color:var(--text)}
.hrow .hmain:active{background:var(--surface-2)}
.hrow .hv{font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hrow .hs{font-size:.8rem;color:var(--text-mute);overflow-wrap:anywhere}
.hrow .icon-btn{color:var(--accent);flex:none}
.hrow .icon-btn.dg{color:var(--danger)}
.planbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-radius:var(--r);background:var(--accent-soft);color:var(--text);font-weight:650;font-size:.9rem}
.planbar span{flex:1;min-width:0}
.planbar .btn{min-height:2.6rem;padding:0 14px;font-size:.9rem}
.ta{font-variant-numeric:tabular-nums;font-weight:650}
.bt-in{margin-bottom:14px}
.bt-in .seg{margin-top:10px}
.msg{padding:12px 14px;margin-bottom:14px;border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-weight:650;border:1px solid var(--border)}
.msg.err{border-color:var(--danger);color:var(--danger)}
.apx{font-weight:650;color:var(--text-mute)}
@media (max-width:359px){.frm{grid-template-columns:1fr;}.frm .swp{justify-self:center;margin:-6px 0 6px}}
@media (max-height:720px){.pv{height:140px}.pv-card{padding:10px 10px 8px;margin-bottom:10px}.pv-meta{margin-top:8px}.lockbar{margin-bottom:10px}}
@media (min-width:600px){.pv{height:240px}}
.group+.info,.group+.btn-line{margin-top:14px}
.group .hrow+.row{border-top:1px solid var(--border)}
/*@@END TOOL_CSS*/
</style>

<body>
<div id="app">
  <header class="appbar" id="appbar">
    <button class="icon-btn" id="ab-back" data-act="back" hidden></button>

const SHELL_SCREENS = {};
const UI = {
  stack: [], layers: [], _toastT: 0,

  tab(id) { this.stack = [{ id: id, params: {} }]; this.render(true); },
  go(id, params) { const c = this.cur(); if (c) c.scroll = $('#view').scrollTop; this.stack.push({ id: id, params: params || {} }); this.render(true); },
  back() {

    $('#ab-title').textContent = d.title ? d.title(e.params) : APP.name;
    const sub = d.subtitle ? d.subtitle(e.params) : '';

    const acts = (d.actions ? d.actions(e.params) : []).slice();

    $('#ab-actions').innerHTML = acts.map(a => '<button class="icon-btn' + (a.tint ? ' tint' : '') + '" data-act="' + a.act + '"' + (a.arg != null ? ' data-arg="' + esc(a.arg) + '"' : '') + ' aria-label="' + esc(a.label) + '">' + icon(a.icon) + '</button>').join('');

    document.documentElement.style.setProperty('--toast-b', showNav ? 'calc(var(--nav-h) + 14px)' : '16px');

  buildNav() {

  empty(o) {

// ── Monetization ─────────────────────────────────────────────────────
// Catalog == metadata/iaps.json == MainActivity.VALID_PRODUCTS. Both are

const PRICES = Object.assign({}, APP.prices);
function isPro() { return S.pro === true; }

function grant(id) {
  const was = { ads: S.removeAds, pro: S.pro };
  switch (id) {
    case 'remove_ads': S.removeAds = true; break;
    case 'pro_lifetime': S.pro = true; S.removeAds = true; break;
    default: return false;
  }
  persist(); Ads.banner(); applyTheme();
  if (was.ads !== S.removeAds || was.pro !== S.pro) {
    UI.toast(t('thanks')); haptic('success');
    if (UI.layers.length && $('.layer:last-child .pro-hero')) UI.closeLayer(true);
    if (TOOL.onGrant) TOOL.onGrant(id);
    UI.refresh();
  }
  return true;
}
function iapDeferGrant(id) {
  try { const p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); p[id] = NOW(); localStorage.setItem('pendingGrants', JSON.stringify(p)); } catch (e) {}
}
window.iapDeferGrant = iapDeferGrant;
// Java billing bridge → here for every PURCHASED (and every restored) SKU. Never throws.
window.onPurchaseSuccess = function (id) {
  try { if (!grant(String(id))) iapDeferGrant(String(id)); }
  catch (e) { try { console.warn('IAP grant error', id, e); } catch (x) {} iapDeferGrant(String(id)); }
};
window.onPurchaseComplete = window.onPurchaseSuccess;
// Unknown SKUs bought before their mechanic existed are replayed once it does.
window.replayPendingGrants = function () {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch (e) { return; }
  const ids = Object.keys(p); if (!ids.length) return;
  const left = {};
  ids.forEach(id => { let ok = false; try { ok = grant(id); } catch (e) {} if (!ok) left[id] = p[id]; });
  try { if (Object.keys(left).length) localStorage.setItem('pendingGrants', JSON.stringify(left)); else localStorage.removeItem('pendingGrants'); } catch (e) {}
};
let restoreAsked = false;
window.onRestoreComplete = function (n) { if (restoreAsked) { restoreAsked = false; UI.toast((n | 0) > 0 ? t('restored') : t('nothing_restore')); } };
window.onLocalizedPrices = function (map) { try { Object.assign(PRICES, map || {}); if ($('.pro-hero')) Pro.fill(); } catch (e) {} };
window.onPurchaseUnavailable = function () { UI.toast(t('store_unavail')); };

}

ACT.buy = el => buy(el.dataset.arg);

// Ads: banner always (unless ad-free); interstitial ONLY at natural breaks,
// never in the first session, >= 3 min apart, >= 2 breaks between ads,
// never for Remove-Ads / Pro owners. Rewarded = opt-in only.
const Ads = {
  pending: null,
  banner() { callA(adsRemoved() ? 'hideBannerAd' : 'showBannerAd'); },
  naturalBreak(reason) {
    if (!APP.interstitials || adsRemoved() || !bridge()) return false;
    if (S.sessions < 2) return false;                         // never in the first session
    S.ads.breaks = (S.ads.breaks | 0) + 1;
    const sinceInterstitialMs = NOW() - (S.ads.last || 0);
    if (S.ads.breaks >= 2 && sinceInterstitialMs >= 180000) {  // >=2 breaks AND >=3 min since the last one
      S.ads.breaks = 0; S.ads.last = NOW(); persist();
      callA('showInterstitial');
      return true;
    }
    persist();
    return false;
  },
  // Opt-in rewarded video. type must be in MainActivity.VALID_REWARD_TYPES.
  rewarded(type, onReward) {
    if (!bridge()) { UI.toast(t('ad_not_ready')); return; }
    this.pending = { type: type, cb: onReward };
    callA('showRewarded', type);
  },
  preload() { callA('preloadRewarded'); },
};
// The reward is granted ONLY here (never on dismiss), once, to the caller that asked.
window.onAdReward = function(type) {
  const p = Ads.pending; Ads.pending = null;
  if (p && p.type === type && p.cb) { try { p.cb(); } catch (e) {} }
};

// ── Reminders (Java NotificationHelper; slot 0 = app-wide daily) ─────
// Permission is asked IN CONTEXT only — after the user switches a reminder on.
const Reminders = {
  _res: null,
  ensurePermission() {
    return new Promise(res => {
      if (!bridge()) return res(true);
      if (callA('hasNotificationPermission') === true) return res(true);

    });
  },
  set(slot, h, m, daysMask, title, body) {
    const A = bridge();
    if (A && typeof A.scheduleReminder === 'function') callA('scheduleReminder', slot, h, m, daysMask & 127, title, body);
    else if (slot === 0) callA('scheduleDailyReminder', h, m);
  },
  cancel(slot) { callA('cancelReminder', slot); },
  // Turn one on: permission first; false (and a settings hint) when refused.
  async enable(slot, h, m, daysMask, title, body) {
    const ok = await this.ensurePermission();
    if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return false; }
    this.set(slot, h, m, daysMask, title, body); return true;
  },
  syncDaily() {
    if (!APP.reminder) return;
    const d = S.settings.daily;
    if (d.on) this.set(0, d.h, d.m, 127, APP.name, t(APP.reminder.body)); else this.cancel(0);
  },
};
window.onNotificationPermissionResult = function (g) { const r = Reminders._res; Reminders._res = null; if (r) r(!!g); };

// ── Data: local-only; export = JSON text via the share sheet / clipboard ──
const Data = {
  payload() {
    return JSON.stringify({ app: APP.pkg, kind: 'backup', v: SAVE_VERSION, at: new Date(NOW()).toISOString(), settings: S.settings, tool: S.tool });
  },
  share(text, subject) { if (bridge()) callA('shareText', text); else this.copy(text); },
  copy(text) {
    let ok = false;

    else if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); ok = true; }
    UI.toast(ok ? t('copied') : t('store_unavail'));
  },
  async paste() {
    const v = callA('readClipboard');

  },
  parse(text) {
    let o; try { o = JSON.parse(String(text || '').trim()); } catch (e) { return null; }
    if (!o || o.kind !== 'backup' || o.app !== APP.pkg || !o.tool || !TOOL.validateImport(o.tool)) return null;
    return o;
  },
  // Replace tool data (+ prefs) from a backup; purchases are never imported.
  async importText(text) {
    const o = this.parse(text);

    const ok = await UI.confirm({ title: t('imp_title'), body: t('imp_confirm'), ok: t('imp_go'), danger: true });
    if (!ok) return false;
    const prev = { tool: clone(S.tool), settings: clone(S.settings) };
    S.tool = TOOL.migrate(o.tool, o.v | 0);
    if (o.settings) { const keep = S.settings.lang; S.settings = migrateSave({ settings: o.settings }).settings; S.settings.lang = keep; }
    persist(); afterDataChange();
    UI.closeAll(); UI.tab(APP.tabs[0].id);
    UI.toast(t('imp_done'), { action: t('undo'), onAction: () => { S.tool = prev.tool; S.settings = prev.settings; persist(); afterDataChange(); UI.refresh(); } });

// scripts/check_aspectratio_math.py runs exactly this block under node against a Python reference.
// Rounding rule everywhere: round half up to the stated precision; crops round DOWN so they never exceed the source.

  const rdiv = (num, den) => { const n = BigInt(num), d = BigInt(den); return Number((2n * n + d) / (2n * d)); };   // round half up, num >= 0, den > 0
  const reduce = (w, h) => { if (!isInt(w, 1, MAXPX) || !isInt(h, 1, MAXPX)) return null; const g = gcd(w, h); return { rw: w / g, rh: h / g, g: g }; };
  const info = (w, h) => {
    const r = reduce(w, h); if (!r) return null;

  };

  const fromH = (h, rw, rh) => !isInt(h, 1, MAXPX) || !okR(rw, rh) ? null : ({ v: rdiv(h * rw, rh), exact: (h * rw) % rh === 0, raw: rdiv(h * rw * 1000, rh) / 1000 });   // w for a given h
  const parsePx = s => { const x = /^\s*(\d{1,6})\s*$/.exec(String(s == null ? '' : s)); if (!x) return null; const n = +x[1]; return isInt(n, 1, MAXPX) ? n : null; };

function convRowText(u) { const c = S.tool.cv, v = convCalc(); if (v.wp == null && v.hp == null) return ''; const pr = [v.wp, v.hp].map(x => (x == null ? null : String(AR.fromPx(x, u, c.dpi)))); return pr.filter(x => x != null).join(' × ') + ' ' + t(UNIT_KEY[u]) + (u === 'px' ? '' : ' (' + c.dpi + ' DPI)'); }
function convAllText() { const c = S.tool.cv; return ['px', 'in', 'cm', 'mm'].map(u => convRowText(u)).join('\n') + '\n— ' + APP.name; }
function paintConv() {
  const el = $('#cv-res'); if (!el) return;
  const c = S.tool.cv, v = convCalc();
  let h = '';
  if (v.wBad || v.hBad) h += '<div class="msg err" role="alert">' + esc(t('cv_bad', { max: fmtNum(AR.MAXPX) })) + '</div>';
  if (v.wp == null && v.hp == null) { el.innerHTML = h + (v.wBad || v.hBad ? '' : '<div class="info">' + esc(t('cv_hint')) + '</div>'); return; }
  h += '<div class="group">' + ['px', 'in', 'cm', 'mm'].map(u => {
    const pr = pair(v.wp, v.hp, u, c.dpi);
    return '<button class="rrow" data-act="copy" data-arg="conv:' + u + '"><span class="rt"><span class="rl">' + esc(t('un_' + u)) + '</span><span class="rv">' + ltr(pr[0] + ' × ' + pr[1]) + '</span></span><span class="cp">' + icon('copy', 20) + '</span></button>';
  }).join('') + '</div>';
  if (v.wp != null && v.hp != null) {
    const i = AR.info(v.wp, v.hp);
    h += '<div class="info">' + esc(t('cv_ratio', { ratio: iso(i.rw + ':' + i.rh), dec: iso(f4(i.dec)), mp: fmtNum(i.mp, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) })) + '</div>' +
      '<div class="btn-line"><button class="btn btn-secondary" data-act="copy" data-arg="convall">' + icon('copy', 20) + esc(t('copy_all')) + '</button><button class="btn btn-primary" data-act="cv-use">' + icon('ratio', 20) + esc(t('use_resize')) + '</button></div>';
  } else h += '<div class="btn-line"><button class="btn btn-secondary" data-act="copy" data-arg="convall">' + icon('copy', 20) + esc(t('copy_all')) + '</button></div>';
  el.innerHTML = h + '<p class="fine pad">' + esc(t('cv_note')) + '</p>';
}
function convertScreen(el) {
  const c = S.tool.cv, dp = [72, 96, 150, 300, 600];
  el.innerHTML = '<div class="frm"><label class="field"><span class="fl">' + esc(t('f_width')) + '</span><input class="inp" id="cv-w" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-input="cv-w" data-change="cv-c" value="' + esc(c.w) + '"></label>' +
    '<span aria-hidden="true"></span>' +
    '<label class="field"><span class="fl">' + esc(t('f_height')) + '</span><input class="inp" id="cv-h" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-input="cv-h" data-change="cv-c" value="' + esc(c.h) + '"></label></div>' +
    '<div class="lockbar"><span class="fl">' + esc(t('cv_unit')) + '</span>' + seg(['px', 'in', 'cm', 'mm'].map(u => [u, t(UNIT_KEY[u])]), c.u, 'cv-unit') + '</div>' +
    '<div class="lockbar"><span class="fl">DPI</span></div><div class="dpichips">' + dp.map(d => '<button class="pchip" data-act="cv-dpi" data-arg="' + d + '" aria-pressed="' + (c.dpi === d) + '"><b>' + d + '</b></button>').join('') +
    '<input class="inp" id="cv-dpi" inputmode="numeric" autocomplete="off" data-input="cv-dpiv" data-change="cv-c" value="' + c.dpi + '" aria-label="DPI"></div>' +
    '<div id="cv-res"></div>';

}
function cvLive(key, el) { S.tool.cv[key] = el.value.slice(0, 12); persist(); paintConv(); }
INPUT['cv-w'] = el => cvLive('w', el);
INPUT['cv-h'] = el => cvLive('h', el);
INPUT['cv-dpiv'] = el => { const v = AR.parsePx(norm(el.value)); const ok = v != null && v <= AR.MAXDPI; el.setAttribute('aria-invalid', String(el.value.trim() !== '' && !ok)); if (ok) { S.tool.cv.dpi = v; persist(); paintConv(); $$('.dpichips .pchip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.arg === v))); } };
CHANGE['cv-c'] = () => { const d = $('#cv-dpi'); if (d) { d.value = S.tool.cv.dpi; d.setAttribute('aria-invalid', 'false'); } record('c'); };
ACT['cv-dpi'] = el => { S.tool.cv.dpi = +el.dataset.arg; persist(); record('c'); UI.refresh(); };
ACT['cv-unit'] = el => {
  const c = S.tool.cv, v = convCalc(), nu = el.dataset.arg; if (nu === c.u) return;
  const conv = x => (x == null ? null : String(AR.fromPx(x, nu, c.dpi)));
  const a = conv(v.wp), b = conv(v.hp);
  c.u = nu; if (a != null) c.w = a; if (b != null) c.h = b; persist(); UI.refresh();
};
ACT['cv-use'] = () => {
  const v = convCalc(); if (v.wp == null || v.hp == null) return;
  const z = rz(), i = AR.reduce(v.wp, v.hp); z.w = v.wp; z.h = v.hp; z.rw = i.rw; z.rh = i.rh; z.lock = 'ratio'; persist(); record('c'); UI.tab('resize');
};

// ---------- Saved: my presets, batch entry, history ----------
function histRow(e) {
  let main, sub;
  if (e.k === 'r') { main = fmtNum(e.w) + ' × ' + fmtNum(e.h) + ' px'; sub = e.rw + ':' + e.rh; }
  else { const W = AR.parseDec(norm(e.w)), H = AR.parseDec(norm(e.h)); main = [e.w, e.h].filter(Boolean).join(' × ') + ' ' + t(UNIT_KEY[e.u]); sub = e.dpi + ' DPI'; if (W != null || H != null) sub += ' · ' + [W == null ? null : AR.toPx(W, e.u, e.dpi), H == null ? null : AR.toPx(H, e.u, e.dpi)].filter(x => x != null).map(fmtNum).join(' × ') + ' px'; }
  return '<div class="hrow"><button class="hmain" data-act="h-open" data-arg="' + esc(e.id) + '"><span class="hv">' + ltr(main) + '</span><span class="hs">' + ltr(sub) + ' · ' + esc(fmtDate(new Date(e.t), { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })) + '</span></button>' +
    '<button class="icon-btn" data-act="h-copy" data-arg="' + esc(e.id) + '" aria-label="' + esc(t('copy')) + '">' + icon('copy', 20) + '</button></div>';
}
function savedScreen(el) {
  const M = S.tool.mine, H = S.tool.hist, pro = isPro();
  let h = '<div class="sec-h"><span>' + esc(t('mine_t')) + '</span></div>';
  if (!pro) h += '<div class="planbar">' + icon('gem', 22) + '<span>' + esc(t('free_limit', { n: M.length, max: FREE_PRESETS })) + '</span><button class="btn btn-primary" data-act="go-pro" data-arg="limit_t">' + esc(t('go_pro')) + '</button></div>';
  h += '<div class="group">' + M.map(p => '<div class="hrow"><button class="hmain" data-act="mine-use" data-arg="' + esc(p.id) + '"><span class="hv">' + esc(p.name) + '</span><span class="hs">' + ltr(p.rw + ':' + p.rh) + '</span></button><button class="icon-btn" data-act="mine-edit" data-arg="' + esc(p.id) + '" aria-label="' + esc(t('edit')) + '">' + icon('edit', 20) + '</button></div>').join('') +
    sRow({ icon: 'plus', label: t('mine_add'), act: 'mine-add', noChev: true }) + '</div>';
  h += '<div class="sec-h"><span>' + esc(t('bt_t')) + '</span></div><div class="group">' + sRow({ icon: 'layers', label: t('bt_title'), sub: t('bt_sub'), act: 'open-batch', right: (pro ? '' : '<span class="badge">' + icon('gem', 14) + 'Pro</span>') + icon('chev', 20, 'chev flip') }) + '</div>';
  h += '<div class="sec-h"><span>' + esc(t('hist_t')) + '</span>' + (H.length ? '<button class="btn btn-ghost" style="min-height:2.5rem;padding:0 8px" data-act="h-clear">' + esc(t('clear')) + '</button>' : '') + '</div>';
  h += H.length ? '<div class="group">' + H.map(histRow).join('') + '</div><p class="fine pad">' + esc(t('hist_note', { n: MAX_HIST })) + '</p>' : UI.empty({ icon: 'clock', title: t('hist_empty_t'), body: t('hist_empty_b') });
  el.innerHTML = h;
}
ACT['h-open'] = el => {
  const e = S.tool.hist.find(x => x.id === el.dataset.arg); if (!e) return;
  if (e.k === 'r') { const r = AR.resolve({ w: e.w, h: e.h, rw: e.rw, rh: e.rh, lock: e.lock }, { f: 'lock', v: e.lock }); if (r.ok) applyRz(r); UI.tab('resize'); }
  else { const c = S.tool.cv; c.w = e.w; c.h = e.h; c.u = e.u; c.dpi = e.dpi; persist(); UI.tab('convert'); }
};
ACT['h-copy'] = el => {
  const e = S.tool.hist.find(x => x.id === el.dataset.arg); if (!e) return;
  if (e.k === 'r') copyOut(allTxt(e), null);
  else { const keep = Object.assign({}, S.tool.cv); Object.assign(S.tool.cv, { w: e.w, h: e.h, u: e.u, dpi: e.dpi }); const tx = convAllText(); Object.assign(S.tool.cv, keep); copyOut(tx, null); }
};
ACT['h-clear'] = async () => {
  const ok = await UI.confirm({ title: t('clear_t'), body: t('clear_b'), ok: t('clear'), danger: true }); if (!ok) return;
  const old = S.tool.hist; S.tool.hist = []; persist(); UI.refresh(); haptic('reject');
  UI.toast(t('cleared'), { action: t('undo'), onAction: () => { S.tool.hist = old; persist(); UI.refresh(); } });
};
// my presets
function openMine(id, preset) {
  const p = id ? S.tool.mine.find(x => x.id === id) : null;
  if (!p && S.tool.mine.length >= FREE_PRESETS && !isPro()) { Pro.open('limit_t'); return; }
  TD.ed = p ? { id: p.id, name: p.name, rw: String(p.rw), rh: String(p.rh) } : Object.assign({ id: null, name: '', rw: '', rh: '' }, preset || {});
  UI.sheet({ title: t(p ? 'mine_edit' : 'mine_new'), full: true, body: '<div id="ed-body"></div>', foot: '<button class="btn btn-primary" data-act="mine-ok">' + esc(t('save')) + '</button>' });
  const b = $('#ed-body'); if (!b) return;
  b.innerHTML = '<label class="field"><span class="fl">' + esc(t('f_name')) + '</span><input class="inp" id="ed-name" maxlength="24" data-input="ed-name" value="' + esc(TD.ed.name) + '" placeholder="' + esc(t('f_name_ph')) + '" enterkeyhint="done" autocomplete="off"></label>' +
    '<div class="rr"><label class="field"><span class="fl">' + esc(t('f_ratio')) + '</span><input class="inp" id="ed-rw" inputmode="numeric" data-input="ed-rw" value="' + esc(TD.ed.rw) + '" aria-label="' + esc(t('ratio_w')) + '"></label><span class="colon" aria-hidden="true">:</span><label class="field"><span class="fl vh">' + esc(t('ratio_h')) + '</span><input class="inp" id="ed-rh" inputmode="numeric" data-input="ed-rh" value="' + esc(TD.ed.rh) + '" aria-label="' + esc(t('ratio_h')) + '"></label></div>' +
    (p ? '<div class="btn-row" style="margin-top:14px"><button class="btn btn-danger" data-act="mine-del">' + icon('trash', 20) + esc(t('delete')) + '</button></div>' : '');
}
INPUT['ed-name'] = el => { TD.ed.name = el.value; };
INPUT['ed-rw'] = el => { TD.ed.rw = el.value; };
INPUT['ed-rh'] = el => { TD.ed.rh = el.value; };
ACT['mine-add'] = () => openMine(null, null);
ACT['mine-edit'] = el => openMine(el.dataset.arg, null);
ACT['mine-save'] = () => { const z = rz(); openMine(null, { name: z.rw + ':' + z.rh, rw: String(z.rw), rh: String(z.rh) }); };
ACT['mine-ok'] = () => {
  const e = TD.ed; if (!e) return;
  const name = String(e.name || '').trim().slice(0, 24), x = AR.parsePx(norm(e.rw)), y = AR.parsePx(norm(e.rh));
  if (!name) { UI.toast(t('name_needed')); haptic('reject'); const i = $('#ed-name'); if (i) i.focus(); return; }
  if (x == null || y == null) { UI.toast(t('ratio_needed')); haptic('reject'); return; }
  const r = AR.reduce(x, y);
  if (e.id) { const p = S.tool.mine.find(q => q.id === e.id); if (!p) return; p.name = name; p.rw = r.rw; p.rh = r.rh; }
  else {
    if (S.tool.mine.length >= FREE_PRESETS && !isPro()) { Pro.open('limit_t'); return; }
    if (S.tool.mine.length >= MAX_MINE) return;
    S.tool.mine.push({ id: uid('m'), name: name, rw: r.rw, rh: r.rh });
  }
  TD.ed = null; persist(); UI.closeLayer(true); UI.refresh(); haptic('success'); UI.toast(t('mine_saved', { name: name }));
};
ACT['mine-del'] = async () => {
  const e = TD.ed, p = e && S.tool.mine.find(q => q.id === e.id); if (!p) return;
  const ok = await UI.confirm({ title: t('del_t'), body: t('del_b'), ok: t('delete'), danger: true }); if (!ok) return;
  const i = S.tool.mine.indexOf(p); S.tool.mine.splice(i, 1); TD.ed = null; persist(); UI.closeLayer(true); UI.refresh(); haptic('reject');
  UI.toast(t('mine_deleted', { name: p.name }), { action: t('undo'), onAction: () => { S.tool.mine.splice(Math.min(i, S.tool.mine.length), 0, p); persist(); UI.refresh(); } });
};

// ---------- Batch (Pro) ----------
function batchRows() { const z = rz(), b = S.tool.batch, L = AR.parseList(norm(b.text)); return { L: L, rows: AR.batch(L.vals, z.rw, z.rh, b.by) }; }
function batchText() { const q = batchRows(); return q.rows.length ? q.rows.map(r => r.w + ' × ' + r.h).join('\n') + '\n— ' + APP.name : ''; }
function paintBatch() {
  const el = $('#bt-res'); if (!el) return;
  const q = batchRows();
  let h = q.L.bad ? '<div class="msg err" role="alert">' + esc(t('bt_bad', { n: q.L.bad })) + '</div>' : '';
  if (!q.rows.length) { el.innerHTML = h + '<div class="info">' + esc(t('bt_hint')) + '</div>'; return; }
  h += '<div class="group">' + q.rows.map(r => '<div class="rrow"><span class="rt"><span class="rv">' + ltr(fmtNum(r.w) + ' × ' + fmtNum(r.h) + ' px') + '</span><span class="rs">' + esc(t(r.clamped ? 'bt_clamped' : r.exact ? 'bt_exact' : 'bt_rounded')) + '</span></span></div>').join('') + '</div>' +
    '<div class="btn-line"><button class="btn btn-primary" data-act="copy" data-arg="batch">' + icon('copy', 20) + esc(t('copy_all')) + '</button></div>' +
    '<p class="fine pad">' + esc(t('round_note')) + '</p>';
  el.innerHTML = h;
}
function batchScreen(el) {
  const z = rz(), b = S.tool.batch;
  if (!isPro()) { el.innerHTML = UI.empty({ icon: 'layers', title: t('bt_title'), body: t('batch_pro'), cta: t('go_pro'), act: 'go-pro', arg: 'batch_pro' }); return; }
  el.innerHTML = '<div class="info">' + esc(t('bt_using', { ratio: iso(ratioTxt(z)) })) + '</div><div class="card bt-in" style="padding:14px"><label class="field" style="margin:0"><span class="fl">' + esc(t('bt_list', { max: AR.MAXLIST })) + '</span><textarea class="inp ta" id="bt-text" rows="3" inputmode="text" data-input="bt-text" data-change="bt-c">' + esc(b.text) + '</textarea></label>' +
    seg([['w', t('bt_widths')], ['h', t('bt_heights')]], b.by, 'bt-by') + '</div><div id="bt-res"></div>';

}
INPUT['bt-text'] = el => { S.tool.batch.text = el.value.slice(0, 600); persist(); paintBatch(); };
ACT['bt-by'] = el => { S.tool.batch.by = el.dataset.arg === 'h' ? 'h' : 'w'; persist(); UI.refresh(); };
ACT['open-batch'] = () => { if (!Pro.require('batch_pro')) return; UI.go('batch'); };

// ===== TOOL contract =====
const TOOL = {
  defaults: () => ({ rz: { w: 1920, h: 1080, rw: 16, rh: 9, lock: 'ratio' }, cv: { w: '8.5', h: '11', u: 'in', dpi: 300 }, hist: [], mine: [], batch: { text: '320, 640, 1280, 1920', by: 'w' }, grp: 'social' }),
  migrate(tool) {
    const d = TOOL.defaults(), o = Object.assign(d, tool && typeof tool === 'object' ? tool : {});
    const z = o.rz && typeof o.rz === 'object' ? o.rz : {}, ok = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
    const dz = TOOL.defaults().rz;
    o.rz = ok(z.w, 1, AR.MAXPX) && ok(z.h, 1, AR.MAXPX) && ok(z.rw, 1, AR.MAXRATIO) && ok(z.rh, 1, AR.MAXRATIO) && ['ratio', 'w', 'h'].indexOf(z.lock) >= 0 ? { w: z.w, h: z.h, rw: z.rw, rh: z.rh, lock: z.lock } : dz;
    const c = o.cv && typeof o.cv === 'object' ? o.cv : {}, dc = TOOL.defaults().cv;
    o.cv = { w: typeof c.w === 'string' ? c.w.slice(0, 12) : dc.w, h: typeof c.h === 'string' ? c.h.slice(0, 12) : dc.h, u: ['px', 'in', 'cm', 'mm'].indexOf(c.u) >= 0 ? c.u : dc.u, dpi: ok(c.dpi, 1, AR.MAXDPI) ? c.dpi : dc.dpi };
    o.hist = (Array.isArray(o.hist) ? o.hist : []).filter(e => e && (e.k === 'r' ? ok(e.w, 1, AR.MAXPX) && ok(e.h, 1, AR.MAXPX) && ok(e.rw, 1, AR.MAXRATIO) && ok(e.rh, 1, AR.MAXRATIO) && ['ratio', 'w', 'h'].indexOf(e.lock) >= 0 : e.k === 'c' && typeof e.w === 'string' && typeof e.h === 'string' && ['px', 'in', 'cm', 'mm'].indexOf(e.u) >= 0 && ok(e.dpi, 1, AR.MAXDPI)) && Number.isFinite(e.t))
      .slice(0, MAX_HIST).map(e => Object.assign({}, e, { id: String(e.id || uid('h')) }));
    o.mine = (Array.isArray(o.mine) ? o.mine : []).filter(p => p && p.id && typeof p.name === 'string' && ok(p.rw, 1, AR.MAXRATIO) && ok(p.rh, 1, AR.MAXRATIO)).slice(0, MAX_MINE).map(p => ({ id: String(p.id), name: p.name.slice(0, 24), rw: p.rw, rh: p.rh }));
    const b = o.batch && typeof o.batch === 'object' ? o.batch : {};
    o.batch = { text: typeof b.text === 'string' ? b.text.slice(0, 600) : TOOL.defaults().batch.text, by: b.by === 'h' ? 'h' : 'w' };
    o.grp = ['social', 'video', 'print', 'mine'].indexOf(o.grp) >= 0 ? o.grp : 'social';
    return o;
  },
  validateImport: tool => !!(tool && typeof tool === 'object' && tool.rz && Array.isArray(tool.hist) && Array.isArray(tool.mine)),
  onBoot() { TD.grp = S.tool.grp || 'social'; },
  onNewDay() {},
  onGrant() {},
  afterOnboarding() { UI.refresh(); },
  screens: {
    resize: { title: () => t('tab_resize'), subtitle: () => t('sub_resize'), render: el => resizeScreen(el) },
    convert: { title: () => t('tab_convert'), subtitle: () => t('sub_convert'), render: el => convertScreen(el) },
    saved: { title: () => t('tab_saved'), render: el => savedScreen(el),
      actions: () => [{ icon: 'plus', label: t('mine_add'), act: 'mine-add', tint: true }] },
    batch: { title: () => t('bt_title'), render: el => batchScreen(el), onLeave: () => Ads.naturalBreak('batch_closed') },
  },
};
//@@END TOOL_CORE
// ── Boot ─────────────────────────────────────────────────────────────
(function boot() {
  mergeI18n();
  loadSave();
  touchSession();
  lastDayKey = todayKey();
  applyLang(); applyTheme(); applyFontScale();
  checkTrial();
  UI.buildNav();
  if (TOOL.onBoot) TOOL.onBoot();
  UI.tab(APP.tabs[0].id);
  persist();
  window.replayPendingGrants();
  Ads.banner();
  Reminders.syncDaily();
  if (TOOL.syncReminders) TOOL.syncReminders();
  if (!S.onboarded) Onboarding.show();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lights Out</title>
<style>
:root{
  --bg:#0d0d0d;--surface:#1a1a1a;--card:#242424;
  --on:#fdd835;--glow:#fdd83566;
  --off:#2a2a2a;--text:#f0f0f0;--muted:#666;--border:#33333388;
  --accent:#fdd835;--accent2:#ff9800;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.level-label{font-size:1rem;font-weight:800;color:var(--accent)}
.moves-label{font-size:0.72rem;color:var(--muted);margin-top:1px}
.coins-badge{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:4px 10px;font-size:0.82rem;font-weight:700;color:var(--accent)}

.screen{flex:1;overflow-y:auto;display:none;min-height:0;flex-direction:column}
.screen.active{display:flex}

/* GAME */
#gameScreen{align-items:center;justify-content:space-between;padding:10px 14px}
.msg-bar{font-size:0.82rem;color:var(--muted);text-align:center;min-height:20px;flex-shrink:0}
.grid-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
#grid{display:inline-grid;gap:6px;padding:12px;background:var(--card);border-radius:14px;border:2px solid var(--border)}
.cell{border-radius:8px;cursor:pointer;transition:background .1s,box-shadow .1s;display:flex;align-items:center;justify-content:center}
.cell.on{background:var(--on);box-shadow:0 0 14px var(--glow)}
.cell.off{background:var(--off)}
.cell.hint{outline:3px solid #fff;outline-offset:2px}
.cell:active{transform:scale(.9)}

.action-row{display:flex;gap:8px;flex-shrink:0;width:100%;padding:4px 0}
.act-btn{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 8px;border-radius:10px;font-size:0.78rem;font-weight:700;cursor:pointer;transition:transform .1s}
.act-btn:active{transform:scale(.95)}
.act-btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.act-btn.warn{background:var(--card);color:var(--accent);border-color:var(--accent)33}

/* LEVELS */
#levelsScreen{padding:12px 14px;flex-direction:column}
.levels-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 4px;text-align:center;font-size:0.85rem;font-weight:700;cursor:pointer}
.lv-btn.done{background:var(--accent);border-color:var(--accent);color:#000}
.lv-btn.locked{opacity:.35;pointer-events:none}

/* STATS */
#statsScreen{padding:12px 14px;flex-direction:column}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-val{font-size:2rem;font-weight:800;color:var(--accent)}
.stat-label{font-size:0.7rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

/* SHOP */
#shopScreen{padding:12px 14px;flex-direction:column}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.theme-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.theme-card.owned{border-color:var(--accent)}
.theme-preview{height:44px;border-radius:8px;margin-bottom:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:4px;overflow:hidden}
.theme-cell{border-radius:3px}
.theme-name{font-size:0.78rem;font-weight:700}
.theme-price{font-size:0.68rem;color:var(--muted);margin-top:2px}

.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.nav-btn{flex:1;padding:10px 4px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:none;border:none;cursor:pointer}
.nav-btn.active{color:var(--accent);border-top:2px solid var(--accent)}

.particle{position:fixed;pointer-events:none;border-radius:50%;z-index:99;animation:fp .8s forwards}
@keyframes fp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100px) scale(0)}}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(12px);background:#222;color:#fff;padding:8px 18px;border-radius:16px;font-size:0.82rem;opacity:0;pointer-events:none;transition:all .3s;z-index:99;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="level-label" id="levelLabel">Level 1</div>
    <div class="moves-label" id="movesLabel">Moves: 0</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="coins-badge">🪙 <span id="coinCount">0</span></div>
  </div>
</div>

<!-- GAME -->
<div class="screen active" id="gameScreen">
  <div class="msg-bar" id="msgBar">Turn all lights off!</div>
  <div class="grid-wrap">
    <div id="grid"></div>
  </div>
  <div class="action-row">
    <button class="act-btn warn" onclick="doHint()">Hint</button>
    <button class="act-btn" onclick="resetLevel()">Reset</button>
    <button class="act-btn primary" onclick="switchTab('levels')">Levels</button>
  </div>
</div>

<!-- LEVELS -->
<div class="screen" id="levelsScreen" style="overflow-y:auto">
  <div style="font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;flex-shrink:0">Select Level</div>
  <div class="levels-grid" id="levelsGrid"></div>
</div>

<!-- STATS -->
<div class="screen" id="statsScreen">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="stat-solved">0</div><div class="stat-label">Levels Solved</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-coins">0</div><div class="stat-label">Coins Earned</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-moves">0</div><div class="stat-label">Total Moves</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-hints">0</div><div class="stat-label">Hints Used</div></div>
  </div>
  <button style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:10px;border-radius:10px;font-size:0.75rem;cursor:pointer" onclick="doPurchase('remove_ads')">Remove Ads — $2.99</button>
</div>

<!-- SHOP -->
<div class="screen" id="shopScreen">
  <div style="font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;flex-shrink:0">Light Themes</div>
  <div class="theme-grid" id="themeGrid"></div>
  <button style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px;font-size:0.8rem;cursor:pointer;margin-bottom:6px" onclick="doPurchase('coins_small')">Buy 100 Coins — $0.99</button>
  <button style="width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px;font-size:0.8rem;cursor:pointer" onclick="doPurchase('coins_large')">Buy 500 Coins — $2.99</button>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="switchTab('game')">Play</button>
  <button class="nav-btn" onclick="switchTab('levels')">Levels</button>
  <button class="nav-btn" onclick="switchTab('stats')">Stats</button>
  <button class="nav-btn" onclick="switchTab('shop')">Shop</button>
</div>

<div id="toast"></div>

<script>
const LIGHT_THEMES = [
  {id:'yellow', name:'Classic',  price:0,   on:'#fdd835', glow:'#fdd83566', bg:'#0d0d0d', off:'#2a2a2a'},
  {id:'blue',   name:'Neon Blue',price:60,  on:'#00e5ff', glow:'#00e5ff55', bg:'#020a0f', off:'#0a1520'},
  {id:'green',  name:'Matrix',   price:60,  on:'#69ff47', glow:'#69ff4755', bg:'#020d04', off:'#051208'},
  {id:'red',    name:'Alarm',    price:100, on:'#ff1744', glow:'#ff174455', bg:'#100005', off:'#200008'},
  {id:'purple', name:'Plasma',   price:100, on:'#d500f9', glow:'#d500f955', bg:'#080010', off:'#140018'},
  {id:'white',  name:'Arctic',   price:140, on:'#e0f7fa', glow:'#e0f7fa66', bg:'#04090a', off:'#121c1e'},
];

function genSolvable(seed, clicks) {
  const board = new Array(25).fill(0);
  let s = seed;
  const lcg = () => { s = (s * 1664525 + 1013904223) >>> 0; return s >>> 0; };
  for (let i = 0; i < clicks; i++) toggleAt(board, lcg() % 25, 5);
  return board;
}

function toggleAt(board, idx, size) {
  const sz = size || 5;
  const r = Math.floor(idx / sz), c = idx % sz;
  board[idx] ^= 1;
  if (r > 0)      board[idx - sz] ^= 1;
  if (r < sz - 1) board[idx + sz] ^= 1;
  if (c > 0)      board[idx - 1]  ^= 1;
  if (c < sz - 1) board[idx + 1]  ^= 1;
}

// 100 solvable 5x5 levels
const CONFIGS = [];
for (let i = 0; i < 25; i++) CONFIGS.push(genSolvable(i + 1, 5 + (i % 4)));
for (let i = 0; i < 40; i++) CONFIGS.push(genSolvable(i + 26, 8 + (i % 5)));
for (let i = 0; i < 35; i++) CONFIGS.push(genSolvable(i + 66, 12 + (i % 6)));

let _coins = 0, _adsRemoved = false;
let _unlockedThemes = ['yellow'];
let _activeTheme = 'yellow';
let _completed = {};
let _stats = {solved: 0, coinsEarned: 0, totalMoves: 0, hintsUsed: 0};
let _level = 0;
let _board = [];
let _moves = 0;
let _hintCell = -1;
let _hintsUsedLevel = 0;

function save() {
  localStorage.setItem('lo_coins', _coins);
  localStorage.setItem('lo_ads', _adsRemoved);
  localStorage.setItem('lo_themes', JSON.stringify(_unlockedThemes));
  localStorage.setItem('lo_theme', _activeTheme);
  localStorage.setItem('lo_completed', JSON.stringify(_completed));
  localStorage.setItem('lo_stats', JSON.stringify(_stats));
  localStorage.setItem('lo_level', _level);
}
function load() {
  _coins = +localStorage.getItem('lo_coins') || 0;
  _adsRemoved = localStorage.getItem('lo_ads') === 'true';
  try { _unlockedThemes = JSON.parse(localStorage.getItem('lo_themes')) || ['yellow']; } catch(e){}
  _activeTheme = localStorage.getItem('lo_theme') || 'yellow';
  try { _completed = JSON.parse(localStorage.getItem('lo_completed')) || {}; } catch(e){}
  try { _stats = {..._stats, ...JSON.parse(localStorage.getItem('lo_stats'))}; } catch(e){}
  _level = +localStorage.getItem('lo_level') || 0;
}

function getTheme() { return LIGHT_THEMES.find(t => t.id === _activeTheme) || LIGHT_THEMES[0]; }

function applyTheme() {
  const t = getTheme();
  document.documentElement.style.setProperty('--on', t.on);
  document.documentElement.style.setProperty('--glow', t.glow);
  document.documentElement.style.setProperty('--bg', t.bg);
  document.documentElement.style.setProperty('--off', t.off);
  document.documentElement.style.setProperty('--accent', t.on);
  document.body.style.background = t.bg;
}

function updateCoinDisplay() { document.getElementById('coinCount').textContent = _coins; }

function switchTab(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(name + 'Screen').classList.add('active');
  const idx = ['game','levels','stats','shop'].indexOf(name);
  if (idx >= 0) document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if (name === 'stats') renderStats();
  if (name === 'shop') renderShop();
  if (name === 'levels') renderLevels();
}

function loadLevel(n) {
  _level = n;
  _board = [...CONFIGS[n]];
  _moves = 0;
  _hintCell = -1;
  _hintsUsedLevel = 0;
  document.getElementById('levelLabel').textContent = 'Level ' + (n + 1);
  document.getElementById('movesLabel').textContent = 'Moves: 0';
  setMsg('Turn all lights off!');
  renderGrid();
  save();
}

function renderGrid() {
  const wrap = document.querySelector('.grid-wrap');
  const maxPx = Math.min(wrap.clientWidth - 20, wrap.clientHeight - 20, 380);
  const cellPx = Math.floor((maxPx - 5 * 6 - 24) / 5);
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = 'repeat(5, ' + cellPx + 'px)';
  grid.innerHTML = '';
  _board.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell ' + (v ? 'on' : 'off') + (i === _hintCell ? ' hint' : '');
    cell.style.width = cellPx + 'px';
    cell.style.height = cellPx + 'px';
    cell.addEventListener('click', () => tapCell(i));
    grid.appendChild(cell);
  });
}

function tapCell(idx) {
  _hintCell = -1;
  toggleAt(_board, idx, 5);
  _moves++;
  document.getElementById('movesLabel').textContent = 'Moves: ' + _moves;
  renderGrid();
  if (_board.every(v => v === 0)) onWin();
}

function doHint() {
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < 25; i++) {
    const tmp = [..._board];
    toggleAt(tmp, i, 5);
    const score = tmp.reduce((a, b) => a + b, 0);
    if (score < bestScore) { bestScore = score; best = i; }
  }
  _hintCell = best;
  _hintsUsedLevel++;
  _stats.hintsUsed++;
  setMsg('Try the highlighted cell!');
  renderGrid();
}

function resetLevel() { loadLevel(_level); }

function setMsg(msg) { document.getElementById('msgBar').textContent = msg; }

function onWin() {
  const isClean = _hintsUsedLevel === 0;
  const reward = isClean ? 10 : 5;
  _coins += reward;
  _stats.solved++;
  _stats.coinsEarned += reward;
  _stats.totalMoves += _moves;
  _completed[_level] = true;
  save();
  updateCoinDisplay();
  spawnParticles();
  setMsg(isClean ? 'Lights out! Clean solve! +' + reward + ' coins' : 'Lights out! +' + reward + ' coins');
  if (!_adsRemoved && typeof Android !== 'undefined') try { Android.showInterstitial(); } catch(e){}
  setTimeout(() => {
    if (_level + 1 < CONFIGS.length) loadLevel(_level + 1);
  }, 1600);
}

function spawnParticles() {
  const t = getTheme();
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = 'width:8px;height:8px;background:' + t.on +
      ';left:' + (20 + Math.random() * 60) + '%;top:' + (30 + Math.random() * 30) + '%;' +
      'animation-delay:' + (Math.random() * 0.4) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}

function renderLevels() {
  const grid = document.getElementById('levelsGrid');
  grid.innerHTML = '';
  const maxUnlocked = Math.max(_level, ...Object.keys(_completed).map(Number), 0) + 3;
  CONFIGS.forEach((_, i) => {
    const btn = document.createElement('div');
    btn.className = 'lv-btn' + (_completed[i] ? ' done' : (i > maxUnlocked ? ' locked' : ''));
    btn.textContent = i + 1;
    if (i <= maxUnlocked) btn.addEventListener('click', () => { loadLevel(i); switchTab('game'); });
    grid.appendChild(btn);
  });
}

function renderStats() {
  document.getElementById('stat-solved').textContent = _stats.solved;
  document.getElementById('stat-coins').textContent = _stats.coinsEarned;
  document.getElementById('stat-moves').textContent = _stats.totalMoves;
  document.getElementById('stat-hints').textContent = _stats.hintsUsed;
}

function renderShop() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  LIGHT_THEMES.forEach(th => {
    const owned = _unlockedThemes.includes(th.id);
    const div = document.createElement('div');
    div.className = 'theme-card' + (owned ? ' owned' : '');
    // Mini 5x5 grid preview with 3 on cells
    const cells = [1,2,5,10,15,20,24].slice(0,6);
    const preview = Array(25).fill(0).map((_, i) => {
      const isOn = cells.includes(i);
      return `<div class="theme-cell" style="background:${isOn?th.on:th.off}"></div>`;
    }).join('');
    div.innerHTML = `<div class="theme-preview" style="background:${th.bg}">${preview}</div><div class="theme-name" style="color:${th.on}">${th.name}</div><div class="theme-price">${owned?(_activeTheme===th.id?'Active':'Owned'):(th.price===0?'Free':th.price+' coins')}</div>`;
    div.addEventListener('click', () => selectTheme(th));
    grid.appendChild(div);
  });
}

function selectTheme(th) {
  if (!_unlockedThemes.includes(th.id)) {
    if (th.price === 0) { _unlockedThemes.push(th.id); save(); }
    else if (_coins >= th.price) { _coins -= th.price; _unlockedThemes.push(th.id); save(); updateCoinDisplay(); }
    else { showToast('Need ' + th.price + ' coins'); return; }
  }
  _activeTheme = th.id;
  applyTheme();
  save();
  renderShop();
  renderGrid();
  showToast(th.name + ' theme applied');
}

function doPurchase(id) {
  if (typeof Android !== 'undefined') try { Android.purchase(id); } catch(e){}
  else showToast('Purchases not available here');
}

window.onPurchaseComplete = function(id) {
  if (id === 'remove_ads') {
    _adsRemoved = true;
    if (typeof Android !== 'undefined') try { Android.hideBannerAd(); } catch(e){}
    showToast('Ads removed. Thank you!');
  } else if (id === 'coins_small') { _coins += 100; showToast('+100 coins!'); }
  else if (id === 'coins_large') { _coins += 500; showToast('+500 coins!'); }
  save(); updateCoinDisplay();
};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

let _toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

load();
applyTheme();
updateCoinDisplay();
loadLevel(_level);

if (!_adsRemoved && typeof Android !== 'undefined') try { Android.showBannerAd(); } catch(e){}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lights Out</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
#banner { width:100%; height:50px; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:#555; font-size:12px; border-bottom:1px solid #333; }
#header { width:100%; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; background:#1a1a1a; }
h1 { font-size:20px; color:#FDD835; font-weight:700; }
#info { font-size:13px; color:#aaa; }
#controls { display:flex; gap:8px; padding:8px 16px; flex-wrap:wrap; justify-content:center; }
button { background:#1e1e1e; color:#FDD835; border:1.5px solid #FDD835; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; touch-action:manipulation; }
button:active { background:#FDD835; color:#000; }
#msg { padding:6px 16px; text-align:center; font-size:15px; min-height:32px; color:#FDD835; }
#grid { display:inline-grid; gap:6px; padding:10px; background:#1a1a1a; border-radius:10px; border:2px solid #FDD835; margin:8px; }
.cell { width:58px; height:58px; border-radius:8px; cursor:pointer; transition:background 0.12s; touch-action:manipulation; display:flex; align-items:center; justify-content:center; }
.cell.on { background:#FDD835; box-shadow:0 0 12px #FDD835; }
.cell.off { background:#2a2a2a; }
.cell.hint-glow { outline:3px solid #fff; }
#level-select { display:none; flex-wrap:wrap; gap:6px; padding:8px 16px; justify-content:center; max-width:360px; }
.lvl-btn { padding:6px 12px; font-size:13px; min-width:38px; }
.lvl-btn.done { background:#FDD835; color:#000; border-color:#FDD835; }
</style>
</head>
<body>
<div id="banner">Advertisement</div>
<div id="header">
  <h1>Lights Out</h1>
  <span id="info">Level 1 | Moves: 0</span>
</div>
<div id="controls">
  <button onclick="hint()">Hint</button>
  <button onclick="resetLevel()">Reset</button>
  <button onclick="toggleLevelSelect()">Levels</button>
  <button onclick="removeAds()">No Ads</button>
</div>
<div id="msg">Turn all lights OFF!</div>
<div id="grid"></div>
<div id="level-select"></div>

<script>
// 50 solvable 5x5 Lights Out configurations
// Generated by starting from all-off and applying random valid moves
function genSolvable(seed, clicks) {
  const board = Array(25).fill(0);
  let s = seed;
  const lcg = () => { s=(s*1664525+1013904223)>>>0; return s>>>0; };
  const moves = [];
  for (let i=0;i<clicks;i++) {
    const idx = lcg() % 25;
    moves.push(idx);
    toggleAt(board, idx);
  }
  return board;
}

function toggleAt(board, idx) {
  const r=Math.floor(idx/5), c=idx%5;
  board[idx]^=1;
  if (r>0) board[idx-5]^=1;
  if (r<4) board[idx+5]^=1;
  if (c>0) board[idx-1]^=1;
  if (c<4) board[idx+1]^=1;
}

// 50 levels: varied seeds and number of initial clicks (difficulty)
const configs = [
  genSolvable(1,5), genSolvable(2,6), genSolvable(3,7), genSolvable(4,8), genSolvable(5,5),
  genSolvable(6,8), genSolvable(7,9), genSolvable(8,10), genSolvable(9,7), genSolvable(10,8),
  genSolvable(11,10), genSolvable(12,9), genSolvable(13,8), genSolvable(14,11), genSolvable(15,9),
  genSolvable(16,10), genSolvable(17,11), genSolvable(18,8), genSolvable(19,12), genSolvable(20,10),
  genSolvable(21,11), genSolvable(22,13), genSolvable(23,10), genSolvable(24,12), genSolvable(25,11),
  genSolvable(26,12), genSolvable(27,13), genSolvable(28,11), genSolvable(29,14), genSolvable(30,12),
  genSolvable(31,13), genSolvable(32,14), genSolvable(33,12), genSolvable(34,13), genSolvable(35,15),
  genSolvable(36,13), genSolvable(37,14), genSolvable(38,13), genSolvable(39,15), genSolvable(40,14),
  genSolvable(41,15), genSolvable(42,14), genSolvable(43,16), genSolvable(44,15), genSolvable(45,14),
  genSolvable(46,16), genSolvable(47,15), genSolvable(48,17), genSolvable(49,15), genSolvable(50,16),
];

const state = { level:1, board:[], moves:0, removeAds:false, completed:new Set(), hintCell:-1 };

function loadLevel(n) {
  state.level = n;
  state.moves = 0;
  state.hintCell = -1;
  state.board = [...configs[(n-1) % configs.length]];
  document.getElementById('info').textContent = 'Level '+n+' | Moves: 0';
  document.getElementById('msg').textContent = 'Turn all lights OFF!';
  renderGrid();
}

function renderGrid() {
  const g = document.getElementById('grid');
  g.style.gridTemplateColumns = 'repeat(5, 58px)';
  g.innerHTML = '';
  state.board.forEach((v, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell ' + (v ? 'on' : 'off');
    if (i === state.hintCell) cell.classList.add('hint-glow');
    cell.addEventListener('click', () => tapCell(i));
    g.appendChild(cell);
  });
}

function tapCell(idx) {
  state.hintCell = -1;
  toggleAt(state.board, idx);
  state.moves++;
  document.getElementById('info').textContent = 'Level '+state.level+' | Moves: '+state.moves;
  renderGrid();
  if (state.board.every(v=>v===0)) winLevel();
}

// Simple hint: try each cell, pick the one that reduces "on" count the most
function hint() {
  let best=-1, bestScore=Infinity;
  for (let i=0;i<25;i++) {
    const tmp=[...state.board];
    toggleAt(tmp,i);
    const score=tmp.reduce((a,b)=>a+b,0);
    if (score<bestScore) { bestScore=score; best=i; }
  }
  state.hintCell = best;
  document.getElementById('msg').textContent = 'Try the highlighted cell!';
  renderGrid();
}

function resetLevel() { loadLevel(state.level); }

function winLevel() {
  state.completed.add(state.level);
  document.getElementById('msg').textContent = '🎉 All lights out! Level '+(state.level)+' done!';
  buildLevelSelect();
  setTimeout(()=>{
    const next=state.level+1;
    if (!state.removeAds&&next%3===0&&window.Android) Android.showInterstitial();
    if (next<=configs.length) loadLevel(next);
  },1300);
}

function toggleLevelSelect() {
  const ls=document.getElementById('level-select');
  ls.style.display=ls.style.display==='flex'?'none':'flex';
}

function buildLevelSelect() {
  const ls=document.getElementById('level-select');
  ls.innerHTML='';
  configs.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='lvl-btn'+(state.completed.has(i+1)?' done':'');
    b.textContent=i+1;
    b.onclick=()=>{loadLevel(i+1);ls.style.display='none';};
    ls.appendChild(b);
  });
}

function removeAds() {
  if (window.Android) Android.purchaseRemoveAds();
  else { state.removeAds=true; document.getElementById('msg').textContent='Ads removed!'; }
}
window.onPurchaseComplete=function(){state.removeAds=true;};
window.onAdMobLoaded=function(){};

loadLevel(1);
buildLevelSelect();
</script>
</body>
</html>

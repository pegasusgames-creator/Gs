<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#001a1f; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#app { display:flex; height:100%; }
#sidebar { width:90px; display:flex; flex-direction:column; align-items:center; padding:10px 6px; background:#00111a; gap:12px; flex-shrink:0; }
.side-lbl { font-size:0.55rem; text-transform:uppercase; letter-spacing:1px; color:#556; }
.side-val { font-size:1.2rem; font-weight:900; color:#00BCD4; text-align:center; }
#next-canvas { border:2px solid #00BCD4; border-radius:6px; }
#main { flex:1; display:flex; flex-direction:column; }
canvas#c { display:block; }
#controls { display:flex; justify-content:center; align-items:center; gap:8px; padding:8px 4px; background:#00111a; flex-shrink:0; }
.ctrl { width:52px; height:52px; background:#001a1f; border:2px solid #00BCD4; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; cursor:pointer; user-select:none; color:#00BCD4; }
.ctrl:active { background:#002a3f; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:14px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#00BCD4; }
#overlay .sub { color:#aaa; font-size:0.85rem; text-align:center; max-width:280px; }
#overlay .big { font-size:1.2rem; font-weight:800; text-align:center; }
#btn-play { background:#00BCD4; border:none; border-radius:30px; color:#fff; font-size:1.2rem; font-weight:800; padding:14px 48px; cursor:pointer; }
#admob-banner { height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div><div class="side-lbl">Score</div><div class="side-val" id="score-disp">0</div></div>
    <div><div class="side-lbl">Level</div><div class="side-val" id="level-disp">1</div></div>
    <div><div class="side-lbl">Lines</div><div class="side-val" id="lines-disp">0</div></div>
    <div><div class="side-lbl">Best</div><div class="side-val" id="best-disp">0</div></div>
    <div class="side-lbl">Next</div>
    <canvas id="next-canvas" width="80" height="80"></canvas>
  </div>
  <div id="main">
    <canvas id="c"></canvas>
    <div id="controls">
      <div class="ctrl" id="btn-left">◀</div>
      <div class="ctrl" id="btn-rotate">↻</div>
      <div class="ctrl" id="btn-right">▶</div>
      <div class="ctrl" id="btn-down">▼</div>
      <div class="ctrl" id="btn-drop">⬇</div>
    </div>
    <div id="admob-banner">Advertisement</div>
  </div>
</div>
<div id="overlay">
  <h2>Tetris</h2>
  <div class="sub">Swipe left/right to move • Swipe down = soft drop<br>Tap = rotate • Double-tap = hard drop<br>Or use on-screen buttons</div>
  <div class="big" id="final-msg"></div>
  <button id="btn-play">Play!</button>
</div>
<script>
'use strict';
var COLS=10, ROWS=20, CELL=0;
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var nextCanvas=document.getElementById('next-canvas'), nCtx=nextCanvas.getContext('2d');
var best=parseInt(localStorage.getItem('tg_best')||'0');
document.getElementById('best-disp').textContent=best;

var PIECES=[
  {shape:[[1,1,1,1]],color:'#00BCD4'},           // I
  {shape:[[1,1],[1,1]],color:'#FFD600'},           // O
  {shape:[[0,1,0],[1,1,1]],color:'#9C27B0'},       // T
  {shape:[[1,0,0],[1,1,1]],color:'#FF5722'},       // L
  {shape:[[0,0,1],[1,1,1]],color:'#2196F3'},       // J
  {shape:[[0,1,1],[1,1,0]],color:'#4CAF50'},       // S
  {shape:[[1,1,0],[0,1,1]],color:'#E91E63'}        // Z
];

var state={running:false,removeAds:false,
  board:[],current:null,next:null,
  score:0,level:1,lines:0,
  dropTimer:0,dropInterval:600,
  gameOver:false};

function newBoard(){
  var b=[];
  for(var r=0;r<ROWS;r++){b.push(new Array(COLS).fill(0));}
  return b;
}

function randPiece(){
  var p=PIECES[Math.floor(Math.random()*PIECES.length)];
  return{shape:p.shape.map(function(r){return r.slice();}),color:p.color,
    x:Math.floor(COLS/2)-Math.floor(p.shape[0].length/2),y:0};
}

function resize(){
  var sideW=90;
  var availW=window.innerWidth-sideW;
  var controlH=70;
  var bannerH=state.removeAds?0:50;
  var availH=window.innerHeight-controlH-bannerH;
  CELL=Math.min(Math.floor(availW/COLS),Math.floor(availH/ROWS));
  canvas.width=CELL*COLS;canvas.height=CELL*ROWS;
}
resize();window.addEventListener('resize',resize);

function rotate(shape){
  var rows=shape.length,cols=shape[0].length;
  var rot=[];
  for(var c=0;c<cols;c++){rot.push([]);for(var r=rows-1;r>=0;r--)rot[c].push(shape[r][c]);}
  return rot;
}

function valid(shape,ox,oy){
  for(var r=0;r<shape.length;r++){
    for(var c=0;c<shape[r].length;c++){
      if(!shape[r][c])continue;
      var nx=ox+c,ny=oy+r;
      if(nx<0||nx>=COLS||ny>=ROWS)return false;
      if(ny>=0&&state.board[ny][nx])return false;
    }
  }
  return true;
}

function place(){
  var p=state.current;
  for(var r=0;r<p.shape.length;r++){
    for(var c=0;c<p.shape[r].length;c++){
      if(!p.shape[r][c])continue;
      var ny=p.y+r;
      if(ny<0){gameOver();return;}
      state.board[ny][p.x+c]=p.color;
    }
  }
  clearLines();
  state.current=state.next;
  state.next=randPiece();
  drawNext();
  if(!valid(state.current.shape,state.current.x,state.current.y)){gameOver();}
}

function clearLines(){
  var cleared=0;
  for(var r=ROWS-1;r>=0;r--){
    if(state.board[r].every(function(c){return c!==0;})){
      state.board.splice(r,1);
      state.board.unshift(new Array(COLS).fill(0));
      cleared++;r++;
    }
  }
  if(cleared>0){
    var pts=[0,100,300,500,800][cleared]*state.level;
    state.score+=pts;state.lines+=cleared;
    state.level=1+Math.floor(state.lines/10);
    state.dropInterval=Math.max(80,600-state.level*50);
    document.getElementById('score-disp').textContent=state.score;
    document.getElementById('level-disp').textContent=state.level;
    document.getElementById('lines-disp').textContent=state.lines;
  }
}

function softDrop(){if(valid(state.current.shape,state.current.x,state.current.y+1))state.current.y++;else place();}
function hardDrop(){while(valid(state.current.shape,state.current.x,state.current.y+1))state.current.y++;place();}
function moveLeft(){if(valid(state.current.shape,state.current.x-1,state.current.y))state.current.x--;}
function moveRight(){if(valid(state.current.shape,state.current.x+1,state.current.y))state.current.x++;}
function rotatePiece(){var rot=rotate(state.current.shape);if(valid(rot,state.current.x,state.current.y))state.current.shape=rot;}

document.getElementById('btn-left').addEventListener('touchstart',function(e){e.preventDefault();if(state.running)moveLeft();},{passive:false});
document.getElementById('btn-right').addEventListener('touchstart',function(e){e.preventDefault();if(state.running)moveRight();},{passive:false});
document.getElementById('btn-rotate').addEventListener('touchstart',function(e){e.preventDefault();if(state.running)rotatePiece();},{passive:false});
document.getElementById('btn-down').addEventListener('touchstart',function(e){e.preventDefault();if(state.running)softDrop();},{passive:false});
document.getElementById('btn-drop').addEventListener('touchstart',function(e){e.preventDefault();if(state.running)hardDrop();},{passive:false});
['left','right','rotate','down','drop'].forEach(function(n){
  document.getElementById('btn-'+n).addEventListener('mousedown',function(){
    if(!state.running)return;
    if(n==='left')moveLeft();else if(n==='right')moveRight();
    else if(n==='rotate')rotatePiece();else if(n==='down')softDrop();else hardDrop();
  });
});

// Swipe / tap controls on canvas
var touchX0,touchY0,touchT0,lastTap=0;
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  touchX0=e.touches[0].clientX;touchY0=e.touches[0].clientY;touchT0=Date.now();
},{passive:false});
canvas.addEventListener('touchend',function(e){
  if(!state.running)return;
  var dx=e.changedTouches[0].clientX-touchX0;
  var dy=e.changedTouches[0].clientY-touchY0;
  var dt=Date.now()-touchT0;
  if(Math.abs(dx)<15&&Math.abs(dy)<15&&dt<200){
    // Tap = rotate, double-tap = hard drop
    var now=Date.now();
    if(now-lastTap<300){hardDrop();}else{rotatePiece();}
    lastTap=now;
  } else if(Math.abs(dx)>Math.abs(dy)){
    if(dx>20)moveRight();else if(dx<-20)moveLeft();
  } else {
    if(dy>20)softDrop();
  }
},{passive:false});

function gameOver(){
  state.running=false;
  if(state.score>best){best=state.score;localStorage.setItem('tg_best',best);document.getElementById('best-disp').textContent=best;}
  document.getElementById('final-msg').textContent='Score: '+state.score+' | Level: '+state.level+'\nBest: '+best;
  document.getElementById('btn-play').textContent='Play Again';
  document.getElementById('overlay').style.display='flex';
  if(!state.removeAds&&window.Android)Android.showInterstitial();
}

function startGame(){
  state.board=newBoard();state.score=0;state.level=1;state.lines=0;
  state.dropInterval=600;state.dropTimer=0;state.gameOver=false;
  document.getElementById('score-disp').textContent='0';
  document.getElementById('level-disp').textContent='1';
  document.getElementById('lines-disp').textContent='0';
  state.current=randPiece();state.next=randPiece();
  drawNext();
  state.running=true;
  document.getElementById('overlay').style.display='none';
}
document.getElementById('btn-play').addEventListener('click',startGame);

function drawCell(ctx2,x,y,color,cell){
  ctx2.fillStyle=color;
  ctx2.fillRect(x*cell+1,y*cell+1,cell-2,cell-2);
  // shine
  ctx2.fillStyle='rgba(255,255,255,0.2)';
  ctx2.fillRect(x*cell+2,y*cell+2,cell*0.4,cell*0.25);
}

function drawNext(){
  nCtx.fillStyle='#001a1f';nCtx.fillRect(0,0,80,80);
  if(!state.next)return;
  var s=state.next.shape, cell=16;
  var offX=Math.floor((5-s[0].length)/2), offY=Math.floor((5-s.length)/2);
  for(var r=0;r<s.length;r++){
    for(var c=0;c<s[r].length;c++){
      if(s[r][c])drawCell(nCtx,offX+c,offY+r,state.next.color,cell);
    }
  }
}

var lastTime=0;
function loop(ts){
  requestAnimationFrame(loop);
  ctx.fillStyle='#001a1f';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid lines
  ctx.strokeStyle='#003040';ctx.lineWidth=0.5;
  for(var c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,canvas.height);ctx.stroke();}
  for(var r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(canvas.width,r*CELL);ctx.stroke();}

  // Board
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      if(state.board[r][c])drawCell(ctx,c,r,state.board[r][c],CELL);
    }
  }

  if(!state.running)return;

  // Ghost piece
  var ghost=state.current.y;
  while(valid(state.current.shape,state.current.x,ghost+1))ghost++;
  if(ghost!==state.current.y){
    ctx.globalAlpha=0.2;
    for(var r=0;r<state.current.shape.length;r++){
      for(var c=0;c<state.current.shape[r].length;c++){
        if(state.current.shape[r][c])drawCell(ctx,state.current.x+c,ghost+r,state.current.color,CELL);
      }
    }
    ctx.globalAlpha=1;
  }

  // Current piece
  for(var r=0;r<state.current.shape.length;r++){
    for(var c=0;c<state.current.shape[r].length;c++){
      if(state.current.shape[r][c])drawCell(ctx,state.current.x+c,state.current.y+r,state.current.color,CELL);
    }
  }

  // Auto drop
  var dt=ts-lastTime;lastTime=ts;
  state.dropTimer+=dt;
  if(state.dropTimer>=state.dropInterval){
    state.dropTimer=0;
    softDrop();
  }
}
requestAnimationFrame(loop);

if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
window.onAdMobLoaded=function(){};
</script>
</body>
</html>

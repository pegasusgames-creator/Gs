<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fruit Sort</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0a1a00; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#app { display:flex; flex-direction:column; height:100%; }
#hud { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:#060f00; flex-shrink:0; }
.hv { font-size:1.3rem; font-weight:900; color:#4CAF50; }
.hl { font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; color:#446; }
#game-area { flex:1; display:flex; align-items:center; justify-content:center; padding:10px; overflow:hidden; }
#tubes-container { display:flex; gap:10px; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
.tube-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.tube {
  width:52px; min-height:200px;
  background:rgba(255,255,255,0.04);
  border:2px solid rgba(255,255,255,0.18);
  border-top:none;
  border-radius:0 0 26px 26px;
  display:flex; flex-direction:column-reverse;
  align-items:center; padding:4px 2px; gap:2px;
  position:relative; transition:border-color 0.15s;
}
.tube.selected { border-color:#4CAF50; box-shadow:0 0 14px rgba(76,175,80,0.5); }
.tube.complete { border-color:#FFD600; box-shadow:0 0 14px rgba(255,214,0,0.4); }
.fruit-cell { width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:1.7rem; border-radius:10px; background:rgba(255,255,255,0.06); }
.tube-label { font-size:0.65rem; color:#666; }
#btn-row { display:flex; gap:10px; justify-content:center; padding:8px; flex-shrink:0; }
.action-btn { background:#0a1800; border:2px solid #4CAF50; border-radius:20px; color:#4CAF50; font-size:0.9rem; font-weight:700; padding:8px 18px; cursor:pointer; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:14px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#4CAF50; }
#overlay .sub { color:#aaa; font-size:0.9rem; text-align:center; max-width:280px; line-height:1.5; }
#overlay .big { font-size:1.2rem; font-weight:800; text-align:center; }
#btn-play { background:#4CAF50; border:none; border-radius:30px; color:#fff; font-size:1.2rem; font-weight:800; padding:14px 48px; cursor:pointer; }
#admob-banner { height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><div class="hl">Level</div><div class="hv" id="level-disp">1</div></div>
    <div><div class="hl">Moves</div><div class="hv" id="moves-disp">0</div></div>
    <div style="text-align:right"><div class="hl">Best</div><div class="hv" id="best-disp">—</div></div>
  </div>
  <div id="game-area">
    <div id="tubes-container"></div>
  </div>
  <div id="btn-row">
    <button class="action-btn" id="btn-undo">↩ Undo</button>
    <button class="action-btn" id="btn-reset">↺ Reset</button>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<div id="overlay">
  <h2>Fruit Sort</h2>
  <div class="sub">Tap a tube to pick the top fruit.<br>Tap another tube to move it there.<br>Sort all matching fruits into the same tubes!</div>
  <div class="big" id="final-msg"></div>
  <button id="btn-play">Play!</button>
</div>
<script>
'use strict';
var FRUITS=['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝','🍉','🍍'];
var TUBE_CAPACITY=4;

var state={running:false,removeAds:false,level:1,tubes:[],selected:-1,moves:0,history:[]};

function getLevelConfig(level){
  return{colors:Math.min(2+Math.floor((level-1)/2),Math.min(8,FRUITS.length)),emptyTubes:2};
}

function makePuzzle(level){
  var cfg=getLevelConfig(level);
  var fruits=FRUITS.slice(0,cfg.colors);
  var items=[];
  for(var f=0;f<fruits.length;f++){for(var k=0;k<TUBE_CAPACITY;k++)items.push(fruits[f]);}
  // Shuffle
  for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=items[i];items[i]=items[j];items[j]=t;}
  var tubes=[];
  for(var t=0;t<fruits.length;t++){tubes.push(items.slice(t*TUBE_CAPACITY,(t+1)*TUBE_CAPACITY));}
  for(var e=0;e<cfg.emptyTubes;e++)tubes.push([]);
  return tubes;
}

function cloneTubes(tubes){return tubes.map(function(t){return t.slice();});}

function startLevel(){
  state.tubes=makePuzzle(state.level);
  state.selected=-1;state.moves=0;state.history=[];
  document.getElementById('level-disp').textContent=state.level;
  document.getElementById('moves-disp').textContent='0';
  renderTubes();
}

function startGame(){
  state.level=1;
  document.getElementById('overlay').style.display='none';
  state.running=true;
  startLevel();
}
document.getElementById('btn-play').addEventListener('click',startGame);

function isTubeComplete(tube){
  if(tube.length!==TUBE_CAPACITY)return false;
  return tube.every(function(f){return f===tube[0];});
}

function renderTubes(){
  var container=document.getElementById('tubes-container');
  container.innerHTML='';
  state.tubes.forEach(function(tube,i){
    var wrap=document.createElement('div');wrap.className='tube-wrap';
    var tubeEl=document.createElement('div');
    tubeEl.className='tube'+(state.selected===i?' selected':'')+(isTubeComplete(tube)?' complete':'');
    tubeEl.style.minHeight=(TUBE_CAPACITY*50+20)+'px';
    tube.slice().reverse().forEach(function(fruit){
      var cell=document.createElement('div');cell.className='fruit-cell';cell.textContent=fruit;tubeEl.appendChild(cell);
    });
    tubeEl.addEventListener('touchstart',function(e){e.preventDefault();handleTubeTap(i);},{passive:false});
    tubeEl.addEventListener('mousedown',function(){handleTubeTap(i);});
    wrap.appendChild(tubeEl);container.appendChild(wrap);
  });
}

function handleTubeTap(i){
  if(!state.running)return;
  if(state.selected===-1){
    if(state.tubes[i].length===0)return;
    state.selected=i;
  } else {
    if(state.selected===i){state.selected=-1;renderTubes();return;}
    var from=state.tubes[state.selected];
    var to=state.tubes[i];
    var fromTop=from[from.length-1];
    if(to.length>=TUBE_CAPACITY){state.selected=-1;renderTubes();return;}
    if(to.length===0||to[to.length-1]===fromTop){
      state.history.push(cloneTubes(state.tubes));
      to.push(from.pop());
      state.moves++;
      document.getElementById('moves-disp').textContent=state.moves;
    }
    state.selected=-1;
    renderTubes();
    checkWin();
    return;
  }
  renderTubes();
}

function checkWin(){
  var allDone=state.tubes.every(function(tube){return tube.length===0||isTubeComplete(tube);});
  if(allDone){
    var lb=parseInt(localStorage.getItem('fs_best_'+state.level)||'999');
    if(state.moves<lb)localStorage.setItem('fs_best_'+state.level,state.moves);
    if(state.level>=50){
      document.getElementById('final-msg').textContent='All 50 Levels Complete! 🎉\nMoves: '+state.moves;
      document.getElementById('btn-play').textContent='Play Again';
      document.getElementById('overlay').style.display='flex';
      if(!state.removeAds&&window.Android)Android.showInterstitial();
      return;
    }
    setTimeout(function(){state.level++;startLevel();},800);
  }
}

document.getElementById('btn-undo').addEventListener('click',function(){
  if(!state.running||state.history.length===0)return;
  state.tubes=state.history.pop();state.selected=-1;
  state.moves=Math.max(0,state.moves-1);
  document.getElementById('moves-disp').textContent=state.moves;
  renderTubes();
});
document.getElementById('btn-reset').addEventListener('click',function(){if(state.running)startLevel();});

if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
</script>
</body>
</html>

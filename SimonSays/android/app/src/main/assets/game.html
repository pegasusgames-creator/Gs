<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simon Says</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#111; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#app { display:flex; flex-direction:column; height:100%; align-items:center; }
#hud { width:100%; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:#000; flex-shrink:0; }
#hud .lbl { font-size:0.65rem; text-transform:uppercase; letter-spacing:1px; color:#555; }
#hud .val { font-size:1.4rem; font-weight:900; }
#game-area { flex:1; display:flex; align-items:center; justify-content:center; width:100%; }
#simon { position:relative; }
.pad {
  position:absolute; cursor:pointer; border-radius:0;
  transition:filter 0.08s;
}
.pad.lit { filter:brightness(2.5) saturate(1.5); }
#center-btn {
  position:absolute; background:#111; border-radius:50%; z-index:10;
  display:flex; align-items:center; justify-content:center;
  font-size:0.9rem; font-weight:700; text-align:center; color:#aaa;
  cursor:pointer;
}
#status { padding:10px; font-size:0.95rem; color:#aaa; text-align:center; flex-shrink:0; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:14px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#fff; }
#overlay .sub { color:#aaa; text-align:center; }
#overlay .big { font-size:1.4rem; font-weight:800; }
.mode-row { display:flex; gap:10px; }
.mode-btn { background:#222; border:2px solid #555; border-radius:20px; color:#fff; font-size:1rem; font-weight:700; padding:10px 22px; cursor:pointer; }
.mode-btn.active { border-color:#fff; background:#333; }
#btn-play { background:#fff; border:none; border-radius:30px; color:#111; font-size:1.2rem; font-weight:900; padding:14px 48px; cursor:pointer; }
#admob-banner { position:absolute; bottom:0; left:0; right:0; height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><div class="lbl">Round</div><div class="val" id="round-disp">0</div></div>
    <div style="text-align:center"><div class="lbl">Simon Says</div><div class="val" style="font-size:1rem;color:#888" id="mode-disp">Classic</div></div>
    <div style="text-align:right"><div class="lbl">Best</div><div class="val" id="best-disp">0</div></div>
  </div>
  <div id="game-area">
    <div id="simon"></div>
  </div>
  <div id="status" id="status-msg">Tap center to begin</div>
</div>
<div id="overlay">
  <h2>Simon Says</h2>
  <div class="sub">Watch the sequence, repeat it!</div>
  <div class="mode-row">
    <button class="mode-btn active" id="btn-classic">Classic</button>
    <button class="mode-btn" id="btn-speed">Speed</button>
  </div>
  <div class="big" id="final-msg"></div>
  <button id="btn-play">Start!</button>
</div>
<div id="admob-banner">Advertisement</div>
<script>
'use strict';
var COLORS=['#e74c3c','#3498db','#2ecc71','#f1c40f'];
var NAMES=['Red','Blue','Green','Yellow'];
var FREQS=[261,329,392,523]; // C4 E4 G4 C5
var best=parseInt(localStorage.getItem('ss_best')||'0');
document.getElementById('best-disp').textContent=best;

var state={running:false,removeAds:false,
  sequence:[],playerIdx:0,showing:false,round:0,
  mode:'classic',inputEnabled:false};

var audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function beep(freq,dur){
  try{
    var ac=getAudio();
    var osc=ac.createOscillator();
    var gain=ac.createGain();
    osc.connect(gain);gain.connect(ac.destination);
    osc.frequency.value=freq;osc.type='sine';
    gain.gain.setValueAtTime(0.3,ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+dur);
  }catch(e){}
}

// Build Simon board
var SIZE=Math.min(window.innerWidth,window.innerHeight)*0.78;
var simonEl=document.getElementById('simon');
simonEl.style.width=SIZE+'px';simonEl.style.height=SIZE+'px';
var pads=[];
var positions=[
  {top:0,left:0,borderRadius:'100% 0 0 0'},
  {top:0,left:'50%',borderRadius:'0 100% 0 0'},
  {top:'50%',left:0,borderRadius:'0 0 0 100%'},
  {top:'50%',left:'50%',borderRadius:'0 0 100% 0'}
];
for(var i=0;i<4;i++){
  var pad=document.createElement('div');
  pad.className='pad';
  pad.style.width=(SIZE/2-4)+'px';
  pad.style.height=(SIZE/2-4)+'px';
  pad.style.background=COLORS[i];
  pad.style.top=positions[i].top+(typeof positions[i].top==='number'?'px':'');
  pad.style.left=positions[i].left+(typeof positions[i].left==='number'?'px':'');
  pad.style.borderRadius=positions[i].borderRadius;
  pad.style.filter='brightness(0.45)';
  (function(idx){
    pad.addEventListener('touchstart',function(e){e.preventDefault();onPadTap(idx);},{passive:false});
    pad.addEventListener('mousedown',function(){onPadTap(idx);});
  })(i);
  simonEl.appendChild(pad);
  pads.push(pad);
}

var centerBtn=document.createElement('div');
centerBtn.id='center-btn';
var cs=SIZE*0.2;
centerBtn.style.width=cs+'px';centerBtn.style.height=cs+'px';
centerBtn.style.top=(SIZE/2-cs/2)+'px';centerBtn.style.left=(SIZE/2-cs/2)+'px';
centerBtn.textContent='START';
centerBtn.addEventListener('touchstart',function(e){e.preventDefault();startRound();},{passive:false});
centerBtn.addEventListener('mousedown',startRound);
simonEl.appendChild(centerBtn);

function lightPad(idx,on){
  pads[idx].style.filter=on?'brightness(2) saturate(1.3)':'brightness(0.45)';
}

function startGame(){
  state.sequence=[];state.round=0;state.running=true;
  document.getElementById('overlay').style.display='none';
  startRound();
}
document.getElementById('btn-play').addEventListener('click',startGame);

var modeClassic=document.getElementById('btn-classic');
var modeSpeed=document.getElementById('btn-speed');
modeClassic.addEventListener('click',function(){state.mode='classic';modeClassic.classList.add('active');modeSpeed.classList.remove('active');document.getElementById('mode-disp').textContent='Classic';});
modeSpeed.addEventListener('click',function(){state.mode='speed';modeSpeed.classList.add('active');modeClassic.classList.remove('active');document.getElementById('mode-disp').textContent='Speed';});

function startRound(){
  if(!state.running)return;
  state.playerIdx=0;state.showing=true;state.inputEnabled=false;
  state.sequence.push(Math.floor(Math.random()*4));
  state.round=state.sequence.length;
  document.getElementById('round-disp').textContent=state.round;
  setStatus('Watch...');
  centerBtn.textContent='...';
  playSequence();
}

function playSequence(){
  var delay=state.mode==='speed'?300:600;
  var litDur=state.mode==='speed'?250:400;
  var i=0;
  function next(){
    if(i>=state.sequence.length){
      setTimeout(function(){state.showing=false;state.inputEnabled=true;setStatus('Your turn!');centerBtn.textContent='';},400);
      return;
    }
    var idx=state.sequence[i];
    setTimeout(function(){
      lightPad(idx,true);beep(FREQS[idx],litDur/1000);
      setTimeout(function(){lightPad(idx,false);i++;next();},litDur);
    },i===0?600:delay);
    i++;
    // We already incremented, so adjust
    i--; // reset for proper delay calc
    (function(ii){
      var t=ii*(delay+litDur/2)+600;
      setTimeout(function(){
        lightPad(idx,true);beep(FREQS[idx],litDur/1000);
        setTimeout(function(){lightPad(idx,false);},litDur);
        if(ii===state.sequence.length-1){
          setTimeout(function(){state.showing=false;state.inputEnabled=true;setStatus('Your turn!');centerBtn.textContent='';},t+litDur+200-t);
        }
      },t);
    })(i);
    i++;
    if(i<state.sequence.length)return;
    // done scheduling
    i=state.sequence.length; // stop recursion
  }
  // Rewrite cleanly
  playSeqClean();
}

function playSeqClean(){
  var delay=state.mode==='speed'?300:600;
  var litDur=state.mode==='speed'?250:380;
  state.sequence.forEach(function(idx,ii){
    var t=(delay+litDur)*ii+400;
    setTimeout(function(){
      lightPad(idx,true);beep(FREQS[idx],litDur/1000);
      setTimeout(function(){lightPad(idx,false);},litDur);
    },t);
  });
  var totalTime=(delay+litDur)*state.sequence.length+litDur+600;
  setTimeout(function(){
    state.showing=false;state.inputEnabled=true;
    setStatus('Your turn! ('+state.sequence.length+' steps)');
    centerBtn.textContent='';
  },totalTime);
}

// Override playSequence to just call playSeqClean
playSequence=playSeqClean;

function onPadTap(idx){
  if(!state.inputEnabled||!state.running)return;
  lightPad(idx,true);beep(FREQS[idx],0.15);
  setTimeout(function(){lightPad(idx,false);},150);
  if(idx===state.sequence[state.playerIdx]){
    state.playerIdx++;
    if(state.playerIdx>=state.sequence.length){
      state.inputEnabled=false;
      setStatus('Correct! +1');
      centerBtn.textContent='NEXT';
      setTimeout(startRound,800);
    }
  } else {
    // Wrong
    state.inputEnabled=false;
    failFlash();
    setTimeout(function(){
      state.running=false;
      if(state.round-1>best){best=state.round-1;localStorage.setItem('ss_best',best);document.getElementById('best-disp').textContent=best;}
      document.getElementById('final-msg').textContent='Round '+(state.round)+' — Best: '+best;
      document.getElementById('btn-play').textContent='Play Again';
      document.getElementById('overlay').style.display='flex';
      if(!state.removeAds&&window.Android)Android.showInterstitial();
    },800);
  }
}

function failFlash(){
  setStatus('Wrong!');
  for(var i=0;i<4;i++)lightPad(i,true);
  beep(120,0.5);
  setTimeout(function(){for(var i=0;i<4;i++)lightPad(i,false);},500);
}

function setStatus(msg){document.getElementById('status').textContent=msg;}

if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
window.onAdMobLoaded=function(){};
</script>
</body>
</html>

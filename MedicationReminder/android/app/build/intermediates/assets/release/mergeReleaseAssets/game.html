<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dice Roller</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#e94560; --accent2:#533483; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }

/* Dice display area */
#dice-area { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; min-height:120px; align-items:center; padding:10px 0; }
.die {
  width:84px; height:84px;
  background:var(--card);
  border-radius:16px;
  border:2px solid rgba(233,69,96,0.4);
  display:flex; align-items:center; justify-content:center;
  font-size:2.4rem; font-weight:900;
  color:var(--accent);
  cursor:pointer;
  user-select:none;
  transition:transform 0.08s;
  position:relative;
  overflow:hidden;
}
.die.rolling {
  animation:shake 0.4s ease-out;
}
@keyframes shake {
  0%  { transform:rotate(-8deg) scale(1.05); }
  20% { transform:rotate(8deg)  scale(1.08); }
  40% { transform:rotate(-6deg) scale(1.06); }
  60% { transform:rotate(6deg)  scale(1.07); }
  80% { transform:rotate(-3deg) scale(1.03); }
  100%{ transform:rotate(0deg)  scale(1); }
}
.die.btn-pressed { transform:scale(0.9); }

/* Die type selector */
.die-types { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
.dtype-btn { background:var(--card); border:2px solid transparent; border-radius:8px; color:var(--muted); font-size:0.8rem; font-weight:700; padding:6px 10px; cursor:pointer; }
.dtype-btn.active { border-color:var(--accent); color:var(--accent); }
.dtype-btn.btn-pressed { transform:scale(0.9); }

/* Count row */
.count-row { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.count-label { font-size:0.9rem; color:var(--muted); }
.count-ctrl { display:flex; align-items:center; gap:12px; }
.count-btn { width:34px; height:34px; border-radius:50%; background:var(--card); border:2px solid var(--accent); color:var(--accent); font-size:1.3rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.count-btn.btn-pressed { transform:scale(0.88); }
#dice-count-disp { font-size:1.2rem; font-weight:700; min-width:24px; text-align:center; }

/* Roll button */
#btn-roll {
  width:100%;
  background:linear-gradient(135deg,var(--accent),#c0392b);
  border:none; border-radius:var(--radius);
  color:#fff; font-size:1.3rem; font-weight:800;
  padding:18px; cursor:pointer;
  margin-bottom:12px;
  box-shadow:0 6px 20px rgba(233,69,96,0.45);
}
#btn-roll.btn-pressed { transform:scale(0.97); }

/* Stats */
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.stat-label { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); margin-bottom:3px; }
.stat-val { font-size:1.2rem; font-weight:700; }

/* History */
#history-list { display:flex; flex-direction:column; gap:6px; }
.history-item { background:var(--card); border-radius:8px; padding:8px 12px; display:flex; justify-content:space-between; font-size:0.85rem; }
.history-dice { color:var(--muted); }
.history-sum { color:var(--accent); font-weight:700; }

#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Dice <span>Roller</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">

    <!-- Dice display -->
    <div class="card">
      <div class="card-title">Your Roll</div>
      <div id="dice-area"></div>
    </div>

    <!-- Settings -->
    <div class="card">
      <div class="card-title">Die Type</div>
      <div class="die-types" id="die-types"></div>
      <div class="count-row">
        <span class="count-label">Number of dice</span>
        <div class="count-ctrl">
          <button class="count-btn" id="btn-minus">−</button>
          <span id="dice-count-disp">2</span>
          <button class="count-btn" id="btn-plus">+</button>
        </div>
      </div>
    </div>

    <!-- Roll button -->
    <button id="btn-roll">🎲 Roll!</button>

    <!-- Stats -->
    <div class="card">
      <div class="card-title">Last Roll</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-label">Sum</div><div class="stat-val" id="stat-sum">—</div></div>
        <div class="stat-box"><div class="stat-label">Min</div><div class="stat-val" id="stat-min">—</div></div>
        <div class="stat-box"><div class="stat-label">Max</div><div class="stat-val" id="stat-max">—</div></div>
      </div>
    </div>

    <!-- History -->
    <div class="card">
      <div class="card-title">History</div>
      <div id="history-list"><div style="color:var(--muted);font-size:0.85rem">No rolls yet</div></div>
    </div>

  </div>
  <div id="admob-banner">Advertisement</div>
</div>

<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button,.die,.dtype-btn,.count-btn');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var DIE_TYPES=[4,6,8,10,12,20,100];
var state={sides:6,count:2,useCount:0,removeAds:false};
var history=[];

var diceArea=document.getElementById('dice-area');
var dieTypesEl=document.getElementById('die-types');
var diceCountDisp=document.getElementById('dice-count-disp');

// Build die type buttons
DIE_TYPES.forEach(function(s){
  var btn=document.createElement('button');
  btn.className='dtype-btn'+(s===6?' active':'');
  btn.textContent='D'+s;
  btn.addEventListener('click',function(){
    document.querySelectorAll('.dtype-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    state.sides=s;
    renderDice();
  });
  dieTypesEl.appendChild(btn);
});

function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function renderDice(values){
  diceArea.innerHTML='';
  for(var i=0;i<state.count;i++){
    var die=document.createElement('div');
    die.className='die';
    die.textContent=values?values[i]:'?';
    (function(idx){
      die.addEventListener('click',function(){rollSingle(idx);});
    })(i);
    diceArea.appendChild(die);
  }
}

function rollAll(){
  var vals=[];
  for(var i=0;i<state.count;i++) vals.push(randInt(1,state.sides));
  animateRoll(vals);
  updateStats(vals);
  addHistory(vals);
  state.useCount++;
  if(!state.removeAds&&state.useCount%7===0&&window.Android) Android.showInterstitial();
}

function rollSingle(idx){
  var dies=diceArea.querySelectorAll('.die');
  var val=randInt(1,state.sides);
  dies[idx].textContent=val;
  dies[idx].classList.remove('rolling');
  void dies[idx].offsetWidth;
  dies[idx].classList.add('rolling');
  setTimeout(function(){dies[idx].classList.remove('rolling');},420);
}

function animateRoll(finalVals){
  var dies=diceArea.querySelectorAll('.die');
  dies.forEach(function(d){
    d.classList.remove('rolling');
    void d.offsetWidth;
    d.classList.add('rolling');
  });
  // Quick flicker then show final
  var steps=6, interval=50;
  for(var s=0;s<steps;s++){
    (function(step){
      setTimeout(function(){
        dies.forEach(function(d){d.textContent=randInt(1,state.sides);});
        if(step===steps-1){
          setTimeout(function(){
            finalVals.forEach(function(v,i){dies[i].textContent=v;});
            dies.forEach(function(d){d.classList.remove('rolling');});
          },80);
        }
      },step*interval);
    })(s);
  }
}

function updateStats(vals){
  document.getElementById('stat-sum').textContent=vals.reduce(function(a,b){return a+b;},0);
  document.getElementById('stat-min').textContent=Math.min.apply(null,vals);
  document.getElementById('stat-max').textContent=Math.max.apply(null,vals);
}

function addHistory(vals){
  history.unshift({sides:state.sides,vals:vals.slice(),sum:vals.reduce(function(a,b){return a+b;},0)});
  if(history.length>10) history.pop();
  var el=document.getElementById('history-list');
  el.innerHTML='';
  history.forEach(function(h){
    var item=document.createElement('div');
    item.className='history-item';
    item.innerHTML='<span class="history-dice">'+h.count+'×D'+h.sides+': ['+h.vals.join(', ')+']</span><span class="history-sum">'+h.sum+'</span>';
    // patch count
    item.querySelector('.history-dice').textContent=h.vals.length+'×D'+h.sides+': ['+h.vals.join(', ')+']';
    el.appendChild(item);
  });
}

document.getElementById('btn-roll').addEventListener('click',function(){
  renderDice();
  setTimeout(rollAll,10);
});

document.getElementById('btn-minus').addEventListener('click',function(){
  if(state.count>1){state.count--;diceCountDisp.textContent=state.count;renderDice();}
});
document.getElementById('btn-plus').addEventListener('click',function(){
  if(state.count<8){state.count++;diceCountDisp.textContent=state.count;renderDice();}
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';}};

function init(){
  if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';
  renderDice();
}
window.onAdMobLoaded=function(){};
init();
</script>
</body>
</html>

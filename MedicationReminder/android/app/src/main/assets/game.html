<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Medication Reminder</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0d1b2e; --surface:#16213e; --card:#0f3460; --accent:#42A5F5; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.ig { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
.ig label { font-size:0.72rem; color:var(--muted); }
.ig input, .ig select, .ig textarea { background:var(--card); border:1px solid rgba(66,165,245,0.2); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.95rem; width:100%; }
.ig textarea { resize:none; height:56px; }
.row2 { display:flex; gap:8px; } .row2 .ig { flex:1; }
.btn-p { background:var(--accent); border:none; color:#0d1b2e; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; width:100%; margin-top:4px; }
.med-item { background:var(--card); border-radius:10px; padding:12px; margin-bottom:10px; }
.med-header { display:flex; justify-content:space-between; align-items:flex-start; }
.med-name { font-size:1rem; font-weight:700; color:var(--accent); }
.med-dose { font-size:0.8rem; color:var(--muted); }
.med-freq { font-size:0.75rem; color:var(--muted); margin-top:2px; }
.med-actions { display:flex; gap:8px; margin-top:8px; }
.take-btn { background:var(--accent); border:none; color:#0d1b2e; border-radius:8px; padding:7px 16px; font-size:0.85rem; font-weight:700; cursor:pointer; flex:1; }
.take-btn.taken { background:#2e7d32; color:#fff; }
.del-btn { background:rgba(239,83,80,0.15); border:none; color:#ef5350; border-radius:8px; padding:7px 12px; font-size:0.85rem; cursor:pointer; }
.history-row { display:flex; justify-content:space-between; font-size:0.8rem; padding:7px 0; border-bottom:1px solid rgba(66,165,245,0.1); }
.history-row:last-child { border-bottom:none; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px 0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Medication <span>Reminder</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Add Medication</div>
      <div class="row2">
        <div class="ig"><label>Medication Name</label><input type="text" id="i-name" placeholder="Metformin..."></div>
        <div class="ig"><label>Dose</label><input type="text" id="i-dose" placeholder="500mg"></div>
      </div>
      <div class="ig"><label>Frequency</label>
        <select id="i-freq">
          <option value="daily">Once daily</option>
          <option value="twice">Twice daily</option>
          <option value="thrice">Three times daily</option>
          <option value="weekly">Weekly</option>
          <option value="asneeded">As needed</option>
        </select>
      </div>
      <div class="ig"><label>Notes (optional)</label><textarea id="i-notes" placeholder="Take with food..."></textarea></div>
      <button class="btn-p" id="btn-add">Add Medication</button>
    </div>
    <div class="card">
      <div class="card-title">Today's Medications</div>
      <div id="meds-list"><div class="empty">No medications added yet.</div></div>
    </div>
    <div class="card">
      <div class="card-title">Recent History</div>
      <div id="history-list"><div class="empty">No history yet.</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var meds=JSON.parse(localStorage.getItem('med_meds')||'[]');
var history=JSON.parse(localStorage.getItem('med_hist')||'[]');
function save(){localStorage.setItem('med_meds',JSON.stringify(meds));localStorage.setItem('med_hist',JSON.stringify(history));}
function todayKey(){return new Date().toISOString().slice(0,10);}
var freqLabels={daily:'Once daily',twice:'Twice daily',thrice:'3x daily',weekly:'Weekly',asneeded:'As needed'};
function fmtT(ts){var d=new Date(ts);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}

function render(){
  var el=document.getElementById('meds-list');
  if(!meds.length){el.innerHTML='<div class="empty">No medications added yet.</div>';return;}
  var today=todayKey();
  el.innerHTML='';
  meds.forEach(function(m,idx){
    var takenToday=m.taken&&m.taken.indexOf(today)>=0;
    var div=document.createElement('div');
    div.className='med-item';
    div.innerHTML='<div class="med-header"><div><div class="med-name">'+m.name+'</div><div class="med-dose">'+m.dose+'</div><div class="med-freq">'+freqLabels[m.freq]+(m.notes?' &bull; '+m.notes:'')+'</div></div></div>'+
      '<div class="med-actions">'+
      '<button class="take-btn'+(takenToday?' taken':'')+'" data-idx="'+idx+'">'+(takenToday?'Taken Today':'Take Now')+'</button>'+
      '<button class="del-btn" data-idx="'+idx+'">Remove</button></div>';
    el.appendChild(div);
  });
  el.querySelectorAll('.take-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var idx=parseInt(b.dataset.idx);
      var m=meds[idx];
      if(!m.taken)m.taken=[];
      var today2=todayKey();
      if(m.taken.indexOf(today2)<0){m.taken.push(today2);if(m.taken.length>100)m.taken=m.taken.slice(-100);}
      history.unshift({name:m.name,dose:m.dose,ts:Date.now()});
      if(history.length>100)history=history.slice(0,100);
      save();render();renderHistory();maybeInterstitial();
    });
  });
  el.querySelectorAll('.del-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var idx=parseInt(b.dataset.idx);
      if(confirm('Remove '+meds[idx].name+'?')){meds.splice(idx,1);save();render();}
    });
  });
}

function renderHistory(){
  var el=document.getElementById('history-list');
  if(!history.length){el.innerHTML='<div class="empty">No history yet.</div>';return;}
  el.innerHTML=history.slice(0,20).map(function(h){
    return '<div class="history-row"><span>'+h.name+' '+h.dose+'</span><span style="color:var(--muted);">'+fmtT(h.ts)+'</span></div>';
  }).join('');
}

document.getElementById('btn-add').addEventListener('click',function(){
  var name=document.getElementById('i-name').value.trim();
  if(!name){alert('Enter a medication name.');return;}
  var dose=document.getElementById('i-dose').value.trim()||'';
  var freq=document.getElementById('i-freq').value;
  var notes=document.getElementById('i-notes').value.trim();
  meds.push({name:name,dose:dose,freq:freq,notes:notes,taken:[]});
  save();
  document.getElementById('i-name').value='';
  document.getElementById('i-dose').value='';
  document.getElementById('i-notes').value='';
  render();
});

render();renderHistory();
</script>
</body>
</html>

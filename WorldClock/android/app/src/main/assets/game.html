<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>World Clock</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#5C6BC0; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 12px 12px; }
/* Clock card */
.tz-card { display:flex; align-items:center; justify-content:space-between; background:var(--surface); border-radius:12px; padding:12px 14px; margin-bottom:8px; gap:10px; }
.tz-left { flex:1; min-width:0; }
.tz-city { font-size:0.95rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tz-region { font-size:0.7rem; color:var(--muted); margin-top:2px; }
.tz-right { text-align:right; flex-shrink:0; }
.tz-time { font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent); letter-spacing:1px; }
.tz-date { font-size:0.7rem; color:var(--muted); margin-top:2px; }
.tz-ampm { font-size:0.75rem; color:var(--muted); margin-left:3px; }
/* Toggle checkboxes */
.tz-toggle { cursor:pointer; }
.tz-toggle input { display:none; }
.tz-chk { width:20px; height:20px; border-radius:6px; border:2px solid var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; }
.tz-toggle input:checked ~ .tz-chk { background:var(--accent); border-color:var(--accent); }
.tz-chk::after { content:'✓'; color:#fff; font-size:0.75rem; display:none; }
.tz-toggle input:checked ~ .tz-chk::after { display:block; }
/* Toggle section */
.toggle-section { background:var(--surface); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
.toggle-section .card-title { font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:8px; }
.toggle-grid { display:flex; flex-wrap:wrap; gap:6px; }
.tog-chip { padding:6px 12px; border:none; border-radius:20px; font-size:0.75rem; cursor:pointer; background:var(--card); color:var(--text); transition:all 0.15s; }
.tog-chip.on { background:var(--accent); color:#fff; font-weight:700; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>World <span>Clock</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div id="clocks-list"></div>
    <div class="toggle-section">
      <div class="card-title">Toggle Cities</div>
      <div class="toggle-grid" id="toggle-grid"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var ZONES = [
  {city:'New York',    region:'USA – Eastern',    tz:'America/New_York'},
  {city:'Los Angeles', region:'USA – Pacific',    tz:'America/Los_Angeles'},
  {city:'Chicago',     region:'USA – Central',    tz:'America/Chicago'},
  {city:'São Paulo',   region:'Brazil',            tz:'America/Sao_Paulo'},
  {city:'London',      region:'UK',                tz:'Europe/London'},
  {city:'Paris',       region:'France',            tz:'Europe/Paris'},
  {city:'Dubai',       region:'UAE',               tz:'Asia/Dubai'},
  {city:'Singapore',   region:'Singapore',         tz:'Asia/Singapore'},
  {city:'Tokyo',       region:'Japan',             tz:'Asia/Tokyo'},
  {city:'Sydney',      region:'Australia',         tz:'Australia/Sydney'},
];

var state = { useCount:0, removeAds:false, shown: ZONES.map(function(){return true;}) };
var STORE='wc_shown';
try{var sv=JSON.parse(localStorage.getItem(STORE));if(sv&&sv.length===ZONES.length)state.shown=sv;}catch(e){}

function saveShown(){localStorage.setItem(STORE,JSON.stringify(state.shown));}

function toggleZone(i) {
  state.shown[i]=!state.shown[i];
  saveShown();
  renderToggles();
  renderClocks();
}

function getTime(tz) {
  try {
    var d=new Date();
    var opts={timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true};
    var t=new Intl.DateTimeFormat('en-US',opts).format(d);
    var dopts={timeZone:tz,weekday:'short',month:'short',day:'numeric'};
    var dt=new Intl.DateTimeFormat('en-US',dopts).format(d);
    return {time:t,date:dt};
  } catch(e){return {time:'--:--',date:''};}
}

function renderClocks() {
  var el=document.getElementById('clocks-list');
  el.innerHTML=ZONES.map(function(z,i){
    if(!state.shown[i])return '';
    var r=getTime(z.tz);
    // split time and AM/PM
    var parts=r.time.match(/^(\d+:\d+:\d+)\s*(AM|PM)?$/i)||[];
    var tstr=parts[1]||r.time, ampm=parts[2]||'';
    return '<div class="tz-card">'+
      '<div class="tz-left"><div class="tz-city">'+z.city+'</div><div class="tz-region">'+z.region+'</div></div>'+
      '<div class="tz-right"><div class="tz-time">'+tstr+'<span class="tz-ampm">'+ampm+'</span></div><div class="tz-date">'+r.date+'</div></div>'+
      '</div>';
  }).join('');
}

function renderToggles() {
  var el=document.getElementById('toggle-grid');
  el.innerHTML=ZONES.map(function(z,i){
    return '<button class="tog-chip'+(state.shown[i]?' on':'')+'" onclick="toggleZone('+i+')">'+z.city+'</button>';
  }).join('');
}

renderToggles();
renderClocks();
setInterval(renderClocks,1000);

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

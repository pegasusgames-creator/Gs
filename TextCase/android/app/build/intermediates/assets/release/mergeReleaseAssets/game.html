<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Text Case</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#FF8F00; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
/* Input area */
#input-wrap { padding:0 14px 8px; flex-shrink:0; }
#input-text { width:100%; padding:12px; border-radius:12px; border:none; background:var(--surface); color:var(--text); font-size:0.9rem; resize:none; height:90px; font-family:inherit; }
#input-stats { display:flex; gap:14px; padding:4px 2px; font-size:0.72rem; color:var(--muted); }
/* Conversion buttons */
#btn-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; padding:0 14px 8px; flex-shrink:0; }
.conv-btn { padding:10px 6px; border:none; border-radius:10px; background:var(--card); color:var(--text); font-size:0.75rem; font-weight:600; cursor:pointer; text-align:center; }
.conv-btn.active { background:var(--accent); color:#fff; }
/* Output */
#output-wrap { flex:1; padding:0 14px 10px; display:flex; flex-direction:column; min-height:0; }
#output-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:6px; }
#output-box { flex:1; background:var(--surface); border-radius:12px; padding:12px; font-size:0.9rem; color:var(--accent); overflow-y:auto; -webkit-overflow-scrolling:touch; word-break:break-all; min-height:60px; }
#copy-btn { margin-top:8px; background:var(--accent); border:none; border-radius:10px; color:#fff; font-size:0.9rem; font-weight:700; padding:12px; cursor:pointer; width:100%; }
#copy-btn.copied { background:#2E7D32; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Text <span>Case</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="input-wrap">
    <textarea id="input-text" placeholder="Type or paste text here…" oninput="onInput()"></textarea>
    <div id="input-stats">
      <span id="stat-chars">0 chars</span>
      <span id="stat-words">0 words</span>
    </div>
  </div>
  <div id="btn-grid">
    <button class="conv-btn" onclick="convert('upper',this)">UPPERCASE</button>
    <button class="conv-btn" onclick="convert('lower',this)">lowercase</button>
    <button class="conv-btn" onclick="convert('title',this)">Title Case</button>
    <button class="conv-btn" onclick="convert('sentence',this)">Sentence</button>
    <button class="conv-btn" onclick="convert('camel',this)">camelCase</button>
    <button class="conv-btn" onclick="convert('pascal',this)">PascalCase</button>
    <button class="conv-btn" onclick="convert('snake',this)">snake_case</button>
    <button class="conv-btn" onclick="convert('kebab',this)">kebab-case</button>
    <button class="conv-btn" onclick="convert('screaming',this)">SCREAMING</button>
  </div>
  <div id="output-wrap">
    <div id="output-label">Result</div>
    <div id="output-box">Select a conversion above…</div>
    <button id="copy-btn" onclick="copyResult()">Copy to Clipboard</button>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var S = { useCount:0, removeAds:false, lastResult:'', curMode:'' };

function onInput(){
  var txt=document.getElementById('input-text').value;
  var words=txt.trim()?txt.trim().split(/\s+/).length:0;
  document.getElementById('stat-chars').textContent=txt.length+' chars';
  document.getElementById('stat-words').textContent=words+' words';
  if(S.curMode) convert(S.curMode,null);
}

function toWords(txt){
  return txt.replace(/([a-z])([A-Z])/g,'$1 $2')
            .replace(/[_\-]+/g,' ')
            .replace(/\s+/g,' ')
            .trim().split(' ').filter(Boolean);
}

function convert(mode,btn){
  var txt=document.getElementById('input-text').value;
  if(!txt){document.getElementById('output-box').textContent='Enter text above.';return;}
  S.curMode=mode;

  if(btn){
    document.querySelectorAll('.conv-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
  }

  var result='';
  switch(mode){
    case 'upper': result=txt.toUpperCase(); break;
    case 'lower': result=txt.toLowerCase(); break;
    case 'title': result=txt.toLowerCase().replace(/(?:^|\s)\S/g,function(a){return a.toUpperCase();}); break;
    case 'sentence': result=txt.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,function(a){return a.toUpperCase();}); break;
    case 'camel':
      var ws=toWords(txt);
      result=ws.map(function(w,i){return i===0?w.toLowerCase():w[0].toUpperCase()+w.slice(1).toLowerCase();}).join(''); break;
    case 'pascal':
      result=toWords(txt).map(function(w){return w[0].toUpperCase()+w.slice(1).toLowerCase();}).join(''); break;
    case 'snake':
      result=toWords(txt).map(function(w){return w.toLowerCase();}).join('_'); break;
    case 'kebab':
      result=toWords(txt).map(function(w){return w.toLowerCase();}).join('-'); break;
    case 'screaming':
      result=toWords(txt).map(function(w){return w.toUpperCase();}).join('_'); break;
  }
  S.lastResult=result;
  document.getElementById('output-box').textContent=result;
  maybeInterstitial();
}

function copyResult(){
  if(!S.lastResult)return;
  var btn=document.getElementById('copy-btn');
  if(navigator.clipboard){
    navigator.clipboard.writeText(S.lastResult).then(function(){
      btn.textContent='Copied!';btn.classList.add('copied');
      setTimeout(function(){btn.textContent='Copy to Clipboard';btn.classList.remove('copied');},1500);
    }).catch(function(){fallbackCopy();});
  } else { fallbackCopy(); }
}

function fallbackCopy(){
  var ta=document.createElement('textarea');
  ta.value=S.lastResult;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  document.execCommand('copy');document.body.removeChild(ta);
  var btn=document.getElementById('copy-btn');
  btn.textContent='Copied!';btn.classList.add('copied');
  setTimeout(function(){btn.textContent='Copy to Clipboard';btn.classList.remove('copied');},1500);
}

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

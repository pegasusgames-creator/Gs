// -------------------------------------------------------
// app/build.gradle
// -------------------------------------------------------
plugins {
    id 'com.android.application'
}

// Load signing credentials from keystore.properties (never commit that file)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36

    namespace "com.pegasusgames.ballsort"

    defaultConfig {
        applicationId "com.pegasusgames.ballsort"
        minSdk 23
        targetSdk 36
        versionCode 15
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // AppLovin MAX (ad mediation — replaces direct AdMob dependency)
    // Setup: dash.applovin.com → Apps → Add New App → Ad Units → create Banner/Inter/Rewarded
    implementation 'com.applovin:applovin-sdk:13.+'
    // AdMob mediation adapter — keeps AdMob demand via MAX auction
    // Still requires AdMob app ID in AndroidManifest + google-services.json
    implementation 'com.applovin.mediation:google-adapter:23.+'
    // Optional additional adapters (add more networks for higher eCPM):
    // implementation 'com.applovin.mediation:meta-adapter:6.+'
    // implementation 'com.applovin.mediation:unity-adapter:4.+'

    // Google Play Billing
    implementation 'com.android.billingclient:billing:8.3.0'

    // Firebase Analytics — requires google-services.json in app/ folder
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-analytics'

    // Play In-App Review
    implementation 'com.google.android.play:review:2.0.2'

    // Core Android
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
}

// Must be at bottom — apply after dependencies declared
apply plugin: 'com.google.gms.google-services'

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grocery List</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#66BB6A; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
/* List selector */
#list-bar { display:flex; gap:6px; padding:0 14px 8px; overflow-x:auto; flex-shrink:0; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
#list-bar::-webkit-scrollbar { display:none; }
.list-chip { padding:6px 14px; border:none; border-radius:20px; font-size:0.78rem; cursor:pointer; background:var(--card); color:var(--text); white-space:nowrap; flex-shrink:0; }
.list-chip.active { background:var(--accent); color:#1a1a2e; font-weight:700; }
.list-chip.new { background:var(--surface); border:1px solid var(--card); }
/* Add form */
#add-bar { display:flex; gap:7px; padding:0 14px 10px; flex-shrink:0; }
#add-bar input[type=text] { flex:1; padding:10px 12px; border-radius:10px; border:none; background:var(--surface); color:var(--text); font-size:0.9rem; }
#add-bar input.qty { width:60px; }
#add-bar select { padding:10px 8px; border-radius:10px; border:none; background:var(--surface); color:var(--text); font-size:0.82rem; -webkit-appearance:none; }
#add-bar button { padding:10px 14px; border:none; border-radius:10px; background:var(--accent); color:#1a1a2e; font-weight:700; font-size:1rem; cursor:pointer; }
/* Action bar */
#action-bar { display:flex; gap:8px; padding:0 14px 8px; flex-shrink:0; }
.ab-btn { flex:1; padding:9px 6px; border:none; border-radius:10px; font-size:0.78rem; font-weight:600; cursor:pointer; background:var(--card); color:var(--text); }
.ab-btn.danger { color:#EF5350; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 12px; }
/* Category sections */
.cat-section { margin-bottom:10px; }
.cat-label { font-size:0.68rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); padding:4px 2px; }
/* Items */
.grocery-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border-radius:10px; margin-bottom:5px; }
.gi-check { width:22px; height:22px; border-radius:7px; border:2px solid var(--muted); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.gi-check.checked { background:var(--accent); border-color:var(--accent); }
.gi-check.checked::after { content:'✓'; color:#1a1a2e; font-size:0.85rem; font-weight:700; }
.gi-name { flex:1; font-size:0.9rem; }
.grocery-item.checked .gi-name { text-decoration:line-through; color:var(--muted); }
.gi-qty { font-size:0.78rem; color:var(--muted); margin-right:4px; }
.gi-del { background:none; border:none; color:#FF7043; cursor:pointer; font-size:0.9rem; padding:0 2px; }
.empty-msg { text-align:center; color:var(--muted); padding:24px 0; font-size:0.85rem; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Grocery <span>List</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="list-bar"></div>
  <div id="add-bar">
    <input type="text" id="item-name" placeholder="Add item…" maxlength="40">
    <input type="text" class="qty" id="item-qty" placeholder="Qty">
    <select id="item-cat">
      <option value="Produce">🥦 Produce</option>
      <option value="Dairy">🧀 Dairy</option>
      <option value="Meat">🥩 Meat</option>
      <option value="Bakery">🍞 Bakery</option>
      <option value="Frozen">🧊 Frozen</option>
      <option value="Other">📦 Other</option>
    </select>
    <button onclick="addItem()">+</button>
  </div>
  <div id="action-bar">
    <button class="ab-btn" onclick="clearChecked()">Clear Checked</button>
    <button class="ab-btn danger" onclick="clearAll()">Clear All</button>
    <button class="ab-btn" onclick="newList()">New List</button>
  </div>
  <div id="scroll"><div id="items-area"></div></div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var STORE='grocery_data';
var CATS=['Produce','Dairy','Meat','Bakery','Frozen','Other'];
var S = { useCount:0, removeAds:false, lists:[], curList:0, nextId:1 };

function load(){
  try{var d=JSON.parse(localStorage.getItem(STORE)||'null');
    if(d){S.lists=d.lists||[];S.nextId=d.nextId||1;S.curList=Math.min(d.curList||0,S.lists.length-1);}
  }catch(e){}
  if(!S.lists.length){S.lists=[{name:'My List',items:[]}];S.curList=0;}
}
function save(){localStorage.setItem(STORE,JSON.stringify({lists:S.lists,nextId:S.nextId,curList:S.curList}));}

function curItems(){return S.lists[S.curList]?S.lists[S.curList].items:[];}

function addItem(){
  var name=document.getElementById('item-name').value.trim();
  if(!name)return;
  var qty=document.getElementById('item-qty').value.trim();
  var cat=document.getElementById('item-cat').value;
  curItems().push({id:S.nextId++,name:name,qty:qty,cat:cat,checked:false});
  save();
  document.getElementById('item-name').value='';
  document.getElementById('item-qty').value='';
  render();
  maybeInterstitial();
}

function toggleItem(id){
  var item=curItems().find(function(x){return x.id===id;});
  if(item){item.checked=!item.checked;save();render();}
}

function deleteItem(id){
  S.lists[S.curList].items=curItems().filter(function(x){return x.id!==id;});
  save();render();
}

function clearChecked(){
  S.lists[S.curList].items=curItems().filter(function(x){return !x.checked;});
  save();render();
}

function clearAll(){
  if(confirm('Clear all items?')){S.lists[S.curList].items=[];save();render();}
}

function newList(){
  var name=prompt('List name:','List '+(S.lists.length+1));
  if(!name)return;
  S.lists.push({name:name.trim(),items:[]});
  S.curList=S.lists.length-1;
  save();renderListBar();render();
}

function switchList(i){S.curList=i;save();renderListBar();render();}

function renderListBar(){
  var el=document.getElementById('list-bar');
  el.innerHTML=S.lists.map(function(l,i){
    return '<button class="list-chip'+(i===S.curList?' active':'')+'" onclick="switchList('+i+')">'+esc(l.name)+'</button>';
  }).join('');
}

function render(){
  var items=curItems();
  var area=document.getElementById('items-area');
  if(!items.length){area.innerHTML='<div class="empty-msg">List is empty. Add items above.</div>';return;}
  var html='';
  CATS.forEach(function(cat){
    var ci=items.filter(function(x){return x.cat===cat;});
    if(!ci.length)return;
    html+='<div class="cat-section"><div class="cat-label">'+cat+'</div>';
    html+=ci.map(function(item){
      return '<div class="grocery-item'+(item.checked?' checked':'')+'">'+
        '<div class="gi-check'+(item.checked?' checked':'')+'" onclick="toggleItem('+item.id+')"></div>'+
        '<span class="gi-name">'+esc(item.name)+'</span>'+
        (item.qty?'<span class="gi-qty">'+esc(item.qty)+'</span>':'')+
        '<button class="gi-del" onclick="deleteItem('+item.id+')">&#10005;</button></div>';
    }).join('');
    html+='</div>';
  });
  area.innerHTML=html;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

load();renderListBar();render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

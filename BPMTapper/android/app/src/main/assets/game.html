<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BPM Tapper</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#AB47BC; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
/* BPM display */
#bpm-card { text-align:center; padding:20px 16px; }
#bpm-num { font-size:6rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1; transition:transform 0.08s; }
#bpm-num.flash { transform:scale(1.05); }
#tempo-name { font-size:1.1rem; color:var(--muted); margin-top:6px; letter-spacing:2px; text-transform:uppercase; }
#tap-count { font-size:0.8rem; color:var(--muted); margin-top:4px; }
/* Tap button */
#tap-btn { width:100%; padding:40px 20px; border:none; border-radius:20px; background:var(--accent); color:#fff; font-size:1.4rem; font-weight:700; cursor:pointer; letter-spacing:2px; transition:transform 0.08s, background 0.08s; margin-bottom:8px; }
#tap-btn:active { transform:scale(0.97); background:#8E24AA; }
.btn-reset { background:var(--card); border:none; border-radius:12px; color:var(--muted); font-size:0.9rem; padding:12px; cursor:pointer; width:100%; }
/* Visual dots */
#dot-row { display:flex; justify-content:center; gap:6px; margin-top:10px; min-height:16px; }
.beat-dot { width:12px; height:12px; border-radius:50%; background:var(--muted); transition:background 0.1s, transform 0.1s; }
.beat-dot.lit { background:var(--accent); transform:scale(1.3); }
/* Tempo table */
.tempo-row { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:8px; font-size:0.82rem; margin-bottom:3px; }
.tempo-row.current { background:rgba(171,71,188,0.15); }
.tr-name { font-weight:600; }
.tr-range { color:var(--muted); font-size:0.75rem; }
.tr-cur { color:var(--accent); font-size:0.75rem; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>BPM <span>Tapper</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card" id="bpm-card">
      <div id="bpm-num">--</div>
      <div id="tempo-name">Tap the button</div>
      <div id="tap-count">0 taps</div>
      <div id="dot-row"></div>
    </div>
    <button id="tap-btn" onclick="tap()">TAP</button>
    <button class="btn-reset" onclick="reset()">Reset</button>
    <div class="card" style="margin-top:8px;">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;">Tempo Reference</div>
      <div id="tempo-table"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var TEMPOS=[
  {name:'Grave',     min:0,  max:39},
  {name:'Largo',     min:40, max:59},
  {name:'Larghetto', min:60, max:65},
  {name:'Adagio',    min:66, max:75},
  {name:'Andante',   min:76, max:107},
  {name:'Moderato',  min:108,max:119},
  {name:'Allegretto',min:120,max:129},
  {name:'Allegro',   min:130,max:167},
  {name:'Vivace',    min:168,max:175},
  {name:'Presto',    min:176,max:199},
  {name:'Prestissimo',min:200,max:999},
];

var S = { useCount:0, removeAds:false, taps:[], bpm:0, resetTimeout:null };
var MAX_TAPS=16;

function tap(){
  var now=Date.now();
  if(S.resetTimeout)clearTimeout(S.resetTimeout);
  S.resetTimeout=setTimeout(reset,3000);

  S.taps.push(now);
  if(S.taps.length>MAX_TAPS)S.taps.shift();

  if(S.taps.length>=2){
    var intervals=[];
    for(var i=1;i<S.taps.length;i++)intervals.push(S.taps[i]-S.taps[i-1]);
    var avg=intervals.reduce(function(a,b){return a+b;},0)/intervals.length;
    S.bpm=Math.round(60000/avg);
  }

  flash();
  lightDot();
  render();
  maybeInterstitial();
}

function flash(){
  var el=document.getElementById('bpm-num');
  el.classList.add('flash');
  setTimeout(function(){el.classList.remove('flash');},80);
}

var dotIdx=0;
var NDOTS=8;
function lightDot(){
  dotIdx=(dotIdx+1)%NDOTS;
  var dots=document.querySelectorAll('.beat-dot');
  dots.forEach(function(d,i){d.classList.toggle('lit',i===dotIdx);});
}

function reset(){
  S.taps=[];S.bpm=0;dotIdx=0;
  if(S.resetTimeout){clearTimeout(S.resetTimeout);S.resetTimeout=null;}
  render();
  document.querySelectorAll('.beat-dot').forEach(function(d){d.classList.remove('lit');});
}

function getTempoName(bpm){
  var t=TEMPOS.find(function(t){return bpm>=t.min&&bpm<=t.max;});
  return t?t.name:'';
}

function render(){
  var bpm=S.bpm;
  document.getElementById('bpm-num').textContent=bpm>0?bpm:'--';
  document.getElementById('tempo-name').textContent=bpm>0?getTempoName(bpm):'Tap the button';
  document.getElementById('tap-count').textContent=S.taps.length+' tap'+(S.taps.length===1?'':'s')+
    (S.taps.length>0?' (auto-resets in 3s)':'');

  // Tempo table
  var html=TEMPOS.map(function(t){
    var cur=bpm>=t.min&&bpm<=t.max;
    return '<div class="tempo-row'+(cur?' current':'')+'">'+
      '<span class="tr-name">'+t.name+'</span>'+
      '<span class="tr-range">'+t.min+(t.max<999?'–'+t.max:'+')+'</span>'+
      (cur?'<span class="tr-cur">← '+bpm+' BPM</span>':'')+'</div>';
  }).join('');
  document.getElementById('tempo-table').innerHTML=html;
}

// Init dots
(function(){
  var r=document.getElementById('dot-row');
  for(var i=0;i<NDOTS;i++) r.innerHTML+='<div class="beat-dot"></div>';
})();

render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

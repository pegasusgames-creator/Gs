<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess Clock</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#263238; --surface:#37474F; --card:#455A64; --accent:#ECEFF1; --text:#ECEFF1; --muted:#90A4AE; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; }
#hdr { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; flex-shrink:0; background:var(--surface); }
#hdr h1 { font-size:1.1rem; font-weight:700; } #hdr h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#clocks { display:flex; flex-direction:column; flex:1; min-height:0; }
.pclock { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:background 0.15s; position:relative; user-select:none; -webkit-user-select:none; }
#p2 { background:#1C2C35; transform:rotate(180deg); border-bottom:2px solid #546E7A; }
#p1 { background:#2C3E45; border-top:2px solid #546E7A; }
.pclock.active { background:#37474F; }
.pclock.active .ctime { color:var(--accent); }
.pclock.low .ctime { color:#EF5350 !important; }
.pclock.flagged { background:#B71C1C !important; }
.ctime { font-size:4.8rem; font-weight:700; letter-spacing:3px; font-variant-numeric:tabular-nums; color:#607D8B; transition:color 0.2s; line-height:1; }
.clabel { font-size:0.75rem; color:var(--muted); margin-top:10px; letter-spacing:1px; text-transform:uppercase; }
.dot { width:12px; height:12px; border-radius:50%; background:var(--accent); position:absolute; bottom:18px; opacity:0; transition:opacity 0.2s; }
.pclock.active .dot { opacity:1; }
#ctrl { background:var(--surface); padding:10px 14px 12px; flex-shrink:0; }
.row { display:flex; gap:7px; margin-bottom:8px; }
.cb { flex:1; padding:9px 4px; border:none; border-radius:10px; font-size:0.8rem; font-weight:600; cursor:pointer; background:var(--card); color:var(--text); }
.cb.sel { background:var(--accent); color:#263238; }
.cb.red { background:#c62828; color:#fff; }
.cb.grn { background:#2E7D32; color:#fff; }
#srow { display:flex; align-items:center; gap:8px; font-size:0.78rem; color:var(--muted); }
#inc { width:55px; padding:5px 8px; border-radius:8px; border:none; background:var(--card); color:var(--text); font-size:0.85rem; text-align:center; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="hdr"><h1>Chess <span>Clock</span></h1><button id="btn-remove-ads">Remove Ads</button></div>
  <div id="clocks">
    <div id="p2" class="pclock" onclick="tap(2)">
      <div class="ctime" id="t2">10:00</div>
      <div class="clabel">Player 2</div>
      <div class="dot"></div>
    </div>
    <div id="p1" class="pclock" onclick="tap(1)">
      <div class="ctime" id="t1">10:00</div>
      <div class="clabel">Player 1</div>
      <div class="dot"></div>
    </div>
  </div>
  <div id="ctrl">
    <div class="row" id="presets">
      <button class="cb" onclick="preset(1,this)">1m</button>
      <button class="cb" onclick="preset(3,this)">3m</button>
      <button class="cb" onclick="preset(5,this)">5m</button>
      <button class="cb sel" onclick="preset(10,this)">10m</button>
      <button class="cb" onclick="preset(15,this)">15m</button>
      <button class="cb" onclick="preset(30,this)">30m</button>
      <button class="cb" onclick="customPreset(this)">…</button>
    </div>
    <div id="srow">
      <span>Inc (s):</span>
      <input id="inc" type="number" min="0" max="60" value="0">
      <div style="flex:1"></div>
      <button class="cb grn" id="bss" onclick="toggleRun()" style="flex:0;padding:8px 20px;font-size:0.9rem;">Start</button>
      <button class="cb red" onclick="resetAll()" style="flex:0;padding:8px 16px;font-size:0.9rem;">Reset</button>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var S = { useCount:0, removeAds:false, mins:10, inc:0, ms:[0,600000,600000], active:0, running:false, last:0, iv:null };

function fmt(ms) {
  if(ms<0)ms=0;
  var t=Math.ceil(ms/1000), m=Math.floor(t/60), s=t%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function render() {
  document.getElementById('t1').textContent=fmt(S.ms[1]);
  document.getElementById('t2').textContent=fmt(S.ms[2]);
  [1,2].forEach(function(i){
    var el=document.getElementById('p'+i);
    el.classList.toggle('active',S.active===i&&S.running);
    el.classList.toggle('low',S.ms[i]<10000&&S.ms[i]>0&&S.running);
    el.classList.toggle('flagged',S.ms[i]<=0);
  });
  var b=document.getElementById('bss');
  if(S.running){b.textContent='Pause';b.className='cb red';}
  else{b.textContent=(S.active===0?'Start':'Resume');b.className='cb grn';}
}
function tick() {
  if(!S.running||S.active===0)return;
  var now=Date.now(), d=now-S.last; S.last=now;
  S.ms[S.active]-=d;
  if(S.ms[S.active]<=0){S.ms[S.active]=0;S.running=false;clearInterval(S.iv);S.iv=null;}
  render();
}
function tap(p) {
  if(!S.running||S.active!==p)return;
  S.ms[p]+=S.inc*1000;
  S.active=p===1?2:1;
  S.last=Date.now();
  maybeInterstitial();
  render();
}
function toggleRun() {
  if(S.running){S.running=false;clearInterval(S.iv);S.iv=null;}
  else{if(S.active===0)S.active=1;S.running=true;S.last=Date.now();S.iv=setInterval(tick,100);}
  render();
}
function resetAll() {
  S.running=false;clearInterval(S.iv);S.iv=null;S.active=0;
  S.inc=parseInt(document.getElementById('inc').value)||0;
  S.ms[1]=S.ms[2]=S.mins*60000;
  render();
}
function preset(m,btn) {
  S.mins=m;
  document.querySelectorAll('#presets .cb').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel');
  resetAll();
}
function customPreset(btn) {
  var v=prompt('Enter minutes (1-180):',S.mins);
  if(v&&!isNaN(v)&&+v>=1&&+v<=180){
    S.mins=Math.round(+v);
    document.querySelectorAll('#presets .cb').forEach(function(b){b.classList.remove('sel');});
    btn.classList.add('sel');
    resetAll();
  }
}
document.getElementById('inc').addEventListener('change',function(){S.inc=parseInt(this.value)||0;});
resetAll();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

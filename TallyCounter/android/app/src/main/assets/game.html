<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tally Counter</title>
<style>
:root {
  --bg: #0d0d1a;
  --surface: #16213e;
  --surface2: #1a2744;
  --accent: #6c63ff;
  --accent2: #4ecdc4;
  --gold: #ffd700;
  --danger: #ff6b6b;
  --text: #eaeaea;
  --muted: #8892a4;
  --border: rgba(108,99,255,0.25);
  --card: #1e2d50;
  --shadow: rgba(108,99,255,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Arial, sans-serif; }
body { padding-top: env(safe-area-inset-top,0px); }

/* ── screens ── */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* ── header ── */
.hdr { display: flex; align-items: center; padding: 14px 16px 10px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 10px; flex-shrink: 0; }
.hdr h1 { flex: 1; font-size: 1.15rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.hdr-coins { display: flex; align-items: center; gap: 5px; background: rgba(255,215,0,0.12); border: 1px solid rgba(255,215,0,0.35); border-radius: 14px; padding: 4px 10px; font-size: 0.82rem; font-weight: 700; color: var(--gold); }
.icon-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 7px 12px; font-size: 1rem; cursor: pointer; }
.icon-btn:active { transform: scale(0.92); }

/* ── home screen ── */
#homeScreen { background: linear-gradient(160deg, #0d0d1a 0%, #16213e 60%, #0f1f3a 100%); }
#counterList { flex: 1; overflow-y: auto; padding: 12px 14px 80px; display: flex; flex-direction: column; gap: 12px; }
.counter-card {
  background: var(--card);
  border-radius: 18px;
  border: 1.5px solid var(--border);
  padding: 16px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.counter-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(108,99,255,0.08) 0%, transparent 60%);
  pointer-events: none;
}
.counter-card:active { transform: scale(0.97); box-shadow: 0 0 0 2px var(--accent); }
.counter-card.at-goal { border-color: #2ecc71; }
.counter-card.at-goal::before { background: linear-gradient(135deg, rgba(46,204,113,0.1) 0%, transparent 60%); }
.cc-emoji { font-size: 2rem; min-width: 40px; text-align: center; }
.cc-body { flex: 1; min-width: 0; }
.cc-name { font-size: 0.95rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.cc-count { font-size: 2.2rem; font-weight: 900; color: var(--accent); min-width: 64px; text-align: right; line-height: 1; }
.cc-count.at-goal { color: #2ecc71; }
.goal-bar-wrap { margin-top: 6px; background: rgba(255,255,255,0.08); border-radius: 4px; height: 4px; overflow: hidden; }
.goal-bar { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }
.cc-delete { background: transparent; border: none; color: var(--muted); font-size: 1.2rem; padding: 4px 6px; cursor: pointer; opacity: 0.6; }
.cc-delete:active { opacity: 1; color: var(--danger); }

#fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom,0px)); right: 20px; width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #9c94ff); border: none; color: #fff; font-size: 1.8rem; cursor: pointer; box-shadow: 0 8px 24px var(--shadow); display: flex; align-items: center; justify-content: center; transition: transform 0.15s; z-index: 10; }
#fab:active { transform: scale(0.92); }

.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); padding: 40px; text-align: center; }
.empty-state .empty-icon { font-size: 4rem; opacity: 0.4; }
.empty-state p { font-size: 0.9rem; line-height: 1.6; }

/* ── count screen ── */
#countScreen { background: linear-gradient(180deg, #0d0d1a 0%, #0f1f3a 100%); }
#cs-header { display: flex; align-items: center; padding: 14px 16px 10px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 10px; flex-shrink: 0; }
#cs-title { flex: 1; font-size: 1.1rem; font-weight: 800; color: var(--accent); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cs-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 10px 20px; }
#cs-count { font-size: clamp(5rem,22vw,9rem); font-weight: 900; color: var(--text); line-height: 1; transition: transform 0.08s; text-align: center; }
#cs-count.bump { transform: scale(1.12); }
#cs-goal-display { font-size: 0.85rem; color: var(--muted); margin-top: 2px; margin-bottom: 6px; }
#cs-goal-bar-wrap { width: 100%; max-width: 320px; background: rgba(255,255,255,0.08); border-radius: 6px; height: 6px; overflow: hidden; margin-bottom: 10px; }
#cs-goal-bar { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }
#tap-btn {
  width: min(65vw, 240px);
  height: min(65vw, 240px);
  border-radius: 50%;
  border: 3px solid rgba(108,99,255,0.4);
  background: radial-gradient(circle at 38% 34%, #7c73ff, #4c44cc 55%, #2a2480);
  cursor: pointer;
  font-size: 1.4rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 3px;
  box-shadow: 0 0 50px rgba(108,99,255,0.35), 0 10px 30px rgba(0,0,0,0.5);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 14px 0;
}
#tap-btn:active { transform: scale(0.91); box-shadow: 0 0 20px rgba(108,99,255,0.2), 0 4px 12px rgba(0,0,0,0.4); }
.cs-row { display: flex; gap: 14px; align-items: center; margin-top: 6px; }
.cs-side-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--surface2); border: 1.5px solid var(--border); color: var(--text); font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.cs-side-btn:active { transform: scale(0.9); background: var(--surface); }
#step-selector { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
.step-pill { padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: transparent; color: var(--muted); font-size: 0.8rem; cursor: pointer; }
.step-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
#cs-session-stats { display: flex; gap: 24px; margin-top: 14px; }
.ss-item { text-align: center; }
.ss-val { font-size: 1.2rem; font-weight: 800; color: var(--accent2); }
.ss-label { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
#cs-footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: center; flex-shrink: 0; }
.cs-foot-btn { flex: 1; padding: 11px 0; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.cs-foot-btn:active { transform: scale(0.95); }
.cs-foot-btn.danger { border-color: rgba(255,107,107,0.4); color: var(--danger); }

/* ── history screen ── */
#histScreen { background: var(--bg); }
#histList { flex: 1; overflow-y: auto; padding: 12px 14px 24px; display: flex; flex-direction: column; gap: 10px; }
.hist-card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
.hist-info .hist-name { font-size: 0.9rem; font-weight: 700; }
.hist-info .hist-date { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.hist-count-val { font-size: 1.6rem; font-weight: 900; color: var(--accent); }

/* ── themes screen ── */
#themesScreen { background: var(--bg); }
#themeGrid { flex: 1; overflow-y: auto; padding: 16px 14px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.theme-card { border-radius: 16px; padding: 20px 14px; cursor: pointer; border: 2.5px solid transparent; transition: transform 0.15s, border-color 0.15s; position: relative; overflow: hidden; }
.theme-card.locked::after { content: '🔒'; position: absolute; top: 8px; right: 10px; font-size: 1.1rem; }
.theme-card.selected { border-color: var(--gold); }
.theme-card:active { transform: scale(0.96); }
.theme-name { font-size: 0.9rem; font-weight: 700; margin-top: 8px; }
.theme-preview { display: flex; gap: 5px; margin-top: 8px; }
.theme-dot { width: 18px; height: 18px; border-radius: 50%; }
.theme-price { font-size: 0.75rem; color: var(--gold); margin-top: 4px; }

/* ── shop screen ── */
#shopScreen { background: var(--bg); }
#shopList { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.shop-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 16px; display: flex; align-items: center; gap: 14px; }
.shop-icon { font-size: 2.2rem; min-width: 44px; text-align: center; }
.shop-body { flex: 1; }
.shop-title { font-size: 0.95rem; font-weight: 700; }
.shop-desc { font-size: 0.78rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.shop-btn { padding: 9px 18px; border-radius: 20px; border: none; font-size: 0.82rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
.shop-btn.gold { background: linear-gradient(135deg,#ffd700,#f39c12); color: #1a1a2e; }
.shop-btn.iap { background: linear-gradient(135deg,var(--accent),#9c94ff); color: #fff; }
.shop-btn.owned { background: rgba(46,204,113,0.2); color: #2ecc71; border: 1px solid rgba(46,204,113,0.4); }

/* ── modal ── */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.modal-bg.show { display: flex; }
.modal { background: var(--surface); border-radius: 22px; padding: 28px 24px; width: 100%; max-width: 340px; border: 1px solid var(--border); }
.modal h2 { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 18px; }
.modal input, .modal select { width: 100%; padding: 11px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text); font-size: 0.9rem; margin-bottom: 12px; outline: none; }
.modal input:focus { border-color: var(--accent); }
.modal-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; display: block; }
.emoji-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.emoji-opt { font-size: 1.5rem; padding: 6px; border-radius: 8px; cursor: pointer; background: transparent; border: 2px solid transparent; }
.emoji-opt.sel { border-color: var(--accent); background: rgba(108,99,255,0.15); }
.modal-row { display: flex; gap: 10px; }
.modal-row .btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; border: none; }
.btn-cancel { background: var(--surface2); color: var(--muted); }
.btn-confirm { background: var(--accent); color: #fff; }

/* ── toast ── */
#toast { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom,0px)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 22px; border-radius: 24px; font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 200; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── remove-ads btn ── */
#remove-ads-btn { position: fixed; top: calc(env(safe-area-inset-top,0px) + 6px); right: 10px; background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.35); color: rgba(200,195,255,0.7); font-size: 0.65rem; padding: 4px 9px; border-radius: 10px; cursor: pointer; z-index: 50; }

/* ── scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.3); border-radius: 4px; }
</style>
</head>
<body>

<button id="remove-ads-btn" onclick="_purchase('remove_ads')">✨ Remove Ads</button>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <div class="hdr">
    <h1>📊 Tally Counter</h1>
    <div class="hdr-coins">🪙 <span id="coinDisplay">0</span></div>
    <button class="icon-btn" onclick="showScreen('shopScreen')">🛒</button>
    <button class="icon-btn" onclick="showScreen('themesScreen')">🎨</button>
    <button class="icon-btn" onclick="showScreen('histScreen')">📋</button>
  </div>
  <div id="counterList"></div>
  <button id="fab" onclick="openAddModal()">＋</button>
</div>

<!-- COUNT SCREEN -->
<div id="countScreen" class="screen">
  <div id="cs-header">
    <button class="icon-btn" onclick="exitCounter()">‹</button>
    <div id="cs-title">Counter</div>
    <button class="icon-btn" onclick="openEditModal()">✏️</button>
  </div>
  <div id="cs-body">
    <div id="cs-count">0</div>
    <div id="cs-goal-display"></div>
    <div id="cs-goal-bar-wrap" style="display:none"><div id="cs-goal-bar" style="width:0%"></div></div>
    <button id="tap-btn" ontouchstart="onTapStart(event)" ontouchend="onTapEnd(event)" onmousedown="onTapStart(event)" onmouseup="onTapEnd(event)">TAP</button>
    <div class="cs-row">
      <button class="cs-side-btn" onclick="doDecrement()">−</button>
      <div id="step-selector">
        <button class="step-pill active" data-step="1" onclick="setStep(1,this)">×1</button>
        <button class="step-pill" data-step="5" onclick="setStep(5,this)">×5</button>
        <button class="step-pill" data-step="10" onclick="setStep(10,this)">×10</button>
        <button class="step-pill" data-step="50" onclick="setStep(50,this)">×50</button>
        <button class="step-pill" data-step="100" onclick="setStep(100,this)">×100</button>
      </div>
      <button class="cs-side-btn" onclick="doIncrement()">＋</button>
    </div>
    <div id="cs-session-stats">
      <div class="ss-item"><div class="ss-val" id="ss-taps">0</div><div class="ss-label">Taps</div></div>
      <div class="ss-item"><div class="ss-val" id="ss-max">0</div><div class="ss-label">Session Max</div></div>
      <div class="ss-item"><div class="ss-val" id="ss-rate">0/m</div><div class="ss-label">Rate</div></div>
    </div>
  </div>
  <div id="cs-footer">
    <button class="cs-foot-btn" onclick="saveSession()">💾 Save</button>
    <button class="cs-foot-btn danger" onclick="confirmReset()">↺ Reset</button>
    <button class="cs-foot-btn" onclick="shareCount()">↗ Share</button>
  </div>
</div>

<!-- HISTORY SCREEN -->
<div id="histScreen" class="screen">
  <div class="hdr">
    <button class="icon-btn" onclick="showScreen('homeScreen')">‹</button>
    <h1>📋 History</h1>
    <button class="icon-btn" onclick="clearHistory()" style="color:var(--danger)">🗑️</button>
  </div>
  <div id="histList"></div>
</div>

<!-- THEMES SCREEN -->
<div id="themesScreen" class="screen">
  <div class="hdr">
    <button class="icon-btn" onclick="showScreen('homeScreen')">‹</button>
    <h1>🎨 Themes</h1>
  </div>
  <div id="themeGrid"></div>
</div>

<!-- SHOP SCREEN -->
<div id="shopScreen" class="screen">
  <div class="hdr">
    <button class="icon-btn" onclick="showScreen('homeScreen')">‹</button>
    <h1>🛒 Shop</h1>
    <div class="hdr-coins">🪙 <span id="coinDisplay2">0</span></div>
  </div>
  <div id="shopList"></div>
</div>

<!-- ADD/EDIT COUNTER MODAL -->
<div id="addModal" class="modal-bg">
  <div class="modal">
    <h2 id="modal-title">New Counter</h2>
    <span class="modal-label">Name</span>
    <input id="m-name" type="text" placeholder="e.g. Push-ups, Visitors…" maxlength="24">
    <span class="modal-label">Emoji Icon</span>
    <div class="emoji-picker" id="emojiPicker"></div>
    <span class="modal-label">Goal (optional, 0 = no goal)</span>
    <input id="m-goal" type="number" min="0" max="99999" placeholder="0">
    <span class="modal-label">Starting count</span>
    <input id="m-start" type="number" min="0" max="99999" placeholder="0">
    <div class="modal-row">
      <button class="btn btn-cancel" onclick="closeModal('addModal')">Cancel</button>
      <button class="btn btn-confirm" id="modal-save-btn" onclick="saveCounter()">Add</button>
    </div>
  </div>
</div>

<!-- RESET CONFIRM MODAL -->
<div id="resetModal" class="modal-bg">
  <div class="modal">
    <h2>Reset Counter?</h2>
    <p style="color:var(--muted);font-size:0.88rem;margin-bottom:20px;line-height:1.6">This will set the count back to 0. The current value will be saved to history first.</p>
    <div class="modal-row">
      <button class="btn btn-cancel" onclick="closeModal('resetModal')">Cancel</button>
      <button class="btn btn-confirm" style="background:var(--danger)" onclick="doReset()">Reset</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── state ──
var _coins = parseInt(localStorage.getItem('tc_coins') || '0');
var _adsRemoved = localStorage.getItem('tc_adsRemoved') === '1';
var _theme = localStorage.getItem('tc_theme') || 'purple';
var _counters = JSON.parse(localStorage.getItem('tc_counters') || '[]');
var _history = JSON.parse(localStorage.getItem('tc_history') || '[]');
var _unlockedThemes = JSON.parse(localStorage.getItem('tc_unlockedThemes') || '["purple"]');
var _activeIdx = -1;
var _step = 1;
var _sessionTaps = 0;
var _sessionStart = 0;
var _sessionMax = 0;
var _tapCount = 0;
var _editMode = false;
var _selectedEmoji = '📊';
var _interstitialCount = 0;

var EMOJIS = ['📊','📈','💪','🏃','⭐','🎯','🔢','📝','🎮','🧘','🍎','💧','☕','🏋️','🎸','🎲','🧩','⚡','🌟','❤️','🔥','✅','🏆','🎵'];

var THEMES = [
  { id:'purple', name:'Deep Purple', bg:'#0d0d1a', surface:'#16213e', accent:'#6c63ff', accent2:'#4ecdc4', free:true },
  { id:'midnight', name:'Midnight', bg:'#0a0a12', surface:'#111827', accent:'#818cf8', accent2:'#34d399', free:true },
  { id:'crimson', name:'Crimson', bg:'#120a0a', surface:'#2a1215', accent:'#ef4444', accent2:'#f97316', free:false, price:200 },
  { id:'ocean', name:'Ocean', bg:'#060e1a', surface:'#0c1c33', accent:'#0ea5e9', accent2:'#06b6d4', free:false, price:200 },
  { id:'forest', name:'Forest', bg:'#060f09', surface:'#0d1f12', accent:'#22c55e', accent2:'#84cc16', free:false, price:300 },
  { id:'sunset', name:'Sunset', bg:'#140a04', surface:'#2a1408', accent:'#f97316', accent2:'#fbbf24', free:false, price:300 },
  { id:'rose', name:'Rose Gold', bg:'#140a0d', surface:'#2a1020', accent:'#f472b6', accent2:'#fb7185', free:false, price:400 },
  { id:'arctic', name:'Arctic', bg:'#060e14', surface:'#0c1e2a', accent:'#67e8f9', accent2:'#a5f3fc', free:false, price:400 },
];

// ── boot ──
applyTheme(_theme);
if (_adsRemoved) document.getElementById('remove-ads-btn').style.display = 'none';
renderHome();
renderCoins();

// ── theme ──
function applyTheme(id) {
  var t = THEMES.find(function(x){ return x.id === id; }) || THEMES[0];
  var r = document.documentElement.style;
  r.setProperty('--bg', t.bg);
  r.setProperty('--surface', t.surface);
  r.setProperty('--surface2', shadeBlend(0.15, t.surface));
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent2', t.accent2);
  r.setProperty('--card', shadeBlend(0.08, t.surface));
  r.setProperty('--shadow', t.accent + '55');
  r.setProperty('--border', t.accent + '44');
}

function shadeBlend(p, hex) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, Math.round(r + p*80));
  g = Math.min(255, Math.round(g + p*80));
  b = Math.min(255, Math.round(b + p*80));
  return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// ── nav ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if (id === 'histScreen') renderHistory();
  if (id === 'themesScreen') renderThemes();
  if (id === 'shopScreen') renderShop();
}

// ── home ──
function renderHome() {
  var list = document.getElementById('counterList');
  if (_counters.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>No counters yet.<br>Tap + to create your first one.</p></div>';
    return;
  }
  list.innerHTML = '';
  _counters.forEach(function(c, i) {
    var pct = c.goal > 0 ? Math.min(100, Math.round(c.count / c.goal * 100)) : 0;
    var atGoal = c.goal > 0 && c.count >= c.goal;
    var div = document.createElement('div');
    div.className = 'counter-card' + (atGoal ? ' at-goal' : '');
    div.innerHTML =
      '<div class="cc-emoji">' + (c.emoji || '📊') + '</div>' +
      '<div class="cc-body">' +
        '<div class="cc-name">' + esc(c.name) + '</div>' +
        '<div class="cc-meta">Step: ×' + (c.step || 1) + (c.goal > 0 ? ' · Goal: ' + c.goal : '') + '</div>' +
        (c.goal > 0 ? '<div class="goal-bar-wrap"><div class="goal-bar" style="width:' + pct + '%"></div></div>' : '') +
      '</div>' +
      '<div class="cc-count' + (atGoal ? ' at-goal' : '') + '">' + c.count + '</div>' +
      '<button class="cc-delete" onclick="deleteCounter(event,' + i + ')">✕</button>';
    div.addEventListener('click', function(e) {
      if (e.target.classList.contains('cc-delete')) return;
      openCounter(i);
    });
    list.appendChild(div);
  });
}

function renderCoins() {
  document.getElementById('coinDisplay').textContent = _coins;
  var c2 = document.getElementById('coinDisplay2');
  if (c2) c2.textContent = _coins;
}

function addCoins(n) {
  _coins += n;
  localStorage.setItem('tc_coins', _coins);
  renderCoins();
}

function openCounter(i) {
  _activeIdx = i;
  var c = _counters[i];
  _step = c.step || 1;
  _sessionTaps = 0;
  _sessionMax = c.count;
  _sessionStart = Date.now();
  document.getElementById('cs-title').textContent = (c.emoji || '') + ' ' + c.name;
  document.querySelectorAll('.step-pill').forEach(function(p){ p.classList.toggle('active', parseInt(p.dataset.step) === _step); });
  updateCountScreen();
  showScreen('countScreen');
  if (window.Android) Android.showBannerAd();
}

function updateCountScreen() {
  if (_activeIdx < 0) return;
  var c = _counters[_activeIdx];
  var el = document.getElementById('cs-count');
  el.textContent = c.count;
  var gd = document.getElementById('cs-goal-display');
  var gbw = document.getElementById('cs-goal-bar-wrap');
  var gb = document.getElementById('cs-goal-bar');
  if (c.goal > 0) {
    var pct = Math.min(100, Math.round(c.count / c.goal * 100));
    gd.textContent = c.count + ' / ' + c.goal + ' (' + pct + '%)';
    gbw.style.display = 'block';
    gb.style.width = pct + '%';
    if (c.count >= c.goal) {
      gd.style.color = '#2ecc71';
      gb.style.background = '#2ecc71';
    } else {
      gd.style.color = '';
      gb.style.background = '';
    }
  } else {
    gd.textContent = '';
    gbw.style.display = 'none';
  }
  var elapsed = Math.max(1, (Date.now() - _sessionStart) / 60000);
  var rate = Math.round(_sessionTaps / elapsed);
  document.getElementById('ss-taps').textContent = _sessionTaps;
  document.getElementById('ss-max').textContent = _sessionMax;
  document.getElementById('ss-rate').textContent = rate + '/m';
}

function onTapStart(e) {
  e.preventDefault();
  doIncrement();
}
function onTapEnd(e) { e.preventDefault(); }

function doIncrement() {
  if (_activeIdx < 0) return;
  var c = _counters[_activeIdx];
  c.count += _step;
  _sessionTaps++;
  _sessionMax = Math.max(_sessionMax, c.count);
  saveCounters();
  updateCountScreen();
  bump();
  vibrate(25);
  // coin reward every 25 taps
  _tapCount++;
  if (_tapCount % 25 === 0) { addCoins(1); showToast('+1 🪙'); }
  // interstitial
  if (!_adsRemoved) {
    _interstitialCount++;
    if (_interstitialCount % 40 === 0 && window.Android) Android.showInterstitial();
  }
  // goal reached
  if (c.goal > 0 && c.count === c.goal) {
    addCoins(5);
    showToast('🎯 Goal reached! +5 🪙');
    vibrate([50,30,50,30,100]);
  }
  renderHome();
}

function doDecrement() {
  if (_activeIdx < 0) return;
  var c = _counters[_activeIdx];
  if (c.count - _step < 0) { showToast("Can't go below 0"); return; }
  c.count = Math.max(0, c.count - _step);
  saveCounters();
  updateCountScreen();
  bump();
  vibrate(15);
  renderHome();
}

function setStep(s, btn) {
  _step = s;
  if (_activeIdx >= 0) { _counters[_activeIdx].step = s; saveCounters(); }
  document.querySelectorAll('.step-pill').forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
}

function bump() {
  var el = document.getElementById('cs-count');
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(function(){ el.classList.remove('bump'); }, 100);
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

function saveSession() {
  if (_activeIdx < 0) return;
  var c = _counters[_activeIdx];
  _history.unshift({
    name: c.name,
    emoji: c.emoji || '📊',
    count: c.count,
    date: new Date().toLocaleDateString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
  });
  if (_history.length > 100) _history.pop();
  localStorage.setItem('tc_history', JSON.stringify(_history));
  addCoins(2);
  showToast('Saved! +2 🪙');
}

function confirmReset() {
  document.getElementById('resetModal').classList.add('show');
}

function doReset() {
  if (_activeIdx < 0) return;
  saveSession();
  _counters[_activeIdx].count = 0;
  saveCounters();
  _sessionTaps = 0;
  _sessionMax = 0;
  _sessionStart = Date.now();
  updateCountScreen();
  renderHome();
  closeModal('resetModal');
  showToast('Counter reset');
}

function shareCount() {
  if (_activeIdx < 0) return;
  var c = _counters[_activeIdx];
  var text = (c.emoji || '📊') + ' ' + c.name + ': ' + c.count + (c.goal > 0 ? ' / ' + c.goal : '') + ' — tracked with Tally Counter';
  if (window.Android && Android.shareText) { Android.shareText(text); }
  else { showToast('Count: ' + c.count); }
}

function exitCounter() {
  if (_activeIdx >= 0) saveCounters();
  _activeIdx = -1;
  renderHome();
  showScreen('homeScreen');
  if (window.Android) Android.hideBannerAd();
}

// ── add/edit modal ──
var _editingIdx = -1;
function openAddModal() {
  _editMode = false;
  _editingIdx = -1;
  document.getElementById('modal-title').textContent = 'New Counter';
  document.getElementById('modal-save-btn').textContent = 'Add';
  document.getElementById('m-name').value = '';
  document.getElementById('m-goal').value = '';
  document.getElementById('m-start').value = '';
  _selectedEmoji = '📊';
  buildEmojiPicker();
  document.getElementById('addModal').classList.add('show');
}

function openEditModal() {
  if (_activeIdx < 0) return;
  var c = _counters[_activeIdx];
  _editMode = true;
  _editingIdx = _activeIdx;
  document.getElementById('modal-title').textContent = 'Edit Counter';
  document.getElementById('modal-save-btn').textContent = 'Save';
  document.getElementById('m-name').value = c.name;
  document.getElementById('m-goal').value = c.goal || '';
  document.getElementById('m-start').value = c.count;
  _selectedEmoji = c.emoji || '📊';
  buildEmojiPicker();
  document.getElementById('addModal').classList.add('show');
}

function buildEmojiPicker() {
  var picker = document.getElementById('emojiPicker');
  picker.innerHTML = '';
  EMOJIS.forEach(function(em) {
    var btn = document.createElement('button');
    btn.className = 'emoji-opt' + (em === _selectedEmoji ? ' sel' : '');
    btn.textContent = em;
    btn.onclick = function() {
      _selectedEmoji = em;
      document.querySelectorAll('.emoji-opt').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
    };
    picker.appendChild(btn);
  });
}

function saveCounter() {
  var name = document.getElementById('m-name').value.trim();
  if (!name) { showToast('Please enter a name'); return; }
  var goal = parseInt(document.getElementById('m-goal').value) || 0;
  var start = parseInt(document.getElementById('m-start').value) || 0;
  if (_editMode && _editingIdx >= 0) {
    _counters[_editingIdx].name = name;
    _counters[_editingIdx].goal = goal;
    _counters[_editingIdx].count = start;
    _counters[_editingIdx].emoji = _selectedEmoji;
    document.getElementById('cs-title').textContent = _selectedEmoji + ' ' + name;
    updateCountScreen();
  } else {
    if (_counters.length >= 10) { showToast('Max 10 counters'); closeModal('addModal'); return; }
    _counters.push({ name: name, emoji: _selectedEmoji, count: start, goal: goal, step: 1 });
  }
  saveCounters();
  renderHome();
  closeModal('addModal');
  showToast(_editMode ? 'Counter updated' : 'Counter added!');
}

function deleteCounter(e, i) {
  e.stopPropagation();
  _counters.splice(i, 1);
  saveCounters();
  renderHome();
  showToast('Deleted');
}

function saveCounters() {
  localStorage.setItem('tc_counters', JSON.stringify(_counters));
}

// ── history ──
function renderHistory() {
  var list = document.getElementById('histList');
  if (_history.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No saved sessions yet.<br>Tap Save while counting to record a session.</p></div>';
    return;
  }
  list.innerHTML = '';
  _history.forEach(function(h) {
    var div = document.createElement('div');
    div.className = 'hist-card';
    div.innerHTML =
      '<div class="hist-info">' +
        '<div class="hist-name">' + (h.emoji || '📊') + ' ' + esc(h.name) + '</div>' +
        '<div class="hist-date">' + h.date + '</div>' +
      '</div>' +
      '<div class="hist-count-val">' + h.count + '</div>';
    list.appendChild(div);
  });
}

function clearHistory() {
  if (!confirm('Clear all history?')) return;
  _history = [];
  localStorage.setItem('tc_history', '[]');
  renderHistory();
  showToast('History cleared');
}

// ── themes ──
function renderThemes() {
  var grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  THEMES.forEach(function(t) {
    var owned = t.free || _unlockedThemes.indexOf(t.id) >= 0;
    var selected = t.id === _theme;
    var div = document.createElement('div');
    div.className = 'theme-card' + (selected ? ' selected' : '') + (!owned ? ' locked' : '');
    div.style.background = 'linear-gradient(135deg, ' + t.bg + ' 0%, ' + t.surface + ' 100%)';
    div.innerHTML =
      '<div style="font-size:1rem;font-weight:700;color:' + t.accent + '">' + t.name + '</div>' +
      '<div class="theme-preview">' +
        '<div class="theme-dot" style="background:' + t.accent + '"></div>' +
        '<div class="theme-dot" style="background:' + t.accent2 + '"></div>' +
        '<div class="theme-dot" style="background:' + t.surface + ';border:1px solid #ffffff22"></div>' +
      '</div>' +
      (!owned ? '<div class="theme-price">🪙 ' + t.price + '</div>' : (selected ? '<div style="font-size:0.75rem;color:#2ecc71;margin-top:4px">✓ Active</div>' : '<div style="font-size:0.75rem;color:var(--muted);margin-top:4px">Tap to apply</div>'));
    div.onclick = function() { selectTheme(t, owned); };
    grid.appendChild(div);
  });
}

function selectTheme(t, owned) {
  if (!owned) {
    if (_coins < t.price) { showToast('Need 🪙 ' + t.price + ' coins'); return; }
    _coins -= t.price;
    localStorage.setItem('tc_coins', _coins);
    _unlockedThemes.push(t.id);
    localStorage.setItem('tc_unlockedThemes', JSON.stringify(_unlockedThemes));
    renderCoins();
  }
  _theme = t.id;
  localStorage.setItem('tc_theme', _theme);
  applyTheme(_theme);
  renderThemes();
  showToast('Theme: ' + t.name);
}

// ── shop ──
var SHOP_ITEMS = [
  { id:'remove_ads', icon:'🚫', title:'Remove Ads', desc:'Remove all banner and interstitial ads permanently.', type:'iap', label:'$2.99' },
  { id:'coins_100', icon:'🪙', title:'100 Coins', desc:'Get 100 coins to unlock themes and power-ups.', type:'iap', label:'$0.99' },
  { id:'coins_500', icon:'💰', title:'500 Coins', desc:'Best value — 500 coins for themes and upgrades.', type:'iap', label:'$2.99' },
  { id:'max_counters', icon:'➕', title:'Unlimited Counters', desc:'Unlock up to 50 counters (default: 10).', type:'coins', price:500 },
  { id:'watch_ad', icon:'📺', title:'Watch Ad for Coins', desc:'Watch a short rewarded ad to earn 10 coins.', type:'ad' },
];

function renderShop() {
  var list = document.getElementById('shopList');
  list.innerHTML = '';
  SHOP_ITEMS.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'shop-card';
    var btnHtml = '';
    if (item.type === 'iap') {
      var owned = item.id === 'remove_ads' && _adsRemoved;
      btnHtml = '<button class="shop-btn ' + (owned ? 'owned' : 'iap') + '" onclick="_purchase(\'' + item.id + '\')">' + (owned ? '✓ Owned' : item.label) + '</button>';
    } else if (item.type === 'coins') {
      btnHtml = '<button class="shop-btn gold" onclick="_buyWithCoins(\'' + item.id + '\',' + item.price + ')">🪙 ' + item.price + '</button>';
    } else {
      btnHtml = '<button class="shop-btn gold" onclick="_watchAd()">Watch</button>';
    }
    div.innerHTML =
      '<div class="shop-icon">' + item.icon + '</div>' +
      '<div class="shop-body"><div class="shop-title">' + item.title + '</div><div class="shop-desc">' + item.desc + '</div></div>' +
      btnHtml;
    list.appendChild(div);
  });
}

function _buyWithCoins(id, price) {
  if (_coins < price) { showToast('Need 🪙 ' + price + ' coins'); return; }
  _coins -= price;
  localStorage.setItem('tc_coins', _coins);
  renderCoins();
  if (id === 'max_counters') { showToast('Unlimited counters unlocked!'); }
}

function _watchAd() {
  if (window.Android) { Android.showRewardedAd(); }
  else { addCoins(10); showToast('+10 🪙 (test mode)'); }
}

function _purchase(productId) {
  if (window.Android) { Android.purchase(productId); }
  else { showToast('IAP: ' + productId + ' (test)'); }
}

// ── modal helpers ──
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// ── toast ──
var _toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ── Android bridge callbacks ──
window.onPurchaseComplete = function(productId) {
  if (productId === 'remove_ads') {
    _adsRemoved = true;
    localStorage.setItem('tc_adsRemoved', '1');
    document.getElementById('remove-ads-btn').style.display = 'none';
    if (window.Android) Android.hideBannerAd();
    showToast('Ads removed!');
  } else if (productId === 'coins_small' || productId === 'coins_100') {
    addCoins(100);
    showToast('+100 🪙');
  } else if (productId === 'coins_large' || productId === 'coins_500') {
    addCoins(500);
    showToast('+500 🪙');
  }
  renderShop();
};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

window.onRewardedAdComplete = function() {
  addCoins(10);
  showToast('+10 🪙 earned!');
};

window.onRewardedAdFailed = function() {
  showToast('No ad available, try later');
};

// ── utils ──
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// close modals on backdrop click
document.querySelectorAll('.modal-bg').forEach(function(bg) {
  bg.addEventListener('click', function(e) {
    if (e.target === bg) bg.classList.remove('show');
  });
});

// init banner
if (window.Android && !_adsRemoved) Android.showBannerAd();
</script>

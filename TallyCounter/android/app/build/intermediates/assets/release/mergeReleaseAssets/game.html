<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tally Counter</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  body{background:#0d0d1a;color:#e0e0ff;font-family:'Arial',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
  h1{font-size:1.5rem;margin:16px 0 4px;color:#a0a0ff;letter-spacing:3px}
  #counter-label{background:#ffffff10;border:1px solid #a0a0ff44;color:#e0e0ff;font-size:0.9rem;padding:6px 12px;border-radius:8px;text-align:center;width:200px;outline:none;margin:6px 0 10px}
  #count-display{font-size:6rem;font-weight:bold;color:#c0c0ff;text-align:center;min-width:260px;margin:8px 0;text-shadow:0 0 40px #8080ff66;transition:transform 0.08s,color 0.1s;line-height:1}
  #count-display.bump{transform:scale(1.12);color:#ffffff}
  #tap-btn{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5555ff,#2020aa 60%,#101050);border:3px solid #8080ff55;cursor:pointer;font-size:1.3rem;color:#e0e0ff;letter-spacing:2px;box-shadow:0 0 40px #3030ff44,0 4px 20px #0006;transition:transform 0.08s,box-shadow 0.08s;margin:8px 0 14px;display:flex;align-items:center;justify-content:center}
  #tap-btn:active{transform:scale(0.92);box-shadow:0 0 20px #3030ff22}
  .btn-row{display:flex;gap:12px;margin-bottom:10px}
  .ctrl-btn{background:#ffffff12;border:1px solid #8080ff44;color:#a0a0ff;border-radius:12px;padding:10px 20px;font-size:0.9rem;cursor:pointer}
  .ctrl-btn:active{background:#8080ff33}
  #step-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:0.85rem;color:#8080ffaa}
  .step-btn{background:#ffffff10;border:1px solid #8080ff33;color:#a0a0ff;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:0.85rem}
  .step-btn.active{background:#5555ff44;border-color:#8080ff}
  #history-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:320px;padding:0 12px;font-size:0.8rem;color:#8080ffaa}
  .hist-item{background:#ffffff08;border-radius:6px;padding:2px 8px}
  #remove-ads{position:fixed;top:8px;right:8px;background:#ffffff10;border:1px solid #8080ff33;color:#8080ffaa;font-size:0.65rem;padding:4px 8px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<button id="remove-ads" onclick="Android.purchase('remove_ads')">Remove Ads</button>
<h1>📊 TALLY</h1>
<input id="counter-label" type="text" placeholder="What are you counting?" maxlength="30">
<div id="count-display">0</div>
<button id="tap-btn" onclick="increment()">TAP</button>
<div class="btn-row">
  <button class="ctrl-btn" onclick="decrement()">−</button>
  <button class="ctrl-btn" onclick="resetCount()">RESET</button>
  <button class="ctrl-btn" onclick="saveCount()">SAVE</button>
</div>
<div id="step-row">Step:
  <button class="step-btn active" onclick="setStep(1,this)">1</button>
  <button class="step-btn" onclick="setStep(5,this)">5</button>
  <button class="step-btn" onclick="setStep(10,this)">10</button>
  <button class="step-btn" onclick="setStep(100,this)">100</button>
</div>
<div id="history-row"></div>
<script>
let count=parseInt(localStorage.getItem('tc_count')||'0'),step=1,tapCount=0;
let saved=JSON.parse(localStorage.getItem('tc_saved')||'[]');
render();renderHistory();
function render(){document.getElementById('count-display').textContent=count;}
function increment(){
  count+=step;localStorage.setItem('tc_count',count);render();bump();
  if(navigator.vibrate)navigator.vibrate(30);
  if(++tapCount%20===0&&window.Android)Android.showInterstitial();
}
function decrement(){count=Math.max(0,count-step);localStorage.setItem('tc_count',count);render();bump();}
function resetCount(){count=0;localStorage.setItem('tc_count',0);render();}
function saveCount(){
  const label=document.getElementById('counter-label').value||'Count';
  saved.unshift({label,val:count});if(saved.length>8)saved.pop();
  localStorage.setItem('tc_saved',JSON.stringify(saved));renderHistory();
}
function setStep(s,btn){step=s;document.querySelectorAll('.step-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function bump(){const el=document.getElementById('count-display');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),120);}
function renderHistory(){const row=document.getElementById('history-row');row.innerHTML='';saved.slice(0,6).forEach(s=>{const d=document.createElement('div');d.className='hist-item';d.textContent=s.label+': '+s.val;row.appendChild(d);});}
window.onPurchaseComplete=function(id){if(id==='remove_ads'){document.getElementById('remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
</script>
</body>
</html>

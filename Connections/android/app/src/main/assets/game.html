body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
#banner { width:100%; height:50px; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:#555; font-size:12px; border-bottom:1px solid #333; }
#header { width:100%; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; background:#1a1a1a; }
h1 { font-size:20px; color:#5C8A3C; font-weight:700; }
#controls { display:flex; gap:8px; padding:8px 16px; flex-wrap:wrap; justify-content:center; }
button { background:#1e1e1e; color:#5C8A3C; border:1.5px solid #5C8A3C; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; touch-action:manipulation; }
button:active { background:#5C8A3C; color:#fff; }
#lives { font-size:20px; letter-spacing:4px; text-align:center; padding:4px; min-height:30px; }
#msg { padding:6px 16px; text-align:center; font-size:15px; min-height:32px; color:#5C8A3C; }
#solved-groups { padding:0 10px; width:100%; max-width:420px; }
.solved-row { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; margin:4px 0; padding:10px; border-radius:8px; font-size:13px; font-weight:600; }
#word-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px; max-width:420px; width:100%; }
.word-btn { background:#2a2a2a; color:#fff; border:2px solid #333; border-radius:8px; padding:12px 4px; font-size:13px; font-weight:600; cursor:pointer; touch-action:manipulation; text-align:center; min-height:52px; display:flex; align-items:center; justify-content:center; word-break:break-word; line-height:1.2; }
.word-btn.selected { background:#4a4a4a; border-color:#5C8A3C; }
.word-btn.correct { opacity:0.4; pointer-events:none; }
#level-select { display:none; flex-wrap:wrap; gap:6px; padding:8px 16px; justify-content:center; max-width:420px; }
.lvl-btn { padding:6px 12px; font-size:13px; min-width:38px; }
.lvl-btn.done { background:#5C8A3C; color:#fff; border-color:#5C8A3C; }

const state = { puzzle: 0, lives: 3, selected: [], solved: [], removeAds: false, completed: new Set(), words: [] };

function loadPuzzle(n) {
  state.puzzle = n;
  state.lives = 3;
  state.selected = [];
  state.solved = [];
  const puz = puzzles[(n) % puzzles.length];
  // Flatten and shuffle words
  const all = [];
  puz.groups.forEach((g,gi) => g.words.forEach(w => all.push({word:w,group:gi,d:g.d})));
  shuffle(all);
  state.words = all;
  document.getElementById('puzzle-num').textContent = 'Puzzle ' + (n+1) + '/' + puzzles.length;
  document.getElementById('msg').textContent = 'Find 4 groups of 4 words!';
  updateLives();
  document.getElementById('solved-groups').innerHTML = '';
  renderWords();
}

function shuffle(arr) {
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

function updateLives() {
  const l = state.lives;
  document.getElementById('lives').textContent = (l>=1?'❤️':l>=0?'🖤':'') + (l>=2?'❤️':'🖤') + (l>=3?'❤️':'🖤');
}

function renderWords() {
  const grid = document.getElementById('word-grid');
  grid.innerHTML = '';
  state.words.forEach((item, i) => {
    if (state.solved.includes(item.group)) return;
    const btn = document.createElement('button');
    btn.className = 'word-btn' + (state.selected.includes(i) ? ' selected' : '');
    btn.textContent = item.word;
    btn.onclick = () => toggleSelect(i);
    grid.appendChild(btn);
  });
}

function toggleSelect(i) {
  const idx = state.selected.indexOf(i);
  if (idx >= 0) { state.selected.splice(idx,1); }
  else if (state.selected.length < 4) { state.selected.push(i); }
  renderWords();
}

function submitGuess() {
  if (state.selected.length !== 4) { document.getElementById('msg').textContent = 'Select exactly 4 words!'; return; }
  const groups = state.selected.map(i => state.words[i].group);
  const correct = groups.every(g => g === groups[0]);
  if (correct) {
    const g = groups[0];
    state.solved.push(g);
    const puz = puzzles[state.puzzle % puzzles.length];
    const grp = puz.groups[g];
    const row = document.createElement('div');
    row.className = 'solved-row';
    row.style.background = COLORS[grp.d];
    row.style.color = '#000';
    row.innerHTML = '<strong>' + grp.label + ':</strong>&nbsp;' + grp.words.join(', ');
    document.getElementById('solved-groups').appendChild(row);
    document.getElementById('msg').textContent = 'Correct! ' + DIFF_NAMES[grp.d];
    state.selected = [];
    renderWords();
    if (state.solved.length === 4) {
      setTimeout(winPuzzle, 500);
    }
  } else {
    state.lives--;
    updateLives();
    // Check if one away
    const counts = {};
    groups.forEach(g => counts[g] = (counts[g]||0)+1);
    const max = Math.max(...Object.values(counts));
    if (max === 3) document.getElementById('msg').textContent = 'So close! One away...';
    else document.getElementById('msg').textContent = 'Wrong! Try again.';
    state.selected = [];
    renderWords();
    if (state.lives <= 0) {
      document.getElementById('msg').textContent = 'No lives left! Better luck next time.';
    }
  }
}

function shuffleWords() {
  shuffle(state.words);
  state.selected = [];
  renderWords();
}

function winPuzzle() {
  state.completed.add(state.puzzle);
  document.getElementById('msg').textContent = '🎉 All groups found!';
  buildLevelSelect();
  setTimeout(() => {
    const next = state.puzzle + 1;
    if (!state.removeAds && (next+1) % 3 === 0 && window.Android) Android.showInterstitial();
    if (next < puzzles.length) loadPuzzle(next);
  }, 1500);
}

function toggleLevelSelect() {
  const ls = document.getElementById('level-select');
  ls.style.display = ls.style.display === 'flex' ? 'none' : 'flex';
}

function buildLevelSelect() {
  const ls = document.getElementById('level-select');
  ls.innerHTML = '';
  puzzles.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'lvl-btn' + (state.completed.has(i) ? ' done' : '');
    b.textContent = i+1;
    b.onclick = () => { loadPuzzle(i); ls.style.display='none'; };
    ls.appendChild(b);
  });
}

function removeAds() {
  if (window.Android) Android.purchase('remove_ads');
  else { state.removeAds = true; document.getElementById('msg').textContent = 'Ads removed!'; }
}
window.onPurchaseComplete = function(sku) { state.removeAds = true; };
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

buildLevelSelect();

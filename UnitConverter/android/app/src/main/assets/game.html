<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unit Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#e94560; --accent2:#533483; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0; }
  header h1 { font-size:1.3rem; font-weight:700; }
  header h1 span { color:var(--accent); }
  #btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
  #cat-bar { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:12px; flex-shrink:0; scrollbar-width:none; padding-bottom:4px; }
  #cat-bar::-webkit-scrollbar { display:none; }
  .cat-btn { flex-shrink:0; background:var(--surface); border:2px solid transparent; border-radius:20px; color:var(--muted); font-size:0.78rem; font-weight:600; padding:6px 14px; cursor:pointer; white-space:nowrap; }
  .cat-btn.active { border-color:var(--accent); color:var(--accent); }
  .cat-btn.btn-pressed { transform:scale(0.93); }
  #scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
  .card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
  .card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
  .conv-row { display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; }
  .conv-side { flex:1; min-width:0; }
  .conv-label { font-size:0.68rem; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.6px; }
  .conv-input { width:100%; background:var(--card); border:2px solid transparent; border-radius:10px; color:var(--text); font-size:1.2rem; font-weight:700; padding:10px 12px; outline:none; }
  .conv-input:focus { border-color:var(--accent); }
  .conv-input::placeholder { color:var(--muted); }
  .swap-btn { margin-top:22px; width:40px; height:40px; border-radius:50%; background:var(--accent); border:none; color:#fff; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .swap-btn.btn-pressed { transform:scale(0.88); }
  .unit-select { width:100%; background:var(--card); border:2px solid transparent; border-radius:10px; color:var(--text); font-size:0.88rem; font-weight:600; padding:8px 10px; margin-top:6px; outline:none; appearance:none; -webkit-appearance:none; cursor:pointer; }
  .unit-select:focus { border-color:var(--accent); }
  #formula-hint { font-size:0.75rem; color:var(--muted); text-align:center; padding:8px; background:var(--card); border-radius:8px; min-height:32px; }
  #admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Unit <span>Converter</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="cat-bar"></div>
  <div id="scroll">
    <div class="card">
      <div class="card-title" id="cat-title">Length</div>
      <div class="conv-row">
        <div class="conv-side">
          <div class="conv-label">From</div>
          <input id="input-from" class="conv-input" type="number" inputmode="decimal" placeholder="0">
          <select id="unit-from" class="unit-select"></select>
        </div>
        <button class="swap-btn" id="btn-swap">&#8644;</button>
        <div class="conv-side">
          <div class="conv-label">To</div>
          <input id="input-to" class="conv-input" type="number" inputmode="decimal" placeholder="0">
          <select id="unit-to" class="unit-select"></select>
        </div>
      </div>
      <div id="formula-hint"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button,.cat-btn,.swap-btn');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(el){el.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var CATEGORIES=[
  {name:'Length',units:[['Meter (m)',1,1],['Kilometer (km)',1000,1/1000],['Centimeter (cm)',0.01,100],['Millimeter (mm)',0.001,1000],['Mile (mi)',1609.344,1/1609.344],['Yard (yd)',0.9144,1/0.9144],['Foot (ft)',0.3048,1/0.3048],['Inch (in)',0.0254,1/0.0254],['Nautical Mile',1852,1/1852]]},
  {name:'Weight',units:[['Kilogram (kg)',1,1],['Gram (g)',0.001,1000],['Milligram (mg)',0.000001,1000000],['Metric Ton (t)',1000,0.001],['Pound (lb)',0.45359237,1/0.45359237],['Ounce (oz)',0.028349523,1/0.028349523],['Stone (st)',6.35029318,1/6.35029318]]},
  {name:'Temperature',special:true,units:[['Celsius (°C)'],['Fahrenheit (°F)'],['Kelvin (K)']]},
  {name:'Area',units:[['Sq Meter (m²)',1,1],['Sq Km (km²)',1e6,1e-6],['Sq Mile (mi²)',2589988.11,1/2589988.11],['Sq Yard (yd²)',0.83612736,1/0.83612736],['Sq Foot (ft²)',0.09290304,1/0.09290304],['Sq Inch (in²)',6.4516e-4,1/6.4516e-4],['Hectare (ha)',10000,1/10000],['Acre',4046.8564,1/4046.8564]]},
  {name:'Volume',units:[['Liter (L)',1,1],['Milliliter (mL)',0.001,1000],['Cubic Meter (m³)',1000,0.001],['Gallon (US)',3.785411784,1/3.785411784],['Quart (US)',0.946352946,1/0.946352946],['Pint (US)',0.473176473,1/0.473176473],['Cup (US)',0.2365882365,1/0.2365882365],['Fl Oz (US)',0.0295735296,1/0.0295735296],['Gallon (UK)',4.54609,1/4.54609]]},
  {name:'Speed',units:[['m/s',1,1],['km/h',1/3.6,3.6],['mph',0.44704,1/0.44704],['knot',0.514444,1/0.514444],['ft/s',0.3048,1/0.3048]]},
  {name:'Data',units:[['Byte (B)',1,1],['Kilobyte (KB)',1024,1/1024],['Megabyte (MB)',1048576,1/1048576],['Gigabyte (GB)',1073741824,1/1073741824],['Terabyte (TB)',1099511627776,1/1099511627776],['Bit',0.125,8],['Kilobit (Kb)',125,0.008],['Megabit (Mb)',125000,1/125000]]},
  {name:'Time',units:[['Second (s)',1,1],['Millisecond (ms)',0.001,1000],['Minute (min)',60,1/60],['Hour (h)',3600,1/3600],['Day',86400,1/86400],['Week',604800,1/604800],['Month (30d)',2592000,1/2592000],['Year (365d)',31536000,1/31536000]]},
  {name:'Pressure',units:[['Pascal (Pa)',1,1],['Kilopascal (kPa)',1000,0.001],['Bar',100000,1e-5],['PSI',6894.757,1/6894.757],['Atmosphere (atm)',101325,1/101325],['mmHg (Torr)',133.322,1/133.322]]},
  {name:'Energy',units:[['Joule (J)',1,1],['Kilojoule (kJ)',1000,0.001],['Calorie (cal)',4.184,1/4.184],['Kilocalorie (kcal)',4184,1/4184],['Watt-hour (Wh)',3600,1/3600],['kWh',3600000,1/3600000],['BTU',1055.06,1/1055.06]]}
];

var state={catIdx:0,fromIdx:0,toIdx:1,useCount:0,removeAds:false};
var catBar=document.getElementById('cat-bar');
var catTitle=document.getElementById('cat-title');
var inputFrom=document.getElementById('input-from');
var inputTo=document.getElementById('input-to');
var unitFrom=document.getElementById('unit-from');
var unitTo=document.getElementById('unit-to');
var hint=document.getElementById('formula-hint');

CATEGORIES.forEach(function(cat,i){
  var btn=document.createElement('button');
  btn.className='cat-btn'+(i===0?' active':'');
  btn.textContent=cat.name;
  btn.addEventListener('click',function(){
    document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    state.catIdx=i; state.fromIdx=0; state.toIdx=1;
    inputFrom.value=''; inputTo.value='';
    loadUnits(); maybeInterstitial();
  });
  catBar.appendChild(btn);
});

function loadUnits(){
  var cat=CATEGORIES[state.catIdx];
  catTitle.textContent=cat.name;
  unitFrom.innerHTML=''; unitTo.innerHTML='';
  cat.units.forEach(function(u,i){
    var o1=document.createElement('option'); o1.value=i; o1.textContent=u[0]; unitFrom.appendChild(o1);
    var o2=document.createElement('option'); o2.value=i; o2.textContent=u[0]; unitTo.appendChild(o2);
  });
  unitFrom.value=state.fromIdx; unitTo.value=state.toIdx;
  updateHint();
}

function toBase(val,idx){
  var cat=CATEGORIES[state.catIdx];
  if(cat.special){if(idx===0)return val;if(idx===1)return(val-32)*5/9;if(idx===2)return val-273.15;}
  return val*cat.units[idx][1];
}
function fromBase(val,idx){
  var cat=CATEGORIES[state.catIdx];
  if(cat.special){if(idx===0)return val;if(idx===1)return val*9/5+32;if(idx===2)return val+273.15;}
  return val*cat.units[idx][2];
}

function calcFromTo(){
  var v=parseFloat(inputFrom.value);
  if(isNaN(v)){inputTo.value='';updateHint();return;}
  var r=fromBase(toBase(v,parseInt(unitFrom.value)),parseInt(unitTo.value));
  inputTo.value=+r.toPrecision(8); updateHint();
}
function calcToFrom(){
  var v=parseFloat(inputTo.value);
  if(isNaN(v)){inputFrom.value='';updateHint();return;}
  var r=fromBase(toBase(v,parseInt(unitTo.value)),parseInt(unitFrom.value));
  inputFrom.value=+r.toPrecision(8); updateHint();
}

function updateHint(){
  var cat=CATEGORIES[state.catIdx];
  var fi=parseInt(unitFrom.value),ti=parseInt(unitTo.value);
  var fn=cat.units[fi][0].split(' ')[0],tn=cat.units[ti][0].split(' ')[0];
  if(cat.special){
    var tbl=[['°C','°F','× 9/5 + 32'],['°C','K','+ 273.15'],['°F','°C','(x−32) × 5/9'],['°F','K','(x−32)×5/9+273.15'],['K','°C','− 273.15'],['K','°F','(x−273.15)×9/5+32']];
    var f=tbl.filter(function(x){return x[0]===fn&&x[1]===tn;})[0];
    hint.textContent=f?fn+' → '+tn+': x '+f[2]:'';
  } else {
    if(fi===ti){hint.textContent='1 '+fn+' = 1 '+tn;return;}
    var ratio=fromBase(toBase(1,fi),ti);
    hint.textContent='1 '+fn+' = '+(+ratio.toPrecision(6))+' '+tn;
  }
}

inputFrom.addEventListener('input',calcFromTo);
inputTo.addEventListener('input',calcToFrom);
unitFrom.addEventListener('change',function(){state.fromIdx=parseInt(unitFrom.value);if(inputFrom.value)calcFromTo();else updateHint();});
unitTo.addEventListener('change',function(){state.toIdx=parseInt(unitTo.value);if(inputFrom.value)calcFromTo();else updateHint();});

document.getElementById('btn-swap').addEventListener('click',function(){
  var tv=inputFrom.value,ti=unitFrom.value;
  inputFrom.value=inputTo.value; unitFrom.value=unitTo.value;
  inputTo.value=tv; unitTo.value=ti;
  state.fromIdx=parseInt(unitFrom.value); state.toIdx=parseInt(unitTo.value);
  if(inputFrom.value)calcFromTo();else updateHint();
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';}};

function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%10===0&&window.Android)Android.showInterstitial();}

function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';loadUnits();}
window.onAdMobLoaded=function(){};
init();
</script>
</body>
</html>

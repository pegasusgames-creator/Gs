<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Savings Goal</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#66BB6A; --accent2:#2E7D32; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
input[type=text],input[type=number],input[type=date] { width:100%; background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 12px; border-radius:8px; outline:none; margin-bottom:10px; }
input:focus { box-shadow:0 0 0 2px var(--accent); }
.goal-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.goal-name { font-size:1.1rem; font-weight:700; }
.goal-target { font-size:0.82rem; color:var(--muted); margin-top:2px; }
.progress-bar-wrap { height:18px; background:var(--card); border-radius:9px; overflow:hidden; margin-bottom:8px; }
.progress-bar-fill { height:100%; border-radius:9px; background:var(--accent); transition:width 0.4s; }
.progress-row { display:flex; justify-content:space-between; font-size:0.82rem; margin-bottom:10px; }
.progress-saved { color:var(--accent); font-weight:700; }
.progress-pct { color:var(--muted); }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.stat-box { background:var(--card); border-radius:8px; padding:10px; text-align:center; }
.stat-label { font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.stat-value { font-size:1rem; font-weight:700; color:var(--accent); }
.goal-complete { background:#1a3a1a; border:2px solid var(--accent); border-radius:10px; padding:12px; text-align:center; font-size:1.1rem; font-weight:700; color:var(--accent); margin-bottom:10px; }
.add-savings-row { display:flex; gap:8px; }
.add-savings-row input { flex:1; margin-bottom:0; }
#btn-add-savings { min-height:44px; background:var(--accent); border:none; color:#fff; font-size:0.9rem; font-weight:700; border-radius:8px; cursor:pointer; white-space:nowrap; padding:0 14px; }
#btn-add-savings.btn-pressed { opacity:0.8; }
#btn-save-goal { width:100%; min-height:48px; background:var(--accent); border:none; color:#fff; font-size:0.95rem; font-weight:700; border-radius:10px; cursor:pointer; }
#btn-save-goal.btn-pressed { opacity:0.8; }
.history-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #1a1a3a; font-size:0.85rem; }
.history-item:last-child { border-bottom:none; }
.history-date { color:var(--muted); font-size:0.78rem; }
.history-amount { color:var(--accent); font-weight:700; }
.empty-msg { text-align:center; color:var(--muted); font-size:0.85rem; padding:16px; }
.no-goal-msg { text-align:center; color:var(--muted); padding:16px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Savings <span>Goal</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card" id="goal-display-card" style="display:none;">
      <div class="card-title">Your Goal</div>
      <div id="goal-view"></div>
    </div>
    <div class="card">
      <div class="card-title">Setup Goal</div>
      <label>Goal Name</label>
      <input type="text" id="goal-name" placeholder="e.g. Emergency Fund">
      <label>Target Amount ($)</label>
      <input type="number" id="goal-target" placeholder="5000" min="0" step="100">
      <label>Current Saved ($)</label>
      <input type="number" id="goal-saved" placeholder="0" min="0" step="10" value="0">
      <label>Target Date</label>
      <input type="date" id="goal-date">
      <button id="btn-save-goal">Set Goal</button>
    </div>
    <div class="card" id="add-savings-card" style="display:none;">
      <div class="card-title">Add Savings</div>
      <div class="add-savings-row">
        <input type="number" id="savings-add-amt" placeholder="Amount to add" min="0" step="10">
        <button id="btn-add-savings">Add</button>
      </div>
    </div>
    <div class="card" id="history-card" style="display:none;">
      <div class="card-title">History</div>
      <div id="history-list"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false };
var STORAGE_KEY = 'savings_goal_v1';
var goalData = null;
var history = [];

function load(){ try{ var d=localStorage.getItem(STORAGE_KEY); if(d){ var p=JSON.parse(d); goalData=p.goal||null; history=p.history||[]; }}catch(e){} }
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({goal:goalData,history:history})); }catch(e){} }
function fmt(n){ return '$'+(n||0).toFixed(2); }

function daysUntil(dateStr){
  var now = new Date(); now.setHours(0,0,0,0);
  var target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.ceil((target-now)/86400000);
}

function render(){
  if(!goalData){ document.getElementById('goal-display-card').style.display='none'; document.getElementById('add-savings-card').style.display='none'; document.getElementById('history-card').style.display='none'; return; }
  document.getElementById('goal-display-card').style.display='';
  document.getElementById('add-savings-card').style.display='';
  var g=goalData;
  var pct = Math.min(100, (g.saved/g.target)*100);
  var remaining = Math.max(0, g.target - g.saved);
  var days = daysUntil(g.date);
  var weeks = days>0 ? Math.ceil(days/7) : 0;
  var months = days>0 ? Math.ceil(days/30) : 0;
  var perWeek = weeks>0 ? remaining/weeks : remaining;
  var perMonth = months>0 ? remaining/months : remaining;
  var view = document.getElementById('goal-view');
  var complete = g.saved >= g.target;
  view.innerHTML = (complete?'<div class="goal-complete">🎉 Goal Reached! Congratulations!</div>':'') +
    '<div class="goal-header"><div><div class="goal-name">'+escH(g.name)+'</div><div class="goal-target">Target: '+fmt(g.target)+'</div></div><div style="font-size:1.2rem;font-weight:700;color:var(--accent)">'+pct.toFixed(1)+'%</div></div>'+
    '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="progress-row"><span class="progress-saved">Saved: '+fmt(g.saved)+'</span><span class="progress-pct">Remaining: '+fmt(remaining)+'</span></div>'+
    '<div class="stats-grid">'+
    '<div class="stat-box"><div class="stat-label">Days Left</div><div class="stat-value">'+(days>0?days:'Past')+'</div></div>'+
    '<div class="stat-box"><div class="stat-label">Target Date</div><div class="stat-value" style="font-size:0.85rem">'+g.date+'</div></div>'+
    '<div class="stat-box"><div class="stat-label">Save / Week</div><div class="stat-value">'+fmt(perWeek)+'</div></div>'+
    '<div class="stat-box"><div class="stat-label">Save / Month</div><div class="stat-value">'+fmt(perMonth)+'</div></div>'+
    '</div>';
  // History
  if(history.length>0){
    document.getElementById('history-card').style.display='';
    var hlist=document.getElementById('history-list');
    hlist.innerHTML='';
    history.slice().reverse().slice(0,20).forEach(function(h){
      var div=document.createElement('div');
      div.className='history-item';
      div.innerHTML='<span>'+escH(h.note||'Savings added')+'</span><span class="history-date">'+h.date+'</span><span class="history-amount">+'+fmt(h.amount)+'</span>';
      hlist.appendChild(div);
    });
  } else { document.getElementById('history-card').style.display='none'; }
  // Prefill form
  document.getElementById('goal-name').value = g.name;
  document.getElementById('goal-target').value = g.target;
  document.getElementById('goal-saved').value = g.saved;
  document.getElementById('goal-date').value = g.date;
}

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('btn-save-goal').addEventListener('click',function(){
  var name=document.getElementById('goal-name').value.trim()||'My Goal';
  var target=parseFloat(document.getElementById('goal-target').value)||0;
  var saved=parseFloat(document.getElementById('goal-saved').value)||0;
  var date=document.getElementById('goal-date').value;
  if(target<=0||!date) return;
  goalData={name:name,target:target,saved:saved,date:date};
  save();
  render();
  maybeInterstitial();
});

document.getElementById('btn-add-savings').addEventListener('click',function(){
  if(!goalData) return;
  var amt=parseFloat(document.getElementById('savings-add-amt').value)||0;
  if(amt<=0) return;
  goalData.saved += amt;
  var today=new Date(); var ds=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  history.push({amount:amt,date:ds,note:'Savings added'});
  save();
  document.getElementById('savings-add-amt').value='';
  render();
  maybeInterstitial();
});

// Default target date 1 year from now
(function(){ var d=new Date(); d.setFullYear(d.getFullYear()+1); document.getElementById('goal-date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();

load();
render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

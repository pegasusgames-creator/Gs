<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Number Base Converter</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#607D8B; --accent2:#37474F; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
.input-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
#number-input { flex:1; background:var(--card); border:none; color:var(--text); font-size:1.1rem; padding:10px 12px; border-radius:8px; outline:none; font-family:monospace; letter-spacing:1px; }
#number-input:focus { box-shadow:0 0 0 2px var(--accent); }
select { background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 10px; border-radius:8px; outline:none; }
.base-row { display:flex; align-items:center; gap:10px; padding:10px; background:var(--card); border-radius:10px; margin-bottom:8px; }
.base-label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; width:60px; flex-shrink:0; }
.base-value { flex:1; font-family:monospace; font-size:1rem; font-weight:600; word-break:break-all; letter-spacing:1px; }
.base-value.active { color:var(--accent); }
.hex-btns { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:8px; }
.hex-btn { min-height:44px; background:var(--card); border:none; color:var(--text); font-size:1.1rem; font-weight:700; border-radius:8px; cursor:pointer; font-family:monospace; }
.hex-btn.btn-pressed { opacity:0.7; }
.hex-btns-label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.error-msg { color:#f44; font-size:0.82rem; margin-top:4px; min-height:18px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Number <span>Base</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Input</div>
      <div class="input-row">
        <input id="number-input" type="text" placeholder="Enter number..." autocomplete="off" autocorrect="off" spellcheck="false">
        <select id="base-select">
          <option value="2">Base 2</option>
          <option value="8">Base 8</option>
          <option value="10" selected>Base 10</option>
          <option value="16">Base 16</option>
        </select>
      </div>
      <div class="error-msg" id="error-msg"></div>
      <div class="hex-btns-label" id="hex-label" style="display:none;">Hex Digits</div>
      <div class="hex-btns" id="hex-btns" style="display:none;">
        <button class="hex-btn" data-digit="A">A</button>
        <button class="hex-btn" data-digit="B">B</button>
        <button class="hex-btn" data-digit="C">C</button>
        <button class="hex-btn" data-digit="D">D</button>
        <button class="hex-btn" data-digit="E">E</button>
        <button class="hex-btn" data-digit="F">F</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Conversions</div>
      <div class="base-row" id="row-bin">
        <span class="base-label">Binary<br>Base 2</span>
        <span class="base-value" id="val-bin">—</span>
      </div>
      <div class="base-row" id="row-oct">
        <span class="base-label">Octal<br>Base 8</span>
        <span class="base-value" id="val-oct">—</span>
      </div>
      <div class="base-row" id="row-dec">
        <span class="base-label">Decimal<br>Base 10</span>
        <span class="base-value" id="val-dec">—</span>
      </div>
      <div class="base-row" id="row-hex">
        <span class="base-label">Hex<br>Base 16</span>
        <span class="base-value" id="val-hex">—</span>
      </div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false };

function getBase(){ return parseInt(document.getElementById('base-select').value); }

var INPUT_PATTERNS = { 2:/^[01]*$/, 8:/^[0-7]*$/, 10:/^[0-9]*$/, 16:/^[0-9A-Fa-f]*$/ };

function convert(){
  var raw = document.getElementById('number-input').value.trim().toUpperCase();
  var base = getBase();
  var errEl = document.getElementById('error-msg');
  ['bin','oct','dec','hex'].forEach(function(k){
    document.getElementById('val-'+k).textContent = '—';
    document.getElementById('val-'+k).className = 'base-value';
  });
  if(!raw){ errEl.textContent=''; return; }
  if(!INPUT_PATTERNS[base].test(raw)){ errEl.textContent='Invalid digits for base '+base; return; }
  errEl.textContent='';
  var decimal = parseInt(raw, base);
  if(isNaN(decimal)){ errEl.textContent='Invalid number'; return; }
  document.getElementById('val-bin').textContent = decimal.toString(2);
  document.getElementById('val-oct').textContent = decimal.toString(8);
  document.getElementById('val-dec').textContent = decimal.toString(10);
  document.getElementById('val-hex').textContent = decimal.toString(16).toUpperCase();
  var activeMap = {2:'bin',8:'oct',10:'dec',16:'hex'};
  document.getElementById('val-'+activeMap[base]).classList.add('active');
  maybeInterstitial();
}

document.getElementById('number-input').addEventListener('input', convert);
document.getElementById('base-select').addEventListener('change', function(){
  var base = getBase();
  var hexBtns = document.getElementById('hex-btns');
  var hexLabel = document.getElementById('hex-label');
  if(base===16){ hexBtns.style.display='grid'; hexLabel.style.display=''; }
  else { hexBtns.style.display='none'; hexLabel.style.display='none'; }
  document.getElementById('number-input').value = '';
  convert();
});

document.getElementById('hex-btns').addEventListener('click', function(e){
  var btn = e.target.closest('.hex-btn');
  if(!btn) return;
  var inp = document.getElementById('number-input');
  inp.value += btn.dataset.digit;
  convert();
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

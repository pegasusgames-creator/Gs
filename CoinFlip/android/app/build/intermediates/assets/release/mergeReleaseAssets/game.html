<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coin Flip</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  body{background:#1a1208;color:#f5e6b0;font-family:'Georgia',serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
  h1{font-size:1.6rem;margin:18px 0 6px;color:#f0c040;letter-spacing:2px;text-shadow:0 2px 8px #0008}
  #coin-wrap{width:200px;height:200px;margin:20px auto;cursor:pointer;perspective:600px}
  #coin{width:200px;height:200px;position:relative;transform-style:preserve-3d}
  #coin.flipping{animation:flip 1.1s ease-out forwards}
  @keyframes flip{0%{transform:rotateY(0)}20%{transform:rotateY(720deg)}50%{transform:rotateY(1440deg)}80%{transform:rotateY(1710deg)}90%{transform:rotateY(1746deg)}100%{transform:rotateY(var(--end-rot,1800deg))}}
  .face{position:absolute;width:200px;height:200px;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:5rem;box-shadow:0 4px 24px #0008}
  #heads{background:radial-gradient(circle at 40% 35%,#ffe066,#c8960c 60%,#7a5800)}
  #tails{background:radial-gradient(circle at 40% 35%,#e0e0e0,#a0a0a0 60%,#505050);transform:rotateY(180deg)}
  #result{font-size:2.6rem;font-weight:bold;min-height:3rem;margin:8px 0;color:#f0c040;text-shadow:0 2px 12px #f0c04066}
  #flip-btn{background:linear-gradient(135deg,#c8960c,#f0c040);color:#1a1208;border:none;border-radius:50px;padding:14px 44px;font-size:1.15rem;font-weight:bold;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 16px #f0c04044;transition:transform 0.1s}
  #flip-btn:active{transform:scale(0.95)}
  #stats{display:flex;gap:32px;margin:16px 0 12px;font-size:0.9rem;color:#c8a840}
  .stat{text-align:center}
  .stat-num{font-size:1.7rem;font-weight:bold;color:#f0c040;display:block}
  #streak{font-size:0.9rem;color:#c8a840aa;min-height:1.2rem;margin-bottom:8px}
  #history{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:320px;padding:0 16px;max-height:60px;overflow:hidden;margin-top:4px}
  .hist-h{width:18px;height:18px;border-radius:50%;background:#f0c040;color:#1a1208;font-size:0.55rem;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .hist-t{width:18px;height:18px;border-radius:50%;background:#707070;color:#fff;font-size:0.55rem;display:flex;align-items:center;justify-content:center;font-weight:bold}
  #remove-ads{position:fixed;top:8px;right:8px;background:#ffffff18;border:1px solid #f0c04044;color:#f0c04099;font-size:0.7rem;padding:4px 8px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<button id="remove-ads" onclick="Android.purchase('remove_ads')">Remove Ads</button>
<h1>🪙 Coin Flip</h1>
<div id="coin-wrap" onclick="doFlip()">
  <div id="coin">
    <div class="face" id="heads">👑</div>
    <div class="face" id="tails">⚔️</div>
  </div>
</div>
<div id="result">Tap to flip!</div>
<div id="streak"></div>
<div id="stats">
  <div class="stat"><span class="stat-num" id="h-count">0</span>Heads</div>
  <div class="stat"><span class="stat-num" id="total-count">0</span>Total</div>
  <div class="stat"><span class="stat-num" id="t-count">0</span>Tails</div>
</div>
<button id="flip-btn" onclick="doFlip()">FLIP</button>
<div id="history"></div>
<script>
let heads=parseInt(localStorage.getItem('cf_h')||'0'),tails=parseInt(localStorage.getItem('cf_t')||'0'),streak=parseInt(localStorage.getItem('cf_streak')||'0'),lastSide=localStorage.getItem('cf_last')||'',flipping=false,flipCount=0;
updateStats();
function doFlip(){
  if(flipping)return;flipping=true;
  const coin=document.getElementById('coin'),isHeads=Math.random()<0.5,end=isHeads?1800:1980;
  coin.style.setProperty('--end-rot',end+'deg');coin.classList.remove('flipping');void coin.offsetWidth;coin.classList.add('flipping');
  setTimeout(()=>{
    const side=isHeads?'heads':'tails';
    document.getElementById('result').textContent=isHeads?'👑 HEADS':'⚔️ TAILS';
    streak=(side===lastSide)?streak+1:1;lastSide=side;
    if(isHeads)heads++;else tails++;
    localStorage.setItem('cf_h',heads);localStorage.setItem('cf_t',tails);localStorage.setItem('cf_streak',streak);localStorage.setItem('cf_last',lastSide);
    updateStats();addHistory(isHeads);flipping=false;
    if(++flipCount%10===0&&window.Android)Android.showInterstitial();
  },1100);
}
function updateStats(){
  document.getElementById('h-count').textContent=heads;document.getElementById('t-count').textContent=tails;document.getElementById('total-count').textContent=heads+tails;
  document.getElementById('streak').textContent=streak>=2&&lastSide?streak+'x '+(lastSide==='heads'?'👑':'⚔️')+' streak!':'';
}
function addHistory(isHeads){
  const h=document.getElementById('history'),dot=document.createElement('div');
  dot.className=isHeads?'hist-h':'hist-t';dot.textContent=isHeads?'H':'T';
  h.insertBefore(dot,h.firstChild);if(h.children.length>36)h.removeChild(h.lastChild);
}
window.onPurchaseComplete=function(id){if(id==='remove_ads'){document.getElementById('remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
</script>
</body>
</html>

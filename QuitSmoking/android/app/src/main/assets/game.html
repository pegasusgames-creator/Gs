<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quit Smoking</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0a1a0a; --surface:#0f2a0f; --card:#0d3a0d; --accent:#4CAF50; --text:#eaeaea; --muted:#88aa88; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.ig { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
.ig label { font-size:0.72rem; color:var(--muted); }
.ig input { background:var(--card); border:1px solid rgba(76,175,80,0.2); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.95rem; width:100%; }
.row2 { display:flex; gap:8px; } .row2 .ig { flex:1; }
.btn-p { background:var(--accent); border:none; color:#0a1a0a; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; width:100%; margin-top:4px; }
.counter-big { text-align:center; padding:8px 0; }
#days-count { font-size:4rem; font-weight:900; color:var(--accent); line-height:1; }
#counter-label { font-size:0.85rem; color:var(--muted); margin-top:4px; }
#live-counter { font-size:1rem; color:var(--accent); margin-top:8px; font-weight:700; }
.stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.stat-box { background:var(--card); border-radius:10px; padding:12px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:4px; }
.stat-val { font-size:1.1rem; font-weight:700; color:var(--accent); }
.milestone { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(76,175,80,0.1); }
.milestone:last-child { border-bottom:none; }
.ms-icon { font-size:1.4rem; }
.ms-info { flex:1; }
.ms-name { font-size:0.9rem; font-weight:700; }
.ms-desc { font-size:0.72rem; color:var(--muted); }
.ms-status { font-size:0.8rem; font-weight:700; }
.ms-done { color:var(--accent); }
.ms-pend { color:var(--muted); }
.quote { font-size:0.88rem; font-style:italic; line-height:1.6; color:var(--muted); text-align:center; padding:4px 0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Quit <span>Smoking</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card" id="setup-card">
      <div class="card-title">Setup Your Quit</div>
      <div class="ig"><label>Quit Date</label><input type="date" id="i-date"></div>
      <div class="row2">
        <div class="ig"><label>Cigs/day (before)</label><input type="number" id="i-cpd" value="20" min="1" max="100"></div>
        <div class="ig"><label>Cost per pack ($)</label><input type="number" id="i-cost" value="8.00" step="0.50" min="0"></div>
      </div>
      <button class="btn-p" id="btn-save">Save &amp; Track</button>
    </div>
    <div class="card" id="counter-card" style="display:none">
      <div class="counter-big">
        <div id="days-count">0</div>
        <div id="counter-label">Days Smoke-Free</div>
        <div id="live-counter">0d 0h 0m 0s</div>
      </div>
    </div>
    <div class="card" id="stats-card" style="display:none">
      <div class="card-title">Benefits</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-lbl">Cigarettes Not Smoked</div><div class="stat-val" id="st-cigs">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Money Saved</div><div class="stat-val" id="st-money">$0</div></div>
        <div class="stat-box"><div class="stat-lbl">Life Regained</div><div class="stat-val" id="st-life">0h</div></div>
        <div class="stat-box"><div class="stat-lbl">Days Free</div><div class="stat-val" id="st-days">0</div></div>
      </div>
    </div>
    <div class="card" id="milestones-card" style="display:none">
      <div class="card-title">Milestones</div>
      <div id="milestones-list"></div>
    </div>
    <div class="card" id="quote-card" style="display:none">
      <div class="card-title">Motivation</div>
      <div class="quote" id="quote-text"></div>
    </div>
    <div class="card" id="edit-card" style="display:none">
      <button class="btn-p" id="btn-edit" style="background:rgba(239,83,80,0.2);color:#ef5350;">Reset / Change Quit Date</button>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var QUOTES=['Every cigarette not smoked is a victory. You are stronger than your cravings.','The first step was the hardest. Everything after is proof of your strength.','Your lungs are healing. Your heart is thankful. Keep going.','One day at a time. One breath at a time. You\'ve got this.','The money you save is the freedom you earn. Stay the course.','Cravings last 3-5 minutes. You are bigger than a craving.'];
var MILESTONES=[{days:0,label:'24 Hours',icon:'⭐',desc:'Blood oxygen normalizes, carbon monoxide leaves.'},
{days:2,label:'2 Days',icon:'🌟',desc:'Sense of smell and taste begins improving.'},
{days:7,label:'1 Week',icon:'🏅',desc:'Circulation begins to improve noticeably.'},
{days:14,label:'2 Weeks',icon:'💪',desc:'Breathing becomes easier, exercise tolerance up.'},
{days:30,label:'1 Month',icon:'🥇',desc:'Coughing and shortness of breath decrease.'},
{days:90,label:'3 Months',icon:'🏆',desc:'Lung function improves significantly.'},
{days:365,label:'1 Year',icon:'🎉',desc:'Heart disease risk cut in half!'}];

var data=JSON.parse(localStorage.getItem('qs_data')||'null');
var ticker=null;

function loadSetup(){
  if(data){
    document.getElementById('i-date').value=new Date(data.quitDate).toISOString().slice(0,10);
    document.getElementById('i-cpd').value=data.cpd;
    document.getElementById('i-cost').value=data.cost;
  } else {
    var now=new Date(); now.setHours(0,0,0,0);
    document.getElementById('i-date').value=now.toISOString().slice(0,10);
  }
}

function showTracker(){
  document.getElementById('setup-card').style.display='none';
  ['counter-card','stats-card','milestones-card','quote-card','edit-card'].forEach(function(id){document.getElementById(id).style.display='';});
  var qi=Math.floor(Date.now()/1000)%QUOTES.length;
  document.getElementById('quote-text').textContent=QUOTES[qi];
  if(ticker)clearInterval(ticker);
  ticker=setInterval(updateCounters,1000);
  updateCounters();
}

function updateCounters(){
  var elapsed=(Date.now()-data.quitDate)/1000;
  if(elapsed<0)elapsed=0;
  var days=Math.floor(elapsed/86400);
  var h=Math.floor((elapsed%86400)/3600);
  var m=Math.floor((elapsed%3600)/60);
  var s=Math.floor(elapsed%60);
  document.getElementById('days-count').textContent=days;
  document.getElementById('live-counter').textContent=days+'d '+h+'h '+m+'m '+s+'s';
  document.getElementById('st-days').textContent=days;
  var cigsNotSmoked=Math.floor(elapsed/86400*data.cpd);
  var costPerCig=data.cost/20;
  var saved=(cigsNotSmoked*costPerCig).toFixed(2);
  var lifeMin=cigsNotSmoked*11;
  var lifeH=Math.floor(lifeMin/60);
  document.getElementById('st-cigs').textContent=cigsNotSmoked;
  document.getElementById('st-money').textContent='$'+saved;
  document.getElementById('st-life').textContent=lifeH+'h';
  renderMilestones(days);
}

function renderMilestones(days){
  document.getElementById('milestones-list').innerHTML=MILESTONES.map(function(ms){
    var achieved=days>=(ms.days===0?1/24:ms.days);
    var sinceHours=(Date.now()-data.quitDate)/3600000;
    if(ms.days===0)achieved=sinceHours>=24;
    return '<div class="milestone"><span class="ms-icon">'+ms.icon+'</span><div class="ms-info"><div class="ms-name">'+ms.label+'</div><div class="ms-desc">'+ms.desc+'</div></div><span class="ms-status '+(achieved?'ms-done':'ms-pend')+'">'+(achieved?'Done!':'Pending')+'</span></div>';
  }).join('');
}

document.getElementById('btn-save').addEventListener('click',function(){
  var dateVal=document.getElementById('i-date').value;
  if(!dateVal){alert('Select your quit date.');return;}
  var cpd=parseInt(document.getElementById('i-cpd').value)||20;
  var cost=parseFloat(document.getElementById('i-cost').value)||8;
  var parts=dateVal.split('-');
  var quitDate=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2])).getTime();
  data={quitDate:quitDate,cpd:cpd,cost:cost};
  localStorage.setItem('qs_data',JSON.stringify(data));
  showTracker();
});

document.getElementById('btn-edit').addEventListener('click',function(){
  if(confirm('Reset your quit tracking?')){
    data=null;localStorage.removeItem('qs_data');
    if(ticker)clearInterval(ticker);
    document.getElementById('setup-card').style.display='';
    ['counter-card','stats-card','milestones-card','quote-card','edit-card'].forEach(function(id){document.getElementById(id).style.display='none';});
    loadSetup();
  }
});

loadSetup();
if(data)showTracker();

// Interstitial ad helper
var _interstitialCount = 0;
var _adsRemoved = false;
function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

// Show interstitial every 5 taps
var _tapCount = 0;
document.addEventListener('click', function() {
  _tapCount++;
  if (_tapCount % 5 === 0) _showInterstitial();
});
</script>
</body>
</html>

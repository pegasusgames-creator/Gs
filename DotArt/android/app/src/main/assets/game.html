<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DotArt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#1a0a14;--surface:#2a1020;--accent:#F06292;--text:#eaeaea;--muted:#886680;--radius:10px;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;padding:8px 8px 0;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-shrink:0;}
header h1{font-size:1.2rem;font-weight:700;}
header h1 span{color:var(--accent);}
#toolbar{display:flex;gap:4px;flex-shrink:0;margin-bottom:6px;align-items:center;flex-wrap:wrap;}
.palette{display:flex;gap:3px;flex-wrap:wrap;flex:1;}
.color-btn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
.color-btn.active{border-color:#fff;transform:scale(1.2);}
.tool-btn{background:var(--surface);border:1px solid #444;color:var(--text);padding:5px 10px;border-radius:var(--radius);font-size:0.75rem;cursor:pointer;touch-action:manipulation;flex-shrink:0;}
.tool-btn.active,.tool-btn:active{background:var(--accent);color:#000;border-color:var(--accent);}
.tool-btn.btn-pressed{transform:scale(0.92);}
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#grid{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;width:min(calc(100vw - 16px),calc(100vh - 160px));aspect-ratio:1;}
.dot{border-radius:50%;background:#1e1e2e;cursor:pointer;transition:background 0.1s;}
.dot.active{background:var(--dot-color,#F06292);}
#btns{display:flex;gap:6px;flex-shrink:0;padding:6px 0;}
.btn{flex:1;background:var(--surface);border:1px solid #444;color:var(--text);padding:9px;border-radius:var(--radius);font-size:0.78rem;cursor:pointer;touch-action:manipulation;}
.btn.btn-pressed{transform:scale(0.93);}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);}
#banner{height:50px;background:#111;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.75rem;flex-shrink:0;}
#export-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:10;padding:20px;overflow-y:auto;}
#export-text{background:#0a0a0a;color:#aaffaa;font-family:monospace;font-size:0.6rem;line-height:1.1;padding:12px;border-radius:8px;white-space:pre;word-break:break-all;}
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:0.65rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:9999;letter-spacing:0.5px">Remove Ads</button>
<div id="app">
  <header><h1>Dot<span>Art</span></h1><span id="mode-label" style="font-size:0.8rem;color:var(--muted)">Paint</span></header>
  <div id="toolbar">
    <div class="palette" id="palette"></div>
    <button class="tool-btn active" id="btn-paint">Paint</button>
    <button class="tool-btn" id="btn-erase">Erase</button>
  </div>
  <div id="canvas-wrap"><div id="grid"></div></div>
  <div id="btns">
    <button class="btn" id="btn-clear">Clear</button>
    <button class="btn" id="btn-save">Save</button>
    <button class="btn" id="btn-load">Load</button>
    <button class="btn" id="btn-export">Export</button>
  </div>
  <div id="banner">Ad Banner</div>
</div>
<div id="export-overlay">
  <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
    <span style="color:#fff;font-weight:700;">Text Export</span>
    <button onclick="document.getElementById('export-overlay').style.display='none'" style="background:var(--accent);border:none;color:#000;padding:6px 14px;border-radius:8px;font-weight:700;">Close</button>
  </div>
  <pre id="export-text"></pre>
</div>
<script>
const COLORS=['#F06292','#F44336','#FF9800','#FFEB3B','#4CAF50','#00BCD4','#2196F3','#9C27B0','#FF5722','#FFFFFF'];
const EMPTY_CHAR='·',FILLED_CHAR='●';
let currentColor=COLORS[0],eraseMode=false,isDrawing=false;
const grid=document.getElementById('grid');
let dots=[];

// Palette
const pal=document.getElementById('palette');
COLORS.forEach((c,i)=>{
  const b=document.createElement('div');
  b.className='color-btn'+(i===0?' active':'');
  b.style.background=c;
  b.addEventListener('click',()=>{
    currentColor=c;eraseMode=false;
    document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('btn-paint').classList.add('active');
    document.getElementById('btn-erase').classList.remove('active');
    document.getElementById('mode-label').textContent='Paint';
  });
  pal.appendChild(b);
});

document.getElementById('btn-paint').addEventListener('click',function(){
  eraseMode=false;
  this.classList.add('active');document.getElementById('btn-erase').classList.remove('active');
  document.getElementById('mode-label').textContent='Paint';
});
document.getElementById('btn-erase').addEventListener('click',function(){
  eraseMode=true;
  this.classList.add('active');document.getElementById('btn-paint').classList.remove('active');
  document.getElementById('mode-label').textContent='Erase';
});

// Grid
for(let i=0;i<400;i++){
  const d=document.createElement('div');
  d.className='dot';d.dataset.i=i;dots.push(d);
  d.addEventListener('mousedown',()=>{isDrawing=true;paintDot(d);});
  d.addEventListener('mouseover',()=>{if(isDrawing)paintDot(d);});
  grid.appendChild(d);
}
document.addEventListener('mouseup',()=>isDrawing=false);

grid.addEventListener('touchstart',e=>{isDrawing=true;paintAt(e.touches[0]);},{passive:true});
grid.addEventListener('touchmove',e=>{e.preventDefault();paintAt(e.touches[0]);},{passive:false});
grid.addEventListener('touchend',()=>isDrawing=false);

function paintAt(touch){
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  if(el&&el.classList.contains('dot'))paintDot(el);
}
function paintDot(d){
  if(eraseMode){d.classList.remove('active');d.style.background='';d.dataset.color='';}
  else{d.classList.add('active');d.style.background=currentColor;d.dataset.color=currentColor;}
}

document.getElementById('btn-clear').addEventListener('click',function(){
  this.classList.add('btn-pressed');setTimeout(()=>this.classList.remove('btn-pressed'),120);
  dots.forEach(d=>{d.classList.remove('active');d.style.background='';d.dataset.color='';});
});

document.getElementById('btn-save').addEventListener('click',function(){
  this.classList.add('btn-pressed');setTimeout(()=>this.classList.remove('btn-pressed'),120);
  const data=dots.map(d=>d.dataset.color||'');
  localStorage.setItem('dotart_save',JSON.stringify(data));
  this.textContent='Saved!';setTimeout(()=>this.textContent='Save',1000);
});

document.getElementById('btn-load').addEventListener('click',function(){
  this.classList.add('btn-pressed');setTimeout(()=>this.classList.remove('btn-pressed'),120);
  const data=localStorage.getItem('dotart_save');
  if(!data)return;
  const arr=JSON.parse(data);
  dots.forEach((d,i)=>{
    if(arr[i]){d.classList.add('active');d.style.background=arr[i];d.dataset.color=arr[i];}
    else{d.classList.remove('active');d.style.background='';d.dataset.color='';}
  });
});

document.getElementById('btn-export').addEventListener('click',function(){
  this.classList.add('btn-pressed');setTimeout(()=>this.classList.remove('btn-pressed'),120);
  let text='';
  for(let r=0;r<20;r++){
    for(let c=0;c<20;c++){
      text+=dots[r*20+c].dataset.color?FILLED_CHAR:EMPTY_CHAR;
    }
    text+='\n';
  }
  document.getElementById('export-text').textContent=text;
  document.getElementById('export-overlay').style.display='block';
});

// ── AppLovin MAX / IAP bridge ──────────────────────────────────────────
var _adsRemoved = false;
var _interstitialCount = 0;

function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};

// Restore remove-ads state on load
if (window.Android) {
  try { if (Android.isPurchased && Android.isPurchased('remove_ads')) {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
  }} catch(e) {}
}

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fasting Timer</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#FFCA28; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.plan-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.pbtn { flex:1; min-width:60px; background:var(--card); border:2px solid transparent; border-radius:10px; color:var(--muted); font-size:0.9rem; font-weight:700; padding:10px 6px; cursor:pointer; text-align:center; }
.pbtn.active { border-color:var(--accent); color:var(--accent); }
#timer-area { display:flex; flex-direction:column; align-items:center; padding:10px 0; }
#ring-wrap { position:relative; width:160px; height:160px; margin-bottom:16px; }
#ring-svg { width:160px; height:160px; transform:rotate(-90deg); }
#ring-bg { fill:none; stroke:rgba(255,202,40,0.15); stroke-width:10; }
#ring-fill { fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; stroke-dasharray:439.8; stroke-dashoffset:439.8; transition:stroke-dashoffset 1s linear; }
#ring-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
#ring-time { font-size:1.4rem; font-weight:700; color:var(--accent); }
#ring-sub { font-size:0.65rem; color:var(--muted); }
#fast-status { font-size:1.1rem; font-weight:700; margin-bottom:4px; }
#fast-remain { font-size:0.85rem; color:var(--muted); margin-bottom:14px; }
.action-row { display:flex; gap:10px; width:100%; }
.btn-p { flex:1; background:var(--accent); border:none; color:#1a1a2e; font-size:1rem; font-weight:700; padding:14px; border-radius:10px; cursor:pointer; }
.btn-sec { flex:1; background:var(--card); border:none; color:var(--text); font-size:1rem; font-weight:600; padding:14px; border-radius:10px; cursor:pointer; }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:4px; }
.stat-val { font-size:1.1rem; font-weight:700; color:var(--accent); }
.log-item { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:0.85rem; }
.log-item:last-child { border-bottom:none; }
.log-dur { color:var(--accent); font-weight:700; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px 0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Fasting <span>Timer</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Fasting Plan</div>
      <div class="plan-row" id="plan-row">
        <button class="pbtn active" data-h="16">16:8</button>
        <button class="pbtn" data-h="18">18:6</button>
        <button class="pbtn" data-h="20">20:4</button>
        <button class="pbtn" data-h="24">24h</button>
      </div>
    </div>
    <div class="card">
      <div id="timer-area">
        <div id="ring-wrap">
          <svg id="ring-svg" viewBox="0 0 160 160"><circle id="ring-bg" cx="80" cy="80" r="70"/><circle id="ring-fill" cx="80" cy="80" r="70"/></svg>
          <div id="ring-text"><div id="ring-time">0:00:00</div><div id="ring-sub">elapsed</div></div>
        </div>
        <div id="fast-status">Not Fasting</div>
        <div id="fast-remain">Start a fast below</div>
        <div class="action-row">
          <button class="btn-p" id="btn-toggle">Start Fast</button>
          <button class="btn-sec" id="btn-end" style="display:none">End Early</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Stats</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-lbl">Streak</div><div class="stat-val" id="st-streak">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Completed</div><div class="stat-val" id="st-total">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Avg Duration</div><div class="stat-val" id="st-avg">0h</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Past Fasts</div>
      <div id="log-list"><div class="empty">No completed fasts yet.</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var planH=16;
var fasting=JSON.parse(localStorage.getItem('ft_state')||'null');
var logs=JSON.parse(localStorage.getItem('ft_logs')||'[]');
var statsD=JSON.parse(localStorage.getItem('ft_stats')||'{"streak":0,"total":0,"lastDate":""}');
var ticker=null;

document.getElementById('plan-row').querySelectorAll('.pbtn').forEach(function(b){
  b.addEventListener('click',function(){
    if(fasting)return;
    planH=parseInt(b.dataset.h);
    document.querySelectorAll('.pbtn').forEach(function(x){x.classList.toggle('active',x===b);});
  });
});

function fmtHMS(secs){var h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function fmtDate(ts){var d=new Date(ts);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}

function updateRing(elapsed,total){
  var pct=Math.min(elapsed/total,1);
  var circ=439.8;
  document.getElementById('ring-fill').style.strokeDashoffset=circ-(pct*circ);
  document.getElementById('ring-time').textContent=fmtHMS(Math.floor(elapsed));
}

function tick(){
  if(!fasting)return;
  var elapsed=(Date.now()-fasting.start)/1000;
  var total=fasting.planH*3600;
  updateRing(elapsed,total);
  var remain=total-elapsed;
  if(remain>0){
    document.getElementById('fast-remain').textContent='Remaining: '+fmtHMS(Math.floor(remain));
    document.getElementById('fast-status').textContent='Fasting... '+fasting.planH+':'+((24-fasting.planH));
  } else {
    document.getElementById('fast-remain').textContent='Goal reached! Keep going or end.';
    document.getElementById('fast-status').textContent='Goal Complete!';
  }
}

function startFast(){
  fasting={start:Date.now(),planH:planH};
  localStorage.setItem('ft_state',JSON.stringify(fasting));
  document.getElementById('btn-toggle').textContent='Fasting...';
  document.getElementById('btn-toggle').disabled=true;
  document.getElementById('btn-end').style.display='';
  ticker=setInterval(tick,1000);
  tick();
}

function endFast(completed){
  if(!fasting)return;
  clearInterval(ticker);
  var elapsed=Math.floor((Date.now()-fasting.start)/1000);
  var hours=(elapsed/3600).toFixed(1);
  logs.unshift({start:fasting.start,end:Date.now(),elapsed:elapsed,plan:fasting.planH,completed:completed});
  if(logs.length>50)logs=logs.slice(0,50);
  localStorage.setItem('ft_logs',JSON.stringify(logs));
  if(completed){
    statsD.total++;
    var today=new Date().toDateString();
    if(statsD.lastDate===new Date(Date.now()-86400000).toDateString()){statsD.streak++;}
    else if(statsD.lastDate!==today){statsD.streak=1;}
    statsD.lastDate=today;
    localStorage.setItem('ft_stats',JSON.stringify(statsD));
    maybeInterstitial();
  }
  fasting=null;
  localStorage.removeItem('ft_state');
  document.getElementById('btn-toggle').textContent='Start Fast';
  document.getElementById('btn-toggle').disabled=false;
  document.getElementById('btn-end').style.display='none';
  document.getElementById('fast-status').textContent='Not Fasting';
  document.getElementById('fast-remain').textContent='Start a fast below';
  updateRing(0,1);
  renderLog();renderStats();
}

document.getElementById('btn-toggle').addEventListener('click',function(){if(!fasting)startFast();});
document.getElementById('btn-end').addEventListener('click',function(){
  var elapsed=Math.floor((Date.now()-fasting.start)/1000);
  var completed=elapsed>=fasting.planH*3600;
  endFast(completed);
});

function renderLog(){
  var el=document.getElementById('log-list');
  if(!logs.length){el.innerHTML='<div class="empty">No completed fasts yet.</div>';return;}
  el.innerHTML=logs.slice(0,10).map(function(l){
    var h=(l.elapsed/3600).toFixed(1);
    var d=new Date(l.start);
    var lbl=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return '<div class="log-item"><span>'+lbl+' &bull; '+l.plan+'h plan</span><span class="log-dur">'+h+'h '+(l.completed?'&#10003;':'')+'</span></div>';
  }).join('');
}

function renderStats(){
  document.getElementById('st-streak').textContent=statsD.streak;
  document.getElementById('st-total').textContent=statsD.total;
  if(logs.length){
    var avg=logs.reduce(function(s,l){return s+l.elapsed;},0)/logs.length;
    document.getElementById('st-avg').textContent=(avg/3600).toFixed(1)+'h';
  }
}

if(fasting){
  planH=fasting.planH;
  document.querySelectorAll('.pbtn').forEach(function(b){b.classList.toggle('active',parseInt(b.dataset.h)===planH);});
  document.getElementById('btn-toggle').textContent='Fasting...';
  document.getElementById('btn-toggle').disabled=true;
  document.getElementById('btn-end').style.display='';
  ticker=setInterval(tick,1000);tick();
}
renderLog();renderStats();
</script>
</body>
</html>

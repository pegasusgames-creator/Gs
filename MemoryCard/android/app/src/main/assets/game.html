<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memory Cards</title>
<style>
:root {
  --bg: #0d1120;
  --surface: #141a31;
  --accent: #22d3ee;
  --accent2: #132842;
  --text: #e8f1fa;
  --muted: #8892a4;
  --card-back: #1a3050;
  --card-front: #0f1a30;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Poppins', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; letter-spacing: -0.01em; }
body.ss #btn-remove-ads{display:none;}

#header { background: var(--surface); padding: 36px 14px 10px; border-bottom: 1px solid #2a3a5e; }
#header h1 { font-size: 1.2rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; text-align: center; }

#options-bar { display: flex; gap: 10px; padding: 10px 12px; justify-content: center; flex-wrap: wrap; }
.opt-btn { padding: 6px 14px; border-radius: 18px; border: 1.5px solid #2a3a5e; background: transparent; color: var(--muted); font-size: 0.78rem; cursor: pointer; }
.opt-btn.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

#stats-bar { display: flex; justify-content: center; gap: 18px; padding: 8px 12px; font-size: 0.82rem; color: var(--muted); }
.stat { text-align: center; }
.stat-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

#stars { text-align: center; font-size: 1.4rem; min-height: 32px; letter-spacing: 4px; }

#grid { display: grid; gap: 8px; padding: 10px 10px 14px; justify-items: center; }

.card { perspective: 600px; cursor: pointer; }
.card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.45s; transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card.matched .card-inner { transform: rotateY(180deg); }
.card-back, .card-front { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
.card-back { background: var(--card-back); border: 2px solid #2a4a7a; }
.card-back::after { content: '?'; font-size: 1.6rem; color: #5577aa; font-weight: 700; }
.card-front { background: var(--card-front); border: 2px solid var(--accent); transform: rotateY(180deg); }
.card.matched .card-front { border-color: #2ecc71; background: #0a2a1a; }

#msg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 50; }
#msg.show { display: flex; }
#msg-box { background: var(--surface); border-radius: 18px; padding: 28px 24px; text-align: center; max-width: 320px; width: 92%; border: 1px solid #2a3a5e; }
#msg-title { font-size: 1.6rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
#msg-stars { font-size: 2rem; letter-spacing: 4px; margin-bottom: 8px; }
#msg-body { font-size: 0.88rem; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
#msg-btn { padding: 13px 36px; background: var(--accent); border: none; border-radius: 24px; color: #fff; font-size: 0.95rem; font-weight: 700; cursor: pointer; }

#new-game-btn { display: block; margin: 0 auto 10px; padding: 10px 28px; background: var(--accent2); border: 1.5px solid var(--accent); border-radius: 22px; color: #fff; font-size: 0.85rem; cursor: pointer; }
</style>

  <button class="opt-btn" data-theme="emoji">Emoji</button>
  <button class="opt-btn" data-theme="shapes">Shapes</button>
  <button class="opt-btn" data-theme="flags">Flags</button>
</div>

<div id="stats-bar">
  <div class="stat"><div class="stat-val" id="moves-val">0</div><div>Moves</div></div>
  <div class="stat"><div class="stat-val" id="time-val">0:00</div><div>Time</div></div>
  <div class="stat"><div class="stat-val" id="pairs-val">0/0</div><div>Pairs</div></div>
  <div class="stat"><div class="stat-val" id="best-val">—</div><div>Best</div></div>
</div>
<div id="stars"></div>

<button id="new-game-btn">New Game</button>

<div id="grid"></div>

<div id="msg">
  <div id="msg-box">
    <div id="msg-title">You Won! 🎉</div>
    <div id="msg-stars"></div>
    <div id="msg-body"></div>
    <button id="msg-btn">Play Again</button>
  </div>
</div>

<script>
var _adsRemoved = false;
var _interstitialCount = 0;
function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}
window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

var THEMES = {
  animals: ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯'],
  fruits:  ['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝','🍍','🥭'],
  emoji:   ['😀','😍','🤩','😎','🥳','🤔','😴','🤯','🥸','😇'],
  shapes:  ['⭐','❤️','🔷','🔶','⬛','🔴','🟢','🟣','🔺','🟡'],
  flags:   ['🇺🇸','🇬🇧','🇩🇪','🇫🇷','🇯🇵','🇧🇷','🇮🇳','🇨🇦','🇦🇺','🇮🇹'],
};
var DIFFS = {
  easy: {cols:4, rows:3, pairs:6},
  med:  {cols:4, rows:4, pairs:8},
  hard: {cols:5, rows:4, pairs:10},
};
var STAR_THRESHOLDS = {easy:[10,14,20], med:[14,20,28], hard:[18,26,38]};

var diff = 'easy', theme = 'animals';
var cards = [], flipped = [], matched = 0, moves = 0, timerStart = null, timerID = null, gameActive = false;
var bestMoves = {};

document.querySelectorAll('[data-diff]').forEach(function(b) {
  b.onclick = function() {
    document.querySelectorAll('[data-diff]').forEach(function(x){x.classList.remove('sel');});
    this.classList.add('sel'); diff = this.dataset.diff; startGame();
  };
});
document.querySelectorAll('[data-theme]').forEach(function(b) {
  b.onclick = function() {
    document.querySelectorAll('[data-theme]').forEach(function(x){x.classList.remove('sel');});
    this.classList.add('sel'); theme = this.dataset.theme; startGame();
  };
});
document.getElementById('new-game-btn').onclick = startGame;
document.getElementById('msg-btn').onclick = function() { document.getElementById('msg').classList.remove('show'); startGame(); };

function startGame() {
  if (timerID) { clearInterval(timerID); timerID = null; }
  var cfg = DIFFS[diff];
  var pool = THEMES[theme].slice(0, cfg.pairs);
  var deck = pool.concat(pool);
  deck.sort(function() { return Math.random() - 0.5; });

  cards = deck; flipped = []; matched = 0; moves = 0; gameActive = true;
  timerStart = Date.now();
  timerID = setInterval(updateTimer, 500);

  document.getElementById('moves-val').textContent = 0;
  document.getElementById('pairs-val').textContent = '0/' + cfg.pairs;
  document.getElementById('time-val').textContent = '0:00';
  document.getElementById('stars').textContent = '';
  updateBest();

  var grid = document.getElementById('grid');
  var cellW = Math.floor((Math.min(window.innerWidth, 440) - 20 - (cfg.cols-1)*8) / cfg.cols);
  var cellH = Math.round(cellW * 1.1);
  grid.style.gridTemplateColumns = 'repeat(' + cfg.cols + ', ' + cellW + 'px)';
  grid.innerHTML = '';

  deck.forEach(function(sym, i) {
    var card = document.createElement('div');
    card.className = 'card';
    card.style.width = cellW + 'px';
    card.style.height = cellH + 'px';
    card.dataset.i = i;
    card.innerHTML = '<div class="card-inner"><div class="card-back"></div><div class="card-front">'+sym+'</div></div>';
    card.onclick = function() { onCardClick(this); };
    grid.appendChild(card);
  });

  _showInterstitial();
}

function onCardClick(el) {
  if (!gameActive) return;
  var i = parseInt(el.dataset.i);
  if (el.classList.contains('matched')) return;
  if (el.classList.contains('flipped')) return;
  if (flipped.length >= 2) return;

  el.classList.add('flipped');
  flipped.push({el: el, idx: i, sym: cards[i]});

  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves-val').textContent = moves;
    gameActive = false;
    setTimeout(checkMatch, 700);
  }
}

function checkMatch() {
  var a = flipped[0], b = flipped[1];
  var cfg = DIFFS[diff];
  if (a.sym === b.sym) {
    a.el.classList.add('matched');
    b.el.classList.add('matched');
    matched++;
    document.getElementById('pairs-val').textContent = matched + '/' + cfg.pairs;
    updateStars();
    flipped = [];
    gameActive = true;
    if (matched === cfg.pairs) { setTimeout(onWin, 400); return; }
  } else {
    a.el.classList.remove('flipped');
    b.el.classList.remove('flipped');
    flipped = [];
  }
  gameActive = true;
}

function updateTimer() {
  var elapsed = Math.floor((Date.now() - timerStart) / 1000);
  var m = Math.floor(elapsed / 60), s = elapsed % 60;
  document.getElementById('time-val').textContent = m + ':' + (s < 10 ? '0' : '') + s;
}

function updateStars() {
  var th = STAR_THRESHOLDS[diff];
  var stars = moves <= th[0] ? 3 : moves <= th[1] ? 2 : moves <= th[2] ? 1 : 0;
  document.getElementById('stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(Math.max(0, 3-stars));
}

function updateBest() {
  var b = bestMoves[diff];
  document.getElementById('best-val').textContent = b ? b + ' moves' : '—';
}

function onWin() {
  clearInterval(timerID); timerID = null; gameActive = false;
  var elapsed = Math.floor((Date.now() - timerStart) / 1000);
  var m = Math.floor(elapsed/60), s = elapsed%60;
  if (!bestMoves[diff] || moves < bestMoves[diff]) bestMoves[diff] = moves;
  updateBest();
  var th = STAR_THRESHOLDS[diff];
  var stars = moves <= th[0] ? 3 : moves <= th[1] ? 2 : moves <= th[2] ? 1 : 0;
  document.getElementById('msg-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('msg-body').textContent = 'Moves: ' + moves + '   Time: ' + m + ':' + (s<10?'0':'') + s + '\nBest: ' + bestMoves[diff] + ' moves';
  document.getElementById('msg').classList.add('show');
  _showInterstitial();
}

startGame();

if(/screenshot=/.test(location.hash)){
  document.body.classList.add('ss');
  setTimeout(function(){
    // Pre-match some cards and flip others for a compelling screenshot
    var cards=document.querySelectorAll('.card');
    if(cards.length>=8){
      cards[0].classList.add('matched','flipped');
      cards[3].classList.add('matched','flipped');
      cards[5].classList.add('flipped');
      cards[8].classList.add('flipped');
    }
    document.getElementById('moves-val').textContent='9';
    document.getElementById('pairs-val').textContent='3/6';
    document.getElementById('time-val').textContent='0:42';
    document.getElementById('best-val').textContent='14 moves';
    document.getElementById('stars').textContent='⭐⭐⭐';
  },80);
}
</script>
</body>
</html>

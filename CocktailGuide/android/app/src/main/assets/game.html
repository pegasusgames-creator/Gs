<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cocktail Guide</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #1a1a1a; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  :root { --accent: #F06292; }
  header { background: #222; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); flex-shrink:0; }
  header h1 { font-size: 1.3rem; color: var(--accent); }
  .btn-remove-ads { background: var(--accent); color: #fff; border: none; border-radius: 20px; padding: 8px 16px; font-size: 0.8rem; font-weight: bold; min-height: 44px; cursor: pointer; }
  .btn-pressed { opacity: 0.7; transform: scale(0.96); }
  .top-bar { padding: 12px 16px; background: #222; flex-shrink:0; }
  .search-input { width: 100%; background: #333; border: 1px solid #555; color: #fff; border-radius: 24px; padding: 12px 18px; font-size: 1rem; outline: none; }
  .search-input::placeholder { color: #777; }
  .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; scrollbar-width:none; flex-shrink:0; background:#1e1e1e; }
  .cat-tabs::-webkit-scrollbar { display:none; }
  .cat-tab { background: #2a2a2a; border: 1px solid #444; color: #ccc; border-radius: 20px; padding: 8px 16px; white-space: nowrap; cursor: pointer; font-size: 0.9rem; min-height: 44px; flex-shrink:0; }
  .cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .recipes-list { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .recipe-card { background: #2a2a2a; border-radius: 14px; margin-bottom: 12px; overflow: hidden; cursor: pointer; border: 1px solid #333; }
  .recipe-card-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  .recipe-name { font-size: 1.1rem; font-weight: bold; }
  .recipe-glass { font-size: 0.8rem; color: #aaa; margin-top: 3px; }
  .recipe-cat-badge { background: var(--accent); color: #fff; border-radius: 12px; padding: 4px 10px; font-size: 0.75rem; flex-shrink:0; }
  .recipe-details { padding: 0 16px 16px; display: none; }
  .recipe-details.open { display: block; }
  .recipe-details h4 { color: var(--accent); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; }
  .ingredient { padding: 4px 0; border-bottom: 1px solid #333; font-size: 0.9rem; display: flex; justify-content: space-between; }
  .ingredient .measure { color: var(--accent); font-weight: bold; }
  .instructions-text { font-size: 0.9rem; line-height: 1.6; color: #ccc; }
  .garnish-text { font-size: 0.9rem; color: #aaa; font-style: italic; }
  #banner-ad { background: #222; text-align: center; padding: 8px; color: #666; font-size: 0.75rem; border-top: 1px solid #333; flex-shrink:0; }
  .no-results { text-align: center; color: #666; padding: 40px 20px; font-size: 1rem; }
</style>
</head>
<body>
<header>
  <h1>🍹 Cocktail Guide</h1>
  <button class="btn-remove-ads" id="removeAdsBtn">Remove Ads</button>
</header>
<div class="top-bar">
  <input type="text" class="search-input" id="searchInput" placeholder="Search cocktails...">
</div>
<div class="cat-tabs" id="catTabs">
  <button class="cat-tab active" data-cat="All">All</button>
  <button class="cat-tab" data-cat="Classic">Classic</button>
  <button class="cat-tab" data-cat="Tropical">Tropical</button>
  <button class="cat-tab" data-cat="Whiskey">Whiskey</button>
  <button class="cat-tab" data-cat="Vodka">Vodka</button>
  <button class="cat-tab" data-cat="Non-Alcoholic">Non-Alcoholic</button>
</div>
<div class="recipes-list" id="recipesList"></div>
<div id="banner-ad">Advertisement</div>

<script>
const COCKTAILS = [
  { name: "Old Fashioned", cat: "Whiskey", glass: "Rocks glass", ingredients: [{m:"2 oz",i:"Bourbon or Rye Whiskey"},{m:"1 tsp",i:"Sugar (or sugar cube)"},{m:"2-3 dashes",i:"Angostura bitters"},{m:"Splash",i:"Water"}], instructions: "Muddle sugar with bitters and water. Add ice and whiskey. Stir gently. Express orange peel over glass.", garnish: "Orange peel, Maraschino cherry" },
  { name: "Manhattan", cat: "Whiskey", glass: "Coupe or martini", ingredients: [{m:"2 oz",i:"Rye or Bourbon"},{m:"1 oz",i:"Sweet vermouth"},{m:"2 dashes",i:"Angostura bitters"}], instructions: "Combine ingredients with ice. Stir for 30 seconds. Strain into chilled glass.", garnish: "Maraschino cherry" },
  { name: "Whiskey Sour", cat: "Whiskey", glass: "Rocks or sour glass", ingredients: [{m:"2 oz",i:"Bourbon"},{m:"3/4 oz",i:"Fresh lemon juice"},{m:"3/4 oz",i:"Simple syrup"},{m:"1",i:"Egg white (optional)"}], instructions: "Dry shake all ingredients without ice. Add ice and shake again. Strain into glass.", garnish: "Lemon wheel, Cherry" },
  { name: "Boulevardier", cat: "Whiskey", glass: "Coupe", ingredients: [{m:"1.5 oz",i:"Bourbon"},{m:"1 oz",i:"Sweet vermouth"},{m:"1 oz",i:"Campari"}], instructions: "Stir all ingredients with ice. Strain into chilled coupe.", garnish: "Orange twist" },
  { name: "Martini", cat: "Classic", glass: "Martini glass", ingredients: [{m:"2.5 oz",i:"Gin"},{m:"0.5 oz",i:"Dry vermouth"}], instructions: "Stir gin and vermouth with ice until very cold. Strain into chilled glass. Can also be made with vodka.", garnish: "Lemon twist or olive" },
  { name: "Negroni", cat: "Classic", glass: "Rocks glass", ingredients: [{m:"1 oz",i:"Gin"},{m:"1 oz",i:"Sweet vermouth"},{m:"1 oz",i:"Campari"}], instructions: "Combine all ingredients over large ice cube. Stir gently. No shaking needed.", garnish: "Orange slice or peel" },
  { name: "Daiquiri", cat: "Classic", glass: "Coupe", ingredients: [{m:"2 oz",i:"White rum"},{m:"3/4 oz",i:"Fresh lime juice"},{m:"3/4 oz",i:"Simple syrup"}], instructions: "Shake all ingredients with ice vigorously. Double strain into chilled coupe.", garnish: "Lime wheel" },
  { name: "Margarita", cat: "Classic", glass: "Margarita or rocks", ingredients: [{m:"2 oz",i:"Tequila (blanco)"},{m:"1 oz",i:"Fresh lime juice"},{m:"3/4 oz",i:"Triple Sec or Cointreau"},{m:"1/2 oz",i:"Simple syrup"}], instructions: "Shake all ingredients with ice. Strain over fresh ice. Salt rim optional.", garnish: "Lime wheel, salt rim" },
  { name: "Cosmopolitan", cat: "Classic", glass: "Martini glass", ingredients: [{m:"1.5 oz",i:"Citrus vodka"},{m:"1 oz",i:"Triple Sec"},{m:"1/2 oz",i:"Fresh lime juice"},{m:"1/4 oz",i:"Cranberry juice"}], instructions: "Shake all ingredients with ice. Strain into chilled martini glass.", garnish: "Lime wheel, flamed orange peel" },
  { name: "Aperol Spritz", cat: "Classic", glass: "Wine glass", ingredients: [{m:"3 oz",i:"Prosecco"},{m:"2 oz",i:"Aperol"},{m:"Splash",i:"Club soda"}], instructions: "Fill wine glass with ice. Pour Aperol, then Prosecco, then a splash of soda. Stir briefly.", garnish: "Orange slice" },
  { name: "Mojito", cat: "Tropical", glass: "Highball", ingredients: [{m:"2 oz",i:"White rum"},{m:"1 oz",i:"Fresh lime juice"},{m:"3/4 oz",i:"Simple syrup"},{m:"8-10",i:"Fresh mint leaves"},{m:"Top with",i:"Club soda"}], instructions: "Gently muddle mint with lime juice and syrup. Add rum and ice. Top with club soda. Stir lightly.", garnish: "Mint sprig, lime wheel" },
  { name: "Piña Colada", cat: "Tropical", glass: "Hurricane or highball", ingredients: [{m:"2 oz",i:"White rum"},{m:"2 oz",i:"Coconut cream"},{m:"4 oz",i:"Pineapple juice"}], instructions: "Blend all ingredients with crushed ice until smooth. Pour into chilled glass.", garnish: "Pineapple slice, cherry, umbrella" },
  { name: "Mai Tai", cat: "Tropical", glass: "Double rocks", ingredients: [{m:"2 oz",i:"Aged rum"},{m:"3/4 oz",i:"Fresh lime juice"},{m:"1/2 oz",i:"Orgeat syrup"},{m:"1/4 oz",i:"Triple Sec"}], instructions: "Shake all ingredients with ice. Strain over fresh crushed ice.", garnish: "Mint bouquet, lime wheel" },
  { name: "Blue Lagoon", cat: "Tropical", glass: "Highball", ingredients: [{m:"1.5 oz",i:"Vodka"},{m:"1 oz",i:"Blue Curaçao"},{m:"Top with",i:"Lemonade"}], instructions: "Build in glass over ice. Add vodka, blue curaçao, then top with lemonade.", garnish: "Lemon slice, cherry" },
  { name: "Tequila Sunrise", cat: "Tropical", glass: "Highball", ingredients: [{m:"2 oz",i:"Tequila"},{m:"4 oz",i:"Orange juice"},{m:"1/2 oz",i:"Grenadine"}], instructions: "Pour tequila and OJ over ice. Slowly pour grenadine down the side to create sunrise effect.", garnish: "Orange slice, cherry" },
  { name: "Sex on the Beach", cat: "Tropical", glass: "Highball", ingredients: [{m:"1.5 oz",i:"Vodka"},{m:"1 oz",i:"Peach schnapps"},{m:"2 oz",i:"Orange juice"},{m:"2 oz",i:"Cranberry juice"}], instructions: "Shake vodka, peach schnapps, OJ with ice. Strain into ice-filled glass. Top with cranberry.", garnish: "Orange slice, cherry" },
  { name: "Moscow Mule", cat: "Vodka", glass: "Copper mug", ingredients: [{m:"2 oz",i:"Vodka"},{m:"1/2 oz",i:"Fresh lime juice"},{m:"Top with",i:"Ginger beer"}], instructions: "Fill copper mug with ice. Add vodka and lime juice. Top with ginger beer and stir.", garnish: "Lime wedge, mint" },
  { name: "Vodka Collins", cat: "Vodka", glass: "Collins glass", ingredients: [{m:"2 oz",i:"Vodka"},{m:"1 oz",i:"Fresh lemon juice"},{m:"3/4 oz",i:"Simple syrup"},{m:"Top with",i:"Club soda"}], instructions: "Shake vodka, lemon, syrup with ice. Strain into ice-filled glass. Top with soda.", garnish: "Lemon wheel, cherry" },
  { name: "Lemon Drop Martini", cat: "Vodka", glass: "Martini glass", ingredients: [{m:"2 oz",i:"Citrus vodka"},{m:"1 oz",i:"Triple Sec"},{m:"3/4 oz",i:"Fresh lemon juice"},{m:"1/2 oz",i:"Simple syrup"}], instructions: "Shake all with ice vigorously. Strain into sugar-rimmed martini glass.", garnish: "Lemon twist, sugar rim" },
  { name: "Espresso Martini", cat: "Vodka", glass: "Martini glass", ingredients: [{m:"1.5 oz",i:"Vodka"},{m:"1 oz",i:"Coffee liqueur"},{m:"1 oz",i:"Fresh espresso"},{m:"1/4 oz",i:"Simple syrup"}], instructions: "Shake all ingredients very hard with ice. Strain into chilled glass — aim for frothy top.", garnish: "3 coffee beans" },
  { name: "Bloody Mary", cat: "Vodka", glass: "Highball", ingredients: [{m:"2 oz",i:"Vodka"},{m:"4 oz",i:"Tomato juice"},{m:"1/2 oz",i:"Lemon juice"},{m:"2 dashes",i:"Worcestershire sauce"},{m:"2 dashes",i:"Hot sauce"},{m:"Pinch",i:"Salt & pepper"}], instructions: "Build in glass over ice. Add all ingredients and stir well.", garnish: "Celery stalk, lemon wedge, olives" },
  { name: "Arnold Palmer Mocktail", cat: "Non-Alcoholic", glass: "Highball", ingredients: [{m:"4 oz",i:"Iced tea (unsweetened)"},{m:"4 oz",i:"Lemonade"}], instructions: "Fill glass with ice. Pour equal parts iced tea and lemonade. Stir gently.", garnish: "Lemon slice, mint" },
  { name: "Virgin Mojito", cat: "Non-Alcoholic", glass: "Highball", ingredients: [{m:"1 oz",i:"Fresh lime juice"},{m:"3/4 oz",i:"Simple syrup"},{m:"8-10",i:"Fresh mint leaves"},{m:"Top with",i:"Club soda"}], instructions: "Muddle mint with lime and syrup. Fill glass with ice. Top with club soda.", garnish: "Mint sprig, lime wheel" },
  { name: "Shirley Temple", cat: "Non-Alcoholic", glass: "Highball", ingredients: [{m:"4 oz",i:"Ginger ale or lemon-lime soda"},{m:"1 oz",i:"Grenadine"},{m:"2 oz",i:"Orange juice (optional)"}], instructions: "Fill glass with ice. Pour soda, then grenadine. Add OJ if desired.", garnish: "Maraschino cherry, orange slice" },
  { name: "Watermelon Cooler", cat: "Non-Alcoholic", glass: "Highball", ingredients: [{m:"4 oz",i:"Fresh watermelon juice"},{m:"1 oz",i:"Fresh lime juice"},{m:"1/2 oz",i:"Simple syrup"},{m:"Top with",i:"Sparkling water"}], instructions: "Blend watermelon and strain. Mix with lime and syrup. Pour over ice, top with sparkling water.", garnish: "Watermelon wedge, mint" },
  { name: "Amaretto Sour", cat: "Classic", glass: "Rocks glass", ingredients: [{m:"1.5 oz",i:"Amaretto"},{m:"3/4 oz",i:"Bourbon"},{m:"1 oz",i:"Fresh lemon juice"},{m:"1/2 oz",i:"Simple syrup"},{m:"1",i:"Egg white"}], instructions: "Dry shake without ice. Add ice and shake again vigorously. Strain over fresh ice.", garnish: "Brandied cherry, lemon peel" },
  { name: "Dark 'n' Stormy", cat: "Tropical", glass: "Highball", ingredients: [{m:"2 oz",i:"Dark rum"},{m:"Top with",i:"Ginger beer"},{m:"1/2 oz",i:"Fresh lime juice"}], instructions: "Fill glass with ice. Pour ginger beer. Float dark rum on top. Add lime juice.", garnish: "Lime wedge" },
  { name: "French 75", cat: "Classic", glass: "Champagne flute", ingredients: [{m:"1.5 oz",i:"Gin"},{m:"3/4 oz",i:"Fresh lemon juice"},{m:"1/2 oz",i:"Simple syrup"},{m:"Top with",i:"Champagne"}], instructions: "Shake gin, lemon, syrup with ice. Strain into flute. Top with Champagne.", garnish: "Lemon twist" },
  { name: "Clover Club", cat: "Classic", glass: "Coupe", ingredients: [{m:"2 oz",i:"Gin"},{m:"3/4 oz",i:"Fresh lemon juice"},{m:"1/2 oz",i:"Raspberry syrup"},{m:"1",i:"Egg white"}], instructions: "Dry shake, then shake with ice. Double strain into coupe.", garnish: "Fresh raspberries" },
  { name: "Hugo Spritz", cat: "Classic", glass: "Wine glass", ingredients: [{m:"3 oz",i:"Prosecco"},{m:"1 oz",i:"Elderflower liqueur (St-Germain)"},{m:"Splash",i:"Club soda"},{m:"Handful",i:"Fresh mint"}], instructions: "Fill glass with ice. Add elderflower and mint. Pour Prosecco. Top with soda.", garnish: "Mint sprig, lime slice" }
];

let activeCat = 'All';
let searchQuery = '';

function addTouchFeedback(btn) {
  btn.addEventListener('touchstart', () => btn.classList.add('btn-pressed'), {passive:true});
  btn.addEventListener('touchend', () => btn.classList.remove('btn-pressed'), {passive:true});
  btn.addEventListener('touchcancel', () => btn.classList.remove('btn-pressed'), {passive:true});
}

document.querySelectorAll('button').forEach(addTouchFeedback);

document.getElementById('removeAdsBtn').addEventListener('click', () => {
  if (window.Android) Android.purchaseNoAds();
});

document.querySelectorAll('.cat-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCat = tab.dataset.cat;
    renderRecipes();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase();
  renderRecipes();
});

function renderRecipes() {
  const list = document.getElementById('recipesList');
  let filtered = COCKTAILS.filter(c => {
    const catMatch = activeCat === 'All' || c.cat === activeCat;
    const searchMatch = !searchQuery || c.name.toLowerCase().includes(searchQuery) || c.cat.toLowerCase().includes(searchQuery);
    return catMatch && searchMatch;
  });
  if (!filtered.length) {
    list.innerHTML = '<div class="no-results">No cocktails found</div>';
    return;
  }
  list.innerHTML = filtered.map((c, idx) => `
    <div class="recipe-card" id="card-${idx}" onclick="toggleCard(${idx})">
      <div class="recipe-card-header">
        <div>
          <div class="recipe-name">${c.name}</div>
          <div class="recipe-glass">${c.glass}</div>
        </div>
        <span class="recipe-cat-badge">${c.cat}</span>
      </div>
      <div class="recipe-details" id="details-${idx}">
        <h4>Ingredients</h4>
        ${c.ingredients.map(ing => `<div class="ingredient"><span>${ing.i}</span><span class="measure">${ing.m}</span></div>`).join('')}
        <h4>Instructions</h4>
        <p class="instructions-text">${c.instructions}</p>
        <h4>Garnish</h4>
        <p class="garnish-text">${c.garnish}</p>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('button').forEach(addTouchFeedback);
}

function toggleCard(idx) {
  const details = document.getElementById('details-' + idx);
  details.classList.toggle('open');
}

renderRecipes();

window.onPurchaseComplete = function(sku) {
  if (sku && sku.includes('no_ads')) {
    document.getElementById('banner-ad').style.display = 'none';
    document.getElementById('removeAdsBtn').style.display = 'none';
  }
};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
if (window.Android) document.getElementById('banner-ad').style.display = 'none';

// Interstitial ad helper
var _interstitialCount = 0;
var _adsRemoved = false;
function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

// Show interstitial every 5 taps
var _tapCount = 0;
document.addEventListener('click', function() {
  _tapCount++;
  if (_tapCount % 5 === 0) _showInterstitial();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>General Knowledge Quiz</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#7E57C2; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; }
.screen { display:none; flex-direction:column; height:100%; }
.screen.active { display:flex; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
button { cursor:pointer; border:none; border-radius:var(--radius); font-family:inherit; font-weight:600; transition:transform 0.1s,opacity 0.1s; }
button:active, button.btn-pressed { transform:scale(0.96); opacity:0.85; }
.btn-primary { background:var(--accent); color:#fff; padding:14px 28px; font-size:1.1rem; width:100%; }
.btn-secondary { background:var(--card); color:var(--text); padding:12px 20px; font-size:0.95rem; width:100%; }
#menuScreen { align-items:center; justify-content:center; gap:20px; padding:30px; }
.menu-emoji { font-size:5rem; }
.menu-title { font-size:2rem; font-weight:800; color:var(--accent); }
.menu-sub { color:var(--muted); font-size:0.95rem; text-align:center; }
.menu-buttons { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
#gameScreen { padding:0; }
.game-header { background:var(--surface); padding:12px 16px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.game-top { display:flex; justify-content:space-between; align-items:center; }
.progress-text { font-size:0.85rem; color:var(--muted); }
.score-text { font-size:0.95rem; font-weight:700; color:var(--accent); }
.timer-bar-wrap { height:6px; background:var(--card); border-radius:3px; overflow:hidden; }
.timer-bar { height:100%; background:var(--accent); border-radius:3px; transition:width 0.1s linear; }
.question-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:12px; overflow:hidden; }
.category-badge { background:var(--card); color:var(--accent); padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
.question-emoji { font-size:3rem; line-height:1; }
.question-text { font-size:1.05rem; font-weight:600; text-align:center; line-height:1.4; }
.answers { width:100%; max-width:480px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ans-btn { background:var(--card); color:var(--text); padding:14px 8px; font-size:0.9rem; border-radius:var(--radius); border:2px solid transparent; min-height:58px; line-height:1.3; }
.ans-btn.correct { background:#1b5e20; border-color:#66BB6A; color:#fff; }
.ans-btn.wrong { background:#b71c1c; border-color:#EF5350; color:#fff; }
.ans-btn:disabled { cursor:default; }
.feedback-bar { height:38px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; flex-shrink:0; background:var(--surface); padding:0 12px; text-align:center; }
.feedback-bar.correct { color:#66BB6A; }
.feedback-bar.wrong { color:#EF5350; }
#resultScreen { align-items:center; justify-content:center; gap:18px; padding:30px; }
.result-emoji { font-size:4rem; }
.result-title { font-size:1.8rem; font-weight:800; }
.result-score { font-size:3.5rem; font-weight:900; color:var(--accent); }
.result-sub { color:var(--muted); font-size:1rem; }
.result-buttons { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div id="app">
  <div class="screen active" id="menuScreen">
    <div class="menu-emoji">🧠</div>
    <div class="menu-title">General Knowledge</div>
    <div class="menu-sub">60 questions across science, history, pop culture & more</div>
    <div class="menu-buttons">
      <button class="btn-primary" onclick="startGame()">Play Now</button>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="game-header">
      <div class="game-top">
        <span class="progress-text" id="progressText">1 / 60</span>
        <span class="score-text" id="scoreText">Score: 0</span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    </div>
    <div class="question-area">
      <div class="category-badge" id="categoryBadge">General</div>
      <div class="question-emoji" id="qEmoji"></div>
      <div class="question-text" id="qText"></div>
      <div class="answers" id="answersDiv"></div>
    </div>
    <div class="feedback-bar" id="feedbackBar"></div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title">Quiz Complete!</div>
    <div class="result-score" id="resultScore">0%</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-buttons">
      <button class="btn-primary" onclick="startGame()">Play Again</button>
      <button class="btn-secondary" onclick="showScreen('menuScreen')">Menu</button>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
var state={useCount:0,removeAds:false,score:0,qi:0,questions:[],timer:null,timeLeft:0,answered:false};
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%5===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var ALL_QUESTIONS=[
  // Science

  {e:'🌊',cat:'Science',q:"What is the speed of light (approximately)?",a:["300,000 km/s","150,000 km/s","30,000 km/s","3,000,000 km/s"],c:0},

  {e:'🗽',cat:'History',q:"The Statue of Liberty was a gift from which country?",a:["France","UK","Spain","Italy"],c:0},
  {e:'📜',cat:'History',q:"Who wrote the Declaration of Independence?",a:["Thomas Jefferson","George Washington","Benjamin Franklin","John Adams"],c:0},
  {e:'🧱',cat:'History',q:"The Great Wall of China was primarily built to protect against whom?",a:["Northern nomadic tribes","Mongols specifically","Japanese pirates","Persian invaders"],c:0},
  {e:'⚔️',cat:'History',q:"The Battle of Waterloo was fought in which year?",a:["1815","1805","1820","1800"],c:0},
  {e:'🏛️',cat:'History',q:"Who was the first Roman Emperor?",a:["Augustus","Julius Caesar","Nero","Caligula"],c:0},
  {e:'✈️',cat:'History',q:"The Wright Brothers made the first successful powered flight in what year?",a:["1903","1901","1910","1896"],c:0},
  // Geography
  {e:'🌍',cat:'Geography',q:"What is the longest river in the world?",a:["Nile","Amazon","Mississippi","Yangtze"],c:0},
  {e:'🏔️',cat:'Geography',q:"What is the tallest mountain in the world?",a:["Mount Everest","K2","Kangchenjunga","Lhotse"],c:0},
  {e:'🌊',cat:'Geography',q:"What is the largest ocean?",a:["Pacific","Atlantic","Indian","Arctic"],c:0},
  {e:'🏜️',cat:'Geography',q:"What is the largest desert in the world?",a:["Antarctica","Sahara","Arabian","Gobi"],c:0},
  {e:'🌍',cat:'Geography',q:"Which country has the most natural lakes?",a:["Canada","Russia","USA","Finland"],c:0},
  // Arts & Literature
  {e:'🎨',cat:'Arts',q:"Who painted the Mona Lisa?",a:["Leonardo da Vinci","Michelangelo","Raphael","Botticelli"],c:0},
  {e:'📚',cat:'Arts',q:"Who wrote 'Romeo and Juliet'?",a:["William Shakespeare","Charles Dickens","Jane Austen","Mark Twain"],c:0},
  {e:'🎭',cat:'Arts',q:"Who wrote '1984'?",a:["George Orwell","Aldous Huxley","Ray Bradbury","H.G. Wells"],c:0},
  {e:'🎨',cat:'Arts',q:"The Sistine Chapel ceiling was painted by?",a:["Michelangelo","da Vinci","Raphael","Titian"],c:0},
  {e:'📚',cat:'Arts',q:"'To Kill a Mockingbird' was written by?",a:["Harper Lee","Truman Capote","F. Scott Fitzgerald","Steinbeck"],c:0},
  // Pop Culture
  {e:'🎬',cat:'Pop Culture',q:"Which film has the highest box office gross of all time?",a:["Avatar (2009)","Avengers: Endgame","Titanic","Star Wars: The Force Awakens"],c:0},
  {e:'🎵',cat:'Pop Culture',q:"Which artist has won the most Grammy Awards?",a:["Beyoncé","Taylor Swift","Jay-Z","Georg Solti"],c:0},
  {e:'📱',cat:'Pop Culture',q:"When was the first iPhone released?",a:["2007","2005","2010","2008"],c:0},
  {e:'🎮',cat:'Pop Culture',q:"What is the best-selling video game of all time?",a:["Minecraft","Tetris","GTA V","Wii Sports"],c:0},
  {e:'🎬',cat:'Pop Culture',q:"Who directed the original Star Wars (1977)?",a:["George Lucas","Steven Spielberg","James Cameron","Francis Ford Coppola"],c:0},
  // Sports
  {e:'🏅',cat:'Sports',q:"How many rings are on the Olympic flag?",a:["5","4","6","7"],c:0},
  {e:'🎾',cat:'Sports',q:"How many Grand Slam tournaments are in tennis?",a:["4","3","5","6"],c:0},
  {e:'🏀',cat:'Sports',q:"How tall is a regulation NBA basketball hoop?",a:["10 feet (3.05m)","9 feet","11 feet","8 feet"],c:0},
  {e:'🏊',cat:'Sports',q:"Michael Phelps won how many Olympic gold medals in total?",a:["23","18","20","15"],c:0},
  {e:'🥊',cat:'Sports',q:"Muhammad Ali's birth name was?",a:["Cassius Clay","Cassius Ali","Muhammad Clay","Ali Jones"],c:0},
  // Technology
  {e:'💻',cat:'Technology',q:"What does 'www' stand for in a website URL?",a:["World Wide Web","World Wide Wire","Wide Web World","Wireless Web World"],c:0},
  {e:'🖥️',cat:'Technology',q:"Who co-founded Apple Inc.?",a:["Steve Jobs & Steve Wozniak","Bill Gates & Paul Allen","Mark Zuckerberg & Eduardo Saverin","Larry Page & Sergey Brin"],c:0},
  {e:'🤖',cat:'Technology',q:"What does 'AI' stand for?",a:["Artificial Intelligence","Automated Intelligence","Algorithmic Intelligence","Advanced Interface"],c:0},
  {e:'📱',cat:'Technology',q:"Android is owned by which company?",a:["Google","Apple","Samsung","Microsoft"],c:0},
  // Nature
  {e:'🌱',cat:'Nature',q:"What process do plants use to make food from sunlight?",a:["Photosynthesis","Respiration","Transpiration","Osmosis"],c:0},
  {e:'🌋',cat:'Nature',q:"What causes earthquakes?",a:["Movement of tectonic plates","Volcanic activity","Underground explosions","Gravitational pull"],c:0},
  {e:'🌈',cat:'Nature',q:"How many colours are in a rainbow?",a:["7","6","8","5"],c:0},
  // Math & Numbers
  {e:'🔢',cat:'Math',q:"What is the value of Pi (first 4 digits)?",a:["3.141","3.142","3.14159","2.718"],c:0},
  {e:'♾️',cat:'Math',q:"What is the square root of 144?",a:["12","14","11","13"],c:0},
  {e:'🔢',cat:'Math',q:"How many sides does a hexagon have?",a:["6","5","7","8"],c:0},
  // Misc
  {e:'🌙',cat:'Space',q:"How many moons does Mars have?",a:["2","1","3","0"],c:0},
  {e:'🚀',cat:'Space',q:"Who was the first human to walk on the moon?",a:["Neil Armstrong","Buzz Aldrin","Yuri Gagarin","Michael Collins"],c:0},
  {e:'🌍',cat:'Geography',q:"How many continents are there on Earth?",a:["7","6","8","5"],c:0},
  {e:'🇺🇳',cat:'History',q:"In what year was the United Nations founded?",a:["1945","1939","1950","1944"],c:0},
  {e:'🏥',cat:'Science',q:"What is the most common blood type?",a:["O+","A+","B+","AB+"],c:0},
  {e:'💰',cat:'General',q:"Which currency is used in Japan?",a:["Yen","Won","Yuan","Rupee"],c:0},
  {e:'🎵',cat:'Arts',q:"How many strings does a standard guitar have?",a:["6","4","8","12"],c:0},
  {e:'🕰️',cat:'General',q:"How many hours are in a week?",a:["168","156","180","144"],c:0},
  {e:'🌍',cat:'Geography',q:"Which country has the world's largest population?",a:["India","China","USA","Indonesia"],c:0},
  {e:'🔭',cat:'Space',q:"What is the name of our galaxy?",a:["Milky Way","Andromeda","Triangulum","Sombrero"],c:0},
  {e:'🧪',cat:'Science',q:"What is the hardest natural substance on Earth?",a:["Diamond","Corundum","Silicon","Graphene"],c:0},
  {e:'📜',cat:'History',q:"The Eiffel Tower was completed in what year?",a:["1889","1900","1876","1895"],c:0},
  {e:'🎭',cat:'Arts',q:"Which Shakespeare play features the characters Hamlet, Ophelia, and Polonius?",a:["Hamlet","Macbeth","Othello","King Lear"],c:0},
  {e:'🏆',cat:'Sports',q:"In which sport would you perform a 'slam dunk'?",a:["Basketball","Volleyball","Tennis","Handball"],c:0},
];

function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function startGame(){state.score=0;state.qi=0;state.useCount=0;state.questions=shuffle(ALL_QUESTIONS.slice()).slice(0,60);showScreen('gameScreen');loadQuestion();}
function loadQuestion(){
  if(state.qi>=state.questions.length){endGame();return;}
  var q=state.questions[state.qi];
  document.getElementById('progressText').textContent=(state.qi+1)+' / '+state.questions.length;
  document.getElementById('scoreText').textContent='Score: '+state.score;
  document.getElementById('qEmoji').textContent=q.e;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('categoryBadge').textContent=q.cat;
  document.getElementById('feedbackBar').textContent='';
  document.getElementById('feedbackBar').className='feedback-bar';
  state.answered=false;
  var correctLabel=q.a[q.c];
  var indices=[0,1,2,3];shuffle(indices);
  var div=document.getElementById('answersDiv');div.innerHTML='';
  indices.forEach(function(idx){var btn=document.createElement('button');btn.className='ans-btn';btn.textContent=q.a[idx];btn.onclick=function(){answer(btn,q.a[idx]===correctLabel,correctLabel);};div.appendChild(btn);});
  startTimer();
}
var TIMER_DURATION=15;
function startTimer(){clearInterval(state.timer);state.timeLeft=TIMER_DURATION;updateTimerBar();state.timer=setInterval(function(){state.timeLeft-=0.1;updateTimerBar();if(state.timeLeft<=0){clearInterval(state.timer);timeUp();}},100);}
function updateTimerBar(){document.getElementById('timerBar').style.width=Math.max(0,state.timeLeft/TIMER_DURATION*100)+'%';}
function timeUp(){if(state.answered)return;state.answered=true;var q=state.questions[state.qi];var correctLabel=q.a[q.c];document.querySelectorAll('.ans-btn').forEach(function(b){b.disabled=true;if(b.textContent===correctLabel)b.classList.add('correct');});showFeedback(false,"Time up! Correct: "+correctLabel);setTimeout(nextQ,1600);}
function answer(btn,isCorrect,correctLabel){if(state.answered)return;state.answered=true;clearInterval(state.timer);document.querySelectorAll('.ans-btn').forEach(function(b){b.disabled=true;if(b.textContent===correctLabel)b.classList.add('correct');});if(isCorrect){state.score++;btn.classList.add('correct');showFeedback(true,'Correct! 🎉');}else{btn.classList.add('wrong');showFeedback(false,'Wrong! Correct: '+correctLabel);}setTimeout(nextQ,1600);}
function showFeedback(ok,msg){var bar=document.getElementById('feedbackBar');bar.textContent=msg;bar.className='feedback-bar '+(ok?'correct':'wrong');}
function nextQ(){state.qi++;if(state.qi%5===0)maybeInterstitial();loadQuestion();}
function endGame(){clearInterval(state.timer);var pct=Math.round(state.score/state.questions.length*100);document.getElementById('resultScore').textContent=pct+'%';document.getElementById('resultSub').textContent=state.score+' out of '+state.questions.length+' correct';var emojis=['😢','😕','🙂','😊','🏆'];document.getElementById('resultEmoji').textContent=emojis[Math.min(4,Math.floor(pct/20))];showScreen('resultScreen');}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Emoji Sort</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0f0a1a; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#app { display:flex; flex-direction:column; height:100%; }
#hud { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:#080614; flex-shrink:0; }
.hv { font-size:1.3rem; font-weight:900; color:#FF9800; }
.hl { font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; color:#554; }
#game-area { flex:1; display:flex; align-items:center; justify-content:center; padding:10px; overflow:hidden; }
#tubes-container { display:flex; gap:10px; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
.tube-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.tube {
  width:52px; min-height:200px;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.2);
  border-top:none;
  border-radius:0 0 26px 26px;
  display:flex; flex-direction:column-reverse;
  align-items:center; padding:4px 2px;
  gap:2px; position:relative;
  transition:border-color 0.15s;
}
.tube.selected { border-color:#FF9800; box-shadow:0 0 12px rgba(255,152,0,0.4); }
.tube.complete { border-color:#4CAF50; box-shadow:0 0 12px rgba(76,175,80,0.4); }
.emoji-cell { width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:1.7rem; border-radius:10px; background:rgba(255,255,255,0.07); }
.tube-label { font-size:0.65rem; color:#666; }
#btn-row { display:flex; gap:10px; justify-content:center; padding:8px; flex-shrink:0; }
.action-btn { background:#1a1030; border:2px solid #FF9800; border-radius:20px; color:#FF9800; font-size:0.9rem; font-weight:700; padding:8px 18px; cursor:pointer; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:14px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#FF9800; }
#overlay .sub { color:#aaa; font-size:0.9rem; text-align:center; max-width:280px; }
#overlay .big { font-size:1.2rem; font-weight:800; text-align:center; }
#btn-play { background:#FF9800; border:none; border-radius:30px; color:#fff; font-size:1.2rem; font-weight:800; padding:14px 48px; cursor:pointer; }
#admob-banner { height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><div class="hl">Level</div><div class="hv" id="level-disp">1</div></div>
    <div><div class="hl">Moves</div><div class="hv" id="moves-disp">0</div></div>
    <div style="text-align:right"><div class="hl">Best</div><div class="hv" id="best-disp">—</div></div>
  </div>
  <div id="game-area">
    <div id="tubes-container"></div>
  </div>
  <div id="btn-row">
    <button class="action-btn" id="btn-undo">↩ Undo</button>
    <button class="action-btn" id="btn-reset">↺ Reset</button>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<div id="overlay">
  <h2>Emoji Sort</h2>
  <div class="sub">Tap a tube to pick the top emoji.<br>Tap another tube to place it.<br>Sort matching emoji into the same tubes!</div>
  <div class="big" id="final-msg"></div>
  <button id="btn-play">Play!</button>
</div>
<script>
'use strict';
var EMOJI_SETS=[
  ['😀','😎','🥳','😍'],
  ['🐶','🐱','🐸','🐼'],
  ['🍕','🍔','🌮','🍣'],
  ['⚽','🏀','🎾','🏈'],
  ['🌹','🌻','🌺','🌼'],
  ['🦁','🐯','🦊','🐻'],
  ['🍎','🍊','🍋','🍇'],
  ['🚀','✈️','🚗','🚢']
];
var TUBE_CAPACITY=4;
var best=parseInt(localStorage.getItem('es_best')||'999');
if(best===999)document.getElementById('best-disp').textContent='—';
else document.getElementById('best-disp').textContent=best;

var state={running:false,removeAds:false,level:1,tubes:[],selected:-1,moves:0,history:[]};

function getLevelConfig(level){
  var colors=2+Math.min(Math.floor((level-1)/2),5); // 2-7 colors
  var emptyTubes=level<=3?2:2;
  return{colors:Math.min(colors,6),emptyTubes:emptyTubes};
}

function makePuzzle(level){
  var cfg=getLevelConfig(level);
  var emojis=EMOJI_SETS[((level-1)%EMOJI_SETS.length)];
  emojis=emojis.slice(0,cfg.colors);
  // Create items
  var items=[];
  for(var e=0;e<emojis.length;e++){
    for(var k=0;k<TUBE_CAPACITY;k++)items.push(emojis[e]);
  }
  // Shuffle
  for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=items[i];items[i]=items[j];items[j]=t;}
  // Fill tubes
  var tubes=[];
  for(var t=0;t<emojis.length;t++){
    tubes.push(items.slice(t*TUBE_CAPACITY,(t+1)*TUBE_CAPACITY));
  }
  // Add empty tubes
  for(var e=0;e<cfg.emptyTubes;e++)tubes.push([]);
  return{tubes:tubes,emojis:emojis};
}

function cloneTubes(tubes){return tubes.map(function(t){return t.slice();});}

var currentEmojis=[];

function startLevel(){
  var puzzle=makePuzzle(state.level);
  state.tubes=puzzle.tubes;
  currentEmojis=puzzle.emojis;
  state.selected=-1;state.moves=0;state.history=[];
  document.getElementById('level-disp').textContent=state.level;
  document.getElementById('moves-disp').textContent='0';
  renderTubes();
}

function startGame(){
  state.level=1;state.moves=0;
  document.getElementById('overlay').style.display='none';
  state.running=true;
  startLevel();
}
document.getElementById('btn-play').addEventListener('click',startGame);

function renderTubes(){
  var container=document.getElementById('tubes-container');
  container.innerHTML='';
  state.tubes.forEach(function(tube,i){
    var wrap=document.createElement('div');
    wrap.className='tube-wrap';
    var tubeEl=document.createElement('div');
    tubeEl.className='tube'+(state.selected===i?' selected':'')+(isTubeComplete(i,tube)?' complete':'');
    tubeEl.style.minHeight=(TUBE_CAPACITY*50+20)+'px';
    // Draw items (bottom to top: items[0] is bottom)
    var displayed=tube.slice().reverse();
    displayed.forEach(function(emoji){
      var cell=document.createElement('div');
      cell.className='emoji-cell';cell.textContent=emoji;
      tubeEl.appendChild(cell);
    });
    tubeEl.addEventListener('touchstart',function(e){e.preventDefault();handleTubeTap(i);},{passive:false});
    tubeEl.addEventListener('mousedown',function(){handleTubeTap(i);});
    wrap.appendChild(tubeEl);
    container.appendChild(wrap);
  });
}

function isTubeComplete(i,tube){
  if(tube.length!==TUBE_CAPACITY)return false;
  return tube.every(function(e){return e===tube[0];});
}

function handleTubeTap(i){
  if(!state.running)return;
  if(state.selected===-1){
    if(state.tubes[i].length===0)return;
    state.selected=i;
  } else {
    if(state.selected===i){state.selected=-1;renderTubes();return;}
    // Try to move top of selected to tube i
    var from=state.tubes[state.selected];
    var to=state.tubes[i];
    var fromTop=from[from.length-1];
    if(to.length>=TUBE_CAPACITY){state.selected=-1;renderTubes();return;}
    if(to.length===0||to[to.length-1]===fromTop){
      // Move
      state.history.push(cloneTubes(state.tubes));
      to.push(from.pop());
      state.moves++;
      document.getElementById('moves-disp').textContent=state.moves;
    }
    state.selected=-1;
    renderTubes();
    checkWin();
    return;
  }
  renderTubes();
}

function checkWin(){
  var allDone=state.tubes.every(function(tube,i){return tube.length===0||isTubeComplete(i,tube);});
  if(allDone){
    var sc=state.moves;
    var lb=parseInt(localStorage.getItem('es_best_'+state.level)||'999');
    if(sc<lb){localStorage.setItem('es_best_'+state.level,sc);}
    if(state.level>=50){
      // All levels done
      document.getElementById('final-msg').textContent='All 50 Levels Complete! 🎉\nMoves: '+sc;
      document.getElementById('btn-play').textContent='Play Again';
      document.getElementById('overlay').style.display='flex';
      if(!state.removeAds&&window.Android)Android.showInterstitial();
      return;
    }
    setTimeout(function(){
      state.level++;
      startLevel();
    },800);
  }
}

document.getElementById('btn-undo').addEventListener('click',function(){
  if(!state.running||state.history.length===0)return;
  state.tubes=state.history.pop();
  state.selected=-1;state.moves=Math.max(0,state.moves-1);
  document.getElementById('moves-disp').textContent=state.moves;
  renderTubes();
});
document.getElementById('btn-reset').addEventListener('click',function(){if(state.running)startLevel();});

if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
window.onAdMobLoaded=function(){};
</script>
</body>
</html>

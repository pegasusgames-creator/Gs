<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blood Sugar Log</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#FF7043; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.ig { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
.ig label { font-size:0.72rem; color:var(--muted); }
.ig input, .ig select { background:var(--card); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:var(--text); padding:10px 12px; font-size:1rem; width:100%; }
.row2 { display:flex; gap:8px; }
.row2 .ig { flex:1; }
.btn-p { background:var(--accent); border:none; color:#fff; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; width:100%; margin-top:4px; }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:4px; }
.stat-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:2px; }
.stat-val { font-size:1.2rem; font-weight:700; color:var(--accent); }
.entry { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
.entry:last-child { border-bottom:none; }
.badge { border-radius:6px; padding:4px 7px; font-size:0.65rem; font-weight:700; min-width:52px; text-align:center; flex-shrink:0; }
.gl { background:#1565c0; color:#fff; } .gn { background:#2e7d32; color:#fff; }
.gh { background:#e65100; color:#fff; } .gvh { background:#b71c1c; color:#fff; }
.ev { flex:1; } .em { font-size:1rem; font-weight:700; } .es { font-size:0.7rem; color:var(--muted); }
.del { background:none; border:none; color:var(--muted); font-size:1rem; padding:4px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px 0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Blood <span>Sugar</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Log Glucose Reading</div>
      <div class="row2">
        <div class="ig"><label>Glucose (mg/dL)</label><input type="number" id="i-val" placeholder="100" min="20" max="600"></div>
        <div class="ig"><label>Reading Type</label>
          <select id="i-type">
            <option value="Fasting">Fasting</option>
            <option value="Before Meal">Before Meal</option>
            <option value="After Meal">After Meal</option>
            <option value="Bedtime">Bedtime</option>
          </select>
        </div>
      </div>
      <button class="btn-p" id="btn-log">Log Reading</button>
    </div>
    <div class="card" id="stats-card" style="display:none">
      <div class="card-title">Summary</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-lbl">Average</div><div class="stat-val" id="st-avg">--</div></div>
        <div class="stat-box"><div class="stat-lbl">Lowest</div><div class="stat-val" id="st-low">--</div></div>
        <div class="stat-box"><div class="stat-lbl">Highest</div><div class="stat-val" id="st-hi">--</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Normal Ranges Reference</div>
      <div style="font-size:0.75rem;line-height:1.9;color:var(--muted);">
        <span style="color:#1565c0;">&#9632;</span> Low: &lt;70 mg/dL &nbsp;
        <span style="color:#2e7d32;">&#9632;</span> Normal Fasting: 70-99<br>
        <span style="color:#f9a825;">&#9632;</span> Pre-diabetic: 100-125 &nbsp;
        <span style="color:#e65100;">&#9632;</span> Diabetic: &ge;126<br>
        <span style="color:#2e7d32;">&#9632;</span> Normal After Meal: &lt;140
      </div>
    </div>
    <div class="card">
      <div class="card-title">Recent Readings</div>
      <div id="entries-list"><div class="empty">No readings yet. Log your first reading above.</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var entries=JSON.parse(localStorage.getItem('bs_e')||'[]');
function classify(v,type){
  if(v<70)return{l:'Low',c:'gl'};
  if(type==='After Meal'){if(v<140)return{l:'Normal',c:'gn'};if(v<200)return{l:'High',c:'gh'};return{l:'Very High',c:'gvh'};}
  if(v<=99)return{l:'Normal',c:'gn'};
  if(v<=125)return{l:'Pre-diab.',c:'gh'};
  return{l:'Diabetic',c:'gvh'};
}
function fmtD(ts){var d=new Date(ts);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}
function save(){localStorage.setItem('bs_e',JSON.stringify(entries));}

function render(){
  var el=document.getElementById('entries-list');
  var sc=document.getElementById('stats-card');
  var last=entries.slice(-10).reverse();
  if(!last.length){el.innerHTML='<div class="empty">No readings yet.</div>';sc.style.display='none';return;}
  sc.style.display='block';
  var vals=entries.map(function(e){return e.v;});
  document.getElementById('st-avg').textContent=Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length);
  document.getElementById('st-low').textContent=Math.min.apply(null,vals);
  document.getElementById('st-hi').textContent=Math.max.apply(null,vals);
  el.innerHTML=last.map(function(e){
    var cat=classify(e.v,e.tp);
    return '<div class="entry"><span class="badge '+cat.c+'">'+cat.l+'</span><div class="ev"><div class="em">'+e.v+' <span style="color:var(--muted);font-size:0.8rem;">mg/dL</span></div><div class="es">'+e.tp+' &bull; '+fmtD(e.t)+'</div></div><button class="del" data-t="'+e.t+'">&#10005;</button></div>';
  }).join('');
  el.querySelectorAll('.del').forEach(function(b){b.addEventListener('click',function(){var t=parseInt(b.dataset.t);entries=entries.filter(function(e){return e.t!==t;});save();render();});});
}

document.getElementById('btn-log').addEventListener('click',function(){
  var v=parseInt(document.getElementById('i-val').value);
  var tp=document.getElementById('i-type').value;
  if(!v||v<20||v>600){alert('Enter a valid glucose value (20-600 mg/dL).');return;}
  entries.push({v:v,tp:tp,t:Date.now()});
  if(entries.length>200)entries=entries.slice(-200);
  save();
  document.getElementById('i-val').value='';
  render();maybeInterstitial();
});

render();
</script>
</body>
</html>

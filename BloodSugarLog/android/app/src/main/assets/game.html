html[lang^="tr"]{--font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:2px;min-height:var(--appbar-h);padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;padding-inline-start:16px;background:var(--bg)}
.appbar.has-back{padding-inline-start:4px}
.ab-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ab-title{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sub{font-size:.82rem;font-weight:600;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:3rem;height:3rem;min-width:48px;min-height:48px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-grid;place-items:center;padding:0;transition:background .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.tint{color:var(--accent)}
[dir="rtl"] .flip{transform:scaleX(-1)}
#view:focus,.sheet:focus,.dialog:focus{outline:none}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:auto}
.page{max-width:760px;margin:0 auto;padding:4px 16px 28px}
/* Bottom nav = the utility 'footer': symmetric padding + safe-area inset + 6px buffer above
   the native banner (the banner lives outside the WebView, below it). */
.nav{flex:0 0 auto;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding:clamp(2px,.6vh,6px) 8px calc(clamp(2px,.6vh,6px) + env(safe-area-inset-bottom,0px) + 6px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav-btn{flex:1 1 0;min-width:0;min-height:var(--nav-h);border:0;background:transparent;color:var(--text-mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;padding:6px 2px}
.nav-btn .pill{display:grid;place-items:center;width:3.6rem;height:2rem;border-radius:1rem;transition:background .2s,color .2s}
.nav-btn[aria-current="page"]{color:var(--text)}
.nav-btn[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.nav-btn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cards, lists, rows */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card+.card,.group+.group{margin-top:14px}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.sec-h:first-child{margin-top:10px}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:3.5rem;padding:10px 16px;border:0;background:transparent;text-align:start;color:var(--text);font-size:1rem}
.group .row+.row,.group .row+.row-x,.group .row-x+.row{border-top:1px solid var(--border)}
button.row:active{background:var(--surface-2)}
.row .ri{width:2.25rem;height:2.25rem;border-radius:11px;display:grid;place-items:center;background:var(--menu-tile-bg);color:var(--menu-tile-fg);border:1px solid var(--menu-tile-border);flex:none}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rl{font-weight:650;overflow-wrap:break-word}
.row .rs{font-size:.84rem;color:var(--text-mute);overflow-wrap:break-word}
.row select.inp{width:42%;max-width:240px;min-height:2.75rem;flex:none;padding-inline:12px}
.row .rv{color:var(--text-mute);font-weight:650;font-size:.92rem;flex:none;max-width:45%;text-align:end}
.row .chev{color:var(--text-faint)}
.row-x{padding:12px 16px}
.row.danger,.row.danger .ri{color:var(--danger)}
.row.danger .ri{background:transparent;border:1.5px solid currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:transparent;color:var(--success);border:1.5px solid currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;min-width:48px;padding:0 20px;border-radius:14px;border:0;font-weight:750;font-size:1rem;line-height:1.15;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--g-play);color:var(--on-accent);box-shadow:0 6px 18px -6px var(--accent)}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-neutral{background:var(--btn-neutral-bg);color:var(--text)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}

/* form controls */
.field{display:block;margin:0 0 16px}
.field>.fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.inp{width:100%;min-height:3rem;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:1rem}
.inp::placeholder{color:var(--text-faint)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:6.5rem;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface-2);width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:2.75rem;border:0;border-radius:11px;background:transparent;color:var(--text-mute);font-weight:750;font-size:.88rem;line-height:1.15;padding:4px;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.switch{position:relative;flex:none;width:3.25rem;height:2rem;min-width:52px;border-radius:1rem;border:0;background:var(--border-strong);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(2rem - 6px);height:calc(2rem - 6px);border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(1.25rem)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-1.25rem)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:3rem;height:3rem;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center}
.sw i{width:2.1rem;height:2.1rem;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--text)}
.sw .lk{position:absolute;inset-inline-end:2px;bottom:2px;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.stepper button{width:2.75rem;height:2.75rem;min-width:44px;border-radius:11px;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper output{min-width:2.6rem;text-align:center;font-weight:800;font-size:1.15rem}

/* layers: sheets, dialogs, onboarding, toast */
.layer{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center}
.layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;border:0;padding:0;width:100%}
.layer.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.in .sheet{transform:none}
.sheet.full{height:calc(100% - 24px)}
.sheet-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0;padding-inline-start:20px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:1.2rem;font-weight:800;min-width:0}
.grab{position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px 20px 16px;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1 1 140px}
.layer.center{align-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:400px;background:var(--surface);color:var(--text);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:22px 20px 16px;transform:scale(.94);opacity:0;transition:transform .2s,opacity .2s}
.layer.in .dialog{transform:none;opacity:1}
.dialog h2{margin:0 0 8px;font-size:1.2rem;font-weight:800}
.dialog p{margin:0 0 18px;color:var(--text-mute)}
.dialog .btn-row{justify-content:flex-end}
.dialog .btn-row .btn{flex:0 1 auto}
#toast{position:fixed;left:50%;bottom:calc(var(--toast-b,16px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);z-index:var(--z-critical);width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;padding-inline:18px 8px;min-height:3.25rem;border-radius:16px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:650;font-size:.95rem}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .tm{flex:1;min-width:0;padding:6px 0}
#toast .ta{border:0;background:transparent;color:var(--bg);font-weight:850;min-height:44px;padding:0 14px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
.onb{position:fixed;inset:0;z-index:var(--z-tutorial);background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.onb-top{display:flex;justify-content:flex-end;padding:0 8px}
.onb-track{flex:1;display:flex;overflow:hidden;touch-action:pan-y}
.onb-card{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.onb-art{width:min(68vw,260px);height:min(68vw,260px);margin-bottom:28px}
.onb-art svg{width:100%;height:100%}
.onb h2{margin:0 0 10px;font-size:1.6rem;font-weight:850;letter-spacing:-.015em;max-width:440px}
.onb p{margin:0;color:var(--text-mute);font-size:1.05rem;max-width:400px}
.onb-foot{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border-strong);transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--accent)}
.onb-foot .btn{width:min(100%,420px)}
.empty{text-align:center;padding:28px 18px 8px}
.empty .ea{width:132px;height:132px;margin:0 auto 14px}
.empty h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.empty p{margin:0 auto 18px;color:var(--text-mute);max-width:360px}
.pro-hero{text-align:center;padding:2px 0 8px}
.pro-hero .em{width:84px;height:84px;margin:0 auto 10px}
.pro-hero h3{margin:0;font-size:1.4rem;font-weight:850}
.pro-hero p{margin:6px 0 0;color:var(--text-mute)}
.feat{list-style:none;margin:14px 0 6px;padding:0}
.feat li{display:flex;align-items:center;gap:12px;padding:9px 2px;font-weight:650}
.feat li .ri{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fine{font-size:.82rem;color:var(--text-mute);text-align:center;margin:10px 0 0}
.about-foot{text-align:center;color:var(--text-mute);font-size:.82rem;margin:22px 0 4px}
.lock-chip{display:inline-flex;align-items:center;gap:4px}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (min-width:600px){html{font-size:calc(17px * var(--fs))}.page{padding:8px 24px 32px}.appbar{padding-inline:20px 12px}.sheet-body,.sheet-foot{padding-inline:28px}}
@media (min-width:900px){html{font-size:calc(18px * var(--fs))}:root{--appbar-h:4rem}.ab-title{font-size:1.5rem}}

/*@@REGION TOOL_CSS*/
/* Blood Sugar Log tool styles. Tokens only; logical properties for RTL. */
.unitbar{margin-bottom:12px}
.entry{padding:16px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.entry .fl,.frm2 .fl,.cgrp .fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.bigin,.ufx{display:flex;align-items:center;gap:8px}
.bigin .inp,.ufx .inp{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.inp.big{min-height:4.25rem;font-size:clamp(2rem,10vw,2.8rem);font-weight:800;text-align:center;letter-spacing:-.01em;border-radius:var(--r)}
.un{flex:none;min-width:3.4rem;font-weight:800;color:var(--text-mute);font-size:.95rem}
.ufx .un{min-width:2.1rem;font-size:.9rem}
#g-res{min-height:3.4rem;margin:8px 0 10px}
.res-h{margin:8px 2px;color:var(--text-mute);font-size:.9rem}
.res-h.err{color:var(--danger);font-weight:650}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.cl{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 14px 7px 10px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--border-strong);font-weight:800;overflow-wrap:anywhere}
.cl.c-in{border-color:var(--g-in)}.cl.c-l,.cl.c-vl{border-color:var(--g-l)}.cl.c-h,.cl.c-vh{border-color:var(--g-h)}
.cl.c-vl{border-color:var(--g-vl)}.cl.c-vh{border-color:var(--g-vh)}
.alt{color:var(--text-mute);font-weight:700;font-variant-numeric:tabular-nums}
.alert-n{margin:10px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border-strong);font-size:.88rem;font-weight:650}
.cxs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.cx{min-height:2.75rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:700;font-size:.9rem;line-height:1.15}
.cx[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cxs.days{gap:6px}.cxs.days .cx{min-width:2.9rem;padding:6px 8px}
.collapse{display:flex;align-items:center;gap:8px;width:100%;min-height:3rem;margin-top:6px;padding:6px 2px;border:0;background:transparent;color:var(--accent);font-weight:800;text-align:start}
.collapse svg{transition:transform .2s}
.collapse[aria-expanded="true"] svg{transform:rotate(90deg)}
html[dir="rtl"] .collapse svg{transform:scaleX(-1)}
html[dir="rtl"] .collapse[aria-expanded="true"] svg{transform:scaleX(-1) rotate(90deg)}
.more{padding-top:6px}
.rowin{display:flex;gap:8px;align-items:center}.rowin .inp{flex:1;min-width:0}
.save{margin-top:14px}
.notice{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:var(--r);background:var(--accent-soft);color:var(--text);font-weight:650;font-size:.92rem}
.notice span{flex:1;min-width:0}
.notice .btn{min-height:2.75rem;padding:0 14px;flex:none}
.pbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:var(--r);background:var(--accent-soft);color:var(--text)}
.pbar span{flex:1;min-width:0;font-weight:650;font-size:.92rem}
.pbar .btn{min-height:2.75rem;padding:0 14px}
.card{padding:0}.card-pad{padding:16px}
.card h3,.chart h3{margin:0 0 8px;font-size:1rem;font-weight:800}
.card h3 small,.chart h3 small{font-weight:700;color:var(--text-mute)}
.card p{margin:0 0 6px;overflow-wrap:anywhere}
.card .big{font-size:2.4rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.card .hint,.hint{color:var(--text-mute);font-size:.9rem}
.fine{font-size:.8rem;color:var(--text-faint);margin:6px 2px 10px;overflow-wrap:anywhere}
.card .fine{margin:8px 0 0;text-align:start}
.disc{text-align:center;margin-top:10px}
.quiet{color:var(--text-mute);font-weight:600;text-align:center}
.badge.est{background:transparent;border:1.5px solid var(--accent);color:var(--accent);margin-inline-start:8px;vertical-align:middle}
.strip{padding:8px 8px 4px;margin-bottom:12px}
.strip>svg,.chart>svg{display:block;width:100%;height:auto}
.dt{stroke:var(--surface);stroke-width:1.2}
.d-in{fill:var(--g-in)}.d-l{fill:var(--g-l)}.d-h{fill:var(--g-h)}.d-vl{fill:var(--g-vl)}.d-vh{fill:var(--g-vh)}
.lg{flex:none;width:16px;height:16px}
.erow .ev{flex:none;display:inline-flex;align-items:center;gap:6px;min-width:5.6rem;padding:6px 10px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--border-strong);font-variant-numeric:tabular-nums}
.erow .ev b{font-size:1.15rem;font-weight:800}.erow .ev small{font-size:.7rem;font-weight:700;color:var(--text-mute)}
.erow .ev.c-in{border-color:var(--g-in)}.erow .ev.c-l{border-color:var(--g-l)}.erow .ev.c-h{border-color:var(--g-h)}.erow .ev.c-vl{border-color:var(--g-vl)}.erow .ev.c-vh{border-color:var(--g-vh)}
.erow .rt .rs{white-space:normal}
.erow .nt{display:block;color:var(--text-mute);font-size:.84rem;font-style:italic;overflow-wrap:anywhere}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.tl{padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);min-width:0}
.tl b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tl span{display:block;font-size:.76rem;font-weight:650;color:var(--text-mute);overflow-wrap:anywhere}
.tl-sub{margin:0 2px 14px;font-size:.84rem;color:var(--text-mute);font-variant-numeric:tabular-nums}
.tir{display:flex;gap:2px;height:1.3rem;border-radius:999px;overflow:hidden;direction:ltr;box-shadow:inset 0 0 0 1px var(--border-strong);background:var(--surface-2)}
.tir i{display:block;height:100%}
.t-vl{background:var(--g-vl)}.t-l{background:var(--g-l)}.t-in{background:var(--g-in)}.t-h{background:var(--g-h)}.t-vh{background:var(--g-vh)}
.tir-lg{margin-top:12px}
.tl-r{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.92rem}
.tl-r span{flex:1;min-width:0}.tl-r b{font-variant-numeric:tabular-nums}.tl-r small{min-width:2.2rem;text-align:end;color:var(--text-mute);font-variant-numeric:tabular-nums}
.chart{padding:14px 10px 10px;margin-bottom:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1)}
.chart h3{padding-inline:6px}
.ch-grid{stroke:var(--border);stroke-width:1}
.ch-band{fill:var(--g-in);opacity:.16}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.ch-t{fill:var(--text-mute);font-size:10px;font-weight:600;font-family:var(--font)}
.ch-leg{display:flex;gap:14px;flex-wrap:wrap;padding:6px 8px 0;font-size:.78rem;color:var(--text-mute)}
.ch-leg span{display:inline-flex;align-items:center;gap:5px}
.ch-leg i{display:inline-block;width:.9rem;height:.6rem;border-radius:3px;background:var(--g-in);opacity:.4}
.hb-r{display:grid;grid-template-columns:minmax(5.5rem,34%) 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:.88rem}
.hb-l{overflow-wrap:anywhere;font-weight:650}
.hb-t{position:relative;height:.85rem;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hb-band{position:absolute;top:0;bottom:0;background:var(--g-in);opacity:.25}
.hb-f{position:absolute;inset-inline-start:0;top:.2rem;bottom:.2rem;border-radius:999px;background:var(--accent)}
.hb-v{display:flex;align-items:baseline;gap:5px;justify-content:flex-end;min-width:4.4rem;font-variant-numeric:tabular-nums}
.hb-v small{color:var(--text-mute);font-size:.72rem}
.prog{height:.8rem;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;border-radius:999px;background:var(--g-play)}
.msg{padding:12px 14px;margin:12px 0;border-radius:var(--r-sm);background:var(--accent-soft);font-weight:650;border:1px solid var(--border)}
.msg.err{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.frm2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin-bottom:8px}
.frm2 .field{margin:0 0 12px}.frm2.ctxs{display:block}.cgrp{margin-bottom:10px}.cgrp .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}.act .btn{flex:1 1 9rem;height:auto;min-height:3rem;padding:8px 12px;line-height:1.2}
.lnk-row{display:flex;justify-content:center;margin:2px 0 10px}
.remrow{padding:0 16px 0 0;padding-inline:0 16px}
.rem-main{flex:1;min-width:0;display:flex;align-items:center;min-height:3.5rem;padding:10px 0;padding-inline-start:16px;border:0;background:transparent;color:var(--text);text-align:start}
.btn-danger{margin-inline-end:auto}
@media (min-width:600px){.tl b{font-size:1.6rem}.tiles3{gap:14px}}
@media (min-width:900px){#view>*{max-width:46rem;margin-inline:auto}}

C: tidak ditampilkan (butuh {n}+ hasil ukur dalam {d}+ hari dalam 90 hari terakhir)", "sum_log": "Catatan, terbaru dulu", "sum_log_cols": "tanggal jam | gula darah | konteks makan | kelas | karbohidrat | tag | catatan", "sum_more": "… dan {n} hasil ukur lebih lama pada periode ini", "sum_foot": "Pengukuran sesaat yang dicatat sendiri lewat aplikasi Blood Sugar Log. Bukan rekam medis dan bukan saran medis.", "rg_title": "Rentang target", "rg_intro": "Masukkan rentang yang diberikan tenaga kesehatanmu. Sebelum itu, nilai netral dipakai untuk warna dan waktu dalam rentang. Itu bukan rekomendasi untukmu.", "rg_default_note": "Bawaan netral: {lo}–{hi} {u}. Tenaga kesehatan sering memakai rentang lain, misalnya untuk hasil ukur puasa.", "rg_default_tag": "Nilai netral, belum diatur", "rg_lo": "Batas bawah (di bawah ini = di bawah rentang)", "rg_hi": "Batas atas (di atas ini = di atas rentang)", "rg_vlo": "Batas \"jauh di bawah\"", "rg_vhi": "Batas \"jauh di atas\"", "rg_far_note": "Hasil ukur di bawah batas \"jauh di bawah\" atau di atas batas \"jauh di atas\" menampilkan pengingat untuk menghubungi tim perawatanmu.", "rg_per": "Rentang berbeda per konteks makan", "rg_per_sub": "Puasa, sebelum makan, sesudah makan, sebelum tidur", "rg_save": "Simpan rentang", "rg_reset": "Kembalikan ke bawaan", "rg_reset_t": "Setel ulang rentang?", "rg_reset_b": "Rentang bawaan yang netral dipakai lagi. Hasil ukur yang tersimpan tetap ada.", "rg_reset_done": "Rentang disetel ulang.", "rg_saved": "Rentang tersimpan.", "rg_edit": "Ubah rentang", "rg_line": "{lo}–{hi} {u} (jauh di bawah: di bawah {vlo}, jauh di atas: di atas {vhi})", "rg_disc": "Rentang ini hanya mewarnai catatanmu. Aplikasi tidak memberi tahu apa target yang seharusnya kamu punya.", "rg_err_num": "Masukkan setiap batas sebagai angka dalam {limit}.", "rg_err_order": "Urutannya harus: jauh di bawah ≤ bawah < atas ≤ jauh di atas.", "rg_err_ctx": "Setiap rentang konteks makan perlu bawah < atas dan harus berada dalam batas \"jauh di bawah\" dan \"jauh di atas\".", "rem_title": "Pengingat mengukur", "rem_intro": "Ingatkan dirimu untuk mengukur pada hari tertentu setiap minggu atau sekali pada suatu tanggal. Hanya jika sesuai rencanamu; aplikasi tidak pernah memberi tahu kapan harus mengukur.", "rem_none": "Belum ada pengingat.", "rem_add": "Tambah pengingat", "rem_edit": "Ubah pengingat", "rem_weekly": "Mingguan", "rem_once": "Sekali", "rem_days": "Hari", "rem_date": "Tanggal dan jam", "rem_label_f": "Teks di notifikasi (opsional)", "rem_body": "Saatnya cek gula darah, jika itu bagian dari rencanamu.", "rem_on": "Pengingat aktif", "rem_done": "selesai", "rem_nodays": "Pilih minimal satu hari.", "rem_past": "Pilih tanggal dan jam di masa depan.", "rem_max": "Kamu dapat membuat hingga {n} pengingat.", "rem_deleted": "Pengingat dihapus.", "rem_count": "{n} aktif", "rem_off": "Mati", "every_day": "Setiap hari", "rem_disc": "Pengingat memakai notifikasi ponselmu dan bukan alarm keselamatan. Jangan mengandalkannya untuk hal medis apa pun.", "set_t": "Gula darah", "set_unit": "Satuan", "about_t": "Tentang angka-angka ini", "disc_short": "Buku catatan, bukan alat medis. Tanpa diagnosis, tanpa saran dosis atau insulin. Bicarakan angkamu dengan tim perawatanmu.", "about_b": "Warna dan waktu dalam rentang mengikuti rentang target yang kamu masukkan. Rata-rata, waktu dalam rentang, dan perkiraan A1C hanya berasal dari hasil ukur yang kamu catat, dan pengukuran sesaat bisa melewatkan kenaikan dan penurunan di antaranya.", "about_conv": "Satuan: 1 mmol/L = 18,0156 mg/dL. Hasil ukur disimpan sebagai mg/dL bulat (mmol/L × 18,0156, dibulatkan ke atas mulai dari setengah) dan ditampilkan dalam mmol/L dengan satu desimal (mg/dL ÷ 18,0156, pembulatan sama), sehingga 5,5 mmol/L kembali sebagai 5,5.", "about_src": "Sumber perkiraan: Nathan dkk., studi ADAG, Diabetes Care 2008 (eAG = 28,7 × A1C − 46,7).", "carbs_short": "{g} g karbohidrat"},

const SHELL_SCREENS = {};
const UI = {
  stack: [], layers: [], _toastT: 0,

    bb.innerHTML = icon('back', 24, 'flip'); bb.setAttribute('aria-label', t('back'));
    $('#ab-title').textContent = d.title ? d.title(e.params) : APP.name;
    const sub = d.subtitle ? d.subtitle(e.params) : '';

    const acts = (d.actions ? d.actions(e.params) : []).slice();
    if (depth === 1) acts.push({ icon: 'gear', label: t('settings'), act: 'go', arg: 'settings' });
    $('#ab-actions').innerHTML = acts.map(a => '<button class="icon-btn' + (a.tint ? ' tint' : '') + '" data-act="' + a.act + '"' + (a.arg != null ? ' data-arg="' + esc(a.arg) + '"' : '') + ' aria-label="' + esc(a.label) + '">' + icon(a.icon) + '</button>').join('');

    document.documentElement.style.setProperty('--toast-b', showNav ? 'calc(var(--nav-h) + 14px)' : '16px');

    catch (err) { view.firstChild.innerHTML = UI.empty({ icon: 'info', title: t('err_t'), body: t('err_b') }); setTimeout(() => { throw err; }, 0); }

  empty(o) {

  // Bottom sheet. o: {title, body (html), foot (html), full, cls, onClose}. Returns the sheet element.

// ── Monetization ─────────────────────────────────────────────────────
// Catalog == metadata/iaps.json == MainActivity.VALID_PRODUCTS. Both are
// non-consumable; Pro includes ad-free. No subscriptions in the utility shell.
const PRICES = Object.assign({}, APP.prices);
function isPro() { return S.pro === true; }
function adsRemoved() { return S.removeAds === true || isPro(); }
function grant(id) {
  const was = { ads: S.removeAds, pro: S.pro };
  switch (id) {

    case 'pro_lifetime': S.pro = true; S.removeAds = true; break;
    default: return false;
  }
  persist(); Ads.banner(); applyTheme();
  if (was.ads !== S.removeAds || was.pro !== S.pro) {
    UI.toast(t('thanks')); haptic('success');
    if (UI.layers.length && $('.layer:last-child .pro-hero')) UI.closeLayer(true);
    if (TOOL.onGrant) TOOL.onGrant(id);
    UI.refresh();
  }
  return true;
}
function iapDeferGrant(id) {
  try { const p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); p[id] = NOW(); localStorage.setItem('pendingGrants', JSON.stringify(p)); } catch (e) {}
}
window.iapDeferGrant = iapDeferGrant;
// Java billing bridge → here for every PURCHASED (and every restored) SKU. Never throws.
window.onPurchaseSuccess = function (id) {
  try { if (!grant(String(id))) iapDeferGrant(String(id)); }
  catch (e) { try { console.warn('IAP grant error', id, e); } catch (x) {} iapDeferGrant(String(id)); }
};
window.onPurchaseComplete = window.onPurchaseSuccess;
// Unknown SKUs bought before their mechanic existed are replayed once it does.
window.replayPendingGrants = function () {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch (e) { return; }
  const ids = Object.keys(p); if (!ids.length) return;
  const left = {};
  ids.forEach(id => { let ok = false; try { ok = grant(id); } catch (e) {} if (!ok) left[id] = p[id]; });
  try { if (Object.keys(left).length) localStorage.setItem('pendingGrants', JSON.stringify(left)); else localStorage.removeItem('pendingGrants'); } catch (e) {}
};

}

// Ads: banner always (unless ad-free); interstitial ONLY at natural breaks,
// never in the first session, >= 3 min apart, >= 2 breaks between ads,
// never for Remove-Ads / Pro owners. Rewarded = opt-in only.
const Ads = {
  pending: null,
  banner() { callA(adsRemoved() ? 'hideBannerAd' : 'showBannerAd'); },
  naturalBreak(reason) {
    if (!APP.interstitials || adsRemoved() || !bridge()) return false;
    if (S.sessions < 2) return false;                         // never in the first session
    S.ads.breaks = (S.ads.breaks | 0) + 1;
    const sinceInterstitialMs = NOW() - (S.ads.last || 0);
    if (S.ads.breaks >= 2 && sinceInterstitialMs >= 180000) {  // >=2 breaks AND >=3 min since the last one
      S.ads.breaks = 0; S.ads.last = NOW(); persist();
      callA('showInterstitial');
      return true;
    }
    persist();
    return false;
  },
  // Opt-in rewarded video. type must be in MainActivity.VALID_REWARD_TYPES.

    callA('showRewarded', type);
  },
  preload() { callA('preloadRewarded'); },
};

window.onAdReward = function(type) {
  const p = Ads.pending; Ads.pending = null;
  if (p && p.type === type && p.cb) { try { p.cb(); } catch (e) {} }
};

// ── Reminders (Java NotificationHelper; slot 0 = app-wide daily) ─────
// Permission is asked IN CONTEXT only — after the user switches a reminder on.
const Reminders = {
  _res: null,
  ensurePermission() {
    return new Promise(res => {

  },
  set(slot, h, m, daysMask, title, body) {
    const A = bridge();

  // One-shot (yearly=false) or yearly reminder at a local date-time —
  // birthdays, bills, events. `when` = Date or epoch ms.
  setAt(slot, when, yearly, title, body) {

const Data = {
  payload() {
    return JSON.stringify({ app: APP.pkg, kind: 'backup', v: SAVE_VERSION, at: new Date(NOW()).toISOString(), settings: S.settings, tool: S.tool });
  },
  share(text, subject) { if (bridge()) callA('shareText', text); else this.copy(text); },
  copy(text) {
    let ok = false;
    if (bridge()) { callA('copyToClipboard', text); ok = true; }
    else if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); ok = true; }
    UI.toast(ok ? t('copied') : t('store_unavail'));
  },
  async paste() {
    const v = callA('readClipboard');
    if (typeof v === 'string' && v) return v;
    try { if (navigator.clipboard) return await navigator.clipboard.readText(); } catch (e) {}
    return '';
  },
  parse(text) {
    let o; try { o = JSON.parse(String(text || '').trim()); } catch (e) { return null; }
    if (!o || o.kind !== 'backup' || o.app !== APP.pkg || !o.tool || !TOOL.validateImport(o.tool)) return null;
    return o;
  },
  // Replace tool data (+ prefs) from a backup; purchases are never imported.
  async importText(text) {
    const o = this.parse(text);
    if (!o) { UI.toast(t('imp_bad')); haptic('reject'); return false; }
    const ok = await UI.confirm({ title: t('imp_title'), body: t('imp_confirm'), ok: t('imp_go'), danger: true });
    if (!ok) return false;
    const prev = { tool: clone(S.tool), settings: clone(S.settings) };

    if (o.settings) { const keep = S.settings.lang; S.settings = migrateSave({ settings: o.settings }).settings; S.settings.lang = keep; }

const Onboarding = {

    document.body.appendChild(L);
    let x0 = null;
    const tr = L.querySelector('.onb-track');
    tr.addEventListener('pointerdown', e => { x0 = e.clientX; });
    tr.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { const fwd = (dx < 0) !== (document.documentElement.dir === 'rtl'); this.step(fwd ? 1 : -1); } });

  step(d) { const n = APP.onboarding.length; const j = this.i + d; if (j >= n) { this.done(); return; } this.i = clamp(j, 0, n - 1); this.paint(); },
  paint() {
    const L = $('#onb'); if (!L) return;
    const rtl = document.documentElement.dir === 'rtl', n = APP.onboarding.length;
    $$('.onb-card', L).forEach((c, k) => { c.style.transform = 'translateX(' + ((rtl ? 100 : -100) * this.i) + '%)'; c.setAttribute('aria-hidden', k === this.i ? 'false' : 'true'); });
    $$('.dots i', L).forEach((d, k) => d.classList.toggle('on', k === this.i));
    $('#onb-next').textContent = this.i === n - 1 ? t('get_started') : t('next');
  },

  },
};

// Rules (also stated in the app): 1 mmol/L = 18.0156 mg/dL. A reading is STORED as whole mg/dL (mmol/L x 18.0156, rounded half up) and shown
// in mmol/L with one decimal (mg/dL / 18.0156, rounded half up), so a value typed as 5.5 mmol/L comes back as 5.5. Class limits are whole mg/dL;
// both ends of the target range are inside it. Averages and A1C use integer arithmetic only, so rounding never drifts.
// eA1C = (average mg/dL + 46.7) / 28.7 (ADAG: eAG = 28.7 x A1C - 46.7), one decimal, half up.
const GL = (() => {
  const MGMMOL = 18.0156, EPS = 1e-9;
  const MIN_MG = 20, MAX_MG = 600;
  const A1C_WINDOW = 90, A1C_MIN_READINGS = 20, A1C_MIN_DAYS = 10;
  const isNum = x => typeof x === 'number' && isFinite(x);
  const isInt = x => typeof x === 'number' && Number.isInteger(x);
  const half = (num, den) => Math.floor((2 * num + den) / (2 * den));          // round half up of num/den (integers, num >= 0, den > 0)
  const mmolToMg = x => (isNum(x) && x > 0 ? Math.floor(x * MGMMOL + 0.5 + EPS) : null);
  const mmolTenths = (sum, n) => half(100000 * sum, 180156 * n);                  // (sum / n) mg/dL as tenths of mmol/L
  const mgToMmolTenths = mg => mmolTenths(mg, 1);
  const meanR0 = (sum, n) => (n > 0 ? half(sum, n) : null);
  const validMg = mg => isInt(mg) && mg >= MIN_MG && mg <= MAX_MG;
  const validRange = r => !!r && [r.vlo, r.lo, r.hi, r.vhi].every(isInt) && r.vlo >= MIN_MG && r.vlo <= r.lo && r.lo < r.hi && r.hi <= r.vhi && r.vhi <= MAX_MG;
  // The range for a meal context: the context's own lo/hi when the user set it and it sits inside the very-low/very-high limits, else the general one.
  const rangeFor = (R, c) => {
    const o = R.ctx && R.ctx[c];
    if (o && isInt(o.lo) && isInt(o.hi) && o.lo >= R.vlo && o.lo < o.hi && o.hi <= R.vhi) return { lo: o.lo, hi: o.hi, vlo: R.vlo, vhi: R.vhi };
    return { lo: R.lo, hi: R.hi, vlo: R.vlo, vhi: R.vhi };
  };
  // vl very low, l low, in in range, h high, vh very high
  const classify = (mg, r) => (!isNum(mg) ? null : mg > r.vhi ? 'vh' : mg > r.hi ? 'h' : mg < r.vlo ? 'vl' : mg < r.lo ? 'l' : 'in');
  const BUCKETS = ['ni', 'mo', 'md', 'af', 'ev'];                                 // night 0-5, morning 6-10, midday 11-14, afternoon 15-18, evening 19-23
  const bucket = h => (h < 6 ? 'ni' : h < 11 ? 'mo' : h < 15 ? 'md' : h < 19 ? 'af' : 'ev');
  const CTX = ['f', 'b', 'a', 'n', 'o'];                                          // fasting, before meal, after meal, bedtime, other
  const pctInt = (count, total) => (total > 0 ? half(100 * count, total) : 0);
  // list: [{mg, c, h}] (mg whole mg/dL, c context id, h local hour 0-23). R: {lo, hi, vlo, vhi, ctx}
  const stats = (list, R) => {
    const o = { n: 0, sum: 0, min: null, max: null, cls: { vl: 0, l: 0, in: 0, h: 0, vh: 0 }, bucket: {}, ctx: {} };
    BUCKETS.forEach(k => { o.bucket[k] = { n: 0, sum: 0 }; });
    CTX.forEach(k => { o.ctx[k] = { n: 0, sum: 0 }; });
    list.forEach(e => {
      o.n++; o.sum += e.mg;
      if (o.min === null || e.mg < o.min) o.min = e.mg;
      if (o.max === null || e.mg > o.max) o.max = e.mg;
      o.cls[classify(e.mg, rangeFor(R, e.c))]++;
      const b = o.bucket[bucket(e.h)]; b.n++; b.sum += e.mg;
      const k = o.ctx[CTX.indexOf(e.c) >= 0 ? e.c : 'o']; k.n++; k.sum += e.mg;
    });
    return o;
  };
  const a1cTenths = (sum, n) => (n > 0 ? half(100 * sum + 4670 * n, 287 * n) : null);   // eA1C x 10, from the mean of n readings
  const a1cEligible = (n, days) => n >= A1C_MIN_READINGS && days >= A1C_MIN_DAYS;
  // Typed numbers: Latin / Arabic-Indic / Devanagari digits, "," or "." or Arabic "٫" as the one decimal mark, spaces ignored. NaN when not a plain number.
  const parseNum = s => {
    let x = String(s == null ? '' : s).replace(/[٠-٩]/g, c => String(c.charCodeAt(0) - 0x660)).replace(/[۰-۹]/g, c => String(c.charCodeAt(0) - 0x6F0))
      .replace(/[०-९]/g, c => String(c.charCodeAt(0) - 0x966)).replace(/[٫,]/g, '.').replace(/[\s  ]/g, '');
    return /^(\d+\.?\d*|\.\d+)$/.test(x) ? Number(x) : NaN;
  };
  return { MGMMOL, MIN_MG, MAX_MG, A1C_WINDOW, A1C_MIN_READINGS, A1C_MIN_DAYS, BUCKETS, CTX, half, mmolToMg, mmolTenths, mgToMmolTenths, meanR0, validMg, validRange, rangeFor, classify, bucket, pctInt, stats, a1cTenths, a1cEligible, parseNum };
})();

// Value typed in the current unit -> whole mg/dL, or null when empty/invalid. kind: 'empty' | 'bad' | 'ok'
function readG(text) {
  if (String(text).trim() === '') return { kind: 'empty', mg: null };
  const x = GL.parseNum(text); if (isNaN(x)) return { kind: 'bad', mg: null };
  const mg = isMg() ? Math.floor(x + 0.5) : GL.mmolToMg(x);
  return GL.validMg(mg) ? { kind: 'ok', mg: mg } : { kind: 'bad', mg: null };

// ---------- shared drawing ----------
function glyph(k, x, y, r) {            // shape + colour: circle = in range, triangle up = above, triangle down = below
  const c = 'dt d-' + k;
  if (k === 'in') return '<circle class="' + c + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '"/>';
  const s = k === 'h' || k === 'vh' ? -1 : 1, w = r * 1.25, hh = r * 1.2;
  return '<path class="' + c + '" d="M' + x.toFixed(1) + ' ' + (y + s * hh).toFixed(1) + 'L' + (x - w).toFixed(1) + ' ' + (y - s * hh * .8).toFixed(1) + 'L' + (x + w).toFixed(1) + ' ' + (y - s * hh * .8).toFixed(1) + 'Z"/>';
}
function legendGlyph(k) { return '<svg class="lg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">' + glyph(k, 8, 8, 5) + '</svg>'; }
function yAxis(lo, hi) {                // mg/dL domain with a little air

}
function tickTxt(mg) { return isMg() ? fmtNum(Math.round(mg)) : fx1(mg / GL.MGMMOL); }
function plot(list, xOf, xTicks, opts) {   // list: entries; shared scatter frame with the general target band
  const W = 340, H = opts.h || 190, L = 38, R = 10, Tp = 10, B = 24, R0 = rgn();
  const vals = list.map(e => e.mg), a = yAxis(Math.min.apply(null, vals.concat([R0.lo])), Math.max.apply(null, vals.concat([R0.hi])));
  const Y = v => Tp + (a.hi - v) / (a.hi - a.lo) * (H - Tp - B), X = i => L + xOf(list[i]) * (W - L - R);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria) + '">';
  s += '<rect class="ch-band" x="' + L + '" y="' + Y(R0.hi).toFixed(1) + '" width="' + (W - L - R) + '" height="' + (Y(R0.lo) - Y(R0.hi)).toFixed(1) + '"/>';
  for (let k = 0; k < 4; k++) { const v = a.lo + (a.hi - a.lo) * k / 3, y = Y(v); s += '<line class="ch-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text class="ch-t" x="' + (L - 5) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + esc(tickTxt(v)) + '</text>'; }
  if (opts.line && list.length > 1) s += '<polyline class="ch-line" points="' + list.map((e, i) => X(i).toFixed(1) + ',' + Y(e.mg).toFixed(1)).join(' ') + '"/>';
  list.forEach((e, i) => { if (list.length <= 150 || i % Math.ceil(list.length / 150) === 0) s += glyph(GL.classify(e.mg, rangeOf(e.c)), X(i), Y(e.mg), 3.6); });
  xTicks.forEach(tk => { s += '<text class="ch-t" x="' + (L + tk.p * (W - L - R)).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (tk.p < .05 ? 'start' : tk.p > .95 ? 'end' : 'middle') + '">' + esc(tk.s) + '</text>'; });
  return s + '</svg>';
}
function seriesSvg(list, per) {
  const t0 = dayStart(per - 1), t1 = NOW(), span = Math.max(1, t1 - t0), f = { day: 'numeric', month: 'short' };
  return plot(list, e => clamp((e.ts - t0) / span, 0, 1), [{ p: 0, s: fmtDate(new Date(t0), f) }, { p: 1, s: fmtDate(new Date(t1), f) }],
    { aria: t('chart_series_aria', { n: list.length, days: per }), line: false });
}

function hbars(rows, maxMean) {            // rows: [{label, sum, n}] -> horizontal bars with the target band behind
  const R0 = rgn(), top = Math.max(maxMean, R0.hi) * 1.1;

}
function freeSlot() { for (let s = 1; s <= MAX_REMS; s++) if (!S.tool.rems.some(r => r.slot === s)) return s; return 0; }
function defaultOnce() { const d = new Date(NOW() + DAY); d.setHours(8, 0, 0, 0); return toInput(d.getTime()); }
ACT['rem-add'] = () => {
  if (S.tool.rems.length >= MAX_REMS) return;
  RD = { id: null, kind: 'weekly', mask: 62, time: '08:00', when: defaultOnce(), label: '' };
  openRemSheet();
};
ACT['rem-edit'] = el => {
  const r = S.tool.rems.find(x => x.id === el.dataset.arg); if (!r) return;
  RD = { id: r.id, kind: r.kind, mask: r.mask || 62, time: pad2(r.h) + ':' + pad2(r.m), when: r.kind === 'once' ? toInput(r.ts) : defaultOnce(), label: r.label || '' };
  openRemSheet();
};
function openRemSheet() {
  UI.sheet({ title: t(RD.id ? 'rem_edit' : 'rem_add'), full: true, body: '<div id="rd-body"></div>',
    foot: (RD.id ? '<button class="btn btn-danger" data-act="rem-del">' + icon('trash', 20) + esc(t('delete')) + '</button>' : '') + '<button class="btn btn-primary" data-act="rem-save">' + esc(t('save')) + '</button>' });
  paintRem();
}
function paintRem() {
  const el = $('#rd-body'); if (!el || !RD) return;
  el.innerHTML = '<div class="field">' + seg([['weekly', t('rem_weekly')], ['once', t('rem_once')]], RD.kind, 'rd-kind') + '</div>' +
    (RD.kind === 'weekly'
      ? '<span class="fl">' + esc(t('rem_days')) + '</span><div class="cxs days" role="group">' + [0, 1, 2, 3, 4, 5, 6].map(i => '<button class="cx" data-act="rd-day" data-arg="' + i + '" aria-pressed="' + ((RD.mask & (1 << i)) ? 'true' : 'false') + '" aria-label="' + esc(weekdayName(i, 'long')) + '">' + esc(weekdayName(i, 'short')) + '</button>').join('') + '</div>' +
        '<label class="field" style="margin-top:14px"><span class="fl">' + esc(t('s_time')) + '</span><input class="inp" type="time" data-change="rd-time" value="' + esc(RD.time) + '"></label>'
      : '<label class="field"><span class="fl">' + esc(t('rem_date')) + '</span><input class="inp" type="datetime-local" data-change="rd-when" min="' + esc(toInput(NOW())) + '" value="' + esc(RD.when) + '"></label>') +
    '<label class="field"><span class="fl">' + esc(t('rem_label_f')) + '</span><input class="inp" maxlength="60" data-input="rd-label" value="' + esc(RD.label) + '" placeholder="' + esc(t('rem_body')) + '" enterkeyhint="done" autocomplete="off"></label>';
}
ACT['rd-kind'] = el => { RD.kind = el.dataset.arg; paintRem(); };
ACT['rd-day'] = el => { RD.mask ^= (1 << (+el.dataset.arg)); paintRem(); };
CHANGE['rd-time'] = el => { RD.time = String(el.value || RD.time); };
CHANGE['rd-when'] = el => { RD.when = String(el.value || ''); };
INPUT['rd-label'] = el => { RD.label = el.value.slice(0, 60); };
ACT['rem-save'] = async () => {
  const T = S.tool, hm = /^(\d{1,2}):(\d{2})/.exec(RD.time || ''), h = hm ? clamp(+hm[1], 0, 23) : 8, m = hm ? clamp(+hm[2], 0, 59) : 0;
  const o = { kind: RD.kind, label: RD.label.trim().slice(0, 60), on: true };
  if (RD.kind === 'weekly') { if (!(RD.mask & 127)) { UI.toast(t('rem_nodays')); haptic('reject'); return; } o.mask = RD.mask & 127; o.h = h; o.m = m; o.ts = 0; }
  else { const ts = fromInput(RD.when); if (isNaN(ts) || ts <= NOW() + 30000) { UI.toast(t('rem_past')); haptic('reject'); return; } const d = new Date(ts); o.ts = ts; o.h = d.getHours(); o.m = d.getMinutes(); o.mask = 0; }
  const ex = RD.id ? T.rems.find(x => x.id === RD.id) : null, slot = ex ? ex.slot : freeSlot();
  if (!slot) { UI.toast(t('rem_max', { n: MAX_REMS })); return; }
  const ok = await Reminders.ensurePermission();
  if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return; }
  const r = Object.assign(ex || { id: uid('r'), slot: slot }, o); if (!ex) T.rems.push(r);
  remArm(r); RD = null; persist(); UI.closeLayer(true); UI.refresh(); haptic('success');
  UI.toast(t('rem_set', { time: remWhen(r) }));
};
ACT['rem-del'] = async () => {
  const T = S.tool, r = RD && T.rems.find(x => x.id === RD.id); if (!r) return;
  const i = T.rems.indexOf(r); T.rems.splice(i, 1); Reminders.cancel(r.slot); RD = null; persist(); UI.closeLayer(true); UI.refresh(); haptic('reject');
  UI.toast(t('rem_deleted'), { action: t('undo'), onAction: () => { T.rems.splice(Math.min(i, T.rems.length), 0, r); remArm(r); persist(); UI.refresh(); } });
};
ACT['rem-toggle'] = async el => {
  const T = S.tool, r = T.rems.find(x => x.id === el.dataset.arg); if (!r) return;
  if (r.on && !(r.kind === 'once' && r.ts <= NOW())) { r.on = false; remArm(r); persist(); UI.refresh(); return; }
  if (r.kind === 'once' && r.ts <= NOW()) { UI.toast(t('rem_past')); ACT['rem-edit'](el); return; }
  const ok = await Reminders.ensurePermission();
  if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return; }
  r.on = true; remArm(r); persist(); UI.refresh(); UI.toast(t('rem_set', { time: remWhen(r) }));
};

// ---------- About ----------
ACT['about-open'] = () => {
  UI.sheet({ title: t('about_t'), body: '<p>' + esc(t('disc_short')) + '</p><p>' + esc(t('about_b')) + '</p><p>' + esc(t('about_conv')) + '</p><p class="fine">' + esc(t('a1c_formula')) + '</p><p class="fine">' + esc(t('about_src')) + '</p>' });
};

// ===== TOOL contract =====
const TOOL = {
  defaults: () => ({ unit: 'mg', ranges: DEF_RANGES(), entries: [], rems: [], saves: 0 }),
  migrate(tool, from) {
    const o = Object.assign(TOOL.defaults(), tool && typeof tool === 'object' ? tool : {});
    const int = (v, lo, hi, d) => (Number.isInteger(v) && v >= lo && v <= hi ? v : d);
    o.unit = o.unit === 'mmol' ? 'mmol' : 'mg';
    const r = o.ranges && typeof o.ranges === 'object' ? o.ranges : {}, d = DEF_RANGES();
    const n = { lo: int(r.lo, 20, 600, d.lo), hi: int(r.hi, 20, 600, d.hi), vlo: int(r.vlo, 20, 600, d.vlo), vhi: int(r.vhi, 20, 600, d.vhi), ctx: {}, set: !!r.set };
    if (!GL.validRange(n)) { n.lo = d.lo; n.hi = d.hi; n.vlo = d.vlo; n.vhi = d.vhi; }
    ['f', 'b', 'a', 'n'].forEach(c => { const x = r.ctx && r.ctx[c]; if (x && Number.isInteger(x.lo) && Number.isInteger(x.hi) && x.lo >= n.vlo && x.lo < x.hi && x.hi <= n.vhi) n.ctx[c] = { lo: x.lo, hi: x.hi }; });
    o.ranges = n;
    const seen = {};
    o.entries = (Array.isArray(o.entries) ? o.entries : []).filter(e => e && Number.isFinite(e.ts) && e.ts > 946684800000 && GL.validMg(e.mg) && !(e.id && seen[e.id]) && (seen[e.id || 'x' + Math.random()] = 1))
      .map(e => ({ id: String(e.id || uid('g')), ts: e.ts, mg: e.mg, c: GL.CTX.indexOf(e.c) >= 0 ? e.c : 'o',
        carbs: Number.isInteger(e.carbs) && e.carbs >= 0 && e.carbs <= 500 ? e.carbs : null, note: typeof e.note === 'string' ? e.note.slice(0, 140) : '',
        tags: (Array.isArray(e.tags) ? e.tags : []).filter(k => TAGS.indexOf(k) >= 0) })).sort(byTs);
    const used = {};
    o.rems = (Array.isArray(o.rems) ? o.rems : []).filter(r2 => r2 && (r2.kind === 'weekly' || r2.kind === 'once') && Number.isInteger(r2.slot) && r2.slot >= 1 && r2.slot <= MAX_REMS && !used[r2.slot] && (used[r2.slot] = 1))
      .map(r2 => ({ id: String(r2.id || uid('r')), slot: r2.slot, kind: r2.kind, mask: int(r2.mask, 0, 127, 0), h: int(r2.h, 0, 23, 8), m: int(r2.m, 0, 59, 0), ts: Number.isFinite(r2.ts) ? r2.ts : 0, label: typeof r2.label === 'string' ? r2.label.slice(0, 60) : '', on: !!r2.on }));
    o.saves = int(o.saves, 0, 1e9, 0);
    return o;
  },
  validateImport: tool => !!(tool && Array.isArray(tool.entries) && tool.entries.every(e => e && Number.isFinite(e.ts) && GL.validMg(e.mg))),
  syncReminders() { remSync(); },
  onBoot() { TD.all = false; TD.filt = 'all'; RG = null; },
  onNewDay() {},
  onGrant() {},
  afterOnboarding() { UI.refresh(); },
  csv() {
    const q = v => { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const names = { vl: 'far_below', l: 'below', in: 'in_range', h: 'above', vh: 'far_above' }, cn = { f: 'fasting', b: 'before_meal', a: 'after_meal', n: 'bedtime', o: 'other' };
    const rows = [['date', 'time', 'glucose_mg_dl', 'glucose_mmol_l', 'meal_context', 'carbs_g', 'range_class', 'tags', 'note']];
    S.tool.entries.forEach(e => { const d = new Date(e.ts); rows.push([dkey(d), pad2(d.getHours()) + ':' + pad2(d.getMinutes()), e.mg, (GL.mgToMmolTenths(e.mg) / 10).toFixed(1), cn[e.c], e.carbs == null ? '' : e.carbs, names[clsOf(e)], (e.tags || []).join(';'), e.note]); });
    return rows.map(r => r.map(q).join(',')).join('\n') + '\n';
  },
  settingsHtml() {
    const T = S.tool, r = T.ranges, nOn = T.rems.filter(x => x.on).length;
    return '<div class="sec-h">' + esc(t('set_t')) + '</div><div class="group">' +
      '<div class="row-x"><span class="fl" style="display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px">' + esc(t('set_unit')) + '</span>' + seg([['mg', t('u_mg')], ['mmol', t('u_mmol')]], T.unit, 'unit') + '</div>' +
      sRow({ icon: 'target', label: t('rg_title'), sub: r.set ? t('rg_line', { lo: dispNum(r.lo), hi: dispNum(r.hi), u: uName(), vlo: dispNum(r.vlo), vhi: dispNum(r.vhi) }) : t('rg_default_tag'), act: 'go', arg: 'ranges' }) +
      sRow({ icon: 'bell', label: t('rem_title'), sub: nOn ? t('rem_count', { n: nOn }) : t('rem_off'), act: 'go', arg: 'rem' }) +
      sRow({ icon: 'info', label: t('about_t'), sub: t('disc_short'), act: 'about-open' }) + '</div>';
  },
  screens: {
    log: { title: () => t('tab_log'), subtitle: () => t('log_sub'), actions: () => [{ icon: 'bell', label: t('rem_title'), act: 'go', arg: 'rem' }], render: el => logScreen(el) },
    insights: { title: () => t('tab_ins'), render: el => insightsScreen(el) },
    history: { title: () => t('tab_hist'), render: el => historyScreen(el) },
    ranges: { title: () => t('rg_title'), onLeave: () => { RG = null; }, render: el => rangesScreen(el) },
    rem: { title: () => t('rem_title'), render: el => remsScreen(el) },
  },
};
//@@END TOOL_CORE
// ── Boot ─────────────────────────────────────────────────────────────
(function boot() {
  mergeI18n();
  loadSave();
  touchSession();
  lastDayKey = todayKey();
  applyLang(); applyTheme(); applyFontScale();
  checkTrial();
  UI.buildNav();
  if (TOOL.onBoot) TOOL.onBoot();
  UI.tab(APP.tabs[0].id);
  persist();
  window.replayPendingGrants();
  Ads.banner();
  Reminders.syncDaily();
  if (TOOL.syncReminders) TOOL.syncReminders();
  if (!S.onboarded) Onboarding.show();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
#banner { width:100%; height:50px; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:#555; font-size:12px; border-bottom:1px solid #333; }
#header { width:100%; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; background:#1a1a1a; }
h1 { font-size:20px; color:#4CAF50; font-weight:700; }
#info { font-size:13px; color:#aaa; text-align:right; }
#difficulty { display:flex; gap:6px; padding:6px 16px; justify-content:center; }
.diff-btn { font-size:13px; padding:6px 14px; background:#1e1e1e; color:#4CAF50; border:1.5px solid #4CAF50; border-radius:8px; cursor:pointer; touch-action:manipulation; }
.diff-btn.active { background:#4CAF50; color:#000; }
#controls { display:flex; gap:8px; padding:6px 16px; flex-wrap:wrap; justify-content:center; }
button { background:#1e1e1e; color:#4CAF50; border:1.5px solid #4CAF50; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; touch-action:manipulation; }
button:active { background:#4CAF50; color:#000; }
#flag-mode-btn.flagging { background:#FF9800; color:#000; border-color:#FF9800; }
#msg { padding:5px 16px; text-align:center; font-size:15px; min-height:30px; color:#4CAF50; }
#grid-wrap { overflow:auto; padding:6px; max-width:100vw; }
#grid { display:inline-grid; gap:2px; background:#1a1a1a; padding:4px; border-radius:6px; border:2px solid #4CAF50; }
.cell { display:flex; align-items:center; justify-content:center; border-radius:3px; font-weight:700; font-size:14px; user-select:none; cursor:pointer; touch-action:manipulation; }
.cell.hidden { background:#2e2e2e; }
.cell.revealed { background:#1a1a1a; border:1px solid #333; }
.cell.flagged { background:#2e2e2e; }
.cell.mine-explode { background:#f44336; }
.n1{color:#1E88E5} .n2{color:#43A047} .n3{color:#EF5350} .n4{color:#9C27B0}
.n5{color:#FF6F00} .n6{color:#00BCD4} .n7{color:#fff} .n8{color:#999}
</style>
</head>
<body>
<div id="banner">Advertisement</div>
<div id="header">
  <h1>Minesweeper</h1>
  <span id="info">💣 10 | ⏱ 0s</span>
</div>
<div id="difficulty">
  <button class="diff-btn active" onclick="setDiff(0)">Easy 8×8</button>
  <button class="diff-btn" onclick="setDiff(1)">Med 12×10</button>
  <button class="diff-btn" onclick="setDiff(2)">Hard 16×14</button>
</div>
<div id="controls">
  <button onclick="newGame()">New Game</button>
  <button id="flag-mode-btn" onclick="toggleFlagMode()">🚩 Flag Mode: OFF</button>
  <button onclick="removeAds()">No Ads</button>
</div>
<div id="msg">Tap to reveal. Long press or Flag Mode to flag mines.</div>
<div id="grid-wrap"><div id="grid"></div></div>

<script>
const DIFFS = [
  {rows:8, cols:8, mines:10},
  {rows:10, cols:12, mines:20},
  {rows:14, cols:16, mines:40},
];
const NUM_COLORS = ['','n1','n2','n3','n4','n5','n6','n7','n8'];

const state = {
  diff:0, rows:8, cols:8, mines:10,
  board:[], revealed:[], flagged:[], minePos:new Set(),
  started:false, gameOver:false, won:false,
  timerInterval:null, time:0, flagMode:false,
  removeAds:false, bestTimes:[null,null,null]
};

let longPressTimer = null;

function setDiff(d) {
  state.diff = d;
  document.querySelectorAll('.diff-btn').forEach((b,i)=>b.classList.toggle('active',i===d));
  newGame();
}

function newGame() {
  clearInterval(state.timerInterval);
  const d = DIFFS[state.diff];
  state.rows=d.rows; state.cols=d.cols; state.mines=d.mines;
  state.board = Array(d.rows*d.cols).fill(0);
  state.revealed = Array(d.rows*d.cols).fill(false);
  state.flagged = Array(d.rows*d.cols).fill(false);
  state.minePos = new Set();
  state.started=false; state.gameOver=false; state.won=false;
  state.time=0; state.flagMode=false;
  document.getElementById('flag-mode-btn').className='';
  document.getElementById('flag-mode-btn').textContent='🚩 Flag Mode: OFF';
  updateInfo();
  document.getElementById('msg').textContent='Tap to reveal. First tap is always safe!';
  renderGrid();
}

function placeMines(safeIdx) {
  const total = state.rows*state.cols;
  const positions = [];
  for (let i=0;i<total;i++) if (i!==safeIdx) positions.push(i);
  // Fisher-Yates
  for (let i=positions.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [positions[i],positions[j]]=[positions[j],positions[i]];
  }
  state.minePos = new Set(positions.slice(0,state.mines));
  // Compute neighbor counts
  state.board = Array(total).fill(0);
  state.minePos.forEach(idx => {
    state.board[idx] = -1;
    neighbors(idx).forEach(n => { if (state.board[n]!==-1) state.board[n]++; });
  });
}

function neighbors(idx) {
  const r=Math.floor(idx/state.cols), c=idx%state.cols;
  const res=[];
  for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
    if (!dr&&!dc) continue;
    const nr=r+dr,nc=c+dc;
    if (nr>=0&&nr<state.rows&&nc>=0&&nc<state.cols) res.push(nr*state.cols+nc);
  }
  return res;
}

function reveal(idx) {
  if (state.revealed[idx]||state.flagged[idx]) return;
  state.revealed[idx]=true;
  if (state.board[idx]===0) neighbors(idx).forEach(n=>reveal(n));
}

function tapCell(idx) {
  if (state.gameOver||state.won) return;
  if (state.flagMode) { toggleFlag(idx); return; }
  if (state.flagged[idx]) return;
  if (state.revealed[idx]) { chordReveal(idx); return; }
  if (!state.started) {
    state.started=true;
    placeMines(idx);
    state.timerInterval=setInterval(()=>{state.time++;updateInfo();},1000);
  }
  if (state.minePos.has(idx)) {
    state.revealed[idx]=true;
    gameOver(idx);
    return;
  }
  reveal(idx);
  renderGrid();
  checkWin();
}

function chordReveal(idx) {
  if (!state.revealed[idx]||state.board[idx]<=0) return;
  const ns=neighbors(idx);
  const flagCount=ns.filter(n=>state.flagged[n]).length;
  if (flagCount!==state.board[idx]) return;
  let hitMine=false;
  ns.forEach(n=>{
    if (!state.flagged[n]&&!state.revealed[n]) {
      if (state.minePos.has(n)) { hitMine=true; state.revealed[n]=true; }
      else reveal(n);
    }
  });
  renderGrid();
  if (hitMine) gameOver(-1);
  else checkWin();
}

function toggleFlag(idx) {
  if (state.revealed[idx]) return;
  state.flagged[idx]=!state.flagged[idx];
  renderGrid();
  updateInfo();
}

function toggleFlagMode() {
  state.flagMode=!state.flagMode;
  const btn=document.getElementById('flag-mode-btn');
  btn.textContent='🚩 Flag Mode: '+(state.flagMode?'ON':'OFF');
  btn.className=state.flagMode?'flagging':'';
}

function gameOver(explodeIdx) {
  clearInterval(state.timerInterval);
  state.gameOver=true;
  // Reveal all mines
  state.minePos.forEach(m=>state.revealed[m]=true);
  renderGrid();
  const cell=explodeIdx>=0?document.querySelectorAll('.cell')[explodeIdx]:null;
  if (cell) cell.classList.add('mine-explode');
  document.getElementById('msg').textContent='💥 BOOM! Game over!';
}

function checkWin() {
  const unrevealed=state.board.filter((_,i)=>!state.revealed[i]).length;
  if (unrevealed===state.mines) {
    clearInterval(state.timerInterval);
    state.won=true;
    if (!state.bestTimes[state.diff]||state.time<state.bestTimes[state.diff]) state.bestTimes[state.diff]=state.time;
    document.getElementById('msg').textContent='🎉 You won in '+state.time+'s!';
    if (!state.removeAds && window.Android) Android.showInterstitial();
  }
}

function updateInfo() {
  const flagCount=state.flagged.filter(Boolean).length;
  document.getElementById('info').textContent='💣 '+(state.mines-flagCount)+' | ⏱ '+state.time+'s';
}

function renderGrid() {
  const g=document.getElementById('grid');
  const cs=Math.min(36,Math.floor((window.innerWidth-24)/state.cols));
  g.style.gridTemplateColumns='repeat('+state.cols+', '+cs+'px)';
  g.innerHTML='';
  for (let i=0;i<state.rows*state.cols;i++) {
    const cell=document.createElement('div');
    cell.className='cell';
    cell.style.width=cs+'px'; cell.style.height=cs+'px';
    cell.style.fontSize=Math.max(10,cs-12)+'px';
    if (state.revealed[i]) {
      cell.classList.add('revealed');
      if (state.board[i]===-1) cell.textContent='💣';
      else if (state.board[i]>0) { cell.textContent=state.board[i]; cell.classList.add('n'+state.board[i]); }
    } else if (state.flagged[i]) {
      cell.classList.add('flagged');
      cell.textContent='🚩';
    } else {
      cell.classList.add('hidden');
    }
    // Touch events
    cell.addEventListener('click', ()=>tapCell(i));
    cell.addEventListener('contextmenu', e=>{e.preventDefault();toggleFlag(i);});
    // Long press for flag
    cell.addEventListener('pointerdown', ()=>{ longPressTimer=setTimeout(()=>toggleFlag(i),500); });
    cell.addEventListener('pointerup', ()=>clearTimeout(longPressTimer));
    cell.addEventListener('pointercancel', ()=>clearTimeout(longPressTimer));
    g.appendChild(cell);
  }
}

function removeAds() {
  if (window.Android) Android.purchaseRemoveAds();
  else { state.removeAds=true; document.getElementById('msg').textContent='Ads removed!'; }
}
window.onPurchaseComplete=function(){state.removeAds=true;};
window.onAdMobLoaded=function(){};

newGame();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spelling Bee</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #1a1700; color: #fff8e1; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
:root { --accent: #FDD835; --dark: #1a1700; }
header { background: #2a2200; padding: 12px 16px; text-align: center; border-bottom: 2px solid var(--accent); }
header h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 2px; }
.rank-row { display: flex; justify-content: center; gap: 6px; padding: 8px 16px; flex-wrap: wrap; }
.rank { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; background: #2a2200; color: #aaa; border: 1px solid #555; }
.rank.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
.score-row { text-align: center; font-size: 1.5rem; font-weight: 700; color: var(--accent); padding: 4px; }
.score-bar { height: 8px; background: #333; margin: 0 24px 8px; border-radius: 4px; overflow: hidden; }
.score-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s; }
.hive { display: flex; justify-content: center; padding: 16px 0 8px; }
.hive-svg { width: 240px; height: 220px; }
.hex { cursor: pointer; transition: all 0.1s; }
.hex polygon { fill: #2a2200; stroke: #555; stroke-width: 2; transition: fill 0.1s; }
.hex.center polygon { fill: var(--accent); }
.hex text { font-size: 22px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.hex.center text { fill: #000; }
.hex.btn-pressed polygon { fill: #5a4a00 !important; }
.input-area { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 16px; }
.word-input { font-size: 1.8rem; letter-spacing: 6px; color: #fff; text-transform: uppercase; min-height: 48px; text-align: center; }
.cursor { animation: blink 1s infinite; color: var(--accent); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.msg-row { text-align: center; font-size: 1rem; min-height: 26px; }
.msg-row.good { color: #66bb6a; }
.msg-row.bad { color: #ef5350; }
.msg-row.pangram { color: var(--accent); font-weight: 700; }
.btn-row { display: flex; gap: 8px; padding: 8px 16px; }
.btn { flex: 1; background: #2a2200; border: 2px solid var(--accent); color: var(--accent); border-radius: 24px; padding: 11px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.15s; }
.btn.submit { background: var(--accent); color: #000; }
.btn.btn-pressed { opacity: 0.6; transform: scale(0.95); }
.found-words { padding: 0 16px; flex: 1; overflow-y: auto; }
.found-words h3 { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.word-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: #2a2200; border: 1px solid #555; border-radius: 16px; padding: 4px 12px; font-size: 0.85rem; color: #fff8e1; }
.chip.pangram { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.puzzle-nav { display: flex; gap: 8px; padding: 4px 16px; }
.nav-btn { flex: 1; background: transparent; border: 1px solid #555; color: #aaa; border-radius: 20px; padding: 8px; font-size: 0.8rem; cursor: pointer; }
.nav-btn.btn-pressed { opacity: 0.6; }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:0.65rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:9999;letter-spacing:0.5px">Remove Ads</button>
<header><h1>SPELLING BEE</h1></header>
<div class="rank-row" id="rank-row"></div>
<div class="score-row"><span id="score">0</span> pts</div>
<div class="score-bar"><div class="score-fill" id="score-fill" style="width:0%"></div></div>

<div class="hive"><svg class="hive-svg" id="hive-svg"></svg></div>
<div class="input-area">
  <div class="word-input" id="word-input"><span class="cursor">|</span></div>
  <div class="msg-row" id="msg-row"></div>
</div>
<div class="btn-row">
  <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="delLetter()">⌫</button>
  <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="shuffleOuter()">Shuffle</button>
  <button class="btn submit" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="submitWord()">Enter</button>
</div>
<div class="puzzle-nav">
  <button class="nav-btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="prevPuzzle()">◀ Prev Puzzle</button>
  <button class="nav-btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="nextPuzzle()">Next Puzzle ▶</button>
</div>
<div class="found-words">
  <h3>Found: <span id="found-count">0</span></h3>
  <div class="word-chips" id="word-chips"></div>
</div>


<script>
// 10 preset puzzles: [center, outer6, wordlist]
const PUZZLES = [
  { center:'A', outer:['P','L','N','T','E','D'], words:["plan","plate","planet","plane","panel","pale","tale","data","land","petal","dental","planed","ladle","leapt","leaned","pentad","pedant","planted","plated","penal","platen","patella","padlet","pedal","laden","elated","delta","antal","antlap","plate","natal","adplane","talend"] },
  { center:'E', outer:['R','S','T','A','N','G'], words:["grant","range","strange","gents","gates","anger","earns","tears","stare","rents","stern","terns","grants","rages","saner","neater","easter","garter","garnet","ranger","stoner","stores","starter","garners","toners","greens","greats","snare","saner","grans","gents","eaters","stager","negates","negater"] },
  { center:'I', outer:['N','G','H','T','S','L'], words:["night","light","sight","thing","sting","tiling","nightly","lights","nights","sling","glist","tings","lings","hints","glint","glints","tilting","stingl","linting","tinsil","sitting","listing","hitting","nits","snit","gilt","gilts","silt","silts","thin","shin","this"] },
  { center:'O', outer:['P','R','U','D','C','E'], words:["cord","pore","pure","code","drop","euro","cope","pour","roped","coped","prude","crude","depot","repro","drupe","coupe","couped","croup","decor","proud","poured","cured","lured","luroped","credop","report","recode","europe","crouped","precode","couper"] },
  { center:'U', outer:['M','S','T','R','E','H'], words:["muse","must","rest","rush","then","true","hush","shum","them","mesh","huts","hurt","thus","shred","terms","herts","stuff","smut","thrum","humus","usher","rumest","hermit","truest","mustier","smother","thrums","meshed"] },
  { center:'Y', outer:['B','L','A','C','K','E'], words:["back","black","lake","yell","yack","belly","lace","bake","cable","label","lackey","black","blacky","bleakly","cleaky","becky","brace","cable","yelp","cellar","bley","balky","belay","yack","ably","blake","cycle","belly","cyclist","becalm"] },
  { center:'W', outer:['O','R','D','S','E','T'], words:["word","wore","sort","rest","wrest","words","wrote","worst","tower","rowst","towed","rowed","sword","stead","trews","worst","trows","strew","owers","resow","rowset","towers","stowed","trowed","rowdest","tordes","stored","dorest","worted","rested"] },
  { center:'F', outer:['L','A','K','E','S','H'], words:["lake","fake","shake","flask","flash","flake","leash","flesh","shale","flame","flakes","flakes","slake","hazel","fakes","flags","flesh","shelf","flaks","ashes","flashes","shakes","flakes","feaks","flesh","fakes"] },
  { center:'M', outer:['A','P','L','E','S','T'], words:["maple","stamp","steam","plate","tales","meals","teams","ample","temps","mates","palms","lamps","metal","plasm","petals","medals","lamest","temples","planets","tamples","staple","sampled","mallets","meatal","laptops","sample","males","tales","stale","mates","steam"] },
  { center:'C', outer:['H','A','R','E','S','T'], words:["heart","chart","stare","hatch","catch","chest","trace","crash","tears","earth","reach","crate","chaste","search","thrace","haters","charts","starche","arches","chatters","starch","rachet","teacher","cheater","teachers","charets","treache","scarlet","chatters"] }
];

const RANKS = ['Beginner','Good','Nice','Great','Amazing','Genius'];
const RANK_THRESHOLDS = [0, 0.1, 0.2, 0.4, 0.6, 0.8]; // fraction of max score

let currentPuzzle = 0, currentLetters = [], centerLetter = '', typed = '', foundWords = new Set(), score = 0;

function loadPuzzle(idx) {
  currentPuzzle = (idx + PUZZLES.length) % PUZZLES.length;
  const p = PUZZLES[currentPuzzle];
  centerLetter = p.center;
  currentLetters = [...p.outer];
  typed = ''; foundWords = new Set(); score = 0;
  renderHive();
  renderInput();
  renderFound();
  updateScore();
}

function hexPath(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
}

function renderHive() {
  const svg = document.getElementById('hive-svg');
  svg.innerHTML = '';
  const R = 38;
  // Center + 6 outer positions
  const positions = [
    [120, 110], // center
    [120, 35],  // top
    [185, 72],  // top-right
    [185, 148], // bottom-right
    [120, 185], // bottom
    [55, 148],  // bottom-left
    [55, 72],   // top-left
  ];
  const letters = [centerLetter, ...currentLetters];
  positions.forEach(([cx, cy], i) => {
    const g = document.createElement('g'); // SVG doesn't use createElement, use createElementNS
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.classList.add('hex');
    if (i === 0) group.classList.add('center');

    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', hexPath(cx, cy, R));

    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', cx);
    txt.setAttribute('y', cy);
    txt.textContent = letters[i];

    group.appendChild(poly);
    group.appendChild(txt);

    const letter = letters[i];
    group.addEventListener('touchstart', e => { e.preventDefault(); group.classList.add('btn-pressed'); addLetter(letter); });
    group.addEventListener('touchend', () => group.classList.remove('btn-pressed'));
    group.addEventListener('click', () => addLetter(letter));

    svg.appendChild(group);
  });
}

function addLetter(l) {
  typed += l;
  renderInput();
}

function delLetter() {
  if (typed.length > 0) { typed = typed.slice(0, -1); renderInput(); }
}

function shuffleOuter() {
  for (let i = currentLetters.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentLetters[i], currentLetters[j]] = [currentLetters[j], currentLetters[i]];
  }
  renderHive();
}

function renderInput() {
  const el = document.getElementById('word-input');
  el.innerHTML = typed.split('').map((l, i) => {
    const color = l === centerLetter ? 'color:var(--accent)' : 'color:#fff';
    return `<span style="${color}">${l}</span>`;
  }).join('') + '<span class="cursor">|</span>';
}

function submitWord() {
  const word = typed.toLowerCase();
  const msg = document.getElementById('msg-row');
  if (word.length < 4) { showMsg('Too short!', 'bad'); return; }
  if (!word.includes(centerLetter.toLowerCase())) { showMsg('Must use center letter!', 'bad'); return; }
  if (foundWords.has(word)) { showMsg('Already found!', 'bad'); return; }
  // Check letters are valid
  const validLetters = new Set([centerLetter.toLowerCase(), ...currentLetters.map(l => l.toLowerCase())]);
  if ([...word].some(c => !validLetters.has(c))) { showMsg('Invalid letters!', 'bad'); return; }
  // Check against word list
  const p = PUZZLES[currentPuzzle];
  const allLetters = [centerLetter, ...p.outer].map(l => l.toLowerCase());
  const isPangram = new Set(word.split('')).size >= 7 || new Set(word).size >= allLetters.length;

  // Accept if in puzzle's word list OR if it passes all validity checks (for user delight)
  const inList = p.words.some(w => w.toLowerCase() === word);
  if (!inList) { showMsg('Not in word list!', 'bad'); return; }

  foundWords.add(word);
  const pts = word.length === 4 ? 1 : word.length + (isPangram ? 7 : 0);
  score += pts;
  updateScore();
  renderFound();
  typed = '';
  renderInput();
  if (isPangram) showMsg('PANGRAM! ✨ +' + pts, 'pangram');
  else showMsg('Nice! +' + pts, 'good');
}

function showMsg(text, cls) {
  const msg = document.getElementById('msg-row');
  msg.textContent = text;
  msg.className = 'msg-row ' + cls;
  clearTimeout(msg._t);
  msg._t = setTimeout(() => { msg.textContent = ''; msg.className = 'msg-row'; }, 1500);
}

function updateScore() {
  document.getElementById('score').textContent = score;
  const maxScore = PUZZLES[currentPuzzle].words.reduce((s, w) => s + (w.length === 4 ? 1 : w.length), 0);
  const pct = maxScore ? Math.min(score / maxScore, 1) : 0;
  document.getElementById('score-fill').style.width = (pct * 100) + '%';
  const rankIdx = RANK_THRESHOLDS.reduce((best, t, i) => pct >= t ? i : best, 0);
  const rankRow = document.getElementById('rank-row');
  rankRow.innerHTML = '';
  RANKS.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'rank' + (i === rankIdx ? ' active' : '');
    el.textContent = r;
    rankRow.appendChild(el);
  });
}

function renderFound() {
  document.getElementById('found-count').textContent = foundWords.size;
  const chips = document.getElementById('word-chips');
  chips.innerHTML = '';
  const p = PUZZLES[currentPuzzle];
  const allLetters = [centerLetter, ...p.outer].map(l => l.toLowerCase());
  [...foundWords].sort().forEach(w => {
    const isPangram = new Set(w.split('')).size >= allLetters.length;
    const chip = document.createElement('div');
    chip.className = 'chip' + (isPangram ? ' pangram' : '');
    chip.textContent = w.toUpperCase();
    chips.appendChild(chip);
  });
}

function nextPuzzle() { loadPuzzle(currentPuzzle + 1); }
function prevPuzzle() { loadPuzzle(currentPuzzle - 1); }

loadPuzzle(0);
window.onPurchaseComplete = function(sku) { console.log('Purchase:', sku); };

// ── AppLovin MAX / IAP bridge ──────────────────────────────────────────
var _adsRemoved = false;
var _interstitialCount = 0;

function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};

// Restore remove-ads state on load
if (window.Android) {
  try { if (Android.isPurchased && Android.isPurchased('remove_ads')) {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
  }} catch(e) {}
}

</script>
</body>
</html>

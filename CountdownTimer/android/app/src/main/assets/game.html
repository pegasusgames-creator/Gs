<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Countdown Timer</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#E91E63; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
/* Active countdown display */
#active-display { text-align:center; padding:20px 10px; }
#active-name { font-size:1rem; color:var(--muted); margin-bottom:10px; font-weight:600; letter-spacing:1px; }
.countdown-grid { display:flex; justify-content:center; gap:12px; margin-bottom:10px; }
.cg-unit { display:flex; flex-direction:column; align-items:center; min-width:60px; }
.cg-val { font-size:2.4rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; background:var(--card); border-radius:10px; padding:6px 10px; min-width:64px; text-align:center; }
.cg-lbl { font-size:0.65rem; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:1px; }
.cg-sep { font-size:2rem; font-weight:700; color:var(--muted); align-self:center; margin-top:-6px; }
#active-passed { color:var(--muted); font-size:0.9rem; font-style:italic; }
/* Add form */
.form-row { display:flex; gap:8px; margin-bottom:8px; }
.form-row input[type=text] { flex:1; padding:9px 12px; border-radius:10px; border:none; background:var(--card); color:var(--text); font-size:0.9rem; }
.form-row input[type=datetime-local] { flex:1; padding:9px 10px; border-radius:10px; border:none; background:var(--card); color:var(--text); font-size:0.85rem; }
.btn-primary { background:var(--accent); border:none; border-radius:10px; color:#fff; font-size:0.95rem; font-weight:700; padding:11px; cursor:pointer; width:100%; }
/* Saved list */
.saved-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--card); border-radius:10px; margin-bottom:7px; cursor:pointer; }
.saved-item.selected { border:2px solid var(--accent); }
.si-left { flex:1; }
.si-name { font-size:0.9rem; font-weight:600; }
.si-date { font-size:0.72rem; color:var(--muted); margin-top:2px; }
.si-del { background:none; border:none; color:#E91E63; font-size:1rem; cursor:pointer; padding:0 4px; }
.empty-msg { text-align:center; color:var(--muted); padding:16px 0; font-size:0.85rem; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Countdown <span>Timer</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div id="active-display">
        <div id="active-name">Select an event below</div>
        <div class="countdown-grid">
          <div class="cg-unit"><div class="cg-val" id="cd-d">--</div><div class="cg-lbl">Days</div></div>
          <div class="cg-sep">:</div>
          <div class="cg-unit"><div class="cg-val" id="cd-h">--</div><div class="cg-lbl">Hours</div></div>
          <div class="cg-sep">:</div>
          <div class="cg-unit"><div class="cg-val" id="cd-m">--</div><div class="cg-lbl">Mins</div></div>
          <div class="cg-sep">:</div>
          <div class="cg-unit"><div class="cg-val" id="cd-s">--</div><div class="cg-lbl">Secs</div></div>
        </div>
        <div id="active-passed"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Add Countdown (max 5)</div>
      <div class="form-row"><input type="text" id="ename" placeholder="Event name…" maxlength="30"></div>
      <div class="form-row"><input type="datetime-local" id="edate"></div>
      <button class="btn-primary" onclick="addEvent()">Add Countdown</button>
    </div>
    <div class="card">
      <div class="card-title">Saved Countdowns</div>
      <div id="saved-list"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, events:[], selectedId:null };
var STORE_KEY='countdown_events';

function load() {
  try { state.events=JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); } catch(e){state.events=[];}
  if(state.events.length>0) state.selectedId=state.events[0].id;
}
function save() { localStorage.setItem(STORE_KEY,JSON.stringify(state.events)); }

function p2(n){return String(n).padStart(2,'0');}

function addEvent() {
  if(state.events.length>=5){alert('Maximum 5 countdowns');return;}
  var name=document.getElementById('ename').value.trim();
  var dt=document.getElementById('edate').value;
  if(!name){alert('Enter event name');return;}
  if(!dt){alert('Pick a date and time');return;}
  var ts=new Date(dt).getTime();
  if(isNaN(ts)){alert('Invalid date');return;}
  var id=Date.now();
  state.events.push({id:id,name:name,ts:ts});
  state.selectedId=id;
  save();
  document.getElementById('ename').value='';
  document.getElementById('edate').value='';
  renderList();
  maybeInterstitial();
}

function removeEvent(id) {
  state.events=state.events.filter(function(e){return e.id!==id;});
  if(state.selectedId===id) state.selectedId=state.events.length?state.events[0].id:null;
  save();
  renderList();
}

function selectEvent(id) {
  state.selectedId=id;
  renderList();
}

function renderList() {
  var el=document.getElementById('saved-list');
  if(!state.events.length){el.innerHTML='<div class="empty-msg">No countdowns yet.</div>';return;}
  el.innerHTML=state.events.map(function(e){
    var d=new Date(e.ts);
    var ds=d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return '<div class="saved-item'+(state.selectedId===e.id?' selected':'')+'" onclick="selectEvent('+e.id+')">'+
      '<div class="si-left"><div class="si-name">'+esc(e.name)+'</div><div class="si-date">'+ds+'</div></div>'+
      '<button class="si-del" onclick="event.stopPropagation();removeEvent('+e.id+')">&#10005;</button></div>';
  }).join('');
}

function updateDisplay() {
  var ev=state.events.find(function(e){return e.id===state.selectedId;});
  if(!ev){
    document.getElementById('active-name').textContent='Select an event below';
    ['d','h','m','s'].forEach(function(k){document.getElementById('cd-'+k).textContent='--';});
    document.getElementById('active-passed').textContent='';
    return;
  }
  document.getElementById('active-name').textContent=ev.name;
  var diff=ev.ts-Date.now();
  var passed=diff<0;
  document.getElementById('active-passed').textContent=passed?'This event has passed':'';
  if(passed)diff=0;
  var tot=Math.floor(diff/1000);
  var d=Math.floor(tot/86400);
  var h=Math.floor((tot%86400)/3600);
  var m=Math.floor((tot%3600)/60);
  var s=tot%60;
  document.getElementById('cd-d').textContent=p2(d);
  document.getElementById('cd-h').textContent=p2(h);
  document.getElementById('cd-m').textContent=p2(m);
  document.getElementById('cd-s').textContent=p2(s);
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Set default datetime to tomorrow
(function(){
  var d=new Date(Date.now()+86400000);
  d.setSeconds(0,0);
  var s=d.toISOString().slice(0,16);
  document.getElementById('edate').value=s;
})();

load();
renderList();
setInterval(updateDisplay,500);
updateDisplay();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

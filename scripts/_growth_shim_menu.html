<!-- Growth shim — Menu (2026-05-27 consolidation). Idempotent: data-growth-shim="MENU".
     ONE menu-render owner. No competing shims. No setInterval injectors.
     See CLAUDE.md "No competing runtime shims".

     This shim is the single source of truth for the menu UI:
       Tier 1 — Continue/Play (label patched from save state)
       Tier 2 — Daily Challenge with streak baked in (🔥 N)
       Tier 3 — icon row (unchanged static markup)
       Top bar (in-flow flex, no absolute positioning):
         [❤ lives] [🪙 coins]  →flex spacer→  [🪙 free-coins +25] [🏆 ranks] [⚙ settings]
       Below Tier 2: ONE row of clearly-labeled chips
         🛡 Streak Shield ×N    🎁 Claim Day N · +XX 🪙   (or hidden when claimed)

     Suppression: legacy banner widgets that fight the menu hierarchy
     (xPassPromo, xFreeCoinsBtn, weeklyEventBanner, xThemeStrip) are
     hidden on the menu and the theme strip is permanently re-parented
     to the Themes screen on first sight.

     Triggers: this render runs on showScreen('menuScreen'),
     visibility-change, and once at startup. No 1.5-second polling.
-->
<script data-growth-shim="MENU">
(function(){
  if (window.__growthShimMenu) return;
  window.__growthShimMenu = true;

  var LS = window.localStorage;
  function lsGet(k, d){ try { var v=LS.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function lsSet(k, v){ try { LS.setItem(k, v); } catch(e){} }
  function safe(fn){ try { return fn(); } catch(e){} }
  function $(id){ return document.getElementById(id); }
  function api(name){ return !!(window.Android) && typeof window.Android[name]==='function'; }

  // ── Layout polish: enlarge Tier-1/2/3, tighten gaps, narrow-viewport guard.
  (function injectMenuCss(){
    if ($('menu-shim-css')) return;
    var st = document.createElement('style');
    st.id = 'menu-shim-css';
    st.textContent =
      // Tier-1 Play / Continue — fills the canvas.
      '#menuScreen .btn-primary, #menuScreen .menu-primary, #menuScreen .menu-tile-primary, #menuScreen #menuPlayBtn,'+
      '#screen-menu .btn-primary, #screen-menu .menu-primary, #screen-menu .menu-tile-primary, #screen-menu #menuPlayBtn{'+
        'min-height:64px !important;font-size:1.18rem !important;'+
        'padding:18px 22px !important;margin:10px 16px !important;'+
        'border-radius:18px !important;'+
      '}'+
      // Tier-2 Daily — generous tap area.
      '#menuScreen #dailyChallengeBtn, #menuScreen #dailyBtn, #menuScreen [onclick*="DailyChallenge"], #menuScreen [onclick*="startDailyChallenge"],'+
      '#screen-menu #dailyChallengeBtn, #screen-menu #dailyBtn, #screen-menu [onclick*="DailyChallenge"], #screen-menu [onclick*="startDailyChallenge"]{'+
        'min-height:54px !important;font-size:1.02rem !important;'+
        'padding:14px 18px !important;margin:6px 16px !important;'+
        'border-radius:14px !important;'+
      '}'+
      // Tier-3 icon row — 84px tiles.
      '#menuScreen .menu-icon-row, #screen-menu .menu-icon-row,'+
      '#menuScreen .menu-pair-row, #screen-menu .menu-pair-row,'+
      '#menuScreen .menu-tile-row, #screen-menu .menu-tile-row{'+
        'gap:10px !important;margin-top:14px !important;padding:0 16px !important;'+
      '}'+
      '#menuScreen .menu-icon-btn, #screen-menu .menu-icon-btn,'+
      '#menuScreen .menu-tile-pair, #screen-menu .menu-tile-pair,'+
      '#menuScreen .menu-pair, #screen-menu .menu-pair{'+
        'min-height:84px !important;border-radius:18px !important;'+
        'padding:12px 8px !important;'+
      '}'+
      '#menuScreen .menu-buttons, #screen-menu .menu-buttons{ gap:8px !important; }'+
      // Top-bar icons — never absolute, always in-flow flex.
      '[data-menu-icons]{display:flex !important;align-items:center !important;gap:6px !important;margin-left:auto !important;}'+
      '[data-menu-icons] button{position:static !important;}'+
      // Narrow-viewport guard for the top-bar icons.
      '@media (max-width: 380px){'+
        '[data-menu-icons] button{width:32px !important;height:32px !important;font-size:15px !important;}'+
        '[data-menu-icons]{gap:4px !important;}'+
        '#menuScreen .menu-header .lives-text, #screen-menu .menu-header .lives-text, [data-lives-label]{display:none;}'+
      '}'+
      '@media (max-width: 330px){'+
        '[data-menu-icons] button{width:28px !important;height:28px !important;font-size:13px !important;}'+
        '#menuScreen .menu-header, #screen-menu .menu-header{padding-left:6px !important;padding-right:6px !important;}'+
      '}'+
      // Streak-chip row (rendered inline above icon row).
      '[data-menu-chips]{display:flex !important;justify-content:center !important;flex-wrap:wrap !important;'+
        'gap:8px !important;margin:8px 16px 4px !important;font-size:12px !important;font-weight:700 !important;'+
        'font-family:inherit !important;}'+
      '[data-menu-chip]{padding:7px 12px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid rgba(120,120,160,0.25);background:rgba(120,120,160,0.10);}'+
      '[data-menu-chip][data-tone="shield"]{background:rgba(96,148,212,0.10);border-color:rgba(96,148,212,0.32);color:#3b6db8;}'+
      '[data-menu-chip][data-tone="claim"]{background:rgba(201,127,0,0.10);border-color:rgba(201,127,0,0.32);color:#c97f00;}'+
      '[data-menu-chip][data-tone="done"]{background:rgba(46,160,67,0.10);border-color:rgba(46,160,67,0.32);color:#2ea043;}';
    (document.head || document.documentElement).appendChild(st);
  })();

  // ── Per-app menu container ID isn't uniform: Nonogram uses `screen-menu`,
  // others use `menuScreen`. Resolve once + cache.
  function menuEl(){
    return $('menuScreen') || $('screen-menu') || document.querySelector('[id*="menu" i].screen.active');
  }
  function onMenu(){
    var m = menuEl();
    return !!(m && m.classList.contains('active'));
  }
  function tier1Btn(){
    var m = menuEl(); if (!m) return null;
    return m.querySelector('#menuPlayBtn, .btn-primary, .menu-primary, .menu-tile-primary, .btn-play');
  }
  function tier2Btn(){
    var m = menuEl(); if (!m) return null;
    return $('dailyChallengeBtn') || $('dailyBtn') ||
           m.querySelector('[onclick*="DailyChallenge"], [onclick*="startDailyChallenge"], [onclick*="dailyChallenge"]');
  }
  function readSave(){
    var keys = ['save','state','gameState','progress','State'];
    for (var i=0;i<keys.length;i++){
      var raw = lsGet(keys[i], null);
      if (!raw) continue;
      try { return JSON.parse(raw); } catch(e){}
    }
    if (window.State && typeof window.State === 'object') return window.State;
    return {};
  }
  function getStreak(){
    var s = readSave();
    return s.dailyChallengeStreak || s.loginStreak || s.streak || 0;
  }
  function hasResumableProgress(){
    var s = readSave();
    if (s.lastLevelProgress) return true;
    if (s.boardState || s.gameBoard) {
      var go = s.gameOver === true || s.isGameOver === true;
      if (!go) return true;
    }
    return false;
  }
  function progressLabel(){
    var s = readSave();
    var t = (document.title||'').toLowerCase();
    if (t.indexOf('2048') >= 0) {
      var sc = s.score || s.currentScore || 0;
      return 'Continue · ' + sc;
    }
    var n = (s.lastLevelProgress && s.lastLevelProgress.level)
         || s.currentLevel
         || (Array.isArray(s.completedLevels) ? s.completedLevels.length + 1 : 1);
    return 'Continue · Level ' + n;
  }

  // ── Suppress on menu: hide legacy widgets that the menu shouldn't show.
  // The audit-addendum init can stamp these before any wrap takes effect,
  // so we permanently hide them when their parent is the menu.
  function hideLegacyOnMenu(){
    var menu = menuEl(); if (!menu) return;
    ['xPassPromo','xFreeCoinsBtn','weeklyEventBanner','xSeasonPassPromo','xWeeklyPassPromo']
      .forEach(function(id){
        var el = $(id);
        if (el && menu.contains(el)) el.style.display = 'none';
      });
  }

  // Wrap the inject* functions so future calls also keep the suppression
  // (some apps refresh them on showScreen).
  var SUPPRESSED = [
    'injectFreeCoins','injectFreeCoinsBtn',
    'injectThemeStrip','injectPassPromo',
    'updateTournamentBanner'
  ];
  function wrapInject(fnName){
    if (typeof window[fnName] !== 'function') return;
    if (window[fnName].__menuWrapped) return;
    var orig = window[fnName];
    window[fnName] = function(){
      var r = orig.apply(this, arguments);
      hideLegacyOnMenu();
      return r;
    };
    window[fnName].__menuWrapped = true;
  }

  // ── Theme strip: permanently re-parent to the Themes screen on first sight.
  var THEMES_HOSTS = ['themesScreen','themeScreen','screen-themes','xThemesScreen'];
  function relocateThemeStripPermanent(){
    var strip = $('xThemeStrip') || $('xThemeStrip2048');
    if (!strip) return;
    if (strip.getAttribute('data-relocated') === '1') return;
    var target = null;
    for (var i=0;i<THEMES_HOSTS.length;i++){
      var el = $(THEMES_HOSTS[i]);
      if (el) { target = el; break; }
    }
    if (!target) return; // Themes screen doesn't exist yet; try again later.
    strip.style.display = '';
    target.insertBefore(strip, target.firstChild);
    strip.setAttribute('data-relocated','1');
  }

  // ── Top-bar icons (in-flow, no absolute positioning).
  var FREE_COINS_AMOUNT = 25, FREE_COINS_COOLDOWN_MS = 4*60*60*1000;
  function freeCoinsReadyAt(){
    var t = parseInt(lsGet('lastFreeCoinsAt','0'),10);
    return t ? t + FREE_COINS_COOLDOWN_MS : 0;
  }
  function fmtCountdown(ms){
    if (ms <= 0) return '';
    var s = Math.ceil(ms/1000);
    var h = Math.floor(s/3600); s %= 3600;
    var m = Math.floor(s/60);
    return (h>0?h+'h ':'')+m+'m';
  }
  function ensureMenuHeader(){
    var menu = menuEl(); if (!menu) return null;
    var existing = menu.querySelector('.menu-header');
    if (existing) return existing;
    var syn = menu.querySelector('[data-synth-menu-header]');
    if (syn) return syn;
    syn = document.createElement('div');
    syn.setAttribute('data-synth-menu-header','1');
    syn.style.cssText =
      // In-flow row at the top of the menu container — no position:absolute.
      'display:flex;align-items:center;justify-content:flex-end;padding:8px 12px 0;';
    if (menu.firstChild) menu.insertBefore(syn, menu.firstChild);
    else menu.appendChild(syn);
    return syn;
  }
  function ensureTopBarIcons(){
    var header = ensureMenuHeader();
    if (!header) return;
    if (header.querySelector('[data-menu-icons]')) return;
    var wrap = document.createElement('div');
    wrap.setAttribute('data-menu-icons','1');
    wrap.innerHTML =
      // Free Coins
      '<button data-menu-icon="freecoins" aria-label="Free coins" ' +
      'style="position:relative;background:rgba(255,215,100,0.14);border:1px solid rgba(255,215,100,0.36);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1;padding:0;font-family:inherit;">' +
        '🪙' +
        '<span data-menu-icon-badge="freecoins" style="position:absolute;top:-4px;right:-4px;background:#2ea043;color:#fff;border-radius:9px;padding:0 5px;font-size:9px;font-weight:800;display:none;">+' + FREE_COINS_AMOUNT + '</span>' +
      '</button>' +
      // Ranks (tournament + leaderboard merged)
      '<button data-menu-icon="ranks" aria-label="Ranks" ' +
      'style="background:rgba(120,170,255,0.14);border:1px solid rgba(120,170,255,0.36);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;line-height:1;padding:0;font-family:inherit;">🏆</button>';
    header.appendChild(wrap);

    wrap.querySelector('[data-menu-icon="freecoins"]').addEventListener('click', onFreeCoinsClick);
    wrap.querySelector('[data-menu-icon="ranks"]').addEventListener('click', openRanksSheet);
  }
  function refreshTopBarIconState(){
    var fc = document.querySelector('[data-menu-icon="freecoins"]');
    if (!fc) return;
    var badge = document.querySelector('[data-menu-icon-badge="freecoins"]');
    var rem = freeCoinsReadyAt() - Date.now();
    if (rem > 0) {
      fc.style.opacity = '0.5';
      fc.title = 'Free coins in ' + fmtCountdown(rem);
      if (badge) badge.style.display = 'none';
    } else {
      fc.style.opacity = '1';
      fc.title = 'Claim ' + FREE_COINS_AMOUNT + ' free coins';
      if (badge) badge.style.display = 'inline-block';
    }
  }
  function onFreeCoinsClick(){
    if (typeof window.claimFreeCoins === 'function') { safe(function(){ window.claimFreeCoins(); }); return; }
    if (typeof window.xClaimFreeCoins === 'function') { safe(function(){ window.xClaimFreeCoins(); }); return; }
    if (typeof window.showRewardedAd === 'function') {
      safe(function(){ window.showRewardedAd('free_coins', function(){
        try { lsSet('lastFreeCoinsAt', String(Date.now())); } catch(e){}
        if (window.State && typeof window.State.save === 'function') safe(function(){ window.State.save(); });
      }); });
    }
  }

  // ── Unified Ranks sheet — two tabs: This Week (bracket) + Leaderboard (PGS).
  function openRanksSheet(){
    var sheet = $('xRanksSheet');
    if (!sheet){
      sheet = document.createElement('div');
      sheet.id = 'xRanksSheet';
      sheet.setAttribute('role','dialog');
      sheet.style.cssText =
        'position:fixed;inset:0;background:rgba(0,0,0,0.62);' +
        'display:flex;align-items:flex-end;justify-content:center;' +
        'z-index: var(--z-modal, 700);font-family:inherit;';
      sheet.innerHTML =
        '<div style="background:var(--bg, #161b22);color:var(--text, #e6edf3);'+
        'border-top-left-radius:18px;border-top-right-radius:18px;'+
        'width:100%;max-width:480px;padding:18px;box-shadow:0 -8px 32px rgba(0,0,0,0.32);">'+
          '<div style="display:flex;gap:10px;margin-bottom:14px;border-bottom:1px solid rgba(127,127,127,0.25);">'+
            '<button data-ranks-tab="week" style="flex:1;background:transparent;border:none;border-bottom:3px solid #c97f00;color:inherit;padding:10px 0;font-weight:800;font-size:0.95rem;cursor:pointer;font-family:inherit;">This Week</button>'+
            '<button data-ranks-tab="lb"   style="flex:1;background:transparent;border:none;border-bottom:3px solid transparent;color:inherit;padding:10px 0;font-weight:700;font-size:0.95rem;cursor:pointer;opacity:0.7;font-family:inherit;">Leaderboard</button>'+
          '</div>'+
          '<div data-ranks-body style="min-height:120px;font-size:0.92rem;line-height:1.5;"></div>'+
          '<button data-ranks-close style="display:block;width:100%;margin-top:14px;background:transparent;color:inherit;border:1px solid rgba(127,127,127,0.4);border-radius:12px;padding:10px;font-weight:600;cursor:pointer;font-family:inherit;opacity:0.85;">Close</button>'+
        '</div>';
      document.body.appendChild(sheet);
      sheet.querySelector('[data-ranks-close]').addEventListener('click', function(){
        sheet.style.display = 'none';
      });
      sheet.addEventListener('click', function(e){
        if (e.target === sheet) sheet.style.display = 'none';
      });
      sheet.querySelectorAll('[data-ranks-tab]').forEach(function(b){
        b.addEventListener('click', function(){ switchRanksTab(b.getAttribute('data-ranks-tab')); });
      });
    }
    sheet.style.display = 'flex';
    switchRanksTab('week');
  }
  function switchRanksTab(tab){
    var sheet = $('xRanksSheet'); if (!sheet) return;
    sheet.querySelectorAll('[data-ranks-tab]').forEach(function(b){
      var active = b.getAttribute('data-ranks-tab') === tab;
      b.style.borderBottomColor = active ? '#c97f00' : 'transparent';
      b.style.opacity = active ? '1' : '0.7';
      b.style.fontWeight = active ? '800' : '700';
    });
    var body = sheet.querySelector('[data-ranks-body]');
    if (tab === 'week') body.innerHTML = renderWeekTab();
    else                body.innerHTML = renderLeaderboardTab();
    // Wire leaderboard CTA if rendered.
    var openBtn = body.querySelector('[data-open-lb]');
    if (openBtn) openBtn.addEventListener('click', openPGSLeaderboard);
  }
  function renderWeekTab(){
    // Pull the synthetic weekly-bracket text from updateTournamentBanner's
    // existing target element (every app injects a weeklyEventBanner div).
    var b = $('weeklyEventBanner');
    var txt = b && b.textContent ? b.textContent.trim() : '';
    if (!txt) {
      // Compute a basic line from current best level / score.
      var s = readSave();
      var best = s.currentLevel || s.bestScore || s.score || 1;
      txt = '🏆 Best this week · ' + best + '\nResets Monday — beat your best to earn coins.';
    }
    return '<div style="white-space:pre-line;padding:6px 4px;opacity:0.95;">' + txt + '</div>';
  }
  function renderLeaderboardTab(){
    if (api('showLeaderboard')) {
      return '<div style="padding:6px 4px;">'+
        'Open the Google Play Games leaderboard for your highest score / level.'+
        '</div>'+
        '<button data-open-lb style="display:block;width:100%;margin-top:10px;background:linear-gradient(135deg,#f5c84b,#b88224);color:#221a06;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;font-family:inherit;">🏅 Open Play Games</button>';
    }
    return '<div style="padding:6px 4px;opacity:0.85;">'+
      'Play Games leaderboards aren’t available right now. Try again after a Google Play update.'+
      '</div>';
  }
  function openPGSLeaderboard(){
    if (!api('showLeaderboard')) return;
    if (api('signInPlayGames')) safe(function(){ Android.signInPlayGames(); });
    var id = window._GROWTH_LEADERBOARD_ID || 'TODO_FROM_PLAY_CONSOLE';
    safe(function(){ Android.showLeaderboard(id); });
  }

  // ── Streak chips (consolidated from shim D).
  function ensureChipRow(){
    var menu = menuEl(); if (!menu) return null;
    var existing = menu.querySelector('[data-menu-chips]');
    if (existing) return existing;
    var anchor =
      menu.querySelector('.menu-icon-row') ||
      menu.querySelector('.menu-pair-row') ||
      menu.querySelector('.menu-tile-row') ||
      menu.querySelector('.menu-buttons') ||
      null;
    var row = document.createElement('div');
    row.setAttribute('data-menu-chips','1');
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(row, anchor);
    else menu.appendChild(row);
    return row;
  }
  function renderChips(){
    var row = ensureChipRow(); if (!row) return;
    var D = window._growthD;
    if (!D) { row.innerHTML = ''; return; }
    var streak = D.readStreak();
    var freezes = D.getFreezes();
    var nm = D.nextMilestone(streak);
    var todayClaimedKey = '_growthChipClaimedDay';
    var todayStr = new Date().toISOString().slice(0,10);
    var claimedToday = lsGet(todayClaimedKey, '') === todayStr;
    var html = '';

    // Streak Shield chip — labeled, clear.
    html += '<div data-menu-chip data-tone="shield" data-chip-id="shield" title="Streak shields restore your daily streak after one missed day.">'+
              '🛡 Streak Shield ×<span data-chip-shield-count>' + freezes + '</span>'+
            '</div>';

    // Claim today's login reward — only if unclaimed.
    if (!claimedToday && nm) {
      html += '<div data-menu-chip data-tone="claim" data-chip-id="claim" title="Claim today’s daily login reward.">'+
                '🎁 Claim Day ' + nm.day + ' · ' + nm.reward +
              '</div>';
    } else if (claimedToday && nm) {
      html += '<div data-menu-chip data-tone="done" data-chip-id="next" title="Tomorrow’s reward.">'+
                '🔥 Tomorrow: ' + nm.reward +
              '</div>';
    } else if (!nm) {
      html += '<div data-menu-chip data-tone="done">🏆 All ladder rewards earned</div>';
    }
    row.innerHTML = html;

    // Wire chip clicks.
    var shield = row.querySelector('[data-chip-id="shield"]');
    if (shield) shield.addEventListener('click', function(){ openShieldOverlay(streak, freezes); });
    var claim = row.querySelector('[data-chip-id="claim"]');
    if (claim) claim.addEventListener('click', function(){
      claimLoginReward(nm);
      lsSet(todayClaimedKey, todayStr);
      renderChips();
    });
  }
  function openShieldOverlay(streak, freezes){
    var ov = $('xShieldOverlay');
    if (!ov){
      ov = document.createElement('div');
      ov.id = 'xShieldOverlay';
      ov.style.cssText =
        'position:fixed;inset:0;background:rgba(0,0,0,0.62);display:flex;'+
        'align-items:center;justify-content:center;z-index: var(--z-modal, 700);font-family:inherit;';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(e){ if (e.target===ov) ov.style.display='none'; });
    }
    var save = window._growthD && window._growthD.readSave();
    var coins = (save && typeof save.obj.coins === 'number') ? save.obj.coins : 0;
    var canBuy = coins >= 200;
    ov.innerHTML =
      '<div style="background:var(--bg,#161b22);color:var(--text,#e6edf3);border-radius:18px;padding:22px;max-width:340px;width:92%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.5);">'+
        '<div style="font-size:1.1rem;font-weight:800;margin-bottom:6px;">🛡 Streak Shield</div>'+
        '<div style="font-size:0.9rem;opacity:0.85;margin-bottom:14px;">Keeps your streak alive if you miss one day. You have <b>' + freezes + '</b>.</div>'+
        '<button id="xShieldBuyBtn" '+ (canBuy?'':'disabled') +' style="display:block;width:100%;background:'+ (canBuy?'linear-gradient(135deg,#6094d4,#3b6db8)':'rgba(127,127,127,0.25)') +';color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:'+ (canBuy?'pointer':'not-allowed') +';margin-bottom:8px;">'+
          (canBuy ? 'Buy +1 Shield · 200 🪙' : 'Earn 200 🪙 to buy a shield (' + coins + '/200)') +
        '</button>'+
        '<button id="xShieldCloseBtn" style="display:block;width:100%;background:transparent;color:inherit;border:1px solid rgba(127,127,127,0.4);border-radius:12px;padding:10px;font-weight:600;cursor:pointer;">Close</button>'+
      '</div>';
    ov.style.display = 'flex';
    $('xShieldCloseBtn').onclick = function(){ ov.style.display='none'; };
    if (canBuy){
      $('xShieldBuyBtn').onclick = function(){
        window._growthD.buyFreeze(function(){
          ov.style.display='none';
          renderChips();
        });
      };
    }
  }
  function claimLoginReward(nm){
    if (!nm) return;
    var save = window._growthD && window._growthD.readSave();
    if (!save) return;
    // Coins-only branch (most common). Other reward types stay in
    // the app-native daily flow; we just mark "claimed today" so the
    // chip flips to "tomorrow" state.
    var m = /([0-9]+)\s*🪙/.exec(nm.reward||'');
    if (m && typeof save.obj.coins === 'number') {
      save.obj.coins += parseInt(m[1],10);
      window._growthD.writeSave(save);
    }
    if (window.showToast) safe(function(){ showToast('🎁 ' + nm.reward + ' claimed!'); });
  }

  // ── Tier 1 + Tier 2 label patching.
  function patchMenuButtons(){
    var menu = menuEl(); if (!menu) return;
    var play = tier1Btn();
    if (play) {
      var label = play.querySelector('#menuPlayLabel') || play;
      var newLabel = hasResumableProgress() ? progressLabel() : 'Play';
      if (label !== play) {
        if (label.textContent !== newLabel) label.textContent = newLabel;
      } else {
        var span = play.querySelector('span:not(.ico):not(.icon)');
        if (span && span.textContent !== newLabel) span.textContent = newLabel;
        else if (!span && play.childNodes.length === 1) play.textContent = newLabel;
      }
    }
    var daily = tier2Btn();
    if (daily) {
      var streak = getStreak();
      var lbl = daily.getAttribute('data-base-label');
      if (!lbl) {
        lbl = (daily.textContent || '').replace(/\s*🔥\s*\d+\s*$/, '').trim() || 'Daily Challenge';
        daily.setAttribute('data-base-label', lbl);
      }
      var textNode = null;
      for (var i=0;i<daily.childNodes.length;i++){
        if (daily.childNodes[i].nodeType === 3) { textNode = daily.childNodes[i]; break; }
      }
      var newTxt = lbl + (streak > 0 ? '  🔥' + streak : '');
      if (textNode) { if (textNode.nodeValue.trim() !== newTxt) textNode.nodeValue = newTxt; }
      else if (daily.querySelector('span:not(.ico):not(.icon)')) {
        var s2 = daily.querySelector('span:not(.ico):not(.icon)');
        if (s2.textContent !== newTxt) s2.textContent = newTxt;
      } else {
        if (daily.textContent !== newTxt) daily.textContent = newTxt;
      }
    }
  }

  function slimSeasonBanner(){
    var b = $('xSeasonBanner');
    if (!b) return;
    if (b.getAttribute('data-slimmed') === '1') return;
    b.setAttribute('data-slimmed','1');
    b.style.cssText = 'margin:6px auto 0;font-size:0.72rem;color:inherit;background:rgba(127,127,127,0.10);' +
      'border-radius:8px;padding:3px 10px;text-align:center;max-width:260px;letter-spacing:0.5px;';
  }

  // ── Pass promo — auto-surface inside shop + on no-lives overlay only.
  function maybeFirePassPromo(){
    var screens = ['shopScreen','screen-shop','xShopScreen'];
    var overlays = ['overlay-nolives','noLivesOverlay','overlayNoLives','nolivesOverlay'];
    function active(id){ var el=$(id); return el && (el.classList.contains('active') || el.style.display==='flex' || el.style.display==='block'); }
    var fire = false;
    for (var i=0;i<screens.length;i++) if (active(screens[i])) { fire = true; break; }
    if (!fire) for (var j=0;j<overlays.length;j++) if (active(overlays[j])) { fire = true; break; }
    if (!fire) return;
    if (typeof window.injectPassPromo === 'function') safe(window.injectPassPromo);
  }

  // ── ONE render entry point. Called from showScreen('menuScreen'),
  // visibility-change, and once at startup. No 1.5-second polling.
  function renderMenu(){
    SUPPRESSED.forEach(wrapInject);
    hideLegacyOnMenu();
    relocateThemeStripPermanent();
    ensureTopBarIcons();
    refreshTopBarIconState();
    patchMenuButtons();
    slimSeasonBanner();
    renderChips();
  }
  // Wrap showScreen so any navigation back to the menu re-renders.
  function hookShowScreen(){
    if (window.__menuShowScreenHooked) return;
    var fns = [];
    if (typeof window.showScreen === 'function') fns.push(['window','showScreen']);
    if (window.Game && typeof window.Game.showScreen === 'function') fns.push(['Game','showScreen']);
    fns.forEach(function(pair){
      var owner = (pair[0] === 'window') ? window : window[pair[0]];
      var orig = owner[pair[1]];
      if (orig.__menuHooked) return;
      owner[pair[1]] = function(id){
        var r = orig.apply(this, arguments);
        var s = (id || '').toString();
        if (s.indexOf('menu') >= 0)   setTimeout(renderMenu, 0);
        if (s.indexOf('theme') >= 0)  setTimeout(relocateThemeStripPermanent, 0);
        if (s.indexOf('shop') >= 0 || s.indexOf('nolives') >= 0) setTimeout(maybeFirePassPromo, 0);
        return r;
      };
      owner[pair[1]].__menuHooked = true;
    });
    window.__menuShowScreenHooked = true;
  }

  // ── Free-coins cooldown ticker — TEXT ONLY. Doesn't re-layout the DOM.
  setInterval(function(){
    if (document.querySelector('[data-menu-icon="freecoins"]')) refreshTopBarIconState();
  }, 60000);

  function start(){
    hookShowScreen();
    renderMenu();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(start, 300); });
  } else {
    setTimeout(start, 300);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && onMenu()) setTimeout(renderMenu, 100);
  });

  // Public — used by the showScreen wrapper inside game.html (Part E
  // shipped earlier already nukes the legacy inject calls; this is a
  // backup entry point if any later hook calls it).
  window._growthRenderMenu = renderMenu;
})();
</script>

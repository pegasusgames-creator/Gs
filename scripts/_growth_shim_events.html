     window.gEvents.renderRibbon — no competing injector), a bottom sheet
     with the milestone track / boosts / trophy case, queued reward cards

      '<span style="flex:1 1 auto;min-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start;">' + evName(c.ev) + '</span>' +
      '<span style="width:38px;flex:0 0 38px;">' + bar(s.pts / maxT * 100, 5) + '</span>' +
      '<span style="flex:0 0 auto;font-variant-numeric:tabular-nums;">' + Math.min(s.pts, maxT) + '/' + maxT + '</span>' +
      extra + (pend ? '<span aria-label="!" style="width:8px;height:8px;border-radius:50%;background:#b8332b;flex:0 0 8px;"></span>' : '');
  }
  function renderRibbon(menu, anchor){
    lastHost = menu || lastHost; lastAnchor = anchor || lastAnchor;
    menu = lastHost; anchor = lastAnchor;
    if (!menu || !window.gGame) return;
    // retire the old per-app seasonal banners (they made false promises)
    ['xSeasonBanner', 'xSeasonBanner2048', 'xSeasonalBanner'].forEach(function(id){ var e = $(id); if (e) e.remove(); });
    var c = current(), s = load(c);
    var r = $('xEventRibbon');
    if (!r){
      r = document.createElement('button');
      r.id = 'xEventRibbon';
      r.type = 'button';
      r.setAttribute('data-menu-event-ribbon', '1');
      r.style.cssText = 'display:flex;align-items:center;gap:7px;width:clamp(260px, 78vw, 380px);max-width:94vw;min-height:32px;margin:8px auto 0;' +
        'padding:6px 12px;border-radius:99px;border:1px solid ' + LINE + ';background:' + TILE + ';color:var(--menu-tile-fg, ' + CARD_FG + ');' +
        'font:inherit;font-size:0.8rem;font-weight:800;cursor:pointer;box-sizing:border-box;';
      r.addEventListener('click', openSheet);
    }
    var target = anchor && anchor.parentNode ? anchor : null;
    if (target){
      if (r.previousSibling !== target || r.parentNode !== target.parentNode) target.parentNode.insertBefore(r, target.nextSibling);
    } else if (r.parentNode !== menu){
      menu.appendChild(r);
    }
    var html = ribbonHtml(c, s);
    if (r.getAttribute('data-rendered') !== html){ r.innerHTML = html; r.setAttribute('data-rendered', html); }
    r.setAttribute('aria-label', evName(c.ev));
  }
  function renderRibbonNow(){ if (lastHost) safe(function(){ renderRibbon(); }); }
  // countdown text refresh — TEXT ONLY (same contract as the free-coins ticker)
  setInterval(function(){ if ($('xEventRibbon')) renderRibbonNow(); }, 60000);

  // ── win-back line for Part A's Day-3 push ──
  function winBackLine(days){
    var c = current(), s = load(c);
    if (c.left < (days + 1) * 86400000) return null;
    var maxT = TARGETS[TARGETS.length - 1];
    return { title: c.ev.token + ' ' + evName(c.ev), body: tr('ends', { t: fmtLeft(c.left - days * 86400000) }) + ' · ' + Math.min(s.pts, maxT) + '/' + maxT + ' ' + c.ev.token };
  }

  window.gEvents = {
    SEASONAL_EVENTS: SEASONAL_EVENTS,
    current: current,
    renderRibbon: renderRibbon,
    open: openSheet,
    winBackLine: winBackLine,
    points: function(){ return load(current()).pts; },
    isWeekend: isWeekend,
    inGolden: inGolden,
    multiplier: multiplier
  };

  (function boot(){
    if (!window.gGame){ setTimeout(boot, 60); return; }
    window.gGame.on('clear', onClear);
    settlePrevious();
    setTimeout(maybeIntro, 2500);
    var c = current(), s = load(c);
    if (pending(c, s).length) setTimeout(function(){ queueRewardCard(c); }, 3000);
  })();
})();
</script>

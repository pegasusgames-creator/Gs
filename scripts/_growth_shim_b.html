<!-- Growth shim — Part B (cross-promo flywheel). Idempotent: keyed by data-growth-shim="B".
     Appended to game.html in WaterSort / Nonogram / Puzzle2048 / UnblockPuzzle.
     Behavioral wiring on top of each app's existing PROMO_GAMES / MORE_GAMES list:
       - Welcome bonus: 100 coins on the FIRST launch if any sister portfolio
         app is installed (welcomeBonusClaimed gate). Toast credits the source.
       - Break-point card: every 5th cleared level/score increment we show a
         lightweight prompt for one promoted game (rotates round-robin).
         Frequency cap: once per session, never two sessions in a row.
       - Reuses Android.isAppInstalled / Android.openPlayStore from Part A.
     The per-app PROMO_GAMES list stays the source of truth; this shim reads
     window._GROWTH_PROMO_TARGETS if the app exposes it, else falls back to a
     generic list filtered against the current package (so the current app
     never promotes itself).
-->
<script data-growth-shim="B">
(function(){
  if (window.__growthShimB) return;
  window.__growthShimB = true;

  var LS = window.localStorage;
  function lsGet(k, d){ try { var v=LS.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function lsSet(k, v){ try { LS.setItem(k,v); } catch(e){} }
  function api(name){ return !!(window.Android) && typeof window.Android[name]==='function'; }
  function safe(fn){ try { return fn(); } catch(e){} }

  // PROMO_TARGETS — LIVE portfolio apps only (CLAUDE.md: pre-release apps
  // are never cross-promo targets). When a pre-release app goes live, add
  // it here AND to each app's CROSS_PROMO_PACKAGES / <queries>.
  var ALL_PROMO = [
    { pkg:'com.pegasusgames.watersortpuzzle', name:'Water Sort Puzzle',
      tagline:'Pour colors to sort. Calm puzzle bliss.' },
    { pkg:'com.pegasusgames.nonogram',        name:'Nonogram',
      tagline:'Pixel-art logic puzzles. 500 levels.' },
    { pkg:'com.pegasusgames.puzzle2048',      name:'2048 Puzzle',
      tagline:'Merge tiles. Hit 2048 and beyond.' },
    { pkg:'com.pegasusgames.unblockpuzzle',   name:'Unblock Puzzle',
      tagline:'Slide blocks to clear the red one.' },
  ];

  function currentPkg(){
    if (window.gGame && window.gGame.pkg) return window.gGame.pkg;
    var meta = document.querySelector('meta[name="app-package"]');
    return meta ? meta.content : '';
  }
  var CUR = currentPkg();
  var TARGETS = ALL_PROMO.filter(function(g){ return g.pkg !== CUR; });
  // Never promote a game the player already has.
  function notInstalled(t){ try { return !(api('isAppInstalled') && window.Android.isAppInstalled(t.pkg)); } catch(e){ return true; } }
  window._GROWTH_PROMO_TARGETS = TARGETS;

  // ── 1. Welcome bonus on first launch if any sibling app is installed.
  function checkWelcomeBonus(){
    if (lsGet('welcomeBonusClaimed','0') === '1') return;
    if (!api('isAppInstalled')) return;
    var sourceName = null;
    for (var i=0;i<TARGETS.length;i++){
      var t = TARGETS[i];
      try { if (window.Android.isAppInstalled(t.pkg)) { sourceName = t.name; break; } }
      catch(e){}
    }
    if (!sourceName) return;
    if (!window.gGame) return;
    lsSet('welcomeBonusClaimed','1');
    var src = sourceName;
    var pay = function(done){
      window.gGame.addCoins(100);
      var bg = document.createElement('div');
      bg.setAttribute('data-growth-card', '1');
      bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:var(--z-modal, 700);font-family:inherit;';
      bg.innerHTML = '<div style="background:var(--surface, #ffffff);color:var(--text, #1e3a5f);border-radius:20px;padding:24px 22px 18px;width:86%;max-width:340px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,0.35);">' +
        '<div style="font-size:44px;line-height:1;margin-bottom:10px;">🤝</div>' +
        '<div style="font-size:1.2rem;font-weight:800;margin-bottom:6px;">Welcome, ' + src + ' player!</div>' +
        '<div style="font-size:0.95rem;color:var(--text-mute, inherit);margin-bottom:16px;">A thank-you from Pegasus Games: +100 🪙 to start.</div>' +
        '<button type="button" style="display:block;width:100%;border:none;padding:13px;border-radius:14px;background:var(--g-play, #3b6db8);color:var(--on-accent, #fff);font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;">Collect +100 🪙</button></div>';
      document.body.appendChild(bg);
      bg.querySelector('button').addEventListener('click', function(){ bg.remove(); done(); });
    };
    if (window.gPopupQueue) window.gPopupQueue.enqueue(pay); else pay(function(){});
  }

  // ── 2. Clear counter — CORE 'clear' events (new + replayed wins).
  function pickPromoTarget(){
    var pool = TARGETS.filter(notInstalled);
    if (!pool.length) return null;
    var idx = parseInt(lsGet('_crossPromoIdx','0'),10) || 0;
    var t = pool[idx % pool.length];
    lsSet('_crossPromoIdx', String((idx + 1) % pool.length));
    return t;
  }

  // ── 3. Break-point card UI.
  function buildPromoCard(target){
    var bg = document.createElement('div');
    bg.setAttribute('data-growth-promo-card','1');
    bg.setAttribute('data-growth-card','1');
    bg.style.cssText =
      'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:var(--z-modal, 700);font-family:inherit;';
    var card = document.createElement('div');
    card.style.cssText =
      'background:var(--surface, #ffffff);color:var(--text, #1e3a5f);border-radius:18px;padding:22px 22px 18px;width:88%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.3);';
    card.innerHTML =
      '<div style="font-size:11px;letter-spacing:2px;color:var(--text-mute, #5a7390);font-weight:700;margin-bottom:6px;">FROM PEGASUS GAMES</div>' +
      '<div style="font-size:1.3rem;font-weight:800;margin-bottom:4px;">' + target.name + '</div>' +
      '<div style="font-size:0.95rem;color:var(--text-mute, #5a7390);margin-bottom:14px;">' + target.tagline + '</div>' +
      // Gold-coin reward bar is theme-INDEPENDENT brand color (gold), stays hardcoded.
      '<div style="background:rgba(201,127,0,0.12);color:#c97f00;border:1px solid rgba(201,127,0,0.32);border-radius:12px;padding:8px;margin-bottom:14px;font-weight:700;">' +
        'Install — get +200 🪙' +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button data-growth-promo-later style="flex:1;padding:10px;border:1px solid var(--border, #d4e2ec);background:var(--surface, #ffffff);color:var(--text-mute, #5a7390);border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;">Maybe Later</button>' +
        '<button data-growth-promo-install style="flex:1;padding:10px;border:none;background:var(--g-play, linear-gradient(135deg,#3b6db8,#5cb3d8));color:var(--on-accent, #fff);border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit;">Install</button>' +
      '</div>';
    bg.appendChild(card);
    bg.addEventListener('click', function(ev){ if (ev.target===bg) bg.remove(); });
    card.querySelector('[data-growth-promo-later]').addEventListener('click', function(){ bg.remove(); });
    card.querySelector('[data-growth-promo-install]').addEventListener('click', function(){
      bg.remove();
      if (api('openPlayStore')) safe(function(){ Android.openPlayStore(target.pkg); });
      else if (api('openUrl'))   safe(function(){ Android.openUrl('https://play.google.com/store/apps/details?id=' + target.pkg); });
    });
    document.body.appendChild(bg);
  }

  function maybeShowBreakPointPromo(){
    var sessionId = lsGet('_growthSessionId',null);
    if (!sessionId) {
      sessionId = String(Date.now());
      lsSet('_growthSessionId', sessionId);
    }
    // One per session.
    if (lsGet('lastCrossPromoShownSession','') === sessionId) return;
    // Skip two-sessions-in-a-row.
    if (lsGet('lastCrossPromoPrevSession','') === lsGet('_prevSessionId','')) {
      // Allowed — not the same as the immediate-previous shown session.
    } else {
      var prevShown = lsGet('lastCrossPromoShownSession','');
      var prevSes   = lsGet('_prevSessionId','');
      if (prevShown && prevShown === prevSes) {
        return; // already showed in the previous session; skip this one
      }
    }
    var target = pickPromoTarget();
    if (!target) return;
    buildPromoCard(target);
    lsSet('lastCrossPromoShownSession', sessionId);
  }

  // ── 4. Every 5th clear (cumulative) → break-point card, via the popup queue.
  function onClear(){
    var since = (parseInt(lsGet('_crossPromoSinceLast','0'),10) || 0) + 1;
    if (since >= 5) {
      since = 0;
      setTimeout(function(){
        if (window.gPopupQueue) window.gPopupQueue.enqueueWithSelector('[data-growth-promo-card]', maybeShowBreakPointPromo);
        else maybeShowBreakPointPromo();
      }, 2600);
    }
    lsSet('_crossPromoSinceLast', String(since));
  }
  (function withCore(){ if (window.gGame) window.gGame.on('clear', onClear); else setTimeout(withCore, 50); })();

  // ── 5. Session bookkeeping — bump on visibility-change so we don't loop on
  // a single foreground.
  function bumpSession(){
    var cur = lsGet('_growthSessionId','');
    if (cur) lsSet('_prevSessionId', cur);
    lsSet('_growthSessionId', String(Date.now()));
  }
  // On every page load, treat as a new session.
  bumpSession();

  // ── 6. Run welcome-bonus check once DOM ready.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(checkWelcomeBonus, 600); });
  } else {
    setTimeout(checkWelcomeBonus, 600);
  }
})();
</script>

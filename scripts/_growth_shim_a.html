<!-- Growth shim — Part A (notifications). Idempotent: keyed by data-growth-shim="A".
     Appended to game.html in WaterSort / Nonogram / Puzzle2048 / UnblockPuzzle.
     Behaviorally wires notifications without touching each app's clear/win code:
       - On app open + visibilitychange: cancelAllNotifications then reschedule
         the win-back chain (d3/d7/d14/d30), the daily reminder at the user's
         rolling-average play hour, and the streak-at-risk ping (if streak ≥ 3).
       - First level cleared (CORE 'clear' event) → themed in-app pre-prompt
         (max 2 asks, 3-day cooldown) → system permission dialog.
       - Day-7 win-back: 100 coins paid on the first open after a real ≥7-day
         absence (gGame.absenceDays), with a welcome-back card.
       - Reads/writes go through window.gGame (CORE shim) — never a guessed
         localStorage key.
       - Settings panel: a "🔔 Notifications" toggle row appended at runtime
         (DOM scan; covers every per-app Settings markup variant).
       - Exposed for per-app integration when game logic wants to opt in:
           window.gScheduleLivesRefilled(refillAtMillis)
           window.gOnAnyClear()
           window.gOnDailyDone()
-->
<script data-growth-shim="A">
(function(){
  if (window.__growthShimA) return;
  window.__growthShimA = true;

  var LS = window.localStorage;
  function lsGet(k, d){ try { var v=LS.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function lsSet(k, v){ try { LS.setItem(k,v); } catch(e){} }
  function hasAndroid(){ return !!(window.Android); }
  function api(name){ return hasAndroid() && typeof window.Android[name]==='function'; }
  function safe(fn){ try { fn(); } catch(e){} }

  // ── 1. Play-hour tracker — rolling EMA. Default 19:00 if no history.
  function recordPlayHour(){
    var h = new Date().getHours();
    var prev = parseFloat(lsGet('_phRoll', h));
    if (isNaN(prev)) prev = h;
    var next = prev * 0.8 + h * 0.2;
    lsSet('_phRoll', next.toFixed(2));
    lsSet('usualPlayHour', String(Math.round(next)));
    if (api('recordLastPlayed')) safe(function(){ Android.recordLastPlayed(); });
  }
  function getPlayHour(){
    var h = parseInt(lsGet('usualPlayHour','19'),10);
    return (isNaN(h) || h<0 || h>23) ? 19 : h;
  }

  // ── 2. Win-back coin pickup (Day 7). Paid only when the player really
  // was away ≥7 days (gGame.absenceDays, measured from the last foreground
  // stamp) — the Day-7 push promises exactly this. Once per absence.
  // (Audit 2026-10-03: previously flagged "pending" on EVERY open and then
  // credited a save key no game uses, so the promise was never kept.)
  function grantPendingWinBack(){
    var G = window.gGame; if (!G) return;
    if (G.absenceDays < 7) return;
    var stampKey = '_winBackPaidFor';
    var token = String(Math.floor(Date.now() / 86400000));
    if (lsGet(stampKey, '') === token) return;
    lsSet(stampKey, token);
    lsSet('pendingWinBackReward', '0');
    var pay = function(done){
      G.addCoins(100);
      showCard('🎁', 'Welcome back!', 'We saved your progress. Here are 100 🪙 to jump back in.', 'Collect +100 🪙', done);
    };
    if (window.gPopupQueue) window.gPopupQueue.enqueue(pay); else pay(function(){});
  }

  // Shared themed card (token colours only) — used for the welcome-back gift
  // and the notification pre-prompt. Returns via done() when dismissed.
  function showCard(emoji, title, body, cta, done, secondary){
    var bg = document.createElement('div');
    bg.setAttribute('data-growth-card', '1');
    bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:var(--z-modal, 700);font-family:inherit;';
    bg.innerHTML =
      '<div style="background:var(--surface, var(--bg, #ffffff));color:var(--text, #1e3a5f);border:1px solid var(--border, rgba(127,127,127,0.25));border-radius:20px;padding:24px 22px 18px;width:86%;max-width:340px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,0.35);">' +
        '<div style="font-size:44px;line-height:1;margin-bottom:10px;">' + emoji + '</div>' +
        '<div style="font-size:1.25rem;font-weight:800;margin-bottom:6px;">' + title + '</div>' +
        '<div style="font-size:0.95rem;color:var(--text-mute, var(--text-muted, inherit));margin-bottom:16px;line-height:1.4;">' + body + '</div>' +
        '<button data-card-ok type="button" style="display:block;width:100%;border:none;padding:13px;border-radius:14px;background:var(--g-play, var(--accent, #3b6db8));color:var(--on-accent, #fff);font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;">' + cta + '</button>' +
        (secondary ? '<button data-card-no type="button" style="display:block;width:100%;margin-top:8px;border:none;background:transparent;color:var(--text-mute, var(--text-muted, inherit));padding:8px;font-weight:700;cursor:pointer;font-family:inherit;">' + secondary + '</button>' : '') +
      '</div>';
    document.body.appendChild(bg);
    var closed = false;
    function close(ok){ if (closed) return; closed = true; bg.remove(); try { done(ok); } catch(e){} }
    bg.querySelector('[data-card-ok]').addEventListener('click', function(){ close(true); });
    var no = bg.querySelector('[data-card-no]'); if (no) no.addEventListener('click', function(){ close(false); });
    bg.addEventListener('click', function(ev){ if (ev.target === bg) close(false); });
  }

  // ── 3. Streak read — the game's own daily streak via gGame.
  function readStreak(){
    var G = window.gGame;
    return G ? G.streak() : 0;
  }

  // ── 4. First-clear detection — used to gate the permission pre-prompt.
  function hasClearedFirstLevel(){
    var G = window.gGame; if (!G) return false;
    return G.totalClears() > 0 || G.clears() > 0;
  }

  // Soft pre-prompt (QUALITY_PLAYBOOK §11.1): an in-app themed card AFTER a
  // positive moment, never the raw system dialog cold. "Not now" re-asks once
  // after 3 days; at most 2 asks per install. Queued so it never stacks.
  function maybeAskNotifPerm(){
    if (lsGet('notifPrePromptShown','0') === '1') return;
    if (!hasClearedFirstLevel()) return;
    if (!hasAndroid()) return;
    if (api('hasNotificationPermission') && Android.hasNotificationPermission()) {
      lsSet('notifPrePromptShown','1');
      return;
    }
    var asks = parseInt(lsGet('notifPrePromptAsks','0'),10) || 0;
    var lastAt = parseInt(lsGet('notifPrePromptAt','0'),10) || 0;
    if (asks >= 2) { lsSet('notifPrePromptShown','1'); return; }
    if (lastAt && Date.now() - lastAt < 3 * 86400000) return;
    if (window.__notifAskQueued) return;
    window.__notifAskQueued = true;
    var ask = function(done){
      lsSet('notifPrePromptAsks', String(asks + 1));
      lsSet('notifPrePromptAt', String(Date.now()));
      showCard('🔔', 'Never lose your streak', 'Get one friendly reminder a day, plus a heads-up before your streak or an event ends.', 'Turn on reminders', function(ok){
        window.__notifAskQueued = false;
        if (ok) {
          lsSet('notifPrePromptShown','1');
          if (api('setNotificationsEnabled')) safe(function(){ Android.setNotificationsEnabled(true); });
          if (api('requestNotificationPermission')) safe(function(){ Android.requestNotificationPermission(); });
        }
        done();
      }, 'Not now');
    };
    if (window.gPopupQueue) window.gPopupQueue.enqueue(ask); else ask(function(){});
  }

  // Round-15: auto-schedule a "lives are full" ping by reading the
  // current save state. Every shipping app uses the same shape:
  // { lives, maxLives (default 5), lastLifeTime }. Per-app save keys
  // differ, so probe the known set.
  function scheduleLivesIfBelowMax(){
    if (!api('scheduleLivesRefilled') || !window.gGame) return;
    var REGEN_MS = 30 * 60 * 1000; // every shipping game uses 30 min
    var inner = window.gGame.state();
    var lives    = (inner.lives != null)    ? inner.lives    : null;
    var maxLives = (inner.maxLives != null) ? inner.maxLives : 5;
    var lastLife = inner.lastLifeTime || inner.lastLifeMs || inner.lifeRegenAt || 0;
    if (lives == null || lastLife <= 0) return;
    if (lives >= maxLives) return; // already full, nothing to schedule
    var refillAt = lastLife + (maxLives - lives) * REGEN_MS;
    if (refillAt <= Date.now()) return; // would've already refilled
    safe(function(){ Android.scheduleLivesRefilled(refillAt); });
  }

  // ── 5. Reschedule the full chain.
  function rescheduleAll(){
    if (!hasAndroid()) return;
    if (api('getNotificationsEnabled') && !Android.getNotificationsEnabled()) return;
    safe(function(){ Android.cancelAllNotifications(); });
    if (api('scheduleDailyReminder')) safe(function(){ Android.scheduleDailyReminder(getPlayHour(), 0); });
    if (api('scheduleWinBack')) {
      var d3 = (window.gEvents && typeof window.gEvents.winBackLine === 'function') ? window.gEvents.winBackLine(3) : null;
      safe(function(){ Android.scheduleWinBack(3,  d3 ? d3.title : "Your puzzles miss you", d3 ? d3.body : "Pick up right where you left off."); });
      safe(function(){ Android.scheduleWinBack(7,  "Come back for 100 coins", "A welcome-back gift is waiting."); });
      safe(function(){ Android.scheduleWinBack(14, "New themes await", "Unlocks are ready to claim."); });
      safe(function(){ Android.scheduleWinBack(30, "We saved everything", "Your progress and streak shield are still here."); });
    }
    // Round-15: schedule streak-at-risk from day 1+ (was day 3+). Even
    // a one-day streak is worth not losing — and reward keeps growing
    // with the chain anyway, so an early reminder still pays off.
    var streak = readStreak();
    if (streak >= 1 && api('scheduleStreakAtRisk')) {
      safe(function(){ Android.scheduleStreakAtRisk(streak); });
    }
    // Round-15: schedule lives-refilled if any life slot is regenerating.
    scheduleLivesIfBelowMax();
  }

  // ── 6a. SERIAL POPUP QUEUE — round-15.1 fix.
  // User complaint: "popups with daily streak and tutorial just closed
  // each other with overriding while next popup should only appear
  // after user manually taps". Every modal that shows on first launch
  // of the day (login streak, starter pack, coachmark, cross-promo,
  // welcome bonus) should opt into this queue. The queue shows ONE at
  // a time and only proceeds when the previous popup is dismissed.
  //
  // Usage from per-app or shim code:
  //   gPopupQueue.enqueue(function(done){
  //     showMyPopup();
  //     wireDismissHandler(done);  // call done() when user dismisses
  //   });
  //
  // Also: a polling helper for popups that don't have an explicit
  // dismiss hook. Pass a `selector` whose visibility tracks the popup
  // (display !== 'none'), and the queue auto-detects dismissal.
  window.gPopupQueue = (function(){
    var queue = [];
    var active = false;
    function next(){
      if (active) return;
      var entry = queue.shift();
      if (!entry) return;
      active = true;
      try {
        entry.show(function done(){
          active = false;
          // Defer next show by 250ms so the user sees a beat
          // between popups rather than instant flicker.
          setTimeout(next, 250);
        });
      } catch (e){
        active = false;
        setTimeout(next, 250);
      }
    }
    function enqueue(showFn){
      queue.push({show: showFn});
      next();
    }
    function enqueueWithSelector(selector, showFn){
      queue.push({show: function(done){
        showFn();
        // Poll for visibility going false → call done().
        // Round-15.4 fix: position:fixed elements have offsetParent
        // === null even when visible — must use computed display.
        // Also wait at least 500ms before first check so the show
        // has actually taken effect.
        var started = false;
        var startAt = Date.now();
        var poll = setInterval(function(){
          var el = document.querySelector(selector);
          if (!el) {
            if (Date.now() - startAt > 600) { clearInterval(poll); done(); }
            return;
          }
          var cs = window.getComputedStyle(el);
          var visible = cs.display !== 'none' && cs.visibility !== 'hidden' && parseFloat(cs.opacity || '1') > 0.01;
          if (visible) { started = true; return; }
          if (!started) {
            // Hasn't shown yet — give it up to ~1.2s before bailing.
            if (Date.now() - startAt > 1200) { clearInterval(poll); done(); }
            return;
          }
          // It WAS visible and now isn't → dismissed.
          clearInterval(poll);
          done();
        }, 200);
      }});
      next();
    }
    return { enqueue: enqueue, enqueueWithSelector: enqueueWithSelector };
  })();

  // ── 6b. Public hooks for per-app integration when game wants to opt in.
  window.gScheduleLivesRefilled = function(refillAtMillis){
    if (api('scheduleLivesRefilled')) safe(function(){ Android.scheduleLivesRefilled(refillAtMillis); });
  };
  // Legacy hook some win paths still call — forwards to the CORE clear bus
  // (which fires the 'clear' subscribers below exactly once).
  window.gOnAnyClear = function(info){
    if (window.gGame) window.gGame.clear(info || { legacy: true });
  };
  function onClear(){
    recordPlayHour();
    // Let the win overlay breathe before asking.
    setTimeout(maybeAskNotifPerm, 2200);
    rescheduleAll();
  }
  (function withCore(){ if (window.gGame) window.gGame.on('clear', onClear); else setTimeout(withCore, 50); })();
  window.gOnDailyDone = function(){
    recordPlayHour();
    rescheduleAll();
  };
  window.onNotificationPermissionResult = function(granted){
    if (granted) rescheduleAll();
  };

  // ── 7. Settings toggle — runtime DOM injection so we don't need to hand-patch
  // each app's Settings panel HTML. Periodic scan keyed by data-growth-notif-toggle.
  function injectNotifToggle(){
    // 2026-05-28 round-14: prefer the inner .settings-list / .settings-scroll
    // so the notif row becomes a normal list item, not a floating panel
    // tacked onto the end of the screen container. ON/OFF button also
    // gets explicit padding so the text isn't cramped.
    var host = document.querySelector('#screen-settings .settings-list')
            || document.querySelector('#settingsScreen .settings-list')
            || document.querySelector('#screen-settings .settings-scroll')
            || document.querySelector('#settingsScreen .settings-scroll')
            || document.querySelector('#screen-settings')
            || document.querySelector('#settingsScreen');
    if (!host) return;
    if (host.querySelector('[data-growth-notif-toggle]')) return;
    var enabled = (api('getNotificationsEnabled')) ? Android.getNotificationsEnabled() : true;
    var row = document.createElement('div');
    row.setAttribute('data-growth-notif-toggle','1');
    // Round-15.5: BOXED — match native settings rows. Don't override
    // background/border/padding — let the .setting-row class own those.
    // Only set layout (flex + gap) inline.
    row.className = 'setting-row settings-item set-row';
    row.style.cssText =
      'display:flex;align-items:center;justify-content:space-between;gap:14px;font-family:inherit;';
    row.innerHTML =
      '<span class="setting-label settings-item-label set-label" style="flex:1;font-weight:600;font-size:16px;color:var(--page-fg, var(--text, inherit));">🔔 Notifications</span>' +
      '<button data-growth-notif-btn type="button" style="border:none;padding:7px 18px;border-radius:14px;cursor:pointer;font-weight:800;letter-spacing:0.5px;min-width:60px;text-align:center;flex:0 0 auto;font-family:inherit;' +
        'background:' + (enabled ? 'var(--g-play, #3b6db8)' : 'var(--btn-neutral-bg, #bbb)') + ';color:var(--on-accent, #fff);">' +
        (enabled ? 'ON' : 'OFF') + '</button>';
    host.appendChild(row);
    row.querySelector('[data-growth-notif-btn]').addEventListener('click', function(){
      var cur = (api('getNotificationsEnabled')) ? Android.getNotificationsEnabled() : true;
      var next = !cur;
      if (api('setNotificationsEnabled')) safe(function(){ Android.setNotificationsEnabled(next); });
      this.textContent = next ? 'ON' : 'OFF';
      this.style.background = next ? 'var(--g-play, #3b6db8)' : 'var(--btn-neutral-bg, #bbb)';
      if (next) rescheduleAll();
    });
  }
  setInterval(injectNotifToggle, 1500);

  // ── 8. Boot path: schedule on first load + on every return-to-foreground.
  function onAppOpen(first){
    if (first) grantPendingWinBack();
    recordPlayHour();
    if (first) setTimeout(maybeAskNotifPerm, 4000);
    rescheduleAll();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(function(){ onAppOpen(true); }, 400); });
  } else {
    setTimeout(function(){ onAppOpen(true); }, 400);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') setTimeout(function(){ onAppOpen(false); }, 200);
  });
})();
</script>

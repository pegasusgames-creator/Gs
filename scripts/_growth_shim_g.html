<!-- Growth shim — Part G (Play Games Services leaderboards). Idempotent: data-growth-shim="G".
     - Defines per-package LEADERBOARD_ID (placeholder until Play Console wiring).
     - Submits to PGS on every detected clear (best-effort; no-ops without setup).
     - Injects a "🏆 Leaderboard" button on the menu; hidden when sign-in fails.
     - Preserves the synthetic weekly-tournament bracket already in each game —
       this layer is purely additive.
-->
<script data-growth-shim="G">
(function(){
  if (window.__growthShimG) return;
  window.__growthShimG = true;

  function lsGet(k, d){ try { var v=localStorage.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function safe(fn){ try { return fn(); } catch(e){} }
  function api(name){ return !!(window.Android) && typeof window.Android[name]==='function'; }

  // Replace with the real leaderboard ID from Play Console after PGS setup.
  // See scripts/growth_open_items.md §B.
  var LEADERBOARD_ID = 'TODO_FROM_PLAY_CONSOLE';
  window._GROWTH_LEADERBOARD_ID = LEADERBOARD_ID;

  // ── On every clear, submit the relevant metric to PGS (no-op until configured).
  var lastSeen = -1;
  function readClearMetric(){
    var keys = ['save','state','gameState','progress'];
    for (var i=0;i<keys.length;i++){
      var raw = lsGet(keys[i], null);
      if (!raw) continue;
      try {
        var o = JSON.parse(raw);
        var t = (document.title||'').toLowerCase();
        if (t.indexOf('2048') >= 0) {
          // 2048 leaderboard = best score
          return parseInt(o.bestScore || o.highScore || o.score || 0, 10);
        }
        // Other games leaderboard = highest level cleared
        if (Array.isArray(o.completedLevels)) return o.completedLevels.length;
        if (typeof o.levelsCompleted === 'number') return o.levelsCompleted;
        if (typeof o.currentLevel === 'number') return o.currentLevel;
      } catch(e){}
    }
    return null;
  }
  setInterval(function(){
    var m = readClearMetric();
    if (m == null) return;
    if (lastSeen < 0) { lastSeen = m; return; }
    if (m > lastSeen) {
      lastSeen = m;
      if (api('submitScore')) safe(function(){ Android.submitScore(LEADERBOARD_ID, m); });
    }
  }, 1500);

  // ── Menu "🏆 Leaderboard" button — injected at runtime.
  function injectButton(){
    var menu = document.getElementById('screen-menu')
            || document.getElementById('menuScreen')
            || document.querySelector('[id*="menu"]');
    if (!menu) return;
    if (menu.querySelector('[data-growth-leaderboard-btn]')) return;
    var btn = document.createElement('button');
    btn.setAttribute('data-growth-leaderboard-btn','1');
    btn.style.cssText =
      'position:absolute;top:14px;left:50%;transform:translateX(-50%);' +
      'background:#ffffff;color:#1e3a5f;border:1px solid rgba(0,0,0,0.08);border-radius:14px;' +
      'padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer;z-index:5;font-family:inherit;';
    btn.textContent = '🏆 Leaderboard';
    btn.addEventListener('click', function(){
      if (api('showLeaderboard')) {
        // Trigger sign-in first; PGS will pop the chooser if needed.
        if (api('signInPlayGames')) safe(function(){ Android.signInPlayGames(); });
        safe(function(){ Android.showLeaderboard(LEADERBOARD_ID); });
      } else {
        if (window.showToast) safe(function(){ showToast('Leaderboards coming soon'); });
      }
    });
    menu.appendChild(btn);
    // Hide gracefully if no Android bridge (web preview).
    if (!api('showLeaderboard')) btn.style.opacity = '0.5';
  }
  setInterval(injectButton, 1500);
})();
</script>

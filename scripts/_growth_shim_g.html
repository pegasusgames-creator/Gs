<!-- Growth shim — Part G (Play Games Services). Idempotent: data-growth-shim="G".
     Behavioral half only — submits the player's clear metric to PGS as
     they progress. The MENU shim owns the UI side (the 🏆 Ranks icon
     and the Ranks sheet that opens the leaderboard). See CLAUDE.md
     "No competing runtime shims" — keep menu rendering in one place.
-->
<script data-growth-shim="G">
(function(){
  if (window.__growthShimG) return;
  window.__growthShimG = true;

  function lsGet(k, d){ try { var v=localStorage.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function safe(fn){ try { return fn(); } catch(e){} }
  function api(name){ return !!(window.Android) && typeof window.Android[name]==='function'; }

  // PER-APP LEADERBOARD IDS (PGS project 225819574531, wired 2026-05-27):
  //   WaterSortPuzzle  CgkIg4KVn8kGEAIQAw
  //   Nonogram         CgkIg4KVn8kGEAIQBA
  //   Puzzle2048       CgkIg4KVn8kGEAIQBQ
  //   UnblockPuzzle    CgkIg4KVn8kGEAIQBg
  // The literal below is patched in each per-app game.html — use
  // scripts/wire_leaderboards.py to (re)apply after a shim re-inject.
  var LEADERBOARD_ID = 'TODO_FROM_PLAY_CONSOLE';
  // Exported so the MENU shim's Ranks sheet can open the matching leaderboard.
  window._GROWTH_LEADERBOARD_ID = LEADERBOARD_ID;

  // ── On every clear, submit the relevant metric to PGS (no-op until configured).
  var lastSeen = -1;
  function readClearMetric(){
    var keys = ['save','state','gameState','progress'];
    for (var i=0;i<keys.length;i++){
      var raw = lsGet(keys[i], null);
      if (!raw) continue;
      try {
        var o = JSON.parse(raw);
        var t = (document.title||'').toLowerCase();
        if (t.indexOf('2048') >= 0) {
          return parseInt(o.bestScore || o.highScore || o.score || 0, 10);
        }
        if (Array.isArray(o.completedLevels)) return o.completedLevels.length;
        if (typeof o.levelsCompleted === 'number') return o.levelsCompleted;
        if (typeof o.currentLevel === 'number') return o.currentLevel;
      } catch(e){}
    }
    return null;
  }
  setInterval(function(){
    var m = readClearMetric();
    if (m == null) return;
    if (lastSeen < 0) { lastSeen = m; return; }
    if (m > lastSeen) {
      lastSeen = m;
      if (api('submitScore')) safe(function(){ Android.submitScore(LEADERBOARD_ID, m); });
    }
  }, 1500);
})();
</script>

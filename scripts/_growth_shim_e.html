<!-- Growth shim — Part E (first-session retention). Idempotent: data-growth-shim="E".
     - No interstitial on the first 3 clears: window.gAdGateOk() (CORE
       lifetime clear count) is consulted by every game's own interstitial
       function. The Java bridge is never monkey-patched.
     - Loud first-clear celebration: emoji-confetti overlay on the first
       detected clear (subsequent clears use the app's normal flow).
     - First-session retention hook: when session 1 ends with currentLevel>=3
       AND tutorialDone, fire a "Come back tomorrow for your daily bonus"
       toast and schedule the daily reminder (already wired in Part A).
     - 3-step coachmark for Nonogram + UnblockPuzzle: opt-in by setting
       a body attribute data-growth-coachmark="nono" or ="unblock". The
       per-app injection script below opts those two in.
-->
<script data-growth-shim="E">
(function(){
  if (window.__growthShimE) return;
  window.__growthShimE = true;

  var LS = window.localStorage;
  function lsGet(k, d){ try { var v=LS.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function lsSet(k, v){ try { LS.setItem(k,v); } catch(e){} }
  function safe(fn){ try { return fn(); } catch(e){} }

  // ── 1. First-3-clears interstitial grace. Each game's own interstitial
  // function asks window.gAdGateOk() before calling the bridge. (The old
  // approach — overwriting window.Android.showInterstitial — is shadowed by
  // the Java bridge's named-property interceptor on real WebViews, so it
  // never ran; and where it did, it keyed off a counter nothing advanced.)
  window.gAdGateOk = function(){ return !window.gGame || window.gGame.adGateOk(); };

  // ── 2. CORE 'clear' events drive:
  //   (a) confetti on the FIRST clear ever,
  //   (b) at session-1 end (≥3 clears + tutorialDone), the day-2 nudge.
  function showConfetti(){
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:var(--z-toast, 300);font-family:inherit;';
    var emojis = ['🎉','✨','⭐','🎊','💫'];
    for (var i=0;i<24;i++){
      var span = document.createElement('span');
      span.textContent = emojis[i % emojis.length];
      span.style.cssText = 'position:absolute;top:-40px;left:' + (Math.random()*100) + '%;' +
        'font-size:' + (24 + Math.random()*16) + 'px;' +
        'transform:rotate(' + (Math.random()*360) + 'deg);' +
        'transition:transform 2.4s ease-in,top 2.4s ease-in,opacity 2.4s;';
      ov.appendChild(span);
      setTimeout((function(s){return function(){
        s.style.top = (60 + Math.random()*30) + '%';
        s.style.transform = 'rotate(' + (Math.random()*720) + 'deg)';
        s.style.opacity = '0';
      };})(span), 50 + i*40);
    }
    document.body.appendChild(ov);
    setTimeout(function(){ ov.remove(); }, 2700);

    var msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);' +
      'background:var(--surface, #ffffff);color:var(--text, #1e3a5f);border:1px solid var(--border, #d4e2ec);border-radius:18px;padding:18px 22px;' +
      'box-shadow:0 12px 40px rgba(0,0,0,0.25);font-weight:800;font-size:1.05rem;text-align:center;z-index:var(--z-tutorial, 500);font-family:inherit;pointer-events:none;';
    var cfg = (window.gGame && window.gGame.cfg) || {};
    var sub = (cfg.kind === 'score') ? 'Next stop: 2048!'
            : ((cfg.totalLevels ? (cfg.totalLevels - 1) : 499) + ' more puzzles to go.');
    msg.innerHTML = "🎉 You've got this!<br><span style='font-weight:600;font-size:0.9rem;color:var(--text-mute, #5a7390);'>" + sub + "</span>";
    document.body.appendChild(msg);
    setTimeout(function(){ msg.remove(); }, 2400);
  }

  function maybeDay2Nudge(){
    var alreadyShown = lsGet('_growthDay2NudgeShown','0');
    if (alreadyShown === '1') return;
    var c = parseInt(lsGet('_growthClearsTotal','0'),10) || 0;
    var tutorialDone = lsGet('tutorialDone','0') === '1';
    if (c < 3) return;
    if (!tutorialDone) return;
    lsSet('_growthDay2NudgeShown','1');
    if (window.gGame) window.gGame.toast('Come back tomorrow for your daily bonus 🔥');
  }

  function onClear(info){
    var total = (info && info.total) || (window.gGame ? window.gGame.totalClears() : 0);
    // Veterans updating the app also start the counter at 0 — only a player
    // whose save shows at most one completed level is truly on clear #1.
    var firstEver = total === 1 && lsGet('_growthFirstConfetti','0') !== '1' &&
                    (!window.gGame || window.gGame.clears() <= 1);
    if (firstEver) { lsSet('_growthFirstConfetti','1'); setTimeout(showConfetti, 300); }
    setTimeout(maybeDay2Nudge, 1200);
  }
  (function withCore(){ if (window.gGame) window.gGame.on('clear', onClear); else setTimeout(withCore, 50); })();

  // ── 3. Coachmark — opt-in via document.body data attribute.
  // The per-app injection layer below sets data-growth-coachmark for Nonogram
  // + UnblockPuzzle. Triggered once per install (tutorialDone gate).
  function runCoachmark(){
    if (lsGet('tutorialDone','0') === '1') return;
    var kind = document.body && document.body.getAttribute('data-growth-coachmark');
    if (!kind) return;
    var steps;
    if (kind === 'nono') {
      steps = [
        { title:'Find the picture', body:'Numbers show how many filled squares are in each row + column.' },
        { title:'Tap to fill', body:'Tap a cell to fill. Long-press marks it empty (a guaranteed blank).' },
        { title:'Solve the row', body:'When a row matches its numbers, it locks in. Clear them all to win.' },
      ];
    } else if (kind === 'unblock') {
      steps = [
        { title:'Find the red block', body:'Your goal: slide the red block out the right edge.' },
        { title:'Drag to slide', body:'Blocks slide along their long axis only. Drag, don\'t tap.' },
        { title:'Clear the path', body:'Move the other blocks out of the way. Fewer moves = more stars.' },
      ];
    } else if (kind === 'watersort') {
      steps = [
        { title:'Sort the colors', body:'Each tube can hold 4 layers. Win when every tube is one color (or empty).' },
        { title:'Tap to pour', body:'Tap a tube to lift it. Tap another to pour. Liquid only pours onto the same color (or into an empty tube).' },
        { title:'Boosters help', body:'Out of moves? Use Hint, Undo, Restart, +Tube, or Wand at the bottom.' },
      ];
    } else if (kind === 'puzzle2048') {
      steps = [
        { title:'Merge to grow', body:'Swipe to slide all tiles. Two tiles with the same number merge into one — bigger.' },
        { title:'Reach 2048', body:'Keep merging: 2 → 4 → 8 → 16 → … all the way to 2048 (and beyond if you can).' },
        { title:'Plan ahead', body:'The board fills up fast. Keep your highest tile in a corner and chain merges toward it.' },
      ];
    } else {
      return;
    }
    // Round-15: mark tutorial as SEEN the moment the first step renders.
    // Previously tutorialDone was only set after the last step, so any
    // mid-tutorial app-close re-triggered the whole flow on next launch.
    // The user explicitly wants this overlay to appear only on the very
    // first launch ever.
    lsSet('tutorialDone','1');
    // Round-15.12: WHOLE tutorial = ONE queue entry. Don't release the
    // queue's done() until all 3 steps have been dismissed. This
    // guarantees the daily-streak popup (queued separately at ~1400ms)
    // can NEVER interleave between tutorial steps. User reported the
    // streak appearing between step 1 and step 2 — that was per-step
    // queueing letting other entries jump the line.
    function runStepsSerially(allDoneCb){
      var i = 0;
      function next(){
        if (i >= steps.length) { allDoneCb(); return; }
        var bg = document.createElement('div');
        bg.setAttribute('data-growth-card','1');
        bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:var(--z-tutorial, 500);font-family:inherit;';
        var card = document.createElement('div');
        card.style.cssText = 'background:var(--bg, var(--surface, #ffffff));color:var(--page-fg, var(--text, #1e3a5f));border-radius:18px;padding:22px;max-width:320px;width:88%;text-align:center;border:1px solid var(--menu-tile-border, var(--border, rgba(255,255,255,0.18)));box-shadow:0 14px 44px rgba(0,0,0,0.4);';
        var s = steps[i];
        var idx = i;
        card.innerHTML =
          '<div style="font-size:11px;font-weight:700;letter-spacing:2px;opacity:0.62;margin-bottom:6px;">STEP ' + (idx+1) + ' / ' + steps.length + '</div>' +
          '<div style="font-size:1.2rem;font-weight:800;margin-bottom:6px;">' + s.title + '</div>' +
          '<div style="font-size:0.95rem;opacity:0.78;margin-bottom:14px;">' + s.body + '</div>' +
          '<button data-cm-next type="button" style="border:none;padding:10px 18px;background:var(--g-play, #3b6db8);color:var(--on-accent, #fff);border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit;">' +
            (idx+1 < steps.length ? 'Next →' : 'Got it') +
          '</button>';
        bg.appendChild(card);
        function close(advance){
          bg.remove();
          if (advance) { i++; next(); }
          else { allDoneCb(); }
        }
        card.querySelector('[data-cm-next]').addEventListener('click', function(){ close(true); });
        bg.addEventListener('click', function(ev){ if (ev.target === bg) close(false); });
        document.body.appendChild(bg);
      }
      next();
    }
    if (window.gPopupQueue && typeof window.gPopupQueue.enqueue === 'function') {
      window.gPopupQueue.enqueue(function(done){ runStepsSerially(done); });
    } else {
      runStepsSerially(function(){});
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(runCoachmark, 800); });
  } else {
    setTimeout(runCoachmark, 800);
  }
})();
</script>

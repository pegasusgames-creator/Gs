<!-- Growth shim — Part D (streak freeze + visible milestone).
     Idempotent: data-growth-shim="D".

     BEHAVIORAL HALF ONLY (2026-05-27 consolidation, see CLAUDE.md
     "No competing runtime shims"):
       - _streakFreezes (default 1, cap 3). Games reset the daily streak to 1
         on the first completion after a miss; when that happens after
         exactly ONE missed day, a shield is spent and the streak restored.
       - Refill 1 free shield at every 7 days of maintained streak.
       - All state reads/writes go through window.gGame (CORE shim).

     The menu-render half (chips + buy-shield button + next-milestone label)
     lives in the MENU shim now, alongside Free Coins / Ranks / Tier-1/2/3
     patching. The exports below let the MENU shim read state + trigger
     purchases without re-implementing the bookkeeping.
-->
<script data-growth-shim="D">
(function(){
  if (window.__growthShimD) return;
  window.__growthShimD = true;

  var LS = window.localStorage;
  function lsGet(k, d){ try { var v=LS.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function lsSet(k, v){ try { LS.setItem(k,v); } catch(e){} }
  function safe(fn){ try { return fn(); } catch(e){} }

  // Escalating ladder — day 30 visibly beats day 3.
  var LADDER = [
    { day:1,  reward:'25 🪙'           },
    { day:2,  reward:'50 🪙'           },
    { day:3,  reward:'100 🪙'          },
    { day:5,  reward:'150 🪙 + Hint'   },
    { day:7,  reward:'🎨 New theme'    },
    { day:10, reward:'250 🪙'          },
    { day:14, reward:'500 🪙'          },
    { day:21, reward:'750 🪙 + Hint x3'},
    { day:30, reward:'🌟 Permanent theme + 1000 🪙' },
    { day:60, reward:'🌟 Master badge + 2000 🪙' },
    { day:100,reward:'🏆 Legendary status + 5000 🪙'},
  ];

  // Live game state via the CORE adapter (window.gGame). readSave/writeSave
  // keep their old {key, obj} shape for the MENU shim's callers.
  function readSave(){
    var G = window.gGame; if (!G) return null;
    return { key: (G.cfg && G.cfg.saveKey) || '', obj: G.state() };
  }
  function writeSave(s){
    var G = window.gGame; if (!G || !s) return;
    G.persist(); G.refresh();
  }
  function readStreak(){
    var G = window.gGame; return G ? G.streak() : 0;
  }
  function localDay(d){
    d = d || new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function daysBetween(a, b){
    var pa = a.split('-'), pb = b.split('-');
    var ta = new Date(+pa[0], +pa[1] - 1, +pa[2]).getTime();
    var tb = new Date(+pb[0], +pb[1] - 1, +pb[2]).getTime();
    return Math.round((tb - ta) / 86400000);
  }

  function getFreezes(){ return parseInt(lsGet('_streakFreezes','1'),10) || 0; }
  function setFreezes(n){ lsSet('_streakFreezes', String(Math.max(0,n))); }
  function nextMilestone(curStreak){
    for (var i=0;i<LADDER.length;i++){
      if (LADDER[i].day > curStreak) return LADDER[i];
    }
    return null;
  }

  // ── Shield-restore. Games never zero the streak on a miss — they reset it
  // to 1 on the next daily completion. So: if the streak we last saw was N≥2
  // on day D, and today (D+2, exactly one day missed) the game shows 1,
  // spend a shield and restore N+1. Watched on open + every few seconds.
  function maybeRestoreStreak(){
    var G = window.gGame; if (!G) return;
    var nowStreak = readStreak();
    var lastSeen  = parseInt(lsGet('_lastSeenStreak','0'),10) || 0;
    var lastDate  = lsGet('_lastSeenStreakDate', null);
    var todayStr  = localDay();
    if (lastDate && lastSeen >= 2 && nowStreak === 1 && lastDate !== todayStr) {
      var gap = daysBetween(lastDate, todayStr);
      if (gap === 2 && getFreezes() > 0) {
        setFreezes(getFreezes() - 1);
        G.setStreak(lastSeen + 1);
        G.toast('🛡 Streak Shield saved your ' + lastSeen + '-day streak!');
        nowStreak = lastSeen + 1;
      }
    }
    var prevRefillStreak = parseInt(lsGet('_streakFreezeRefillAt','0'),10) || 0;
    if (nowStreak < prevRefillStreak) { prevRefillStreak = 0; lsSet('_streakFreezeRefillAt','0'); }
    if (nowStreak > 0 && nowStreak >= prevRefillStreak + 7) {
      lsSet('_streakFreezeRefillAt', String(nowStreak));
      if (prevRefillStreak > 0 || nowStreak >= 7) {
        setFreezes(Math.min(3, getFreezes() + 1));
        G.toast('🛡 +1 Streak Shield earned!');
      }
    }
    // Date stamp moves only when the streak VALUE changes (≈ the day of the
    // last daily completion) — opening the app without playing must not
    // make a missed day look like no gap.
    if (nowStreak > 0 && (nowStreak !== lastSeen || !lastDate)) {
      lsSet('_lastSeenStreak', String(nowStreak));
      lsSet('_lastSeenStreakDate', todayStr);
    }
  }

  // Public API for the MENU shim (consolidated render path).
  window._growthD = {
    readStreak: readStreak,
    getFreezes: getFreezes,
    setFreezes: setFreezes,
    nextMilestone: nextMilestone,
    readSave: readSave,
    writeSave: writeSave,
    buyFreeze: function(cb){
      var G = window.gGame; if (!G) return;
      if (G.coins() < 200) { G.toast('Need ' + (200 - G.coins()) + ' more 🪙'); return; }
      if (!G.spendCoins(200)) return;
      setFreezes(getFreezes() + 1);
      G.toast('🛡 +1 Streak Shield');
      if (typeof cb === 'function') cb();
    }
  };

  function onAppOpen(){ maybeRestoreStreak(); }
  // Daily completions move the streak mid-session — re-check shortly after.
  setInterval(maybeRestoreStreak, 5000);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(onAppOpen, 500); });
  } else {
    setTimeout(onAppOpen, 500);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') setTimeout(onAppOpen, 200);
  });
})();
</script>

<!-- Growth shim — Part F (share virality). Idempotent: data-growth-shim="F".
     - Share-a-win: when a level-complete / win overlay shows up, inject a
       "🔁 Share" button. Composes a one-tap message with the solved level /
       best score and the Play link (GROWTH_CFG.live) or a store-search line.
     - Wordle-style daily result: same Share button on the daily-completion
       overlay produces a spoiler-free recap line.
     - Native bridge: window.Android.shareText. shareImage is best-effort and
       degrades to text-only — see MainActivity comment.
-->
<script data-growth-shim="F">
(function(){
  if (window.__growthShimF) return;
  window.__growthShimF = true;

  var LS = window.localStorage;
  function lsGet(k, d){ try { var v=LS.getItem(k); return v==null?d:v; } catch(e){ return d; } }
  function safe(fn){ try { return fn(); } catch(e){} }
  function api(name){ return !!(window.Android) && typeof window.Android[name]==='function'; }

  // Game-name + Play link per package.
  // Name + Play link come from the CORE adapter (GROWTH_CFG): live apps get
  // their store link, pre-release apps a "search for it" line instead.
  function info(){
    var G = window.gGame || {};
    return { name: G.name || document.title || 'Pegasus Games', link: G.playLink || '' };
  }
  var IS_SCORE = function(){ return !!(window.gGame && window.gGame.cfg && window.gGame.cfg.kind === 'score'); };
  // Remember the level the player just solved (CORE clear event payload).
  var lastSolved = 0, lastDailyMoves = 0;
  (function withCore(){
    if (!window.gGame) { setTimeout(withCore, 50); return; }
    window.gGame.on('clear', function(d){
      if (d && d.level) lastSolved = d.level | 0;
      if (d && d.daily && d.moves) lastDailyMoves = d.moves | 0;
    });
  })();
  function withLink(line){
    var I = info();
    return I.link ? (line + ' ' + I.link)
                  : (line + ' Find "' + I.name + '" by Pegasus Games on Google Play.');
  }

  function composeWin(){
    var I = info();
    var lvl = lastSolved || Math.max(1, ((window.gGame && window.gGame.displayLevel()) || 2) - 1);
    return withLink('I just solved Level ' + lvl + ' in ' + I.name + '! 🧩 Can you beat it?');
  }

  function compose2048Score(){
    var I = info();
    var G = window.gGame;
    var score = G ? Math.max(G.best(), (G.state().score | 0)) : 0;
    return withLink('My best in ' + I.name + ': ' + score + ' points. 🔥 Beat that!');
  }

  function composeDaily(){
    var I = info();
    var d = new Date();
    var date = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    var line = I.name + ' Daily ' + date + ' ✅' + (lastDailyMoves ? ' solved in ' + lastDailyMoves + ' moves' : ' solved');
    var streak = window.gGame ? window.gGame.streak() : 0;
    if (streak > 1) line += ' · 🔥' + streak;
    return I.link ? (line + '\n' + I.link) : line;
  }

  // ── Rate ask: a neutral, non-incentivized nudge to the Play listing at a
  // happy moment (a perfect clear after 12+ total clears, or a 1024+ tile).
  // At most 2 asks per install, 30 days apart, live apps only. No sentiment
  // gating, no reward — Play's ratings policy.
  function maybeAskRating(d){
    var G = window.gGame; if (!G || !G.playLink) return;
    var asks = parseInt(lsGet('_rateAsks','0'),10) || 0;
    var last = parseInt(lsGet('_rateAskAt','0'),10) || 0;
    if (asks >= 2 || lsGet('_rateDone','0') === '1') return;
    if (last && Date.now() - last < 30 * 86400000) return;
    var happy = (d && d.perfect && G.totalClears() >= 12) || (d && d.tile >= 1024);
    if (!happy) return;
    try { localStorage.setItem('_rateAsks', String(asks + 1)); localStorage.setItem('_rateAskAt', String(Date.now())); } catch(e){}
    var ask = function(done){
      var bg = document.createElement('div');
      bg.setAttribute('data-growth-card', '1');
      bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:var(--z-modal, 700);font-family:inherit;';
      bg.innerHTML = '<div style="background:var(--surface, #ffffff);color:var(--text, #1e3a5f);border-radius:20px;padding:24px 22px 18px;width:86%;max-width:340px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,0.35);">' +
        '<div style="font-size:30px;letter-spacing:2px;margin-bottom:10px;">⭐⭐⭐⭐⭐</div>' +
        '<div style="font-size:1.2rem;font-weight:800;margin-bottom:6px;">Enjoying ' + info().name + '?</div>' +
        '<div style="font-size:0.95rem;color:var(--text-mute, inherit);margin-bottom:16px;">A quick rating on Google Play helps a small studio a lot. Thank you!</div>' +
        '<button data-rate-yes type="button" style="display:block;width:100%;border:none;padding:13px;border-radius:14px;background:var(--g-play, #3b6db8);color:var(--on-accent, #fff);font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;">Rate on Google Play</button>' +
        '<button data-rate-no type="button" style="display:block;width:100%;margin-top:8px;border:none;background:transparent;color:var(--text-mute, inherit);padding:8px;font-weight:700;cursor:pointer;font-family:inherit;">Not now</button></div>';
      document.body.appendChild(bg);
      function close(){ bg.remove(); done(); }
      bg.querySelector('[data-rate-yes]').addEventListener('click', function(){
        try { localStorage.setItem('_rateDone','1'); } catch(e){}
        if (api('openPlayStore')) safe(function(){ Android.openPlayStore(G.pkg); });
        else if (api('openUrl')) safe(function(){ Android.openUrl(G.playLink); });
        close();
      });
      bg.querySelector('[data-rate-no]').addEventListener('click', close);
    };
    setTimeout(function(){ if (window.gPopupQueue) window.gPopupQueue.enqueue(ask); else ask(function(){}); }, 2600);
  }
  (function withCoreRate(){
    if (!window.gGame) { setTimeout(withCoreRate, 50); return; }
    window.gGame.on('clear', maybeAskRating);
  })();

  function doShare(text){
    if (!text) return;
    if (api('shareText')) { safe(function(){ Android.shareText(text); }); return; }
    if (navigator.share) {
      try { navigator.share({ text: text }); return; } catch(e){}
    }
    if (window.gGame) window.gGame.toast('Sharing isn\'t available on this device');
  }

  function buildShareButton(label, getter){
    var btn = document.createElement('button');
    btn.setAttribute('data-growth-share-btn','1');
    btn.style.cssText =
      'margin-top:10px;width:100%;padding:11px;border:none;border-radius:12px;' +
      'background:var(--g-play, linear-gradient(135deg,#3b6db8,#5cb3d8));color:var(--on-accent, #fff);font-weight:800;font-size:0.95rem;cursor:pointer;font-family:inherit;';
    btn.textContent = label;
    btn.addEventListener('click', function(){ doShare(getter()); });
    return btn;
  }

  // ── Detect level-complete / daily-complete / high-score overlays.
  // Heuristic: any element with id containing 'overlay-complete', 'win',
  // 'levelComplete', 'daily', 'highScore', or class containing 'celebration'.
  var SELECTORS = [
    '[id*="overlay-complete"]',
    '[id*="winOverlay"]',
    '[id*="levelComplete"]',
    '[id*="daily-complete"]',
    '[id*="overlay-daily"]',
    '[id*="highScore"]',
    '.celebration',
  ];
  function isVisible(el){
    if (!el) return false;
    var st = window.getComputedStyle(el);
    if (st.display === 'none' || st.visibility === 'hidden') return false;
    if (parseFloat(st.opacity) === 0) return false;
    var r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }

  function injectInto(el, getter, label){
    if (!el) return;
    if (el.querySelector('[data-growth-share-btn]')) return;
    // Round-15.20: append to the INNER card. Each app names its modal
    // card differently — broad pattern match covers all known ones.
    // If `el` itself looks like a card (small fixed-width container,
    // not a full-screen overlay), use it directly.
    var card = el.querySelector(
      '.overlay-box, .overlay-card, .overlay-content, ' +
      '.win-card, .win-box, .modal-card, .modal-content, ' +
      '.card, .modal, .ls-card, .confirm-card, ' +
      '[class*="-card"], [class*="-content"], [class*="overlay-box"]'
    );
    var target = card || el;
    var btn = buildShareButton(label, getter);
    target.appendChild(btn);
  }

  function scan(){
    for (var i=0;i<SELECTORS.length;i++){
      var els = document.querySelectorAll(SELECTORS[i]);
      for (var j=0;j<els.length;j++){
        if (!isVisible(els[j])) continue;
        var id = (els[j].id || '').toLowerCase();
        if (id.indexOf('daily') >= 0) {
          injectInto(els[j], composeDaily, '🔁 Share daily result');
        } else if (id.indexOf('highscore') >= 0 || id.indexOf('high') >= 0) {
          injectInto(els[j], compose2048Score, '🔁 Share new high score');
        } else {
          var getter = IS_SCORE() ? compose2048Score : composeWin;
          injectInto(els[j], getter, '🔁 Share win');
        }
      }
    }
  }
  setInterval(scan, 800);
})();
</script>

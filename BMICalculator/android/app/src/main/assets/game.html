<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BMI Calculator</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#2196F3; --accent2:#1565C0; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
input[type=number] { width:100%; background:var(--card); border:none; color:var(--text); font-size:1rem; padding:10px 12px; border-radius:8px; outline:none; margin-bottom:12px; }
input[type=number]:focus { box-shadow:0 0 0 2px var(--accent); }
.toggle-row { display:flex; background:var(--card); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.toggle-btn { flex:1; min-height:44px; background:transparent; border:none; color:var(--muted); font-size:0.9rem; font-weight:600; cursor:pointer; }
.toggle-btn.active { background:var(--accent); color:#fff; }
.toggle-btn.btn-pressed { opacity:0.7; }
.bmi-display { text-align:center; margin:12px 0; }
.bmi-number { font-size:3.5rem; font-weight:700; color:var(--accent); line-height:1; }
.bmi-cat { font-size:1.2rem; font-weight:600; margin-top:6px; }
.bmi-bar-wrap { margin-top:14px; }
.bmi-bar-track { height:18px; border-radius:9px; overflow:hidden; display:flex; }
.bmi-bar-under { flex:18.5; background:#2196F3; }
.bmi-bar-normal { flex:6.5; background:#4CAF50; }
.bmi-bar-over { flex:5; background:#FF9800; }
.bmi-bar-obese { flex:10; background:#F44336; }
.bmi-labels { display:flex; justify-content:space-between; margin-top:4px; font-size:0.65rem; color:var(--muted); }
.bmi-marker-wrap { position:relative; height:10px; margin-bottom:2px; }
.bmi-marker { position:absolute; width:3px; height:10px; background:#fff; border-radius:2px; transform:translateX(-50%); transition:left 0.3s; }
.height-row { display:flex; gap:8px; }
.height-row input { flex:1; }
.height-row input:last-child { max-width:80px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>BMI <span>Calculator</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Unit System</div>
      <div class="toggle-row">
        <button class="toggle-btn active" id="btn-metric">Metric (kg/cm)</button>
        <button class="toggle-btn" id="btn-imperial">Imperial (lb/ft)</button>
      </div>
    </div>
    <div class="card" id="metric-inputs">
      <div class="card-title">Measurements</div>
      <label>Height (cm)</label>
      <input type="number" id="height-cm" placeholder="170" min="50" max="300">
      <label>Weight (kg)</label>
      <input type="number" id="weight-kg" placeholder="70" min="1" max="500">
    </div>
    <div class="card" id="imperial-inputs" style="display:none;">
      <div class="card-title">Measurements</div>
      <label>Height</label>
      <div class="height-row">
        <input type="number" id="height-ft" placeholder="Feet" min="1" max="9">
        <input type="number" id="height-in" placeholder="Inches" min="0" max="11">
      </div>
      <label>Weight (lbs)</label>
      <input type="number" id="weight-lb" placeholder="154" min="1" max="1000">
    </div>
    <div class="card">
      <div class="card-title">Your BMI</div>
      <div class="bmi-display">
        <div class="bmi-number" id="bmi-val">—</div>
        <div class="bmi-cat" id="bmi-cat">Enter measurements</div>
      </div>
      <div class="bmi-bar-wrap">
        <div class="bmi-marker-wrap"><div class="bmi-marker" id="bmi-marker" style="left:0%;"></div></div>
        <div class="bmi-bar-track">
          <div class="bmi-bar-under"></div>
          <div class="bmi-bar-normal"></div>
          <div class="bmi-bar-over"></div>
          <div class="bmi-bar-obese"></div>
        </div>
        <div class="bmi-labels">
          <span>Underweight</span><span>Normal</span><span>Overweight</span><span>Obese</span>
        </div>
      </div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, isMetric:true };
var catColors = { 'Underweight':'#2196F3','Normal weight':'#4CAF50','Overweight':'#FF9800','Obese':'#F44336' };

function calc(){
  var bmi = null;
  if(state.isMetric){
    var h = parseFloat(document.getElementById('height-cm').value);
    var w = parseFloat(document.getElementById('weight-kg').value);
    if(h>0 && w>0) bmi = w / ((h/100)*(h/100));
  } else {
    var ft = parseFloat(document.getElementById('height-ft').value)||0;
    var ins = parseFloat(document.getElementById('height-in').value)||0;
    var totalIn = ft*12 + ins;
    var lb = parseFloat(document.getElementById('weight-lb').value)||0;
    if(totalIn>0 && lb>0) bmi = (lb * 703) / (totalIn * totalIn);
  }
  var bmiEl = document.getElementById('bmi-val');
  var catEl = document.getElementById('bmi-cat');
  var marker = document.getElementById('bmi-marker');
  if(bmi === null || isNaN(bmi)){
    bmiEl.textContent = '—'; catEl.textContent = 'Enter measurements';
    catEl.style.color = 'var(--muted)'; marker.style.left = '0%'; return;
  }
  bmiEl.textContent = bmi.toFixed(1);
  var cat, pct;
  if(bmi < 18.5){ cat='Underweight'; pct = (bmi/18.5)*23; }
  else if(bmi < 25){ cat='Normal weight'; pct = 23 + ((bmi-18.5)/6.5)*16; }
  else if(bmi < 30){ cat='Overweight'; pct = 39 + ((bmi-25)/5)*13; }
  else { cat='Obese'; pct = 52 + Math.min(((bmi-30)/10)*48, 48); }
  catEl.textContent = cat;
  catEl.style.color = catColors[cat]||'var(--text)';
  bmiEl.style.color = catColors[cat]||'var(--accent)';
  marker.style.left = Math.min(Math.max(pct,1),99)+'%';
  maybeInterstitial();
}

['height-cm','weight-kg','height-ft','height-in','weight-lb'].forEach(function(id){
  var el = document.getElementById(id);
  if(el) el.addEventListener('input', calc);
});

document.getElementById('btn-metric').addEventListener('click',function(){
  state.isMetric = true;
  this.classList.add('active');
  document.getElementById('btn-imperial').classList.remove('active');
  document.getElementById('metric-inputs').style.display='';
  document.getElementById('imperial-inputs').style.display='none';
  calc();
});
document.getElementById('btn-imperial').addEventListener('click',function(){
  state.isMetric = false;
  this.classList.add('active');
  document.getElementById('btn-metric').classList.remove('active');
  document.getElementById('metric-inputs').style.display='none';
  document.getElementById('imperial-inputs').style.display='';
  calc();
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

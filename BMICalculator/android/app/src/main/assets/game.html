/* The embedded font carries Latin-1 only; scripts it lacks use the system face for whole words (Turkish too, so ğ/ş never mix faces). */
html[lang^="tr"]{--font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:2px;min-height:var(--appbar-h);padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;padding-inline-start:16px;background:var(--bg)}
.appbar.has-back{padding-inline-start:4px}
.ab-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ab-title{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sub{font-size:.82rem;font-weight:600;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:3rem;height:3rem;min-width:48px;min-height:48px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-grid;place-items:center;padding:0;transition:background .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.tint{color:var(--accent)}
[dir="rtl"] .flip{transform:scaleX(-1)}
#view:focus,.sheet:focus,.dialog:focus{outline:none}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:auto}
.page{max-width:760px;margin:0 auto;padding:4px 16px 28px}
/* Bottom nav = the utility 'footer': symmetric padding + safe-area inset + 6px buffer above
   the native banner (the banner lives outside the WebView, below it). */
.nav{flex:0 0 auto;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding:clamp(2px,.6vh,6px) 8px calc(clamp(2px,.6vh,6px) + env(safe-area-inset-bottom,0px) + 6px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav-btn{flex:1 1 0;min-width:0;min-height:var(--nav-h);border:0;background:transparent;color:var(--text-mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;padding:6px 2px}
.nav-btn .pill{display:grid;place-items:center;width:3.6rem;height:2rem;border-radius:1rem;transition:background .2s,color .2s}
.nav-btn[aria-current="page"]{color:var(--text)}
.nav-btn[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.nav-btn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cards, lists, rows */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card+.card,.group+.group{margin-top:14px}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.sec-h:first-child{margin-top:10px}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:3.5rem;padding:10px 16px;border:0;background:transparent;text-align:start;color:var(--text);font-size:1rem}
.group .row+.row,.group .row+.row-x,.group .row-x+.row{border-top:1px solid var(--border)}
button.row:active{background:var(--surface-2)}
.row .ri{width:2.25rem;height:2.25rem;border-radius:11px;display:grid;place-items:center;background:var(--menu-tile-bg);color:var(--menu-tile-fg);border:1px solid var(--menu-tile-border);flex:none}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rl{font-weight:650;overflow-wrap:break-word}
.row .rs{font-size:.84rem;color:var(--text-mute);overflow-wrap:break-word}
.row select.inp{width:42%;max-width:240px;min-height:2.75rem;flex:none;padding-inline:12px}
.row .rv{color:var(--text-mute);font-weight:650;font-size:.92rem;flex:none;max-width:45%;text-align:end}
.row .chev{color:var(--text-faint)}
.row-x{padding:12px 16px}
.row.danger,.row.danger .ri{color:var(--danger)}
.row.danger .ri{background:transparent;border:1.5px solid currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:transparent;color:var(--success);border:1.5px solid currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;min-width:48px;padding:0 20px;border-radius:14px;border:0;font-weight:750;font-size:1rem;line-height:1.15;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--g-play);color:var(--on-accent);box-shadow:0 6px 18px -6px var(--accent)}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-neutral{background:var(--btn-neutral-bg);color:var(--text)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}

/* form controls */
.field{display:block;margin:0 0 16px}
.field>.fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.inp{width:100%;min-height:3rem;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:1rem}
.inp::placeholder{color:var(--text-faint)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:6.5rem;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface-2);width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:2.75rem;border:0;border-radius:11px;background:transparent;color:var(--text-mute);font-weight:750;font-size:.88rem;line-height:1.15;padding:4px;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.switch{position:relative;flex:none;width:3.25rem;height:2rem;min-width:52px;border-radius:1rem;border:0;background:var(--border-strong);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(2rem - 6px);height:calc(2rem - 6px);border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(1.25rem)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-1.25rem)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:3rem;height:3rem;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center}
.sw i{width:2.1rem;height:2.1rem;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--text)}
.sw .lk{position:absolute;inset-inline-end:2px;bottom:2px;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.stepper button{width:2.75rem;height:2.75rem;min-width:44px;border-radius:11px;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper output{min-width:2.6rem;text-align:center;font-weight:800;font-size:1.15rem}

/* layers: sheets, dialogs, onboarding, toast */
.layer{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center}
.layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;border:0;padding:0;width:100%}
.layer.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.in .sheet{transform:none}
.sheet.full{height:calc(100% - 24px)}
.sheet-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0;padding-inline-start:20px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:1.2rem;font-weight:800;min-width:0}
.grab{position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px 20px 16px;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1 1 140px}
.layer.center{align-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:400px;background:var(--surface);color:var(--text);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:22px 20px 16px;transform:scale(.94);opacity:0;transition:transform .2s,opacity .2s}
.layer.in .dialog{transform:none;opacity:1}
.dialog h2{margin:0 0 8px;font-size:1.2rem;font-weight:800}
.dialog p{margin:0 0 18px;color:var(--text-mute)}
.dialog .btn-row{justify-content:flex-end}
.dialog .btn-row .btn{flex:0 1 auto}
#toast{position:fixed;left:50%;bottom:calc(var(--toast-b,16px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);z-index:var(--z-critical);width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;padding-inline:18px 8px;min-height:3.25rem;border-radius:16px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:650;font-size:.95rem}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .tm{flex:1;min-width:0;padding:6px 0}
#toast .ta{border:0;background:transparent;color:var(--bg);font-weight:850;min-height:44px;padding:0 14px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
.onb{position:fixed;inset:0;z-index:var(--z-tutorial);background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.onb-top{display:flex;justify-content:flex-end;padding:0 8px}
.onb-track{flex:1;display:flex;overflow:hidden;touch-action:pan-y}
.onb-card{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.onb-art{width:min(68vw,260px);height:min(68vw,260px);margin-bottom:28px}
.onb-art svg{width:100%;height:100%}
.onb h2{margin:0 0 10px;font-size:1.6rem;font-weight:850;letter-spacing:-.015em;max-width:440px}
.onb p{margin:0;color:var(--text-mute);font-size:1.05rem;max-width:400px}
.onb-foot{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border-strong);transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--accent)}
.onb-foot .btn{width:min(100%,420px)}
.empty{text-align:center;padding:28px 18px 8px}
.empty .ea{width:132px;height:132px;margin:0 auto 14px}
.empty h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.empty p{margin:0 auto 18px;color:var(--text-mute);max-width:360px}
.pro-hero{text-align:center;padding:2px 0 8px}
.pro-hero .em{width:84px;height:84px;margin:0 auto 10px}
.pro-hero h3{margin:0;font-size:1.4rem;font-weight:850}
.pro-hero p{margin:6px 0 0;color:var(--text-mute)}
.feat{list-style:none;margin:14px 0 6px;padding:0}
.feat li{display:flex;align-items:center;gap:12px;padding:9px 2px;font-weight:650}
.feat li .ri{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fine{font-size:.82rem;color:var(--text-mute);text-align:center;margin:10px 0 0}
.about-foot{text-align:center;color:var(--text-mute);font-size:.82rem;margin:22px 0 4px}
.lock-chip{display:inline-flex;align-items:center;gap:4px}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (min-width:600px){html{font-size:calc(17px * var(--fs))}.page{padding:8px 24px 32px}.appbar{padding-inline:20px 12px}.sheet-body,.sheet-foot{padding-inline:28px}}
@media (min-width:900px){html{font-size:calc(18px * var(--fs))}:root{--appbar-h:4rem}.ab-title{font-size:1.5rem}}

/*@@REGION TOOL_CSS*/
/* BMI Calculator tool styles. Tokens only; logical properties for RTL. */
.unitbar{margin-bottom:12px}
.frm{display:flex;flex-wrap:wrap;gap:12px;padding:16px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.frm .field{flex:1 1 9.5rem;margin:0;min-width:0}
.frm .field.wide{flex-basis:100%}
.frm .inp{font-variant-numeric:tabular-nums}
.frm .pair{display:flex;gap:8px}
.frm .pair .inp{min-width:0}
.ufx{display:flex;align-items:center;gap:8px}
.ufx .inp{flex:1;min-width:0}
.ufx .un{flex:none;min-width:2.1rem;font-weight:700;color:var(--text-mute);font-size:.9rem}
.msg{padding:12px 14px;margin-bottom:12px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--text);font-weight:650;border:1px solid var(--border);overflow-wrap:anywhere}
.msg.err{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.res{padding:18px 16px 16px;margin-bottom:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1)}
.res .rl{font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.res .rbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 8px}
.res .rbig b{font-size:clamp(2.8rem,15vw,4rem);line-height:1.05;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.res .rbig span{font-weight:700;color:var(--text-mute)}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 14px 7px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border-strong);font-weight:750;overflow-wrap:anywhere}
.chip i{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--b-ok)}
.chip.bd-u i{background:var(--b-under)}.chip.bd-o i{background:var(--b-over)}.chip.bd-b i{background:var(--b-obese)}
.gauge{position:relative;margin:20px 6px 34px;direction:ltr}
.gbar{display:flex;height:.9rem;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-strong)}
.gbar i{display:block;height:100%}
.gbar .g1{background:var(--b-under)}.gbar .g2{background:var(--b-ok)}.gbar .g3{background:var(--b-over)}.gbar .g4{background:var(--b-obese)}
.gmk{position:absolute;top:-6px;width:1.5rem;height:1.5rem;margin-inline-start:-.75rem;border-radius:50%;background:var(--surface);border:4px solid var(--b-mark);box-shadow:var(--shadow-1)}
.gtk{position:absolute;top:1.15rem;margin-inline-start:-1.2rem;width:2.4rem;text-align:center;font-size:.76rem;font-weight:700;color:var(--text-mute);font-variant-numeric:tabular-nums}
.gtk::before{content:"";position:absolute;left:50%;top:-.3rem;width:1px;height:.3rem;background:var(--border-strong)}
.fine{font-size:.8rem;color:var(--text-faint);margin:6px 4px 14px;overflow-wrap:anywhere}
.res .fine{margin:4px 0 0}
.card{padding:16px;margin-bottom:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1)}
.card h3{margin:0 0 6px;font-size:1rem;font-weight:800}
.card p{margin:0 0 6px;overflow-wrap:anywhere}
.card .big{font-size:1.5rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.card .fine{text-align:start}
.card .hint{color:var(--text-mute);font-size:.9rem}
.badge.est{background:transparent;border:1.5px solid var(--accent);color:var(--accent);margin-inline-start:8px;vertical-align:middle}
.savebar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.savebar .btns{display:flex;gap:10px;flex-wrap:wrap}
.savebar .btn{flex:1 1 9rem;height:auto;padding:8px 12px;line-height:1.2;text-align:center}
.savebar .btn-primary{flex-basis:100%}
.collapse{display:flex;align-items:center;gap:8px;width:100%;min-height:3rem;padding:6px 6px;border:0;background:transparent;color:var(--text);font-weight:800;text-align:start}
.collapse svg{transition:transform .2s}
.collapse[aria-expanded="true"] svg{transform:rotate(90deg)}
html[dir="rtl"] .collapse svg{transform:scaleX(-1)}
html[dir="rtl"] .collapse[aria-expanded="true"] svg{transform:scaleX(-1) rotate(90deg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);min-width:0}
.tile b{display:block;font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{display:block;font-size:.8rem;font-weight:650;color:var(--text-mute);overflow-wrap:anywhere}
.chart{padding:12px 8px 8px;margin-bottom:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1)}
.chart .seg{margin:0 4px 8px;width:calc(100% - 8px)}
.chart svg{display:block;width:100%;height:auto}
.ch-grid{stroke:var(--border);stroke-width:1}
.ch-band{fill:var(--b-ok);opacity:.2}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.ch-last{fill:var(--accent);stroke:var(--accent)}
.ch-goal{stroke:var(--text-mute);stroke-width:1.5;stroke-dasharray:5 4}
.ch-t{fill:var(--text-mute);font-size:10px;font-weight:600;font-family:var(--font)}
.ch-leg{display:flex;gap:14px;flex-wrap:wrap;padding:4px 8px 0;font-size:.78rem;color:var(--text-mute)}
.ch-leg i{display:inline-block;width:.9rem;height:.6rem;margin-inline-end:6px;border-radius:3px;background:var(--b-ok);opacity:.45}
.erow .rt .rs{white-space:normal}
.erow .rv{font-weight:800;color:var(--text)}
.erow .nt{display:block;color:var(--text-mute);font-size:.84rem;font-style:italic;overflow-wrap:anywhere}
.pbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:var(--r);background:var(--accent-soft);color:var(--text)}
.pbar span{flex:1;min-width:0;font-weight:650;font-size:.92rem}
.pbar .btn{min-height:2.75rem;padding:0 14px}
.prog{height:.9rem;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;border-radius:999px;background:var(--g-play)}
.gl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.gl span{color:var(--text-mute);font-weight:650}
.gdone{color:var(--success);font-weight:800}

  uk: {"tab_calc":"ІМТ","tab_hist":"Історія","tab_goal":"Мета","calc_sub":"Метрична чи імперська, наживо","ob1_t":"Ваш ІМТ, поки ви вводите","ob1_b":"Введіть зріст і вагу в метричних або імперських одиницях і побачте ІМТ, його категорію ВООЗ та діапазон ваги для вашого зросту.","ob2_t":"Стежте за динамікою","ob2_b":"Зберігайте вимірювання з нотаткою та дивіться графік ІМТ і ваги в часі. Усе лишається на цьому телефоні.","ob3_t":"Знайте межі","ob3_b":"ІМТ — це скринінговий показник, а не діагноз. Він не підходить для дітей, під час вагітності та для спортсменів. Застосунок не дає медичних порад; про своє здоров'я говоріть із фахівцем.","pro_f1":"Необмежена історія (безкоштовно: 30 вимірювань)","pro_f2":"Експорт історії в CSV","pro_f3":"Додаткові акцентні кольори","pro_f4":"Без реклами","acc_teal":"Бірюзовий","acc_indigo":"Індиго","acc_plum":"Слива","acc_sunset":"Захід сонця","csv_pro":"Експорт у CSV входить до Pro.","limit_t":"Безкоштовний план зберігає 30 вимірювань. З Pro історія необмежена.","u_metric":"Метрична","u_imperial":"Імперська","u_kg":"кг","u_lb":"фнт","u_cm":"см","u_ft":"фут","u_in":"дюйм","f_weight":"Вага","f_height":"Зріст","f_age":"Вік (роки)","f_sex":"Стать (для формули)","sex_f":"Жіноча","sex_m":"Чоловіча","f_note":"Нотатка (необов'язково)","f_note_ph":"напр. після відпустки","need_t":"Введіть зріст і вагу","need_b":"Ваш ІМТ і його категорія з'являться тут, поки ви вводите.","need_first":"Спершу введіть зріст і вагу.","err_w":"Вага має бути від {min} до {max}","err_h":"Зріст має бути від 50 до 260 см (від 1 фут 8 дюйм до 8 фут 6 дюйм).","your_bmi":"Ваш ІМТ","bmi_unit":"кг/м²","band_u3":"Виражений дефіцит маси","band_u2":"Помірний дефіцит маси","band_u1":"Легкий дефіцит маси","band_n":"Нормальний діапазон","band_o":"Передожиріння (діапазон надмірної ваги)","band_o1":"Ожиріння I класу","band_o2":"Ожиріння II класу","band_o3":"Ожиріння III класу","cat_line":"За класифікацією ІМТ для дорослих ВООЗ це значення належить до категорії «{band}».","gauge_ari // ── Theme, text size, motion ─────────────────────────────────────────
function accentDef(id) { return APP.accents.find(a => a.id === id) || APP.accents[0]; }
function canUseProThemes() { return isPro() || S.proTrialUntil > NOW(); }
function effectiveAccent() { const a = accentDef(S.settings.accent); return (a.pro && !canUseProThemes()) ? APP.accents[0].id : a.id; }
function isDark() { return S.settings.theme === 'dark' || (S.settings.theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme() {
  const h = document.documentElement;
  h.dataset.theme = isDark() ? 'dark' : 'light';
  h.dataset.accent = effectiveAccent();
  const rm = S.settings.reduceMotion || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  h.classList.toggle('reduce-motion', !!rm);

}
function reducedMotion() { return document.documentElement.classList.contains('reduce-motion'); }
function applyFontScale() {

}
function haptic(kind) {

  if (A && typeof A.haptic === 'function') { try { A.haptic(kind || 'tap'); return; } catch (e) {} }
  try { if (navigator.vibrate) navigator.vibrate(kind === 'success' ? [14, 60, 24] : kind === 'reject' ? [30, 40, 30] : 10); } catch (e) {}
}
function announce(msg) { const r = $('#sr'); if (r) { r.textContent = ''; setTimeout(() => { r.textContent = msg; }, 30); } }

// ── Actions: every tappable element is <… data-act="name" data-arg="…">.
// The tool registers its own handlers in ACT. No inline onclick strings. ──
const ACT = {};
const CHANGE = {};
const INPUT = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) { console.warn('no action', el.dataset.act); return; }
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') UI.back(); });

// ── Navigation / app bar / layers ────────────────────────────────────
const SHELL_SCREENS = {};
const UI = {
  stack: [], layers: [], _toastT: 0,
  cur() { return this.stack[this.stack.length - 1]; },
  def(id) { return SHELL_SCREENS[id] || TOOL.screens[id]; },
  tab(id) { this.stack = [{ id: id, params: {} }]; this.render(true); },
  go(id, params) { const c = this.cur(); if (c) c.scroll = $('#view').scrollTop; this.stack.push({ id: id, params: params || {} }); this.render(true); },
  back() {
    if (this.layers.length) { this.closeLayer(); return true; }
    if (this.stack.length > 1) { const leaving = this.stack.pop(); const d = this.def(leaving.id); if (d && d.onLeave) d.onLeave(leaving.params); this.render(true, true); return true; }
    if (this.cur() && this.cur().id !== APP.tabs[0].id) { this.tab(APP.tabs[0].id); return true; }
    return false;
  },
  refresh() { this.render(false); },
  render(reset, popped) {
    const e = this.cur(), d = this.def(e.id), view = $('#view');
    const keep = view.scrollTop, depth = this.stack.length;
    const bb = $('#ab-back');
    bb.hidden = depth < 2; $('#appbar').classList.toggle('has-back', depth > 1);
    bb.innerHTML = icon('back', 24, 'flip'); bb.setAttribute('aria-label', t('back'));
    $('#ab-title').textContent = d.title ? d.title(e.params) : APP.name;
    const sub = d.subtitle ? d.subtitle(e.params) : '';
    $('#ab-sub').textContent = sub || ''; $('#ab-sub').hidden = !sub;
    const acts = (d.actions ? d.actions(e.params) : []).slice();
    if (depth === 1) acts.push({ icon: 'gear', label: t('settings'), act: 'go', arg: 'settings' });
    $('#ab-actions').innerHTML = acts.map(a => '<button class="icon-btn' + (a.tint ? ' tint' : '') + '" data-act="' + a.act + '"' + (a.arg != null ? ' data-arg="' + esc(a.arg) + '"' : '') + ' aria-label="' + esc(a.label) + '">' + icon(a.icon) + '</button>').join('');
    const showNav = depth === 1 && APP.tabs.length > 1;
    $('#nav').hidden = !showNav;
    $$('.nav-btn').forEach(b => { b.setAttribute('aria-current', b.dataset.arg === e.id ? 'page' : 'false'); b.setAttribute('aria-selected', b.dataset.arg === e.id ? 'true' : 'false'); });
    document.documentElement.style.setProperty('--toast-b', showNav ? 'calc(var(--nav-h) + 14px)' : '16px');
    view.innerHTML = '<div class="page" data-screen="' + esc(e.id) + '"></div>';
    try { d.render(view.firstChild, e.params); }
    catch (err) { view.firstChild.innerHTML = UI.empty({ icon: 'info', title: t('err_t'), body: t('err_b') }); setTimeout(() => { throw err; }, 0); }
    view.scrollTop = reset ? (popped ? (e.scroll || 0) : 0) : keep;
    if (reset) { try { view.focus({ preventScroll: true }); } catch (x) {} }
  },
  buildNav() {
    $('#nav-in').innerHTML = APP.tabs.map(tb => '<button class="nav-btn" role="tab" data-act="tab" data-arg="' + tb.id + '"><span class="pill">' + icon(tb.icon) + '</span><span>' + esc(t(tb.label)) + '</span></button>').join('');
  },
  empty(o) {
    return '<div class="empty">' + (o.art ? '<div class="ea">' + o.art + '</div>' : (o.icon ? '<div class="ea" style="display:grid;place-items:center;color:var(--accent)">' + icon(o.icon, 64) + '</div>' : '')) +
      '<h3>' + esc(o.title) + '</h3>' + (o.body ? '<p>' + esc(o.body) + '</p>' : '') +
      (o.cta ? '<button class="btn btn-primary" data-act="' + o.act + '"' + (o.arg ? ' data-arg="' + esc(o.arg) + '"' : '') + '>' + icon('plus', 20) + esc(o.cta) + '</button>' : '') + '</div>';
  },
  // Bottom sheet. o: {title, body (html), foot (html), full, cls, onClose}. Returns the sheet element.
  sheet(o) {
    const L = document.createElement('div');
    L.className = 'layer';
    L.innerHTML = '<button class="scrim" data-act="close-layer" tabindex="-1" aria-label="' + esc(t('close')) + '"></button>' +
      '<div class="sheet' + (o.full ? ' full' : '') + (o.cls ? ' ' + o.cls : '') + '" tabindex="-1" role="dialog" aria-modal="true" aria-label="' + esc(o.title || '') + '">' +
      '<div class="grab"></div><div class="sheet-head"><h2>' + esc(o.title || '') + '</h2><button class="icon-btn" data-act="close-layer" aria-label="' + esc(t('close')) + '">' + icon('close') + '</button></div>' +
      '<div class="sheet-body">' + (o.body || '') + '</div>' + (o.foot ? '<div class="sheet-foot">' + o.foot + '</div>' : '') + '</div>';
    return this._push(L, o);
  },
  dialog(o) {
    const L = document.createElement('div');
    L.className = 'layer center';
    L.innerHTML = '<button class="scrim" data-act="close-layer" tabindex="-1" aria-label="' + esc(t('close')) + '"></button><div class="dialog" tabindex="-1" role="alertdialog" aria-modal="true">' + o.html + '</div>';
    return this._push(L, o);
  },
  _push(L, o) {
    $('#layers').appendChild(L);
    const rec = { el: L, onClose: o.onClose, prevFocus: document.activeElement };
    this.layers.push(rec);
    requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add('in')));
    setTimeout(() => { const f = L.querySelector('[autofocus]') || L.querySelector('.sheet, .dialog'); if (f) try { f.focus({ preventScroll: true }); } catch (e) {} }, 60);
    return L.querySelector('.sheet, .dialog');
  },
  closeLayer(silent) {
    const rec = this.layers.pop(); if (!rec) return;
    rec.el.classList.remove('in');
    setTimeout(() => rec.el.remove(), reducedMotion() ? 0 : 260);
    if (rec.prevFocus && rec.prevFocus.focus) try { rec.prevFocus.focus({ preventScroll: true }); } catch (e) {}
    if (!silent && rec.onClose) rec.onClose();
  },
  closeAll() { while (this.layers.length) this.closeLayer(true); },
  // Promise<boolean>. o: {title, body, ok, cancel, danger}
  confirm(o) {
    return new Promise(res => {
      let done = false;
      const fin = v => { if (done) return; done = true; res(v); };
      const id = uid('c');
      ACT['cf-' + id] = el => { const v = el.dataset.arg === '1'; UI.closeLayer(true); delete ACT['cf-' + id]; fin(v); };
      this.dialog({ html: '<h2>' + esc(o.title) + '</h2>' + (o.body ? '<p>' + esc(o.body) + '</p>' : '') +
        '<div class="btn-row"><button class="btn btn-ghost" data-act="cf-' + id + '" data-arg="0">' + esc(o.cancel || t('cancel')) + '</button>' +
        '<button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-act="cf-' + id + '" data-arg="1">' + esc(o.ok || t('ok')) + '</button></div>',
        onClose: () => { delete ACT['cf-' + id]; fin(false); } });
    });
  },
  // Snackbar. o: {action, onAction, ms}
  toast(msg, o) {
    o = o || {};
    const T = $('#toast'), a = T.querySelector('.ta');
    T.querySelector('.tm').textContent = msg;
    a.hidden = !o.action; a.textContent = o.action || '';
    a.onclick = o.action ? (ev => { ev.stopPropagation(); T.classList.remove('show'); o.onAction && o.onAction(); }) : null;
    T.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => T.classList.remove('show'), o.ms || (o.action ? 6000 : 2800));
  },
};
ACT.go = el => UI.go(el.dataset.arg);
ACT.tab = el => { haptic('tap'); UI.tab(el.dataset.arg); };
ACT.back = () => UI.back();
ACT['close-layer'] = () => UI.closeLayer();

// ── Monetization ─────────────────────────────────────────────────────
// Catalog == metadata/iaps.json == MainActivity.VALID_PRODUCTS. Both are
// non-consumable; Pro includes ad-free. No subscriptions in the utility shell.
const PRICES = Object.assign({}, APP.prices);
function isPro() { return S.pro === true; }
function adsRemoved() { return S.removeAds === true || isPro(); }
function grant(id) {
  const was = { ads: S.removeAds, pro: S.pro };
  switch (id) {
    case 'remove_ads': S.removeAds = true; break;
    case 'pro_lifetime': S.pro = true; S.removeAds = true; break;
    default: return false;
  }
  persist(); Ads.banner(); applyTheme();
  if (was.ads !== S.removeAds || was.pro !== S.pro) {
    UI.toast(t('thanks')); haptic('success');
    if (UI.layers.length && $('.layer:last-child .pro-hero')) UI.closeLayer(true);
    if (TOOL.onGrant) TOOL.onGrant(id);
    UI.refresh();
  }
  return true;
}
function iapDeferGrant(id) {
  try { const p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); p[id] = NOW(); localStorage.setItem('pendingGrants', JSON.stringify(p)); } catch (e) {}
}
window.iapDeferGrant = iapDeferGrant;
// Java billing bridge → here for every PURCHASED (and every restored) SKU. Never throws.
window.onPurchaseSuccess = function (id) {
  try { if (!grant(String(id))) iapDeferGrant(String(id)); }
  catch (e) { try { console.warn('IAP grant error', id, e); } catch (x) {} iapDeferGrant(String(id)); }
};
window.onPurchaseComplete = window.onPurchaseSuccess;
// Unknown SKUs bought before their mechanic existed are replayed once it does.
window.replayPendingGrants = function () {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch (e) { return; }
  const ids = Object.keys(p); if (!ids.length) return;
  const left = {};
  ids.forEach(id => { let ok = false; try { ok = grant(id); } catch (e) {} if (!ok) left[id] = p[id]; });
  try { if (Object.keys(left).length) localStorage.setItem('pendingGrants', JSON.stringify(left)); else localStorage.removeItem('pendingGrants'); } catch (e) {}
};
let restoreAsked = false;
window.onRestoreComplete = function (n) { if (restoreAsked) { restoreAsked = false; UI.toast((n | 0) > 0 ? t('restored') : t('nothing_restore')); } };
window.onLocalizedPrices = function (map) { try { Object.assign(PRICES, map || {}); if ($('.pro-hero')) Pro.fill(); } catch (e) {} };
window.onPurchaseUnavailable = function () { UI.toast(t('store_unavail')); };
function buy(id) {
  if (!bridge()) { UI.toast(t('store_unavail')); return; }
  haptic('tap'); callA('purchase', id);
}
function restorePurchases() { restoreAsked = true; UI.toast(t('restoring')); if (!bridge()) { setTimeout(() => window.onRestoreComplete(0), 400); return; } callA('restorePurchases'); }
ACT.buy = el => buy(el.dataset.arg);
ACT.restore = () => restorePurchases();

const Pro = {
  reason: '',
  // Paywall sheet; reason = i18n key of the one-line "why" (e.g. a locked feature).

    const owned = isPro();
    el.innerHTML = '<div class="pro-hero"><div class="em">' + (ART.emblem || '') + '</div><h3>' + esc(t('pro_title', { app: APP.name })) + '</h3>' +
      '<p>' + esc(owned ? t('pro_active') : (this.reason ? t(this.reason) : t('pro_sub'))) + '</p></div>' +
      '<ul class="feat">' + APP.proFeatures.map(k => '<li><span class="ri">' + icon('check', 18) + '</span><span>' + esc(t(k)) + '</span></li>').join('') + '</ul>' +
      (owned ? '<button class="btn btn-secondary btn-block" data-act="close-layer">' + esc(t('done')) + '</button>' :

        (S.removeAds ? '' : '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="buy" data-arg="remove_ads">' + esc(t('ads_buy', { price: PRICES.remove_ads })) + '</button>') +

// Ads: banner always (unless ad-free); interstitial ONLY at natural breaks,
// never in the first session, >= 3 min apart, >= 2 breaks between ads,
// never for Remove-Ads / Pro owners. Rewarded = opt-in only.
const Ads = {
  pending: null,
  banner() { callA(adsRemoved() ? 'hideBannerAd' : 'showBannerAd'); },
  naturalBreak(reason) {
    if (!APP.interstitials || adsRemoved() || !bridge()) return false;
    if (S.sessions < 2) return false;                         // never in the first session
    S.ads.breaks = (S.ads.breaks | 0) + 1;
    const sinceInterstitialMs = NOW() - (S.ads.last || 0);
    if (S.ads.breaks >= 2 && sinceInterstitialMs >= 180000) {  // >=2 breaks AND >=3 min since the last one
      S.ads.breaks = 0; S.ads.last = NOW(); persist();
      callA('showInterstitial');
      return true;
    }
    persist();
    return false;
  },
  // Opt-in rewarded video. type must be in MainActivity.VALID_REWARD_TYPES.
  rewarded(type, onReward) {
    if (!bridge()) { UI.toast(t('ad_not_ready')); return; }
    this.pending = { type: type, cb: onReward };
    callA('showRewarded', type);
  },
  preload() { callA('preloadRewarded'); },
};
// The reward is granted ONLY here (never on dismiss), once, to the caller that asked.
window.onAdReward = function(type) {
  const p = Ads.pending; Ads.pending = null;
  if (p && p.type === type && p.cb) { try { p.cb(); } catch (e) {} }
};
window.onAdNotReady = function () { if (Ads.pending) { Ads.pending = null; UI.toast(t('ad_not_ready')); } };
window.onAdDismissed = function () { Ads.pending = null; };
window.onAdMobLoaded = function () { Ads.banner(); };

// ── Reminders (Java NotificationHelper; slot 0 = app-wide daily) ─────
// Permission is asked IN CONTEXT only — after the user switches a reminder on.
const Reminders = {
  _res: null,
  ensurePermission() {
    return new Promise(res => {
      if (!bridge()) return res(true);
      if (callA('hasNotificationPermission') === true) return res(true);
      this._res = res; callA('requestNotificationPermission');
    });
  },
  set(slot, h, m, daysMask, title, body) {
    const A = bridge();
    if (A && typeof A.scheduleReminder === 'function') callA('scheduleReminder', slot, h, m, daysMask & 127, title, body);
    else if (slot === 0) callA('scheduleDailyReminder', h, m);
  },
  // One-shot (yearly=false) or yearly reminder at a local date-time —
  // birthdays, bills, events. `when` = Date or epoch ms.
  setAt(slot, when, yearly, title, body) {
    const ms = (when instanceof Date) ? when.getTime() : +when;
    if (!isFinite(ms)) return;
    callA('scheduleDatedReminder', slot, ms, !!yearly, title, body);
  },
  async enableAt(slot, when, yearly, title, body) {
    const ok = await this.ensurePermission();
    if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return false; }
    this.setAt(slot, when, yearly, title, body); return true;
  },
  cancel(slot) { callA('cancelReminder', slot); },
  // Turn one on: permission first; false (and a settings hint) when refused.
  async enable(slot, h, m, daysMask, title, body) {
    const ok = await this.ensurePermission();
    if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return false; }
    this.set(slot, h, m, daysMask, title, body); return true;
  },
  syncDaily() {
    if (!APP.reminder) return;
    const d = S.settings.daily;
    if (d.on) this.set(0, d.h, d.m, 127, APP.name, t(APP.reminder.body)); else this.cancel(0);
  },
};
window.onNotificationPermissionResult = function (g) { const r = Reminders._res; Reminders._res = null; if (r) r(!!g); };

// ── Data: local-only; export = JSON text via the share sheet / clipboard ──
const Data = {
  payload() {
    return JSON.stringify({ app: APP.pkg, kind: 'backup', v: SAVE_VERSION, at: new Date(NOW()).toISOString(), settings: S.settings, tool: S.tool });
  },
  share(text, subject) { if (bridge()) callA('shareText', text); else this.copy(text); },
  copy(text) {
    let ok = false;
    if (bridge()) { callA('copyToClipboard', text); ok = true; }
    else if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); ok = true; }
    UI.toast(ok ? t('copied') : t('store_unavail'));
  },
  async paste() {
    const v = callA('readClipboard');
    if (typeof v === 'string' && v) return v;
    try { if (navigator.clipboard) return await navigator.clipboard.readText(); } catch (e) {}
    return '';
  },
  parse(text) {
    let o; try { o = JSON.parse(String(text || '').trim()); } catch (e) { return null; }
    if (!o || o.kind !== 'backup' || o.app !== APP.pkg || !o.tool || !TOOL.validateImport(o.tool)) return null;
    return o;
  },
  // Replace tool data (+ prefs) from a backup; purchases are never imported.
  async importText(text) {
    const o = this.parse(text);
    if (!o) { UI.toast(t('imp_bad')); haptic('reject'); return false; }
    const ok = await UI.confirm({ title: t('imp_title'), body: t('imp_confirm'), ok: t('imp_go'), danger: true });
    if (!ok) return false;
    const prev = { tool: clone(S.tool), settings: clone(S.settings) };
    S.tool = TOOL.migrate(o.tool, o.v | 0);
    if (o.settings) { const keep = S.settings.lang; S.settings = migrateSave({ settings: o.settings }).settings; S.settings.lang = keep; }
    persist(); afterDataChange();
    UI.closeAll(); UI.tab(APP.tabs[0].id);
    UI.toast(t('imp_done'), { action: t('undo'), onAction: () => { S.tool = prev.tool; S.settings = prev.settings; persist(); afterDataChange(); UI.refresh(); } });
    return true;

    document.body.appendChild(L);

    tr.addEventListener('pointerdown', e => { x0 = e.clientX; });
    tr.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { const fwd = (dx < 0) !== (document.documentElement.dir === 'rtl'); this.step(fwd ? 1 : -1); } });

  step(d) { const n = APP.onboarding.length; const j = this.i + d; if (j >= n) { this.done(); return; } this.i = clamp(j, 0, n - 1); this.paint(); },

    const L = $('#onb'); if (!L) return;
    const rtl = document.documentElement.dir === 'rtl', n = APP.onboarding.length;
    $$('.onb-card', L).forEach((c, k) => { c.style.transform = 'translateX(' + ((rtl ? 100 : -100) * this.i) + '%)'; c.setAttribute('aria-hidden', k === this.i ? 'false' : 'true'); });
    $$('.dots i', L).forEach((d, k) => d.classList.toggle('on', k === this.i));
    $('#onb-next').textContent = this.i === n - 1 ? t('get_started') : t('next');

  done() {
    const L = $('#onb'); if (L) L.remove();
    if (!S.onboarded) { S.onboarded = true; persist(); if (TOOL.afterOnboarding) TOOL.afterOnboarding(); }
  },
};

// BMI Calculator: pure BMI maths (BM) + three screens (BMI · History · Goal) + pushed entry editor.
// @@BMIMATH BEGIN — pure maths, no DOM, no locale (scripts/check_bmicalculator_math.py runs exactly this block under node).
// Bands: WHO adult BMI classification. The BMI is rounded half-up to one decimal (as displayed) BEFORE it is banded,
// so the number on screen and its category can never disagree: 18.5 / 25 / 30 / 35 / 40 start the upper band.
const BM = (() => {
  const LB = 0.45359237, INCH = 2.54, EPS = 1e-9;
  const isNum = x => typeof x === 'number' && isFinite(x);
  const r1 = x => Math.floor(x * 10 + 0.5 + EPS) / 10;               // round half up, 1 decimal
  const ceil1 = x => Math.ceil(x * 10 - EPS) / 10;
  const floor1 = x => Math.floor(x * 10 + EPS) / 10;
  const kgToLb = kg => kg / LB;
  const lbToKg = lb => lb * LB;
  const ftInToCm = (ft, inch) => (ft * 12 + inch) * INCH;
  const cmToFtIn = cm => {                                            // nearest whole inch, carried into feet
    const total = Math.floor(cm / INCH + 0.5 + EPS), ft = Math.floor(total / 12);
    return { ft: ft, inch: total - ft * 12 };
  };
  const validKg = kg => isNum(kg) && kg >= 2 && kg <= 500;
  const validCm = cm => isNum(cm) && cm >= 50 && cm <= 260;
  const bmi = (kg, cm) => (isNum(kg) && isNum(cm) && kg > 0 && cm > 0) ? kg / ((cm / 100) * (cm / 100)) : null;
  const band = b => {
    if (!isNum(b)) return null;
    const v = r1(b);
    return v < 16 ? 'u3' : v < 17 ? 'u2' : v < 18.5 ? 'u1' : v < 25 ? 'n' : v < 30 ? 'o' : v < 35 ? 'o1' : v < 40 ? 'o2' : 'o3';
  };
  const weightAtBmi = (b, cm) => b * ((cm / 100) * (cm / 100));      // kg
  // Weights giving BMI 18.5 .. 24.9 at this height, in kg or lb; min rounded up and max down to 0.1 so both ends stay inside the band.
  const healthy = (cm, lb) => {
    const f = lb ? 1 / LB : 1;
    return { min: ceil1(weightAtBmi(18.5, cm) * f), max: floor1(weightAtBmi(24.9, cm) * f) };
  };
  // Deurenberg et al. 1991, adults: BF% = 1.20*BMI + 0.23*age - 10.8*sex - 5.4 (sex: male 1, female 0). null when not applicable or implausible.
  const bodyFat = (b, age, male) => {
    if (!isNum(b) || !Number.isInteger(age) || age < 18 || age > 99) return null;
    const pct = 1.2 * b + 0.23 * age - 10.8 * (male ? 1 : 0) - 5.4;
    return (pct >= 3 && pct <= 60) ? pct : null;
  };
  const fatMass = (kg, pct) => kg * pct / 100;
  const gaugePos = b => (Math.min(40, Math.max(15, b)) - 15) / 25;     // 0..1 on the 15..40 scale
  const goalProgress = (start, cur, target) => {
    const total = start - target;
    if (total === 0) return cur === target ? 1 : 0;

function chartSvg(list, mode) {

  if (mode === 'bmi') { lo = Math.min(lo, 18.5); hi = Math.max(hi, 24.9); }
  if (goal != null) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  const pad = Math.max((hi - lo) * 0.12, mode === 'bmi' ? 0.8 : 1); lo -= pad; hi += pad;
  const t0 = pkey(list[0].d).getTime(), t1 = pkey(list[n - 1].d).getTime();
  const X = i => (n === 1 || t1 === t0 ? (L + W - R) / 2 : L + (pkey(list[i].d).getTime() - t0) / (t1 - t0) * (W - L - R));
  const Y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);

  if (goal != null) s += '<line class="ch-goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(goal) + '" y2="' + Y(goal) + '"/>';
  s += '<polyline class="ch-line" points="' + vals.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ') + '"/>';
  vals.forEach((v, i) => { if (n <= 60 || i === n - 1) s += '<circle class="' + (i === n - 1 ? 'ch-last' : 'ch-pt') + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + (i === n - 1 ? 4.5 : 3.5) + '"/>'; });

  s += '<text class="ch-t" x="' + L + '" y="' + (H - 6) + '">' + esc(fmtDate(pkey(list[0].d), f)) + '</text>' + (n > 1 ? '<text class="ch-t" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(fmtDate(pkey(list[n - 1].d), f)) + '</text>' : '');
  return s + '</svg>';
}

  const T = S.tool, e = ED && T.entries.find(x => x.id === ED.id); if (!e) return;
  const ok = await UI.confirm({ title: t('del_t'), body: t('del_b'), ok: t('delete'), danger: true }); if (!ok) return;
  const i = T.entries.indexOf(e); T.entries.splice(i, 1); ED = null; persist(); UI.closeLayer(true); UI.refresh(); haptic('reject');
  UI.toast(t('deleted'), { action: t('undo'), onAction: () => { T.entries.splice(Math.min(i, T.entries.length), 0, e); T.entries.sort((p, q) => (p.d < q.d ? -1 : p.d > q.d ? 1 : 0)); persist(); UI.refresh(); } });
};

// ---------- Goal ----------
function latestEntry() { const l = S.tool.entries; return l.length ? l[l.length - 1] : null; }
function goalForm(g) {
  return '<div class="frm"><div class="field wide"><label class="fl" for="in-gt">' + esc(t('goal_target')) + '</label><div class="ufx"><input class="inp" id="in-gt" inputmode="decimal" maxlength="7" autocomplete="off" data-input="in-gt" value="' + esc(TD.gt) + '"><span class="un">' + esc(wUnit()) + '</span></div></div>' +
    '<div class="field wide"><label class="fl" for="in-gs">' + esc(t('goal_start')) + '</label><div class="ufx"><input class="inp" id="in-gs" inputmode="decimal" maxlength="7" autocomplete="off" data-input="in-gs" value="' + esc(TD.gs) + '"><span class="un">' + esc(wUnit()) + '</span></div><p class="fine" style="margin:6px 2px 0">' + esc(t('goal_start_hint')) + '</p></div></div>' +
    '<div class="act"><button class="btn btn-primary" data-act="goal-save">' + esc(t('goal_set')) + '</button>' + (g ? '<button class="btn btn-secondary" data-act="goal-cancel">' + esc(t('cancel')) + '</button>' : '') + '</div>';
}
function goalScreen(el) {
  const T = S.tool, g = T.goal;
  if (!g || TD.gedit) { el.innerHTML = (g ? '' : UI.empty({ art: ART.ob3, title: t('goal_empty_t'), body: t('goal_empty_b') })) + goalForm(g); return; }
  const le = latestEntry(), cur = le ? le.kg : null, start = g.start != null ? g.start : cur;
  const cm = le ? le.cm : T.cur.cm;
  let h = '<div class="card"><h3>' + esc(t('goal_t')) + '</h3><p class="big">' + esc(wTxt(g.kg)) + '</p>';
  if (cur == null) h += '<p class="hint">' + esc(t('goal_cur_none')) + '</p>';
  else {
    const p = BM.goalProgress(start, cur, g.kg), done = BM.goalReached(start, cur, g.kg);
    h += '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(p * 100) + '" aria-label="' + esc(t('goal_progress')) + '"><i style="width:' + (p * 100).toFixed(1) + '%"></i></div>' +
      '<div class="gl"><b>' + esc(t('goal_pct', { p: fmtNum(Math.round(p * 100) / 100, { style: 'percent', maximumFractionDigits: 0 }) })) + '</b><span>' + esc(t('goal_from', { a: wTxt(start), b: wTxt(cur) })) + '</span></div>' +
      (done ? '<p class="gdone">' + esc(t('goal_reached')) + '</p>' : '<p>' + esc(t('goal_togo', { d: fx1(Math.abs(wv(cur - g.kg))) + ' ' + wUnit() })) + '</p>');
  }
  h += '</div>';
  if (cm == null) h += '<p class="msg">' + esc(t('goal_need_h')) + '</p>';
  else {
    const b = BM.bmi(g.kg, cm), id = BM.band(b);
    h += '<div class="card"><p>' + esc(t('goal_bmi', { bmi: fx1(BM.r1(b)), band: bandName(id) })) + '</p>' + (BM.r1(b) < 18.5 ? '<p class="msg" style="margin:8px 0 0">' + esc(t('goal_low')) + '</p>' : '') + '</div>';
  }
  h += '<p class="fine">' + esc(t('goal_note', { date: fmtDate(pkey(g.at), { day: 'numeric', month: 'long', year: 'numeric' }) })) + '</p>' +
    '<div class="act"><button class="btn btn-secondary" data-act="goal-edit">' + icon('edit', 20) + esc(t('goal_edit')) + '</button><button class="btn btn-danger" data-act="goal-clear">' + icon('trash', 20) + esc(t('goal_clear')) + '</button></div>';
  el.innerHTML = h;
}
INPUT['in-gt'] = el => { TD.gt = el.value; };
INPUT['in-gs'] = el => { TD.gs = el.value; };
ACT['goal-edit'] = () => {
  const g = S.tool.goal, le = latestEntry(), st = g && g.start != null ? g.start : (le ? le.kg : S.tool.cur.kg);
  TD.gt = g ? plain1(wv(g.kg)) : ''; TD.gs = st != null ? plain1(wv(st)) : ''; TD.gedit = true; UI.refresh();
};
ACT['goal-cancel'] = () => { TD.gedit = false; UI.refresh(); };
ACT['goal-save'] = () => {
  const conv = s => { const v = BM.parseNum(s); if (isNaN(v)) return null; const kg = imp() ? BM.lbToKg(v) : v; return BM.validKg(kg) ? round3(kg) : null; };
  const kg = conv(TD.gt); let st = TD.gs.trim() === '' ? null : conv(TD.gs);
  if (kg == null || (TD.gs.trim() !== '' && st == null)) { UI.toast(t('goal_invalid')); haptic('reject'); return; }
  if (st == null) { const le = latestEntry(); st = le ? le.kg : S.tool.cur.kg; }
  const old = S.tool.goal;
  S.tool.goal = { kg: kg, start: st, at: old && old.kg === kg ? old.at : todayKey() };
  TD.gedit = false; persist(); haptic('success'); UI.refresh(); UI.toast(t('goal_saved'));
};
ACT['goal-clear'] = async () => {
  const ok = await UI.confirm({ title: t('goal_clear'), body: t('goal_clear_b'), ok: t('delete'), danger: true }); if (!ok) return;
  const old = S.tool.goal; S.tool.goal = null; TD.gedit = false; persist(); haptic('reject'); UI.refresh();
  UI.toast(t('goal_cleared'), { action: t('undo'), onAction: () => { S.tool.goal = old; persist(); UI.refresh(); } });
};

// ---------- Settings group: weekly log reminder + About ----------
function weeklySync() {
  const w = S.tool.wk;
  if (w.on) Reminders.set(1, w.h, w.m, 1 << w.dow, APP.name, t('rem_body')); else Reminders.cancel(1);
}
ACT['wk-on'] = async () => {
  const w = S.tool.wk;
  if (w.on) { w.on = false; persist(); weeklySync(); UI.refresh(); return; }
  const ok = await Reminders.ensurePermission();
  if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return; }
  w.on = true; persist(); weeklySync(); UI.refresh(); UI.toast(t('rem_set', { time: weekdayName(w.dow, 'long') + ' ' + fmtTime(w.h, w.m) }));
};
CHANGE['wk-dow'] = el => { S.tool.wk.dow = clamp(+el.value | 0, 0, 6); persist(); weeklySync(); };
CHANGE['wk-time'] = el => { const p = String(el.value || '').split(':'); if (p.length < 2) return; S.tool.wk.h = clamp(+p[0] | 0, 0, 23); S.tool.wk.m = clamp(+p[1] | 0, 0, 59); persist(); weeklySync(); };
ACT['about-open'] = () => {
  UI.sheet({ title: t('about_t'), body: '<p>' + esc(t('disc_short')) + '</p><p>' + esc(t('about_b')) + '</p><p>' + esc(t('about_src')) + '</p><p class="fine">' + esc(t('bf_formula')) + '</p>' });
};

// ===== TOOL contract =====
const TOOL = {
  defaults: () => ({ units: 'metric', cur: { kg: null, cm: null, age: null, sex: '' }, entries: [], goal: null, saves: 0, wk: { on: false, dow: 1, h: 9, m: 0 } }),
  migrate(tool, from) {
    const o = Object.assign(TOOL.defaults(), tool && typeof tool === 'object' ? tool : {});
    const num = (v, ok) => (typeof v === 'number' && ok(v) ? v : null);
    o.units = o.units === 'imperial' ? 'imperial' : 'metric';
    const c = o.cur && typeof o.cur === 'object' ? o.cur : {};
    o.cur = { kg: num(c.kg, BM.validKg), cm: num(c.cm, BM.validCm), age: num(c.age, a => Number.isInteger(a) && a >= 1 && a <= 120), sex: c.sex === 'f' || c.sex === 'm' ? c.sex : '' };
    const seen = {};
    o.entries = (Array.isArray(o.entries) ? o.entries : []).filter(e => e && typeof e.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.d) && BM.validKg(e.kg) && BM.validCm(e.cm) && !seen[e.d] && (seen[e.d] = 1))
      .map(e => ({ id: String(e.id || uid('r')), d: e.d, kg: e.kg, cm: e.cm, note: typeof e.note === 'string' ? e.note.slice(0, 120) : '', bf: typeof e.bf === 'number' && e.bf >= 3 && e.bf <= 60 ? e.bf : null }))
      .sort((p, q) => (p.d < q.d ? -1 : p.d > q.d ? 1 : 0));
    const g = o.goal && typeof o.goal === 'object' ? o.goal : null;
    o.goal = g && BM.validKg(g.kg) ? { kg: g.kg, start: BM.validKg(g.start) ? g.start : null, at: typeof g.at === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(g.at) ? g.at : todayKey() } : null;
    o.saves = Number.isInteger(o.saves) && o.saves >= 0 ? o.saves : 0;
    const w = o.wk && typeof o.wk === 'object' ? o.wk : {};
    o.wk = { on: !!w.on, dow: clamp(w.dow | 0, 0, 6), h: clamp(w.h | 0, 0, 23), m: clamp(w.m | 0, 0, 59) };
    return o;
  },
  validateImport: tool => !!(tool && Array.isArray(tool.entries) && tool.entries.every(e => e && typeof e.d === 'string' && BM.validKg(e.kg) && BM.validCm(e.cm))),
  syncReminders() { weeklySync(); },
  onBoot() { syncText(); TD.all = false; TD.gedit = false; },
  onNewDay() {},
  onGrant() {},
  afterOnboarding() { UI.refresh(); },
  csv() {
    const q = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const rows = [['date', 'weight_kg', 'height_cm', 'bmi', 'who_band', 'body_fat_pct_estimate', 'note']];
    const names = { u3: 'severe_thinness', u2: 'moderate_thinness', u1: 'mild_thinness', n: 'normal', o: 'pre_obese', o1: 'obese_1', o2: 'obese_2', o3: 'obese_3' };
    S.tool.entries.forEach(e => { const b = entryBmi(e); rows.push([e.d, e.kg, e.cm, BM.r1(b).toFixed(1), names[BM.band(b)], e.bf == null ? '' : e.bf, e.note]); });
    return rows.map(r => r.map(q).join(',')).join('\n') + '\n';
  },
  settingsHtml() {
    const w = S.tool.wk;
    return '<div class="sec-h">' + esc(t('rem_t')) + '</div><div class="group wkc">' +
      sRow({ icon: 'bell', label: t('rem_label'), sub: t('rem_sub'), right: sSwitch(w.on, 'wk-on', t('rem_label')) }) +
      (w.on ? '<div class="sub"><select class="inp" data-change="wk-dow" aria-label="' + esc(t('wk_day')) + '">' + [0, 1, 2, 3, 4, 5, 6].map(i => '<option value="' + i + '"' + (i === w.dow ? ' selected' : '') + '>' + esc(weekdayName(i, 'long')) + '</option>').join('') + '</select>' +
        '<input class="inp" type="time" data-change="wk-time" aria-label="' + esc(t('s_time')) + '" value="' + String(w.h).padStart(2, '0') + ':' + String(w.m).padStart(2, '0') + '"></div>' : '') +
      sRow({ icon: 'info', label: t('about_t'), sub: t('disc_short'), act: 'about-open' }) + '</div>';
  },
  screens: {
    calc: {
      title: () => t('tab_calc'),
      subtitle: () => t('calc_sub'),
      render: el => calcScreen(el),
    },
    history: {
      title: () => t('hist_t'),
      render: el => historyScreen(el),
    },
    goal: {
      title: () => t('goal_t'),
      actions: () => (S.tool.goal && !TD.gedit ? [{ icon: 'edit', label: t('goal_edit'), act: 'goal-edit', tint: true }] : []),
      render: el => goalScreen(el),
    },
  },
};
//@@END TOOL_CORE
// ── Boot ─────────────────────────────────────────────────────────────
(function boot() {
  mergeI18n();
  loadSave();
  touchSession();
  lastDayKey = todayKey();
  applyLang(); applyTheme(); applyFontScale();
  checkTrial();
  UI.buildNav();
  if (TOOL.onBoot) TOOL.onBoot();
  UI.tab(APP.tabs[0].id);
  persist();
  window.replayPendingGrants();
  Ads.banner();
  Reminders.syncDaily();
  if (TOOL.syncReminders) TOOL.syncReminders();
  if (!S.onboarded) Onboarding.show();
})();
</script>

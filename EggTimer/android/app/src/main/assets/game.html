<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Egg Timer</title>
<style>
:root {
  --bg: #1a0f00;
  --surface: #2a1a06;
  --card: #3a2510;
  --accent: #f0a030;
  --accent2: #ff6820;
  --text: #f5e6b0;
  --muted: #a08060;
  --border: #60401888;
  --ring-bg: #ffffff15;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}

.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.nav-btn{flex:1;padding:12px 4px;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);background:none;border:none;cursor:pointer;transition:color .2s}
.nav-btn.active{color:var(--accent);border-bottom:2px solid var(--accent)}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0;flex-shrink:0}
.coins-badge{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:0.85rem;font-weight:700;color:var(--accent)}

.screen{flex:1;overflow-y:auto;padding:12px 14px 80px;display:none}
.screen.active{display:block}

.section-label{font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:8px 0 6px}
.presets-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.preset-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;transition:transform .1s,border-color .2s}
.preset-card:active{transform:scale(.95)}
.preset-card .icon{font-size:1.8rem;line-height:1;margin-bottom:4px}
.preset-card .pname{font-size:0.72rem;font-weight:700;color:var(--text);margin-bottom:2px}
.preset-card .ptime{font-size:0.65rem;color:var(--muted)}

.custom-row{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.time-input{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px;font-size:1rem;text-align:center;width:62px;outline:none}
.custom-label{color:var(--muted);font-size:0.8rem}
.btn-custom{background:var(--accent);color:#1a0f00;border:none;border-radius:10px;padding:9px 18px;font-weight:800;font-size:0.85rem;cursor:pointer}

.timers-list{display:flex;flex-direction:column;gap:10px}
.timer-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.timer-card.done{border-color:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 #f0a03040}to{box-shadow:0 0 0 8px #f0a03000}}
.tc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tc-name{font-size:0.9rem;font-weight:800;color:var(--text)}
.tc-remove{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px}
.tc-body{display:flex;align-items:center;gap:14px}
.ring-wrap{position:relative;width:70px;height:70px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--ring-bg);stroke-width:6}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s linear;stroke-dasharray:188.5;stroke-dashoffset:188.5}
.ring-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.6rem;line-height:1}
.tc-info{flex:1}
.tc-time{font-size:2rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.tc-progress{height:5px;background:var(--ring-bg);border-radius:3px;margin-top:6px;overflow:hidden}
.tc-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s linear;width:0%}
.tc-controls{display:flex;gap:8px;margin-top:10px}
.tc-btn{flex:1;border:none;border-radius:8px;padding:9px;font-size:0.8rem;font-weight:700;cursor:pointer;transition:transform .1s}
.tc-btn:active{transform:scale(.95)}
.tc-start{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0f00}
.tc-reset{background:var(--surface);color:var(--muted);border:1px solid var(--border)}

.empty-timers{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-timers .big{font-size:3rem;margin-bottom:12px}
.empty-timers p{font-size:0.85rem;line-height:1.5}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-val{font-size:2rem;font-weight:800;color:var(--accent)}
.stat-label{font-size:0.7rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:border-color .2s}
.theme-card.owned{border-color:var(--accent)}
.theme-preview{height:48px;border-radius:8px;margin-bottom:8px}
.theme-name{font-size:0.8rem;font-weight:700;margin-bottom:4px}
.theme-price{font-size:0.75rem;color:var(--muted)}
.theme-price.free{color:#4caf50;font-weight:700}

.remove-ads-row{text-align:center;padding:16px 0}
.remove-ads-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:0.75rem;padding:8px 20px;border-radius:10px;cursor:pointer}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 20px;border-radius:20px;font-size:0.85rem;opacity:0;pointer-events:none;transition:all .3s;z-index:99;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div style="font-size:1.1rem;font-weight:800;color:var(--accent)">Egg Timer</div>
  <div class="coins-badge"><span>🪙</span> <span id="coinCount">0</span></div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="switchTab('timers')">Timers</button>
  <button class="nav-btn" onclick="switchTab('presets')">Presets</button>
  <button class="nav-btn" onclick="switchTab('stats')">Stats</button>
  <button class="nav-btn" onclick="switchTab('shop')">Shop</button>
</div>

<div class="screen active" id="tab-timers">
  <div id="timers-list" class="timers-list"></div>
  <div id="empty-timers" class="empty-timers">
    <div class="big">🥚</div>
    <p>No timers running.<br>Go to <strong>Presets</strong> to add one.</p>
  </div>
</div>

<div class="screen" id="tab-presets">
  <div class="section-label">Eggs</div>
  <div class="presets-grid" id="presets-eggs"></div>
  <div class="section-label">Pasta &amp; Grains</div>
  <div class="presets-grid" id="presets-pasta"></div>
  <div class="section-label">Vegetables</div>
  <div class="presets-grid" id="presets-veg"></div>
  <div class="section-label">Custom</div>
  <div class="custom-row">
    <input class="time-input" id="custom-m" type="number" min="0" max="99" value="5" placeholder="mm">
    <span class="custom-label">min</span>
    <input class="time-input" id="custom-s" type="number" min="0" max="59" value="0" placeholder="ss">
    <span class="custom-label">sec</span>
    <input class="time-input" style="width:110px;text-align:left;padding-left:10px" id="custom-name" type="text" value="Custom" placeholder="Name" maxlength="16">
    <button class="btn-custom" onclick="addCustomTimer()">+ Add</button>
  </div>
</div>

<div class="screen" id="tab-stats">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="stat-sessions">0</div><div class="stat-label">Timers Done</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-coins">0</div><div class="stat-label">Coins Earned</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-total-time">0m</div><div class="stat-label">Time Tracked</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-streak">0</div><div class="stat-label">Today's Timers</div></div>
  </div>
  <div class="remove-ads-row">
    <button class="remove-ads-btn" onclick="doPurchase('remove_ads')">Remove Ads — $2.99</button>
  </div>
</div>

<div class="screen" id="tab-shop">
  <div class="section-label">Themes</div>
  <div class="shop-grid" id="shop-grid"></div>
  <div style="margin-top:14px">
    <button style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;font-size:0.85rem;cursor:pointer" onclick="doPurchase('coins_small')">Buy 100 Coins — $0.99</button>
    <button style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;font-size:0.85rem;cursor:pointer;margin-top:8px" onclick="doPurchase('coins_large')">Buy 500 Coins — $2.99</button>
  </div>
</div>

<div id="toast"></div>

<script>
const THEMES = [
  {id:'amber',  name:'Amber',  price:0,   bg:'#1a0f00',surface:'#2a1a06',card:'#3a2510',accent:'#f0a030',accent2:'#ff6820',text:'#f5e6b0',muted:'#a08060',border:'#60401888'},
  {id:'ocean',  name:'Ocean',  price:80,  bg:'#001a2a',surface:'#002a3a',card:'#003a50',accent:'#20c0f0',accent2:'#0080ff',text:'#c0f0ff',muted:'#4090b0',border:'#204060aa'},
  {id:'forest', name:'Forest', price:80,  bg:'#0a1a06',surface:'#102808',card:'#1a3a0e',accent:'#60d030',accent2:'#30a010',text:'#c0f090',muted:'#508040',border:'#20500888'},
  {id:'rose',   name:'Rose',   price:120, bg:'#1a0610',surface:'#2a0c1a',card:'#3a1020',accent:'#f06090',accent2:'#e030a0',text:'#ffd0e0',muted:'#906070',border:'#60102888'},
  {id:'night',  name:'Night',  price:120, bg:'#0a0a14',surface:'#10101e',card:'#18182a',accent:'#9060ff',accent2:'#6030e0',text:'#d0c0ff',muted:'#605090',border:'#30205088'},
  {id:'cream',  name:'Cream',  price:160, bg:'#2a2010',surface:'#3a2e1c',card:'#4a3c28',accent:'#e8c880',accent2:'#d0a040',text:'#f8f0e0',muted:'#908070',border:'#70604088'},
];

const PRESETS = {
  eggs: [
    {name:'Soft',    icon:'🥚',m:3,  s:0},
    {name:'Medium',  icon:'🥚',m:5,  s:0},
    {name:'Hard',    icon:'🥚',m:10, s:0},
    {name:'Poached', icon:'🍳',m:4,  s:0},
    {name:'Fried',   icon:'🍳',m:3,  s:30},
    {name:'Scrambled',icon:'🍳',m:2, s:30},
  ],
  pasta: [
    {name:'Spaghetti',icon:'🍝',m:8,  s:0},
    {name:'Penne',    icon:'🍝',m:11, s:0},
    {name:'Ramen',    icon:'🍜',m:3,  s:0},
    {name:'Noodles',  icon:'🍜',m:4,  s:0},
    {name:'Rice',     icon:'🍚',m:18, s:0},
    {name:'Quinoa',   icon:'🌾',m:15, s:0},
  ],
  veg: [
    {name:'Broccoli', icon:'🥦',m:5,  s:0},
    {name:'Carrots',  icon:'🥕',m:8,  s:0},
    {name:'Corn',     icon:'🌽',m:10, s:0},
    {name:'Peas',     icon:'🫛',m:3,  s:0},
    {name:'Potatoes', icon:'🥔',m:15, s:0},
    {name:'Asparagus',icon:'🥦',m:4,  s:0},
  ],
};

let _coins = 0, _adsRemoved = false;
let _unlockedThemes = ['amber'], _activeTheme = 'amber';
let _stats = {sessions:0,coinsEarned:0,totalSeconds:0,todayTimers:0,todayDate:''};
let _timers = [], _nextId = 1, _rafId = null;

function save() {
  localStorage.setItem('egg_coins', _coins);
  localStorage.setItem('egg_ads', _adsRemoved);
  localStorage.setItem('egg_themes', JSON.stringify(_unlockedThemes));
  localStorage.setItem('egg_theme', _activeTheme);
  localStorage.setItem('egg_stats', JSON.stringify(_stats));
}
function load() {
  _coins = +localStorage.getItem('egg_coins') || 0;
  _adsRemoved = localStorage.getItem('egg_ads') === 'true';
  try { _unlockedThemes = JSON.parse(localStorage.getItem('egg_themes')) || ['amber']; } catch(e){}
  _activeTheme = localStorage.getItem('egg_theme') || 'amber';
  try { _stats = {..._stats, ...JSON.parse(localStorage.getItem('egg_stats'))}; } catch(e){}
}

function applyTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg);
  r.setProperty('--surface', t.surface);
  r.setProperty('--card', t.card);
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent2', t.accent2);
  r.setProperty('--text', t.text);
  r.setProperty('--muted', t.muted);
  r.setProperty('--border', t.border);
  document.body.style.background = t.bg;
}

function updateCoinDisplay() {
  document.getElementById('coinCount').textContent = _coins;
}

function switchTab(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const idx = ['timers','presets','stats','shop'].indexOf(name);
  document.querySelectorAll('.nav-btn')[idx].classList.add('active');
  if (name === 'stats') renderStats();
  if (name === 'shop') renderShop();
}

function renderPresets() {
  Object.keys(PRESETS).forEach(cat => {
    const el = document.getElementById('presets-' + cat);
    el.innerHTML = '';
    PRESETS[cat].forEach(p => {
      const div = document.createElement('div');
      div.className = 'preset-card';
      div.innerHTML = `<div class="icon">${p.icon}</div><div class="pname">${p.name}</div><div class="ptime">${p.m}:${String(p.s).padStart(2,'0')}</div>`;
      div.addEventListener('click', () => addTimer(p.name, p.m * 60 + p.s, p.icon));
      el.appendChild(div);
    });
  });
}

function addCustomTimer() {
  const m = Math.max(0, Math.min(99, parseInt(document.getElementById('custom-m').value) || 0));
  const s = Math.max(0, Math.min(59, parseInt(document.getElementById('custom-s').value) || 0));
  const name = document.getElementById('custom-name').value.trim() || 'Custom';
  const total = m * 60 + s;
  if (total <= 0) { showToast('Set a time first'); return; }
  addTimer(name, total, '⏱');
  switchTab('timers');
}

function addTimer(name, totalSeconds, icon) {
  _timers.push({id:_nextId++, name, icon, total:totalSeconds, remaining:totalSeconds, running:false, done:false, lastTick:null});
  renderTimers();
  switchTab('timers');
  if (!_adsRemoved && typeof Android !== 'undefined') try { Android.showBannerAd(); } catch(e){}
  showToast(name + ' timer added');
  if (!_rafId) startLoop();
}

function removeTimer(id) {
  _timers = _timers.filter(t => t.id !== id);
  document.getElementById('tc-' + id)?.remove();
  const empty = document.getElementById('empty-timers');
  if (_timers.length === 0) empty.style.display = 'block';
}

function toggleTimer(id) {
  const t = _timers.find(x => x.id === id);
  if (!t || t.done) return;
  t.running = !t.running;
  if (t.running) { t.lastTick = performance.now(); if (!_rafId) startLoop(); }
  updateTimerCard(t);
}

function resetTimer(id) {
  const t = _timers.find(x => x.id === id);
  if (!t) return;
  t.remaining = t.total;
  t.running = false;
  t.done = false;
  t.lastTick = null;
  updateTimerCard(t);
}

function renderTimers() {
  const list = document.getElementById('timers-list');
  const empty = document.getElementById('empty-timers');
  empty.style.display = _timers.length === 0 ? 'block' : 'none';
  _timers.forEach(t => {
    if (!document.getElementById('tc-' + t.id)) {
      const card = document.createElement('div');
      card.id = 'tc-' + t.id;
      card.className = 'timer-card';
      card.innerHTML = `
        <div class="tc-top">
          <div class="tc-name">${t.icon} ${t.name}</div>
          <button class="tc-remove" onclick="removeTimer(${t.id})">✕</button>
        </div>
        <div class="tc-body">
          <div class="ring-wrap">
            <svg viewBox="0 0 70 70" width="70" height="70">
              <circle class="ring-bg" cx="35" cy="35" r="30"/>
              <circle class="ring-fg" id="ring-${t.id}" cx="35" cy="35" r="30"/>
            </svg>
            <div class="ring-icon" id="ricon-${t.id}">${t.icon}</div>
          </div>
          <div class="tc-info">
            <div class="tc-time" id="time-${t.id}">00:00</div>
            <div class="tc-progress"><div class="tc-progress-fill" id="prog-${t.id}"></div></div>
          </div>
        </div>
        <div class="tc-controls">
          <button class="tc-btn tc-start" id="sb-${t.id}" onclick="toggleTimer(${t.id})">Start</button>
          <button class="tc-btn tc-reset" onclick="resetTimer(${t.id})">Reset</button>
        </div>`;
      list.appendChild(card);
    }
    updateTimerCard(t);
  });
}

function updateTimerCard(t) {
  const card = document.getElementById('tc-' + t.id);
  if (!card) return;
  card.className = 'timer-card' + (t.done ? ' done' : '');
  const m = Math.floor(t.remaining / 60), s = Math.floor(t.remaining % 60);
  const timeEl = document.getElementById('time-' + t.id);
  if (timeEl) timeEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  const pct = t.total > 0 ? 1 - t.remaining / t.total : 1;
  const prog = document.getElementById('prog-' + t.id);
  if (prog) prog.style.width = (pct * 100) + '%';
  const ring = document.getElementById('ring-' + t.id);
  if (ring) ring.style.strokeDashoffset = 188.5 * (1 - pct);
  const sb = document.getElementById('sb-' + t.id);
  if (sb) sb.textContent = t.done ? 'Done!' : t.running ? 'Pause' : 'Start';
  const ri = document.getElementById('ricon-' + t.id);
  if (ri && t.done) ri.textContent = '✓';
}

function startLoop() {
  function tick(now) {
    let anyRunning = false;
    _timers.forEach(t => {
      if (!t.running || t.done) return;
      anyRunning = true;
      const elapsed = (now - (t.lastTick || now)) / 1000;
      t.lastTick = now;
      t.remaining = Math.max(0, t.remaining - elapsed);
      if (t.remaining <= 0) {
        t.remaining = 0; t.running = false; t.done = true;
        onTimerDone(t);
      }
      updateTimerCard(t);
    });
    _rafId = anyRunning ? requestAnimationFrame(tick) : null;
  }
  _rafId = requestAnimationFrame(tick);
}

function onTimerDone(t) {
  playAlarm();
  const reward = 5;
  _coins += reward;
  _stats.sessions++;
  _stats.coinsEarned += reward;
  _stats.totalSeconds += t.total;
  const today = new Date().toDateString();
  if (_stats.todayDate !== today) { _stats.todayDate = today; _stats.todayTimers = 0; }
  _stats.todayTimers++;
  save();
  updateCoinDisplay();
  showToast(t.name + ' done! +' + reward + ' coins');
  if (typeof Android !== 'undefined') try { Android.showInterstitial(); } catch(e){}
}

let _ac = null;
function playAlarm() {
  try {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 3; i++) {
      const osc = _ac.createOscillator(), gain = _ac.createGain();
      osc.connect(gain); gain.connect(_ac.destination);
      osc.type = 'sine';
      osc.frequency.value = i % 2 === 0 ? 880 : 1100;
      const t = _ac.currentTime + i * 0.35;
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.3);
    }
  } catch(e) {}
}

function renderStats() {
  const m = Math.floor(_stats.totalSeconds / 60);
  document.getElementById('stat-sessions').textContent = _stats.sessions;
  document.getElementById('stat-coins').textContent = _stats.coinsEarned;
  document.getElementById('stat-total-time').textContent = m >= 60 ? Math.floor(m/60) + 'h' : m + 'm';
  document.getElementById('stat-streak').textContent = _stats.todayTimers;
}

function renderShop() {
  const grid = document.getElementById('shop-grid');
  grid.innerHTML = '';
  THEMES.forEach(th => {
    const owned = _unlockedThemes.includes(th.id);
    const div = document.createElement('div');
    div.className = 'theme-card' + (owned ? ' owned' : '');
    div.innerHTML = `
      <div class="theme-preview" style="background:linear-gradient(135deg,${th.bg},${th.surface});border:2px solid ${th.accent}"></div>
      <div class="theme-name" style="color:${th.accent}">${th.name}</div>
      <div class="theme-price ${th.price===0?'free':''}">${owned?(th.id===_activeTheme?'Active':'Owned'):(th.price===0?'Free':th.price+' coins')}</div>`;
    div.addEventListener('click', () => selectTheme(th));
    grid.appendChild(div);
  });
}

function selectTheme(th) {
  if (!_unlockedThemes.includes(th.id)) {
    if (th.price === 0) { _unlockedThemes.push(th.id); save(); }
    else if (_coins >= th.price) { _coins -= th.price; _unlockedThemes.push(th.id); save(); updateCoinDisplay(); }
    else { showToast('Not enough coins'); return; }
  }
  _activeTheme = th.id;
  applyTheme(th.id);
  save();
  renderShop();
  showToast(th.name + ' theme applied');
}

function doPurchase(id) {
  if (typeof Android !== 'undefined') try { Android.purchase(id); } catch(e){}
  else showToast('Purchases not available here');
}

window.onPurchaseComplete = function(id) {
  if (id === 'remove_ads') {
    _adsRemoved = true;
    if (typeof Android !== 'undefined') try { Android.hideBannerAd(); } catch(e){}
    showToast('Ads removed. Thank you!');
  } else if (id === 'coins_small') { _coins += 100; showToast('+100 coins!'); }
  else if (id === 'coins_large') { _coins += 500; showToast('+500 coins!'); }
  save(); updateCoinDisplay();
};

let _toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

load();
applyTheme(_activeTheme);
updateCoinDisplay();
renderPresets();
renderTimers();

if (!_adsRemoved && typeof Android !== 'undefined') try { Android.showBannerAd(); } catch(e){}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Egg Timer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  body{background:#1a1209;color:#f5e6b0;font-family:'Georgia',serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
  h1{font-size:1.5rem;margin:16px 0 8px;color:#f0b040;letter-spacing:2px}
  .preset-row{display:flex;gap:10px;margin:8px 0 12px;flex-wrap:wrap;justify-content:center;padding:0 12px}
  .preset-btn{background:#ffffff12;border:2px solid #f0b04033;color:#f5e6b0;border-radius:14px;padding:10px 16px;font-size:0.82rem;cursor:pointer;text-align:center;transition:background 0.1s,border-color 0.1s;min-width:72px}
  .preset-btn.active{background:#f0b04033;border-color:#f0b040;color:#f0b040}
  .preset-btn .egg{font-size:1.3rem;display:block;margin-bottom:2px}
  #egg-visual{font-size:4.5rem;margin:6px 0;transition:filter 0.5s}
  #egg-visual.done{filter:drop-shadow(0 4px 20px #ff8800cc) brightness(1.3)}
  #timer-display{font-size:3.5rem;font-weight:bold;color:#f0c060;margin:4px 0;text-shadow:0 2px 16px #f0b04044;font-variant-numeric:tabular-nums}
  #progress-bar{width:260px;height:8px;background:#ffffff15;border-radius:4px;margin:8px 0 14px;overflow:hidden}
  #progress-fill{height:100%;background:linear-gradient(90deg,#f0b040,#ff8800);border-radius:4px;transition:width 0.5s linear;width:0%}
  .btn-row{display:flex;gap:14px;margin-bottom:10px}
  .action-btn{border:none;border-radius:50px;padding:13px 34px;font-size:1rem;font-weight:bold;cursor:pointer;transition:transform 0.1s}
  #start-btn{background:linear-gradient(135deg,#f0b040,#ff8800);color:#1a1209}
  #reset-btn{background:#ffffff15;color:#f5e6b0;border:1px solid #f0b04033}
  .action-btn:active{transform:scale(0.94)}
  #status-msg{font-size:0.95rem;color:#f0b04088;min-height:1.4rem;margin-bottom:6px;text-align:center}
  #custom-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#f0b04088;font-size:0.85rem}
  #custom-min{width:58px;background:#ffffff10;border:1px solid #f0b04033;color:#f5e6b0;text-align:center;border-radius:8px;padding:5px;font-size:0.95rem;outline:none}
  .custom-set{background:#f0b04022;border:1px solid #f0b04055;color:#f0b040;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:0.85rem}
  #remove-ads{position:fixed;top:8px;right:8px;background:#ffffff10;border:1px solid #f0b04033;color:#f0b04088;font-size:0.65rem;padding:4px 8px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<button id="remove-ads" onclick="Android.purchase('remove_ads')">Remove Ads</button>
<h1>🥚 Egg Timer</h1>
<div class="preset-row">
  <button class="preset-btn active" onclick="selectPreset(this,180,'Soft')"><span class="egg">🥚</span>Soft<br><small>3 min</small></button>
  <button class="preset-btn" onclick="selectPreset(this,360,'Medium')"><span class="egg">🍳</span>Medium<br><small>6 min</small></button>
  <button class="preset-btn" onclick="selectPreset(this,600,'Hard')"><span class="egg">🫕</span>Hard<br><small>10 min</small></button>
  <button class="preset-btn" onclick="selectPreset(this,900,'Extra')"><span class="egg">🏺</span>Extra<br><small>15 min</small></button>
</div>
<div id="egg-visual">🥚</div>
<div id="timer-display">3:00</div>
<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="status-msg">Choose style and tap Start</div>
<div class="btn-row">
  <button class="action-btn" id="start-btn" onclick="toggleTimer()">START</button>
  <button class="action-btn" id="reset-btn" onclick="resetTimer()">RESET</button>
</div>
<div id="custom-row">Custom: <input id="custom-min" type="number" min="1" max="60" value="5"> min <button class="custom-set" onclick="setCustom()">Set</button></div>
<script>
let totalSecs=180,remaining=180,running=false,interval=null,presetName='Soft';
function selectPreset(btn,secs,name){document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');totalSecs=secs;remaining=secs;presetName=name;if(running)stopTimer();updateDisplay();document.getElementById('status-msg').textContent='Tap Start to begin';document.getElementById('egg-visual').classList.remove('done');document.getElementById('egg-visual').textContent='🥚';}
function setCustom(){const m=Math.min(60,Math.max(1,parseInt(document.getElementById('custom-min').value)||5));totalSecs=m*60;remaining=totalSecs;document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));if(running)stopTimer();updateDisplay();document.getElementById('status-msg').textContent='Custom '+m+' min';}
function toggleTimer(){if(running){stopTimer();document.getElementById('start-btn').textContent='RESUME';document.getElementById('status-msg').textContent='Paused';}else{startTimer();}}
function startTimer(){if(remaining<=0)remaining=totalSecs;running=true;document.getElementById('start-btn').textContent='PAUSE';document.getElementById('status-msg').textContent=presetName+' boil in progress…';interval=setInterval(tick,1000);}
function stopTimer(){running=false;clearInterval(interval);document.getElementById('start-btn').textContent='START';}
function resetTimer(){stopTimer();remaining=totalSecs;updateDisplay();document.getElementById('status-msg').textContent='Tap Start to begin';document.getElementById('egg-visual').classList.remove('done');document.getElementById('egg-visual').textContent='🥚';}
function tick(){remaining--;updateDisplay();if(remaining<=0){stopTimer();document.getElementById('status-msg').textContent='✅ Done! Your egg is ready!';document.getElementById('egg-visual').classList.add('done');document.getElementById('egg-visual').textContent='🍳';if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);if(window.Android)Android.showInterstitial();}}
function updateDisplay(){const m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer-display').textContent=m+':'+(s<10?'0':'')+s;const pct=totalSecs>0?(totalSecs-remaining)/totalSecs*100:0;document.getElementById('progress-fill').style.width=pct+'%';}
updateDisplay();
window.onPurchaseComplete=function(id){if(id==='remove_ads'){document.getElementById('remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
</script>
</body>
</html>

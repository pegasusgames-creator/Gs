<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ghost Word</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #1a1e23; color: #cfd8dc; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
:root { --accent: #78909C; --light: #B0BEC5; }
header { background: #263238; padding: 14px 16px; text-align: center; border-bottom: 2px solid var(--accent); }
header h1 { font-size: 1.4rem; color: var(--light); letter-spacing: 3px; }
.main { flex: 1; display: flex; flex-direction: column; padding: 20px 16px; gap: 16px; overflow-y: auto; }
.score-row { display: flex; justify-content: space-around; }
.score-box { text-align: center; background: #263238; border-radius: 10px; padding: 10px 24px; }
.score-label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; }
.score-val { font-size: 1.5rem; font-weight: 700; }
.score-val.you { color: #81c784; }
.score-val.cpu { color: #e57373; }
.turn-badge { text-align: center; padding: 8px; font-size: 0.9rem; color: var(--light); background: #263238; border-radius: 8px; }
.fragment-display { text-align: center; font-size: 3rem; font-weight: 700; letter-spacing: 8px; color: #fff; padding: 20px; background: #263238; border-radius: 14px; border: 2px solid var(--accent); min-height: 80px; }
.keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.key { background: #37474f; border: 1px solid #546e7a; border-radius: 8px; padding: 12px 4px; text-align: center; font-size: 1rem; font-weight: 700; color: #eceff1; cursor: pointer; transition: all 0.1s; }
.key.btn-pressed { opacity: 0.6; transform: scale(0.9); }
.key.disabled { opacity: 0.3; pointer-events: none; }
.log { background: #263238; border-radius: 10px; padding: 12px; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.log-entry { font-size: 0.85rem; color: #aaa; }
.log-entry.good { color: #81c784; }
.log-entry.bad { color: #e57373; }
.btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.15s; }
.btn.btn-pressed { opacity: 0.6; transform: scale(0.96); }
.btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--light); }
.challenge-row { display: flex; gap: 8px; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
.overlay.show { display: flex; }
.modal { background: #263238; border: 2px solid var(--accent); border-radius: 16px; padding: 24px; max-width: 300px; width: 90%; text-align: center; }
.modal h2 { font-size: 1.6rem; margin-bottom: 12px; }
.modal h2.win { color: #81c784; }
.modal h2.lose { color: #e57373; }
.banner { background: #111; border: 1px dashed #444; color: #555; text-align: center; padding: 10px; font-size: 0.75rem; flex-shrink: 0; }
</style>
</head>
<body>
<header><h1>GHOST WORD</h1></header>
<div class="main">
  <div class="score-row">
    <div class="score-box"><div class="score-label">You</div><div class="score-val you" id="you-score">0</div></div>
    <div class="score-box"><div class="score-label">CPU</div><div class="score-val cpu" id="cpu-score">0</div></div>
  </div>
  <div class="turn-badge" id="turn-badge">Your turn — tap a letter</div>
  <div class="fragment-display" id="fragment">_</div>
  <div class="keyboard" id="keyboard"></div>
  <div class="challenge-row">
    <button class="btn btn-outline" style="flex:1" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="challenge()">Challenge</button>
    <button class="btn" style="flex:1" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="newGame()">New Game</button>
  </div>
  <div class="log" id="log"><div class="log-entry">Building a word fragment — be strategic!</div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">You Win!</h2>
    <p id="modal-msg" style="color:#aaa;margin:8px 0 16px;font-size:0.9rem"></p>
    <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="closeModal();newGame()">Play Again</button>
  </div>
</div>

<div class="banner" id="banner-ad">Advertisement</div>

<script>
const DICT = new Set("able,about,above,acid,aged,also,arch,area,army,arts,aunt,auto,baby,back,bake,bald,band,bank,bare,barn,base,bath,bead,beam,bean,bear,beat,beer,belt,bent,bike,bill,bird,bite,bold,bolt,bone,book,boom,boot,bore,boss,bout,brow,buck,bulk,bull,buzz,cage,cake,calm,camp,cane,cape,card,care,cart,case,cave,cent,chef,chin,chip,chop,clam,clay,clip,club,coal,coat,code,coil,coin,coma,comb,cone,cope,cord,core,cork,corn,crab,crew,crop,crow,cube,curl,cute,damp,dare,dart,dash,dead,deal,dean,debt,deck,deed,deny,desk,dial,dice,dime,dirt,disk,dive,doll,dome,dove,drag,draw,drop,drum,duck,dull,dump,dusk,dust,duty,earn,ease,east,edge,emit,envy,epic,face,fail,fall,fang,fare,fast,fate,fawn,fear,feat,feel,feet,fell,fern,fill,find,fire,fish,fist,flag,flaw,flea,flee,flew,flex,flip,foam,fold,fond,font,ford,fork,form,fort,foul,four,frog,fuel,fume,fuse,gale,gate,gear,germ,gist,glee,glob,glue,goal,goes,gold,gore,gown,grab,gram,grew,grin,grip,grit,grow,gust,guts,hack,hail,half,hall,hand,hard,harm,hash,haze,head,hear,heap,heat,heel,helm,hemp,herb,herd,high,hike,hill,hire,hive,hold,hole,home,hope,horn,hose,host,hour,howl,hull,hump,huge,hung,hunk,hurl,hymn,idle,iron,jerk,jest,jolt,jump,just,keen,kill,kind,knew,know,lace,lame,lamp,land,lane,lark,lash,last,late,lava,lawn,leaf,lean,left,lend,lens,levy,lick,life,limp,line,lint,lion,lips,list,live,load,long,look,lore,lost,loud,lump,lure,lurk,lust,made,main,make,mane,mark,mass,mask,mast,mean,meet,melt,mesh,mild,milk,mill,mind,mine,miss,mist,mock,mold,mole,monk,moon,more,moss,moth,move,much,muse,mute,myth,nail,name,neck,need,nest,news,nick,node,norm,noun,nude,numb,oath,obey,omen,once,open,oven,pace,pack,pact,pain,palm,pang,past,path,pave,peak,peat,peel,peep,peer,pest,pier,pike,pile,pill,pine,pink,pint,pipe,pity,plan,play,plea,plop,plow,ploy,plug,plum,poem,poet,pole,poll,pond,pore,port,pose,post,pout,prep,prey,prim,prod,prop,puck,puff,pump,pure,push,pull,race,rage,rain,ramp,rank,rant,rash,rasp,rate,rave,read,real,reed,reef,reel,rest,rice,ride,rife,rift,rind,ring,rink,riot,ripe,rise,rite,road,roam,roar,robe,rock,role,roll,roof,room,root,rope,rose,rout,rove,ruby,rude,ruin,rule,ruse,rust,safe,sage,salt,same,sane,save,seam,seep,self,sell,send,shed,shin,ship,show,side,sigh,sign,silk,sill,silo,silt,sing,sink,sire,size,skin,slab,slap,slay,sled,slim,slip,slit,slop,slot,slug,slum,slur,slow,snap,snob,soak,soar,sock,soda,soft,soil,sole,some,song,soon,sore,sort,soul,sown,span,spar,spin,spit,spot,star,step,stew,stir,stop,stub,stud,stun,suck,suit,surf,swap,swat,sway,swim,tack,tail,take,talk,tall,tame,tang,task,taut,teal,teem,teen,tell,tend,tent,test,toad,toil,tomb,tone,tool,tops,tore,tort,toss,tour,town,trap,tray,trek,trim,trio,trip,trod,trot,tuba,tuft,turf,turn,twig,twin,type,ugly,unit,vain,vale,vane,veer,veil,vend,verb,vest,veto,vial,vice,vine,vise,void,vole,volt,vote,waif,wake,walk,wane,ward,ware,warm,warn,wary,wasp,wash,wave,wear,weld,welt,well,went,west,wide,will,wilt,wind,wine,wing,wish,wisp,wood,word,work,worn,wrap,yard,year,yore,zeal,zinc,zero,zone,zoom,about,again,ahead,alarm,alert,alive,allow,alone,along,angel,anger,angle,arose,atlas,avoid,award,aware,beach,began,bench,birth,blank,blast,blaze,blend,bless,blink,block,blood,bloom,blown,blunt,board,bonus,boost,bound,brace,brand,brave,bread,broke,brown,brush,build,built,buyer,candy,cargo,catch,cedar,chair,chalk,chaos,charm,cheap,check,cheer,chess,chest,chief,china,choir,civic,civil,claim,clash,clean,clear,clerk,cliff,climb,clock,close,cloud,coach,coast,could,count,court,cover,craft,crane,crash,crazy,cream,creek,creep,crest,crime,crisp,cross,crowd,cruel,crush,dance,death,decor,delay,depth,dirty,dizzy,donor,dough,dozen,draft,drama,drawn,dread,dream,dress,dried,drill,drink,drive,drove,drown,eagle,elect,elite,enemy,enjoy,enter,equal,erupt,event,exact,exile,exist,extra,fable,faith,falls,fancy,fatal,feast,fence,fever,fifth,fight,first,fixed,flame,flare,flash,fleet,flesh,float,flood,flour,fluid,flute,folks,freed,fresh,front,froze,fruit,fully,funds,giant,given,gland,glare,gloss,glove,grace,grade,grasp,graze,grief,grind,groan,gross,grove,growl,guile,gulch,heart,heavy,hence,horse,human,hurry,image,inner,input,issue,judge,knife,knock,large,later,laugh,layer,learn,legal,level,light,linen,liver,local,loose,lover,lower,lucky,lunch,magic,major,maker,manor,march,might,minor,money,month,moral,mouse,mouth,music,night,noble,noise,north,novel,nurse,ocean,offer,often,order,other,outer,owner,paint,panel,paper,party,peace,phase,piece,pilot,pitch,place,plain,plane,plant,plate,point,power,press,price,pride,print,prior,prize,proof,prove,queen,quest,quick,quiet,quite,quote,raise,range,reach,ready,realm,right,rival,river,round,royal,ruler,saint,scale,scene,scope,score,scout,sense,serve,setup,seven,shade,shake,shame,shape,share,sharp,shift,shirt,shore,short,shout,sight,since,skill,sleep,slice,slide,slope,smart,smell,smile,smoke,solve,space,spare,spark,speak,speed,spend,spill,spine,spite,split,spray,stack,stage,stake,stand,stark,start,state,steal,steel,steep,steer,stern,stick,stiff,still,stock,stone,store,storm,story,strap,straw,strip,stuck,style,sugar,sunny,super,surge,swear,sweep,sweet,swift,sword,table,taste,teach,tempt,tense,thick,thing,think,third,those,three,threw,throw,thumb,tiger,tired,title,today,token,total,touch,tough,towel,toxic,trace,track,trade,trail,train,trait,trash,treat,trend,trial,trick,troop,trout,truck,truly,trust,truth,twist,ultra,union,until,upper,upset,usage,usual,valid,value,valve,video,vigor,visit,vital,vocal,voice,waste,watch,water,weave,weigh,where,which,while,white,whole,whose,witch,woman,women,world,worry,worse,worth,would,write,wrong,young,yours,youth".split(','));

let fragment = '', yourTurn = true, youScore = 0, cpuScore = 0, gameOver = false;

function newGame() {
  fragment = ''; yourTurn = true; gameOver = false;
  render();
  log('New game! You go first.', 'good');
  buildKeyboard();
  closeModal();
}

function render() {
  document.getElementById('fragment').textContent = fragment || '_';
  document.getElementById('turn-badge').textContent = yourTurn ? 'Your turn — add a letter' : 'CPU is thinking...';
  document.getElementById('you-score').textContent = youScore;
  document.getElementById('cpu-score').textContent = cpuScore;
}

function isWord(f) { return f.length >= 4 && DICT.has(f.toLowerCase()); }
function hasExtension(f) {
  const low = f.toLowerCase();
  for (const w of DICT) { if (w.startsWith(low) && w !== low) return true; }
  return false;
}

function addLetter(l) {
  if (!yourTurn || gameOver) return;
  const newFrag = fragment + l;
  if (isWord(newFrag)) {
    log(`You spelled "${newFrag.toUpperCase()}"! You lose that round.`, 'bad');
    cpuScore++;
    endRound(false, newFrag);
    return;
  }
  if (!hasExtension(newFrag)) {
    log(`"${newFrag.toUpperCase()}" can't become any word! CPU challenges.`, 'bad');
    cpuScore++;
    endRound(false, newFrag);
    return;
  }
  fragment = newFrag;
  yourTurn = false;
  render();
  log(`You added "${l.toUpperCase()}" → ${fragment.toUpperCase()}`, 'good');
  setTimeout(cpuTurn, 1000);
}

function cpuTurn() {
  if (gameOver) return;
  // CPU: pick letter that doesn't form a word and extends toward a word
  const low = fragment.toLowerCase();
  const alphabet = 'abcdefghijklmnopqrstuvwxyz';
  let bestLetter = null;
  // Try to pick a letter that extends toward a word but doesn't immediately complete it
  const candidates = [];
  for (const l of alphabet) {
    const newF = low + l;
    if (hasExtension(newF) && !isWord(newF)) candidates.push(l);
  }
  if (candidates.length === 0) {
    // CPU must complete a word or challenge
    let anyWord = false;
    for (const l of alphabet) {
      if (isWord(low + l)) { anyWord = true; bestLetter = l; break; }
    }
    if (anyWord) {
      log(`CPU added "${bestLetter.toUpperCase()}" → ${(fragment + bestLetter).toUpperCase()}. CPU spelled a word!`, 'good');
      youScore++;
      endRound(true, fragment + bestLetter);
      return;
    } else {
      log(`CPU challenges: "${fragment.toUpperCase()}" has no valid extension. CPU loses!`, 'good');
      youScore++;
      endRound(true, fragment);
      return;
    }
  }
  // Pick letter strategically: prefer letters where opponent will struggle
  bestLetter = candidates[Math.floor(Math.random() * Math.min(3, candidates.length))];
  const newFrag = fragment + bestLetter;
  if (isWord(newFrag)) {
    log(`CPU added "${bestLetter.toUpperCase()}" → ${newFrag.toUpperCase()}. CPU spelled a word!`, 'good');
    youScore++;
    endRound(true, newFrag);
    return;
  }
  fragment = newFrag;
  yourTurn = true;
  render();
  log(`CPU added "${bestLetter.toUpperCase()}" → ${fragment.toUpperCase()}`, '');
  buildKeyboard();
}

function challenge() {
  if (!yourTurn || gameOver || !fragment) return;
  // You challenge: CPU must prove it can extend fragment
  if (!hasExtension(fragment) && !isWord(fragment)) {
    log(`You challenged! "${fragment.toUpperCase()}" has no valid word. You win this round!`, 'good');
    youScore++;
    endRound(true, fragment);
  } else {
    const word = [...DICT].find(w => w.startsWith(fragment.toLowerCase()));
    log(`CPU proves: "${(word || fragment).toUpperCase()}" is valid. You lose this round!`, 'bad');
    cpuScore++;
    endRound(false, fragment);
  }
}

function endRound(youWon, frag) {
  gameOver = true;
  render();
  const title = document.getElementById('modal-title');
  const msg = document.getElementById('modal-msg');
  title.className = 'modal-title ' + (youWon ? 'win' : 'lose');
  title.textContent = youWon ? 'Round Won!' : 'Round Lost!';
  msg.textContent = 'Fragment was: ' + frag.toUpperCase() + '\nScore — You: ' + (youWon ? youScore : youScore) + ' CPU: ' + cpuScore;
  title.style.color = youWon ? '#81c784' : '#e57373';
  document.getElementById('overlay').classList.add('show');
  setTimeout(() => {
    closeModal();
    fragment = ''; yourTurn = true; gameOver = false;
    render(); buildKeyboard();
    log('--- New Round ---', '');
  }, 2200);
}

function log(msg, cls='') {
  const l = document.getElementById('log');
  const e = document.createElement('div');
  e.className = 'log-entry ' + cls;
  e.textContent = msg;
  l.appendChild(e);
  l.scrollTop = l.scrollHeight;
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
    const key = document.createElement('div');
    key.className = 'key';
    if (gameOver || !yourTurn) key.classList.add('disabled');
    key.textContent = l;
    key.addEventListener('touchstart', e => { e.preventDefault(); key.classList.add('btn-pressed'); addLetter(l.toLowerCase()); });
    key.addEventListener('touchend', () => key.classList.remove('btn-pressed'));
    key.addEventListener('click', () => addLetter(l.toLowerCase()));
    kb.appendChild(key);
  });
}

function closeModal() { document.getElementById('overlay').classList.remove('show'); }

newGame();
window.onPurchaseComplete = function(sku) { console.log('Purchase:', sku); };
window.onAdMobLoaded = function() { document.getElementById('banner-ad').style.display = 'none'; };
</script>
</body>

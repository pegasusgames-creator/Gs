<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piano Keyboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
:root {
  --bg: #0b0e1b;
  --surface: #151a2e;
  --accent: #ff5b7f;
  --accent2: #1c2240;
  --text: #ecf1fa;
  --muted: #8892a4;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Poppins', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; letter-spacing: -0.01em; }
body.ss #btn-remove-ads{display:none;}

#top-bar { background: var(--surface); padding: 36px 12px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3a5e; flex-shrink: 0; }
#top-bar h1 { font-size: 1rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }

#controls { display: flex; gap: 6px; flex-shrink: 0; background: var(--surface); padding: 8px 10px; border-bottom: 1px solid #2a3a5e; align-items: center; flex-wrap: wrap; }
.ctrl-group { display: flex; align-items: center; gap: 4px; }
.ctrl-lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
.sm-btn { padding: 5px 10px; border-radius: 14px; border: 1.5px solid #2a3a5e; background: transparent; color: var(--text); font-size: 0.75rem; cursor: pointer; }
.sm-btn.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.sm-btn:active { opacity: 0.7; }
#oct-display { font-size: 0.9rem; color: var(--accent); font-weight: 700; min-width: 30px; text-align: center; }
input[type=range]#vol-range { -webkit-appearance: none; width: 80px; height: 5px; border-radius: 3px; background: var(--accent2); outline: none; }
input[type=range]#vol-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; }

#note-display { background: var(--accent2); text-align: center; padding: 6px; font-size: 1.1rem; font-weight: 700; color: var(--accent); flex-shrink: 0; min-height: 36px; letter-spacing: 2px; }

#record-bar { display: flex; gap: 8px; padding: 7px 10px; align-items: center; background: var(--surface); flex-shrink: 0; }
#rec-btn { padding: 6px 14px; border-radius: 16px; border: none; background: #c0392b; color: #fff; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
#rec-btn.active { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; animation: pulse 1s infinite; }
#play-btn { padding: 6px 14px; border-radius: 16px; border: none; background: #27ae60; color: #fff; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
#clear-btn { padding: 6px 14px; border-radius: 16px; border: 1.5px solid #2a3a5e; background: transparent; color: var(--muted); font-size: 0.75rem; cursor: pointer; }
#rec-info { font-size: 0.7rem; color: var(--muted); }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }

#keyboard-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#keyboard-scroll::-webkit-scrollbar { display: none; }
#keyboard { position: relative; height: 100%; }
.wkey { position: absolute; background: #f0f0e8; border: 1px solid #aaa; border-radius: 0 0 6px 6px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; transition: background 0.05s; }
.wkey.active { background: #ffe8e0; }
.wkey .kl { font-size: 0.6rem; color: #666; pointer-events: none; }
.bkey { position: absolute; background: #1a1a1a; border-radius: 0 0 4px 4px; cursor: pointer; z-index: 2; transition: background 0.05s; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; }
.bkey.active { background: #4a0a18; }
.bkey .kl { font-size: 0.5rem; color: #888; pointer-events: none; }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;z-index:9999;background:#533483;border:none;color:#fff;font-size:0.7rem;font-weight:600;padding:5px 10px;border-radius:20px;cursor:pointer;">Remove Ads</button>

<div id="top-bar">
  <h1>Piano Keyboard</h1>
</div>

<div id="controls">
  <div class="ctrl-group">
    <span class="ctrl-lbl">Sound</span>
    <button class="sm-btn sel" data-inst="piano">Piano</button>
    <button class="sm-btn" data-inst="organ">Organ</button>
    <button class="sm-btn" data-inst="vibes">Vibes</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-lbl">Oct</span>
    <button class="sm-btn" id="oct-dn">−</button>
    <span id="oct-display">4</span>
    <button class="sm-btn" id="oct-up">+</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-lbl">Vol</span>
    <input type="range" id="vol-range" min="0" max="100" value="80">
  </div>
</div>

<div id="note-display">—</div>

<div id="record-bar">
  <button id="rec-btn">⏺ REC</button>
  <button id="play-btn">▶ PLAY</button>
  <button id="clear-btn">✕ CLEAR</button>
  <span id="rec-info">0 notes</span>
</div>

<div id="keyboard-scroll">
  <div id="keyboard"></div>
</div>

<script>
var _adsRemoved = false;
var _interstitialCount = 0;
function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}
window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

var audioCtx = null;
var instrument = 'piano';
var octaveShift = 0;
var volume = 0.8;
var recording = false;
var recordedNotes = [];
var recStartTime = 0;
var playTimer = null;

var NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var WHITE_NOTES = [0,2,4,5,7,9,11];
var BLACK_NOTES = [1,3,null,6,8,10,null];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function noteFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playNote(midi) {
  initAudio();
  var freq = noteFreq(midi);
  var now = audioCtx.currentTime;
  var gainNode = audioCtx.createGain();
  gainNode.connect(audioCtx.destination);

  if (instrument === 'piano') {
    var oscs = [];
    [[1,1],[2,0.4],[3,0.2],[4,0.1]].forEach(function(h) {
      var o = audioCtx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq * h[0];
      var g2 = audioCtx.createGain();
      g2.gain.value = h[1];
      o.connect(g2); g2.connect(gainNode);
      o.start(now); o.stop(now + 2.5);
      oscs.push(o);
    });
    gainNode.gain.setValueAtTime(volume * 0.7, now);
    gainNode.gain.exponentialRampToValueAtTime(volume * 0.3, now + 0.1);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
  } else if (instrument === 'organ') {
    var o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    var o2 = audioCtx.createOscillator();
    o2.type = 'sine'; o2.frequency.value = freq * 2;
    var g2 = audioCtx.createGain(); g2.gain.value = 0.4;
    o.connect(gainNode); o2.connect(g2); g2.connect(gainNode);
    gainNode.gain.setValueAtTime(volume * 0.6, now);
    gainNode.gain.linearRampToValueAtTime(0.001, now + 1.8);
    o.start(now); o.stop(now + 1.8);
    o2.start(now); o2.stop(now + 1.8);
  } else {
    var o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    gainNode.gain.setValueAtTime(volume * 0.8, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    o.start(now); o.stop(now + 1.2);
  }
}

function onKeyPress(midi, noteName) {
  playNote(midi);
  document.getElementById('note-display').textContent = noteName;
  if (recording) {
    var elapsed = Date.now() - recStartTime;
    recordedNotes.push({midi: midi, time: elapsed, name: noteName});
    if (recordedNotes.length >= 32) {
      recording = false;
      document.getElementById('rec-btn').classList.remove('active');
      document.getElementById('rec-btn').textContent = '⏺ REC';
    }
    document.getElementById('rec-info').textContent = recordedNotes.length + ' notes';
  }
  _showInterstitial();
}

// Build keyboard: C3 to C6 (3 octaves + 1 note = 37 keys, midi 48-84)
var startMidi = 48; // C3
var endMidi = 84;   // C6

var WW = 42, WH, BW, BH;

function buildKeyboard() {
  var scroll = document.getElementById('keyboard-scroll');
  var kh = scroll.clientHeight || 200;
  WH = kh;
  BW = Math.round(WW * 0.62);
  BH = Math.round(WH * 0.62);

  var kb = document.getElementById('keyboard');
  kb.innerHTML = '';

  var whites = [];
  for (var m = startMidi; m <= endMidi; m++) {
    var n = m % 12;
    if (WHITE_NOTES.indexOf(n) !== -1) whites.push(m);
  }

  var totalW = whites.length * WW;
  kb.style.width = totalW + 'px';
  kb.style.height = WH + 'px';
  kb.style.position = 'relative';

  // White keys
  whites.forEach(function(m, i) {
    var n = m % 12;
    var oct = Math.floor(m / 12) - 1;
    var name = NOTE_NAMES[n] + oct;
    var div = document.createElement('div');
    div.className = 'wkey';
    div.style.left = (i * WW) + 'px';
    div.style.top = '0';
    div.style.width = (WW - 1) + 'px';
    div.style.height = WH + 'px';
    if (n === 0) {
      var lbl = document.createElement('span');
      lbl.className = 'kl';
      lbl.textContent = name;
      div.appendChild(lbl);
    }
    div.addEventListener('touchstart', function(e) {
      e.preventDefault();
      this.classList.add('active');
      onKeyPress(m + octaveShift * 12, name);
    }, {passive:false});
    div.addEventListener('touchend', function(e) {
      e.preventDefault();
      this.classList.remove('active');
    }, {passive:false});
    div.addEventListener('mousedown', function(e) {
      this.classList.add('active');
      onKeyPress(m + octaveShift * 12, name);
    });
    div.addEventListener('mouseup', function() { this.classList.remove('active'); });
    kb.appendChild(div);
  });

  // Black keys
  whites.forEach(function(m, i) {
    var n = m % 12;
    var wIdx = WHITE_NOTES.indexOf(n);
    if (wIdx < 6 && BLACK_NOTES[wIdx] !== null) {
      var bm = m + 1;
      var bn = bm % 12;
      var oct = Math.floor(bm / 12) - 1;
      var name = NOTE_NAMES[bn] + oct;
      var div = document.createElement('div');
      div.className = 'bkey';
      div.style.left = (i * WW + WW - BW/2) + 'px';
      div.style.top = '0';
      div.style.width = BW + 'px';
      div.style.height = BH + 'px';
      div.addEventListener('touchstart', function(e) {
        e.preventDefault();
        this.classList.add('active');
        onKeyPress(bm + octaveShift * 12, name);
      }, {passive:false});
      div.addEventListener('touchend', function(e) {
        e.preventDefault();
        this.classList.remove('active');
      }, {passive:false});
      div.addEventListener('mousedown', function(e) {
        e.stopPropagation();
        this.classList.add('active');
        onKeyPress(bm + octaveShift * 12, name);
      });
      div.addEventListener('mouseup', function() { this.classList.remove('active'); });
      kb.appendChild(div);
    }
  });

  // Scroll to C4
  var c4idx = 0;
  whites.forEach(function(m, i) { if (m === 60) c4idx = i; });
  scroll.scrollLeft = Math.max(0, c4idx * WW - scroll.clientWidth / 2);
}

document.querySelectorAll('[data-inst]').forEach(function(b) {
  b.onclick = function() {
    document.querySelectorAll('[data-inst]').forEach(function(x){x.classList.remove('sel');});
    this.classList.add('sel');
    instrument = this.dataset.inst;
  };
});

var octave = 4;
document.getElementById('oct-up').onclick = function() {
  if (octaveShift < 2) { octaveShift++; octave = 4 + octaveShift; document.getElementById('oct-display').textContent = octave; }
};
document.getElementById('oct-dn').onclick = function() {
  if (octaveShift > -2) { octaveShift--; octave = 4 + octaveShift; document.getElementById('oct-display').textContent = octave; }
};

document.getElementById('vol-range').oninput = function() {
  volume = parseInt(this.value) / 100;
};

// Recording
document.getElementById('rec-btn').onclick = function() {
  initAudio();
  if (!recording) {
    recording = true;
    recordedNotes = [];
    recStartTime = Date.now();
    this.classList.add('active');
    this.textContent = '⏹ STOP';
    document.getElementById('rec-info').textContent = '0 notes';
  } else {
    recording = false;
    this.classList.remove('active');
    this.textContent = '⏺ REC';
  }
};

document.getElementById('play-btn').onclick = function() {
  if (recordedNotes.length === 0) return;
  initAudio();
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  var startT = Date.now();
  recordedNotes.forEach(function(note) {
    var t = setTimeout(function() {
      playNote(note.midi);
      document.getElementById('note-display').textContent = note.name;
    }, note.time);
  });
};

document.getElementById('clear-btn').onclick = function() {
  recordedNotes = [];
  document.getElementById('rec-info').textContent = '0 notes';
  document.getElementById('note-display').textContent = '—';
};

window.addEventListener('resize', buildKeyboard);
buildKeyboard();

if(/screenshot=/.test(location.hash)){
  document.body.classList.add('ss');
  setTimeout(function(){
    var nd=document.getElementById('note-display');
    if(nd) nd.textContent='C — D — E — G (recording)';
    var info=document.getElementById('rec-info');
    if(info) info.textContent='14 notes recorded';
    // highlight a couple keys
    var keys=document.querySelectorAll('.wkey');
    if(keys[7]) keys[7].classList.add('active');
    if(keys[9]) keys[9].classList.add('active');
  },80);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roman Numerals</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  body{background:#0a0e1a;color:#c8d8ff;font-family:'Georgia',serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
  h1{font-size:1.5rem;margin:16px 0 4px;color:#8099ff;letter-spacing:2px}
  #mode-tabs{display:flex;gap:0;margin:8px 0 16px;background:#ffffff10;border-radius:12px;overflow:hidden}
  .mode-tab{padding:8px 18px;font-size:0.82rem;cursor:pointer;color:#8099ff55;transition:background 0.15s,color 0.15s}
  .mode-tab.active{background:#4060ff44;color:#8099ff}
  .card{background:#ffffff0a;border:1px solid #4060ff33;border-radius:16px;padding:16px 20px;width:300px;display:flex;flex-direction:column;gap:10px}
  .field-label{font-size:0.8rem;color:#8099ff88;letter-spacing:1px;margin-bottom:2px}
  .field-input{background:#ffffff10;border:1px solid #4060ff44;color:#c8d8ff;border-radius:10px;padding:10px 14px;font-size:1.2rem;outline:none;width:100%;text-align:center}
  .arrow{text-align:center;font-size:1.6rem;color:#4060ff88}
  .result-box{background:#4060ff15;border:1px solid #4060ff44;border-radius:10px;padding:12px;text-align:center;min-height:52px}
  #num-result,#rom-result{font-size:2rem;font-weight:bold;color:#8099ff;letter-spacing:3px;word-break:break-all}
  .convert-btn{background:linear-gradient(135deg,#2030a0,#4060ff);color:#c8d8ff;border:none;border-radius:50px;padding:12px;font-size:1rem;font-weight:bold;cursor:pointer;width:100%;transition:transform 0.1s}
  .convert-btn:active{transform:scale(0.97)}
  #error{color:#ff6060;font-size:0.8rem;min-height:1.2rem;text-align:center}
  /* Quiz mode */
  #quiz-section{display:none;flex-direction:column;align-items:center;gap:12px;padding-top:8px}
  #quiz-prompt{font-size:1rem;color:#8099ff88}
  #quiz-question{font-size:2.8rem;font-weight:bold;color:#c8d8ff;text-shadow:0 2px 16px #4060ff44;min-height:3rem;text-align:center;letter-spacing:4px}
  #quiz-input{background:#ffffff10;border:1px solid #4060ff44;color:#c8d8ff;border-radius:12px;padding:10px 14px;font-size:1.4rem;outline:none;width:200px;text-align:center}
  #quiz-submit{background:linear-gradient(135deg,#2030a0,#4060ff);color:#c8d8ff;border:none;border-radius:50px;padding:12px 32px;font-size:1rem;font-weight:bold;cursor:pointer}
  #quiz-feedback{font-size:1rem;min-height:1.4rem;font-weight:bold}
  #quiz-score{font-size:0.85rem;color:#8099ff66}
  /* Reference */
  #ref-section{display:none;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;width:100%;max-width:320px}
  .ref-row{display:flex;gap:0;width:100%}
  .ref-cell{flex:1;background:#ffffff08;border:1px solid #4060ff22;padding:5px 8px;text-align:center;font-size:0.82rem}
  .ref-cell.hdr{background:#4060ff22;color:#8099ff;font-weight:bold}
  #remove-ads{position:fixed;top:8px;right:8px;background:#ffffff10;border:1px solid #4060ff33;color:#8099ff66;font-size:0.65rem;padding:4px 8px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<button id="remove-ads" onclick="Android.purchase('remove_ads')">Remove Ads</button>
<h1>🏛️ Roman Numerals</h1>
<div id="mode-tabs">
  <div class="mode-tab active" onclick="showMode('convert',this)">Convert</div>
  <div class="mode-tab" onclick="showMode('quiz',this)">Quiz</div>
  <div class="mode-tab" onclick="showMode('ref',this)">Reference</div>
</div>

<!-- Convert -->
<div id="convert-section">
  <div class="card" id="n2r-card">
    <div><div class="field-label">NUMBER</div><input class="field-input" id="num-in" type="number" min="1" max="3999" placeholder="1–3999" oninput="autoConvert()"></div>
    <div class="arrow">↓</div>
    <div class="result-box"><div id="num-result">—</div></div>
  </div>
  <div style="margin:10px 0 6px;color:#8099ff66;font-size:0.85rem">— or —</div>
  <div class="card">
    <div><div class="field-label">ROMAN NUMERAL</div><input class="field-input" id="rom-in" type="text" placeholder="e.g. XIV" style="text-transform:uppercase" oninput="autoConvertRoman()"></div>
    <div class="arrow">↓</div>
    <div class="result-box"><div id="rom-result">—</div></div>
    <div id="error"></div>
  </div>
</div>

<!-- Quiz -->
<div id="quiz-section">
  <div id="quiz-prompt">What number is this?</div>
  <div id="quiz-question">XIV</div>
  <input id="quiz-input" type="number" min="1" max="3999" placeholder="Your answer">
  <button id="quiz-submit" onclick="checkQuiz()">CHECK</button>
  <div id="quiz-feedback"></div>
  <div id="quiz-score">Score: 0 / 0</div>
</div>

<!-- Reference -->
<div id="ref-section">
  <div class="ref-row"><div class="ref-cell hdr">Symbol</div><div class="ref-cell hdr">Value</div><div class="ref-cell hdr">Symbol</div><div class="ref-cell hdr">Value</div></div>
</div>

<script>
const VAL=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
const SYM=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
const REFS=[['I',1],['V',5],['X',10],['L',50],['C',100],['D',500],['M',1000],['IV',4],['IX',9],['XL',40],['XC',90],['CD',400],['CM',900]];

function toRoman(n){n=parseInt(n);if(!n||n<1||n>3999)return null;let r='';for(let i=0;i<VAL.length;i++)while(n>=VAL[i]){r+=SYM[i];n-=VAL[i];}return r;}
function fromRoman(s){s=s.toUpperCase().trim();let n=0,i=0;while(i<s.length){const cur=SYM.indexOf(s[i]),nxt=i+1<s.length?SYM.indexOf(s[i+1]):-1;if(nxt>=0&&VAL[nxt]>VAL[cur]){n+=VAL[nxt]-VAL[cur];i+=2;}else{n+=VAL[cur];i++;}}return n>0&&toRoman(n)===s?n:null;}
function autoConvert(){const v=document.getElementById('num-in').value;const r=toRoman(v);document.getElementById('num-result').textContent=r||'—';}
function autoConvertRoman(){const v=document.getElementById('rom-in').value.toUpperCase();document.getElementById('rom-in').value=v;const r=fromRoman(v);document.getElementById('rom-result').textContent=r?r.toString():'—';document.getElementById('error').textContent=r?'':(v.length>0?'Invalid Roman numeral':'');}

// Quiz
let qScore=0,qTotal=0,qAnswer=0,qMode='rom2num';
function newQuestion(){qMode=Math.random()<0.5?'rom2num':'num2rom';if(qMode==='rom2num'){const n=Math.floor(Math.random()*50)+1;qAnswer=n;document.getElementById('quiz-prompt').textContent='What number is this?';document.getElementById('quiz-question').textContent=toRoman(n);}else{const n=Math.floor(Math.random()*50)+1;qAnswer=toRoman(n);document.getElementById('quiz-prompt').textContent='Write in Roman numerals:';document.getElementById('quiz-question').textContent=n;}document.getElementById('quiz-input').value='';document.getElementById('quiz-feedback').textContent='';}
function checkQuiz(){const ans=document.getElementById('quiz-input').value.trim();if(!ans)return;qTotal++;const correct=qMode==='rom2num'?parseInt(ans)===qAnswer:ans.toUpperCase()===qAnswer;if(correct){qScore++;document.getElementById('quiz-feedback').style.color='#60ff80';document.getElementById('quiz-feedback').textContent='✅ Correct!';if(navigator.vibrate)navigator.vibrate(100);}else{document.getElementById('quiz-feedback').style.color='#ff6060';document.getElementById('quiz-feedback').textContent='❌ Answer: '+qAnswer;}document.getElementById('quiz-score').textContent='Score: '+qScore+' / '+qTotal;if(qTotal%5===0&&window.Android)Android.showInterstitial();setTimeout(newQuestion,1400);}

// Reference table
function buildRef(){const sec=document.getElementById('ref-section');const pairs=REFS.slice();while(pairs.length%2!==0)pairs.push(['','']);for(let i=0;i<pairs.length;i+=2){const row=document.createElement('div');row.className='ref-row';[pairs[i],pairs[i+1]].forEach(p=>{const s=document.createElement('div');s.className='ref-cell';s.textContent=p[0]||'';row.appendChild(s);const v=document.createElement('div');v.className='ref-cell';v.textContent=p[1]!==undefined&&p[1]!==''?p[1]:'';row.appendChild(v);});sec.appendChild(row);}}
buildRef();newQuestion();

function showMode(m,btn){document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['convert','quiz','ref'].forEach(s=>{const el=document.getElementById(s+'-section');if(el)el.style.display='none';});document.getElementById(m+'-section').style.display='flex';}
document.getElementById('convert-section').style.display='flex';

window.onPurchaseComplete=function(id){if(id==='remove_ads'){document.getElementById('remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
</script>
</body>
</html>

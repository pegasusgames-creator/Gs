<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sudoku</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
#banner { width:100%; height:50px; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:#555; font-size:12px; border-bottom:1px solid #333; }
#header { width:100%; padding:8px 16px; display:flex; align-items:center; justify-content:space-between; background:#1a1a1a; }
h1 { font-size:20px; color:#1565C0; font-weight:700; }
#info { font-size:12px; color:#aaa; text-align:right; }
#diff-select { display:flex; gap:6px; padding:6px 16px; justify-content:center; }
.diff-btn { font-size:12px; padding:5px 12px; background:#1e1e1e; color:#1565C0; border:1.5px solid #1565C0; border-radius:8px; cursor:pointer; touch-action:manipulation; }
.diff-btn.active { background:#1565C0; color:#fff; }
#controls { display:flex; gap:6px; padding:6px 16px; flex-wrap:wrap; justify-content:center; }
button { background:#1e1e1e; color:#1565C0; border:1.5px solid #1565C0; border-radius:8px; padding:7px 13px; font-size:13px; cursor:pointer; touch-action:manipulation; }
button:active { background:#1565C0; color:#fff; }
#note-btn.active { background:#1565C0; color:#fff; }
#msg { padding:5px 16px; text-align:center; font-size:14px; min-height:28px; color:#1565C0; }
#board { display:inline-grid; grid-template-columns:repeat(9,1fr); gap:0; border:3px solid #1565C0; border-radius:4px; background:#1565C0; margin:6px; }
.cell { width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; cursor:pointer; background:#1e1e1e; border:1px solid #333; position:relative; touch-action:manipulation; transition:background 0.1s; }
.cell.given { color:#90CAF9; pointer-events:none; }
.cell.selected { background:#1a3a6a; }
.cell.highlighted { background:#162440; }
.cell.error { color:#EF5350 !important; }
.cell.same-num { background:#1a3550; }
.cell .notes { display:grid; grid-template-columns:repeat(3,1fr); width:100%; height:100%; padding:1px; }
.cell .notes span { font-size:8px; color:#5c8ac0; display:flex; align-items:center; justify-content:center; }
/* Box borders */
.cell:nth-child(3n) { border-right:2px solid #1565C0; }
.cell:nth-child(3n+1) { border-left:2px solid #1565C0; }
.row3 { border-top:2px solid #1565C0; }
.row6 { border-top:2px solid #1565C0; }
#numpad { display:flex; gap:6px; padding:6px 16px; justify-content:center; flex-wrap:wrap; }
.num-btn { width:40px; height:40px; font-size:18px; font-weight:700; background:#1e1e1e; color:#90CAF9; border:1.5px solid #1565C0; border-radius:8px; cursor:pointer; touch-action:manipulation; }
.num-btn:active { background:#1565C0; color:#fff; }
.num-btn.erase { font-size:14px; width:48px; }
</style>
</head>
<body>
<div id="banner">Advertisement</div>
<div id="header">
  <h1>Sudoku</h1>
  <span id="info">❤️❤️❤️ | ⏱ 0:00</span>
</div>
<div id="diff-select">
  <button class="diff-btn active" onclick="setDiff(0)">Easy</button>
  <button class="diff-btn" onclick="setDiff(1)">Medium</button>
  <button class="diff-btn" onclick="setDiff(2)">Hard</button>
</div>
<div id="controls">
  <button id="note-btn" onclick="toggleNotes()">Notes</button>
  <button onclick="hint()">Hint</button>
  <button onclick="checkBoard()">Check</button>
  <button onclick="newGame()">New</button>
  <button onclick="removeAds()">No Ads</button>
</div>
<div id="msg">Tap a cell, then a number to fill it.</div>
<div id="board"></div>
<div id="numpad">
  <button class="num-btn" onclick="enterNum(1)">1</button>
  <button class="num-btn" onclick="enterNum(2)">2</button>
  <button class="num-btn" onclick="enterNum(3)">3</button>
  <button class="num-btn" onclick="enterNum(4)">4</button>
  <button class="num-btn" onclick="enterNum(5)">5</button>
  <button class="num-btn" onclick="enterNum(6)">6</button>
  <button class="num-btn" onclick="enterNum(7)">7</button>
  <button class="num-btn" onclick="enterNum(8)">8</button>
  <button class="num-btn" onclick="enterNum(9)">9</button>
  <button class="num-btn erase" onclick="enterNum(0)">Erase</button>
</div>

<script>
// 10 puzzles per difficulty. Format: 81-char strings (0=empty)
// All are valid, unique-solution Sudoku puzzles

// Solutions (matching puzzles above)
const SOLUTIONS = {
  easy: [

    "523816749748293165691472835239645987475928613168357294352784961915631478876159342",
    "138924765524617983769385172953278641687143529412596837276851394895432716341769258",
    "743186259681295437952347618537814926219673845468529371825761394174938562396452781",
    "483756912572948631914371568847219253253784169691563749129435876765892384638127495",

  ],
  medium: [

    "719645328253978641684321195426153879817496253295782467131267984362819735978534612",
    "946387251138652714275814369384129675751364928629578143413291867867435292592746831",
    "195284637437692815268975341351847269876431954924163782783529416512346978649718523",
    "138249756754368921296751438520893146913624572649175283367982415892417365475536897",
    "968453127352781469174629835491573682684392571287164953539846217826917345715238946",
    "432816975186479253759132486218347961675593148953268734521984317364715829847621593",
    "524391867386782941719468235637123594862954713495876132971235486248617359153649278",
    "971346258523197864486852971867923514135784629249561783394218645712635498658479132",

  ],
  hard: [

    "896423517215679348764851923183947265439512786527368494672184259951236874348795631",
    "381274956249165378756938512672349185935821764418567293163792645827413569594656837",
    "286479315743195862591523746342658197812947653675312489467831524359264178928785431",
    "413587692956124872783296415724831569235769841149325387397412256671953124862648937",
    "491763285729581643865924317178645923342817956953372468234196735617238594589453172",
    "483921657967345821251876493548132976729564138136798245372689514894213769615457382",
    "214986375365172894738459261679135428851624937942768513597841632823397145136542782",
    "971346258523197864486852971867923514135784629249561783394218645712635498658479132",
    "145326978893754126276918435428135367519672843637289514382461795964537281751893642",
  ],
};

const state = {
  diff: 0, puzzleIdx: 0, board: [], given: [], notes: Array(81).fill(null).map(()=>new Set()),
  selected: -1, mistakes: 0, noteMode: false, timer: 0, timerInterval: null,
  removeAds: false, won: false
};

function setDiff(d) {
  state.diff = d;
  document.querySelectorAll('.diff-btn').forEach((b,i)=>b.classList.toggle('active',i===d));
  state.puzzleIdx = 0;
  newGame();
}

function newGame() {
  clearInterval(state.timerInterval);
  const puzzles = PUZZLES[['easy','medium','hard'][state.diff]];
  const pstr = puzzles[state.puzzleIdx % puzzles.length];
  state.puzzleIdx++;
  state.board = pstr.split('').map(Number);
  state.given = pstr.split('').map(v=>v!=='0');
  state.notes = Array(81).fill(null).map(()=>new Set());
  state.selected = -1;
  state.mistakes = 0;
  state.noteMode = false;
  state.won = false;
  state.timer = 0;
  document.getElementById('note-btn').classList.remove('active');
  document.getElementById('msg').textContent = 'Tap cell, then number to fill.';
  state.timerInterval = setInterval(()=>{ state.timer++; updateInfo(); }, 1000);
  updateInfo();
  renderBoard();
}

function updateInfo() {
  const m = '❤'.repeat(3-state.mistakes) + (state.mistakes>0?'🖤'.repeat(state.mistakes):'');
  const t = state.timer;
  document.getElementById('info').textContent = m + ' | ⏱ '+Math.floor(t/60)+':'+(t%60<10?'0':'')+t%60;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let i=0;i<81;i++) {
    const r=Math.floor(i/9), c=i%9;
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (state.given[i]) cell.classList.add('given');
    if (r===3||r===6) cell.classList.add('row'+(r===3?3:6));
    if (i===state.selected) cell.classList.add('selected');
    if (state.selected>=0 && !state.given[i] && state.board[i]>0 && state.board[i]===state.board[state.selected]) cell.classList.add('same-num');
    const sel = state.selected;
    if (sel>=0) {
      const sr=Math.floor(sel/9),sc=sel%9;
      if (r===sr||c===sc||((Math.floor(r/3)===Math.floor(sr/3))&&(Math.floor(c/3)===Math.floor(sc/3)))) {
        if (i!==sel) cell.classList.add('highlighted');
      }
    }
    if (state.board[i]>0) {
      cell.textContent = state.board[i];
      if (!state.given[i] && state.board[i] > 0) {
        const sol = SOLUTIONS[['easy','medium','hard'][state.diff]];
        const pidx = (state.puzzleIdx-1) % sol.length;
        if (parseInt(sol[pidx][i]) !== state.board[i]) cell.classList.add('error');
      }
    } else if (state.notes[i].size>0) {
      const notesDiv = document.createElement('div');
      notesDiv.className = 'notes';
      for (let n=1;n<=9;n++) {
        const span = document.createElement('span');
        span.textContent = state.notes[i].has(n) ? n : '';
        notesDiv.appendChild(span);
      }
      cell.appendChild(notesDiv);
    }
    cell.addEventListener('click', ()=>selectCell(i));
    board.appendChild(cell);
  }
}

function selectCell(i) {
  state.selected = i;
  renderBoard();
}

function enterNum(n) {
  if (state.selected<0||state.given[state.selected]) return;
  if (state.noteMode && n>0) {
    if (state.notes[state.selected].has(n)) state.notes[state.selected].delete(n);
    else state.notes[state.selected].add(n);
  } else {
    state.board[state.selected] = n;
    state.notes[state.selected].clear();
    if (n>0) {
      const sol = SOLUTIONS[['easy','medium','hard'][state.diff]];
      const pidx = (state.puzzleIdx-1) % sol.length;
      if (parseInt(sol[pidx][state.selected]) !== n) {
        state.mistakes++;
        updateInfo();
        if (state.mistakes>=3) {
          document.getElementById('msg').textContent='3 mistakes! Keep going or start new game.';
          if (!state.removeAds && window.Android) Android.showInterstitial();
        }
      }
    }
  }
  renderBoard();
  checkWin();
}

function checkWin() {
  if (state.board.includes(0)) return;
  const sol = SOLUTIONS[['easy','medium','hard'][state.diff]];
  const pidx = (state.puzzleIdx-1) % sol.length;
  if (state.board.every((v,i)=>v===parseInt(sol[pidx][i]))) {
    clearInterval(state.timerInterval);
    state.won = true;
    document.getElementById('msg').textContent='🎉 Solved in '+state.timer+'s with '+state.mistakes+' mistake'+(state.mistakes===1?'':'s')+'!';
    if (!state.removeAds && window.Android) Android.showInterstitial();
  }
}

function checkBoard() {
  const sol = SOLUTIONS[['easy','medium','hard'][state.diff]];
  const pidx = (state.puzzleIdx-1) % sol.length;
  const errors = state.board.filter((v,i)=>v>0&&!state.given[i]&&v!==parseInt(sol[pidx][i])).length;
  document.getElementById('msg').textContent = errors===0 ? 'Looking good! No mistakes found.' : errors+' incorrect cell'+(errors===1?'':'s')+' found!';
  renderBoard();
}

function hint() {
  const sol = SOLUTIONS[['easy','medium','hard'][state.diff]];
  const pidx = (state.puzzleIdx-1) % sol.length;
  const empties = state.board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
  if (!empties.length) return;
  const pick = empties[Math.floor(Math.random()*empties.length)];
  state.board[pick] = parseInt(sol[pidx][pick]);
  state.given[pick] = true;
  state.selected = pick;
  renderBoard();
  checkWin();
}

function toggleNotes() {
  state.noteMode = !state.noteMode;
  document.getElementById('note-btn').classList.toggle('active', state.noteMode);
  document.getElementById('msg').textContent = state.noteMode ? 'Note mode ON' : 'Note mode OFF';
}

function removeAds() {
  if (window.Android) Android.purchase('remove_ads');
  else { state.removeAds=true; document.getElementById('msg').textContent='Ads removed!'; }
}
window.onPurchaseComplete = function(sku) {state.removeAds=true;};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
newGame();
</script>
</body>
</html>

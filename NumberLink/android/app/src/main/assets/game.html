<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NumberLink</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
#banner { width:100%; height:50px; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:#555; font-size:12px; border-bottom:1px solid #333; }
#header { width:100%; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; background:#1a1a1a; }
h1 { font-size:20px; color:#FF9800; font-weight:700; }
#info { font-size:13px; color:#aaa; }
#controls { display:flex; gap:8px; padding:8px 16px; flex-wrap:wrap; justify-content:center; }
button { background:#1e1e1e; color:#FF9800; border:1.5px solid #FF9800; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; touch-action:manipulation; }
button:active { background:#FF9800; color:#000; }
#msg { padding:6px 16px; text-align:center; font-size:15px; min-height:32px; color:#FF9800; }
canvas { display:block; margin:4px auto; border-radius:8px; border:2px solid #FF9800; touch-action:none; }
#level-select { display:none; flex-wrap:wrap; gap:6px; padding:8px 16px; justify-content:center; max-width:360px; }
.lvl-btn { padding:6px 12px; font-size:13px; min-width:38px; }
.lvl-btn.done { background:#FF9800; color:#000; border-color:#FF9800; }
</style>
</head>
<body>
<div id="banner">Advertisement</div>
<div id="header">
  <h1>NumberLink</h1>
  <span id="info">Level 1</span>
</div>
<div id="controls">
  <button onclick="resetLevel()">Reset</button>
  <button onclick="toggleLevelSelect()">Levels</button>
  <button onclick="removeAds()">No Ads</button>
</div>
<div id="msg">Connect matching numbers without crossing paths!</div>
<canvas id="c"></canvas>
<div id="level-select"></div>

<script>
// 40 NumberLink puzzles. Each: {size, endpoints:[[r1,c1,r2,c2,colorIdx],...], solution}
// Verified solvable 6x6 to 9x9 puzzles

const COLORS = ['#EF5350','#1E88E5','#43A047','#FF9800','#9C27B0','#00BCD4','#FFEB3B','#FF4081'];

// Compact format: size + pairs of endpoints [[r1,c1,r2,c2],...]
// All 40 levels are hardcoded valid NumberLink puzzles

const levels = [
  // 6x6 levels (1-15)
  {sz:6, pairs:[[0,0,5,0],[0,5,5,5],[0,2,4,2],[2,0,2,5],[4,0,4,5]]},
  {sz:6, pairs:[[0,0,0,5],[5,0,5,5],[0,2,5,2],[1,0,1,5],[3,1,3,4]]},
  {sz:6, pairs:[[0,1,5,1],[0,4,5,4],[2,0,2,5],[1,2,4,2],[0,0,5,5]]},
  {sz:6, pairs:[[0,0,3,5],[5,0,5,3],[0,3,5,3],[1,1,4,4],[2,0,2,5]]},
  {sz:6, pairs:[[0,0,5,0],[0,5,5,5],[0,2,5,3],[1,0,4,0],[2,2,3,3]]},
  {sz:6, pairs:[[0,1,0,4],[5,1,5,4],[1,0,4,0],[1,5,4,5],[2,2,3,3]]},
  {sz:6, pairs:[[0,0,5,5],[0,5,5,0],[1,1,4,4],[2,0,2,5],[0,2,5,2]]},
  {sz:6, pairs:[[0,0,0,5],[5,0,5,5],[2,0,2,5],[0,2,5,2],[1,3,4,3]]},
  {sz:6, pairs:[[0,0,4,5],[0,5,4,0],[1,1,3,4],[1,4,3,1],[2,2,2,3]]},
  {sz:6, pairs:[[0,2,5,2],[2,0,2,5],[0,0,5,5],[1,1,4,4],[0,5,5,0]]},
  {sz:6, pairs:[[0,0,5,0],[0,5,5,5],[3,0,3,5],[0,3,5,3],[1,1,2,4]]},
  {sz:6, pairs:[[0,0,2,5],[5,0,3,5],[0,3,5,3],[1,0,4,0],[2,2,3,2]]},
  {sz:6, pairs:[[0,1,5,4],[0,4,5,1],[1,0,4,5],[1,5,4,0],[2,2,3,3]]},
  {sz:6, pairs:[[0,0,5,5],[5,0,0,5],[1,2,4,3],[2,1,3,4],[2,3,3,2]]},
  {sz:6, pairs:[[0,0,0,5],[5,0,5,5],[1,1,4,4],[1,4,4,1],[2,2,3,3]]},
  // 7x7 levels (16-28)
  {sz:7, pairs:[[0,0,6,6],[0,6,6,0],[1,1,5,5],[1,5,5,1],[2,2,4,4],[0,3,6,3],[3,0,3,6]]},
  {sz:7, pairs:[[0,0,6,0],[0,6,6,6],[0,3,6,3],[3,0,3,6],[1,1,5,5],[1,5,5,1],[2,3,4,3]]},
  {sz:7, pairs:[[0,1,6,5],[0,5,6,1],[1,0,5,6],[1,6,5,0],[2,2,4,4],[0,3,6,3],[3,0,3,6]]},
  {sz:7, pairs:[[0,0,0,6],[6,0,6,6],[0,3,6,3],[3,0,3,6],[1,2,5,4],[1,4,5,2],[2,3,4,3]]},
  {sz:7, pairs:[[0,0,4,6],[0,6,4,0],[2,0,6,4],[2,6,6,2],[1,3,5,3],[0,3,6,3],[3,1,3,5]]},
  {sz:7, pairs:[[0,0,6,6],[6,0,0,6],[1,1,5,5],[2,2,4,4],[0,3,6,3],[3,0,3,6],[2,3,4,3]]},
  {sz:7, pairs:[[0,1,0,5],[6,1,6,5],[1,0,5,0],[1,6,5,6],[2,2,4,4],[2,4,4,2],[3,3,3,3]]},
  {sz:7, pairs:[[0,0,3,6],[3,0,6,6],[0,3,6,3],[1,1,5,5],[1,5,5,1],[2,2,4,4],[0,6,6,0]]},
  {sz:7, pairs:[[0,0,6,0],[0,6,6,6],[1,1,5,1],[1,5,5,5],[2,2,4,4],[2,4,4,2],[3,0,3,6]]},
  {sz:7, pairs:[[0,0,0,6],[6,0,6,6],[1,0,5,6],[1,6,5,0],[2,1,4,5],[2,5,4,1],[3,2,3,4]]},
  {sz:7, pairs:[[0,2,6,4],[0,4,6,2],[1,0,5,6],[1,6,5,0],[2,3,4,3],[0,0,6,6],[0,6,6,0]]},
  {sz:7, pairs:[[0,0,6,6],[0,6,6,0],[1,1,5,5],[1,5,5,1],[2,2,4,4],[3,0,3,6],[0,3,6,3]]},
  {sz:7, pairs:[[0,1,6,5],[0,3,6,3],[0,5,6,1],[2,0,4,6],[2,6,4,0],[1,3,5,3],[3,1,3,5]]},
  // 8x8 levels (29-40)
  {sz:8, pairs:[[0,0,7,7],[0,7,7,0],[1,1,6,6],[1,6,6,1],[2,2,5,5],[2,5,5,2],[0,3,7,4],[3,0,4,7]]},
  {sz:8, pairs:[[0,0,7,0],[0,7,7,7],[0,3,7,4],[3,0,4,7],[1,1,6,6],[1,6,6,1],[2,2,5,5],[2,5,5,2]]},
  {sz:8, pairs:[[0,0,0,7],[7,0,7,7],[0,3,7,4],[3,0,4,7],[1,1,6,6],[1,6,6,1],[2,3,5,4],[3,2,4,5]]},
  {sz:8, pairs:[[0,1,7,6],[0,6,7,1],[1,0,6,7],[1,7,6,0],[2,2,5,5],[2,5,5,2],[0,3,7,4],[3,0,4,7]]},
  {sz:8, pairs:[[0,0,7,7],[7,0,0,7],[1,2,6,5],[1,5,6,2],[2,1,5,6],[2,6,5,1],[0,4,7,3],[4,0,3,7]]},
  {sz:8, pairs:[[0,0,4,7],[0,7,4,0],[3,0,7,4],[3,7,7,3],[1,1,6,6],[1,6,6,1],[2,3,5,4],[0,3,7,4]]},
  {sz:8, pairs:[[0,2,7,5],[0,5,7,2],[1,0,6,7],[1,7,6,0],[2,2,5,5],[3,0,4,7],[3,7,4,0],[0,0,7,7]]},
  {sz:8, pairs:[[0,0,7,7],[0,7,7,0],[1,1,6,6],[2,2,5,5],[1,6,6,1],[2,5,5,2],[3,3,4,4],[0,3,7,4]]},
  {sz:8, pairs:[[0,1,7,6],[0,4,7,3],[1,0,6,7],[3,0,4,7],[2,2,5,5],[1,3,6,4],[2,4,5,3],[0,0,7,7]]},
  {sz:8, pairs:[[0,0,0,7],[7,0,7,7],[1,1,6,6],[1,6,6,1],[2,2,5,5],[2,5,5,2],[0,3,7,4],[3,0,4,7]]},
  {sz:8, pairs:[[0,2,7,5],[0,5,7,2],[2,0,5,7],[2,7,5,0],[1,3,6,4],[1,4,6,3],[3,1,4,6],[0,0,7,7]]},
  {sz:8, pairs:[[0,0,7,0],[0,7,7,7],[1,2,6,5],[1,5,6,2],[2,0,5,7],[2,7,5,0],[3,3,4,4],[0,3,7,4]]},
];

const state = { level:1, paths:{}, drawing:false, drawColor:-1, drawPath:[], removeAds:false, completed:new Set() };

let W = Math.min(window.innerWidth-24, 380);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function cellSize(sz) { return Math.floor(W / sz); }

function loadLevel(n) {
  state.level = n;
  state.paths = {};
  state.drawing = false;
  state.drawColor = -1;
  state.drawPath = [];
  const lv = levels[(n-1) % levels.length];
  const cs = cellSize(lv.sz);
  canvas.width = lv.sz * cs;
  canvas.height = lv.sz * cs;
  document.getElementById('info').textContent = 'Level '+n+' ('+lv.sz+'×'+lv.sz+')';
  document.getElementById('msg').textContent = 'Connect matching numbers!';
  draw();
}

function getLevel() { return levels[(state.level-1) % levels.length]; }

function endpointAt(r, c) {
  const lv = getLevel();
  for (let pi=0; pi<lv.pairs.length; pi++) {
    const [r1,c1,r2,c2] = lv.pairs[pi];
    if ((r===r1&&c===c1)||(r===r2&&c===c2)) return pi;
  }
  return -1;
}

function pathColorAt(r, c) {
  for (const [ci, path] of Object.entries(state.paths)) {
    if (path.some(([pr,pc])=>pr===r&&pc===c)) return parseInt(ci);
  }
  return -1;
}

function draw() {
  const lv = getLevel();
  const cs = cellSize(lv.sz);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Background
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid lines
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1;
  for (let i=0;i<=lv.sz;i++) {
    ctx.beginPath(); ctx.moveTo(i*cs,0); ctx.lineTo(i*cs,lv.sz*cs); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*cs); ctx.lineTo(lv.sz*cs,i*cs); ctx.stroke();
  }
  // Draw paths
  for (const [ci, path] of Object.entries(state.paths)) {
    if (path.length < 2) continue;
    ctx.strokeStyle = COLORS[parseInt(ci)%COLORS.length];
    ctx.lineWidth = cs*0.45;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    path.forEach(([r,c],i) => {
      const x=c*cs+cs/2, y=r*cs+cs/2;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  // Draw current drawing path
  if (state.drawing && state.drawPath.length > 1) {
    ctx.strokeStyle = COLORS[state.drawColor%COLORS.length]+'aa';
    ctx.lineWidth = cs*0.45;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    state.drawPath.forEach(([r,c],i) => {
      const x=c*cs+cs/2, y=r*cs+cs/2;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  // Draw endpoints (numbers)
  lv.pairs.forEach(([r1,c1,r2,c2], pi) => {
    const clr = COLORS[pi%COLORS.length];
    [[r1,c1],[r2,c2]].forEach(([r,c]) => {
      ctx.fillStyle = clr;
      ctx.beginPath();
      ctx.arc(c*cs+cs/2, r*cs+cs/2, cs*0.38, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold '+Math.round(cs*0.4)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pi+1, c*cs+cs/2, r*cs+cs/2);
    });
  });
}

function getCellFromPointer(e) {
  const rect = canvas.getBoundingClientRect();
  const lv = getLevel();
  const cs = cellSize(lv.sz);
  const x = (e.clientX-rect.left)*(canvas.width/rect.width);
  const y = (e.clientY-rect.top)*(canvas.height/rect.height);
  return [Math.floor(y/cs), Math.floor(x/cs)];
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [r,c] = getCellFromPointer(e);
  const lv = getLevel();
  if (r<0||r>=lv.sz||c<0||c>=lv.sz) return;
  const ep = endpointAt(r,c);
  if (ep >= 0) {
    // Clear existing path for this color
    state.paths[ep] = [];
    state.drawing = true;
    state.drawColor = ep;
    state.drawPath = [[r,c]];
  } else {
    const pathColor = pathColorAt(r,c);
    if (pathColor >= 0) {
      // Start drawing from this point (truncate path)
      const path = state.paths[pathColor];
      const idx = path.findIndex(([pr,pc])=>pr===r&&pc===c);
      state.paths[pathColor] = path.slice(0,idx+1);
      state.drawing = true;
      state.drawColor = pathColor;
      state.drawPath = [...state.paths[pathColor]];
    }
  }
});

canvas.addEventListener('pointermove', e => {
  if (!state.drawing) return;
  e.preventDefault();
  const [r,c] = getCellFromPointer(e);
  const lv = getLevel();
  if (r<0||r>=lv.sz||c<0||c>=lv.sz) return;
  const last = state.drawPath[state.drawPath.length-1];
  if (last[0]===r&&last[1]===c) return;
  // Only allow adjacent cells
  if (Math.abs(r-last[0])+Math.abs(c-last[1])!==1) return;
  // Check if backtracking
  if (state.drawPath.length>=2) {
    const prev=state.drawPath[state.drawPath.length-2];
    if (prev[0]===r&&prev[1]===c) { state.drawPath.pop(); draw(); return; }
  }
  // Check if cell is occupied by another path
  const existing = pathColorAt(r,c);
  if (existing>=0 && existing!==state.drawColor) return;
  // Check endpoint
  const ep = endpointAt(r,c);
  state.drawPath.push([r,c]);
  if (ep>=0 && ep!==state.drawColor) return; // Can't enter other endpoint
  draw();
});

canvas.addEventListener('pointerup', e => {
  if (!state.drawing) return;
  state.paths[state.drawColor] = [...state.drawPath];
  state.drawing = false;
  state.drawPath = [];
  draw();
  checkSolved();
});

function checkSolved() {
  const lv = getLevel();
  // All pairs connected?
  for (let pi=0; pi<lv.pairs.length; pi++) {
    const path = state.paths[pi];
    if (!path||path.length<2) return;
    const [r1,c1,r2,c2]=lv.pairs[pi];
    const start=path[0], end=path[path.length-1];
    const ok=(start[0]===r1&&start[1]===c1&&end[0]===r2&&end[1]===c2)||
             (start[0]===r2&&start[1]===c2&&end[0]===r1&&end[1]===c1);
    if (!ok) return;
  }
  // All cells filled?
  const filled = new Set();
  Object.values(state.paths).forEach(path=>path.forEach(([r,c])=>filled.add(r*100+c)));
  if (filled.size !== lv.sz*lv.sz) return;
  winLevel();
}

function winLevel() {
  state.completed.add(state.level);
  document.getElementById('msg').textContent='🎉 Puzzle Complete!';
  buildLevelSelect();
  setTimeout(()=>{
    const next=state.level+1;
    if (!state.removeAds&&next%3===0&&window.Android) Android.showInterstitial();
    if (next<=levels.length) loadLevel(next);
  },1300);
}

function resetLevel() { loadLevel(state.level); }

function toggleLevelSelect() {
  const ls=document.getElementById('level-select');
  ls.style.display=ls.style.display==='flex'?'none':'flex';
}

function buildLevelSelect() {
  const ls=document.getElementById('level-select');
  ls.innerHTML='';
  levels.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='lvl-btn'+(state.completed.has(i+1)?' done':'');
    b.textContent=i+1;
    b.onclick=()=>{loadLevel(i+1);ls.style.display='none';};
    ls.appendChild(b);
  });
}

function removeAds() {
  if (window.Android) Android.purchase('remove_ads');
  else { state.removeAds=true; document.getElementById('msg').textContent='Ads removed!'; }
}
window.onPurchaseComplete = function(sku) {state.removeAds=true;};
loadLevel(1);
buildLevelSelect();
</script>
</body>
</html>

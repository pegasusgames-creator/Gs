<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reaction Time</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#1a0a00; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#app { display:flex; flex-direction:column; height:100%; }
#tap-area {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:background 0.1s; cursor:pointer; user-select:none;
  background:#1a1a1a;
}
#tap-area.waiting { background:#c0392b; }
#tap-area.ready { background:#27ae60; }
#tap-area.false-start { background:#8e44ad; }
#main-text { font-size:2rem; font-weight:900; text-align:center; padding:20px; pointer-events:none; }
#sub-text { font-size:1rem; color:rgba(255,255,255,0.7); text-align:center; pointer-events:none; }
#results { background:#111; padding:20px; }
.result-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; font-size:1rem; }
.result-val { font-weight:700; color:#FF5722; }
.trials { display:flex; gap:8px; justify-content:center; margin:10px 0; flex-wrap:wrap; }
.trial-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; }
.trial-dot.pending { background:#333; }
.trial-dot.ok { background:#27ae60; }
.trial-dot.fs { background:#8e44ad; }
#rating { text-align:center; font-size:1.4rem; font-weight:900; margin:10px 0; }
#btn-restart { display:none; width:calc(100% - 32px); margin:8px 16px; background:#FF5722; border:none; border-radius:30px; color:#fff; font-size:1.1rem; font-weight:800; padding:14px; cursor:pointer; }
#admob-banner { height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="tap-area">
    <div id="main-text">Tap to Start</div>
    <div id="sub-text">Tap as fast as possible when screen turns GREEN</div>
  </div>
  <div id="results">
    <div class="trials" id="trials-row"></div>
    <div id="rating"></div>
    <div class="result-row"><span>Last</span><span class="result-val" id="r-last">—</span></div>
    <div class="result-row"><span>Average</span><span class="result-val" id="r-avg">—</span></div>
    <div class="result-row"><span>Best</span><span class="result-val" id="r-best">—</span></div>
  </div>
  <button id="btn-restart">Play Again</button>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
var TRIALS=5;
var state={
  phase:'idle', // idle, waiting, ready, false-start, done
  trialIndex:0, results:[], greenAt:0,
  waitTimer:null, removeAds:false
};
var allBest=parseInt(localStorage.getItem('rt_best')||'99999');
var tapArea=document.getElementById('tap-area');
var mainText=document.getElementById('main-text');
var subText=document.getElementById('sub-text');
var trialsRow=document.getElementById('trials-row');
var rLast=document.getElementById('r-last');
var rAvg=document.getElementById('r-avg');
var rBest=document.getElementById('r-best');
var ratingEl=document.getElementById('rating');
var btnRestart=document.getElementById('btn-restart');

function renderTrials(){
  trialsRow.innerHTML='';
  for(var i=0;i<TRIALS;i++){
    var dot=document.createElement('div');
    dot.className='trial-dot';
    if(i<state.results.length){
      var r=state.results[i];
      dot.className='trial-dot '+(r<0?'fs':'ok');
      dot.textContent=r<0?'FS':r+'ms';
      dot.style.fontSize=r<0?'0.6rem':'0.55rem';
    } else {
      dot.className='trial-dot pending';
      dot.textContent=(i+1);
    }
    trialsRow.appendChild(dot);
  }
}

function updateStats(){
  var valid=state.results.filter(function(r){return r>=0;});
  if(valid.length===0)return;
  var last=state.results[state.results.length-1];
  rLast.textContent=last<0?'False Start':last+'ms';
  var avg=Math.round(valid.reduce(function(a,b){return a+b;},0)/valid.length);
  rAvg.textContent=avg+'ms';
  var best=Math.min.apply(null,valid);
  if(best<allBest){allBest=best;localStorage.setItem('rt_best',best);}
  rBest.textContent=allBest+'ms';
  if(state.phase==='done'){
    var rating='';
    if(avg<200)rating='⚡ Elite!';
    else if(avg<250)rating='Pro';
    else if(avg<350)rating='Average';
    else rating='Keep practicing!';
    ratingEl.textContent=rating;
  }
}

function startWaiting(){
  state.phase='waiting';
  tapArea.className='waiting';
  mainText.textContent='Wait for green...';
  subText.textContent='Don\'t tap yet!';
  var delay=1000+Math.random()*4000;
  state.waitTimer=setTimeout(function(){
    if(state.phase==='waiting'){
      state.phase='ready';
      state.greenAt=performance.now();
      tapArea.className='ready';
      mainText.textContent='TAP NOW!';
      subText.textContent='';
    }
  },delay);
}

function handleTap(){
  if(state.phase==='idle'){
    state.results=[];state.trialIndex=0;state.phase='waiting';
    renderTrials();ratingEl.textContent='';
    btnRestart.style.display='none';
    startWaiting();
    return;
  }
  if(state.phase==='done'){return;}
  if(state.phase==='waiting'){
    // False start
    clearTimeout(state.waitTimer);
    state.results.push(-1);
    state.trialIndex++;
    state.phase='false-start';
    tapArea.className='false-start';
    mainText.textContent='False Start!';
    subText.textContent='You tapped too early';
    renderTrials();updateStats();
    setTimeout(function(){nextTrial();},1200);
    return;
  }
  if(state.phase==='ready'){
    var rt=Math.round(performance.now()-state.greenAt);
    state.results.push(rt);
    state.trialIndex++;
    mainText.textContent=rt+' ms';
    subText.textContent=rt<200?'Incredible!':rt<280?'Fast!':rt<400?'Good':'Keep practicing';
    tapArea.className='';tapArea.style.background='#1a3a2a';
    renderTrials();updateStats();
    setTimeout(function(){nextTrial();},1000);
    return;
  }
}

function nextTrial(){
  if(state.trialIndex>=TRIALS){
    state.phase='done';
    tapArea.className='';tapArea.style.background='#111';
    mainText.textContent='Session Complete!';
    subText.textContent='';
    renderTrials();updateStats();
    btnRestart.style.display='block';
    if(!state.removeAds&&window.Android)Android.showInterstitial();
    return;
  }
  startWaiting();
}

tapArea.addEventListener('touchstart',function(e){e.preventDefault();handleTap();},{passive:false});
tapArea.addEventListener('mousedown',handleTap);
btnRestart.addEventListener('click',function(){
  state.phase='idle';tapArea.className='';tapArea.style.background='#1a1a1a';
  mainText.textContent='Tap to Start';subText.textContent='Tap as fast as possible when screen turns GREEN';
  ratingEl.textContent='';btnRestart.style.display='none';
  renderTrials();
});

renderTrials();
if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
window.onAdMobLoaded=function(){};
</script>
</body>
</html>

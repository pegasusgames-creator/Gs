<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Number Tap</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#1a0a00; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#app { display:flex; flex-direction:column; height:100%; }
#hud { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:#0d0600; flex-shrink:0; }
.hv { font-size:1.3rem; font-weight:900; color:#FF5722; }
.hl { font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; color:#664; }
#timer-disp { font-size:2rem; font-weight:900; color:#FF5722; font-variant-numeric:tabular-nums; }
#game-area { flex:1; position:relative; overflow:hidden; }
.num-btn {
  position:absolute; width:56px; height:56px;
  background:#1a1a1a; border:2px solid #FF5722;
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; font-weight:900; cursor:pointer; user-select:none;
  transition:transform 0.08s;
  color:#FF5722;
}
.num-btn:active { transform:scale(0.88); background:#2a1000; }
.num-btn.target { border-color:#FFD600; color:#FFD600; box-shadow:0 0 12px rgba(255,214,0,0.4); }
.num-btn.gone { opacity:0; pointer-events:none; transition:opacity 0.15s; }
#mode-bar { display:flex; gap:6px; padding:8px 12px; background:#0d0600; flex-shrink:0; overflow-x:auto; }
.mode-chip { flex-shrink:0; background:#1a0a00; border:1.5px solid #FF5722; border-radius:20px; color:#FF5722; font-size:0.75rem; font-weight:700; padding:6px 12px; cursor:pointer; }
.mode-chip.active { background:#FF5722; color:#fff; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:14px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#FF5722; }
#overlay .sub { color:#aaa; font-size:0.9rem; text-align:center; max-width:280px; line-height:1.5; }
#overlay .big { font-size:1.2rem; font-weight:800; text-align:center; line-height:1.6; }
#btn-play { background:#FF5722; border:none; border-radius:30px; color:#fff; font-size:1.2rem; font-weight:800; padding:14px 48px; cursor:pointer; }
#admob-banner { height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><div class="hl">Mode</div><div class="hv" id="mode-disp">1-25</div></div>
    <div style="text-align:center"><div class="hl">Time</div><div id="timer-disp">0.00</div></div>
    <div style="text-align:right"><div class="hl">Next</div><div class="hv" id="next-disp">1</div></div>
  </div>
  <div id="mode-bar">
    <div class="mode-chip active" data-mode="seq">1→25</div>
    <div class="mode-chip" data-mode="even">Evens</div>
    <div class="mode-chip" data-mode="odd">Odds</div>
    <div class="mode-chip" data-mode="mult3">×3</div>
    <div class="mode-chip" data-mode="prime">Primes</div>
  </div>
  <div id="game-area"></div>
  <div id="admob-banner">Advertisement</div>
</div>
<div id="overlay">
  <h2>Number Tap</h2>
  <div class="sub">Numbers 1-25 appear on screen.<br>Tap them in order as fast as possible!</div>
  <div class="big" id="final-msg"></div>
  <button id="btn-play">Start!</button>
</div>
<script>
'use strict';
var MODES={
  seq:{label:'1→25',gen:function(){var a=[];for(var i=1;i<=25;i++)a.push(i);return a;},check:function(n,next){return n===next;}},
  even:{label:'Evens',gen:function(){var a=[];for(var i=1;i<=25;i++)a.push(i);return a;},check:function(n,next,nums){return n===next&&n%2===0;}},
  odd:{label:'Odds',gen:function(){var a=[];for(var i=1;i<=25;i++)a.push(i);return a;},check:function(n,next,nums){return n===next&&n%2===1;}},
  mult3:{label:'×3',gen:function(){var a=[];for(var i=1;i<=25;i++)a.push(i);return a;},check:function(n,next){return n===next&&n%3===0;}},
  prime:{label:'Primes',gen:function(){var a=[];for(var i=1;i<=25;i++)a.push(i);return a;},check:function(n,next){var primes=[2,3,5,7,11,13,17,19,23];return n===next&&primes.indexOf(n)>=0;}}
};

var state={running:false,removeAds:false,mode:'seq',
  numbers:[],targets:[],nextTarget:0,targetIdx:0,
  startTime:0,elapsed:0,timer:null};

var bests={};
try{bests=JSON.parse(localStorage.getItem('nt_bests')||'{}');}catch(e){bests={};}

function getTargets(mode){
  var m=MODES[mode];
  var all=m.gen();
  return all.filter(function(n){
    return m.check(n,n,all);
  }).sort(function(a,b){return a-b;});
}

function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

var gameArea=document.getElementById('game-area');

function placeNumbers(){
  gameArea.innerHTML='';
  state.numbers=[];
  var all=[];for(var i=1;i<=25;i++)all.push(i);
  shuffle(all);
  var areaW=gameArea.offsetWidth||window.innerWidth;
  var areaH=gameArea.offsetHeight||(window.innerHeight-180);
  var btnW=56,btnH=56,pad=10;
  all.forEach(function(n){
    var btn=document.createElement('div');
    btn.className='num-btn';
    btn.textContent=n;
    btn.dataset.num=n;
    var x=pad+Math.random()*(areaW-btnW-pad*2);
    var y=pad+Math.random()*(areaH-btnH-pad*2);
    btn.style.left=x+'px';btn.style.top=y+'px';
    var isTarget=state.targets.indexOf(n)>=0;
    if(!isTarget){btn.style.opacity='0.35';btn.style.borderColor='#444';btn.style.color='#888';}
    btn.addEventListener('touchstart',function(e){e.preventDefault();handleTap(n,btn);},{passive:false});
    btn.addEventListener('mousedown',function(){handleTap(n,btn);});
    gameArea.appendChild(btn);
    state.numbers.push({n:n,btn:btn});
  });
  highlightNext();
}

function highlightNext(){
  state.numbers.forEach(function(nb){
    nb.btn.classList.remove('target');
    if(nb.n===state.targets[state.targetIdx])nb.btn.classList.add('target');
  });
  var nextN=state.targets[state.targetIdx];
  document.getElementById('next-disp').textContent=nextN||'Done';
}

function handleTap(n,btn){
  if(!state.running)return;
  var expected=state.targets[state.targetIdx];
  if(n!==expected)return;
  btn.classList.add('gone');
  state.targetIdx++;
  if(state.targetIdx>=state.targets.length){
    // Done!
    state.elapsed=(performance.now()-state.startTime)/1000;
    clearInterval(state.timer);
    state.running=false;
    var modeKey=state.mode;
    var t=parseFloat(state.elapsed.toFixed(2));
    if(!bests[modeKey]||t<bests[modeKey]){
      bests[modeKey]=t;
      localStorage.setItem('nt_bests',JSON.stringify(bests));
    }
    document.getElementById('final-msg').textContent=
      'Time: '+t+'s\nBest ('+MODES[modeKey].label+'): '+(bests[modeKey]||'—')+'s';
    document.getElementById('btn-play').textContent='Play Again';
    document.getElementById('overlay').style.display='flex';
    if(!state.removeAds&&window.Android)Android.showInterstitial();
  } else {
    highlightNext();
  }
}

function startGame(){
  state.targets=getTargets(state.mode);
  if(state.targets.length===0){alert('No numbers for this mode!');return;}
  state.targetIdx=0;
  document.getElementById('overlay').style.display='none';
  placeNumbers();
  state.running=true;
  state.startTime=performance.now();
  if(state.timer)clearInterval(state.timer);
  state.timer=setInterval(function(){
    var t=(performance.now()-state.startTime)/1000;
    document.getElementById('timer-disp').textContent=t.toFixed(2);
  },50);
}
document.getElementById('btn-play').addEventListener('click',startGame);

document.querySelectorAll('.mode-chip').forEach(function(chip){
  chip.addEventListener('click',function(){
    state.mode=chip.dataset.mode;
    document.querySelectorAll('.mode-chip').forEach(function(c){c.classList.remove('active');});
    chip.classList.add('active');
    document.getElementById('mode-disp').textContent=MODES[state.mode].label;
  });
});

if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Number Merge</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
#banner { width:100%; height:50px; background:#1e1e1e; display:flex; align-items:center; justify-content:center; color:#555; font-size:12px; border-bottom:1px solid #333; }
#header { width:100%; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; background:#1a1a1a; }
h1 { font-size:20px; color:#FF5722; font-weight:700; }
#info { font-size:13px; color:#aaa; text-align:right; }
#controls { display:flex; gap:8px; padding:8px 16px; flex-wrap:wrap; justify-content:center; }
button { background:#1e1e1e; color:#FF5722; border:1.5px solid #FF5722; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; touch-action:manipulation; }
button:active { background:#FF5722; color:#fff; }
#msg { padding:6px 16px; text-align:center; font-size:15px; min-height:32px; color:#FF5722; }
#target-display { font-size:18px; text-align:center; padding:4px; color:#FF5722; }
#grid { display:inline-grid; gap:6px; padding:8px; background:#1a1a1a; border-radius:10px; border:2px solid #FF5722; margin:6px; touch-action:none; }
.cell { width:72px; height:72px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
.cell.empty { background:#2a2a2a; }
#level-select { display:none; flex-wrap:wrap; gap:6px; padding:8px 16px; justify-content:center; max-width:360px; }
.lvl-btn { padding:6px 12px; font-size:13px; min-width:38px; }
.lvl-btn.done { background:#FF5722; color:#fff; border-color:#FF5722; }
</style>
</head>
<body>
<div id="banner">Advertisement</div>
<div id="header">
  <h1>Number Merge</h1>
  <span id="info">Level 1 | Score: 0</span>
</div>
<div id="target-display">Target: 64</div>
<div id="controls">
  <button onclick="resetLevel()">Reset</button>
  <button onclick="toggleLevelSelect()">Levels</button>
  <button onclick="removeAds()">No Ads</button>
</div>
<div id="msg">Swipe to merge numbers — reach the target!</div>
<div id="grid"></div>
<div id="level-select"></div>

<script>
// 2048-style on 4x4 grid, goal: reach specific target value
// 30 levels with different targets and initial boards

const TILE_COLORS = {
  2:'#3d1f00', 4:'#5a2d00', 8:'#7a3d00', 16:'#9a5000',
  32:'#b86400', 64:'#d47800', 128:'#e88c20', 256:'#f0a040',
  512:'#f5b060', 1024:'#f9c080', 2048:'#fdd09a',
};

function tileColor(v) { return TILE_COLORS[v] || (v>2048 ? '#ffe0c0' : '#2a2a2a'); }
function textColor(v) { return v>=8 ? '#fff' : '#ffb74d'; }

// 30 levels: target value + initial board state
// Boards are 4x4 (0=empty), each level has a solvable path to target
const levels = [
  {target:32,  board:[0,2,4,0, 0,2,0,4, 4,0,2,0, 0,4,0,2]},
  {target:64,  board:[2,0,2,4, 0,4,0,2, 2,4,0,4, 4,0,4,0]},
  {target:128, board:[4,0,4,8, 0,8,0,4, 4,8,0,8, 8,0,8,4]},
  {target:64,  board:[2,2,4,0, 0,4,2,2, 2,0,2,4, 4,4,0,4]},
  {target:128, board:[8,0,4,4, 4,4,8,0, 0,8,4,4, 4,4,0,8]},
  {target:256, board:[8,8,0,16,0,16,8,8, 16,0,8,8, 8,8,16,0]},
  {target:64,  board:[2,4,2,4, 4,2,4,2, 2,4,2,4, 4,2,4,2]},
  {target:128, board:[4,8,4,8, 8,4,8,4, 4,8,4,8, 8,4,8,4]},
  {target:512, board:[32,16,32,0, 0,32,16,32, 16,0,32,16, 32,16,0,32]},
  {target:256, board:[16,8,8,0, 8,16,0,8, 0,8,16,8, 8,0,8,16]},
  {target:128, board:[4,8,4,0, 8,4,8,4, 0,8,4,8, 4,0,8,4]},
  {target:256, board:[16,16,0,8, 8,0,16,16, 16,8,0,16, 0,16,8,0]},
  {target:512, board:[32,0,32,16, 16,32,0,32, 32,16,32,0, 0,32,16,32]},
  {target:1024,board:[64,32,64,0, 0,64,32,64, 64,0,64,32, 32,64,0,64]},
  {target:256, board:[8,16,8,16, 16,8,16,8, 8,16,8,16, 16,8,16,8]},
  {target:512, board:[32,0,16,32, 16,32,0,16, 0,16,32,0, 32,0,16,32]},
  {target:1024,board:[64,32,0,64, 0,64,32,64, 64,0,64,32, 32,64,0,64]},
  {target:2048,board:[128,64,128,0, 0,128,64,128, 128,0,128,64, 64,128,0,128]},
  {target:256, board:[4,8,16,4, 8,16,4,8, 16,4,8,16, 4,8,16,4]},
  {target:512, board:[16,32,16,0, 0,16,32,16, 32,0,16,32, 16,32,0,16]},
  {target:128, board:[2,4,8,2, 4,8,2,4, 8,2,4,8, 2,4,8,2]},
  {target:256, board:[8,16,8,0, 16,8,16,8, 0,16,8,16, 8,0,16,8]},
  {target:1024,board:[32,64,32,64, 64,32,64,32, 32,64,32,64, 64,32,64,32]},
  {target:512, board:[16,32,0,16, 32,0,16,32, 0,16,32,0, 16,32,0,32]},
  {target:2048,board:[64,128,64,0, 0,64,128,64, 128,0,64,128, 64,128,0,64]},
  {target:128, board:[2,0,4,8, 8,4,0,2, 0,8,4,2, 4,2,8,0]},
  {target:256, board:[4,0,8,16, 16,8,0,4, 0,16,8,4, 8,4,16,0]},
  {target:512, board:[8,0,16,32, 32,16,0,8, 0,32,16,8, 16,8,32,0]},
  {target:1024,board:[16,0,32,64, 64,32,0,16, 0,64,32,16, 32,16,64,0]},
  {target:2048,board:[32,0,64,128,128,64,0,32, 0,128,64,32, 64,32,128,0]},
];

const state = { level:1, board:[], score:0, best:0, won:false, removeAds:false, completed:new Set() };
let touchStartX=0, touchStartY=0;

function loadLevel(n) {
  state.level = n;
  state.score = 0;
  state.won = false;
  const lv = levels[(n-1) % levels.length];
  state.board = [...lv.board];
  document.getElementById('target-display').textContent = 'Target: ' + lv.target;
  document.getElementById('info').textContent = 'Level '+n+' | Score: 0';
  document.getElementById('msg').textContent = 'Swipe to merge! Reach '+lv.target+'!';
  renderGrid();
}

function renderGrid() {
  const g = document.getElementById('grid');
  g.style.gridTemplateColumns = 'repeat(4, 72px)';
  g.innerHTML = '';
  state.board.forEach(v => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (v===0?' empty':'');
    if (v>0) {
      cell.style.background = tileColor(v);
      cell.style.color = textColor(v);
      cell.textContent = v;
    }
    g.appendChild(cell);
  });
}

function slide(row) {
  // Remove zeros, merge adjacent equal values, pad with zeros
  let r = row.filter(v=>v>0);
  let gained = 0;
  for (let i=0;i<r.length-1;i++) {
    if (r[i]===r[i+1]) { r[i]*=2; gained+=r[i]; r.splice(i+1,1); }
  }
  while (r.length<4) r.push(0);
  return {row:r, gained};
}

function move(dir) {
  if (state.won) return false;
  const b = state.board;
  let changed = false, totalGained = 0;
  const newBoard = [...b];
  // dir: 0=left,1=right,2=up,3=down
  if (dir===0||dir===1) { // horizontal
    for (let r=0;r<4;r++) {
      let row = [b[r*4],b[r*4+1],b[r*4+2],b[r*4+3]];
      if (dir===1) row.reverse();
      const {row:nr,gained} = slide(row);
      if (dir===1) nr.reverse();
      totalGained+=gained;
      for (let c=0;c<4;c++) { if (newBoard[r*4+c]!==nr[c]) changed=true; newBoard[r*4+c]=nr[c]; }
    }
  } else { // vertical
    for (let c=0;c<4;c++) {
      let col = [b[c],b[4+c],b[8+c],b[12+c]];
      if (dir===3) col.reverse();
      const {row:nc,gained} = slide(col);
      if (dir===3) nc.reverse();
      totalGained+=gained;
      for (let r=0;r<4;r++) { if (newBoard[r*4+c]!==nc[r]) changed=true; newBoard[r*4+c]=nc[r]; }
    }
  }
  if (!changed) return false;
  state.board = newBoard;
  state.score += totalGained;
  if (state.score > state.best) state.best = state.score;
  addRandomTile();
  const lv = levels[(state.level-1) % levels.length];
  document.getElementById('info').textContent = 'Level '+state.level+' | Score: '+state.score;
  renderGrid();
  // Check win
  if (state.board.some(v=>v>=lv.target)) {
    state.won = true;
    winLevel();
    return true;
  }
  // Check lose (no moves)
  if (!state.board.includes(0) && !canMerge()) {
    document.getElementById('msg').textContent = 'No more moves! Score: '+state.score;
  }
  return true;
}

function addRandomTile() {
  const empty = state.board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
  if (empty.length===0) return;
  const idx = empty[Math.floor(Math.random()*empty.length)];
  state.board[idx] = Math.random()<0.9 ? 2 : 4;
}

function canMerge() {
  const b = state.board;
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    if (c<3&&b[r*4+c]===b[r*4+c+1]) return true;
    if (r<3&&b[r*4+c]===b[(r+1)*4+c]) return true;
  }
  return false;
}

function winLevel() {
  state.completed.add(state.level);
  document.getElementById('msg').textContent='🎉 Target reached! Score: '+state.score;
  buildLevelSelect();
  setTimeout(()=>{
    const next=state.level+1;
    if (!state.removeAds&&next%3===0&&window.Android) Android.showInterstitial();
    if (next<=levels.length) loadLevel(next);
  },1400);
}

// Touch/swipe
const grid = document.getElementById('grid');
grid.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
grid.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if (Math.abs(dx)<20&&Math.abs(dy)<20) return;
  if (Math.abs(dx)>Math.abs(dy)) move(dx>0?1:0);
  else move(dy>0?3:2);
}, {passive:true});

// Keyboard
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowLeft') move(0);
  else if (e.key==='ArrowRight') move(1);
  else if (e.key==='ArrowUp') move(2);
  else if (e.key==='ArrowDown') move(3);
});

function resetLevel() { loadLevel(state.level); }

function toggleLevelSelect() {
  const ls=document.getElementById('level-select');
  ls.style.display=ls.style.display==='flex'?'none':'flex';
}

function buildLevelSelect() {
  const ls=document.getElementById('level-select');
  ls.innerHTML='';
  levels.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='lvl-btn'+(state.completed.has(i+1)?' done':'');
    b.textContent=i+1;
    b.onclick=()=>{loadLevel(i+1);ls.style.display='none';};
    ls.appendChild(b);
  });
}

function removeAds() {
  if (window.Android) Android.purchaseRemoveAds();
  else { state.removeAds=true; document.getElementById('msg').textContent='Ads removed!'; }
}
window.onPurchaseComplete=function(){state.removeAds=true;};
loadLevel(1);
buildLevelSelect();
</script>
</body>
</html>

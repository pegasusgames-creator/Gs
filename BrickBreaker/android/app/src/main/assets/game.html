<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brick Breaker</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0a1628; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
canvas { display:block; touch-action:none; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.82); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:12px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#42A5F5; }
#overlay .sub { font-size:0.9rem; color:#aaa; text-align:center; max-width:280px; line-height:1.5; }
#overlay .big { font-size:1.1rem; font-weight:700; color:#fff; text-align:center; }
#btn-play { background:#42A5F5; border:none; border-radius:30px; color:#fff; font-size:1.2rem; font-weight:800; padding:14px 48px; cursor:pointer; }
#admob-banner { position:absolute; bottom:0; left:0; right:0; height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <h2>Brick Breaker</h2>
  <div class="sub">Drag paddle to move<br>Power-ups: W=wider, M=multi-ball, ♥=extra life</div>
  <div class="big" id="final-msg"></div>
  <button id="btn-play">Play!</button>
</div>
<div id="admob-banner">Advertisement</div>
<script>
'use strict';
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

var BRICK_COLS=8, BRICK_ROWS=5, PADDLE_H=14, BALL_R=8;
var PWCOLORS={wide:'#4CAF50',multi:'#FF5722',life:'#E91E63'};
var state={running:false,removeAds:false,lives:3,score:0,level:1,
  paddle:{x:0,w:0,y:0},balls:[],bricks:[],powerups:[],particles:[],
  gameOver:false};
var best=parseInt(localStorage.getItem('bb_best')||'0');

function rnd(a,b){return a+Math.random()*(b-a);}

function makeBricks(lv){
  var bricks=[], bw=(W-20)/BRICK_COLS, bh=22, topY=80;
  var cols=['#42A5F5','#26C6DA','#66BB6A','#FFCA28','#EF5350','#AB47BC','#FF7043','#29B6F6'];
  for(var r=0;r<BRICK_ROWS;r++){
    for(var c=0;c<BRICK_COLS;c++){
      var hits=(lv>=2&&Math.random()<0.25)?2:1;
      bricks.push({x:10+c*bw,y:topY+r*(bh+4),w:bw-4,h:bh,hits:hits,maxHits:hits,color:cols[r%cols.length],alive:true});
    }
  }
  return bricks;
}

function initLevel(){
  var pw=Math.min(W*0.22,90);
  state.paddle={x:W/2-pw/2,w:pw,y:H-90};
  state.balls=[{x:W/2,y:state.paddle.y-BALL_R-2,vx:2.5+state.level*0.3,vy:-(3+state.level*0.3),r:BALL_R,alive:true}];
  state.bricks=makeBricks(state.level);
  state.powerups=[];
}

function startGame(){
  state.running=true;state.lives=3;state.score=0;state.level=1;
  state.gameOver=false;state.particles=[];
  initLevel();
  document.getElementById('overlay').style.display='none';
}
document.getElementById('btn-play').addEventListener('click',startGame);

canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!state.running)return;
  var t=e.touches[0];
  state.paddle.x=Math.max(0,Math.min(W-state.paddle.w,t.clientX-state.paddle.w/2));
},{passive:false});
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(!state.running)return;
  var t=e.touches[0];
  state.paddle.x=Math.max(0,Math.min(W-state.paddle.w,t.clientX-state.paddle.w/2));
},{passive:false});
canvas.addEventListener('mousemove',function(e){
  if(!state.running)return;
  state.paddle.x=Math.max(0,Math.min(W-state.paddle.w,e.clientX-state.paddle.w/2));
});

function Particle(x,y,color){this.x=x;this.y=y;this.color=color;this.vx=rnd(-3,3);this.vy=rnd(-3,0);this.life=1;this.r=2+Math.random()*2;}
Particle.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.1;this.life-=0.05;};
Particle.prototype.draw=function(){ctx.globalAlpha=this.life;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;};

function spawnParts(x,y,color,n){for(var i=0;i<n;i++)state.particles.push(new Particle(x,y,color));}

function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function updateBall(ball){
  if(!ball.alive)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}
  if(ball.y-ball.r<60){ball.y=60+ball.r;ball.vy=Math.abs(ball.vy);}
  var p=state.paddle;
  if(ball.vy>0&&ball.y+ball.r>=p.y&&ball.y-ball.r<=p.y+PADDLE_H&&ball.x>=p.x-4&&ball.x<=p.x+p.w+4){
    ball.vy=-Math.abs(ball.vy);
    var rel=(ball.x-p.x)/p.w-0.5;
    ball.vx=rel*8;
    var spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
    var mx=8+state.level*0.5;
    if(spd>mx){ball.vx*=mx/spd;ball.vy*=mx/spd;}
    if(Math.abs(ball.vy)<2)ball.vy=-2;
    ball.y=p.y-ball.r-1;
  }
  for(var i=0;i<state.bricks.length;i++){
    var b=state.bricks[i];
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.hits--;
      spawnParts(ball.x,ball.y,b.color,5);
      if(b.hits<=0){
        b.alive=false;
        state.score+=10*state.level;
        spawnParts(b.x+b.w/2,b.y+b.h/2,b.color,8);
        if(Math.random()<0.15){
          var types=['wide','multi','life'];
          var ty=types[Math.floor(Math.random()*3)];
          state.powerups.push({x:b.x+b.w/2,y:b.y+b.h/2,vy:2.5,type:ty,alive:true});
        }
      }
      var ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));
      var oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));
      if(ox<oy)ball.vx=-ball.vx;else ball.vy=-ball.vy;
      break;
    }
  }
  if(ball.y-ball.r>H)ball.alive=false;
}

function applyPowerup(type){
  var p=state.paddle;
  if(type==='wide'){
    p.x-=20;p.w+=40;
    p.x=Math.max(0,p.x);
    if(p.x+p.w>W)p.w=W-p.x;
    setTimeout(function(){p.w=Math.max(50,p.w-40);},8000);
  }else if(type==='multi'){
    var b=state.balls[0]||{x:W/2,y:p.y-10,vx:2,vy:-3,r:BALL_R,alive:true};
    state.balls.push({x:b.x,y:b.y,vx:-b.vx,vy:b.vy,r:BALL_R,alive:true});
  }else if(type==='life'){
    state.lives=Math.min(state.lives+1,5);
  }
}

function endGame(won){
  state.running=false;
  if(state.score>best){best=state.score;localStorage.setItem('bb_best',best);}
  document.getElementById('final-msg').textContent=(won?'You Win! All 10 Levels!':'Game Over')+' | Score:'+state.score+' Best:'+best;
  document.getElementById('btn-play').textContent='Play Again';
  document.getElementById('overlay').style.display='flex';
  if(!state.removeAds&&window.Android)Android.showInterstitial();
}

function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1628');bg.addColorStop(1,'#0d2040');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // HUD
  ctx.fillStyle='#42A5F5';ctx.font='bold 16px sans-serif';ctx.textAlign='left';
  ctx.fillText('Score:'+state.score,12,28);
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText('Level '+state.level+' | Best:'+best,W/2,28);
  ctx.textAlign='right';
  var lstr='';for(var i=0;i<state.lives;i++)lstr+='❤';
  ctx.fillText(lstr,W-10,28);

  if(!state.running)return;

  // Bricks
  state.bricks.forEach(function(b){
    if(!b.alive)return;
    ctx.globalAlpha=b.hits<b.maxHits?0.55:1;
    ctx.fillStyle=b.color;
    rrect(b.x,b.y,b.w,b.h,4);ctx.fill();
    ctx.globalAlpha=1;
    if(b.hits>1){
      ctx.fillStyle='rgba(0,0,0,0.35)';rrect(b.x,b.y,b.w,b.h,4);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
      ctx.fillText(b.hits,b.x+b.w/2,b.y+b.h/2+4);
    }
  });

  // Paddle
  var p=state.paddle;
  var pg=ctx.createLinearGradient(p.x,p.y,p.x,p.y+PADDLE_H);
  pg.addColorStop(0,'#64B5F6');pg.addColorStop(1,'#1565C0');
  ctx.fillStyle=pg;rrect(p.x,p.y,p.w,PADDLE_H,7);ctx.fill();

  // Balls
  state.balls.forEach(function(ball){
    if(!ball.alive)return;
    var bg2=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,ball.r);
    bg2.addColorStop(0,'#fff');bg2.addColorStop(1,'#42A5F5');
    ctx.fillStyle=bg2;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  });

  // Powerups
  state.powerups.forEach(function(pw){
    if(!pw.alive)return;
    ctx.fillStyle=PWCOLORS[pw.type];ctx.beginPath();ctx.arc(pw.x,pw.y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillText(pw.type==='wide'?'W':pw.type==='multi'?'M':'♥',pw.x,pw.y+4);
  });

  // Particles
  state.particles.forEach(function(p2){p2.update();p2.draw();});
  state.particles=state.particles.filter(function(p2){return p2.life>0;});

  // Update balls
  state.balls.forEach(updateBall);
  state.balls=state.balls.filter(function(b){return b.alive||false;});

  // Update powerups
  state.powerups.forEach(function(pw){
    if(!pw.alive)return;
    pw.y+=pw.vy;
    var p=state.paddle;
    if(pw.y>p.y&&pw.y<p.y+PADDLE_H+20&&pw.x>p.x&&pw.x<p.x+p.w){pw.alive=false;applyPowerup(pw.type);}
    if(pw.y>H)pw.alive=false;
  });
  state.powerups=state.powerups.filter(function(pw){return pw.alive;});

  // All balls dead?
  var alive=state.balls.filter(function(b){return b.alive;});
  if(alive.length===0&&state.running){
    state.lives--;
    if(state.lives<=0){endGame(false);return;}
    var pp=state.paddle;
    state.balls=[{x:pp.x+pp.w/2,y:pp.y-BALL_R-2,vx:2.5,vy:-(3+state.level*0.3),r:BALL_R,alive:true}];
    return;
  }

  // All bricks cleared?
  if(state.bricks.filter(function(b){return b.alive;}).length===0){
    state.level++;
    if(state.level>10){endGame(true);return;}
    initLevel();
  }
}
loop();

if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
window.onAdMobLoaded=function(){};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZenGarden</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f1a0f;--surface:#162416;--accent:#A5D6A7;--text:#d4e8d4;--muted:#567856;--radius:10px;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;flex-shrink:0;}
header h1{font-size:1.2rem;font-weight:700;}header h1 span{color:var(--accent);}
#canvas{display:block;flex:1;width:100%;touch-action:none;}
#controls{display:flex;gap:6px;padding:6px 10px;flex-shrink:0;flex-wrap:wrap;}
.btn{background:var(--surface);border:1px solid #345234;color:var(--text);padding:8px 12px;border-radius:var(--radius);font-size:0.78rem;cursor:pointer;touch-action:manipulation;}
.btn.active{background:var(--accent);color:#000;border-color:var(--accent);}
.btn.btn-pressed{transform:scale(0.92);}
.sand-btn{width:32px;height:32px;border-radius:6px;border:2px solid transparent;cursor:pointer;}
.sand-btn.active{border-color:#fff;}
#banner{height:50px;background:#111;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.75rem;flex-shrink:0;}
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:0.65rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:9999;letter-spacing:0.5px">Remove Ads</button>
<div id="app">
  <header><h1>Zen<span>Garden</span></h1></header>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <button class="btn active" id="tool-rake">Rake</button>
    <button class="btn" id="tool-rock">Rock</button>
    <button class="btn" id="tool-wave">Wave</button>
    <button class="btn" id="tool-spiral">Spiral</button>
    <button class="btn" id="btn-clear">Clear</button>
    <div style="display:flex;gap:4px;margin-left:auto;">
      <div class="sand-btn" style="background:#c8b89a;" data-color="#c8b89a"></div>
      <div class="sand-btn active" style="background:#a89070;" data-color="#a89070"></div>
      <div class="sand-btn" style="background:#d4c4a8;" data-color="#d4c4a8"></div>
      <div class="sand-btn" style="background:#786040;" data-color="#786040"></div>
    </div>
  </div>
  <div id="banner">Ad Banner</div>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let tool='rake',sandColor='#a89070';
let rocks=[],isDrawing=false,lastX=null,lastY=null;
let particles=[];

function resize(){
  const prev=ctx.getImageData(0,0,canvas.width,canvas.height);
  canvas.width=canvas.offsetWidth;
  canvas.height=canvas.offsetHeight;
  clearCanvas();
  if(prev)ctx.putImageData(prev,0,0);
}

function clearCanvas(){
  // Fill with sand gradient
  const grad=ctx.createRadialGradient(canvas.width/2,canvas.height/2,0,canvas.width/2,canvas.height/2,canvas.width);
  grad.addColorStop(0,sandColor+'ee');
  grad.addColorStop(1,sandColor+'99');
  ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);
  // Ambient texture dots
  for(let i=0;i<300;i++){
    const x=Math.random()*canvas.width,y=Math.random()*canvas.height;
    ctx.fillStyle='rgba(0,0,0,0.05)';
    ctx.beginPath();ctx.arc(x,y,0.8,0,Math.PI*2);ctx.fill();
  }
  rocks=[];
  particles=[];
}

function drawRock(x,y){
  const r=18+Math.random()*12;
  const grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0,'#888');
  grad.addColorStop(1,'#444');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.stroke();
  rocks.push({x,y,r});
}

function rakeAt(x,y,px,py){
  if(px===null)return;
  const dx=x-px,dy=y-py;
  const len=Math.sqrt(dx*dx+dy*dy);
  if(len<2)return;
  const nx=-dy/len,ny=dx/len;
  const spacing=6,tines=4;
  for(let t=-(tines/2);t<=(tines/2);t++){
    const ox=nx*t*spacing,oy=ny*t*spacing;
    ctx.beginPath();
    ctx.moveTo(px+ox,py+oy);ctx.lineTo(x+ox,y+oy);
    ctx.strokeStyle='rgba(0,0,0,0.18)';
    ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px+ox+nx*2,py+oy+ny*2);ctx.lineTo(x+ox+nx*2,y+oy+ny*2);
    ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.lineWidth=1;ctx.stroke();
  }
}

function drawWaveAt(x,y){
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(x,y,(i+1)*15,0,Math.PI);
    ctx.strokeStyle='rgba(0,0,0,0.15)';
    ctx.lineWidth=2;ctx.stroke();
  }
}

function drawSpiralAt(x,y){
  ctx.beginPath();
  for(let a=0;a<Math.PI*6;a+=0.1){
    const r=a*4;
    const sx=x+Math.cos(a)*r,sy=y+Math.sin(a)*r;
    if(a===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
  }
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=2;ctx.stroke();
}

// Ambient particles
function initParticles(){
  particles=[];
  for(let i=0;i<30;i++){
    particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,size:1+Math.random(),a:0.3+Math.random()*0.3});
  }
}

function animateParticles(){
  requestAnimationFrame(animateParticles);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
    ctx.globalAlpha=p.a;
    ctx.fillStyle='rgba(255,240,200,0.4)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();isDrawing=true;lastX=null;lastY=null;
  const r=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const x=t.clientX-r.left,y=t.clientY-r.top;
  if(tool==='rock'){drawRock(x,y);}
  else if(tool==='wave'){drawWaveAt(x,y);}
  else if(tool==='spiral'){drawSpiralAt(x,y);}
  lastX=x;lastY=y;
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();if(!isDrawing)return;
  const r=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const x=t.clientX-r.left,y=t.clientY-r.top;
  if(tool==='rake')rakeAt(x,y,lastX,lastY);
  lastX=x;lastY=y;
},{passive:false});
canvas.addEventListener('touchend',()=>{isDrawing=false;lastX=null;lastY=null;});

canvas.addEventListener('mousedown',e=>{
  isDrawing=true;lastX=null;lastY=null;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  if(tool==='rock')drawRock(x,y);
  else if(tool==='wave')drawWaveAt(x,y);
  else if(tool==='spiral')drawSpiralAt(x,y);
  lastX=x;lastY=y;
});
canvas.addEventListener('mousemove',e=>{
  if(!isDrawing)return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  if(tool==='rake')rakeAt(x,y,lastX,lastY);
  lastX=x;lastY=y;
});
canvas.addEventListener('mouseup',()=>{isDrawing=false;lastX=null;lastY=null;});

['rake','rock','wave','spiral'].forEach(t=>{
  document.getElementById('tool-'+t).addEventListener('click',function(){
    tool=t;
    document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
  });
});
document.getElementById('btn-clear').addEventListener('click',function(){
  this.classList.add('btn-pressed');setTimeout(()=>this.classList.remove('btn-pressed'),120);
  clearCanvas();initParticles();
});
document.querySelectorAll('.sand-btn').forEach(b=>{
  b.addEventListener('click',function(){
    sandColor=this.dataset.color;
    document.querySelectorAll('.sand-btn').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    clearCanvas();initParticles();
  });
});

window.addEventListener('resize',()=>{clearCanvas();initParticles();});
resize();clearCanvas();initParticles();animateParticles();

// ── AppLovin MAX / IAP bridge ──────────────────────────────────────────
var _adsRemoved = false;
var _interstitialCount = 0;

function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

// Restore remove-ads state on load
if (window.Android) {
  try { if (Android.isPurchased && Android.isPurchased('remove_ads')) {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
  }} catch(e) {}
}

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Word Scramble</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
:root {
  --bg: #0a0f1e;
  --surface: #121a2f;
  --accent: #f59e0b;
  --accent2: #1b2744;
  --text: #ecf1fa;
  --muted: #8892a4;
  --green: #43c759;
  --yellow: #fbbf24;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Poppins', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; letter-spacing: -0.01em; }
body.ss #btn-remove-ads{display:none;}

#header { background: var(--surface); width: 100%; padding: 36px 14px 10px; border-bottom: 1px solid #2a3a5e; text-align: center; }
#header h1 { font-size: 1.2rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }

#top-stats { display: flex; gap: 16px; padding: 10px 14px; justify-content: center; font-size: 0.82rem; color: var(--muted); }
.stat { text-align: center; }
.stat-v { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

#cat-row { display: flex; gap: 6px; padding: 4px 12px 8px; overflow-x: auto; scrollbar-width: none; width: 100%; }
#cat-row::-webkit-scrollbar { display: none; }
.cat-btn { white-space: nowrap; padding: 6px 14px; border-radius: 18px; border: 1.5px solid #2a3a5e; background: transparent; color: var(--muted); font-size: 0.78rem; cursor: pointer; flex-shrink: 0; }
.cat-btn.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

#hint-box { background: var(--surface); border: 1px solid #2a3a5e; border-radius: 12px; padding: 12px 16px; margin: 10px 12px 0; width: 95%; max-width: 400px; }
#hint-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
#hint-text { font-size: 0.9rem; color: var(--text); font-style: italic; }

#timer-bar { width: 95%; max-width: 400px; height: 6px; background: #2a3a5e; border-radius: 3px; margin: 10px 0 4px; overflow: hidden; }
#timer-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s linear; }

#answer-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 12px; min-height: 52px; width: 95%; max-width: 400px; }
.ans-tile { width: 44px; height: 48px; background: var(--accent2); border: 2px solid var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; color: #fff; cursor: pointer; transition: transform 0.12s; }
.ans-tile:active { transform: scale(0.9); }
.ans-tile.correct { background: rgba(46,204,113,0.2); border-color: var(--green); }
.ans-tile.wrong { background: rgba(233,69,96,0.2); animation: shake 0.3s; }
@keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)} }

#scramble-row { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin: 6px 12px 12px; width: 95%; max-width: 400px; }
.scr-tile { width: 44px; height: 48px; background: var(--surface); border: 2px solid #3a4a6e; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.12s; }
.scr-tile:active { transform: scale(0.9); }
.scr-tile.used { opacity: 0.25; pointer-events: none; }

#action-row { display: flex; gap: 10px; margin: 0 0 10px; }
.action-btn { padding: 10px 20px; border-radius: 22px; border: 1.5px solid #2a3a5e; background: transparent; color: var(--text); font-size: 0.82rem; cursor: pointer; }
.action-btn:active { background: var(--accent2); }
#submit-btn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

#feedback { font-size: 1.1rem; font-weight: 700; min-height: 1.6em; text-align: center; letter-spacing: 1px; }
#combo-display { font-size: 0.82rem; color: var(--yellow); min-height: 1.3em; text-align: center; }
#level-display { font-size: 0.75rem; color: var(--muted); text-align: center; margin-bottom: 6px; }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;z-index:9999;background:#533483;border:none;color:#fff;font-size:0.7rem;font-weight:600;padding:5px 10px;border-radius:20px;cursor:pointer;">Remove Ads</button>

<div id="header"><h1>Word Scramble</h1></div>

<div id="top-stats">
  <div class="stat"><div class="stat-v" id="score-v">0</div><div>Score</div></div>
  <div class="stat"><div class="stat-v" id="streak-v">0</div><div>Streak</div></div>
  <div class="stat"><div class="stat-v" id="lvl-v">1</div><div>Level</div></div>
</div>

<div id="cat-row">
  <button class="cat-btn sel" data-cat="all">All</button>
  <button class="cat-btn" data-cat="animals">Animals</button>
  <button class="cat-btn" data-cat="food">Food</button>
  <button class="cat-btn" data-cat="sports">Sports</button>
  <button class="cat-btn" data-cat="countries">Countries</button>
  <button class="cat-btn" data-cat="tech">Tech</button>
</div>

<div id="hint-box">
  <div id="hint-label">Category / Hint</div>
  <div id="hint-text">—</div>
</div>

<div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>

<div id="answer-row"></div>
<div id="scramble-row"></div>

<div id="action-row">
  <button class="action-btn" id="hint-btn">💡 Hint</button>
  <button class="action-btn" id="clear-btn">⌫ Clear</button>
  <button class="action-btn" id="skip-btn">Skip</button>
  <button class="action-btn" id="submit-btn">Check ✓</button>
</div>

<div id="feedback"></div>
<div id="combo-display"></div>
<div id="level-display"></div>

<script>
var _adsRemoved = false;
var _interstitialCount = 0;
function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}
window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

var WORDS = {
  animals:  [{w:'ELEPHANT',h:'Largest land animal'},{w:'DOLPHIN',h:'Intelligent marine mammal'},{w:'PENGUIN',h:'Bird that cannot fly'},{w:'GIRAFFE',h:'Tallest animal'},{w:'LEOPARD',h:'Big spotted cat'},{w:'HAMSTER',h:'Popular small pet'},{w:'CHEETAH',h:'Fastest land animal'},{w:'GORILLA',h:'Largest primate'},{w:'OCTOPUS',h:'8-armed sea creature'},{w:'PEACOCK',h:'Famous for its feathers'},{w:'PANTHER',h:'Black big cat'},{w:'BUFFALO',h:'Large bovine'},{w:'VULTURE',h:'Scavenging bird'},{w:'LOBSTER',h:'Clawed crustacean'},{w:'SPARROW',h:'Common small bird'}],
  food:     [{w:'AVOCADO',h:'Green creamy fruit'},{w:'BROCCOLI',h:'Green tree-like veggie'},{w:'PANCAKE',h:'Flat breakfast food'},{w:'SAUSAGE',h:'Meat in a casing'},{w:'MUFFIN',h:'Small baked cake'},{w:'LASAGNA',h:'Layered pasta dish'},{w:'BURRITO',h:'Wrapped Mexican food'},{w:'POPCORN',h:'Cinema snack'},{w:'CUSTARD',h:'Sweet eggy sauce'},{w:'PRETZEL',h:'Twisted salty snack'},{w:'NOODLE',h:'Long pasta strand'},{w:'YOGURT',h:'Fermented dairy'},{w:'WAFFLE',h:'Grid-pattern breakfast'},{w:'SALMON',h:'Pink fish'},{w:'CASHEW',h:'Curved nut'}],
  sports:   [{w:'TENNIS',h:'Played with a racket'},{w:'HOCKEY',h:'Puck on ice'},{w:'BOXING',h:'Gloved fist fight'},{w:'RUGBY',h:'Oval ball game'},{w:'SKIING',h:'Snow sliding sport'},{w:'CRICKET',h:'Bat and wicket sport'},{w:'CYCLING',h:'Pedal-powered racing'},{w:'SURFING',h:'Riding ocean waves'},{w:'ARCHERY',h:'Bow and arrow'},{w:'FENCING',h:'Sword sport'},{w:'ROWING',h:'Boat racing with oars'},{w:'DIVING',h:'Jump into water'},{w:'KARATE',h:'Japanese martial art'},{w:'POLO',h:'On horseback sport'},{w:'SQUASH',h:'Racket in a box court'}],
  countries:[{w:'BRAZIL',h:'South American giant'},{w:'FRANCE',h:'Eiffel Tower country'},{w:'JAPAN',h:'Land of the rising sun'},{w:'CANADA',h:'Maple leaf nation'},{w:'INDIA',h:'1.4 billion people'},{w:'MEXICO',h:'North America, south'},{w:'SPAIN',h:'Flamenco country'},{w:'EGYPT',h:'Land of pyramids'},{w:'KENYA',h:'Safari destination'},{w:'NORWAY',h:'Northern Lights country'},{w:'TURKEY',h:'Transcontinental country'},{w:'SWEDEN',h:'ABBA\'s homeland'},{w:'POLAND',h:'Central European nation'},{w:'CHILE',h:'Long thin country'},{w:'GHANA',h:'West African nation'}],
  tech:     [{w:'KEYBOARD',h:'Type with this'},{w:'BROWSER',h:'Surf the web'},{w:'LAPTOP',h:'Portable computer'},{w:'ROUTER',h:'Network device'},{w:'SERVER',h:'Hosts websites'},{w:'PIXEL',h:'Smallest screen unit'},{w:'CURSOR',h:'Mouse pointer'},{w:'WIDGET',h:'App component'},{w:'PLUGIN',h:'Software add-on'},{w:'SCRIPT',h:'Code sequence'},{w:'MODEM',h:'Internet connection box'},{w:'CACHE',h:'Stored data for speed'},{w:'FIREWALL',h:'Network security'},{w:'CODEC',h:'Compress/decode media'},{w:'SANDBOX',h:'Isolated test environment'}],
};

var selCat = 'all', score = 0, streak = 0, level = 1, combo = 1;
var currentWord = '', scrambled = [], answerArr = [], usedIdx = [];
var timerVal = 30, timerID = null, hintUsed = false;
var wordQueue = [];

function getAllWords() {
  var all = [];
  Object.keys(WORDS).forEach(function(k) { WORDS[k].forEach(function(w){all.push({cat:k,w:w.w,h:w.h});});});
  return all;
}

function getPool() {
  var pool;
  if (selCat === 'all') pool = getAllWords();
  else pool = (WORDS[selCat]||[]).map(function(w){return {cat:selCat,w:w.w,h:w.h};});
  pool.sort(function(){return Math.random()-0.5;});
  // filter by level difficulty
  return pool.filter(function(p){ return p.w.length >= Math.min(4+Math.floor(level/3), 8); }).concat(pool);
}

function pickWord() {
  if (wordQueue.length === 0) wordQueue = getPool();
  var item = wordQueue.shift();
  return item;
}

function scrambleWord(w) {
  var arr = w.split('');
  do { arr.sort(function(){return Math.random()-0.5;}); } while (arr.join('') === w && w.length > 1);
  return arr;
}

function loadWord() {
  var item = pickWord();
  currentWord = item.w;
  hintUsed = false;
  scrambled = scrambleWord(currentWord);
  answerArr = [];
  usedIdx = [];
  document.getElementById('hint-text').textContent = item.cat.charAt(0).toUpperCase()+item.cat.slice(1) + ' — ' + item.h;
  document.getElementById('feedback').textContent = '';
  document.getElementById('combo-display').textContent = '';
  document.getElementById('level-display').textContent = 'Level ' + level + '  •  Word length: ' + currentWord.length;
  renderScramble();
  renderAnswer();
  startTimer();
}

function renderScramble() {
  var row = document.getElementById('scramble-row');
  row.innerHTML = '';
  scrambled.forEach(function(ch, i) {
    var tile = document.createElement('div');
    tile.className = 'scr-tile' + (usedIdx.indexOf(i) !== -1 ? ' used' : '');
    tile.textContent = ch;
    tile.dataset.i = i;
    tile.onclick = function() {
      var idx = parseInt(this.dataset.i);
      if (usedIdx.indexOf(idx) !== -1) return;
      answerArr.push({ch: scrambled[idx], idx: idx});
      usedIdx.push(idx);
      renderAnswer();
      renderScramble();
    };
    row.appendChild(tile);
  });
}

function renderAnswer() {
  var row = document.getElementById('answer-row');
  row.innerHTML = '';
  for (var i = 0; i < currentWord.length; i++) {
    var tile = document.createElement('div');
    tile.className = 'ans-tile';
    tile.textContent = answerArr[i] ? answerArr[i].ch : '';
    tile.dataset.ai = i;
    if (answerArr[i]) {
      tile.onclick = (function(ai){return function(){
        var removed = answerArr.splice(ai, 1)[0];
        usedIdx.splice(usedIdx.indexOf(removed.idx), 1);
        renderAnswer(); renderScramble();
      };})(i);
    }
    row.appendChild(tile);
  }
}

function startTimer() {
  if (timerID) clearInterval(timerID);
  timerVal = 30;
  document.getElementById('timer-fill').style.width = '100%';
  timerID = setInterval(function() {
    timerVal--;
    document.getElementById('timer-fill').style.width = (timerVal/30*100) + '%';
    document.getElementById('timer-fill').style.background = timerVal < 10 ? '#e74c3c' : 'var(--accent)';
    if (timerVal <= 0) {
      clearInterval(timerID);
      onTimeUp();
    }
  }, 1000);
}

function onTimeUp() {
  streak = 0; combo = 1;
  document.getElementById('streak-v').textContent = streak;
  var fb = document.getElementById('feedback');
  fb.textContent = '⏰ Time! Answer: ' + currentWord;
  fb.style.color = 'var(--red, #e74c3c)';
  setTimeout(loadWord, 1800);
}

function checkAnswer() {
  if (answerArr.length !== currentWord.length) return;
  var guess = answerArr.map(function(x){return x.ch;}).join('');
  var fb = document.getElementById('feedback');
  if (guess === currentWord) {
    clearInterval(timerID);
    var timeBonus = timerVal;
    var pts = (10 + timeBonus) * combo;
    score += pts; streak++;
    combo = Math.min(5, Math.floor(streak/3) + 1);
    if (streak % 5 === 0) level = Math.min(10, level + 1);
    document.getElementById('score-v').textContent = score;
    document.getElementById('streak-v').textContent = streak;
    document.getElementById('lvl-v').textContent = level;
    fb.textContent = '✓ Correct! +' + pts;
    fb.style.color = 'var(--green)';
    if (combo > 1) document.getElementById('combo-display').textContent = '🔥 x' + combo + ' Combo!';
    document.querySelectorAll('.ans-tile').forEach(function(t){t.classList.add('correct');});
    _showInterstitial();
    setTimeout(loadWord, 900);
  } else {
    fb.textContent = '✗ Try again';
    fb.style.color = 'var(--accent)';
    document.querySelectorAll('.ans-tile').forEach(function(t){t.classList.add('wrong');});
    setTimeout(function(){document.querySelectorAll('.ans-tile').forEach(function(t){t.classList.remove('wrong');});}, 400);
  }
}

document.getElementById('submit-btn').onclick = checkAnswer;
document.getElementById('clear-btn').onclick = function() {
  answerArr = []; usedIdx = [];
  renderAnswer(); renderScramble();
};
document.getElementById('skip-btn').onclick = function() {
  clearInterval(timerID);
  streak = 0; combo = 1;
  document.getElementById('streak-v').textContent = 0;
  document.getElementById('feedback').textContent = 'Skipped: ' + currentWord;
  document.getElementById('feedback').style.color = 'var(--muted)';
  setTimeout(loadWord, 1200);
};
document.getElementById('hint-btn').onclick = function() {
  if (hintUsed) return;
  hintUsed = true;
  // Reveal first unanswered correct letter
  for (var i = answerArr.length; i < currentWord.length; i++) {
    var correct = currentWord[i];
    // find this letter in scrambled & not used
    for (var j = 0; j < scrambled.length; j++) {
      if (scrambled[j] === correct && usedIdx.indexOf(j) === -1) {
        answerArr.push({ch: correct, idx: j});
        usedIdx.push(j);
        break;
      }
    }
    break;
  }
  renderAnswer(); renderScramble();
};

document.querySelectorAll('.cat-btn').forEach(function(b) {
  b.onclick = function() {
    document.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('sel');});
    this.classList.add('sel'); selCat = this.dataset.cat;
    wordQueue = [];
    loadWord();
  };
});

loadWord();

if(/screenshot=/.test(location.hash)){
  document.body.classList.add('ss');
  setTimeout(function(){
    document.getElementById('score-v').textContent='2480';
    document.getElementById('streak-v').textContent='17';
    document.getElementById('lvl-v').textContent='12';
  },80);
}
</script>
</body>
</html>

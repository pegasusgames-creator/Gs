<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plant Watering</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0a1a0a; --surface:#0f2a0f; --card:#0d3a0d; --accent:#66BB6A; --text:#eaeaea; --muted:#88aa88; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.add-row { display:flex; gap:8px; margin-bottom:8px; }
.add-row input { background:var(--card); border:1px solid rgba(102,187,106,0.2); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.9rem; }
.add-row input:first-child { flex:1; }
.add-row input[type=number] { width:68px; }
.btn-p { background:var(--accent); border:none; color:#0a1a0a; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; width:100%; margin-top:4px; }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:2px; }
.stat-val { font-size:1.2rem; font-weight:700; color:var(--accent); }
.plant-item { background:var(--card); border-radius:10px; padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
.plant-item.overdue { border-left:4px solid #ef5350; }
.plant-item.due-today { border-left:4px solid #ffa726; }
.plant-item.ok { border-left:4px solid #66BB6A; }
.plant-icon { font-size:2rem; }
.plant-info { flex:1; }
.plant-name { font-size:1rem; font-weight:700; }
.plant-status { font-size:0.75rem; margin-top:2px; }
.plant-actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
.water-btn { background:var(--accent); border:none; color:#0a1a0a; border-radius:8px; padding:7px 14px; font-size:0.85rem; font-weight:700; cursor:pointer; }
.del-btn { background:none; border:none; color:var(--muted); font-size:0.8rem; padding:4px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px 0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Plant <span>Watering</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Add Plant</div>
      <div class="add-row">
        <input type="text" id="i-name" placeholder="Plant name (e.g. Monstera)">
        <input type="text" id="i-emoji" placeholder="🪴" maxlength="2" style="width:52px;text-align:center;">
      </div>
      <div class="add-row">
        <input type="number" id="i-freq" placeholder="Every X days" min="1" max="365" style="flex:1;">
        <span style="align-self:center;color:var(--muted);font-size:0.85rem;white-space:nowrap;">days interval</span>
      </div>
      <button class="btn-p" id="btn-add">Add Plant</button>
    </div>
    <div class="card" id="stats-card">
      <div class="card-title">Overview</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-lbl">Total Plants</div><div class="stat-val" id="st-total">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Need Water</div><div class="stat-val" id="st-due" style="color:#ffa726;">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Watered Today</div><div class="stat-val" id="st-today">0</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">My Plants</div>
      <div id="plants-list"><div class="empty">No plants yet. Add your first plant above!</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var plants=JSON.parse(localStorage.getItem('pw_plants')||'[]');
function save(){localStorage.setItem('pw_plants',JSON.stringify(plants));}
function todayMs(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function daysSince(ts){return ts?Math.floor((Date.now()-ts)/86400000):999;}
function fmtDate(ts){return ts?new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'Never';}

function render(){
  var el=document.getElementById('plants-list');
  var today=todayMs();
  document.getElementById('st-total').textContent=plants.length;
  var due=plants.filter(function(p){return daysSince(p.lastWatered)>=p.freq;}).length;
  document.getElementById('st-due').textContent=due;
  var wateredToday=plants.filter(function(p){return p.lastWatered&&p.lastWatered>=today;}).length;
  document.getElementById('st-today').textContent=wateredToday;
  if(!plants.length){el.innerHTML='<div class="empty">No plants yet.</div>';return;}
  var sorted=plants.slice().sort(function(a,b){return daysSince(b.lastWatered)-daysSince(a.lastWatered);});
  el.innerHTML='';
  sorted.forEach(function(p,idx){
    var days=daysSince(p.lastWatered);
    var overdue=days>=p.freq+1;
    var dueToday=days>=p.freq&&!overdue;
    var statusCls=overdue?'overdue':dueToday?'due-today':'ok';
    var statusTxt=overdue?'<span style="color:#ef5350;">Overdue by '+(days-p.freq)+' day(s)!</span>':dueToday?'<span style="color:#ffa726;">Due for watering today</span>':'<span style="color:#66BB6A;">Next water in '+(p.freq-days)+' day(s)</span>';
    var div=document.createElement('div');
    div.className='plant-item '+statusCls;
    div.innerHTML='<span class="plant-icon">'+(p.em||'🪴')+'</span>'+
      '<div class="plant-info"><div class="plant-name">'+p.name+'</div>'+
      '<div class="plant-status">'+statusTxt+'</div>'+
      '<div style="font-size:0.7rem;color:var(--muted);margin-top:2px;">Every '+p.freq+'d &bull; Last: '+fmtDate(p.lastWatered)+'</div></div>'+
      '<div class="plant-actions">'+
      '<button class="water-btn" data-name="'+p.name+'">Water</button>'+
      '<button class="del-btn" data-name="'+p.name+'">&#10005;</button></div>';
    el.appendChild(div);
  });
  el.querySelectorAll('.water-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var name=b.dataset.name;
      var p=plants.find(function(x){return x.name===name;});
      if(p){p.lastWatered=Date.now();save();render();maybeInterstitial();}
    });
  });
  el.querySelectorAll('.del-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var name=b.dataset.name;
      plants=plants.filter(function(x){return x.name!==name;});
      save();render();
    });
  });
}

document.getElementById('btn-add').addEventListener('click',function(){
  var name=document.getElementById('i-name').value.trim();
  if(!name){alert('Enter a plant name.');return;}
  var freq=parseInt(document.getElementById('i-freq').value)||7;
  var em=document.getElementById('i-emoji').value.trim();
  if(plants.find(function(p){return p.name===name;})){alert('A plant with this name already exists.');return;}
  plants.push({name:name,em:em,freq:freq,lastWatered:null});
  save();
  document.getElementById('i-name').value='';
  document.getElementById('i-emoji').value='';
  document.getElementById('i-freq').value='';
  render();
});

render();
</script>
</body>
</html>

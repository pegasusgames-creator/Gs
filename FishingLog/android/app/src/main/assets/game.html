<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fishing Log</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0a1a1a; --surface:#0f2a2a; --card:#0d3535; --accent:#26A69A; --text:#eaeaea; --muted:#7aaaaa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.ig { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
.ig label { font-size:0.72rem; color:var(--muted); }
.ig input, .ig select, .ig textarea { background:var(--card); border:1px solid rgba(38,166,154,0.2); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.95rem; width:100%; }
.ig textarea { resize:none; height:60px; }
.row2 { display:flex; gap:8px; }
.row2 .ig { flex:1; }
.btn-p { background:var(--accent); border:none; color:#fff; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; width:100%; margin-top:4px; }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:2px; }
.stat-val { font-size:1.2rem; font-weight:700; color:var(--accent); }
.catch-item { padding:10px 0; border-bottom:1px solid rgba(38,166,154,0.12); }
.catch-item:last-child { border-bottom:none; }
.catch-top { display:flex; justify-content:space-between; align-items:center; }
.catch-species { font-size:1rem; font-weight:700; color:var(--accent); }
.catch-size { font-size:0.85rem; color:var(--muted); }
.catch-details { font-size:0.75rem; color:var(--muted); margin-top:3px; }
.del { background:none; border:none; color:var(--muted); font-size:0.9rem; padding:4px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px 0; }
.record-item { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(38,166,154,0.1); font-size:0.85rem; }
.record-item:last-child { border-bottom:none; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Fishing <span>Log</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Log a Catch</div>
      <div class="row2">
        <div class="ig"><label>Species</label><input type="text" id="i-species" placeholder="Bass, Trout..."></div>
        <div class="ig"><label>Weight (lbs)</label><input type="number" id="i-weight" placeholder="2.5" step="0.1" min="0"></div>
      </div>
      <div class="row2">
        <div class="ig"><label>Length (in)</label><input type="number" id="i-len" placeholder="12" step="0.5" min="0"></div>
        <div class="ig"><label>Location</label><input type="text" id="i-loc" placeholder="Lake name..."></div>
      </div>
      <div class="row2">
        <div class="ig"><label>Bait Used</label><input type="text" id="i-bait" placeholder="Worm, Lure..."></div>
        <div class="ig"><label>Weather</label>
          <select id="i-weather">
            <option>Sunny</option><option>Cloudy</option><option>Overcast</option>
            <option>Rainy</option><option>Windy</option><option>Clear</option>
          </select>
        </div>
      </div>
      <div class="ig"><label>Notes</label><textarea id="i-notes" placeholder="Any observations..."></textarea></div>
      <button class="btn-p" id="btn-log">Log Catch</button>
    </div>
    <div class="card" id="stats-card">
      <div class="card-title">Stats</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-lbl">Total Catches</div><div class="stat-val" id="st-total">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Species</div><div class="stat-val" id="st-species">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Biggest (lbs)</div><div class="stat-val" id="st-big">--</div></div>
      </div>
    </div>
    <div class="card" id="records-card" style="display:none">
      <div class="card-title">Personal Records (by species)</div>
      <div id="records-list"></div>
    </div>
    <div class="card">
      <div class="card-title">Catch History</div>
      <div id="catch-list"><div class="empty">No catches yet. Log your first catch!</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var catches=JSON.parse(localStorage.getItem('fish_c')||'[]');
function save(){localStorage.setItem('fish_c',JSON.stringify(catches));}
function fmtD(ts){var d=new Date(ts);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}

function render(){
  var cl=document.getElementById('catch-list');
  var last=catches.slice(0,20);
  if(!last.length){cl.innerHTML='<div class="empty">No catches yet.</div>';}
  else{
    cl.innerHTML=last.map(function(c){
      return '<div class="catch-item"><div class="catch-top"><span class="catch-species">'+c.sp+'</span><span class="catch-size">'+(c.w?c.w+' lbs':'')+(c.l?' / '+c.l+'"':'')+'</span><button class="del" data-t="'+c.t+'">&#10005;</button></div><div class="catch-details">'+(c.loc?c.loc+' &bull; ':'')+c.wx+(c.b?' &bull; '+c.b:'')+' &bull; '+fmtD(c.t)+(c.n?'<br>'+c.n:'')+'</div></div>';
    }).join('');
    cl.querySelectorAll('.del').forEach(function(b){b.addEventListener('click',function(){var t=parseInt(b.dataset.t);catches=catches.filter(function(c){return c.t!==t;});save();render();});});
  }

  document.getElementById('st-total').textContent=catches.length;
  var species=[];
  catches.forEach(function(c){if(species.indexOf(c.sp)<0)species.push(c.sp);});
  document.getElementById('st-species').textContent=species.length;
  if(catches.length){
    var maxW=Math.max.apply(null,catches.filter(function(c){return c.w;}).map(function(c){return c.w;}));
    document.getElementById('st-big').textContent=isFinite(maxW)?maxW:'--';
  }
  renderRecords(species);
}

function renderRecords(species){
  var rc=document.getElementById('records-card');
  if(!species||!species.length){rc.style.display='none';return;}
  rc.style.display='block';
  var rl=document.getElementById('records-list');
  rl.innerHTML=species.map(function(sp){
    var sc=catches.filter(function(c){return c.sp===sp&&c.w;});
    if(!sc.length)return'';
    var best=sc.reduce(function(a,b){return a.w>b.w?a:b;});
    return '<div class="record-item"><span>'+sp+'</span><span style="color:var(--accent);">'+best.w+' lbs / '+best.l+'"</span></div>';
  }).join('');
}

document.getElementById('btn-log').addEventListener('click',function(){
  var sp=document.getElementById('i-species').value.trim();
  if(!sp){alert('Enter a species name.');return;}
  var w=parseFloat(document.getElementById('i-weight').value)||0;
  var l=parseFloat(document.getElementById('i-len').value)||0;
  var loc=document.getElementById('i-loc').value.trim();
  var bait=document.getElementById('i-bait').value.trim();
  var wx=document.getElementById('i-weather').value;
  var notes=document.getElementById('i-notes').value.trim();
  catches.unshift({sp:sp,w:w,l:l,loc:loc,b:bait,wx:wx,n:notes,t:Date.now()});
  if(catches.length>500)catches=catches.slice(0,500);
  save();
  ['i-species','i-weight','i-len','i-loc','i-bait','i-notes'].forEach(function(id){document.getElementById(id).value='';});
  render();maybeInterstitial();
});

render();
</script>
</body>
</html>

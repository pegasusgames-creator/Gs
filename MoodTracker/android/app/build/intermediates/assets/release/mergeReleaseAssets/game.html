<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mood Tracker</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#FFA726; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.mood-row { display:flex; justify-content:space-around; margin-bottom:12px; }
.mood-btn { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:2px solid transparent; border-radius:12px; padding:8px 10px; cursor:pointer; color:var(--text); }
.mood-btn .emoji { font-size:2rem; }
.mood-btn .lbl { font-size:0.62rem; color:var(--muted); }
.mood-btn.selected { border-color:var(--accent); background:rgba(255,167,38,0.1); }
.note-input { background:var(--card); border:1px solid rgba(255,167,38,0.2); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.95rem; width:100%; resize:none; height:60px; margin-bottom:10px; }
.btn-p { background:var(--accent); border:none; color:#1a1a2e; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; width:100%; }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:4px; }
.stat-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:2px; }
.stat-val { font-size:1.3rem; font-weight:700; }
.grid-30 { display:grid; grid-template-columns:repeat(10,1fr); gap:3px; }
.grid-day { width:100%; aspect-ratio:1; border-radius:4px; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:0.7rem; }
.entry-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
.entry-item:last-child { border-bottom:none; }
.entry-emoji { font-size:1.4rem; }
.entry-info { flex:1; }
.entry-note { font-size:0.8rem; color:var(--muted); }
.entry-date { font-size:0.7rem; color:var(--muted); }
.del-btn { background:none; border:none; color:var(--muted); font-size:0.9rem; padding:4px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px 0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Mood <span>Tracker</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">How are you feeling today?</div>
      <div class="mood-row" id="mood-row">
        <button class="mood-btn" data-v="1"><span class="emoji">😞</span><span class="lbl">Awful</span></button>
        <button class="mood-btn" data-v="2"><span class="emoji">😕</span><span class="lbl">Bad</span></button>
        <button class="mood-btn" data-v="3"><span class="emoji">😐</span><span class="lbl">Okay</span></button>
        <button class="mood-btn" data-v="4"><span class="emoji">🙂</span><span class="lbl">Good</span></button>
        <button class="mood-btn" data-v="5"><span class="emoji">😄</span><span class="lbl">Great</span></button>
      </div>
      <textarea class="note-input" id="i-note" placeholder="Add a note (optional)..."></textarea>
      <button class="btn-p" id="btn-log">Log Mood</button>
    </div>
    <div class="card" id="stats-card" style="display:none">
      <div class="card-title">Stats</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-lbl">Avg Mood</div><div class="stat-val" id="st-avg">--</div></div>
        <div class="stat-box"><div class="stat-lbl">This Month</div><div class="stat-val" id="st-month">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Best Streak</div><div class="stat-val" id="st-streak">0</div></div>
      </div>
    </div>
    <div class="card" id="grid-card" style="display:none">
      <div class="card-title">Last 30 Days</div>
      <div class="grid-30" id="mood-grid"></div>
    </div>
    <div class="card">
      <div class="card-title">Recent Entries</div>
      <div id="entries-list"><div class="empty">No entries yet. Log your first mood above!</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var entries=JSON.parse(localStorage.getItem('mood_e')||'[]');
var selMood=0;
var EMOJIS=['','😞','😕','😐','🙂','😄'];
var COLORS=['','#f44336','#ff7043','#ffa726','#66bb6a','#26c6da'];
function save(){localStorage.setItem('mood_e',JSON.stringify(entries));}
function dayKey(d){return new Date(d).toISOString().slice(0,10);}
function fmtD(ts){var d=new Date(ts);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}

document.getElementById('mood-row').querySelectorAll('.mood-btn').forEach(function(b){
  b.addEventListener('click',function(){
    selMood=parseInt(b.dataset.v);
    document.querySelectorAll('.mood-btn').forEach(function(x){x.classList.toggle('selected',x===b);});
  });
});

function render(){
  var el=document.getElementById('entries-list');
  var sc=document.getElementById('stats-card');
  var gc=document.getElementById('grid-card');
  if(!entries.length){el.innerHTML='<div class="empty">No entries yet.</div>';sc.style.display='none';gc.style.display='none';return;}
  sc.style.display=''; gc.style.display='';
  var avg=(entries.reduce(function(s,e){return s+e.v;},0)/entries.length).toFixed(1);
  document.getElementById('st-avg').innerHTML=EMOJIS[Math.round(avg)]+' '+avg;
  var now=new Date(), mStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  document.getElementById('st-month').textContent=entries.filter(function(e){return e.t>=mStart;}).length;
  var streak=0,maxStreak=0,prev='';
  entries.slice().reverse().forEach(function(e){
    var k=dayKey(e.t);
    if(k!==prev){streak++;if(streak>maxStreak)maxStreak=streak;prev=k;}
  });
  document.getElementById('st-streak').textContent=maxStreak;
  var grid=document.getElementById('mood-grid');
  grid.innerHTML='';
  var dayMap={};
  entries.forEach(function(e){var k=dayKey(e.t);dayMap[k]=(dayMap[k]||[]).concat(e.v);});
  for(var i=29;i>=0;i--){
    var k=dayKey(Date.now()-i*86400000);
    var d=document.createElement('div');
    d.className='grid-day';
    if(dayMap[k]){
      var avg2=dayMap[k].reduce(function(a,b){return a+b;},0)/dayMap[k].length;
      d.style.background=COLORS[Math.round(avg2)];
      d.title=k;
    }
    grid.appendChild(d);
  }
  el.innerHTML=entries.slice(-10).reverse().map(function(e){
    return '<div class="entry-item"><span class="entry-emoji">'+EMOJIS[e.v]+'</span><div class="entry-info">'+(e.n?'<div class="entry-note">'+e.n+'</div>':'')+'<div class="entry-date">'+fmtD(e.t)+'</div></div><button class="del-btn" data-t="'+e.t+'">&#10005;</button></div>';
  }).join('');
  el.querySelectorAll('.del-btn').forEach(function(b){b.addEventListener('click',function(){var t=parseInt(b.dataset.t);entries=entries.filter(function(e){return e.t!==t;});save();render();});});
}

document.getElementById('btn-log').addEventListener('click',function(){
  if(!selMood){alert('Select a mood first.');return;}
  var note=document.getElementById('i-note').value.trim();
  entries.push({v:selMood,n:note,t:Date.now()});
  if(entries.length>500)entries=entries.slice(-500);
  save();
  document.getElementById('i-note').value='';
  selMood=0;
  document.querySelectorAll('.mood-btn').forEach(function(b){b.classList.remove('selected');});
  render();maybeInterstitial();
});

render();
</script>
</body>
</html>

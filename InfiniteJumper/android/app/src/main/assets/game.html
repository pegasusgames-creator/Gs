<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infinite Jumper</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#0a1f0a; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
canvas { display:block; touch-action:none; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.82); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:14px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#4CAF50; }
#overlay .sub { font-size:0.9rem; color:#aaa; text-align:center; max-width:280px; }
#overlay .big { font-size:1.4rem; font-weight:800; }
#btn-play { background:#4CAF50; border:none; border-radius:30px; color:#fff; font-size:1.2rem; font-weight:800; padding:14px 48px; cursor:pointer; }
#admob-banner { position:absolute; bottom:0; left:0; right:0; height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <h2>Infinite Jumper</h2>
  <div class="sub">Touch left half = go left<br>Touch right half = go right<br>Jump on platforms to rise!</div>
  <div class="big" id="score-msg"></div>
  <button id="btn-play">Play!</button>
</div>
<div id="admob-banner">Advertisement</div>
<script>
'use strict';
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

var GRAVITY=0.4, JUMP_VEL=-11, SPRING_VEL=-18;
var PLAT_W=70, PLAT_H=14, PLAT_COUNT=12;
var best=parseInt(localStorage.getItem('ij_best')||'0');
var input={left:false,right:false};
var touches={};

var state={running:false,removeAds:false,
  player:{x:0,y:0,vx:0,vy:0,w:28,h:32},
  platforms:[],score:0,cameraY:0,highY:0};

function makePlatform(y){
  var type='normal';
  var r=Math.random();
  if(r<0.1)type='spring';
  else if(r<0.2)type='break';
  return{x:Math.random()*(W-PLAT_W),y:y,w:PLAT_W,h:PLAT_H,type:type,broken:false};
}

function initGame(){
  state.platforms=[];
  state.cameraY=0;state.score=0;state.highY=0;
  // First platform directly under player
  state.platforms.push({x:W/2-PLAT_W/2,y:H-100,w:PLAT_W,h:PLAT_H,type:'normal',broken:false});
  for(var i=1;i<PLAT_COUNT;i++){
    state.platforms.push(makePlatform(H-100-i*(H/(PLAT_COUNT-1)*0.7+Math.random()*30)));
  }
  state.player={x:W/2-14,y:H-100-36,vx:0,vy:-2,w:28,h:32};
  state.running=true;
  document.getElementById('overlay').style.display='none';
}
document.getElementById('btn-play').addEventListener('click',initGame);

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    touches[t.identifier]=t.clientX;
  }
  updateInput();
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    touches[t.identifier]=t.clientX;
  }
  updateInput();
},{passive:false});
canvas.addEventListener('touchend',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    delete touches[e.changedTouches[i].identifier];
  }
  updateInput();
},{passive:false});

function updateInput(){
  var ids=Object.keys(touches);
  input.left=false;input.right=false;
  ids.forEach(function(id){
    if(touches[id]<W/2)input.left=true;
    else input.right=true;
  });
}

function drawPlayer(p){
  var sx=p.x-state.cameraY%1000*0; // just use direct coords
  var sy=p.y;
  ctx.save();
  // Body
  ctx.fillStyle='#4CAF50';
  ctx.beginPath();ctx.roundRect(sx,sy,p.w,p.h,6);ctx.fill();
  // Eyes
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+8,sy+10,5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+20,sy+10,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(sx+9,sy+10,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+21,sy+10,2.5,0,Math.PI*2);ctx.fill();
  // Legs
  ctx.fillStyle='#2E7D32';
  ctx.fillRect(sx+4,sy+p.h,8,8);
  ctx.fillRect(sx+p.w-12,sy+p.h,8,8);
  ctx.restore();
}

function drawPlatform(plat){
  var sy=plat.y-state.cameraY;
  if(sy>H+20||sy<-20)return;
  if(plat.type==='break'){
    ctx.fillStyle=plat.broken?'rgba(200,50,50,0.3)':'#c0392b';
  } else if(plat.type==='spring'){
    ctx.fillStyle='#FF9800';
  } else {
    ctx.fillStyle='#4CAF50';
  }
  ctx.beginPath();ctx.roundRect(plat.x,sy,plat.w,plat.h,4);ctx.fill();
  if(plat.type==='spring'&&!plat.broken){
    ctx.fillStyle='#FFF176';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText('⬆',plat.x+plat.w/2,sy+12);
  }
}

function gameOver(){
  state.running=false;
  if(state.score>best){best=state.score;localStorage.setItem('ij_best',best);}
  document.getElementById('score-msg').textContent='Height: '+state.score+' | Best: '+best;
  document.getElementById('btn-play').textContent='Play Again';
  document.getElementById('overlay').style.display='flex';
  if(!state.removeAds&&window.Android)Android.showInterstitial();
}

function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1f0a');bg.addColorStop(1,'#1a3a1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(!state.running){
    return;
  }

  var p=state.player;
  // Input
  if(input.left){p.vx=Math.max(-5,p.vx-0.6);}
  else if(input.right){p.vx=Math.min(5,p.vx+0.6);}
  else{p.vx*=0.85;}

  p.vy+=GRAVITY;
  p.x+=p.vx;
  p.y+=p.vy;

  // Wrap horizontally
  if(p.x+p.w<0)p.x=W;
  if(p.x>W)p.x=-p.w;

  // Platform collisions (only when falling)
  if(p.vy>0){
    state.platforms.forEach(function(plat){
      if(plat.broken)return;
      var py=plat.y-state.cameraY;
      if(p.x+p.w>plat.x&&p.x<plat.x+plat.w&&p.y+p.h>py&&p.y+p.h<py+PLAT_H+p.vy+2){
        if(plat.type==='break'){
          plat.broken=true;
          setTimeout(function(){plat.broken=false;plat.x=Math.random()*(W-PLAT_W);},1500);
          p.vy=JUMP_VEL;
        } else if(plat.type==='spring'){
          p.vy=SPRING_VEL;
        } else {
          p.vy=JUMP_VEL;
        }
      }
    });
  }

  // Camera follows player rising
  var screenY=p.y-state.cameraY;
  if(screenY<H*0.35){
    var diff=H*0.35-screenY;
    state.cameraY-=diff;
    var risen=Math.round(-state.cameraY/10);
    if(risen>state.highY){state.highY=risen;state.score=risen;}
  }

  // Generate new platforms
  var minPlatY=state.cameraY; // top of screen in world coords
  var topPlat=state.platforms.reduce(function(min,pl){return pl.y<min?pl.y:min;},99999);
  while(topPlat>minPlatY-100){
    var newY=topPlat-60-Math.random()*80;
    state.platforms.push(makePlatform(newY));
    topPlat=newY;
    if(state.platforms.length>50)state.platforms.shift();
  }

  // Draw
  state.platforms.forEach(drawPlatform);
  drawPlayer(p);

  // Player fell
  if(p.y-state.cameraY>H+100){gameOver();return;}

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,48);
  ctx.fillStyle='#4CAF50';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
  ctx.fillText('Height: '+state.score,W/2,32);
  ctx.fillStyle='#aaa';ctx.font='13px sans-serif';ctx.textAlign='left';
  ctx.fillText('Best:'+best,10,32);

  // Touch indicators
  if(input.left){ctx.fillStyle='rgba(76,175,80,0.15)';ctx.fillRect(0,0,W/2,H);}
  if(input.right){ctx.fillStyle='rgba(76,175,80,0.15)';ctx.fillRect(W/2,0,W/2,H);}
}
loop();

if(!state.removeAds&&!window.Android)document.getElementById('admob-banner').style.display='flex';
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';}};
window.onAdMobLoaded=function(){};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salary Calculator</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#009688; --accent2:#00695C; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.toggle-row { display:flex; background:var(--card); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.toggle-btn { flex:1; min-height:44px; background:transparent; border:none; color:var(--muted); font-size:0.9rem; font-weight:600; cursor:pointer; }
.toggle-btn.active { background:var(--accent); color:#fff; }
.toggle-btn.btn-pressed { opacity:0.7; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
input[type=number] { width:100%; background:var(--card); border:none; color:var(--text); font-size:1rem; padding:10px 12px; border-radius:8px; outline:none; margin-bottom:12px; }
input[type=number]:focus { box-shadow:0 0 0 2px var(--accent); }
.hourly-panel { display:none; }
.hourly-panel.show { display:block; }
.annual-panel.hidden { display:none; }
.breakdown-row { display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--card); border-radius:10px; margin-bottom:8px; }
.breakdown-period { font-size:0.85rem; color:var(--muted); }
.breakdown-value { font-size:1.1rem; font-weight:700; color:var(--accent); }
.breakdown-row.top-row { background:#0a2a28; border:2px solid var(--accent); }
.breakdown-row.top-row .breakdown-value { font-size:1.4rem; }
.breakdown-row.top-row .breakdown-period { color:var(--text); font-weight:600; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Salary <span>Calculator</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Input Mode</div>
      <div class="toggle-row">
        <button class="toggle-btn active" id="btn-annual-mode">Annual Salary</button>
        <button class="toggle-btn" id="btn-hourly-mode">Hourly Rate</button>
      </div>
      <div class="annual-panel" id="annual-panel">
        <label>Annual Salary ($)</label>
        <input type="number" id="annual-salary" placeholder="60000" min="0" step="1000">
      </div>
      <div class="hourly-panel" id="hourly-panel">
        <label>Hourly Rate ($)</label>
        <input type="number" id="hourly-rate" placeholder="25" min="0" step="0.5">
        <label>Hours per Week</label>
        <input type="number" id="hours-week" placeholder="40" min="1" max="168" step="1" value="40">
        <label>Weeks per Year</label>
        <input type="number" id="weeks-year" placeholder="52" min="1" max="52" step="1" value="52">
      </div>
    </div>
    <div class="card" id="results-card">
      <div class="card-title">Salary Breakdown</div>
      <div class="breakdown-row top-row">
        <span class="breakdown-period">Annual</span>
        <span class="breakdown-value" id="r-annual">$0.00</span>
      </div>
      <div class="breakdown-row">
        <span class="breakdown-period">Monthly (÷12)</span>
        <span class="breakdown-value" id="r-monthly">$0.00</span>
      </div>
      <div class="breakdown-row">
        <span class="breakdown-period">Bi-Weekly (÷26)</span>
        <span class="breakdown-value" id="r-biweekly">$0.00</span>
      </div>
      <div class="breakdown-row">
        <span class="breakdown-period">Weekly (÷52)</span>
        <span class="breakdown-value" id="r-weekly">$0.00</span>
      </div>
      <div class="breakdown-row">
        <span class="breakdown-period">Daily (÷260)</span>
        <span class="breakdown-value" id="r-daily">$0.00</span>
      </div>
      <div class="breakdown-row">
        <span class="breakdown-period">Hourly (÷2080)</span>
        <span class="breakdown-value" id="r-hourly">$0.00</span>
      </div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, mode:'annual' };

function fmt(n){ return '$'+(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }

function calc(){
  var annual = 0;
  if(state.mode==='annual'){
    annual = parseFloat(document.getElementById('annual-salary').value)||0;
  } else {
    var hr = parseFloat(document.getElementById('hourly-rate').value)||0;
    var hw = parseFloat(document.getElementById('hours-week').value)||40;
    var wy = parseFloat(document.getElementById('weeks-year').value)||52;
    annual = hr * hw * wy;
  }
  var hoursPerYear = 2080;
  var workDays = 260;
  if(state.mode==='hourly'){
    var hw2 = parseFloat(document.getElementById('hours-week').value)||40;
    var wy2 = parseFloat(document.getElementById('weeks-year').value)||52;
    hoursPerYear = hw2 * wy2;
    workDays = wy2 * 5;
  }
  document.getElementById('r-annual').textContent = fmt(annual);
  document.getElementById('r-monthly').textContent = fmt(annual/12);
  document.getElementById('r-biweekly').textContent = fmt(annual/26);
  document.getElementById('r-weekly').textContent = fmt(annual/52);
  document.getElementById('r-daily').textContent = fmt(annual/workDays);
  document.getElementById('r-hourly').textContent = fmt(hoursPerYear>0 ? annual/hoursPerYear : 0);
  maybeInterstitial();
}

document.getElementById('annual-salary').addEventListener('input', calc);
document.getElementById('hourly-rate').addEventListener('input', calc);
document.getElementById('hours-week').addEventListener('input', calc);
document.getElementById('weeks-year').addEventListener('input', calc);

document.getElementById('btn-annual-mode').addEventListener('click', function(){
  state.mode='annual';
  this.classList.add('active');
  document.getElementById('btn-hourly-mode').classList.remove('active');
  document.getElementById('annual-panel').classList.remove('hidden');
  document.getElementById('hourly-panel').classList.remove('show');
  calc();
});
document.getElementById('btn-hourly-mode').addEventListener('click', function(){
  state.mode='hourly';
  this.classList.add('active');
  document.getElementById('btn-annual-mode').classList.remove('active');
  document.getElementById('annual-panel').classList.add('hidden');
  document.getElementById('hourly-panel').classList.add('show');
  calc();
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex'; calc();}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guitar Chords</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
:root {
  --bg: #0f1419;
  --surface: #19222c;
  --accent: #ff9143;
  --accent2: #102031;
  --text: #ecf2f9;
  --muted: #8892a4;
  --string: #e6c590;
  --fret: #3d4a5c;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Poppins', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; letter-spacing: -0.01em; }
body.ss #btn-remove-ads { display: none; }
#coins-pill { position: fixed; top: 10px; left: 14px; z-index: 999; background: var(--surface); border: 1px solid #2a3a5e; border-radius: 18px; padding: 5px 11px; font-size: 0.72rem; font-weight: 800; color: #ffd166; display: flex; align-items: center; gap: 5px; }
#coins-pill::before { content: '◎'; color: #ffd700; }
.fav-star { position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 2px 4px; }
.fav-star.on { color: #ffd166; }
.chord-card { position: relative; }

#header { background: var(--surface); padding: 38px 12px 10px; text-align: center; border-bottom: 1px solid #2a3a5e; }
#header h1 { font-size: 1.25rem; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }

#search-bar { display: flex; align-items: center; margin: 10px 12px 0; background: var(--accent2); border-radius: 22px; overflow: hidden; }
#search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); padding: 9px 14px; font-size: 0.9rem; }
#search-bar span { padding: 0 14px; color: var(--muted); font-size: 1.1rem; }

#cat-row { display: flex; gap: 7px; padding: 10px 12px 6px; overflow-x: auto; scrollbar-width: none; }
#cat-row::-webkit-scrollbar { display: none; }
.cat-btn { white-space: nowrap; padding: 6px 14px; border-radius: 18px; border: 1.5px solid #2a3a5e; background: transparent; color: var(--muted); font-size: 0.78rem; cursor: pointer; flex-shrink: 0; }
.cat-btn.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

#key-row { display: flex; gap: 5px; padding: 4px 12px 8px; overflow-x: auto; scrollbar-width: none; }
#key-row::-webkit-scrollbar { display: none; }
.key-btn { white-space: nowrap; padding: 5px 12px; border-radius: 14px; border: 1.5px solid #2a3a5e; background: transparent; color: var(--muted); font-size: 0.8rem; cursor: pointer; flex-shrink: 0; }
.key-btn.sel { background: var(--accent2); border-color: var(--accent); color: #fff; font-weight: 700; }

#chord-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 12px 80px; }
.chord-card { background: var(--surface); border: 1px solid #2a3a5e; border-radius: 12px; padding: 10px 6px 8px; cursor: pointer; text-align: center; transition: border-color 0.15s; }
.chord-card:active { border-color: var(--accent); }
.chord-card .cc-name { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
.chord-card .cc-type { font-size: 0.65rem; color: var(--muted); }

/* Modal */
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; }
#modal.show { display: flex; }
#modal-box { background: var(--surface); border-radius: 18px; padding: 22px 18px 24px; width: 92%; max-width: 360px; border: 1px solid #2a3a5e; }
#modal-title { font-size: 1.5rem; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 4px; }
#modal-full { font-size: 0.8rem; color: var(--muted); text-align: center; margin-bottom: 14px; }
#modal-svg-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
#modal-notes { font-size: 0.8rem; color: var(--muted); text-align: center; margin-bottom: 16px; }
#modal-close { display: block; width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 24px; color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; }

#btn-remove-ads-placeholder { height: 36px; }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;z-index:9999;background:#533483;border:none;color:#fff;font-size:0.7rem;font-weight:600;padding:5px 10px;border-radius:20px;cursor:pointer;">Remove Ads</button>

<div id="coins-pill"><span id="coins-display">0</span></div>
<div id="header">
  <h1>Guitar Chords</h1>
  <div id="search-bar">
    <span style="font-size:0.85rem;font-weight:800;color:var(--accent);">Q</span>
    <input type="text" id="search-input" placeholder="Search chord…">
  </div>
</div>

<div id="cat-row">
  <button class="cat-btn sel" data-cat="all">All</button>
  <button class="cat-btn" data-cat="favorites">★ Favorites</button>
  <button class="cat-btn" data-cat="major">Major</button>
  <button class="cat-btn" data-cat="minor">Minor</button>
  <button class="cat-btn" data-cat="7th">7th</button>
  <button class="cat-btn" data-cat="sus">Sus</button>
  <button class="cat-btn" data-cat="aug">Aug/Dim</button>
</div>

<div id="key-row"></div>
<div id="chord-grid"></div>

<div id="modal">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-full"></div>
    <div id="modal-svg-wrap"></div>
    <div id="modal-notes"></div>
    <button id="modal-close">Close</button>
  </div>
</div>

<script>
var _adsRemoved = false;
var _interstitialCount = 0;
function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}
window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};

// Chord data: [frets e2,a2,d3,g3,b3,e4] — -1=muted, 0=open
// fingers: [string_index(0=low e), fret, optional barre_string_to]
var CHORDS = [
  // Major
  {k:'A',cat:'major',name:'A',full:'A Major',frets:[null,0,2,2,2,0],fingers:[[1,2],[2,2],[3,2]],open:true,notes:'A E A C# E'},
  {k:'A',cat:'major',name:'A2',full:'A Major (barre)',frets:[5,7,7,6,5,5],fingers:[[0,5,5]],open:false,notes:'A E A C# E A'},
  {k:'B',cat:'major',name:'B',full:'B Major',frets:[null,2,4,4,4,2],fingers:[[0,2,5],[1,4],[2,4],[3,4]],open:false,notes:'B F# B D# F#'},
  {k:'C',cat:'major',name:'C',full:'C Major',frets:[null,3,2,0,1,0],fingers:[[0,3],[1,2],[3,1]],open:true,notes:'C E G C E'},
  {k:'D',cat:'major',name:'D',full:'D Major',frets:[null,null,0,2,3,2],fingers:[[1,2],[2,3],[3,2]],open:true,notes:'D A D F#'},
  {k:'E',cat:'major',name:'E',full:'E Major',frets:[0,2,2,1,0,0],fingers:[[1,2],[2,2],[3,1]],open:true,notes:'E B E G# B E'},
  {k:'F',cat:'major',name:'F',full:'F Major',frets:[1,1,2,3,3,1],fingers:[[0,1,5],[1,2],[2,3],[3,3]],open:false,notes:'F C F A C F'},
  {k:'G',cat:'major',name:'G',full:'G Major',frets:[3,2,0,0,0,3],fingers:[[0,3],[1,2],[4,3]],open:true,notes:'G B D G B G'},
  {k:'A',cat:'minor',name:'Am',full:'A Minor',frets:[null,0,2,2,1,0],fingers:[[1,2],[2,2],[3,1]],open:true,notes:'A E A C E'},
  {k:'B',cat:'minor',name:'Bm',full:'B Minor',frets:[null,2,4,4,3,2],fingers:[[0,2,5],[1,4],[2,4],[3,3]],open:false,notes:'B F# B D F#'},
  {k:'C',cat:'minor',name:'Cm',full:'C Minor',frets:[null,3,5,5,4,3],fingers:[[0,3,5],[1,5],[2,5],[3,4]],open:false,notes:'C G C Eb G'},
  {k:'D',cat:'minor',name:'Dm',full:'D Minor',frets:[null,null,0,2,3,1],fingers:[[2,1],[3,2],[4,3]],open:true,notes:'D A D F'},
  {k:'E',cat:'minor',name:'Em',full:'E Minor',frets:[0,2,2,0,0,0],fingers:[[1,2],[2,2]],open:true,notes:'E B E G B E'},
  {k:'F',cat:'minor',name:'Fm',full:'F Minor',frets:[1,1,2,3,3,1],fingers:[[0,1,5],[2,2],[3,3]],open:false,notes:'F C F Ab C F'},
  {k:'G',cat:'minor',name:'Gm',full:'G Minor',frets:[3,5,5,3,3,3],fingers:[[0,3,5],[1,5],[2,5]],open:false,notes:'G D G Bb D G'},
  // 7th
  {k:'A',cat:'7th',name:'A7',full:'A Dominant 7',frets:[null,0,2,0,2,0],fingers:[[1,2],[3,2]],open:true,notes:'A E G C# E'},
  {k:'B',cat:'7th',name:'B7',full:'B Dominant 7',frets:[null,2,1,2,0,2],fingers:[[1,1],[2,2],[3,2],[5,2]],open:true,notes:'B F# A D# F#'},
  {k:'C',cat:'7th',name:'C7',full:'C Dominant 7',frets:[null,3,2,3,1,0],fingers:[[0,3],[1,2],[2,3],[4,1]],open:true,notes:'C E Bb C E'},
  {k:'D',cat:'7th',name:'D7',full:'D Dominant 7',frets:[null,null,0,2,1,2],fingers:[[2,2],[3,1],[4,2]],open:true,notes:'D A C F#'},
  {k:'E',cat:'7th',name:'E7',full:'E Dominant 7',frets:[0,2,0,1,0,0],fingers:[[1,2],[3,1]],open:true,notes:'E B D G# B E'},
  {k:'G',cat:'7th',name:'G7',full:'G Dominant 7',frets:[3,2,0,0,0,1],fingers:[[0,3],[1,2],[5,1]],open:true,notes:'G B D F G B'},
  {k:'A',cat:'7th',name:'AM7',full:'A Major 7',frets:[null,0,2,1,2,0],fingers:[[1,2],[2,1],[3,2]],open:true,notes:'A E G# C# E'},
  {k:'D',cat:'7th',name:'DM7',full:'D Major 7',frets:[null,null,0,2,2,2],fingers:[[1,2],[2,2],[3,2]],open:true,notes:'D A C# F#'},
  {k:'E',cat:'7th',name:'Em7',full:'E Minor 7',frets:[0,2,0,0,0,0],fingers:[[1,2]],open:true,notes:'E B D G B E'},
  {k:'A',cat:'7th',name:'Am7',full:'A Minor 7',frets:[null,0,2,0,1,0],fingers:[[2,2],[4,1]],open:true,notes:'A E G C E'},
  // Sus
  {k:'A',cat:'sus',name:'Asus2',full:'A Sus2',frets:[null,0,2,2,0,0],fingers:[[1,2],[2,2]],open:true,notes:'A E A B E'},
  {k:'A',cat:'sus',name:'Asus4',full:'A Sus4',frets:[null,0,2,2,3,0],fingers:[[1,2],[2,2],[3,3]],open:true,notes:'A E A D E'},
  {k:'D',cat:'sus',name:'Dsus2',full:'D Sus2',frets:[null,null,0,2,3,0],fingers:[[1,2],[2,3]],open:true,notes:'D A D E'},
  {k:'D',cat:'sus',name:'Dsus4',full:'D Sus4',frets:[null,null,0,2,3,3],fingers:[[1,2],[2,3],[3,3]],open:true,notes:'D A D G'},
  {k:'E',cat:'sus',name:'Esus4',full:'E Sus4',frets:[0,2,2,2,0,0],fingers:[[1,2],[2,2],[3,2]],open:true,notes:'E B E A B E'},
  {k:'G',cat:'sus',name:'Gsus4',full:'G Sus4',frets:[3,3,0,0,1,3],fingers:[[0,3],[1,3],[4,1],[5,3]],open:true,notes:'G D G C D G'},
  // Aug/Dim
  {k:'A',cat:'aug',name:'Aaug',full:'A Augmented',frets:[null,0,3,2,2,1],fingers:[[1,1],[2,2],[3,3],[4,2]],open:true,notes:'A E A C# F'},
  {k:'C',cat:'aug',name:'Caug',full:'C Augmented',frets:[null,3,2,1,1,0],fingers:[[2,1,3],[1,2],[0,3]],open:true,notes:'C E G# C E'},
  {k:'D',cat:'aug',name:'Daug',full:'D Augmented',frets:[null,null,0,3,3,2],fingers:[[1,2],[2,3],[3,3]],open:true,notes:'D A D F# A#'},
  {k:'B',cat:'aug',name:'Bdim',full:'B Diminished',frets:[null,2,3,4,3,null],fingers:[[0,2],[1,3],[2,4],[3,3]],open:false,notes:'B D F B'},
  {k:'D',cat:'aug',name:'Ddim',full:'D Diminished',frets:[null,null,0,1,3,1],fingers:[[1,1,5],[2,3]],open:true,notes:'D Ab Db F'},
];

var KEYS = ['A','B','C','D','E','F','G'];
var selKey = 'all', selCat = 'all', searchQ = '';

// Build key row
var kr = document.getElementById('key-row');
var allK = document.createElement('button');
allK.className = 'key-btn sel'; allK.textContent = 'All Keys'; allK.dataset.k = 'all';
kr.appendChild(allK);
KEYS.forEach(function(k) {
  var b = document.createElement('button');
  b.className = 'key-btn'; b.textContent = k; b.dataset.k = k;
  kr.appendChild(b);
});

document.querySelectorAll('.key-btn').forEach(function(b) {
  b.onclick = function() {
    document.querySelectorAll('.key-btn').forEach(function(x){x.classList.remove('sel');});
    this.classList.add('sel'); selKey = this.dataset.k; render();
  };
});

document.querySelectorAll('.cat-btn').forEach(function(b) {
  b.onclick = function() {
    document.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('sel');});
    this.classList.add('sel'); selCat = this.dataset.cat; render();
  };
});

document.getElementById('search-input').oninput = function() {
  searchQ = this.value.toLowerCase(); render();
};

var FAVS = [], COINS = 0;
try { var _s = JSON.parse(localStorage.getItem('guitarch_v2')||'{}'); if(_s.favs) FAVS = _s.favs; if(_s.coins) COINS = _s.coins; } catch(e){}
function _save(){ try{ localStorage.setItem('guitarch_v2', JSON.stringify({favs:FAVS,coins:COINS})); }catch(e){} }
function _updCoins(){ document.getElementById('coins-display').textContent = COINS; }

function filtered() {
  return CHORDS.filter(function(c) {
    var keyOk = selKey==='all' || c.k===selKey;
    var catOk = selCat==='all' || selCat==='favorites' || c.cat===selCat;
    var favOk = selCat!=='favorites' || FAVS.indexOf(c.name)>=0;
    var srchOk = !searchQ || c.name.toLowerCase().includes(searchQ) || c.full.toLowerCase().includes(searchQ);
    return keyOk && catOk && favOk && srchOk;
  });
}

function render() {
  var grid = document.getElementById('chord-grid');
  grid.innerHTML = '';
  var results = filtered();
  if(!results.length){
    grid.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:40px 12px;color:var(--muted);font-size:0.88rem;">'+(selCat==='favorites'?'★ Star chords to save them here':'No chords match')+'</div>';
    return;
  }
  results.forEach(function(c) {
    var card = document.createElement('div');
    card.className = 'chord-card';
    var isF = FAVS.indexOf(c.name)>=0;
    card.innerHTML = '<button class="fav-star '+(isF?'on':'')+'" data-n="'+c.name+'">★</button><div class="cc-name">'+c.name+'</div><div class="cc-type">'+c.cat+'</div>';
    card.appendChild(miniDiagram(c));
    card.onclick = function(e){
      if(e.target.classList.contains('fav-star')){
        var i=FAVS.indexOf(c.name);
        if(i<0){FAVS.push(c.name);COINS+=2;}else{FAVS.splice(i,1);}
        _save();_updCoins();render();return;
      }
      showModal(c); _showInterstitial();
    };
    grid.appendChild(card);
  });
}

function miniDiagram(c) {
  var svg = makeDiagram(c, 80, 70, 6, 5);
  return svg;
}

function makeDiagram(c, W, H, strings, frets) {
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('viewBox','0 0 '+W+' '+H);

  var ml=18, mr=6, mt=12, mb=6;
  var fw=(W-ml-mr)/(strings-1);
  var fh=(H-mt-mb)/(frets);

  // Find min fret for barre chords
  var minFret=0, maxFret=0;
  c.frets.forEach(function(f){if(f&&f>0){if(minFret===0||f<minFret)minFret=f;if(f>maxFret)maxFret=f;}});
  var offset = (minFret>2)?minFret-1:0;

  // fret lines
  for(var fi=0;fi<=frets;fi++){
    var line=document.createElementNS(ns,'line');
    line.setAttribute('x1',ml); line.setAttribute('x2',W-mr);
    var y=mt+fi*fh;
    line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('stroke',fi===0?'#ccc':'#4a4a6a'); line.setAttribute('stroke-width',fi===0?2:1);
    svg.appendChild(line);
  }
  // string lines
  for(var si=0;si<strings;si++){
    var x=ml+si*fw;
    var sl=document.createElementNS(ns,'line');
    sl.setAttribute('x1',x);sl.setAttribute('x2',x);
    sl.setAttribute('y1',mt);sl.setAttribute('y2',H-mb);
    sl.setAttribute('stroke','#c8a96e');sl.setAttribute('stroke-width',1.2);
    svg.appendChild(sl);
  }

  // offset label
  if(offset>0){
    var t=document.createElementNS(ns,'text');
    t.setAttribute('x',2); t.setAttribute('y',mt+fh*0.7);
    t.setAttribute('fill','#aaa'); t.setAttribute('font-size','8');
    t.textContent=offset+'fr';
    svg.appendChild(t);
  }

  // muted / open
  c.frets.forEach(function(f,i){
    var x=ml+i*fw;
    if(f===null){
      var t=document.createElementNS(ns,'text');
      t.setAttribute('x',x-3);t.setAttribute('y',mt-3);
      t.setAttribute('fill','#e94560');t.setAttribute('font-size','9');
      t.textContent='✕'; svg.appendChild(t);
    } else if(f===0){
      var ci=document.createElementNS(ns,'circle');
      ci.setAttribute('cx',x);ci.setAttribute('cy',mt-5);
      ci.setAttribute('r',4);ci.setAttribute('fill','none');
      ci.setAttribute('stroke','#8892a4');ci.setAttribute('stroke-width',1.3);
      svg.appendChild(ci);
    }
  });

  // finger dots
  c.fingers.forEach(function(f){
    var si2=f[0], fret=f[1];
    var bTo=f[2]!==undefined?f[2]:si2;
    var fx=ml+si2*fw;
    var fy=mt+(fret-offset-0.5)*fh;
    if(bTo!==si2){
      // barre
      var bx=ml+bTo*fw;
      var rect=document.createElementNS(ns,'rect');
      rect.setAttribute('x',Math.min(fx,bx)-3); rect.setAttribute('y',fy-5);
      rect.setAttribute('width',Math.abs(bx-fx)+6); rect.setAttribute('height',10);
      rect.setAttribute('rx',5); rect.setAttribute('fill','#e94560');
      svg.appendChild(rect);
    } else {
      var dot=document.createElementNS(ns,'circle');
      dot.setAttribute('cx',fx); dot.setAttribute('cy',fy);
      dot.setAttribute('r',6); dot.setAttribute('fill','#e94560');
      svg.appendChild(dot);
    }
  });

  return svg;
}

function showModal(c) {
  document.getElementById('modal-title').textContent = c.name;
  document.getElementById('modal-full').textContent = c.full + (c.open?' — Open chord':' — Barre chord');
  document.getElementById('modal-notes').textContent = 'Notes: ' + c.notes;
  var wrap = document.getElementById('modal-svg-wrap');
  wrap.innerHTML = '';
  var big = makeDiagram(c, 220, 180, 6, 5);
  wrap.appendChild(big);
  document.getElementById('modal').classList.add('show');
}

document.getElementById('modal-close').onclick = function() {
  document.getElementById('modal').classList.remove('show');
};
document.getElementById('modal').onclick = function(e) {
  if(e.target===this) this.classList.remove('show');
};

_updCoins(); render();

// Screenshot mode
var SS = /screenshot=/.test(location.hash);
if (SS) {
  document.body.classList.add('ss');
  COINS = 480; _updCoins();
  FAVS = ['C','G','Am','Em','D','F'];
  var ST = (location.hash.match(/screenshot=([a-z]+)/)||[])[1];
  if (ST === 'fav') { selCat='favorites'; document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('sel',b.dataset.cat==='favorites');}); render(); }
  else if (ST === 'modal') { render(); setTimeout(function(){showModal(CHORDS.find(function(c){return c.name==='G';})); },150); }
  else { render(); }
}

window.handleBack = function(){ var m=document.getElementById('modal'); if(m.classList.contains('show')){m.classList.remove('show');return true;} return false; };
</script>
</body>
</html>

html[lang^="tr"]{--font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:2px;min-height:var(--appbar-h);padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;padding-inline-start:16px;background:var(--bg)}
.appbar.has-back{padding-inline-start:4px}
.ab-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ab-title{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sub{font-size:.82rem;font-weight:600;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:3rem;height:3rem;min-width:48px;min-height:48px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-grid;place-items:center;padding:0;transition:background .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.tint{color:var(--accent)}
[dir="rtl"] .flip{transform:scaleX(-1)}
#view:focus,.sheet:focus,.dialog:focus{outline:none}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:auto}
.page{max-width:760px;margin:0 auto;padding:4px 16px 28px}
/* Bottom nav = the utility 'footer': symmetric padding + safe-area inset + 6px buffer above
   the native banner (the banner lives outside the WebView, below it). */
.nav{flex:0 0 auto;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding:clamp(2px,.6vh,6px) 8px calc(clamp(2px,.6vh,6px) + env(safe-area-inset-bottom,0px) + 6px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav-btn{flex:1 1 0;min-width:0;min-height:var(--nav-h);border:0;background:transparent;color:var(--text-mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;padding:6px 2px}
.nav-btn .pill{display:grid;place-items:center;width:3.6rem;height:2rem;border-radius:1rem;transition:background .2s,color .2s}
.nav-btn[aria-current="page"]{color:var(--text)}
.nav-btn[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.nav-btn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cards, lists, rows */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card+.card,.group+.group{margin-top:14px}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.sec-h:first-child{margin-top:10px}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:3.5rem;padding:10px 16px;border:0;background:transparent;text-align:start;color:var(--text);font-size:1rem}
.group .row+.row,.group .row+.row-x,.group .row-x+.row{border-top:1px solid var(--border)}
button.row:active{background:var(--surface-2)}
.row .ri{width:2.25rem;height:2.25rem;border-radius:11px;display:grid;place-items:center;background:var(--menu-tile-bg);color:var(--menu-tile-fg);border:1px solid var(--menu-tile-border);flex:none}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rl{font-weight:650;overflow-wrap:break-word}
.row .rs{font-size:.84rem;color:var(--text-mute);overflow-wrap:break-word}
.row select.inp{width:42%;max-width:240px;min-height:2.75rem;flex:none;padding-inline:12px}
.row .rv{color:var(--text-mute);font-weight:650;font-size:.92rem;flex:none;max-width:45%;text-align:end}
.row .chev{color:var(--text-faint)}
.row-x{padding:12px 16px}
.row.danger,.row.danger .ri{color:var(--danger)}
.row.danger .ri{background:transparent;border:1.5px solid currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:transparent;color:var(--success);border:1.5px solid currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;min-width:48px;padding:0 20px;border-radius:14px;border:0;font-weight:750;font-size:1rem;line-height:1.15;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--g-play);color:var(--on-accent);box-shadow:0 6px 18px -6px var(--accent)}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-neutral{background:var(--btn-neutral-bg);color:var(--text)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}

/* form controls */
.field{display:block;margin:0 0 16px}
.field>.fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.inp{width:100%;min-height:3rem;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:1rem}
.inp::placeholder{color:var(--text-faint)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:6.5rem;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface-2);width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:2.75rem;border:0;border-radius:11px;background:transparent;color:var(--text-mute);font-weight:750;font-size:.88rem;line-height:1.15;padding:4px;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.switch{position:relative;flex:none;width:3.25rem;height:2rem;min-width:52px;border-radius:1rem;border:0;background:var(--border-strong);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(2rem - 6px);height:calc(2rem - 6px);border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(1.25rem)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-1.25rem)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:3rem;height:3rem;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center}
.sw i{width:2.1rem;height:2.1rem;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--text)}
.sw .lk{position:absolute;inset-inline-end:2px;bottom:2px;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.stepper button{width:2.75rem;height:2.75rem;min-width:44px;border-radius:11px;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper output{min-width:2.6rem;text-align:center;font-weight:800;font-size:1.15rem}

/* layers: sheets, dialogs, onboarding, toast */
.layer{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center}
.layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;border:0;padding:0;width:100%}
.layer.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.in .sheet{transform:none}
.sheet.full{height:calc(100% - 24px)}
.sheet-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0;padding-inline-start:20px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:1.2rem;font-weight:800;min-width:0}
.grab{position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px 20px 16px;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1 1 140px}
.layer.center{align-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:400px;background:var(--surface);color:var(--text);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:22px 20px 16px;transform:scale(.94);opacity:0;transition:transform .2s,opacity .2s}
.layer.in .dialog{transform:none;opacity:1}
.dialog h2{margin:0 0 8px;font-size:1.2rem;font-weight:800}
.dialog p{margin:0 0 18px;color:var(--text-mute)}
.dialog .btn-row{justify-content:flex-end}
.dialog .btn-row .btn{flex:0 1 auto}
#toast{position:fixed;left:50%;bottom:calc(var(--toast-b,16px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);z-index:var(--z-critical);width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;padding-inline:18px 8px;min-height:3.25rem;border-radius:16px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:650;font-size:.95rem}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .tm{flex:1;min-width:0;padding:6px 0}
#toast .ta{border:0;background:transparent;color:var(--bg);font-weight:850;min-height:44px;padding:0 14px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
.onb{position:fixed;inset:0;z-index:var(--z-tutorial);background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.onb-top{display:flex;justify-content:flex-end;padding:0 8px}
.onb-track{flex:1;display:flex;overflow:hidden;touch-action:pan-y}
.onb-card{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.onb-art{width:min(68vw,260px);height:min(68vw,260px);margin-bottom:28px}
.onb-art svg{width:100%;height:100%}
.onb h2{margin:0 0 10px;font-size:1.6rem;font-weight:850;letter-spacing:-.015em;max-width:440px}
.onb p{margin:0;color:var(--text-mute);font-size:1.05rem;max-width:400px}
.onb-foot{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border-strong);transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--accent)}
.onb-foot .btn{width:min(100%,420px)}
.empty{text-align:center;padding:28px 18px 8px}
.empty .ea{width:132px;height:132px;margin:0 auto 14px}
.empty h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.empty p{margin:0 auto 18px;color:var(--text-mute);max-width:360px}
.pro-hero{text-align:center;padding:2px 0 8px}
.pro-hero .em{width:84px;height:84px;margin:0 auto 10px}
.pro-hero h3{margin:0;font-size:1.4rem;font-weight:850}
.pro-hero p{margin:6px 0 0;color:var(--text-mute)}
.feat{list-style:none;margin:14px 0 6px;padding:0}
.feat li{display:flex;align-items:center;gap:12px;padding:9px 2px;font-weight:650}
.feat li .ri{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fine{font-size:.82rem;color:var(--text-mute);text-align:center;margin:10px 0 0}
.about-foot{text-align:center;color:var(--text-mute);font-size:.82rem;margin:22px 0 4px}
.lock-chip{display:inline-flex;align-items:center;gap:4px}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (min-width:600px){html{font-size:calc(17px * var(--fs))}.page{padding:8px 24px 32px}.appbar{padding-inline:20px 12px}.sheet-body,.sheet-foot{padding-inline:28px}}
@media (min-width:900px){html{font-size:calc(18px * var(--fs))}:root{--appbar-h:4rem}.ab-title{font-size:1.5rem}}

/*@@REGION TOOL_CSS*/
/* Age Calculator tool styles. Tokens only; logical properties for RTL. */
.frm{display:flex;flex-wrap:wrap;gap:12px;padding:16px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.frm .field{flex:1 1 9.5rem;margin:0;min-width:0}
.frm .inp{font-variant-numeric:tabular-nums}
.frm .lnk{align-self:flex-end;min-height:3rem;padding-inline:8px}
.frm-sw{display:flex;justify-content:center;width:100%;margin-top:-2px}
.msg{padding:12px 14px;margin-bottom:14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--text);font-weight:650;border:1px solid var(--border)}
.msg.err{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.hero{padding:20px 16px 18px;margin-bottom:14px;border-radius:var(--r);background:var(--g-play);color:var(--on-accent);box-shadow:0 10px 26px -12px var(--accent)}
.hero .hl{font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;opacity:.92;margin:0 2px 12px;overflow-wrap:anywhere}
.hero .big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .bt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:12px 4px 10px;border-radius:16px;background:rgba(255,255,255,.18)}
html[data-theme="dark"] .hero .bt{background:rgba(0,0,0,.16)}
.hero .bt b{font-size:clamp(1.9rem,9.5vw,2.8rem);line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;max-width:100%;overflow-wrap:anywhere}
.hero .bt span{font-size:.82rem;font-weight:700;opacity:.95;text-align:center;overflow-wrap:anywhere}
.hero .sub{margin:12px 2px 0;font-weight:650;font-size:.92rem;opacity:.95;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);min-width:0}
.tile b{display:block;font-size:1.35rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{display:block;font-size:.84rem;font-weight:650;color:var(--text-mute);overflow-wrap:anywhere}
.tile small{display:block;margin-top:2px;font-size:.78rem;color:var(--text-faint);overflow-wrap:anywhere}
.fine{font-size:.8rem;color:var(--text-faint);margin:6px 4px 14px;overflow-wrap:anywhere}
.nb{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1)}
.nb .ico{flex:none;width:3rem;height:3rem;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.nb .nt{flex:1;min-width:0}
.nb .nt small{display:block;font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-mute)}
.nb .nt b{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.nb .nt span{display:block;font-size:.9rem;color:var(--text-mute);overflow-wrap:anywhere}
.nb .cnt{flex:none;text-align:center;min-width:3.6rem;padding:6px 10px;border-radius:14px;background:var(--g-play);color:var(--on-accent)}
.nb .cnt b{display:block;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.nb .cnt span{display:block;font-size:.72rem;font-weight:700}
.nb.today{border-color:var(--accent)}
.zs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.zs .tile .zg{font-size:1.9rem;line-height:1;margin-bottom:4px;color:var(--accent)}
.mrow .ri{font-weight:800;font-size:.8rem}
.mrow.past{opacity:.78}
.mrow .rv.soon{color:var(--accent);font-weight:800}
.mrow .x{flex:none;min-width:48px;min-height:48px;margin-inline-end:-10px;border:0;background:transparent;color:var(--text-mute);display:grid;place-items:center;border-radius:12px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.act .btn{flex:1 1 9rem;height:auto;padding:8px 12px;line-height:1.2;text-align:center}
.act .btn-primary{flex-basis:100%}
.pbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:var(--r);background:var(--accent-soft);color:var(--text)}
.pbar span{flex:1;min-width:0;font-weight:650;font-size:.92rem}
.pbar .btn{min-height:2.75rem;padding:0 14px}
.av{flex:none;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem;background:var(--accent-soft);color:var(--accent);border:1px solid var(--border)}
.row.prow{min-height:4rem}
.row .bd{flex:none;text-align:end;font-weight:800;color:var(--accent);font-size:.9rem;max-width:40%;overflow-wrap:anywhere}
.row .bd.hot{padding:4px 10px;border-radius:12px;background:var(--g-play);color:var(--on-accent)}
.wkc .rl{font-weight:700}
.wkc .sub{padding:0 16px 14px;display:flex;gap:10px;flex-wrap:wrap}
.wkc .sub .inp{flex:1 1 8rem;min-width:0}
.lnk-row{display:flex;justify-content:center;margin:2px 0 10px}
@media (min-width:600px){.hero .bt b{font-size:3.2rem}.tiles{grid-template-columns:repeat(4,1fr)}.tile b{font-size:1.5rem}}
@media (min-width:900px){#view>*{max-width:46rem;margin-inline:auto}}
/*@@END TOOL_CSS*/
</style>
</head>
<body>
<div id="app">
  <header class="appbar" id="appbar">
    <button class="icon-btn" id="ab-back" data-act="back" hidden></button>
    <div class="ab-titles"><h1 class="ab-title" id="ab-title"></h1><div class="ab-sub" id="ab-sub" hidden></div></div>
    <div class="ab-actions" id="ab-actions"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="nav" id="nav"><div class="nav-in" id="nav-in" role="tablist"></div></nav>
</div>
<div id="layers"></div>
<div id="toast" role="status" aria-live="polite"><span class="tm"></span><button class="ta" hidden></button></div>
<div id="sr" class="vh" aria-live="polite"></div>
<span data-app-version hidden>2.0.0</span>
<script>
'use strict';
//@@REGION APP_CONFIG
// Per-app identity + shell switches. Strings are i18n KEYS (TOOL_I18N / GAME_I18N).
const APP = {
  name: 'Age Calculator',                      // == <title> == store title (never translated)
  pkg: 'com.pegasusgames.agecalculator',        // == applicationId (scaffold rewrites it)
  saveKey: 'agecalculator_save',                // localStorage key (scaffold rewrites it)
  tabs: [                                      // bottom nav (1 tab = nav hidden); first = home
    { id: 'age',    icon: 'cake',  label: 'tab_age' },
    { id: 'diff',   icon: 'swap',  label: 'tab_diff' },
    { id: 'people', icon: 'users', label: 'tab_people' },
  ],
  onboarding: [                                // 2-3 cards; art = ART key (TOOL_ICONS)

const SHELL_SCREENS = {};
const UI = {
  stack: [], layers: [], _toastT: 0,

  tab(id) { this.stack = [{ id: id, params: {} }]; this.render(true); },
  go(id, params) { const c = this.cur(); if (c) c.scroll = $('#view').scrollTop; this.stack.push({ id: id, params: params || {} }); this.render(true); },
  back() {

    if (this.stack.length > 1) { const leaving = this.stack.pop(); const d = this.def(leaving.id); if (d && d.onLeave) d.onLeave(leaving.params); this.render(true, true); return true; }
    if (this.cur() && this.cur().id !== APP.tabs[0].id) { this.tab(APP.tabs[0].id); return true; }

  },
  refresh() { this.render(false); },
  render(reset, popped) {

    bb.innerHTML = icon('back', 24, 'flip'); bb.setAttribute('aria-label', t('back'));
    $('#ab-title').textContent = d.title ? d.title(e.params) : APP.name;
    const sub = d.subtitle ? d.subtitle(e.params) : '';
    $('#ab-sub').textContent = sub || ''; $('#ab-sub').hidden = !sub;
    const acts = (d.actions ? d.actions(e.params) : []).slice();
    if (depth === 1) acts.push({ icon: 'gear', label: t('settings'), act: 'go', arg: 'settings' });
    $('#ab-actions').innerHTML = acts.map(a => '<button class="icon-btn' + (a.tint ? ' tint' : '') + '" data-act="' + a.act + '"' + (a.arg != null ? ' data-arg="' + esc(a.arg) + '"' : '') + ' aria-label="' + esc(a.label) + '">' + icon(a.icon) + '</button>').join('');

    document.documentElement.style.setProperty('--toast-b', showNav ? 'calc(var(--nav-h) + 14px)' : '16px');

    try { d.render(view.firstChild, e.params); }
    catch (err) { view.firstChild.innerHTML = UI.empty({ icon: 'info', title: t('err_t'), body: t('err_b') }); setTimeout(() => { throw err; }, 0); }
    view.scrollTop = reset ? (popped ? (e.scroll || 0) : 0) : keep;

  },
  buildNav() {
    $('#nav-in').innerHTML = APP.tabs.map(tb => '<button class="nav-btn" role="tab" data-act="tab" data-arg="' + tb.id + '"><span class="pill">' + icon(tb.icon) + '</span><span>' + esc(t(tb.label)) + '</span></button>').join('');
  },
  empty(o) {
    return '<div class="empty">' + (o.art ? '<div class="ea">' + o.art + '</div>' : (o.icon ? '<div class="ea" style="display:grid;place-items:center;color:var(--accent)">' + icon(o.icon, 64) + '</div>' : '')) +
      '<h3>' + esc(o.title) + '</h3>' + (o.body ? '<p>' + esc(o.body) + '</p>' : '') +
      (o.cta ? '<button class="btn btn-primary" data-act="' + o.act + '"' + (o.arg ? ' data-arg="' + esc(o.arg) + '"' : '') + '>' + icon('plus', 20) + esc(o.cta) + '</button>' : '') + '</div>';
  },
  // Bottom sheet. o: {title, body (html), foot (html), full, cls, onClose}. Returns the sheet element.

      '<div class="grab"></div><div class="sheet-head"><h2>' + esc(o.title || '') + '</h2><button class="icon-btn" data-act="close-layer" aria-label="' + esc(t('close')) + '">' + icon('close') + '</button></div>' +
      '<div class="sheet-body">' + (o.body || '') + '</div>' + (o.foot ? '<div class="sheet-foot">' + o.foot + '</div>' : '') + '</div>';

  // Promise<boolean>. o: {title, body, ok, cancel, danger}
  confirm(o) {

ACT.go = el => UI.go(el.dataset.arg);

// ── Monetization ─────────────────────────────────────────────────────
// Catalog == metadata/iaps.json == MainActivity.VALID_PRODUCTS. Both are
// non-consumable; Pro includes ad-free. No subscriptions in the utility shell.
const PRICES = Object.assign({}, APP.prices);
function isPro() { return S.pro === true; }
function adsRemoved() { return S.removeAds === true || isPro(); }
function grant(id) {
  const was = { ads: S.removeAds, pro: S.pro };
  switch (id) {
    case 'remove_ads': S.removeAds = true; break;
    case 'pro_lifetime': S.pro = true; S.removeAds = true; break;
    default: return false;
  }
  persist(); Ads.banner(); applyTheme();
  if (was.ads !== S.removeAds || was.pro !== S.pro) {
    UI.toast(t('thanks')); haptic('success');
    if (UI.layers.length && $('.layer:last-child .pro-hero')) UI.closeLayer(true);
    if (TOOL.onGrant) TOOL.onGrant(id);
    UI.refresh();
  }
  return true;
}
function iapDeferGrant(id) {
  try { const p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); p[id] = NOW(); localStorage.setItem('pendingGrants', JSON.stringify(p)); } catch (e) {}
}
window.iapDeferGrant = iapDeferGrant;
// Java billing bridge → here for every PURCHASED (and every restored) SKU. Never throws.
window.onPurchaseSuccess = function (id) {
  try { if (!grant(String(id))) iapDeferGrant(String(id)); }
  catch (e) { try { console.warn('IAP grant error', id, e); } catch (x) {} iapDeferGrant(String(id)); }
};
window.onPurchaseComplete = window.onPurchaseSuccess;
// Unknown SKUs bought before their mechanic existed are replayed once it does.
window.replayPendingGrants = function () {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch (e) { return; }
  const ids = Object.keys(p); if (!ids.length) return;
  const left = {};
  ids.forEach(id => { let ok = false; try { ok = grant(id); } catch (e) {} if (!ok) left[id] = p[id]; });
  try { if (Object.keys(left).length) localStorage.setItem('pendingGrants', JSON.stringify(left)); else localStorage.removeItem('pendingGrants'); } catch (e) {}
};
let restoreAsked = false;
window.onRestoreComplete = function (n) { if (restoreAsked) { restoreAsked = false; UI.toast((n | 0) > 0 ? t('restored') : t('nothing_restore')); } };
window.onLocalizedPrices = function (map) { try { Object.assign(PRICES, map || {}); if ($('.pro-hero')) Pro.fill(); } catch (e) {} };

}

ACT.buy = el => buy(el.dataset.arg);

// Ads: banner always (unless ad-free); interstitial ONLY at natural breaks,
// never in the first session, >= 3 min apart, >= 2 breaks between ads,
// never for Remove-Ads / Pro owners. Rewarded = opt-in only.
const Ads = {
  pending: null,
  banner() { callA(adsRemoved() ? 'hideBannerAd' : 'showBannerAd'); },
  naturalBreak(reason) {
    if (!APP.interstitials || adsRemoved() || !bridge()) return false;
    if (S.sessions < 2) return false;                         // never in the first session
    S.ads.breaks = (S.ads.breaks | 0) + 1;
    const sinceInterstitialMs = NOW() - (S.ads.last || 0);
    if (S.ads.breaks >= 2 && sinceInterstitialMs >= 180000) {  // >=2 breaks AND >=3 min since the last one
      S.ads.breaks = 0; S.ads.last = NOW(); persist();
      callA('showInterstitial');
      return true;
    }
    persist();
    return false;
  },
  // Opt-in rewarded video. type must be in MainActivity.VALID_REWARD_TYPES.
  rewarded(type, onReward) {
    if (!bridge()) { UI.toast(t('ad_not_ready')); return; }
    this.pending = { type: type, cb: onReward };
    callA('showRewarded', type);
  },
  preload() { callA('preloadRewarded'); },
};
// The reward is granted ONLY here (never on dismiss), once, to the caller that asked.
window.onAdReward = function(type) {
  const p = Ads.pending; Ads.pending = null;
  if (p && p.type === type && p.cb) { try { p.cb(); } catch (e) {} }
};
window.onAdNotReady = function () { if (Ads.pending) { Ads.pending = null; UI.toast(t('ad_not_ready')); } };

// ── Reminders (Java NotificationHelper; slot 0 = app-wide daily) ─────
// Permission is asked IN CONTEXT only — after the user switches a reminder on.
const Reminders = {
  _res: null,
  ensurePermission() {
    return new Promise(res => {
      if (!bridge()) return res(true);
      if (callA('hasNotificationPermission') === true) return res(true);
      this._res = res; callA('requestNotificationPermission');
    });
  },
  set(slot, h, m, daysMask, title, body) {
    const A = bridge();
    if (A && typeof A.scheduleReminder === 'function') callA('scheduleReminder', slot, h, m, daysMask & 127, title, body);
    else if (slot === 0) callA('scheduleDailyReminder', h, m);
  },
  cancel(slot) { callA('cancelReminder', slot); },
  // Turn one on: permission first; false (and a settings hint) when refused.
  async enable(slot, h, m, daysMask, title, body) {
    const ok = await this.ensurePermission();
    if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return false; }
    this.set(slot, h, m, daysMask, title, body); return true;
  },
  syncDaily() {
    if (!APP.reminder) return;
    const d = S.settings.daily;
    if (d.on) this.set(0, d.h, d.m, 127, APP.name, t(APP.reminder.body)); else this.cancel(0);
  },
};
window.onNotificationPermissionResult = function (g) { const r = Reminders._res; Reminders._res = null; if (r) r(!!g); };

// ── Data: local-only; export = JSON text via the share sheet / clipboard ──
const Data = {
  payload() {
    return JSON.stringify({ app: APP.pkg, kind: 'backup', v: SAVE_VERSION, at: new Date(NOW()).toISOString(), settings: S.settings, tool: S.tool });
  },
  share(text, subject) { if (bridge()) callA('shareText', text); else this.copy(text); },
  copy(text) {

  },
  async paste() {

  parse(text) {

const Onboarding = {
  i: 0,
  show(replay) {
    if (!APP.onboarding.length) return;
    this.i = 0;
    const L = document.createElement('div');
    L.className = 'onb'; L.id = 'onb'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true');
    L.innerHTML = '<div class="onb-top"><button class="btn btn-ghost" data-act="onb-done">' + esc(t('skip')) + '</button></div>' +
      '<div class="onb-track">' + APP.onboarding.map((c, i) => '<section class="onb-card" aria-hidden="' + (i ? 'true' : 'false') + '"><div class="onb-art">' + (ART[c.art] || '') + '</div><h2>' + esc(t(c.title)) + '</h2><p>' + esc(t(c.body)) + '</p></section>').join('') + '</div>' +
      '<div class="onb-foot"><div class="dots">' + APP.onboarding.map((c, i) => '<i class="' + (i ? '' : 'on') + '"></i>').join('') + '</div><button class="btn btn-primary" id="onb-next" data-act="onb-next">' + esc(t('next')) + '</button></div>';
    document.body.appendChild(L);
    let x0 = null;
    const tr = L.querySelector('.onb-track');
    tr.addEventListener('pointerdown', e => { x0 = e.clientX; });
    tr.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { const fwd = (dx < 0) !== (document.documentElement.dir === 'rtl'); this.step(fwd ? 1 : -1); } });
    this.paint();
  },
  step(d) { const n = APP.onboarding.length; const j = this.i + d; if (j >= n) { this.done(); return; } this.i = clamp(j, 0, n - 1); this.paint(); },
  paint() {
    const L = $('#onb'); if (!L) return;
    const rtl = document.documentElement.dir === 'rtl', n = APP.onboarding.length;
    $$('.onb-card', L).forEach((c, k) => { c.style.transform = 'translateX(' + ((rtl ? 100 : -100) * this.i) + '%)'; c.setAttribute('aria-hidden', k === this.i ? 'false' : 'true'); });
    $$('.dots i', L).forEach((d, k) => d.classList.toggle('on', k === this.i));
    $('#onb-next').textContent = this.i === n - 1 ? t('get_started') : t('next');
  },
  done() {
    const L = $('#onb'); if (L) L.remove();
    if (!S.onboarded) { S.onboarded = true; persist(); if (TOOL.afterOnboarding) TOOL.afterOnboarding(); }
  },
};
ACT['onb-next'] = () => Onboarding.step(1);

const FREE_PEOPLE = 3, MAX_CUSTOM = 12;

function nowD() { const n = today(); return AM.D(n.getFullYear(), n.getMonth() + 1, n.getDate()); }
function jd(o) { return new Date(o.y, o.m - 1, o.d, 12); }
function fmtD(o, opt) { return fmtDate(jd(o), opt || { year: 'numeric', month: 'long', day: 'numeric' }); }

function unitTxt(n, key) { return t('numu', { n: n, u: t(key, { n: n }) }); }
function ymdTxt(df) { return [[df.years, 'yr'], [df.months, 'mo'], [df.days, 'dy']].map(p => unitTxt(p[0], p[1])).join(t('sep')); }
function inTxt(n) { return n === 0 ? t('nb_today_short') : t('nb_in', { n: n }); }
function zname(key, i) { return String(t(key)).split('|')[i] || ''; }
function signRange(i) {
  const p = AM.CUSPS.findIndex(c => c[1] === i), a = AM.CUSPS[p], b = AM.CUSPS[(p + 1) % 12];
  const s = AM.D(2024, Math.floor(a[0] / 100), a[0] % 100), e = AM.addDays(AM.D(2024, Math.floor(b[0] / 100), b[0] % 100), -1);
  const f = { month: 'short', day: 'numeric' };
  return fmtD(s, f) + ' – ' + fmtD(e, f);
}
function holderOf(id) { return id === 'quick' ? S.tool.quick : S.tool.people.find(p => p.id === id); }

function nbSafe(B, R) { // next birthday that is still to come; a baby born "today" gets next year's

  if (n && n.today && n.turning === 0) { n = AM.nextBirthday(B, AM.addDays(R, 1)); if (n) n.days += 1; }
  return n;
}
function msList(h, B, R) { // every milestone of one person with days from R (negative = passed)
  const items = [], std = AM.milestones(B);
  std.forEach(m => {
    const title = m.kind === 'd' ? unitTxt(m.n, 'dy') : m.kind === 'w' ? unitTxt(m.n, 'wk') : unitTxt(m.n, 'sec');
    items.push({ id: m.id, title: title, date: m.date, custom: false });
  });
  const hb = AM.nextHalf(B, R);
  if (hb) items.push({ id: 'half', title: t('ms_half', { age: fmtNum(hb.age) }), date: hb.date, custom: false });

    const d = AM.custom(B, c.n, c.u);

  if (msg) h += '<div class="msg err" role="alert">' + esc(msg) + '</div>';
  if (!A || !Bz || msg) { if (!msg) h += UI.empty({ art: ART.ob2, title: t('diff_empty_t'), body: t('diff_empty_b') }); el.innerHTML = h; return; }
  const swapped = AM.cmp(A, Bz) > 0, a = swapped ? Bz : A, b = swapped ? A : Bz, df = AM.diff(a, b);
  const wks = Math.floor(df.totalDays / 7), wrem = df.totalDays - wks * 7;
  if (swapped) h += '<div class="msg">' + esc(t('diff_swapped')) + '</div>';
  h += '<section class="hero" aria-live="polite"><div class="hl">' + esc(df.totalDays === 0 ? t('diff_same') : t('diff_between')) + '</div><div class="big">' +
    [[df.years, 'yr'], [df.months, 'mo'], [df.days, 'dy']].map(p => '<div class="bt"><b>' + esc(fmtNum(p[0])) + '</b><span>' + esc(t(p[1], { n: p[0] })) + '</span></div>').join('') + '</div>' +
    '<p class="sub">' + esc(fmtD(a, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }) + ' → ' + fmtD(b, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })) + '</p></section>' +
    '<div class="tiles"><div class="tile"><b>' + esc(fmtNum(df.totalDays)) + '</b><span>' + esc(t('tot_days')) + '</span></div>' +
    '<div class="tile"><b>' + esc(fmtNum(wks)) + '</b><span>' + esc(t('tot_weeks')) + '</span><small>+ ' + esc(unitTxt(wrem, 'dy')) + '</small></div>' +
    '<div class="tile"><b>' + esc(fmtNum(df.totalMonths)) + '</b><span>' + esc(t('tot_months')) + '</span></div>' +
    '<div class="tile"><b>' + esc(fmtNum(AM.weekdaysBetween(a, b))) + '</b><span>' + esc(t('diff_weekdays')) + '</span></div></div>' +
    '<p class="fine">' + esc(t('diff_note')) + '</p>' +
    '<div class="act"><button class="btn btn-secondary" data-act="d-share">' + icon('share', 20) + esc(t('share_card')) + '</button></div>';
  el.innerHTML = h;
}
CHANGE['d-from'] = el => { S.tool.diff.from = String(el.value || ''); persist(); UI.refresh(); };
CHANGE['d-to'] = el => { const v = String(el.value || ''); S.tool.diff.to = v === AM.iso(nowD()) ? '' : v; persist(); UI.refresh(); };
ACT['d-today'] = () => { S.tool.diff.to = ''; persist(); UI.refresh(); };
ACT['d-swap'] = () => { const d = S.tool.diff, nf = d.to || AM.iso(nowD()); d.to = d.from; d.from = nf; if (d.to === AM.iso(nowD())) d.to = ''; persist(); haptic('tap'); UI.refresh(); };
ACT['d-share'] = () => {
  const d = S.tool.diff, A = AM.parse(d.from), Bz = d.to ? AM.parse(d.to) : nowD(); if (!A || !Bz) return;
  const sw = AM.cmp(A, Bz) > 0, a = sw ? Bz : A, b = sw ? A : Bz, df = AM.diff(a, b);
  Data.share(t('diff_share', { from: fmtD(a), to: fmtD(b), age: ymdTxt(df), days: fmtNum(df.totalDays) }) + '\n— ' + APP.name);
};

// ---- people ----
function peopleSorted() {
  const N = nowD();
  return S.tool.people.map(p => { const B = AM.parse(p.birth); return { p: p, B: B, nb: B ? nbSafe(B, N) : null }; }).filter(x => x.B)
    .sort((x, y) => (x.nb ? x.nb.days : 9e9) - (y.nb ? y.nb.days : 9e9) || x.p.name.localeCompare(y.p.name));
}
function peopleScreen(el) {
  const list = peopleSorted(), N = nowD(), pro = isPro();
  if (!list.length) { el.innerHTML = UI.empty({ art: ART.ob3, title: t('people_empty_t'), body: t('people_empty_b'), cta: t('add_person'), act: 'new-person' }); return; }
  let h = pro ? '' : '<div class="pbar">' + icon('gem', 22) + '<span>' + esc(t('free_limit', { n: list.length, max: FREE_PEOPLE })) + '</span><button class="btn btn-primary" data-act="go-pro" data-arg="limit_t">' + esc(t('go_pro')) + '</button></div>';
  h += '<div class="group">' + list.map(x => {
    const df = AM.cmp(x.B, N) <= 0 ? AM.diff(x.B, N) : null, nb = x.nb;
    return '<button class="row prow" data-act="open-person" data-arg="' + x.p.id + '"><span class="av" aria-hidden="true">' + esc(Array.from(x.p.name)[0] || '?').toUpperCase() + '</span><span class="rt"><span class="rl">' + esc(x.p.name) + '</span><span class="rs">' +
      esc(df ? unitTxt(df.years, 'yr') + ' · ' + fmtD(x.B, { month: 'short', day: 'numeric' }) : t('err_future')) + '</span></span>' +
      (nb ? '<span class="bd' + (nb.days <= 7 ? ' hot' : '') + '">' + esc(nb.today ? t('nb_today_short') : t('nb_in', { n: nb.days })) + '</span>' : '') + icon('chev', 18, 'chev flip') + '</button>';
  }).join('') + '</div>';
  const w = S.tool.wk;
  h += '<div class="sec-h"><span>' + esc(t('wk_t')) + '</span></div><div class="group wkc"><div class="row row-x"><span class="rt"><span class="rl">' + esc(t('wk_check')) + '</span><span class="rs">' + esc(t('wk_sub')) + '</span></span>' + sSwitch(w.on, 'wk-on', t('wk_check')) + '</div>' +
    (w.on ? '<div class="sub"><select class="inp" data-change="wk-dow" aria-label="' + esc(t('wk_day')) + '">' + [0, 1, 2, 3, 4, 5, 6].map(i => '<option value="' + i + '"' + (i === w.dow ? ' selected' : '') + '>' + esc(weekdayName(i, 'long')) + '</option>').join('') + '</select>' +
      '<input class="inp" type="time" data-change="wk-time" aria-label="' + esc(t('s_time')) + '" value="' + String(w.h).padStart(2, '0') + ':' + String(w.m).padStart(2, '0') + '"></div>' : '') + '</div>';
  el.innerHTML = h;
}
function weeklySync() {
  const w = S.tool.wk;
  if (w.on && S.tool.people.length) Reminders.set(1, w.h, w.m, 1 << w.dow, APP.name, t('rem_body')); else Reminders.cancel(1);
}
ACT['wk-on'] = async () => {
  const w = S.tool.wk;
  if (w.on) { w.on = false; persist(); weeklySync(); UI.refresh(); return; }
  const ok = await Reminders.ensurePermission();
  if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return; }
  w.on = true; persist(); weeklySync(); UI.refresh(); UI.toast(t('rem_set', { time: weekdayName(w.dow, 'long') + ' ' + fmtTime(w.h, w.m) }));
};
CHANGE['wk-dow'] = el => { S.tool.wk.dow = clamp(+el.value | 0, 0, 6); persist(); weeklySync(); };
CHANGE['wk-time'] = el => { const p = String(el.value || '').split(':'); if (p.length < 2) return; S.tool.wk.h = clamp(+p[0] | 0, 0, 23); S.tool.wk.m = clamp(+p[1] | 0, 0, 59); persist(); weeklySync(); };
ACT['open-person'] = el => { UI.go('person', { id: el.dataset.arg }); };
ACT['new-person'] = () => openEditor(null, null);
ACT['save-person'] = () => openEditor(null, { birth: AM.parse(S.tool.quick.birth) ? S.tool.quick.birth : '' });
function openEditor(id, preset) {
  if (!id && S.tool.people.length >= FREE_PEOPLE && !isPro()) { Pro.open('limit_t'); return; }
  const p = id ? holderOf(id) : null;
  ED = p ? { id: p.id, name: p.name, birth: p.birth } : Object.assign({ id: null, name: '', birth: '' }, preset || {});
  UI.sheet({ title: t(p ? 'edit_person' : 'new_person'), full: true, body: '<div id="ed-body"></div>', foot: '<button class="btn btn-primary" data-act="ed-save">' + esc(t('save')) + '</button>' });
  paintEditor(!p);
}
function paintEditor(focus) {
  const el = $('#ed-body'); if (!el || !ED) return;
  el.innerHTML = '<label class="field"><span class="fl">' + esc(t('f_name')) + '</span><input class="inp" id="ed-name" maxlength="40" data-input="ed-name" value="' + esc(ED.name) + '" placeholder="' + esc(t('f_name_ph')) + '" enterkeyhint="done" autocomplete="off"></label>' +
    '<label class="field"><span class="fl">' + esc(t('birth_date')) + '</span><input class="inp" id="ed-birth" type="date" min="1583-01-01" max="9999-12-31" data-change="ed-birth" value="' + esc(AM.parse(ED.birth) ? ED.birth : '') + '"></label>' +
    (ED.id ? '<div class="btn-row" style="margin-top:6px"><button class="btn btn-danger" data-act="ed-delete">' + icon('trash', 20) + esc(t('delete')) + '</button></div>' : '');
  if (focus) setTimeout(() => { const i = $('#ed-name'); if (i) try { i.focus(); } catch (e) {} }, 320);
}
INPUT['ed-name'] = el => { ED.name = el.value; };
CHANGE['ed-birth'] = el => { ED.birth = String(el.value || ''); };
ACT['ed-save'] = () => {
  const name = String(ED.name || '').trim().slice(0, 40), B = AM.parse(ED.birth);
  if (!name) { UI.toast(t('name_needed')); haptic('reject'); const i = $('#ed-name'); if (i) i.focus(); return; }
  if (!B) { UI.toast(t('date_needed')); haptic('reject'); return; }
  if (AM.cmp(B, nowD()) > 0) { UI.toast(t('err_future')); haptic('reject'); return; }
  let p;
  if (ED.id) { p = holderOf(ED.id); if (!p) return; p.name = name; p.birth = AM.iso(B); }
  else {
    if (S.tool.people.length >= FREE_PEOPLE && !isPro()) { Pro.open('limit_t'); return; }
    p = { id: uid('p'), name: name, birth: AM.iso(B), custom: [] }; S.tool.people.push(p);
  }
  const isNew = !ED.id; ED = null; persist(); weeklySync(); UI.closeLayer(true); UI.refresh(); haptic('success');
  if (isNew) { UI.toast(t('person_saved', { name: p.name })); Ads.naturalBreak('person_saved'); }
};
ACT['ed-delete'] = async () => {
  const p = ED && holderOf(ED.id); if (!p) return;
  const ok = await UI.confirm({ title: t('del_t'), body: t('del_b'), ok: t('delete'), danger: true }); if (!ok) return;
  const i = S.tool.people.indexOf(p); S.tool.people.splice(i, 1); ED = null; persist(); weeklySync();
  UI.closeLayer(true); haptic('reject');
  if (UI.cur() && UI.cur().id === 'person') UI.back(); else UI.refresh();
  UI.toast(t('person_deleted', { name: p.name }), { action: t('undo'), onAction: () => { S.tool.people.splice(Math.min(i, S.tool.people.length), 0, p); persist(); weeklySync(); UI.refresh(); } });
};

function personScreenRender(el, pr) {
  const p = holderOf(pr.id), B = p && AM.parse(p.birth);
  if (!p || !B) { el.innerHTML = UI.empty({ icon: 'user', title: t('err_t'), body: t('err_b') }); return; }
  TD.holder = p.id; TD.pid = p.id;
  const R = nowD();
  el.innerHTML = AM.cmp(B, R) > 0 ? '<div class="msg err" role="alert">' + esc(t('err_future')) + '</div>' : resultHtml(p.id, p, B, R, p.name);
}

// ===== TOOL contract =====
const TOOL = {
  defaults: () => ({ quick: { birth: '', asOf: '', custom: [] }, diff: { from: '', to: '' }, people: [], wk: { on: false, dow: 0, h: 18, m: 0 } }),
  migrate(tool, from) {
    const d = TOOL.defaults(), o = Object.assign(d, tool && typeof tool === 'object' ? tool : {});
    const dateStr = v => (typeof v === 'string' && AM.parse(v) ? v : '');
    const cust = a => (Array.isArray(a) ? a : []).filter(c => c && Number.isInteger(c.n) && c.n >= 1 && c.n <= 99999 && 'dwmy'.indexOf(c.u) >= 0 && String(c.u).length === 1)
      .slice(0, MAX_CUSTOM).map(c => ({ id: String(c.id || uid('c')), n: c.n, u: c.u }));
    const q = o.quick && typeof o.quick === 'object' ? o.quick : {};
    o.quick = { birth: dateStr(q.birth), asOf: dateStr(q.asOf), custom: cust(q.custom) };
    const f = o.diff && typeof o.diff === 'object' ? o.diff : {};
    o.diff = { from: dateStr(f.from), to: dateStr(f.to) };
    o.people = (Array.isArray(o.people) ? o.people : []).filter(p => p && p.id && typeof p.name === 'string' && dateStr(p.birth))
      .map(p => ({ id: String(p.id), name: String(p.name).slice(0, 40), birth: p.birth, custom: cust(p.custom) }));
    const w = o.wk && typeof o.wk === 'object' ? o.wk : {};
    o.wk = { on: !!w.on, dow: clamp(w.dow | 0, 0, 6), h: clamp(w.h | 0, 0, 23), m: clamp(w.m | 0, 0, 59) };
    return o;
  },
  validateImport: tool => !!(tool && Array.isArray(tool.people) && tool.people.every(p => p && p.id && typeof p.name === 'string' && AM.parse(p.birth))),
  syncReminders() { weeklySync(); },
  onBoot() { TD.showPast = false; },
  onNewDay() {},
  onGrant() {},
  afterOnboarding() { UI.refresh(); },
  screens: {
    age: {
      title: () => t('tab_age'),
      subtitle: () => fmtDate(today(), { weekday: 'long', day: 'numeric', month: 'long' }),
      render: el => ageScreen(el),
    },
    diff: {
      title: () => t('diff_t'),
      render: el => diffScreen(el),
    },
    people: {
      title: () => t('tab_people'),
      actions: () => [{ icon: 'plus', label: t('add_person'), act: 'new-person', tint: true }],
      render: el => peopleScreen(el),
    },
    person: {
      title: p => { const x = holderOf(p.id); return x ? x.name : t('tab_people'); },
      actions: p => [{ icon: 'edit', label: t('edit_person'), act: 'edit-person', arg: p.id }],
      render: (el, p) => personScreenRender(el, p),
      onLeave: () => Ads.naturalBreak('person_closed'),
    },
  },
};
ACT['edit-person'] = el => openEditor(el.dataset.arg, null);
//@@END TOOL_CORE
// ── Boot ─────────────────────────────────────────────────────────────
(function boot() {
  mergeI18n();
  loadSave();
  touchSession();
  lastDayKey = todayKey();
  applyLang(); applyTheme(); applyFontScale();
  checkTrial();
  UI.buildNav();
  if (TOOL.onBoot) TOOL.onBoot();
  UI.tab(APP.tabs[0].id);
  persist();
  window.replayPendingGrants();
  Ads.banner();
  Reminders.syncDaily();
  if (TOOL.syncReminders) TOOL.syncReminders();
  if (!S.onboarded) Onboarding.show();
})();
</script>

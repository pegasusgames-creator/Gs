<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Age Calculator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  body{background:#0a0d18;color:#c8d0ff;font-family:'Arial',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
  h1{font-size:1.4rem;margin:10px 0 4px;color:#8090ff;letter-spacing:2px}
  #subtitle{font-size:0.78rem;color:#8090ff55;margin-bottom:16px}
  .card{background:#ffffff0a;border:1px solid #4060ff33;border-radius:16px;padding:16px 20px;width:310px;margin-bottom:12px}
  .field-label{font-size:0.78rem;color:#8090ff88;letter-spacing:1px;margin-bottom:6px}
  .field-input{background:#ffffff10;border:1px solid #4060ff44;color:#c8d0ff;border-radius:10px;padding:10px 14px;font-size:1rem;outline:none;width:100%;-webkit-appearance:none}
  .calc-btn{background:linear-gradient(135deg,#2030a0,#4060ff);color:#c8d0ff;border:none;border-radius:50px;padding:13px;font-size:1rem;font-weight:bold;cursor:pointer;width:100%;margin-top:4px;transition:transform 0.1s}
  .calc-btn:active{transform:scale(0.97)}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .res-box{background:#4060ff15;border:1px solid #4060ff33;border-radius:10px;padding:12px;text-align:center}
  .res-num{font-size:1.8rem;font-weight:bold;color:#8090ff;display:block}
  .res-lbl{font-size:0.72rem;color:#8090ff77;margin-top:2px}
  .res-box.wide{grid-column:1/3}
  #next-birthday{font-size:0.85rem;color:#8090ffaa;text-align:center;margin-top:8px;min-height:1.2rem}
  #remove-ads{position:fixed;top:8px;right:8px;background:#ffffff10;border:1px solid #4060ff33;color:#8090ff55;font-size:0.65rem;padding:4px 8px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<button id="remove-ads" onclick="Android.purchase('remove_ads')">Remove Ads</button>
<h1>🎂 Age Calculator</h1>
<p id="subtitle">Find out your exact age</p>
<div class="card">
  <div class="field-label">DATE OF BIRTH</div>
  <input class="field-input" type="date" id="dob" oninput="calculate()">
  <div class="field-label" style="margin-top:12px">AS OF DATE (optional)</div>
  <input class="field-input" type="date" id="asof" oninput="calculate()">
  <button class="calc-btn" onclick="calculate()">CALCULATE AGE</button>
</div>
<div class="card" id="result-card" style="display:none">
  <div class="result-grid">
    <div class="res-box"><span class="res-num" id="r-years">0</span><div class="res-lbl">Years</div></div>
    <div class="res-box"><span class="res-num" id="r-months">0</span><div class="res-lbl">Months</div></div>
    <div class="res-box"><span class="res-num" id="r-days">0</span><div class="res-lbl">Days</div></div>
    <div class="res-box"><span class="res-num" id="r-weeks">0</span><div class="res-lbl">Weeks</div></div>
    <div class="res-box wide"><span class="res-num" id="r-total-days">0</span><div class="res-lbl">Total Days Lived</div></div>
  </div>
  <div id="next-birthday"></div>
</div>

<script>
function calculate(){
  const dobVal=document.getElementById('dob').value;
  if(!dobVal)return;
  const dob=new Date(dobVal);
  const asofVal=document.getElementById('asof').value;
  const asof=asofVal?new Date(asofVal):new Date();
  if(dob>asof)return;

  let years=asof.getFullYear()-dob.getFullYear();
  let months=asof.getMonth()-dob.getMonth();
  let days=asof.getDate()-dob.getDate();

  if(days<0){
    months--;
    const prevMonth=new Date(asof.getFullYear(),asof.getMonth(),0);
    days+=prevMonth.getDate();
  }
  if(months<0){years--;months+=12;}

  const totalMs=asof-dob;
  const totalDays=Math.floor(totalMs/86400000);
  const totalWeeks=Math.floor(totalDays/7);

  document.getElementById('r-years').textContent=years;
  document.getElementById('r-months').textContent=months;
  document.getElementById('r-days').textContent=days;
  document.getElementById('r-weeks').textContent=totalWeeks.toLocaleString();
  document.getElementById('r-total-days').textContent=totalDays.toLocaleString();

  const nextBday=new Date(asof.getFullYear(),dob.getMonth(),dob.getDate());
  if(nextBday<=asof)nextBday.setFullYear(nextBday.getFullYear()+1);
  const daysLeft=Math.ceil((nextBday-asof)/86400000);
  document.getElementById('next-birthday').textContent=daysLeft===0?'🎉 Happy Birthday!':'🎂 Next birthday in '+daysLeft+' days';

  document.getElementById('result-card').style.display='';
}

// Set today as default asof
document.getElementById('asof').value=new Date().toISOString().split('T')[0];

window.onPurchaseComplete=function(id){if(id==='remove_ads'){document.getElementById('remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
</script>
</body>
</html>

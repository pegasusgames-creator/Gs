// -------------------------------------------------------
// app/build.gradle
// -------------------------------------------------------
plugins {
    id 'com.android.application'
}

// Load signing credentials from keystore.properties (never commit that file)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36

    namespace "com.pegasusgames.thisorthat"

    defaultConfig {
        applicationId "com.pegasusgames.thisorthat"
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName "1.5.1"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Google Mobile Ads (AdMob) + UMP consent
    implementation 'com.google.android.gms:play-services-ads:25.3.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    // Google Play Billing
    implementation 'com.android.billingclient:billing:8.0.0'

    // Firebase Analytics — requires google-services.json in this folder
    // Setup: Firebase Console → Add Android app → download google-services.json → place in app/
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'

    // Core Android
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

// Must be at bottom — apply after dependencies declared
// Firebase is optional: drop app/google-services.json in to enable analytics.
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Currency Converter</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#00BCD4; --accent2:#00838F; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.currency-row { display:flex; gap:10px; align-items:flex-end; margin-bottom:10px; }
.currency-block { flex:1; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
input[type=number] { width:100%; background:var(--card); border:none; color:var(--text); font-size:1.1rem; padding:10px 12px; border-radius:8px; outline:none; }
input[type=number]:focus { box-shadow:0 0 0 2px var(--accent); }
select { width:100%; background:var(--card); border:none; color:var(--text); font-size:0.95rem; padding:10px 12px; border-radius:8px; outline:none; margin-top:6px; }
#btn-swap { min-width:44px; min-height:44px; background:var(--card); border:none; color:var(--accent); font-size:1.4rem; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#btn-swap.btn-pressed { opacity:0.7; }
.result-box { background:var(--card); border-radius:10px; padding:16px; text-align:center; margin-top:10px; }
.result-label { font-size:0.75rem; color:var(--muted); margin-bottom:6px; }
.result-value { font-size:2rem; font-weight:700; color:var(--accent); }
.result-rate { font-size:0.8rem; color:var(--muted); margin-top:6px; }
.disclaimer { font-size:0.72rem; color:var(--muted); text-align:center; padding:8px; }
.rates-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.rate-item { background:var(--card); border-radius:8px; padding:8px 10px; font-size:0.82rem; }
.rate-code { color:var(--accent); font-weight:700; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Currency <span>Converter</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Convert</div>
      <div class="currency-row">
        <div class="currency-block">
          <label>Amount</label>
          <input type="number" id="amount-from" value="1" min="0" step="any">
          <select id="from-cur"></select>
        </div>
        <button id="btn-swap">⇄</button>
        <div class="currency-block">
          <label>Amount</label>
          <input type="number" id="amount-to" value="" min="0" step="any">
          <select id="to-cur"></select>
        </div>
      </div>
      <div class="result-box">
        <div class="result-label">Result</div>
        <div class="result-value" id="result-display">—</div>
        <div class="result-rate" id="rate-display"></div>
      </div>
      <div class="disclaimer">⚠ Rates are hardcoded approximations, not live data.</div>
    </div>
    <div class="card">
      <div class="card-title">All Rates vs USD</div>
      <div class="rates-list" id="rates-list"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, lastChanged:'from' };

var RATES = {
  'USD':{ name:'US Dollar', rate:1 },
  'EUR':{ name:'Euro', rate:0.92 },
  'GBP':{ name:'British Pound', rate:0.79 },
  'JPY':{ name:'Japanese Yen', rate:149.5 },
  'CAD':{ name:'Canadian Dollar', rate:1.36 },
  'AUD':{ name:'Australian Dollar', rate:1.53 },
  'CHF':{ name:'Swiss Franc', rate:0.90 },
  'CNY':{ name:'Chinese Yuan', rate:7.24 },
  'INR':{ name:'Indian Rupee', rate:83.1 },
  'MXN':{ name:'Mexican Peso', rate:17.15 },
  'BRL':{ name:'Brazilian Real', rate:4.97 },
  'KRW':{ name:'South Korean Won', rate:1325.0 },
  'SGD':{ name:'Singapore Dollar', rate:1.34 },
  'HKD':{ name:'Hong Kong Dollar', rate:7.82 },
  'NOK':{ name:'Norwegian Krone', rate:10.55 },
  'SEK':{ name:'Swedish Krona', rate:10.42 },
  'DKK':{ name:'Danish Krone', rate:6.88 },
  'NZD':{ name:'New Zealand Dollar', rate:1.63 },
  'ZAR':{ name:'South African Rand', rate:18.63 },
  'AED':{ name:'UAE Dirham', rate:3.67 }
};

var codes = Object.keys(RATES);

function buildSelects(){
  [document.getElementById('from-cur'), document.getElementById('to-cur')].forEach(function(sel, i){
    codes.forEach(function(c){
      var opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c + ' – ' + RATES[c].name;
      sel.appendChild(opt);
    });
    sel.value = i===0 ? 'USD' : 'EUR';
  });
}

function convert(){
  var fromCode = document.getElementById('from-cur').value;
  var toCode = document.getElementById('to-cur').value;
  var fromRate = RATES[fromCode].rate;
  var toRate = RATES[toCode].rate;
  var amtFrom = parseFloat(document.getElementById('amount-from').value)||0;
  var amtTo = parseFloat(document.getElementById('amount-to').value)||0;
  if(state.lastChanged === 'from'){
    var result = amtFrom * (toRate / fromRate);
    document.getElementById('amount-to').value = result.toFixed(4);
    document.getElementById('result-display').textContent = result.toFixed(4) + ' ' + toCode;
  } else {
    var result2 = amtTo * (fromRate / toRate);
    document.getElementById('amount-from').value = result2.toFixed(4);
    document.getElementById('result-display').textContent = result2.toFixed(4) + ' ' + fromCode;
  }
  var rate1 = (toRate / fromRate);
  document.getElementById('rate-display').textContent = '1 '+fromCode+' = '+rate1.toFixed(4)+' '+toCode;
  maybeInterstitial();
}

function buildRatesList(){
  var list = document.getElementById('rates-list');
  list.innerHTML = '';
  codes.forEach(function(c){
    var div = document.createElement('div');
    div.className = 'rate-item';
    div.innerHTML = '<span class="rate-code">'+c+'</span> = '+RATES[c].rate.toFixed(c==='JPY'||c==='KRW'?1:4)+' / USD';
    list.appendChild(div);
  });
}

buildSelects();
buildRatesList();

document.getElementById('amount-from').addEventListener('input', function(){ state.lastChanged='from'; convert(); });
document.getElementById('amount-to').addEventListener('input', function(){ state.lastChanged='to'; convert(); });
document.getElementById('from-cur').addEventListener('change', convert);
document.getElementById('to-cur').addEventListener('change', convert);

document.getElementById('btn-swap').addEventListener('click', function(){
  var fromSel = document.getElementById('from-cur');
  var toSel = document.getElementById('to-cur');
  var tmp = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value = tmp;
  state.lastChanged = 'from';
  convert();
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex'; convert();}
init();
</script>
</body>
</html>

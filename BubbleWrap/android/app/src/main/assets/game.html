<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BubbleWrap</title>
<style>
:root {
  --bg: #0a1628;
  --surface: #0f2040;
  --surface2: #162a50;
  --accent: #60b8ff;
  --accent2: #38d9a9;
  --gold: #ffd700;
  --text: #e8f0fe;
  --muted: #5a7a9a;
  --border: rgba(96,184,255,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100vw; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
body { padding-top:env(safe-area-inset-top,0px); }

.screen { position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden; }
.screen.active { display:flex; }

/* header */
.hdr { display:flex; align-items:center; padding:12px 14px 8px; background:var(--surface); border-bottom:1px solid var(--border); gap:10px; flex-shrink:0; }
.hdr h1 { flex:1; font-size:1.1rem; font-weight:800; }
.hdr h1 span { color:var(--accent); }
.icon-btn { background:rgba(255,255,255,0.07); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:7px 12px; font-size:1rem; cursor:pointer; }
.icon-btn:active { transform:scale(0.92); }
.hdr-coins { display:flex; align-items:center; gap:5px; background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.3); border-radius:14px; padding:4px 10px; font-size:0.82rem; font-weight:700; color:var(--gold); }

/* wrap screen */
#wrapScreen { background:var(--bg); }
.wrap-controls { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
.ctrl-pill { padding:6px 14px; border-radius:16px; border:1.5px solid var(--border); background:transparent; color:var(--muted); font-size:0.78rem; font-weight:700; cursor:pointer; }
.ctrl-pill.active { background:var(--accent); border-color:var(--accent); color:#000; }
#pop-counter { font-size:0.85rem; font-weight:700; color:var(--accent); margin-left:auto; white-space:nowrap; }
#grid-scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
#bubble-grid { display:grid; padding:8px; gap:4px; }
.bubble {
  aspect-ratio:1;
  border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;
  position:relative;
  overflow:hidden;
  transition:transform 0.06s;
}
.bubble:active { transform:scale(0.88); }
.bubble.popped { cursor:default; }
.bubble-inner { position:absolute; inset:0; border-radius:50%; transition:all 0.2s; }
/* bottom buttons */
.wrap-footer { display:flex; gap:10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; }
.wrap-btn { flex:1; padding:12px; border-radius:14px; border:none; font-size:0.9rem; font-weight:800; cursor:pointer; }
.wrap-btn.primary { background:linear-gradient(135deg,var(--accent),#3a8fdf); color:#001; }
.wrap-btn.secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.wrap-btn:active { transform:scale(0.96); }

/* stats row */
.stats-strip { display:flex; padding:6px 12px; background:var(--surface); border-bottom:1px solid var(--border); gap:16px; flex-shrink:0; overflow-x:auto; }
.ss-item { text-align:center; min-width:60px; }
.ss-val { font-size:0.9rem; font-weight:800; color:var(--accent); }
.ss-lbl { font-size:0.62rem; color:var(--muted); }

/* complete overlay */
#completeOverlay { position:absolute; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:20; padding:30px; }
#completeOverlay.show { display:flex; }
#completeOverlay h2 { font-size:2rem; font-weight:900; color:var(--accent); text-align:center; }
#completeOverlay .co-stat { font-size:1rem; color:var(--muted); }
.co-btn { padding:14px 40px; border-radius:20px; border:none; font-size:1rem; font-weight:800; cursor:pointer; }
.co-btn.primary { background:linear-gradient(135deg,var(--accent),#3a8fdf); color:#001; }
.co-btn.secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }

/* stats screen */
#statsScreen { background:var(--bg); }
.stats-scroll { flex:1; overflow-y:auto; padding:14px; }
.stat-card { background:var(--surface); border-radius:16px; border:1px solid var(--border); padding:14px; display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.sc-icon { font-size:2rem; min-width:40px; text-align:center; }
.sc-body .sc-val { font-size:1.4rem; font-weight:900; color:var(--accent); }
.sc-body .sc-lbl { font-size:0.78rem; color:var(--muted); margin-top:2px; }

/* shop screen */
#shopScreen { background:var(--bg); }
.shop-scroll { flex:1; overflow-y:auto; padding:14px; }
.theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.theme-card { border-radius:16px; padding:16px 12px; cursor:pointer; border:2.5px solid transparent; text-align:center; transition:transform 0.15s, border-color 0.15s; position:relative; overflow:hidden; }
.theme-card.selected { border-color:var(--gold); }
.theme-card.locked::after { content:'🔒'; position:absolute; top:8px; right:10px; }
.theme-card:active { transform:scale(0.96); }
.tc-preview { display:flex; justify-content:center; gap:5px; margin-bottom:8px; }
.tc-dot { width:22px; height:22px; border-radius:50%; }
.tc-name { font-size:0.88rem; font-weight:700; }
.tc-price { font-size:0.75rem; color:var(--gold); margin-top:4px; }
.shop-divider { font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin:14px 0 8px; }
.iap-card { background:var(--surface); border-radius:16px; border:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.iap-icon { font-size:2rem; min-width:40px; text-align:center; }
.iap-body .iap-title { font-size:0.9rem; font-weight:700; }
.iap-body .iap-desc { font-size:0.75rem; color:var(--muted); margin-top:2px; }
.iap-btn { padding:9px 18px; border-radius:16px; border:none; font-size:0.8rem; font-weight:700; cursor:pointer; }
.iap-btn.gold { background:linear-gradient(135deg,#f59e0b,var(--gold)); color:#001; }
.iap-btn.iap { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
.iap-btn.owned { background:rgba(46,204,113,0.2); color:#2ecc71; border:1px solid rgba(46,204,113,0.4); }

#remove-ads-btn { position:fixed; top:calc(env(safe-area-inset-top,0px)+6px); right:10px; background:rgba(96,184,255,0.1); border:1px solid rgba(96,184,255,0.25); color:rgba(120,180,255,0.6); font-size:0.65rem; padding:4px 9px; border-radius:10px; cursor:pointer; z-index:50; }
#toast { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 22px; border-radius:24px; font-size:0.85rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity 0.25s,transform 0.25s; z-index:200; white-space:nowrap; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.tab-bar { display:flex; background:var(--surface); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0px); flex-shrink:0; }
.tab { flex:1; padding:10px 4px 8px; text-align:center; cursor:pointer; border:none; background:transparent; color:var(--muted); font-size:0.63rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
.tab span { display:block; font-size:1.25rem; margin-bottom:2px; }
.tab.active { color:var(--accent); }
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:rgba(96,184,255,0.25); border-radius:3px; }
</style>
</head>
<body>

<button id="remove-ads-btn" onclick="_purchase('remove_ads')">✨ Remove Ads</button>

<!-- WRAP SCREEN -->
<div id="wrapScreen" class="screen active">
  <div class="hdr">
    <h1>Bubble<span>Wrap</span></h1>
    <div class="hdr-coins">🪙 <span id="coinDisplay">0</span></div>
    <button class="icon-btn" onclick="showScreen('shopScreen')">🎨</button>
  </div>
  <div class="stats-strip">
    <div class="ss-item"><div class="ss-val" id="s-popped">0</div><div class="ss-lbl">Popped</div></div>
    <div class="ss-item"><div class="ss-val" id="s-left">0</div><div class="ss-lbl">Left</div></div>
    <div class="ss-item"><div class="ss-val" id="s-streak">0</div><div class="ss-lbl">Streak</div></div>
    <div class="ss-item"><div class="ss-val" id="s-session">0</div><div class="ss-lbl">Total</div></div>
  </div>
  <div class="wrap-controls">
    <button class="ctrl-pill active" data-size="medium" onclick="setSize('medium',this)">Medium</button>
    <button class="ctrl-pill" data-size="small" onclick="setSize('small',this)">Small</button>
    <button class="ctrl-pill" data-size="large" onclick="setSize('large',this)">Large</button>
    <div id="pop-counter">0 / 0</div>
  </div>
  <div id="grid-scroll">
    <div id="bubble-grid"></div>
  </div>
  <div id="completeOverlay">
    <div style="font-size:3rem">🎉</div>
    <h2>All Popped!</h2>
    <div class="co-stat" id="co-stats"></div>
    <button class="co-btn primary" onclick="refill()">New Sheet</button>
    <button class="co-btn secondary" onclick="document.getElementById('completeOverlay').classList.remove('show')">Keep Sheet</button>
  </div>
  <div class="wrap-footer">
    <button class="wrap-btn secondary" onclick="popAll()">Pop All</button>
    <button class="wrap-btn secondary" onclick="popRow()">Pop Row</button>
    <button class="wrap-btn primary" onclick="refill()">Refill</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('wrapScreen',this)"><span>🫧</span>Wrap</button>
    <button class="tab" onclick="switchTab('statsScreen',this)"><span>📊</span>Stats</button>
  </div>
</div>

<!-- STATS SCREEN -->
<div id="statsScreen" class="screen">
  <div class="hdr">
    <h1>📊 Stats</h1>
    <button class="icon-btn" onclick="resetAllStats()" style="color:#ef4444">↺</button>
  </div>
  <div class="stats-scroll" id="statsContent"></div>
  <div class="tab-bar">
    <button class="tab" onclick="switchTab('wrapScreen',this)"><span>🫧</span>Wrap</button>
    <button class="tab active" onclick="switchTab('statsScreen',this)"><span>📊</span>Stats</button>
  </div>
</div>

<!-- SHOP SCREEN -->
<div id="shopScreen" class="screen">
  <div class="hdr">
    <button class="icon-btn" onclick="showScreen('wrapScreen')">‹</button>
    <h1>🎨 Themes</h1>
    <div class="hdr-coins">🪙 <span id="coinDisplay2">0</span></div>
  </div>
  <div class="shop-scroll">
    <div class="theme-grid" id="themeGrid"></div>
    <div class="shop-divider">Shop</div>
    <div id="iapList"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Audio ──
var _audioCtx = null;
function getAudio() {
  if (!_audioCtx) { try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  return _audioCtx;
}
function playPop(freq) {
  var ctx = getAudio();
  if (!ctx) return;
  try {
    if (ctx.state === 'suspended') ctx.resume();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    freq = freq || (350 + Math.random() * 350);
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.start(); o.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

// ── State ──
var _coins = parseInt(localStorage.getItem('bw_coins') || '0');
var _adsRemoved = localStorage.getItem('bw_adsRemoved') === '1';
var _theme = localStorage.getItem('bw_theme') || 'classic';
var _unlockedThemes = JSON.parse(localStorage.getItem('bw_unlocked') || '["classic","pastel"]');
var _lifetimePops = parseInt(localStorage.getItem('bw_lifetime') || '0');
var _lifetimeSessions = parseInt(localStorage.getItem('bw_sessions') || '0');
var _lifetimeSheets = parseInt(localStorage.getItem('bw_sheets') || '0');
var _size = 'medium';
var _popped = 0;
var _total = 0;
var _streak = 0;
var _sessionPops = 0;
var _interCount = 0;
var _popAllRunning = false;
var _popRowIndex = 0;

var SIZES = {
  small:  { cols:14, rows:20 },
  medium: { cols:10, rows:14 },
  large:  { cols:7, rows:10 },
};

var THEMES = [
  { id:'classic', name:'Classic Blue',  bg:'#0d1a2a', pop:'#c0e0ff', unpopped:['#60b8ff','#3a8fdf','#1a5fa0'], poppedColor:'#0d2a40', free:true },
  { id:'pastel',  name:'Pastel',        bg:'#1a0a22', pop:'#f0c0ff', unpopped:['#c084fc','#e879f9','#a855f7'], poppedColor:'#2a0a3a', free:true },
  { id:'mint',    name:'Mint Green',    bg:'#041a0e', pop:'#c0ffe0', unpopped:['#34d399','#10b981','#059669'], poppedColor:'#041a0a', free:false, price:150 },
  { id:'coral',   name:'Coral',         bg:'#1a0a04', pop:'#ffd0c0', unpopped:['#fb923c','#f97316','#ea580c'], poppedColor:'#1a0a04', free:false, price:150 },
  { id:'gold',    name:'Gold',          bg:'#1a1400', pop:'#fff0c0', unpopped:['#fcd34d','#fbbf24','#f59e0b'], poppedColor:'#1a1000', free:false, price:200 },
  { id:'neon',    name:'Neon',          bg:'#000510', pop:'#c0f0ff', unpopped:['#00ffcc','#00ccff','#cc00ff'], poppedColor:'#020a12', free:false, price:300 },
];

if (_adsRemoved) document.getElementById('remove-ads-btn').style.display = 'none';
renderCoins();
buildGrid();

// ── grid ──
function getTheme() { return THEMES.find(function(t){ return t.id === _theme; }) || THEMES[0]; }

function buildGrid() {
  var sz = SIZES[_size];
  var cols = sz.cols, rows = sz.rows;
  _total = cols * rows;
  _popped = 0;
  _streak = 0;
  _popRowIndex = 0;

  var grid = document.getElementById('bubble-grid');
  grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  grid.innerHTML = '';

  var T = getTheme();
  for (var i = 0; i < _total; i++) {
    var div = document.createElement('div');
    div.className = 'bubble';
    div.dataset.idx = i;
    var inner = document.createElement('div');
    inner.className = 'bubble-inner';
    var colorIdx = i % T.unpopped.length;
    inner.style.background = 'radial-gradient(circle at 35% 32%, ' + lighten(T.unpopped[colorIdx]) + ', ' + T.unpopped[colorIdx] + ' 55%, ' + darken(T.unpopped[colorIdx]) + ')';
    inner.style.boxShadow = '0 3px 10px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.25), inset 0 -2px 5px rgba(0,0,0,0.3)';
    div.appendChild(inner);
    div.addEventListener('touchstart', onBubbleTouchStart, { passive: true });
    div.addEventListener('click', onBubbleClick);
    grid.appendChild(div);
  }

  updateCounterUI();
  _lifetimeSessions++;
  localStorage.setItem('bw_sessions', _lifetimeSessions);
}

function onBubbleClick(e) { popBubble(this); }
function onBubbleTouchStart(e) { popBubble(this); }

// drag-to-pop
document.getElementById('grid-scroll').addEventListener('touchmove', function(e) {
  var t = e.touches[0];
  var el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && el.classList.contains('bubble')) popBubble(el);
  if (el && el.classList.contains('bubble-inner')) popBubble(el.parentElement);
}, { passive: true });

function popBubble(el) {
  if (!el || el.classList.contains('popped') || el.classList.contains('popping')) return;
  var T = getTheme();
  el.classList.add('popping');
  el.style.transform = 'scale(1.3)';
  var inner = el.querySelector('.bubble-inner');
  if (inner) {
    inner.style.background = 'radial-gradient(circle, ' + T.pop + ', rgba(255,255,255,0.3))';
    inner.style.boxShadow = 'none';
  }
  setTimeout(function() {
    el.classList.remove('popping');
    el.classList.add('popped');
    el.style.transform = '';
    if (inner) {
      inner.style.background = T.poppedColor;
      inner.style.boxShadow = 'inset 0 2px 8px rgba(0,0,0,0.6)';
      inner.style.opacity = '0.6';
    }
  }, 120);

  playPop();
  vibrate(15);
  _popped++;
  _streak++;
  _sessionPops++;
  _lifetimePops++;
  localStorage.setItem('bw_lifetime', _lifetimePops);

  if (_streak % 10 === 0) { addCoins(1); showToast('🔥 ' + _streak + ' streak! +1 🪙'); }
  if (_popped % 20 === 0) { addCoins(1); }

  updateCounterUI();

  if (_popped === _total) { onSheetComplete(); }

  _interCount++;
  if (!_adsRemoved && _interCount % 60 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

function updateCounterUI() {
  var left = _total - _popped;
  document.getElementById('s-popped').textContent = _popped;
  document.getElementById('s-left').textContent = left;
  document.getElementById('s-streak').textContent = _streak;
  document.getElementById('s-session').textContent = _sessionPops;
  document.getElementById('pop-counter').textContent = _popped + ' / ' + _total;
}

function onSheetComplete() {
  _lifetimeSheets++;
  localStorage.setItem('bw_sheets', _lifetimeSheets);
  var earned = Math.floor(_total / 10);
  addCoins(earned);
  document.getElementById('co-stats').textContent = 'Popped all ' + _total + ' bubbles! +' + earned + ' 🪙';
  document.getElementById('completeOverlay').classList.add('show');
}

function refill() {
  document.getElementById('completeOverlay').classList.remove('show');
  _popped = 0;
  _streak = 0;
  buildGrid();
}

async function popAll() {
  if (_popAllRunning) return;
  _popAllRunning = true;
  var bubbles = Array.from(document.querySelectorAll('.bubble:not(.popped)'));
  for (var i = 0; i < bubbles.length; i++) {
    popBubble(bubbles[i]);
    if (i % 8 === 7) await new Promise(function(r){ setTimeout(r, 10); });
  }
  _popAllRunning = false;
}

function popRow() {
  var sz = SIZES[_size];
  var cols = sz.cols;
  var bubbles = Array.from(document.querySelectorAll('.bubble'));
  var startRow = _popRowIndex;
  var start = startRow * cols;
  var end = Math.min(start + cols, bubbles.length);
  for (var i = start; i < end; i++) {
    setTimeout((function(b){ return function(){ popBubble(b); }; })(bubbles[i]), (i - start) * 40);
  }
  _popRowIndex = (_popRowIndex + 1) % sz.rows;
}

function setSize(s, btn) {
  _size = s;
  document.querySelectorAll('.ctrl-pill').forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
  buildGrid();
}

// ── stats screen ──
function renderStats() {
  var el = document.getElementById('statsContent');
  el.innerHTML = '';
  var items = [
    {icon:'🫧', val:_lifetimePops.toLocaleString(), lbl:'Lifetime Bubbles Popped'},
    {icon:'📋', val:_lifetimeSessions.toLocaleString(), lbl:'Sessions Started'},
    {icon:'✅', val:_lifetimeSheets.toLocaleString(), lbl:'Full Sheets Completed'},
    {icon:'🪙', val:_coins, lbl:'Coins Earned'},
    {icon:'🔥', val:_streak, lbl:'Current Streak (this sheet)'},
  ];
  items.forEach(function(item) {
    var d = document.createElement('div');
    d.className = 'stat-card';
    d.innerHTML = '<div class="sc-icon">' + item.icon + '</div><div class="sc-body"><div class="sc-val">' + item.val + '</div><div class="sc-lbl">' + item.lbl + '</div></div>';
    el.appendChild(d);
  });
}

function resetAllStats() {
  if (!confirm('Reset all lifetime stats?')) return;
  _lifetimePops = _lifetimeSessions = _lifetimeSheets = 0;
  localStorage.setItem('bw_lifetime','0'); localStorage.setItem('bw_sessions','0'); localStorage.setItem('bw_sheets','0');
  renderStats();
  showToast('Stats reset');
}

// ── theme shop ──
function renderShop() {
  var grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  THEMES.forEach(function(t) {
    var owned = t.free || _unlockedThemes.indexOf(t.id) >= 0;
    var selected = t.id === _theme;
    var div = document.createElement('div');
    div.className = 'theme-card' + (selected ? ' selected' : '') + (!owned ? ' locked' : '');
    div.style.background = 'linear-gradient(135deg,' + t.bg + ',rgba(255,255,255,0.04))';
    div.style.border = '2px solid ' + (selected ? 'var(--gold)' : 'rgba(255,255,255,0.08)');
    var dots = t.unpopped.map(function(c){ return '<div class="tc-dot" style="background:' + c + '"></div>'; }).join('');
    div.innerHTML = '<div class="tc-preview">' + dots + '</div><div class="tc-name">' + t.name + '</div>' + (!owned ? '<div class="tc-price">🪙 ' + t.price + '</div>' : (selected ? '<div style="font-size:0.72rem;color:#2ecc71;margin-top:4px">✓ Active</div>' : '<div style="font-size:0.72rem;color:var(--muted);margin-top:4px">Tap to apply</div>'));
    div.onclick = function() { selectTheme(t, owned); };
    grid.appendChild(div);
  });

  var iapList = document.getElementById('iapList');
  iapList.innerHTML = '';
  [{icon:'🚫',title:'Remove Ads',desc:'Remove all banner and interstitial ads.',type:'iap',id:'remove_ads',label:'$2.99'},
   {icon:'📺',title:'Watch Ad for Coins',desc:'Watch a short ad to earn 15 coins.',type:'ad',label:'Watch'},
  ].forEach(function(item) {
    var owned = item.id === 'remove_ads' && _adsRemoved;
    var d = document.createElement('div');
    d.className = 'iap-card';
    var btnClass = owned ? 'owned' : (item.type === 'iap' ? 'iap' : 'gold');
    var btnText = owned ? '✓ Owned' : item.label;
    var onClick = item.type === 'iap' ? "_purchase('" + item.id + "')" : '_watchAd()';
    d.innerHTML = '<div class="iap-icon">' + item.icon + '</div><div class="iap-body"><div class="iap-title">' + item.title + '</div><div class="iap-desc">' + item.desc + '</div></div><button class="iap-btn ' + btnClass + '" onclick="' + onClick + '">' + btnText + '</button>';
    iapList.appendChild(d);
  });
}

function selectTheme(t, owned) {
  if (!owned) {
    if (_coins < t.price) { showToast('Need 🪙 ' + t.price); return; }
    _coins -= t.price;
    localStorage.setItem('bw_coins', _coins);
    _unlockedThemes.push(t.id);
    localStorage.setItem('bw_unlocked', JSON.stringify(_unlockedThemes));
    renderCoins();
  }
  _theme = t.id;
  localStorage.setItem('bw_theme', _theme);
  buildGrid();
  renderShop();
  showToast(t.name + ' theme!');
}

// ── nav ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  if (id === 'statsScreen') renderStats();
  if (id === 'shopScreen') renderShop();
}
function switchTab(id, btn) {
  showScreen(id);
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
}

// ── coins ──
function addCoins(n) { _coins += n; localStorage.setItem('bw_coins', _coins); renderCoins(); }
function renderCoins() {
  document.getElementById('coinDisplay').textContent = _coins;
  var c2 = document.getElementById('coinDisplay2');
  if (c2) c2.textContent = _coins;
}

// ── purchase ──
function _purchase(id) { if (window.Android) Android.purchase(id); else showToast('IAP: ' + id); }
function _watchAd() { if (window.Android) Android.showRewardedAd(); else { addCoins(15); showToast('+15 🪙 (test)'); } }
window.onPurchaseComplete = function(id) {
  if (id === 'remove_ads') {
    _adsRemoved = true;
    localStorage.setItem('bw_adsRemoved','1');
    document.getElementById('remove-ads-btn').style.display = 'none';
    if (window.Android) Android.hideBannerAd();
    showToast('Ads removed! ✨');
    renderShop();
  }
};
window.onRewardedAdComplete = function() { addCoins(15); showToast('+15 🪙 earned!'); };

// ── utils ──
function lighten(hex) {
  var r = Math.min(255, parseInt(hex.slice(1,3),16)+60);
  var g = Math.min(255, parseInt(hex.slice(3,5),16)+60);
  var b = Math.min(255, parseInt(hex.slice(5,7),16)+60);
  return '#' + ('0'+r.toString(16)).slice(-2) + ('0'+g.toString(16)).slice(-2) + ('0'+b.toString(16)).slice(-2);
}
function darken(hex) {
  var r = Math.max(0, parseInt(hex.slice(1,3),16)-40);
  var g = Math.max(0, parseInt(hex.slice(3,5),16)-40);
  var b = Math.max(0, parseInt(hex.slice(5,7),16)-40);
  return '#' + ('0'+r.toString(16)).slice(-2) + ('0'+g.toString(16)).slice(-2) + ('0'+b.toString(16)).slice(-2);
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

var _toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

if (window.Android && !_adsRemoved) Android.showBannerAd();
</script>
</body>
</html>

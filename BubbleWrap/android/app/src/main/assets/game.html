<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BubbleWrap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0d1b2a;--surface:#1b2838;--accent:#90CAF9;--text:#eaeaea;--muted:#7a8a9a;--radius:12px;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100%;padding:12px 12px 0;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-shrink:0;}
header h1{font-size:1.2rem;font-weight:700;}
header h1 span{color:var(--accent);}
#counter{font-size:1rem;color:var(--accent);font-weight:600;}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:4px;}
.bubble{
  aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#d0eeff,var(--accent) 60%,#5a9fd4);
  cursor:pointer;transition:transform 0.1s;
  box-shadow:0 2px 6px rgba(0,0,0,0.4),inset 0 -2px 4px rgba(0,0,0,0.2);
  touch-action:manipulation;
}
.bubble.btn-pressed{transform:scale(0.88);}
.bubble.popped{background:radial-gradient(circle,#1b2838 60%,#263547);box-shadow:inset 0 1px 4px rgba(0,0,0,0.6);}
.bubble.popping{animation:pop 0.25s ease-out forwards;}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(0.5);opacity:0.3;}}
#btns{display:flex;gap:8px;flex-shrink:0;padding:10px 0 8px;}
.btn{flex:1;background:var(--accent);color:#000;border:none;padding:12px;border-radius:var(--radius);font-weight:700;font-size:0.95rem;cursor:pointer;touch-action:manipulation;}
.btn.btn-pressed{transform:scale(0.95);opacity:0.85;}
.btn.secondary{background:#263547;color:var(--text);}
#banner{height:50px;background:#111;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.75rem;flex-shrink:0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bubble<span>Wrap</span></h1>
    <div id="counter">0/150</div>
  </header>
  <div id="btns">
    <button class="btn secondary" id="btn-pop-all">Pop All</button>
    <button class="btn" id="btn-refill">Refill</button>
  </div>
  <div id="scroll"><div id="grid"></div></div>
  <div id="banner">Ad Banner</div>
</div>
<script>
const ROWS=15,COLS=10,TOTAL=ROWS*COLS;
let popped=0,popping=false;
const grid=document.getElementById('grid');
const counter=document.getElementById('counter');

const ctx=new(window.AudioContext||window.webkitAudioContext)();
function playPop(){
  try{
    if(ctx.state==='suspended')ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.setValueAtTime(400+Math.random()*300,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80,ctx.currentTime+0.08);
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
    o.start();o.stop(ctx.currentTime+0.1);
  }catch(e){}
}

function buildGrid(){
  grid.innerHTML='';popped=0;updateCounter();
  for(let i=0;i<TOTAL;i++){
    const b=document.createElement('div');
    b.className='bubble';
    b.addEventListener('touchstart',function(e){
      this.classList.add('btn-pressed');
      setTimeout(()=>this.classList.remove('btn-pressed'),120);
      popBubble(this);
    },{passive:true});
    b.addEventListener('click',function(){popBubble(this);});
    grid.appendChild(b);
  }
}

function popBubble(b){
  if(b.classList.contains('popped'))return;
  b.classList.add('popping');
  setTimeout(()=>{b.classList.remove('popping');b.classList.add('popped');},250);
  popped++;updateCounter();playPop();
}

function updateCounter(){counter.textContent=popped+'/'+TOTAL;}

document.getElementById('btn-refill').addEventListener('click',function(){
  this.classList.add('btn-pressed');setTimeout(()=>this.classList.remove('btn-pressed'),120);
  buildGrid();
});

document.getElementById('btn-pop-all').addEventListener('click',async function(){
  if(popping)return;popping=true;
  this.classList.add('btn-pressed');setTimeout(()=>this.classList.remove('btn-pressed'),120);
  const bubbles=[...grid.querySelectorAll('.bubble:not(.popped)')];
  for(let i=0;i<bubbles.length;i++){
    popBubble(bubbles[i]);
    if(i%5===4)await new Promise(r=>setTimeout(r,15));
  }
  popping=false;
});

grid.addEventListener('touchmove',function(e){
  e.preventDefault();
  const t=e.touches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(el&&el.classList.contains('bubble'))popBubble(el);
},{passive:false});

window.onPurchaseComplete=function(sku){};
window.onAdMobLoaded=function(){document.getElementById('banner').style.display='none';};

buildGrid();
</script>
</body>
</html>

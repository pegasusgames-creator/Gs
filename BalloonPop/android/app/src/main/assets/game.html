<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Balloon Pop</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:#1a0a00; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
#ui { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:10px 16px; z-index:10; background:rgba(0,0,0,0.4); }
#ui .score-box { display:flex; flex-direction:column; align-items:center; }
#ui .label { font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; color:#aaa; }
#ui .value { font-size:1.3rem; font-weight:800; color:#FF5722; }
#lives { font-size:1.4rem; letter-spacing:2px; }
#combo-display { position:absolute; top:70px; left:50%; transform:translateX(-50%); font-size:1.6rem; font-weight:900; color:#FFD600; text-shadow:0 0 10px #FFD600; opacity:0; transition:opacity 0.3s; z-index:10; pointer-events:none; }
canvas { display:block; }
#overlay { position:absolute; inset:0; background:rgba(0,0,0,0.8); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; gap:14px; }
#overlay h2 { font-size:2rem; font-weight:900; color:#FF5722; }
#overlay .sub { font-size:1rem; color:#aaa; }
#overlay .big { font-size:1.4rem; font-weight:700; }
#btn-play { background:#FF5722; border:none; border-radius:30px; color:#fff; font-size:1.2rem; font-weight:800; padding:14px 48px; cursor:pointer; }
#admob-banner { position:absolute; bottom:0; left:0; right:0; height:50px; background:#111; display:none; align-items:center; justify-content:center; color:#555; font-size:0.7rem; }
</style>
</head>
<body>
<div id="ui">
  <div class="score-box"><div class="label">Score</div><div class="value" id="score-disp">0</div></div>
  <div id="lives">❤️❤️❤️</div>
  <div class="score-box"><div class="label">Best</div><div class="value" id="best-disp">0</div></div>
</div>
<div id="combo-display" id="combo-disp"></div>
<canvas id="c"></canvas>
<div id="overlay">
  <h2>🎈 Balloon Pop</h2>
  <div class="sub">Tap balloons before they escape!</div>
  <div class="sub">Golden balloons = 5 pts • Combo multiplier!</div>
  <div class="big" id="final-score" style="display:none"></div>
  <button id="btn-play">Play!</button>
</div>
<div id="admob-banner">Advertisement</div>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

var COLORS = ['#FF5722','#E91E63','#9C27B0','#3F51B5','#00BCD4','#4CAF50','#FF9800','#2196F3'];
var state = {
  running: false, score: 0, lives: 3, level: 1,
  balloons: [], particles: [], popTexts: [],
  combo: 0, comboTimer: 0,
  frameCount: 0, spawnTimer: 0, spawnInterval: 90,
  removeAds: false
};
var best = parseInt(localStorage.getItem('bp_best') || '0');
document.getElementById('best-disp').textContent = best;

function Balloon(x, y, r, color, golden) {
  this.x = x; this.y = y; this.r = r;
  this.color = color; this.golden = golden || false;
  this.vy = -(0.8 + Math.random() * 0.6 + state.level * 0.08);
  this.vx = (Math.random() - 0.5) * 0.5;
  this.wobble = Math.random() * Math.PI * 2;
  this.alive = true;
  this.opacity = 1;
}
Balloon.prototype.update = function() {
  this.y += this.vy;
  this.x += this.vx;
  this.wobble += 0.05;
  this.x += Math.sin(this.wobble) * 0.3;
  if (this.x < this.r) { this.x = this.r; this.vx = Math.abs(this.vx); }
  if (this.x > W - this.r) { this.x = W - this.r; this.vx = -Math.abs(this.vx); }
  if (this.y + this.r < 0) {
    this.alive = false;
    if (state.running) loseLife();
  }
};
Balloon.prototype.draw = function() {
  ctx.save();
  ctx.globalAlpha = this.opacity;
  // balloon body
  var grad = ctx.createRadialGradient(this.x - this.r*0.3, this.y - this.r*0.3, this.r*0.1, this.x, this.y, this.r);
  grad.addColorStop(0, this.golden ? '#FFF176' : lighten(this.color));
  grad.addColorStop(1, this.golden ? '#FFD600' : this.color);
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  if (this.golden) {
    ctx.strokeStyle = '#FF8F00';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#FF8F00';
    ctx.font = 'bold ' + (this.r*0.7) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', this.x, this.y);
  }
  // string
  ctx.beginPath();
  ctx.moveTo(this.x, this.y + this.r);
  ctx.quadraticCurveTo(this.x + 5, this.y + this.r + 10, this.x, this.y + this.r + 20);
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
};

function lighten(hex) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + 60); g = Math.min(255, g + 60); b = Math.min(255, b + 60);
  return 'rgb('+r+','+g+','+b+')';
}

function Particle(x, y, color) {
  this.x = x; this.y = y; this.color = color;
  this.vx = (Math.random()-0.5)*6; this.vy = (Math.random()-1)*5;
  this.life = 1; this.r = 3 + Math.random()*3;
}
Particle.prototype.update = function() {
  this.x += this.vx; this.y += this.vy; this.vy += 0.15;
  this.life -= 0.04;
};
Particle.prototype.draw = function() {
  ctx.globalAlpha = this.life;
  ctx.fillStyle = this.color;
  ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
};

function PopText(x, y, text, color) {
  this.x = x; this.y = y; this.text = text; this.color = color || '#FFD600';
  this.life = 1; this.vy = -1.5;
}
PopText.prototype.update = function() { this.y += this.vy; this.life -= 0.03; };
PopText.prototype.draw = function() {
  ctx.globalAlpha = this.life;
  ctx.fillStyle = this.color;
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(this.text, this.x, this.y);
  ctx.globalAlpha = 1;
};

function spawnBalloon() {
  var golden = Math.random() < 0.08;
  var r = 22 + Math.random() * 14;
  var x = r + Math.random() * (W - r*2);
  var color = COLORS[Math.floor(Math.random() * COLORS.length)];
  state.balloons.push(new Balloon(x, H + r + 20, r, color, golden));
}

function loseLife() {
  state.lives--;
  updateLives();
  state.combo = 0;
  if (state.lives <= 0) gameOver();
}

function updateLives() {
  var s = '';
  for (var i=0;i<state.lives;i++) s += '❤️';
  for (var i=state.lives;i<3;i++) s += '🖤';
  document.getElementById('lives').textContent = s;
}

function popBalloon(b, tx, ty) {
  b.alive = false;
  state.combo++;
  state.comboTimer = 90;
  var pts = b.golden ? 5 : 1;
  if (state.combo >= 3) pts *= Math.min(state.combo, 8);
  state.score += pts;
  document.getElementById('score-disp').textContent = state.score;
  for (var i=0;i<12;i++) state.particles.push(new Particle(b.x, b.y, b.color));
  var txt = b.golden ? '+5 ★' : (state.combo >= 3 ? '+'+pts+' x'+state.combo+'!' : '+'+pts);
  state.popTexts.push(new PopText(b.x, b.y - b.r, txt, b.golden ? '#FFD600' : '#fff'));
}

var comboDisp = document.getElementById('combo-display');
function updateComboDisplay() {
  if (state.combo >= 3) {
    comboDisp.textContent = 'COMBO x' + state.combo + '!';
    comboDisp.style.opacity = '1';
  } else {
    comboDisp.style.opacity = '0';
  }
}

function gameOver() {
  state.running = false;
  if (state.score > best) {
    best = state.score;
    localStorage.setItem('bp_best', best);
    document.getElementById('best-disp').textContent = best;
  }
  document.getElementById('final-score').style.display = 'block';
  document.getElementById('final-score').textContent = 'Score: ' + state.score + ' | Best: ' + best;
  document.getElementById('btn-play').textContent = 'Play Again';
  document.getElementById('overlay').style.display = 'flex';
  if (!state.removeAds && window.Android) Android.showInterstitial();
}

function startGame() {
  state.running = true; state.score = 0; state.lives = 3; state.level = 1;
  state.balloons = []; state.particles = []; state.popTexts = [];
  state.combo = 0; state.comboTimer = 0;
  state.frameCount = 0; state.spawnTimer = 0; state.spawnInterval = 90;
  document.getElementById('score-disp').textContent = '0';
  updateLives();
  document.getElementById('overlay').style.display = 'none';
}

document.getElementById('btn-play').addEventListener('click', startGame);

function handleTap(ex, ey) {
  if (!state.running) return;
  var hit = false;
  for (var i = state.balloons.length-1; i >= 0; i--) {
    var b = state.balloons[i];
    if (!b.alive) continue;
    var dx = ex - b.x, dy = ey - b.y;
    if (dx*dx + dy*dy <= b.r*b.r) {
      popBalloon(b, ex, ey);
      hit = true;
      break;
    }
  }
}
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++) {
    var t = e.changedTouches[i];
    handleTap(t.clientX, t.clientY);
  }
}, {passive:false});
canvas.addEventListener('mousedown', function(e) { handleTap(e.clientX, e.clientY); });

function loop() {
  requestAnimationFrame(loop);
  ctx.clearRect(0, 0, W, H);
  // Background gradient
  var bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a0a00'); bg.addColorStop(1,'#3d1a00');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  if (!state.running) return;

  state.frameCount++;
  // Level up every 500 frames
  state.level = 1 + Math.floor(state.frameCount / 500);
  state.spawnInterval = Math.max(30, 90 - state.level * 5);

  // Combo timer
  if (state.comboTimer > 0) {
    state.comboTimer--;
    if (state.comboTimer === 0) state.combo = 0;
  }
  updateComboDisplay();

  // Spawn
  state.spawnTimer++;
  if (state.spawnTimer >= state.spawnInterval) {
    state.spawnTimer = 0;
    spawnBalloon();
    if (Math.random() < 0.3) spawnBalloon();
  }

  // Update & draw balloons
  state.balloons.forEach(function(b) { if(b.alive) b.update(); });
  state.balloons = state.balloons.filter(function(b) { return b.y > -200; });
  state.balloons.forEach(function(b) { if(b.alive) b.draw(); });

  // Particles
  state.particles.forEach(function(p) { p.update(); p.draw(); });
  state.particles = state.particles.filter(function(p) { return p.life > 0; });

  // Pop texts
  state.popTexts.forEach(function(t) { t.update(); t.draw(); });
  state.popTexts = state.popTexts.filter(function(t) { return t.life > 0; });
}
loop();

document.getElementById('btn-remove-ads').addEventListener && 0;
// Banner
if (!state.removeAds && !window.Android) document.getElementById('admob-banner').style.display = 'flex';
window.onPurchaseComplete = function(id) { if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';} };
window.onAdMobLoaded = function() {};
</script>
</body>
</html>

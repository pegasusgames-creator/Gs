<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cooking Timer</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#FF7043; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
/* Add timer form */
#add-form { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
#add-form input[type=text] { flex:1; min-width:100px; padding:9px 12px; border-radius:10px; border:none; background:var(--card); color:var(--text); font-size:0.9rem; }
#add-form input[type=number] { width:64px; padding:9px 8px; border-radius:10px; border:none; background:var(--card); color:var(--text); font-size:0.9rem; text-align:center; }
#add-form span { color:var(--muted); font-size:0.85rem; flex-shrink:0; }
.btn-add { background:var(--accent); border:none; border-radius:10px; color:#fff; font-size:1.1rem; font-weight:700; padding:9px 18px; cursor:pointer; }
/* Timer cards */
.timer-item { background:var(--card); border-radius:12px; padding:13px 14px; margin-bottom:9px; position:relative; overflow:hidden; transition:background 0.3s; }
.timer-item.done { background:#BF360C; animation:pulse 0.6s ease-in-out infinite alternate; }
@keyframes pulse { from { background:#BF360C; } to { background:#E64A19; } }
.ti-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.ti-name { font-size:0.95rem; font-weight:600; }
.ti-del { background:none; border:none; color:#FF7043; font-size:1.1rem; cursor:pointer; padding:0 4px; }
.ti-time { font-size:2.4rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:2px; color:var(--accent); margin-bottom:8px; }
.timer-item.done .ti-time { color:#fff; }
.progress-bar { height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-bottom:10px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.5s linear; }
.timer-item.done .progress-fill { background:#fff; }
.ti-btns { display:flex; gap:7px; }
.ti-btn { flex:1; padding:8px; border:none; border-radius:9px; font-size:0.82rem; font-weight:600; cursor:pointer; }
.ti-btn.start { background:#2E7D32; color:#fff; }
.ti-btn.pause { background:#E65100; color:#fff; }
.ti-btn.reset { background:rgba(255,255,255,0.12); color:var(--text); }
.empty-msg { text-align:center; color:var(--muted); padding:30px 0; font-size:0.9rem; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Cooking <span>Timer</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Add Timer</div>
      <div id="add-form">
        <input type="text" id="tname" placeholder="Timer name…" maxlength="24">
        <input type="number" id="tmin" min="0" max="999" value="10" placeholder="min">
        <span>:</span>
        <input type="number" id="tsec" min="0" max="59" value="0" placeholder="sec">
        <button class="btn-add" onclick="addTimer()">+</button>
      </div>
    </div>
    <div id="timers-list"></div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, timers:[], nextId:1 };
var iv = null;

function fmt(ms) {
  if(ms<0)ms=0;
  var tot=Math.ceil(ms/1000);
  var m=Math.floor(tot/60), s=tot%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

function addTimer() {
  if(state.timers.length>=6){alert('Maximum 6 timers');return;}
  var name=(document.getElementById('tname').value.trim()||'Timer '+(state.timers.length+1));
  var mins=parseInt(document.getElementById('tmin').value)||0;
  var secs=parseInt(document.getElementById('tsec').value)||0;
  var total=(mins*60+secs)*1000;
  if(total<=0){alert('Set a duration');return;}
  state.timers.push({id:state.nextId++,name:name,total:total,remaining:total,running:false,last:0});
  document.getElementById('tname').value='';
  render();
  maybeInterstitial();
}

function removeTimer(id) {
  state.timers=state.timers.filter(function(t){return t.id!==id;});
  render();
}

function startTimer(id) {
  var t=state.timers.find(function(t){return t.id===id;});
  if(!t||t.remaining<=0)return;
  t.running=true;t.last=Date.now();
  ensureLoop();
  render();
}

function pauseTimer(id) {
  var t=state.timers.find(function(t){return t.id===id;});
  if(!t)return;
  t.running=false;
  render();
}

function resetTimer(id) {
  var t=state.timers.find(function(t){return t.id===id;});
  if(!t)return;
  t.running=false;t.remaining=t.total;
  render();
}

function ensureLoop() {
  if(iv)return;
  iv=setInterval(function(){
    var any=false;
    state.timers.forEach(function(t){
      if(!t.running)return;
      any=true;
      var now=Date.now(),d=now-t.last;t.last=now;
      t.remaining-=d;
      if(t.remaining<=0){t.remaining=0;t.running=false;}
    });
    if(!any){clearInterval(iv);iv=null;}
    render();
  },200);
}

function render() {
  var list=document.getElementById('timers-list');
  if(state.timers.length===0){list.innerHTML='<div class="empty-msg">No timers yet.<br>Add up to 6 cooking timers above.</div>';return;}
  list.innerHTML=state.timers.map(function(t){
    var pct=Math.max(0,Math.min(100,t.remaining/t.total*100));
    var done=t.remaining<=0;
    return '<div class="timer-item'+(done?' done':'')+'" id="ti-'+t.id+'">'+
      '<div class="ti-header"><span class="ti-name">'+esc(t.name)+'</span><button class="ti-del" onclick="removeTimer('+t.id+')">&#10005;</button></div>'+
      '<div class="ti-time">'+fmt(t.remaining)+'</div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="ti-btns">'+
        (done?'<button class="ti-btn reset" onclick="resetTimer('+t.id+')">Reset</button>':
          (t.running?
            '<button class="ti-btn pause" onclick="pauseTimer('+t.id+')">Pause</button>':
            '<button class="ti-btn start" onclick="startTimer('+t.id+')">Start</button>')+
          '<button class="ti-btn reset" onclick="resetTimer('+t.id+')">Reset</button>')+
      '</div></div>';
  }).join('');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Anagram Finder</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
:root { --accent: #7E57C2; --light: #B39DDB; }
header { background: #16213e; padding: 14px 16px; text-align: center; border-bottom: 2px solid var(--accent); }
header h1 { font-size: 1.4rem; color: var(--light); letter-spacing: 2px; }
.tabs { display: flex; background: #16213e; }
.tab { flex: 1; padding: 12px; text-align: center; font-size: 0.85rem; color: #aaa; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab.active { color: var(--light); border-bottom-color: var(--accent); }
.tab.btn-pressed, .btn.btn-pressed { opacity: 0.6; transform: scale(0.96); }
.screen { display: none; flex: 1; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto; }
.screen.active { display: flex; }
.input-group { display: flex; gap: 8px; }
input[type=text] { flex: 1; background: #0f3460; border: 2px solid var(--accent); border-radius: 10px; color: #fff; padding: 12px 14px; font-size: 1.1rem; outline: none; letter-spacing: 3px; text-transform: uppercase; }
.btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.15s; user-select: none; }
.btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--light); }
.results-header { font-size: 0.9rem; color: #aaa; }
.results-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.word-chip { background: #0f3460; border: 1px solid var(--accent); border-radius: 20px; padding: 6px 14px; font-size: 0.9rem; color: var(--light); }
.word-chip.l6 { border-color: #ffd700; color: #ffd700; }
.word-chip.l7 { border-color: #ff9800; color: #ff9800; }
.word-chip.l8 { border-color: #f44336; color: #f44336; }
.group-label { font-size: 0.78rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; width: 100%; margin-top: 6px; }
.big-word { text-align: center; font-size: 2.2rem; letter-spacing: 8px; color: #fff; font-weight: 700; padding: 18px; background: #0f3460; border-radius: 14px; border: 2px solid var(--accent); }
.score-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
.score-val { font-size: 1.5rem; font-weight: 700; color: var(--light); }
.sc-input { font-size: 1.3rem; letter-spacing: 4px; text-align: center; text-transform: uppercase; }
.msg { text-align: center; font-size: 1rem; min-height: 24px; }
.correct { color: #66bb6a; }
.wrong { color: #ef5350; }
.timer-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
.timer-fill { height: 100%; background: var(--accent); transition: width 0.1s linear; border-radius: 4px; }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:0.65rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:9999;letter-spacing:0.5px">Remove Ads</button>
<header><h1>ANAGRAM FINDER</h1></header>
<div class="tabs">
  <div class="tab active" data-tab="finder" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="switchTab('finder')">Finder</div>
  <div class="tab" data-tab="scramble" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="switchTab('scramble')">Scramble</div>
  <div class="tab" data-tab="timer" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="switchTab('timer')">Timer</div>
</div>

<div class="screen active" id="screen-finder">
  <div class="input-group">
    <input type="text" id="finder-input" placeholder="Enter letters…" maxlength="12" oninput="this.value=this.value.toUpperCase()">
    <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="findAnagrams()">Find</button>
  </div>
  <button class="btn btn-outline" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="clearFinder()">Clear</button>
  <div class="results-header" id="finder-count"></div>
  <div class="results-grid" id="finder-results"></div>
</div>

<div class="screen" id="screen-scramble">
  <div class="score-row"><span>Score</span><span class="score-val" id="sc-score">0</span></div>
  <div class="big-word" id="sc-display">TAP NEW</div>
  <div class="input-group">
    <input type="text" class="sc-input" id="sc-input" placeholder="Your answer" maxlength="12" oninput="this.value=this.value.toUpperCase()">
    <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="checkScramble()">Go</button>
  </div>
  <div class="msg" id="sc-msg"></div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-outline" style="flex:1" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="hintScramble()">Hint</button>
    <button class="btn btn-outline" style="flex:1" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="skipScramble()">Skip</button>
    <button class="btn" style="flex:1" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="startScramble()">New</button>
  </div>
</div>

<div class="screen" id="screen-timer">
  <div class="score-row">
    <span>Score: <strong id="tm-score">0</strong></span>
    <span id="tm-round">Round 1</span>
  </div>
  <div class="timer-bar"><div class="timer-fill" id="tm-fill" style="width:100%"></div></div>
  <div class="big-word" id="tm-display">TAP START</div>
  <div class="input-group">
    <input type="text" class="sc-input" id="tm-input" placeholder="Unscramble!" maxlength="12" oninput="this.value=this.value.toUpperCase()">
    <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="checkTimer()">Go</button>
  </div>
  <div class="msg" id="tm-msg"></div>
  <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="startTimer()">Start Game</button>
</div>

l,loose,lover,lower,lucky,lunch,magic,major,maker,manor,march,might,minor,money,month,moral,mouse,mouth,music,night,noble,noise,north,north,novel,nurse,ocean,offer,often,order,other,outer,owner,paint,panel,paper,party,peace,pedal,phase,piece,pilot,pitch,pixel,place,plain,plane,plant,plate,plaza,plead,pluck,point,power,press,price,pride,print,prior,prize,proof,prove,prowl,queen,quest,quick,quiet,quite,quote,raise,range,reach,ready,realm,right,rival,river,round,royal,ruler,rural,saint,scale,scene,scope,score,scout,sense,serve,setup,seven,shade,shake,shame,shape,share,sharp,shift,shirt,shore,short,shout,sight,since,sixth,skill,sleep,slice,slide,slope,smart,smell,smile,smoke,solve,south,space,spare,spark,speak,speed,spend,spill,spine,spite,split,spoke,spray,stack,stage,stake,stand,stark,start,state,stave,stays,steal,steel,steep,steer,stern,stick,stiff,still,stock,stone,store,storm,story,strap,straw,strip,stuck,style,sugar,suite,sunny,super,surge,swear,sweep,sweet,swift,sword,table,taste,teach,tempt,tense,their,theme,thick,thing,think,third,those,three,threw,throw,thumb,tiger,tired,title,today,token,total,touch,tough,towel,toxic,trace,track,trade,trail,train,trait,trash,treat,trend,trial,trick,troop,trout,truck,truly,trust,truth,tumor,twine,twist,ultra,unify,union,until,upper,upset,usage,usual,until,valid,value,valve,video,vigor,visit,vital,vocal,voice,waste,watch,water,weave,weigh,where,which,while,white,whole,whose,witch,woman,women,world,worry,worse,worth,would,write,wrong,young,yours,youth,above,acted,added,admit,adopt,adult,after,agent,agree,ahead,aimed,alarm,album,alert,alien,align,alive,alley,allot,alone,along,aloof,alter,among,angel,anger,angle,angry,annex,apart,apple,apply,arena,argue,arose,array,aside,asset,atlas,attic,audio,augur,avoid,award,aware,awful,badly,bagel,baker,basic,basin,basis,batch,beach,began,bench,birth,blank,blast,blaze,bleed,blend,bless,blink,block,blood,bloom,blown,blues,blunt,board,bonus,boost,bound,boxer,brace,braid,brand,brave,bread,broke, let scWord='', scHint=0, scScore=0, tmWord='', tmScore=0, tmRound=1, tmInterval=null, tmLeft=30;

function canMakeWord(word, letters) {
  const avail = letters.toLowerCase().split('');
  for (const c of word) {
    const i = avail.indexOf(c);
    if (i === -1) return false;
    avail.splice(i, 1);
  }
  return true;
}

function findAnagrams() {
  const input = document.getElementById('finder-input').value.trim();
  if (!input) return;
  const letters = input.toLowerCase();
  const found = WORDS.filter(w => w.length >= 3 && canMakeWord(w, letters));
  found.sort((a, b) => b.length - a.length);
  document.getElementById('finder-count').textContent = `Found ${found.length} word${found.length !== 1 ? 's' : ''}`;
  const cont = document.getElementById('finder-results');
  cont.innerHTML = '';
  let lastLen = -1;
  for (const w of found) {
    if (w.length !== lastLen) {
      const g = document.createElement('div');
      g.className = 'group-label';
      g.textContent = w.length + ' letters';
      cont.appendChild(g);
      lastLen = w.length;
    }
    const chip = document.createElement('div');
    chip.className = 'word-chip' + (w.length >= 8 ? ' l8' : w.length === 7 ? ' l7' : w.length === 6 ? ' l6' : '');
    chip.textContent = w.toUpperCase();
    cont.appendChild(chip);
  }
}

function clearFinder() {
  document.getElementById('finder-input').value = '';
  document.getElementById('finder-results').innerHTML = '';
  document.getElementById('finder-count').textContent = '';
}

function shuffle(word) {
  const a = word.split('');
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  const r = a.join('');
  return r === word && word.length > 1 ? shuffle(word) : r;
}

function randWord(minLen=4, maxLen=8) {
  const pool = WORDS.filter(w => w.length >= minLen && w.length <= maxLen);
  return pool[Math.floor(Math.random() * pool.length)];
}

function startScramble() {
  scWord = randWord();
  scHint = 0;
  document.getElementById('sc-display').textContent = shuffle(scWord).toUpperCase();
  document.getElementById('sc-input').value = '';
  document.getElementById('sc-msg').textContent = '';
  document.getElementById('sc-msg').className = 'msg';
}

function hintScramble() {
  if (!scWord) return;
  scHint = Math.min(scHint + 1, scWord.length - 1);
  document.getElementById('sc-msg').textContent = 'Hint: ' + scWord.substring(0, scHint).toUpperCase() + '_'.repeat(scWord.length - scHint);
}

function checkScramble() {
  const ans = document.getElementById('sc-input').value.trim().toLowerCase();
  if (!scWord || !ans) return;
  const msg = document.getElementById('sc-msg');
  if (ans === scWord) {
    scScore++;
    document.getElementById('sc-score').textContent = scScore;
    msg.textContent = '✓ Correct! +1'; msg.className = 'msg correct';
    setTimeout(startScramble, 900);
  } else {
    msg.textContent = '✗ Wrong, try again!'; msg.className = 'msg wrong';
  }
}

function skipScramble() {
  if (!scWord) return;
  const msg = document.getElementById('sc-msg');
  msg.textContent = 'Answer: ' + scWord.toUpperCase(); msg.className = 'msg wrong';
  setTimeout(startScramble, 1200);
}

function startTimer() {
  clearInterval(tmInterval);
  tmScore = 0; tmRound = 1;
  document.getElementById('tm-score').textContent = 0;
  nextTimerWord();
}

function nextTimerWord() {
  tmWord = randWord();
  document.getElementById('tm-display').textContent = shuffle(tmWord).toUpperCase();
  document.getElementById('tm-input').value = '';
  document.getElementById('tm-msg').textContent = '';
  document.getElementById('tm-round').textContent = 'Round ' + tmRound;
  tmLeft = 30;
  document.getElementById('tm-fill').style.width = '100%';
  clearInterval(tmInterval);
  tmInterval = setInterval(() => {
    tmLeft -= 0.1;
    document.getElementById('tm-fill').style.width = (tmLeft / 30 * 100) + '%';
    if (tmLeft <= 0) {
      clearInterval(tmInterval);
      const msg = document.getElementById('tm-msg');
      msg.textContent = 'Time! It was: ' + tmWord.toUpperCase(); msg.className = 'msg wrong';
      setTimeout(() => { tmRound++; nextTimerWord(); }, 1500);
    }
  }, 100);
}

function checkTimer() {
  const ans = document.getElementById('tm-input').value.trim().toLowerCase();
  if (!tmWord || !ans) return;
  const msg = document.getElementById('tm-msg');
  if (ans === tmWord) {
    clearInterval(tmInterval);
    tmScore++; tmRound++;
    document.getElementById('tm-score').textContent = tmScore;
    msg.textContent = '✓ Correct!'; msg.className = 'msg correct';
    setTimeout(nextTimerWord, 700);
  } else {
    msg.textContent = '✗ Wrong!'; msg.className = 'msg wrong';
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
}

document.querySelectorAll('input').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const scr = document.querySelector('.screen.active').id;
      if (scr === 'screen-finder') findAnagrams();
      else if (scr === 'screen-scramble') checkScramble();
      else checkTimer();
    }
  });
});

window.onPurchaseComplete = function(sku) { console.log('Purchase:', sku); };

// ── AppLovin MAX / IAP bridge ──────────────────────────────────────────
var _adsRemoved = false;
var _interstitialCount = 0;

function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};

// Restore remove-ads state on load
if (window.Android) {
  try { if (Android.isPurchased && Android.isPurchased('remove_ads')) {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
  }} catch(e) {}
}

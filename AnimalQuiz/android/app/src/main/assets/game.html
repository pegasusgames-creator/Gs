<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animal Quiz</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#66BB6A; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; }
.screen { display:none; flex-direction:column; height:100%; }
.screen.active { display:flex; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
button { cursor:pointer; border:none; border-radius:var(--radius); font-family:inherit; font-weight:600; transition:transform 0.1s,opacity 0.1s; }
button:active, button.btn-pressed { transform:scale(0.96); opacity:0.85; }
.btn-primary { background:var(--accent); color:#fff; padding:14px 28px; font-size:1.1rem; width:100%; }
.btn-secondary { background:var(--card); color:var(--text); padding:12px 20px; font-size:0.95rem; width:100%; }
#menuScreen { align-items:center; justify-content:center; gap:20px; padding:30px; }
.menu-emoji { font-size:5rem; }
.menu-title { font-size:2.2rem; font-weight:800; color:var(--accent); }
.menu-sub { color:var(--muted); font-size:0.95rem; text-align:center; }
.menu-buttons { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
#gameScreen { padding:0; }
.game-header { background:var(--surface); padding:12px 16px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.game-top { display:flex; justify-content:space-between; align-items:center; }
.progress-text { font-size:0.85rem; color:var(--muted); }
.score-text { font-size:0.95rem; font-weight:700; color:var(--accent); }
.timer-bar-wrap { height:6px; background:var(--card); border-radius:3px; overflow:hidden; }
.timer-bar { height:100%; background:var(--accent); border-radius:3px; transition:width 0.1s linear; }
.question-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:12px; overflow:hidden; }
.question-emoji { font-size:3.5rem; line-height:1; }
.question-text { font-size:1.05rem; font-weight:600; text-align:center; line-height:1.4; }
.answers { width:100%; max-width:480px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ans-btn { background:var(--card); color:var(--text); padding:14px 8px; font-size:0.9rem; border-radius:var(--radius); border:2px solid transparent; min-height:58px; line-height:1.3; }
.ans-btn.correct { background:#1b5e20; border-color:#66BB6A; color:#fff; }
.ans-btn.wrong { background:#b71c1c; border-color:#EF5350; color:#fff; }
.ans-btn:disabled { cursor:default; }
.feedback-bar { height:38px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; flex-shrink:0; background:var(--surface); padding:0 12px; text-align:center; }
.feedback-bar.correct { color:#66BB6A; }
.feedback-bar.wrong { color:#EF5350; }
#resultScreen { align-items:center; justify-content:center; gap:18px; padding:30px; }
.result-emoji { font-size:4rem; }
.result-title { font-size:1.8rem; font-weight:800; }
.result-score { font-size:3.5rem; font-weight:900; color:var(--accent); }
.result-sub { color:var(--muted); font-size:1rem; }
.result-buttons { width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div id="app">
  <div class="screen active" id="menuScreen">
    <div class="menu-emoji">🐾</div>
    <div class="menu-title">Animal Quiz</div>
    <div class="menu-sub">50 questions about the animal kingdom</div>
    <div class="menu-buttons">
      <button class="btn-primary" onclick="startGame()">Play Now</button>
    </div>
  </div>
  <div class="screen" id="gameScreen">
    <div class="game-header">
      <div class="game-top">
        <span class="progress-text" id="progressText">1 / 50</span>
        <span class="score-text" id="scoreText">Score: 0</span>
      </div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    </div>
    <div class="question-area">
      <div class="question-emoji" id="qEmoji"></div>
      <div class="question-text" id="qText"></div>
      <div class="answers" id="answersDiv"></div>
    </div>
    <div class="feedback-bar" id="feedbackBar"></div>
  </div>
  <div class="screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title">Quiz Complete!</div>
    <div class="result-score" id="resultScore">0%</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-buttons">
      <button class="btn-primary" onclick="startGame()">Play Again</button>
      <button class="btn-secondary" onclick="showScreen('menuScreen')">Menu</button>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
var state={useCount:0,removeAds:false,score:0,qi:0,questions:[],timer:null,timeLeft:0,answered:false};
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%5===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var ALL_QUESTIONS=[
  {e:'🦁',q:"What is the scientific name of the lion?",a:["Panthera leo","Panthera tigris","Leo africanus","Felis leo"],c:0},
  {e:'🐘',q:"Which is the largest land animal on Earth?",a:["African elephant","White rhinoceros","Hippopotamus","Giraffe"],c:0},
  {e:'🦒',q:"What is the tallest animal in the world?",a:["Giraffe","African elephant","Ostrich","Polar bear"],c:0},
  {e:'🐋',q:"What is the largest animal ever known to have lived?",a:["Blue whale","Sperm whale","Megalodon","African elephant"],c:0},
  {e:'🦅',q:"What bird has the largest wingspan?",a:["Wandering albatross","Bald eagle","California condor","Andean condor"],c:0},
  {e:'🐆',q:"Which big cat is the fastest land animal?",a:["Cheetah","Leopard","Lion","Jaguar"],c:0},
  {e:'🦜',q:"Which parrot best mimics human speech?",a:["African Grey","Macaw","Cockatoo","Amazon parrot"],c:0},
  {e:'🐬',q:"What is a group of dolphins called?",a:["Pod","School","Herd","Pack"],c:0},
  {e:'🦈',q:"How many rows of teeth can a great white shark have?",a:["Up to 300","Exactly 32","About 50","Over 1000"],c:0},
  {e:'🐧',q:"Which penguin is the largest species?",a:["Emperor penguin","King penguin","Chinstrap penguin","Gentoo penguin"],c:0},
  {e:'🐝',q:"How many eyes does a bee have?",a:["5","2","4","6"],c:0},
  {e:'🦎',q:"What is the world's largest lizard?",a:["Komodo dragon","Monitor lizard","Iguana","Gila monster"],c:0},
  {e:'🐢',q:"What is the longest-lived vertebrate?",a:["Greenland shark","Giant tortoise","Bowhead whale","Koi fish"],c:0},
  {e:'🦁',q:"What is a group of lions called?",a:["Pride","Pack","Herd","Clan"],c:0},
  {e:'🐺',q:"What is a group of wolves called?",a:["Pack","Pride","Herd","Colony"],c:0},
  {e:'🐨',q:"What do koalas primarily eat?",a:["Eucalyptus leaves","Bamboo","Insects","Fruits"],c:0},
  {e:'🐼',q:"Giant pandas are native to which country?",a:["China","Japan","India","Mongolia"],c:0},
  {e:'🦩',q:"Why are flamingos pink?",a:["Diet of algae & crustaceans","Genetic pigment","Sun exposure","Mating display"],c:0},
  {e:'🐍',q:"Which snake is the longest in the world?",a:["Reticulated python","Green anaconda","King cobra","Burmese python"],c:0},
  {e:'🐙',q:"How many hearts does an octopus have?",a:["3","1","2","4"],c:0},
  {e:'🦑',q:"What is the largest invertebrate on Earth?",a:["Colossal squid","Giant octopus","Giant clam","Lion's mane jellyfish"],c:0},
  {e:'🐘',q:"How long is an elephant's gestation period?",a:["22 months","12 months","18 months","9 months"],c:0},
  {e:'🐸',q:"What is a group of frogs called?",a:["Army","Pod","Colony","School"],c:0},
  {e:'🐦',q:"Which bird can fly backwards?",a:["Hummingbird","Swift","Swallow","Kingfisher"],c:0},
  {e:'🐬',q:"Are dolphins fish or mammals?",a:["Mammals","Fish","Amphibians","Reptiles"],c:0},
  {e:'🐻',q:"Bears eat both plants and animals. They are called?",a:["Omnivores","Carnivores","Herbivores","Insectivores"],c:0},
  {e:'🐝',q:"What is the lifespan of a worker honeybee in summer?",a:["About 6 weeks","2 years","1 year","6 months"],c:0},
  {e:'🦀',q:"How many legs does a crab have?",a:["10","8","6","12"],c:0},
  {e:'🦅',q:"Bald eagles are the national bird of which country?",a:["USA","Canada","Mexico","Australia"],c:0},
  {e:'🐊',q:"Crocodiles cannot stick out their tongue because it is fused to their mouth. True?",a:["True","False","Only some species","Only hatchlings"],c:0},
  {e:'🦒',q:"How many neck vertebrae does a giraffe have?",a:["7","14","10","21"],c:0},
  {e:'🦭',q:"A baby seal is called a?",a:["Pup","Cub","Kit","Calf"],c:0},
  {e:'🐘',q:"Elephants are the only mammals that cannot?",a:["Jump","Swim","Run","Crouch"],c:0},
  {e:'🦇',q:"What is the only mammal capable of true sustained flight?",a:["Bat","Flying squirrel","Sugar glider","Colugo"],c:0},
  {e:'🐙',q:"What colour is octopus blood?",a:["Blue","Red","Green","Clear"],c:0},
  {e:'🐆',q:"Leopards store their prey by dragging it where?",a:["Up in trees","Underground","In water","In caves"],c:0},
  {e:'🦊',q:"A fox's home is called a?",a:["Earth","Burrow","Sett","Den"],c:0},
  {e:'🦦',q:"Sea otters sleep holding paws so they don't drift. This is called?",a:["Rafting","Floating","Anchoring","Drifting"],c:0},
  {e:'🐍',q:"Which is the heaviest snake in the world?",a:["Green anaconda","Reticulated python","Burmese python","King cobra"],c:0},
  {e:'🦋',q:"The study of butterflies and moths is called?",a:["Lepidopterology","Entomology","Zoology","Ornithology"],c:0},
  {e:'🐟',q:"What is a group of fish called?",a:["School","Pod","Shoal","Both A and C"],c:3},
  {e:'🦁',q:"How fast can a cheetah run at top speed?",a:["112 km/h (70 mph)","80 km/h","150 km/h","60 km/h"],c:0},
  {e:'🐻‍❄️',q:"What do polar bears primarily hunt?",a:["Seals","Fish","Walruses","Arctic fox"],c:0},
  {e:'🦜',q:"How long can a macaw live in captivity?",a:["Up to 80 years","20 years","50 years","10 years"],c:0},
  {e:'🐠',q:"What is the fastest fish in the ocean?",a:["Sailfish","Swordfish","Bluefin tuna","Mako shark"],c:0},
  {e:'🦁',q:"A female lion does most of the hunting. True?",a:["True","False","50/50","Only night hunts"],c:0},
  {e:'🐴',q:"A male horse is called a?",a:["Stallion","Gelding","Colt","Mare"],c:0},
  {e:'🦃',q:"What sound does a male turkey make?",a:["Gobble","Cluck","Crow","Warble"],c:0},
  {e:'🐝',q:"Honey never spoils. Edible honey has been found in how old Egyptian tombs?",a:["3,000 years old","100 years old","500 years old","1,000 years old"],c:0},
  {e:'🦓',q:"Are zebra stripes unique to each individual, like fingerprints?",a:["Yes","No","Only facial stripes","Only some subspecies"],c:0},
];

function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

function startGame(){
  state.score=0;state.qi=0;state.useCount=0;
  state.questions=shuffle(ALL_QUESTIONS.slice()).slice(0,50);
  showScreen('gameScreen');
  loadQuestion();
}

function loadQuestion(){
  if(state.qi>=state.questions.length){endGame();return;}
  var q=state.questions[state.qi];
  document.getElementById('progressText').textContent=(state.qi+1)+' / '+state.questions.length;
  document.getElementById('scoreText').textContent='Score: '+state.score;
  document.getElementById('qEmoji').textContent=q.e;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('feedbackBar').textContent='';
  document.getElementById('feedbackBar').className='feedback-bar';
  state.answered=false;
  var correctLabel=q.a[q.c];
  var indices=[0,1,2,3];shuffle(indices);
  var div=document.getElementById('answersDiv');
  div.innerHTML='';
  indices.forEach(function(idx){
    var btn=document.createElement('button');
    btn.className='ans-btn';
    btn.textContent=q.a[idx];
    btn.onclick=function(){answer(btn,q.a[idx]===correctLabel,correctLabel);};
    div.appendChild(btn);
  });
  startTimer();
}

var TIMER_DURATION=15;
function startTimer(){
  clearInterval(state.timer);
  state.timeLeft=TIMER_DURATION;
  updateTimerBar();
  state.timer=setInterval(function(){
    state.timeLeft-=0.1;
    updateTimerBar();
    if(state.timeLeft<=0){clearInterval(state.timer);timeUp();}
  },100);
}
function updateTimerBar(){document.getElementById('timerBar').style.width=Math.max(0,state.timeLeft/TIMER_DURATION*100)+'%';}

function timeUp(){
  if(state.answered)return;
  state.answered=true;
  var q=state.questions[state.qi];
  var correctLabel=q.a[q.c];
  document.querySelectorAll('.ans-btn').forEach(function(b){b.disabled=true;if(b.textContent===correctLabel)b.classList.add('correct');});
  showFeedback(false,"Time up! Correct: "+correctLabel);
  setTimeout(nextQ,1600);
}

function answer(btn,isCorrect,correctLabel){
  if(state.answered)return;
  state.answered=true;
  clearInterval(state.timer);
  document.querySelectorAll('.ans-btn').forEach(function(b){b.disabled=true;if(b.textContent===correctLabel)b.classList.add('correct');});
  if(isCorrect){state.score++;btn.classList.add('correct');showFeedback(true,'Correct! 🎉');}
  else{btn.classList.add('wrong');showFeedback(false,'Wrong! Correct: '+correctLabel);}
  setTimeout(nextQ,1600);
}

function showFeedback(ok,msg){
  var bar=document.getElementById('feedbackBar');
  bar.textContent=msg;bar.className='feedback-bar '+(ok?'correct':'wrong');
}

function nextQ(){
  state.qi++;
  if(state.qi%5===0)maybeInterstitial();
  loadQuestion();
}

function endGame(){
  clearInterval(state.timer);
  var pct=Math.round(state.score/state.questions.length*100);
  document.getElementById('resultScore').textContent=pct+'%';
  document.getElementById('resultSub').textContent=state.score+' out of '+state.questions.length+' correct';
  var emojis=['😢','😕','🙂','😊','🏆'];
  document.getElementById('resultEmoji').textContent=emojis[Math.min(4,Math.floor(pct/20))];
  showScreen('resultScreen');
}
</script>
</body>
</html>

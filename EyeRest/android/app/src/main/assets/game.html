<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eye Rest</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#80CBC4; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
/* Main status */
#status-card { text-align:center; padding:24px 16px; }
#phase-label { font-size:0.85rem; text-transform:uppercase; letter-spacing:2px; color:var(--muted); margin-bottom:10px; }
#big-time { font-size:3.6rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:2px; margin-bottom:8px; }
#phase-msg { font-size:1rem; color:var(--muted); margin-bottom:18px; min-height:24px; }
/* Ring */
#ring-wrap { position:relative; width:120px; height:120px; margin:0 auto 18px; }
#ring-svg { transform:rotate(-90deg); }
#ring-bg { fill:none; stroke:var(--card); stroke-width:8; }
#ring-fg { fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; stroke-dasharray:314; stroke-dashoffset:0; transition:stroke-dashoffset 0.5s linear; }
#ring-inner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
/* Break overlay */
#break-overlay { display:none; position:fixed; inset:0; background:rgba(0,80,80,0.95); z-index:100; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
#break-overlay.show { display:flex; }
#break-countdown { font-size:5rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
#break-msg { font-size:1.1rem; color:#B2DFDB; margin-top:16px; line-height:1.5; }
#break-eye { font-size:3rem; margin-bottom:16px; }
/* Buttons */
.btn-primary { background:var(--accent); border:none; border-radius:10px; color:#1a1a2e; font-size:1rem; font-weight:700; padding:14px; cursor:pointer; width:100%; margin-bottom:8px; }
.btn-secondary { background:var(--card); border:none; border-radius:10px; color:var(--text); font-size:0.9rem; padding:12px; cursor:pointer; width:100%; }
/* Stats */
.stat-row { display:flex; justify-content:space-around; }
.stat-box { text-align:center; }
.stat-val { font-size:1.8rem; font-weight:700; color:var(--accent); }
.stat-lbl { font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Eye <span>Rest</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card" id="status-card">
      <div id="phase-label">Ready</div>
      <div id="ring-wrap">
        <svg id="ring-svg" width="120" height="120" viewBox="0 0 120 120">
          <circle id="ring-bg" cx="60" cy="60" r="50"/>
          <circle id="ring-fg" cx="60" cy="60" r="50"/>
        </svg>
        <div id="ring-inner"><div id="big-time">20:00</div></div>
      </div>
      <div id="phase-msg">Next break in 20 minutes</div>
      <button class="btn-primary" id="btn-toggle" onclick="toggleSession()">Start Session</button>
      <button class="btn-secondary" id="btn-skip" onclick="skipToBreak()" style="display:none;">Take Break Now</button>
    </div>
    <div class="card">
      <div class="card-title">Session Stats</div>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-val" id="s-sessions">0</div><div class="stat-lbl">Breaks Done</div></div>
        <div class="stat-box"><div class="stat-val" id="s-work">0</div><div class="stat-lbl">Work Mins</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">20-20-20 Rule</div>
      <p style="font-size:0.85rem;color:var(--muted);line-height:1.6;">Every <b style="color:var(--accent)">20 minutes</b>, look at something <b style="color:var(--accent)">20 feet away</b> for <b style="color:var(--accent)">20 seconds</b> to reduce eye strain.</p>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>

<div id="break-overlay">
  <div id="break-eye">👀</div>
  <div id="break-countdown">20</div>
  <div id="break-msg">Look at something 20 feet away<br>Relax your eyes...</div>
</div>

<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var WORK_MS = 20*60*1000;
var BREAK_MS = 20*1000;
var S = { useCount:0, removeAds:false, running:false, inBreak:false, remaining:WORK_MS, breakLeft:BREAK_MS, sessions:0, workMs:0, last:0, iv:null };

function p2(n){return String(n).padStart(2,'0');}
function fmtMs(ms) {
  var t=Math.max(0,Math.ceil(ms/1000));
  return p2(Math.floor(t/60))+':'+p2(t%60);
}

function toggleSession() {
  if(S.running){
    S.running=false;clearInterval(S.iv);S.iv=null;
  } else {
    S.running=true;S.last=Date.now();
    S.iv=setInterval(tick,250);
  }
  render();
}

function skipToBreak() {
  if(!S.running)return;
  S.remaining=0;
}

function startBreak() {
  S.inBreak=true;S.breakLeft=BREAK_MS;
  document.getElementById('break-overlay').classList.add('show');
}

function endBreak() {
  S.inBreak=false;S.remaining=WORK_MS;
  S.sessions++;
  document.getElementById('break-overlay').classList.remove('show');
  maybeInterstitial();
  render();
}

function tick() {
  var now=Date.now(), d=now-S.last; S.last=now;
  if(S.inBreak){
    S.breakLeft-=d;
    document.getElementById('break-countdown').textContent=Math.max(0,Math.ceil(S.breakLeft/1000));
    if(S.breakLeft<=0) endBreak();
    return;
  }
  S.remaining-=d;
  S.workMs+=d;
  if(S.remaining<=0){startBreak();}
  render();
}

function render() {
  if(S.inBreak)return;
  var pct=1-(S.remaining/WORK_MS);
  var dash=314;
  document.getElementById('ring-fg').style.strokeDashoffset=dash*(1-pct);
  document.getElementById('big-time').textContent=fmtMs(S.remaining);
  document.getElementById('phase-label').textContent=S.running?'Working':'Paused';
  document.getElementById('phase-msg').textContent=S.running?'Next break in '+fmtMs(S.remaining):'Session paused';
  document.getElementById('btn-toggle').textContent=S.running?'Pause':'Resume';
  document.getElementById('btn-skip').style.display=S.running?'block':'none';
  document.getElementById('s-sessions').textContent=S.sessions;
  document.getElementById('s-work').textContent=Math.floor(S.workMs/60000);
  if(!S.running){document.getElementById('btn-toggle').textContent=S.sessions===0&&S.remaining===WORK_MS?'Start Session':'Resume';}
}

render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPA Calculator</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#9C27B0; --accent2:#6A1B9A; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.gpa-display { text-align:center; padding:12px 0; }
.gpa-number { font-size:3.5rem; font-weight:700; color:var(--accent); line-height:1; }
.gpa-sub { color:var(--muted); font-size:0.9rem; margin-top:6px; }
.course-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; padding:10px; background:var(--card); border-radius:10px; }
.course-name { flex:2; background:transparent; border:none; color:var(--text); font-size:0.9rem; outline:none; min-width:0; }
.course-credits { width:48px; background:transparent; border:none; color:var(--text); font-size:0.9rem; text-align:center; outline:none; }
.course-grade { width:60px; background:var(--surface); border:none; color:var(--text); font-size:0.85rem; border-radius:6px; padding:6px 4px; outline:none; }
.del-btn { min-width:36px; min-height:36px; background:transparent; border:none; color:#c44; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.del-btn.btn-pressed { opacity:0.6; }
#btn-add { width:100%; min-height:48px; background:var(--accent); border:none; color:#fff; font-size:0.95rem; font-weight:700; border-radius:10px; cursor:pointer; margin-bottom:12px; }
#btn-add.btn-pressed { opacity:0.8; }
.dist-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:0.85rem; }
.dist-bar { flex:1; height:10px; background:var(--card); border-radius:5px; overflow:hidden; }
.dist-fill { height:100%; background:var(--accent); border-radius:5px; transition:width 0.3s; }
.dist-label { width:28px; color:var(--muted); font-size:0.78rem; }
.dist-count { width:24px; text-align:right; font-size:0.78rem; }
.course-header { display:flex; gap:8px; padding:0 10px 4px; font-size:0.68rem; color:var(--muted); text-transform:uppercase; }
.course-header span:first-child { flex:2; }
.course-header span:nth-child(2) { width:48px; text-align:center; }
.course-header span:nth-child(3) { width:60px; text-align:center; }
.course-header span:last-child { width:36px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>GPA <span>Calculator</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Current GPA</div>
      <div class="gpa-display">
        <div class="gpa-number" id="gpa-display">0.00</div>
        <div class="gpa-sub" id="gpa-sub">0 credit hours</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Courses</div>
      <div class="course-header">
        <span>Course Name</span><span>Cr</span><span>Grade</span><span></span>
      </div>
      <div id="courses-list"></div>
      <button id="btn-add">+ Add Course</button>
    </div>
    <div class="card" id="dist-card">
      <div class="card-title">Grade Distribution</div>
      <div id="dist-list"></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false };
var GRADE_POINTS = {'A+':4.0,'A':4.0,'A-':3.7,'B+':3.3,'B':3.0,'B-':2.7,'C+':2.3,'C':2.0,'C-':1.7,'D+':1.3,'D':1.0,'D-':0.7,'F':0.0};
var GRADES = Object.keys(GRADE_POINTS);
var courses = [];
var nextId = 0;

function addCourse(){
  courses.push({ id:nextId++, name:'', credits:3, grade:'B' });
  render();
  maybeInterstitial();
}

function removeCourse(id){
  courses = courses.filter(function(c){ return c.id !== id; });
  render();
}

function render(){
  var list = document.getElementById('courses-list');
  list.innerHTML = '';
  courses.forEach(function(c){
    var row = document.createElement('div');
    row.className = 'course-row';
    var gradeOpts = GRADES.map(function(g){ return '<option value="'+g+'"'+(c.grade===g?' selected':'')+'>'+g+'</option>'; }).join('');
    row.innerHTML = '<input class="course-name" type="text" placeholder="Course name" value="'+escH(c.name)+'" data-id="'+c.id+'" data-field="name">' +
      '<input class="course-credits" type="number" min="0.5" max="10" step="0.5" value="'+c.credits+'" data-id="'+c.id+'" data-field="credits">' +
      '<select class="course-grade" data-id="'+c.id+'" data-field="grade">'+gradeOpts+'</select>' +
      '<button class="del-btn" data-id="'+c.id+'">✕</button>';
    list.appendChild(row);
  });
  calcGPA();
}

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('courses-list').addEventListener('change', function(e){
  var el = e.target;
  var id = parseInt(el.dataset.id);
  var field = el.dataset.field;
  if(id===undefined||!field) return;
  var c = courses.find(function(x){ return x.id===id; });
  if(!c) return;
  if(field==='credits') c.credits = parseFloat(el.value)||0;
  else if(field==='grade') c.grade = el.value;
  calcGPA();
});

document.getElementById('courses-list').addEventListener('input', function(e){
  var el = e.target;
  var id = parseInt(el.dataset.id);
  var field = el.dataset.field;
  if(id===undefined||!field) return;
  var c = courses.find(function(x){ return x.id===id; });
  if(!c) return;
  if(field==='name') c.name = el.value;
  else if(field==='credits'){ c.credits = parseFloat(el.value)||0; calcGPA(); }
});

document.getElementById('courses-list').addEventListener('click', function(e){
  var btn = e.target.closest('.del-btn');
  if(!btn) return;
  removeCourse(parseInt(btn.dataset.id));
});

document.getElementById('btn-add').addEventListener('click', addCourse);

function calcGPA(){
  var totalPoints = 0, totalCredits = 0;
  var dist = {};
  GRADES.forEach(function(g){ dist[g]=0; });
  courses.forEach(function(c){
    if(c.credits>0){
      totalPoints += GRADE_POINTS[c.grade] * c.credits;
      totalCredits += c.credits;
      dist[c.grade]++;
    }
  });
  var gpa = totalCredits>0 ? totalPoints/totalCredits : 0;
  document.getElementById('gpa-display').textContent = gpa.toFixed(2);
  document.getElementById('gpa-sub').textContent = totalCredits+' credit hour'+(totalCredits!==1?'s':'')+' · '+courses.length+' course'+(courses.length!==1?'s':'');
  // Distribution
  var distList = document.getElementById('dist-list');
  distList.innerHTML = '';
  var maxCount = Math.max(1, Math.max.apply(null, Object.values(dist)));
  GRADES.forEach(function(g){
    if(dist[g]===0) return;
    var row = document.createElement('div');
    row.className = 'dist-row';
    var pct = (dist[g]/maxCount)*100;
    row.innerHTML = '<span class="dist-label">'+g+'</span><div class="dist-bar"><div class="dist-fill" style="width:'+pct+'%"></div></div><span class="dist-count">'+dist[g]+'</span>';
    distList.appendChild(row);
  });
}

// Start with 3 courses
addCourse(); addCourse(); addCourse();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

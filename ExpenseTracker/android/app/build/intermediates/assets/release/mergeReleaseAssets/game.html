<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expense Tracker</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#FF6F00; --accent2:#E65100; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.total-box { text-align:center; padding:8px 0; }
.total-label { font-size:0.75rem; color:var(--muted); margin-bottom:4px; }
.total-value { font-size:2.5rem; font-weight:700; color:var(--accent); }
input[type=text],input[type=number],input[type=date] { width:100%; background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 12px; border-radius:8px; outline:none; margin-bottom:8px; }
input:focus { box-shadow:0 0 0 2px var(--accent); }
select { width:100%; background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 12px; border-radius:8px; outline:none; margin-bottom:8px; }
.form-row { display:flex; gap:8px; }
.form-row input, .form-row select { margin-bottom:0; }
#btn-add { width:100%; min-height:48px; background:var(--accent); border:none; color:#fff; font-size:0.95rem; font-weight:700; border-radius:10px; cursor:pointer; margin-top:4px; }
#btn-add.btn-pressed { opacity:0.8; }
.expense-item { display:flex; align-items:flex-start; gap:10px; padding:12px; background:var(--card); border-radius:10px; margin-bottom:8px; }
.cat-icon { width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
.expense-info { flex:1; min-width:0; }
.expense-desc { font-size:0.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.expense-meta { font-size:0.72rem; color:var(--muted); margin-top:3px; }
.expense-amount { font-size:1.1rem; font-weight:700; color:var(--accent); flex-shrink:0; }
.del-btn { min-width:32px; min-height:32px; background:transparent; border:none; color:#c44; font-size:1rem; cursor:pointer; }
.del-btn.btn-pressed { opacity:0.6; }
.empty-msg { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px; }
.cat-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px; font-size:0.75rem; }
.cat-chip { background:var(--card); border-radius:20px; padding:3px 10px; color:var(--muted); }
.cat-chip strong { color:var(--accent); }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Expense <span>Tracker</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Total Spent</div>
      <div class="total-box">
        <div class="total-label">All Expenses</div>
        <div class="total-value" id="total-display">$0.00</div>
      </div>
      <div class="cat-chips" id="cat-chips"></div>
    </div>
    <div class="card">
      <div class="card-title">Add Expense</div>
      <div class="form-row">
        <input type="number" id="exp-amount" placeholder="Amount" min="0" step="0.01">
        <select id="exp-cat">
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Shopping">🛍 Shopping</option>
          <option value="Bills">💡 Bills</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Healthcare">🏥 Healthcare</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <input type="text" id="exp-note" placeholder="Note (optional)">
      <input type="date" id="exp-date">
      <button id="btn-add">Add Expense</button>
    </div>
    <div class="card">
      <div class="card-title">Expenses</div>
      <div id="expenses-list"><div class="empty-msg">No expenses yet.</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false };
var STORAGE_KEY = 'expense_tracker_v1';
var expenses = [];
var CAT_ICONS = {Food:'🍔',Transport:'🚗',Shopping:'🛍',Bills:'💡',Entertainment:'🎬',Healthcare:'🏥',Other:'📦'};
var CAT_COLORS = {Food:'#FF6F00',Transport:'#2196F3',Shopping:'#E91E63',Bills:'#FF9800',Entertainment:'#9C27B0',Healthcare:'#4CAF50',Other:'#607D8B'};

function load(){ try{ var d=localStorage.getItem(STORAGE_KEY); if(d) expenses=JSON.parse(d); }catch(e){} }
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses)); }catch(e){} }
function fmt(n){ return '$'+(n||0).toFixed(2); }
function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Set default date to today
(function(){ var d=new Date(); var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); document.getElementById('exp-date').value=ds; })();

function render(){
  var total=0;
  var catTotals={};
  expenses.forEach(function(e){ total+=e.amount; catTotals[e.category]=(catTotals[e.category]||0)+e.amount; });
  document.getElementById('total-display').textContent = fmt(total);
  // Cat chips
  var chips = document.getElementById('cat-chips');
  chips.innerHTML='';
  Object.keys(catTotals).sort(function(a,b){ return catTotals[b]-catTotals[a]; }).forEach(function(k){
    var chip = document.createElement('div');
    chip.className='cat-chip';
    chip.innerHTML=CAT_ICONS[k]+' '+k+' <strong>'+fmt(catTotals[k])+'</strong>';
    chips.appendChild(chip);
  });
  // List
  var list = document.getElementById('expenses-list');
  if(expenses.length===0){ list.innerHTML='<div class="empty-msg">No expenses yet.</div>'; return; }
  list.innerHTML='';
  var sorted = expenses.slice().reverse();
  sorted.forEach(function(e){
    var div=document.createElement('div');
    div.className='expense-item';
    var color=CAT_COLORS[e.category]||'#607D8B';
    div.innerHTML='<div class="cat-icon" style="background:'+color+'22">'+escH(CAT_ICONS[e.category]||'📦')+'</div>'+
      '<div class="expense-info"><div class="expense-desc">'+escH(e.note||e.category)+'</div>'+
      '<div class="expense-meta">'+e.category+' · '+e.date+'</div></div>'+
      '<div class="expense-amount">'+fmt(e.amount)+'</div>'+
      '<button class="del-btn" data-id="'+e.id+'">✕</button>';
    list.appendChild(div);
  });
}

document.getElementById('btn-add').addEventListener('click',function(){
  var amt=parseFloat(document.getElementById('exp-amount').value)||0;
  if(amt<=0) return;
  var cat=document.getElementById('exp-cat').value;
  var note=document.getElementById('exp-note').value.trim();
  var date=document.getElementById('exp-date').value;
  expenses.push({id:Date.now(),amount:amt,category:cat,note:note,date:date});
  save();
  document.getElementById('exp-amount').value='';
  document.getElementById('exp-note').value='';
  render();
  maybeInterstitial();
});

document.getElementById('expenses-list').addEventListener('click',function(e){
  var btn=e.target.closest('.del-btn');
  if(!btn) return;
  expenses=expenses.filter(function(x){ return x.id!==parseInt(btn.dataset.id); });
  save();
  render();
});

load();
render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

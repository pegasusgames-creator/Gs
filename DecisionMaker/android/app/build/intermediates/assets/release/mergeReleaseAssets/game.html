<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Decision Maker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  body{background:#12080d;color:#ffd0ff;font-family:'Arial',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
  h1{font-size:1.5rem;margin:12px 0 6px;color:#e060ff;letter-spacing:2px}
  #mode-tabs{display:flex;gap:0;margin:6px 0 10px;background:#ffffff10;border-radius:12px;overflow:hidden}
  .mode-tab{padding:8px 14px;font-size:0.78rem;cursor:pointer;color:#e060ff55;transition:background 0.15s,color 0.15s}
  .mode-tab.active{background:#e060ff33;color:#e060ff}
  /* Wheel */
  #wheel-section{display:flex;flex-direction:column;align-items:center}
  #wheel-opts{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:310px;padding:0 10px;margin-bottom:6px}
  .opt-chip{background:#ffffff10;border:1px solid #e060ff33;color:#ffd0ff;border-radius:16px;padding:4px 10px;font-size:0.77rem;display:flex;align-items:center;gap:3px}
  .opt-chip .rm{cursor:pointer;color:#e060ff66;font-size:0.7rem}
  #add-row{display:flex;gap:7px;margin-bottom:8px}
  #new-opt{background:#ffffff10;border:1px solid #e060ff33;color:#ffd0ff;border-radius:8px;padding:7px 10px;font-size:0.88rem;outline:none;width:170px}
  #add-btn{background:#e060ff33;border:1px solid #e060ff55;color:#e060ff;border-radius:8px;padding:7px 13px;cursor:pointer;font-size:1rem}
  #wheel-wrap{position:relative;width:240px;height:240px;margin:2px 0 8px}
  #wcanvas{border-radius:50%;box-shadow:0 0 24px #e060ff33}
  #wptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:22px solid #e060ff;filter:drop-shadow(0 2px 5px #e060ff88)}
  #spin-btn{background:linear-gradient(135deg,#8020b0,#e060ff);color:#12080d;border:none;border-radius:50px;padding:12px 36px;font-size:1.05rem;font-weight:bold;cursor:pointer;transition:transform 0.1s}
  #spin-btn:active{transform:scale(0.94)}
  #wheel-res{font-size:1.3rem;color:#e060ff;min-height:1.7rem;font-weight:bold;margin:6px 0}
  /* Yes/No */
  #yesno-section{display:none;flex-direction:column;align-items:center;gap:12px;padding-top:16px}
  #yn-q{background:#ffffff10;border:1px solid #e060ff33;color:#ffd0ff;border-radius:12px;padding:10px;font-size:0.9rem;outline:none;width:280px;text-align:center;min-height:52px;resize:none}
  #yn-btn{background:linear-gradient(135deg,#8020b0,#e060ff);color:#12080d;border:none;border-radius:50px;padding:12px 34px;font-size:1rem;font-weight:bold;cursor:pointer}
  #yn-res{font-size:2.8rem;min-height:3rem;font-weight:bold}
  /* 8-Ball */
  #eightball-section{display:none;flex-direction:column;align-items:center;gap:10px;padding-top:10px}
  #eb-q{background:#ffffff10;border:1px solid #e060ff33;color:#ffd0ff;border-radius:12px;padding:10px;font-size:0.9rem;outline:none;width:280px;text-align:center;min-height:52px;resize:none}
  #ball-wrap{position:relative;width:180px;height:180px;cursor:pointer}
  #ball-wrap svg{width:180px;height:180px}
  #ball-ans{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;text-align:center;font-size:0.72rem;color:#e0c0ff;font-weight:bold;line-height:1.3}
  #eb-btn{background:linear-gradient(135deg,#8020b0,#e060ff);color:#12080d;border:none;border-radius:50px;padding:11px 30px;font-size:0.95rem;font-weight:bold;cursor:pointer}
  #remove-ads{position:fixed;top:8px;right:8px;background:#ffffff10;border:1px solid #e060ff33;color:#e060ff55;font-size:0.65rem;padding:4px 8px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<button id="remove-ads" onclick="Android.purchase('remove_ads')">Remove Ads</button>
<h1>🔮 Decision Maker</h1>
<div id="mode-tabs">
  <div class="mode-tab active" onclick="showMode('wheel',this)">🎡 Wheel</div>
  <div class="mode-tab" onclick="showMode('yesno',this)">✅ Yes/No</div>
  <div class="mode-tab" onclick="showMode('eightball',this)">🎱 8-Ball</div>
</div>
<!-- Wheel -->
<div id="wheel-section">
  <div id="wheel-opts"></div>
  <div id="add-row"><input id="new-opt" type="text" placeholder="Add option…" maxlength="18"><button id="add-btn" onclick="addOpt()">+</button></div>
  <div id="wheel-wrap"><canvas id="wcanvas" width="240" height="240"></canvas><div id="wptr"></div></div>
  <div id="wheel-res"></div>
  <button id="spin-btn" onclick="spinWheel()">SPIN!</button>
</div>
<!-- Yes/No -->
<div id="yesno-section">
  <textarea id="yn-q" placeholder="Ask your question…"></textarea>
  <button id="yn-btn" onclick="doYesNo()">DECIDE!</button>
  <div id="yn-res"></div>
</div>
<!-- 8-Ball -->
<div id="eightball-section">
  <textarea id="eb-q" placeholder="Ask the magic 8-ball…"></textarea>
  <div id="ball-wrap" onclick="askBall()">
    <svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="86" fill="#1a0030" stroke="#5000a0" stroke-width="3"/><circle cx="90" cy="90" r="34" fill="#0a0020"/><text x="90" y="97" text-anchor="middle" fill="#e0c0ff" font-size="24" font-weight="bold">8</text></svg>
    <div id="ball-ans"></div>
  </div>
  <button id="eb-btn" onclick="askBall()">ASK</button>
</div>
<script>
const WC=['#e060ff','#9040c0','#c040a0','#7020a0','#ff60a0','#a040e0','#6030b0','#d050ff'];
let opts=JSON.parse(localStorage.getItem('dm_opts')||'["Pizza","Sushi","Burgers","Tacos"]'),spinning=false,wAngle=0,useCount=0;
function renderOpts(){const row=document.getElementById('wheel-opts');row.innerHTML='';opts.forEach((o,i)=>{const c=document.createElement('div');c.className='opt-chip';c.innerHTML='<span>'+o+'</span><span class="rm" onclick="rmOpt('+i+')">✕</span>';row.appendChild(c);});localStorage.setItem('dm_opts',JSON.stringify(opts));drawWheel(wAngle);}
function addOpt(){const v=document.getElementById('new-opt').value.trim();if(!v||opts.length>=12)return;opts.push(v);document.getElementById('new-opt').value='';renderOpts();}
function rmOpt(i){if(opts.length<=2)return;opts.splice(i,1);renderOpts();}
function drawWheel(rot){const canvas=document.getElementById('wcanvas'),ctx=canvas.getContext('2d'),cx=120,cy=120,r=110;ctx.clearRect(0,0,240,240);const sl=2*Math.PI/opts.length;opts.forEach((o,i)=>{const s=rot+i*sl;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,s+sl);ctx.closePath();ctx.fillStyle=WC[i%WC.length];ctx.fill();ctx.strokeStyle='#12080d';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(s+sl/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.fillText(o.length>10?o.slice(0,9)+'…':o,r-6,4);ctx.restore();});ctx.beginPath();ctx.arc(cx,cy,9,0,2*Math.PI);ctx.fillStyle='#12080d';ctx.fill();}
function spinWheel(){if(spinning||opts.length<2)return;spinning=true;document.getElementById('wheel-res').textContent='';document.getElementById('spin-btn').textContent='Spinning…';const extra=(5+Math.floor(Math.random()*5))*2*Math.PI,stop=Math.random()*2*Math.PI,total=extra+stop,dur=3000,t0=performance.now(),a0=wAngle;
(function anim(now){const t=Math.min((now-t0)/dur,1),e=1-Math.pow(1-t,3);wAngle=a0+total*e;drawWheel(wAngle);if(t<1)requestAnimationFrame(anim);else{spinning=false;document.getElementById('spin-btn').textContent='SPIN!';const n=((wAngle%(2*Math.PI))+2*Math.PI)%(2*Math.PI),sl=2*Math.PI/opts.length,pa=(2*Math.PI-Math.PI/2-n+2*Math.PI)%(2*Math.PI),idx=Math.floor(pa/sl)%opts.length;document.getElementById('wheel-res').textContent='🎯 '+opts[idx]+'!';if(navigator.vibrate)navigator.vibrate(200);if(++useCount%3===0&&window.Android)Android.showInterstitial();};})(t0);}
const YN=['✅ YES!','✅ YES!','✅ YES!','✅ YES!','✅ YES!','❌ NO!','❌ NO!','❌ NO!','❌ NO!','🤔 MAYBE…','😶 ASK AGAIN'];
function doYesNo(){document.getElementById('yn-res').textContent=YN[Math.floor(Math.random()*YN.length)];if(navigator.vibrate)navigator.vibrate(150);if(++useCount%3===0&&window.Android)Android.showInterstitial();}
const BA=['It is certain','It is decidedly so','Without a doubt','Yes definitely','You may rely on it','As I see it, yes','Most likely','Outlook good','Signs point to yes','Reply hazy, try again','Ask again later','Cannot predict now','Concentrate and ask again',"Don't count on it",'My reply is no','Outlook not so good','Very doubtful'];
function askBall(){document.getElementById('ball-ans').textContent=BA[Math.floor(Math.random()*BA.length)];if(navigator.vibrate)navigator.vibrate(200);if(++useCount%3===0&&window.Android)Android.showInterstitial();}
function showMode(m,btn){document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['wheel','yesno','eightball'].forEach(s=>document.getElementById(s+'-section').style.display='none');document.getElementById(m+'-section').style.display='flex';}
renderOpts();
window.onPurchaseComplete=function(id){if(id==='remove_ads'){document.getElementById('remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
</script>
</body>
</html>

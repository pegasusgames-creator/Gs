<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fruit Merge</title>
<style>
:root { --bg:#1b1b2f; --surface:#2a2a4a; --accent:#ff6b6b; --text:#f0f0f0; }
* { box-sizing:border-box; margin:0; padding:0; touch-action:manipulation; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100vh; overflow:hidden; }
#hdr { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:400px; padding:48px 16px 8px; }
#score-box { text-align:center; }
#score-label { font-size:0.7rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; }
#score-val { font-size:1.6rem; font-weight:700; color:var(--accent); }
#best-box { text-align:center; }
#best-label { font-size:0.7rem; color:#aaa; }
#best-val { font-size:1.1rem; font-weight:700; color:#f9ca24; }
#next-box { text-align:center; }
#next-label { font-size:0.7rem; color:#aaa; margin-bottom:4px; }
#next-canvas { display:block; margin:0 auto; }
#game-area { position:relative; }
#main-canvas { display:block; border-left:3px solid #4a4a8a; border-right:3px solid #4a4a8a; border-bottom:3px solid #4a4a8a; border-radius:0 0 10px 10px; touch-action:none; cursor:crosshair; }
#drop-line { position:absolute; top:0; left:0; width:100%; height:3px; background:rgba(255,107,107,0.4); pointer-events:none; }
#overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
#overlay.show { display:flex; }
#overlay h2 { font-size:2rem; color:var(--accent); margin-bottom:8px; }
#overlay p { color:#ccc; margin-bottom:20px; font-size:1.1rem; }
.btn { background:var(--accent); color:#fff; border:none; padding:14px 32px; border-radius:30px; font-size:1rem; font-weight:700; cursor:pointer; margin:6px; }
.btn:active { opacity:0.85; }
.btn-sec { background:#4a4a8a; }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;z-index:9999;background:#533483;border:none;color:#fff;font-size:0.7rem;font-weight:600;padding:5px 10px;border-radius:20px;cursor:pointer;">Remove Ads</button>

<div id="hdr">
  <div id="score-box"><div id="score-label">Score</div><div id="score-val">0</div></div>
  <div id="next-box"><div id="next-label">Next</div><canvas id="next-canvas" width="50" height="50"></canvas></div>
  <div id="best-box"><div id="best-label">Best</div><div id="best-val">0</div></div>
</div>

<div id="game-area">
  <div id="drop-line"></div>
  <canvas id="main-canvas"></canvas>
</div>

<div id="overlay">
  <h2>Game Over!</h2>
  <p id="over-score">Score: 0</p>
  <button class="btn" onclick="initGame()">Play Again</button>
</div>

<script>
const FRUITS=[
  {name:'Cherry',   r:14, color:'#c0392b', emoji:'🍒'},
  {name:'Strawberry',r:18,color:'#e74c3c', emoji:'🍓'},
  {name:'Grape',    r:22, color:'#8e44ad', emoji:'🍇'},
  {name:'Dekopon',  r:27, color:'#e67e22', emoji:'🍊'},
  {name:'Persimmon',r:32, color:'#d35400', emoji:'🍅'},
  {name:'Apple',    r:38, color:'#27ae60', emoji:'🍎'},
  {name:'Pear',     r:44, color:'#f1c40f', emoji:'🍐'},
  {name:'Peach',    r:50, color:'#ff9ff3', emoji:'🍑'},
  {name:'Pineapple',r:56, color:'#f9ca24', emoji:'🍍'},
  {name:'Melon',    r:64, color:'#6ab04c', emoji:'🍈'},
  {name:'Watermelon',r:72,color:'#ff4757',emoji:'🍉'}
];
const SCORES=[1,3,6,10,15,21,28,36,45,55,66];
const COLS=7;
let CW=350, CH=480, CELL=50;
let canvas, ctx, nextCvs, nextCtx;
let grid=[], score=0, best=+localStorage.getItem('fm_best')||0, nextType=0;
let dropX=CW/2, gameOver=false, dropping=false;
// Falling animation
let fallingFruit=null, dropY=0;

function init(){
  canvas=document.getElementById('main-canvas');
  ctx=canvas.getContext('2d');
  nextCvs=document.getElementById('next-canvas');
  nextCtx=nextCvs.getContext('2d');
  const avail=Math.min(window.innerWidth-6,400);
  CW=avail; CELL=Math.floor(CW/COLS); CH=Math.floor(CELL*9.5);
  canvas.width=CW; canvas.height=CH;
  document.getElementById('game-area').style.width=CW+'px';
  document.getElementById('best-val').textContent=best;
  initGame();
}

function initGame(){
  grid=Array.from({length:COLS},()=>[]);
  score=0; gameOver=false; dropping=false; fallingFruit=null;
  document.getElementById('score-val').textContent=0;
  document.getElementById('overlay').classList.remove('show');
  nextType=randType();
  dropX=CW/2;
  drawNext();
  drawBoard();
  requestAnimationFrame(loop);
}

function randType(){ return Math.floor(Math.random()*5); }

function drawNext(){
  nextCtx.clearRect(0,0,50,50);
  const f=FRUITS[nextType];
  nextCtx.fillStyle=f.color;
  nextCtx.beginPath(); nextCtx.arc(25,25,f.r*0.7,0,Math.PI*2); nextCtx.fill();
  nextCtx.font=`${Math.round(f.r*1.0)}px sans-serif`;
  nextCtx.textAlign='center'; nextCtx.textBaseline='middle';
  nextCtx.fillText(f.emoji,25,25);
}

function drawBoard(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle='#1b1b2f'; ctx.fillRect(0,0,CW,CH);
  // grid lines (columns)
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for(let c=0;c<COLS;c++){ ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,CH); ctx.stroke(); }
  // danger line
  ctx.strokeStyle='rgba(255,100,100,0.35)'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(0,CELL*1.5); ctx.lineTo(CW,CELL*1.5); ctx.stroke();
  ctx.setLineDash([]);
  // draw stacked fruits
  for(let c=0;c<COLS;c++){
    grid[c].forEach((type,row)=>{
      const f=FRUITS[type];
      const x=(c+0.5)*CELL, y=CH-(row+0.5)*CELL;
      drawFruitAt(ctx,f,x,y,CELL*0.42);
    });
  }
  // draw falling fruit preview (drop indicator)
  if(!dropping&&!gameOver){
    const col=Math.min(Math.max(Math.floor(dropX/CELL),0),COLS-1);
    const f=FRUITS[nextType];
    const stackH=grid[col].length;
    const gy=CH-(stackH+0.5)*CELL;
    // guide line
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo((col+0.5)*CELL,CELL*1.3); ctx.lineTo((col+0.5)*CELL,gy-CELL*0.5); ctx.stroke();
    ctx.setLineDash([]);
    drawFruitAt(ctx,f,(col+0.5)*CELL,CELL*0.65,CELL*0.42);
  }
  // draw falling animation
  if(fallingFruit){
    const f=FRUITS[fallingFruit.type];
    drawFruitAt(ctx,f,fallingFruit.x,fallingFruit.y,CELL*0.42);
  }
}

function drawFruitAt(c,f,x,y,r){
  c.save();
  c.shadowColor=f.color; c.shadowBlur=8;
  c.fillStyle=f.color; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
  c.restore();
  c.font=`${Math.round(r*1.5)}px sans-serif`; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(f.emoji,x,y);
}

canvas.addEventListener('mousemove',e=>{ if(gameOver||dropping)return; const rect=canvas.getBoundingClientRect(); dropX=e.clientX-rect.left; drawBoard(); });
canvas.addEventListener('click',e=>{ if(gameOver||dropping)return; const rect=canvas.getBoundingClientRect(); dropX=e.clientX-rect.left; doDropTouch(); });
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); if(gameOver||dropping)return; const rect=canvas.getBoundingClientRect(); dropX=e.touches[0].clientX-rect.left; drawBoard(); },{passive:false});
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); if(gameOver||dropping)return; const rect=canvas.getBoundingClientRect(); dropX=e.touches[0].clientX-rect.left; drawBoard(); },{passive:false});
canvas.addEventListener('touchend',e=>{ e.preventDefault(); if(gameOver||dropping)return; doDropTouch(); },{passive:false});

function doDropTouch(){
  if(dropping||gameOver)return;
  const col=Math.min(Math.max(Math.floor(dropX/CELL),0),COLS-1);
  startDrop(col);
}

function startDrop(col){
  dropping=true;
  const stackH=grid[col].length;
  const targetY=CH-(stackH+0.5)*CELL;
  fallingFruit={type:nextType, x:(col+0.5)*CELL, y:CELL*0.65, col, targetY};
}

function loop(){
  if(gameOver)return;
  if(fallingFruit){
    fallingFruit.y+=12;
    if(fallingFruit.y>=fallingFruit.targetY){
      landFruit(fallingFruit.col, fallingFruit.type);
      fallingFruit=null; dropping=false;
    }
  }
  drawBoard();
  requestAnimationFrame(loop);
}

function landFruit(col, type){
  grid[col].push(type);
  mergeCheck(col);
  // check game over
  if(grid[col].length*CELL > CH-CELL*1.5){
    endGame(); return;
  }
  nextType=randType(); drawNext(); dropX=CW/2;
}

function mergeCheck(col){
  let changed=true;
  while(changed){
    changed=false;
    for(let c=0;c<COLS;c++){
      for(let r=0;r<grid[c].length-1;r++){
        if(grid[c][r]===grid[c][r+1]&&grid[c][r]<FRUITS.length-1){
          const newType=grid[c][r]+1;
          grid[c].splice(r,2,newType);
          addScore(SCORES[newType]);
          changed=true; break;
        }
      }
      if(changed)break;
    }
    // cross-column merges: check adjacent columns at same row height
    if(!changed){
      outer:
      for(let c=0;c<COLS-1;c++){
        const minLen=Math.min(grid[c].length,grid[c+1].length);
        for(let r=0;r<minLen;r++){
          if(grid[c][r]===grid[c+1][r]&&grid[c][r]<FRUITS.length-1){
            const newType=grid[c][r]+1;
            // place merged in left column at same height
            grid[c].splice(r,1,newType);
            grid[c+1].splice(r,1);
            addScore(SCORES[newType]);
            changed=true; break outer;
          }
        }
      }
    }
  }
}

function addScore(pts){
  score+=pts;
  document.getElementById('score-val').textContent=score;
  if(score>best){ best=score; localStorage.setItem('fm_best',best); document.getElementById('best-val').textContent=best; }
}

function endGame(){
  gameOver=true; _showInterstitial();
  document.getElementById('over-score').textContent='Score: '+score;
  document.getElementById('overlay').classList.add('show');
}

window.addEventListener('load',init);

var _adsRemoved=false, _interstitialCount=0;
function _showInterstitial(){
  if(_adsRemoved)return; _interstitialCount++;
  if(_interstitialCount%3===0&&window.Android){try{Android.showInterstitial();}catch(e){}}
}
window.onPurchaseComplete=function(sku){
  if(sku==='remove_ads'){
    _adsRemoved=true;
    var btn=document.getElementById('btn-remove-ads');
    if(btn)btn.style.display='none';
    if(window.Android){try{Android.hideBannerAd();}catch(e){}}
  }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cryptogram</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #1a1200; color: #e0d0b0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
:root { --accent: #FFA726; --light: #FFD180; }
header { background: #2a1f00; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
header h1 { font-size: 1.3rem; color: var(--light); letter-spacing: 2px; }
.puzzle-area { padding: 16px; flex: 1; overflow-y: auto; }
.quote-display { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-bottom: 16px; line-height: 2.2; }
.word-block { display: flex; gap: 2px; }
.letter-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.cipher-letter { font-size: 1rem; font-weight: 700; color: var(--accent); background: #2a1f00; border: 1px solid #555; border-radius: 4px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
.cipher-letter.selected { background: var(--accent); color: #000; }
.cipher-letter.filled { background: #1a3a1a; border-color: #66bb6a; }
.answer-letter { font-size: 1rem; font-weight: 700; color: #fff; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #555; min-height: 28px; }
.answer-letter.correct { color: #66bb6a; border-bottom-color: #66bb6a; }
.answer-letter.wrong { color: #ef5350; }
.non-letter { font-size: 1rem; padding: 0 2px; align-self: flex-end; color: #999; }
.keyboard { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; padding: 12px; }
.key { background: #2a1f00; border: 1px solid #555; border-radius: 6px; padding: 8px 4px; text-align: center; font-size: 0.9rem; font-weight: 700; color: #e0d0b0; cursor: pointer; transition: all 0.1s; }
.key.used { background: #1a3a1a; color: #66bb6a; border-color: #66bb6a; }
.key.btn-pressed { opacity: 0.6; transform: scale(0.9); }
.toolbar { display: flex; gap: 8px; padding: 8px 16px; }
.btn { flex: 1; background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 11px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.15s; }
.btn.btn-pressed { opacity: 0.6; transform: scale(0.96); }
.btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--light); }
.progress-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 0.85rem; color: #aaa; }
.progress-bar { height: 6px; background: #333; border-radius: 3px; margin: 0 16px 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
.hint-count { color: var(--light); font-weight: 700; }
.success-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
.success-overlay.show { display: flex; }
.success-box { background: #2a1f00; border: 2px solid var(--accent); border-radius: 16px; padding: 28px; text-align: center; max-width: 300px; width: 90%; }
.success-box h2 { font-size: 1.6rem; color: var(--light); margin-bottom: 8px; }
.success-box p { color: #ccc; margin-bottom: 16px; font-size: 0.9rem; }
.puzzle-num { text-align: center; color: var(--accent); font-size: 0.8rem; padding: 4px; }
</style>
</head>
<body>
<button id="btn-remove-ads" onclick="if(window.Android)Android.purchase('remove_ads')" style="position:fixed;top:8px;right:8px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:0.65rem;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;z-index:9999;letter-spacing:0.5px">Remove Ads</button>
<header>
  <h1>CRYPTOGRAM</h1>
  <span class="hint-count">Hints: <span id="hint-count">3</span></span>
</header>
<div class="progress-row">
  <span id="puzzle-info">Puzzle 1 of 30</span>
  <span id="solved-count">0 / 0 letters</span>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

<div class="puzzle-area">
  <div class="quote-display" id="quote-display"></div>
  <div class="puzzle-num" id="attribution"></div>
</div>

<div class="keyboard" id="keyboard"></div>
<div class="toolbar">
  <button class="btn btn-outline" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="useHint()">Hint</button>
  <button class="btn btn-outline" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="prevPuzzle()">◀ Prev</button>
  <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="nextPuzzle()">Next ▶</button>
</div>

<div class="success-overlay" id="success-overlay">
  <div class="success-box">
    <h2>🎉 Solved!</h2>
    <p id="success-attr"></p>
    <button class="btn" ontouchstart="this.classList.add('btn-pressed')" ontouchend="this.classList.remove('btn-pressed')" onclick="nextPuzzle();document.getElementById('success-overlay').classList.remove('show')">Next Puzzle</button>
  </div>
</div>



<script>
const PUZZLES = [
  { text: "THE ONLY WAY TO DO GREAT WORK IS TO LOVE WHAT YOU DO", attr: "— Steve Jobs" },
  { text: "IN THE MIDDLE OF DIFFICULTY LIES OPPORTUNITY", attr: "— Albert Einstein" },
  { text: "LIFE IS WHAT HAPPENS WHEN YOU ARE BUSY MAKING OTHER PLANS", attr: "— John Lennon" },
  { text: "GET BUSY LIVING OR GET BUSY DYING", attr: "— Stephen King" },
  { text: "YOU ONLY LIVE ONCE BUT IF YOU DO IT RIGHT ONCE IS ENOUGH", attr: "— Mae West" },
  { text: "MANY OF LIFE FAILURES ARE PEOPLE WHO DID NOT REALIZE HOW CLOSE THEY WERE TO SUCCESS WHEN THEY GAVE UP", attr: "— Thomas Edison" },
  { text: "YOU HAVE BRAINS IN YOUR HEAD AND FEET IN YOUR SHOES", attr: "— Dr. Seuss" },
  { text: "IF LIFE WERE PREDICTABLE IT WOULD CEASE TO BE LIFE AND BE WITHOUT FLAVOR", attr: "— Eleanor Roosevelt" },
  { text: "IF YOU LOOK AT WHAT YOU HAVE IN LIFE YOU WILL ALWAYS HAVE MORE", attr: "— Oprah Winfrey" },
  { text: "IF YOU WANT TO LIVE A HAPPY LIFE TIE IT TO A GOAL NOT TO PEOPLE OR OBJECTS", attr: "— Albert Einstein" },
  { text: "NEVER LET THE FEAR OF STRIKING OUT KEEP YOU FROM PLAYING THE GAME", attr: "— Babe Ruth" },
  { text: "MONEY AND SUCCESS DONT CHANGE PEOPLE THEY MERELY AMPLIFY WHAT IS ALREADY THERE", attr: "— Will Smith" },
  { text: "YOUR TIME IS LIMITED SO DONT WASTE IT LIVING SOMEONE ELSES LIFE", attr: "— Steve Jobs" },
  { text: "NOT HOW LONG BUT HOW WELL YOU HAVE LIVED IS THE MAIN THING", attr: "— Seneca" },
  { text: "IF LIFE IS A JOURNEY THEN EVERY STEP IS A DESTINATION", attr: "— Unknown" },
  { text: "YOU MISS ONE HUNDRED PERCENT OF THE SHOTS YOU DONT TAKE", attr: "— Wayne Gretzky" },
  { text: "WHETHER YOU THINK YOU CAN OR YOU THINK YOU CANT YOU ARE RIGHT", attr: "— Henry Ford" },
  { text: "THE TWO MOST IMPORTANT DAYS IN YOUR LIFE ARE THE DAY YOU ARE BORN AND THE DAY YOU FIND OUT WHY", attr: "— Mark Twain" },
  { text: "WHATEVER THE MIND OF MAN CAN CONCEIVE AND BELIEVE IT CAN ACHIEVE", attr: "— Napoleon Hill" },
  { text: "STRIVE NOT TO BE A SUCCESS BUT RATHER TO BE OF VALUE", attr: "— Albert Einstein" },
  { text: "TWO ROADS DIVERGED IN A WOOD AND I TOOK THE ONE LESS TRAVELED BY", attr: "— Robert Frost" },
  { text: "I ATTRIBUTE MY SUCCESS TO THIS I NEVER GAVE OR TOOK ANY EXCUSE", attr: "— Florence Nightingale" },
  { text: "YOU MISS ONE HUNDRED PERCENT OF THE SHOTS YOU NEVER TAKE", attr: "— Wayne Gretzky" },
  { text: "I HAVE NOT FAILED I HAVE JUST FOUND TEN THOUSAND WAYS THAT WONT WORK", attr: "— Thomas Edison" },
  { text: "THE MOST COMMON WAY PEOPLE GIVE UP THEIR POWER IS BY THINKING THEY DONT HAVE ANY", attr: "— Alice Walker" },
  { text: "BELIEVE YOU CAN AND YOU ARE HALFWAY THERE", attr: "— Theodore Roosevelt" },
  { text: "EDUCATION IS THE MOST POWERFUL WEAPON WHICH YOU CAN USE TO CHANGE THE WORLD", attr: "— Nelson Mandela" },
  { text: "IT DOES NOT MATTER HOW SLOWLY YOU GO AS LONG AS YOU DO NOT STOP", attr: "— Confucius" },
  { text: "EVERYTHING YOU HAVE EVER WANTED IS ON THE OTHER SIDE OF FEAR", attr: "— George Addair" },
  { text: "DREAM BIG AND DARE TO FAIL", attr: "— Norman Vaughan" }
];

let currentPuzzle = 0, cipher = {}, userMap = {}, selectedCipher = null, hints = 3;

function buildCipher() {
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const shuffled = [...letters].sort(() => Math.random() - 0.5);
  cipher = {};
  letters.forEach((l, i) => { cipher[l] = shuffled[i]; });
  // ensure no letter maps to itself
  letters.forEach(l => { if (cipher[l] === l) { const j = (letters.indexOf(l) + 1) % 26; cipher[l] = shuffled[j]; cipher[letters[j]] = shuffled[letters.indexOf(l)]; } });
}

function loadPuzzle(idx) {
  currentPuzzle = idx;
  buildCipher();
  userMap = {};
  selectedCipher = null;
  hints = 3;
  document.getElementById('hint-count').textContent = hints;
  renderPuzzle();
  renderKeyboard();
  document.getElementById('puzzle-info').textContent = 'Puzzle ' + (idx + 1) + ' of ' + PUZZLES.length;
  document.getElementById('attribution').textContent = PUZZLES[idx].attr;
}

function renderPuzzle() {
  const text = PUZZLES[currentPuzzle].text;
  const display = document.getElementById('quote-display');
  display.innerHTML = '';
  const words = text.split(' ');
  let totalLetters = text.replace(/[^A-Z]/g, '').length;
  let solvedLetters = 0;

  words.forEach(word => {
    const block = document.createElement('div');
    block.className = 'word-block';
    for (const ch of word) {
      if (/[A-Z]/.test(ch)) {
        const enc = cipher[ch];
        const box = document.createElement('div');
        box.className = 'letter-box';
        box.dataset.cipher = enc;
        box.dataset.plain = ch;

        const cl = document.createElement('div');
        cl.className = 'cipher-letter' + (selectedCipher === enc ? ' selected' : '') + (userMap[enc] ? ' filled' : '');
        cl.textContent = enc;
        cl.addEventListener('click', () => selectCipherLetter(enc));

        const al = document.createElement('div');
        const guessed = userMap[enc] || '';
        al.className = 'answer-letter' + (guessed ? (guessed === ch ? ' correct' : ' wrong') : '');
        al.textContent = guessed;
        if (guessed === ch) solvedLetters++;

        box.appendChild(cl);
        box.appendChild(al);
        block.appendChild(box);
      } else {
        const sp = document.createElement('div');
        sp.className = 'non-letter';
        sp.textContent = ch;
        block.appendChild(sp);
      }
    }
    display.appendChild(block);
  });

  const pct = totalLetters ? Math.round(solvedLetters / totalLetters * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('solved-count').textContent = solvedLetters + ' / ' + totalLetters + ' letters';

  if (solvedLetters === totalLetters && totalLetters > 0) {
    document.getElementById('success-attr').textContent = PUZZLES[currentPuzzle].attr;
    setTimeout(() => document.getElementById('success-overlay').classList.add('show'), 400);
  }
}

function selectCipherLetter(enc) {
  selectedCipher = enc;
  renderPuzzle();
  renderKeyboard();
}

function pressKey(letter) {
  if (!selectedCipher) return;
  userMap[selectedCipher] = letter;
  // advance to next unresolved cipher letter
  const text = PUZZLES[currentPuzzle].text;
  const cipherLetters = [...new Set(text.replace(/[^A-Z]/g,'').split('').map(c => cipher[c]))];
  const idx = cipherLetters.indexOf(selectedCipher);
  for (let i = 1; i <= cipherLetters.length; i++) {
    const next = cipherLetters[(idx + i) % cipherLetters.length];
    if (!userMap[next]) { selectedCipher = next; break; }
  }
  renderPuzzle();
  renderKeyboard();
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  const usedPlain = new Set(Object.values(userMap));
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
    const key = document.createElement('div');
    key.className = 'key' + (usedPlain.has(l) ? ' used' : '');
    key.textContent = l;
    key.addEventListener('touchstart', e => { e.preventDefault(); key.classList.add('btn-pressed'); pressKey(l); });
    key.addEventListener('touchend', () => key.classList.remove('btn-pressed'));
    key.addEventListener('click', () => pressKey(l));
    kb.appendChild(key);
  });
  // backspace
  const del = document.createElement('div');
  del.className = 'key';
  del.textContent = '⌫';
  del.style.gridColumn = 'span 2';
  del.addEventListener('click', () => { if (selectedCipher) { delete userMap[selectedCipher]; renderPuzzle(); renderKeyboard(); } });
  kb.appendChild(del);
}

function useHint() {
  if (hints <= 0) return;
  const text = PUZZLES[currentPuzzle].text;
  const cipherLetters = [...new Set(text.replace(/[^A-Z]/g,'').split('').map(c => cipher[c]))];
  const unsolved = cipherLetters.filter(c => !userMap[c] || userMap[c] !== getPlainFor(c));
  if (unsolved.length === 0) return;
  const pick = unsolved[Math.floor(Math.random() * unsolved.length)];
  userMap[pick] = getPlainFor(pick);
  hints--;
  document.getElementById('hint-count').textContent = hints;
  renderPuzzle();
  renderKeyboard();
}

function getPlainFor(encLetter) {
  return Object.keys(cipher).find(k => cipher[k] === encLetter) || '';
}

function nextPuzzle() {
  loadPuzzle((currentPuzzle + 1) % PUZZLES.length);
  document.getElementById('success-overlay').classList.remove('show');
}

function prevPuzzle() {
  loadPuzzle((currentPuzzle - 1 + PUZZLES.length) % PUZZLES.length);
}

loadPuzzle(0);
window.onPurchaseComplete = function(sku) { console.log('Purchase:', sku); };
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────

// ── AppLovin MAX / IAP bridge ──────────────────────────────────────────
var _adsRemoved = false;
var _interstitialCount = 0;

function _showInterstitial() {
  if (_adsRemoved) return;
  _interstitialCount++;
  if (_interstitialCount % 3 === 0 && window.Android) {
    try { Android.showInterstitial(); } catch(e) {}
  }
}

window.onPurchaseComplete = function(sku) {
  if (sku === 'remove_ads') {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
    if (window.Android) { try { Android.hideBannerAd(); } catch(e) {} }
  }
};

// Restore remove-ads state on load
if (window.Android) {
  try { if (Android.isPurchased && Android.isPurchased('remove_ads')) {
    _adsRemoved = true;
    var btn = document.getElementById('btn-remove-ads');
    if (btn) btn.style.display = 'none';
  }} catch(e) {}
}

</script>
</body>
</html>

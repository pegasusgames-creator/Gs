<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bill Split</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#4CAF50; --accent2:#388E3C; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
input[type=number] { width:100%; background:var(--card); border:none; color:var(--text); font-size:1rem; padding:10px 12px; border-radius:8px; outline:none; margin-bottom:12px; }
input[type=number]:focus { box-shadow:0 0 0 2px var(--accent); }
.tip-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.tip-btn { flex:1; min-width:44px; min-height:44px; background:var(--card); border:2px solid transparent; color:var(--text); font-size:0.9rem; font-weight:600; border-radius:8px; cursor:pointer; }
.tip-btn.active { border-color:var(--accent); color:var(--accent); }
.tip-btn.btn-pressed { opacity:0.7; }
.custom-wrap { display:none; margin-bottom:12px; }
.custom-wrap.show { display:block; }
.result-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.result-item { background:var(--card); border-radius:10px; padding:12px; text-align:center; }
.result-label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.result-value { font-size:1.3rem; font-weight:700; color:var(--accent); }
.result-item.highlight { grid-column:span 2; background:#1a3a1a; border:2px solid var(--accent); }
.result-item.highlight .result-value { font-size:1.8rem; color:var(--accent); }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Bill <span>Split</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Bill Details</div>
      <label>Total Bill ($)</label>
      <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
      <label>Number of People</label>
      <input type="number" id="people" placeholder="2" min="1" step="1" value="2">
      <label>Tip Percentage</label>
      <div class="tip-row" id="tip-row">
        <button class="tip-btn" data-tip="10">10%</button>
        <button class="tip-btn active" data-tip="15">15%</button>
        <button class="tip-btn" data-tip="18">18%</button>
        <button class="tip-btn" data-tip="20">20%</button>
        <button class="tip-btn" data-tip="25">25%</button>
        <button class="tip-btn" data-tip="custom">Custom</button>
      </div>
      <div class="custom-wrap" id="custom-wrap">
        <label>Custom Tip %</label>
        <input type="number" id="custom-tip" placeholder="0" min="0" step="1">
      </div>
    </div>
    <div class="card">
      <div class="card-title">Results</div>
      <div class="result-grid">
        <div class="result-item"><div class="result-label">Tip Amount</div><div class="result-value" id="r-tip">$0.00</div></div>
        <div class="result-item"><div class="result-label">Total with Tip</div><div class="result-value" id="r-total">$0.00</div></div>
        <div class="result-item"><div class="result-label">Per Person (no tip)</div><div class="result-value" id="r-pp">$0.00</div></div>
        <div class="result-item highlight"><div class="result-label">Per Person with Tip</div><div class="result-value" id="r-pp-tip">$0.00</div></div>
      </div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, tipPct:15 };

function fmt(n){ return '$'+n.toFixed(2); }

function calc(){
  var bill = parseFloat(document.getElementById('bill').value)||0;
  var people = Math.max(1, parseInt(document.getElementById('people').value)||1);
  var tip = state.tipPct;
  var tipAmt = bill * tip / 100;
  var total = bill + tipAmt;
  document.getElementById('r-tip').textContent = fmt(tipAmt);
  document.getElementById('r-total').textContent = fmt(total);
  document.getElementById('r-pp').textContent = fmt(bill / people);
  document.getElementById('r-pp-tip').textContent = fmt(total / people);
}

document.getElementById('bill').addEventListener('input', calc);
document.getElementById('people').addEventListener('input', calc);

document.getElementById('tip-row').addEventListener('click', function(e){
  var btn = e.target.closest('.tip-btn');
  if(!btn) return;
  document.querySelectorAll('.tip-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  var t = btn.dataset.tip;
  if(t === 'custom'){
    document.getElementById('custom-wrap').classList.add('show');
    state.tipPct = parseFloat(document.getElementById('custom-tip').value)||0;
  } else {
    document.getElementById('custom-wrap').classList.remove('show');
    state.tipPct = parseInt(t);
  }
  calc();
  maybeInterstitial();
});

document.getElementById('custom-tip').addEventListener('input', function(){
  state.tipPct = parseFloat(this.value)||0;
  calc();
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex'; calc();}
init();
</script>
</body>
</html>

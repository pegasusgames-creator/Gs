<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chore Chart</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#9CCC65; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
/* Tab bar */
#tabs { display:flex; gap:6px; padding:0 14px 10px; flex-shrink:0; }
.tab { flex:1; padding:8px 4px; border:none; border-radius:10px; font-size:0.8rem; font-weight:600; cursor:pointer; background:var(--card); color:var(--muted); }
.tab.active { background:var(--accent); color:#1a1a2e; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
/* Add form */
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:8px; }
.form-grid input, .form-grid select { padding:9px 10px; border-radius:9px; border:none; background:var(--card); color:var(--text); font-size:0.85rem; }
.form-full { grid-column:1/-1; }
.btn-add { background:var(--accent); border:none; border-radius:10px; color:#1a1a2e; font-size:0.95rem; font-weight:700; padding:11px; cursor:pointer; width:100%; }
/* Chore items */
.chore-item { display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--card); border-radius:10px; margin-bottom:7px; }
.chore-check { width:22px; height:22px; border-radius:7px; border:2px solid var(--muted); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.chore-check.done { background:var(--accent); border-color:var(--accent); }
.chore-check.done::after { content:'✓'; color:#1a1a2e; font-size:0.85rem; font-weight:700; }
.chore-info { flex:1; min-width:0; }
.chore-name { font-size:0.9rem; font-weight:600; }
.chore-item.done .chore-name { text-decoration:line-through; color:var(--muted); }
.chore-meta { font-size:0.7rem; color:var(--muted); margin-top:2px; }
.chore-del { background:none; border:none; color:#FF7043; cursor:pointer; font-size:0.9rem; padding:0 2px; }
/* Stats */
.stats-row { display:flex; justify-content:space-around; margin-bottom:10px; }
.stat-box { text-align:center; }
.stat-val { font-size:1.8rem; font-weight:700; color:var(--accent); }
.stat-lbl { font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.progress-bar { height:8px; background:var(--card); border-radius:4px; overflow:hidden; margin-bottom:12px; }
.progress-fill { height:100%; background:var(--accent); border-radius:4px; transition:width 0.4s; }
.btn-reset { background:var(--card); border:none; border-radius:10px; color:var(--muted); font-size:0.85rem; padding:10px; cursor:pointer; width:100%; border:1px solid rgba(255,255,255,0.08); }
.empty-msg { text-align:center; color:var(--muted); padding:20px 0; font-size:0.85rem; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Chore <span>Chart</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="tabs">
    <button class="tab active" onclick="showTab('chores',this)">Chores</button>
    <button class="tab" onclick="showTab('add',this)">+ Add</button>
    <button class="tab" onclick="showTab('stats',this)">Stats</button>
  </div>
  <div id="scroll">
    <!-- Chores tab -->
    <div id="tab-chores">
      <div class="card" style="padding:10px 12px;">
        <div style="display:flex;gap:6px;flex-wrap:wrap;" id="day-filters">
          <button class="tab" id="df-all" onclick="setFilter('all',this)" style="flex:0;padding:6px 12px;">All</button>
          <button class="tab" onclick="setFilter('Sun',this)" style="flex:0;padding:6px 10px;">Sun</button>
          <button class="tab" onclick="setFilter('Mon',this)" style="flex:0;padding:6px 10px;">Mon</button>
          <button class="tab" onclick="setFilter('Tue',this)" style="flex:0;padding:6px 10px;">Tue</button>
          <button class="tab" onclick="setFilter('Wed',this)" style="flex:0;padding:6px 10px;">Wed</button>
          <button class="tab" onclick="setFilter('Thu',this)" style="flex:0;padding:6px 10px;">Thu</button>
          <button class="tab" onclick="setFilter('Fri',this)" style="flex:0;padding:6px 10px;">Fri</button>
          <button class="tab" onclick="setFilter('Sat',this)" style="flex:0;padding:6px 10px;">Sat</button>
        </div>
      </div>
      <div id="chores-list"></div>
    </div>
    <!-- Add tab -->
    <div id="tab-add" style="display:none;">
      <div class="card">
        <div class="card-title">New Chore</div>
        <div class="form-grid">
          <input type="text" id="c-name" placeholder="Chore name…" maxlength="30" class="form-full">
          <input type="text" id="c-person" placeholder="Assigned to…" maxlength="20">
          <select id="c-day">
            <option value="Daily">Daily</option>
            <option value="Sun">Sunday</option>
            <option value="Mon">Monday</option>
            <option value="Tue">Tuesday</option>
            <option value="Wed">Wednesday</option>
            <option value="Thu">Thursday</option>
            <option value="Fri">Friday</option>
            <option value="Sat">Saturday</option>
          </select>
          <select id="c-repeat">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <button class="btn-add" onclick="addChore()">Add Chore</button>
      </div>
    </div>
    <!-- Stats tab -->
    <div id="tab-stats" style="display:none;">
      <div class="card">
        <div class="card-title">This Week</div>
        <div class="stats-row">
          <div class="stat-box"><div class="stat-val" id="st-done">0</div><div class="stat-lbl">Done</div></div>
          <div class="stat-box"><div class="stat-val" id="st-total">0</div><div class="stat-lbl">Total</div></div>
          <div class="stat-box"><div class="stat-val" id="st-pct">0%</div><div class="stat-lbl">Complete</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="stat-bar" style="width:0%"></div></div>
        <div id="person-stats"></div>
      </div>
      <button class="btn-reset" onclick="resetAll()">Reset All Chores for New Week</button>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var STORE='chores_data';
var S = { useCount:0, removeAds:false, chores:[], filter:'all', curTab:'chores', nextId:1 };

function load(){try{var d=JSON.parse(localStorage.getItem(STORE)||'null');if(d){S.chores=d.chores||[];S.nextId=d.nextId||1;}}catch(e){}}
function save(){localStorage.setItem(STORE,JSON.stringify({chores:S.chores,nextId:S.nextId}));}

function addChore(){
  var name=document.getElementById('c-name').value.trim();
  if(!name){alert('Enter chore name');return;}
  var person=document.getElementById('c-person').value.trim()||'Unassigned';
  var day=document.getElementById('c-day').value;
  var repeat=document.getElementById('c-repeat').value;
  S.chores.push({id:S.nextId++,name:name,person:person,day:day,repeat:repeat,done:false});
  save();
  document.getElementById('c-name').value='';
  renderChores();
  maybeInterstitial();
}

function toggleDone(id){
  var c=S.chores.find(function(x){return x.id===id;});
  if(c){c.done=!c.done;save();renderChores();renderStats();}
}

function deleteChore(id){
  S.chores=S.chores.filter(function(x){return x.id!==id;});
  save();renderChores();renderStats();
}

function resetAll(){
  S.chores.forEach(function(c){c.done=false;});
  save();renderChores();renderStats();
}

function setFilter(f,btn){
  S.filter=f;
  document.querySelectorAll('#day-filters .tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderChores();
}

function renderChores(){
  var el=document.getElementById('chores-list');
  var list=S.chores.filter(function(c){
    if(S.filter==='all')return true;
    return c.day===S.filter||c.day==='Daily';
  });
  if(!list.length){el.innerHTML='<div class="empty-msg">No chores'+(S.filter==='all'?'. Add some!':' for '+S.filter+'.')+'</div>';return;}
  el.innerHTML=list.map(function(c){
    return '<div class="chore-item'+(c.done?' done':'')+'">'+
      '<div class="chore-check'+(c.done?' done':'')+'" onclick="toggleDone('+c.id+')"></div>'+
      '<div class="chore-info"><div class="chore-name">'+esc(c.name)+'</div>'+
      '<div class="chore-meta">'+esc(c.person)+' · '+c.day+' · '+c.repeat+'</div></div>'+
      '<button class="chore-del" onclick="deleteChore('+c.id+')">&#10005;</button></div>';
  }).join('');
}

function renderStats(){
  var done=S.chores.filter(function(c){return c.done;}).length;
  var total=S.chores.length;
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-pct').textContent=pct+'%';
  document.getElementById('stat-bar').style.width=pct+'%';
  // per-person
  var pm={};
  S.chores.forEach(function(c){
    if(!pm[c.person])pm[c.person]={done:0,total:0};
    pm[c.person].total++;
    if(c.done)pm[c.person].done++;
  });
  var phtml=Object.keys(pm).map(function(p){
    var d=pm[p];
    return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--card);font-size:0.85rem;">'+
      '<span>'+esc(p)+'</span><span style="color:var(--accent);">'+d.done+'/'+d.total+'</span></div>';
  }).join('');
  document.getElementById('person-stats').innerHTML=phtml;
}

function showTab(tab,btn){
  S.curTab=tab;
  document.getElementById('tab-chores').style.display=tab==='chores'?'block':'none';
  document.getElementById('tab-add').style.display=tab==='add'?'block':'none';
  document.getElementById('tab-stats').style.display=tab==='stats'?'block':'none';
  document.querySelectorAll('#tabs .tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(tab==='stats')renderStats();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

load();
renderChores();
document.getElementById('df-all').classList.add('active');

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

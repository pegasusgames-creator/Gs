<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darts Scorer</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#EF5350; --accent2:#B71C1C; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
/* Setup screen */
#setup-screen {}
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
.toggle-row { display:flex; background:var(--card); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.toggle-btn { flex:1; min-height:44px; background:transparent; border:none; color:var(--muted); font-size:1rem; font-weight:700; cursor:pointer; }
.toggle-btn.active { background:var(--accent); color:#fff; }
.toggle-btn.btn-pressed { opacity:0.7; }
.player-count-row { display:flex; gap:8px; margin-bottom:14px; }
.pc-btn { flex:1; min-height:44px; background:var(--card); border:2px solid transparent; color:var(--text); font-size:1rem; font-weight:700; border-radius:8px; cursor:pointer; }
.pc-btn.active { border-color:var(--accent); color:var(--accent); }
.pc-btn.btn-pressed { opacity:0.7; }
.player-names { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
input[type=text],input[type=number] { width:100%; background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 12px; border-radius:8px; outline:none; }
input:focus { box-shadow:0 0 0 2px var(--accent); }
#btn-start { width:100%; min-height:48px; background:var(--accent); border:none; color:#fff; font-size:1rem; font-weight:700; border-radius:10px; cursor:pointer; }
#btn-start.btn-pressed { opacity:0.8; }
/* Game screen */
#game-screen { display:none; }
.players-grid { display:grid; gap:10px; margin-bottom:12px; }
.player-card { background:var(--card); border-radius:12px; padding:14px; transition:border 0.2s; border:2px solid transparent; }
.player-card.active-turn { border-color:var(--accent); background:#1f0000; }
.player-card.bust { border-color:#FF9800; }
.player-name-row { display:flex; justify-content:space-between; align-items:center; }
.player-name { font-size:0.85rem; font-weight:600; }
.turn-indicator { font-size:0.72rem; background:var(--accent); color:#fff; padding:2px 8px; border-radius:10px; }
.player-score { font-size:2.8rem; font-weight:700; color:var(--accent); text-align:center; margin:8px 0 4px; line-height:1; }
.player-darts { font-size:0.72rem; color:var(--muted); text-align:center; }
.input-area { background:var(--surface); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.input-title { font-size:0.75rem; color:var(--muted); margin-bottom:8px; }
.score-input-row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
#score-input { flex:1; font-size:1.5rem; text-align:center; font-weight:700; }
#btn-submit-score { min-height:48px; background:var(--accent); border:none; color:#fff; font-size:1rem; font-weight:700; border-radius:8px; cursor:pointer; padding:0 18px; }
#btn-submit-score.btn-pressed { opacity:0.8; }
.quick-scores { display:flex; gap:6px; flex-wrap:wrap; }
.qs-btn { min-height:40px; min-width:44px; background:var(--card); border:none; color:var(--text); font-size:0.9rem; font-weight:600; border-radius:8px; cursor:pointer; padding:0 10px; }
.qs-btn.btn-pressed { opacity:0.7; }
.status-msg { text-align:center; padding:8px; font-size:0.9rem; color:#FF9800; min-height:28px; }
.btn-row { display:flex; gap:8px; }
#btn-undo, #btn-new-game { flex:1; min-height:44px; background:var(--card); border:none; color:var(--text); font-size:0.85rem; font-weight:600; border-radius:8px; cursor:pointer; }
#btn-new-game { background:var(--accent2); }
#btn-undo.btn-pressed, #btn-new-game.btn-pressed { opacity:0.7; }
.winner-banner { background:#1a3a1a; border:2px solid #4CAF50; border-radius:12px; padding:16px; text-align:center; font-size:1.2rem; font-weight:700; color:#4CAF50; margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Darts <span>Scorer</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div id="setup-screen">
      <div class="card">
        <div class="card-title">Game Type</div>
        <div class="toggle-row" id="game-type-row">
          <button class="toggle-btn active" data-type="501">501</button>
          <button class="toggle-btn" data-type="301">301</button>
        </div>
        <div class="card-title">Number of Players</div>
        <div class="player-count-row" id="player-count-row">
          <button class="pc-btn active" data-count="1">1</button>
          <button class="pc-btn" data-count="2">2</button>
          <button class="pc-btn" data-count="3">3</button>
          <button class="pc-btn" data-count="4">4</button>
        </div>
        <div class="card-title" style="margin-bottom:8px;">Player Names</div>
        <div class="player-names" id="player-names-inputs">
          <input type="text" class="pname-input" placeholder="Player 1" value="Player 1">
        </div>
        <button id="btn-start">Start Game</button>
      </div>
    </div>
    <div id="game-screen">
      <div id="winner-area"></div>
      <div class="players-grid" id="players-grid"></div>
      <div class="card input-area">
        <div class="input-title" id="input-title">Enter score for <strong id="current-player-name">—</strong></div>
        <div class="score-input-row">
          <input type="number" id="score-input" placeholder="0" min="0" max="180">
          <button id="btn-submit-score">Enter</button>
        </div>
        <div class="quick-scores">
          <button class="qs-btn" data-score="26">26</button>
          <button class="qs-btn" data-score="41">41</button>
          <button class="qs-btn" data-score="45">45</button>
          <button class="qs-btn" data-score="60">60</button>
          <button class="qs-btn" data-score="85">85</button>
          <button class="qs-btn" data-score="100">100</button>
          <button class="qs-btn" data-score="140">140</button>
          <button class="qs-btn" data-score="180">180</button>
        </div>
        <div class="status-msg" id="status-msg"></div>
      </div>
      <div class="btn-row">
        <button id="btn-undo">↩ Undo</button>
        <button id="btn-new-game">New Game</button>
      </div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false };
var game = null;

// Setup
var gameType = 501;
var playerCount = 1;

document.getElementById('game-type-row').addEventListener('click',function(e){
  var btn=e.target.closest('.toggle-btn');
  if(!btn) return;
  gameType=parseInt(btn.dataset.type);
  document.querySelectorAll('#game-type-row .toggle-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
});

document.getElementById('player-count-row').addEventListener('click',function(e){
  var btn=e.target.closest('.pc-btn');
  if(!btn) return;
  playerCount=parseInt(btn.dataset.count);
  document.querySelectorAll('.pc-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  // Update name inputs
  var cont=document.getElementById('player-names-inputs');
  cont.innerHTML='';
  for(var i=1;i<=playerCount;i++){
    var inp=document.createElement('input');
    inp.type='text'; inp.className='pname-input'; inp.placeholder='Player '+i; inp.value='Player '+i;
    cont.appendChild(inp);
  }
});

document.getElementById('btn-start').addEventListener('click',function(){
  var names=[];
  document.querySelectorAll('.pname-input').forEach(function(inp,i){
    names.push(inp.value.trim()||'Player '+(i+1));
  });
  startGame(gameType, names);
});

function startGame(type, names){
  game = {
    type:type,
    players: names.map(function(n){ return {name:n,score:type,darts:0,history:[]}; }),
    current:0,
    winner:null,
    history:[]
  };
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('game-screen').style.display='';
  renderGame();
  maybeInterstitial();
}

function renderGame(){
  var g=game;
  // Winner
  var wa=document.getElementById('winner-area');
  if(g.winner!==null){
    wa.innerHTML='<div class="winner-banner">🏆 '+escH(g.players[g.winner].name)+' wins!</div>';
  } else { wa.innerHTML=''; }
  // Players grid
  var grid=document.getElementById('players-grid');
  var cols=g.players.length<=2?'1fr 1fr':g.players.length===3?'1fr 1fr 1fr':'1fr 1fr 1fr 1fr';
  grid.style.gridTemplateColumns=cols;
  grid.innerHTML='';
  g.players.forEach(function(p,i){
    var div=document.createElement('div');
    div.className='player-card'+(i===g.current&&!g.winner?' active-turn':'');
    div.innerHTML='<div class="player-name-row"><span class="player-name">'+escH(p.name)+'</span>'+(i===g.current&&!g.winner?'<span class="turn-indicator">▶ Turn</span>':'')+'</div>'+
      '<div class="player-score">'+p.score+'</div>'+
      '<div class="player-darts">'+p.darts+' dart'+(p.darts!==1?'s':'')+'</div>';
    grid.appendChild(div);
  });
  // Input area
  if(!g.winner){
    document.getElementById('current-player-name').textContent=g.players[g.current].name;
    document.getElementById('score-input').value='';
    document.getElementById('score-input').focus();
  } else {
    document.getElementById('input-title').innerHTML='Game over!';
    document.getElementById('score-input').disabled=true;
    document.getElementById('btn-submit-score').disabled=true;
  }
}

function submitScore(score){
  if(!game||game.winner!==null) return;
  var g=game;
  var p=g.players[g.current];
  score=parseInt(score);
  if(isNaN(score)||score<0||score>180){ document.getElementById('status-msg').textContent='Invalid score (0-180)'; return; }
  var newScore=p.score-score;
  if(newScore<0||newScore===1){
    document.getElementById('status-msg').textContent='Bust! Score unchanged.';
    // Still count darts, move to next player
    g.history.push({player:g.current,score:p.score,thrown:score,bust:true});
    p.darts+=3;
    g.current=(g.current+1)%g.players.length;
    renderGame();
    return;
  }
  document.getElementById('status-msg').textContent='';
  g.history.push({player:g.current,score:p.score,thrown:score,bust:false});
  p.score=newScore;
  p.darts+=3;
  if(newScore===0){
    g.winner=g.current;
  } else {
    g.current=(g.current+1)%g.players.length;
  }
  renderGame();
  maybeInterstitial();
}

document.getElementById('btn-submit-score').addEventListener('click',function(){
  submitScore(document.getElementById('score-input').value);
});
document.getElementById('score-input').addEventListener('keydown',function(e){
  if(e.key==='Enter') submitScore(this.value);
});
document.querySelector('.quick-scores').addEventListener('click',function(e){
  var btn=e.target.closest('.qs-btn');
  if(!btn) return;
  submitScore(btn.dataset.score);
});

document.getElementById('btn-undo').addEventListener('click',function(){
  if(!game||game.winner!==null) return;
  var g=game;
  if(g.history.length===0) return;
  var last=g.history.pop();
  var p=g.players[last.player];
  p.score=last.score;
  p.darts-=3;
  g.current=last.player;
  document.getElementById('status-msg').textContent='';
  renderGame();
});

document.getElementById('btn-new-game').addEventListener('click',function(){
  game=null;
  document.getElementById('setup-screen').style.display='';
  document.getElementById('game-screen').style.display='none';
  document.getElementById('score-input').disabled=false;
  document.getElementById('btn-submit-score').disabled=false;
});

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Step Counter</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#FF8A65; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
#ring-wrap { position:relative; width:160px; height:160px; margin:0 auto 16px; }
#ring-svg { width:160px; height:160px; transform:rotate(-90deg); }
#ring-bg { fill:none; stroke:rgba(255,138,101,0.15); stroke-width:12; }
#ring-fill { fill:none; stroke:var(--accent); stroke-width:12; stroke-linecap:round; stroke-dasharray:439.8; stroke-dashoffset:439.8; }
#ring-txt { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
#step-count { font-size:1.8rem; font-weight:900; color:var(--accent); }
#goal-pct { font-size:0.7rem; color:var(--muted); }
.add-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.add-btn { flex:1; min-width:60px; background:var(--card); border:2px solid rgba(255,138,101,0.3); border-radius:10px; color:var(--accent); font-size:0.9rem; font-weight:700; padding:10px 6px; cursor:pointer; text-align:center; }
.custom-row { display:flex; gap:8px; margin-bottom:8px; }
.custom-row input { flex:1; background:var(--card); border:1px solid rgba(255,138,101,0.2); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.95rem; }
.btn-p { background:var(--accent); border:none; color:#1a1a2e; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:2px; }
.stat-val { font-size:1.1rem; font-weight:700; color:var(--accent); }
.goal-row { display:flex; align-items:center; gap:8px; margin-top:10px; }
.goal-row input { background:var(--card); border:1px solid rgba(255,138,101,0.2); border-radius:8px; color:var(--text); padding:8px 10px; font-size:0.9rem; width:90px; }
.btn-sm { background:var(--accent); border:none; color:#1a1a2e; font-size:0.85rem; font-weight:700; padding:8px 14px; border-radius:8px; cursor:pointer; }
.week-bar { display:flex; align-items:flex-end; gap:4px; height:80px; }
.wb { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
.wb-fill { width:100%; border-radius:4px 4px 0 0; background:var(--accent); min-height:4px; }
.wb-lbl { font-size:0.6rem; color:var(--muted); }
.log-item { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,138,101,0.08); font-size:0.85rem; }
.log-item:last-child { border-bottom:none; }
.del-btn { background:none; border:none; color:var(--muted); font-size:0.9rem; padding:4px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px 0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Step <span>Counter</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card">
      <div id="ring-wrap">
        <svg id="ring-svg" viewBox="0 0 160 160"><circle id="ring-bg" cx="80" cy="80" r="70"/><circle id="ring-fill" cx="80" cy="80" r="70"/></svg>
        <div id="ring-txt"><div id="step-count">0</div><div id="goal-pct">0% of goal</div></div>
      </div>
      <div class="add-row" id="add-row">
        <button class="add-btn" data-s="100">+100</button>
        <button class="add-btn" data-s="500">+500</button>
        <button class="add-btn" data-s="1000">+1000</button>
        <button class="add-btn" data-s="2000">+2000</button>
      </div>
      <div class="custom-row">
        <input type="number" id="i-custom" placeholder="Custom steps" min="1" max="50000">
        <button class="btn-p" id="btn-add-custom">Add</button>
      </div>
      <div class="goal-row">
        <span style="font-size:0.72rem;color:var(--muted);">Daily goal:</span>
        <input type="number" id="i-goal" value="10000" min="1000" max="100000">
        <button class="btn-sm" id="btn-set-goal">Set</button>
        <button class="btn-sm" id="btn-reset-day" style="background:rgba(239,83,80,0.2);color:#ef5350;">Reset Day</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Stats</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-lbl">Today</div><div class="stat-val" id="st-today">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Avg (7 days)</div><div class="stat-val" id="st-avg">0</div></div>
        <div class="stat-box"><div class="stat-lbl">Best Day</div><div class="stat-val" id="st-best">0</div></div>
      </div>
    </div>
    <div class="card" id="week-card">
      <div class="card-title">This Week</div>
      <div class="week-bar" id="week-bar"></div>
    </div>
    <div class="card">
      <div class="card-title">Step Log</div>
      <div id="log-list"><div class="empty">No steps logged yet.</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var logs=JSON.parse(localStorage.getItem('sc_logs')||'[]');
var dailyGoal=parseInt(localStorage.getItem('sc_goal')||'10000');
var todayKey=new Date().toDateString();
var todaySteps=0;
var dailyLog=JSON.parse(localStorage.getItem('sc_daily')||'{}');
if(dailyLog[todayKey])todaySteps=dailyLog[todayKey];

function save(){localStorage.setItem('sc_logs',JSON.stringify(logs));dailyLog[todayKey]=todaySteps;localStorage.setItem('sc_daily',JSON.stringify(dailyLog));}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}

function addSteps(n){
  todaySteps+=n;
  logs.unshift({s:n,t:Date.now()});
  if(logs.length>200)logs=logs.slice(0,200);
  save();render();
  if(todaySteps>=dailyGoal&&todaySteps-n<dailyGoal){maybeInterstitial();}
}

function render(){
  var pct=Math.min(todaySteps/dailyGoal,1);
  var circ=439.8;
  document.getElementById('ring-fill').style.strokeDashoffset=circ-(pct*circ);
  document.getElementById('step-count').textContent=todaySteps.toLocaleString();
  document.getElementById('goal-pct').textContent=Math.round(pct*100)+'% of '+dailyGoal.toLocaleString();
  document.getElementById('st-today').textContent=todaySteps.toLocaleString();
  document.getElementById('i-goal').value=dailyGoal;
  var days=Object.keys(dailyLog).map(function(k){return{k:k,v:dailyLog[k]};}).sort(function(a,b){return new Date(b.k)-new Date(a.k);});
  var last7=days.slice(0,7);
  if(last7.length){
    var avg=Math.round(last7.reduce(function(s,d){return s+d.v;},0)/last7.length);
    var best=Math.max.apply(null,days.map(function(d){return d.v;}));
    document.getElementById('st-avg').textContent=avg.toLocaleString();
    document.getElementById('st-best').textContent=best.toLocaleString();
    var maxV=Math.max.apply(null,last7.map(function(d){return d.v;}));
    var DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
    document.getElementById('week-bar').innerHTML=last7.reverse().map(function(d){
      var pct2=Math.round((d.v/Math.max(maxV,dailyGoal))*100);
      var col=d.v>=dailyGoal?'#FF8A65':'rgba(255,138,101,0.4)';
      var dw=new Date(d.k).getDay();
      return '<div class="wb"><div class="wb-fill" style="height:'+(pct2*0.64)+'px;background:'+col+';"></div><div class="wb-lbl">'+DAYS[dw]+'</div></div>';
    }).join('');
  }
  var ll=document.getElementById('log-list');
  if(!logs.length){ll.innerHTML='<div class="empty">No steps logged yet.</div>';return;}
  ll.innerHTML=logs.slice(0,15).map(function(l){
    return '<div class="log-item"><span>+'+l.s.toLocaleString()+'</span><span style="color:var(--muted);">'+fmtDate(l.t)+'</span><button class="del-btn" data-t="'+l.t+'">&#10005;</button></div>';
  }).join('');
  ll.querySelectorAll('.del-btn').forEach(function(b){b.addEventListener('click',function(){var t=parseInt(b.dataset.t);var entry=logs.find(function(l){return l.t===t;});if(entry){todaySteps=Math.max(0,todaySteps-entry.s);}logs=logs.filter(function(l){return l.t!==t;});save();render();});});
}

document.getElementById('add-row').querySelectorAll('.add-btn').forEach(function(b){
  b.addEventListener('click',function(){addSteps(parseInt(b.dataset.s));});
});
document.getElementById('btn-add-custom').addEventListener('click',function(){
  var v=parseInt(document.getElementById('i-custom').value);
  if(!v||v<1){return;}
  addSteps(v);
  document.getElementById('i-custom').value='';
});
document.getElementById('btn-set-goal').addEventListener('click',function(){
  dailyGoal=parseInt(document.getElementById('i-goal').value)||10000;
  localStorage.setItem('sc_goal',dailyGoal);render();
});
document.getElementById('btn-reset-day').addEventListener('click',function(){
  if(confirm('Reset today\'s steps?')){todaySteps=0;logs=logs.filter(function(l){return new Date(l.t).toDateString()!==todayKey;});save();render();}
});

render();
</script>
</body>
</html>

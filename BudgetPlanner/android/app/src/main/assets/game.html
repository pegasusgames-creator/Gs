<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Budget Planner</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#8BC34A; --accent2:#558B2F; --text:#eaeaea; --muted:#8888aa; --radius:14px; --income:#4CAF50; --expense:#F44336; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.summary-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.sum-item { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.sum-label { font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.sum-value { font-size:1.1rem; font-weight:700; }
.sum-income { color:var(--income); }
.sum-expense { color:var(--expense); }
.sum-balance { color:var(--accent); }
.add-form { display:flex; flex-direction:column; gap:8px; }
.form-row { display:flex; gap:8px; }
input[type=text], input[type=number] { background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 12px; border-radius:8px; outline:none; width:100%; }
input:focus { box-shadow:0 0 0 2px var(--accent); }
select { background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 12px; border-radius:8px; outline:none; flex:1; }
.type-row { display:flex; gap:8px; }
.type-btn { flex:1; min-height:44px; background:var(--card); border:2px solid transparent; color:var(--muted); font-size:0.9rem; font-weight:700; border-radius:8px; cursor:pointer; }
.type-btn.income.active { border-color:var(--income); color:var(--income); }
.type-btn.expense.active { border-color:var(--expense); color:var(--expense); }
.type-btn.btn-pressed { opacity:0.7; }
#btn-add-entry { width:100%; min-height:48px; background:var(--accent); border:none; color:#fff; font-size:0.95rem; font-weight:700; border-radius:10px; cursor:pointer; }
#btn-add-entry.btn-pressed { opacity:0.8; }
.entry-item { display:flex; align-items:center; gap:10px; padding:10px; background:var(--card); border-radius:10px; margin-bottom:8px; }
.entry-type-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.entry-info { flex:1; min-width:0; }
.entry-desc { font-size:0.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.entry-cat { font-size:0.72rem; color:var(--muted); margin-top:2px; }
.entry-amount { font-size:1rem; font-weight:700; flex-shrink:0; }
.entry-income .entry-amount { color:var(--income); }
.entry-expense .entry-amount { color:var(--expense); }
.del-btn { min-width:32px; min-height:32px; background:transparent; border:none; color:#c44; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.del-btn.btn-pressed { opacity:0.6; }
.cat-breakdown { margin-top:8px; }
.cat-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #1a1a3a; font-size:0.85rem; }
.cat-row:last-child { border-bottom:none; }
.cat-name { color:var(--muted); }
.cat-total { font-weight:700; }
.empty-msg { text-align:center; color:var(--muted); font-size:0.85rem; padding:20px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Budget <span>Planner</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="card-title">Summary</div>
      <div class="summary-grid">
        <div class="sum-item"><div class="sum-label">Income</div><div class="sum-value sum-income" id="s-income">$0.00</div></div>
        <div class="sum-item"><div class="sum-label">Expenses</div><div class="sum-value sum-expense" id="s-expense">$0.00</div></div>
        <div class="sum-item"><div class="sum-label">Balance</div><div class="sum-value sum-balance" id="s-balance">$0.00</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Add Entry</div>
      <div class="add-form">
        <div class="type-row">
          <button class="type-btn income active" id="btn-type-income">+ Income</button>
          <button class="type-btn expense" id="btn-type-expense">− Expense</button>
        </div>
        <input type="text" id="entry-desc" placeholder="Description (e.g. Rent, Salary)">
        <div class="form-row">
          <input type="number" id="entry-amount" placeholder="Amount" min="0" step="0.01" style="flex:1">
          <select id="entry-cat">
            <option value="Housing">Housing</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Salary">Salary</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Shopping">Shopping</option>
            <option value="Savings">Savings</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button id="btn-add-entry">Add Entry</button>
      </div>
    </div>
    <div class="card" id="breakdown-card" style="display:none;">
      <div class="card-title">Category Breakdown</div>
      <div class="cat-breakdown" id="cat-breakdown"></div>
    </div>
    <div class="card">
      <div class="card-title">Entries</div>
      <div id="entries-list"><div class="empty-msg">No entries yet. Add income or expenses above.</div></div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, entryType:'income' };
var STORAGE_KEY = 'budget_planner_entries';
var entries = [];

function load(){ try{ var d=localStorage.getItem(STORAGE_KEY); if(d) entries=JSON.parse(d); }catch(e){} }
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){} }
function fmt(n){ return '$'+(n||0).toFixed(2); }

function render(){
  var totalIncome=0, totalExpense=0;
  var cats = {};
  entries.forEach(function(e){
    if(e.type==='income') totalIncome+=e.amount;
    else totalExpense+=e.amount;
    if(!cats[e.category]) cats[e.category]={income:0,expense:0};
    cats[e.category][e.type] += e.amount;
  });
  document.getElementById('s-income').textContent = fmt(totalIncome);
  document.getElementById('s-expense').textContent = fmt(totalExpense);
  var bal = totalIncome - totalExpense;
  var balEl = document.getElementById('s-balance');
  balEl.textContent = fmt(bal);
  balEl.style.color = bal>=0 ? 'var(--income)' : 'var(--expense)';
  // Entries
  var list = document.getElementById('entries-list');
  if(entries.length===0){ list.innerHTML='<div class="empty-msg">No entries yet. Add income or expenses above.</div>'; }
  else {
    list.innerHTML = '';
    var sorted = entries.slice().reverse();
    sorted.forEach(function(e){
      var div = document.createElement('div');
      div.className = 'entry-item entry-'+e.type;
      div.innerHTML = '<div class="entry-type-dot" style="background:'+(e.type==='income'?'var(--income)':'var(--expense)')+'"></div>' +
        '<div class="entry-info"><div class="entry-desc">'+escH(e.desc||'Unnamed')+'</div><div class="entry-cat">'+e.category+'</div></div>' +
        '<div class="entry-amount">'+(e.type==='income'?'+':'-')+fmt(e.amount)+'</div>' +
        '<button class="del-btn" data-id="'+e.id+'">✕</button>';
      list.appendChild(div);
    });
  }
  // Breakdown
  var breakdown = document.getElementById('cat-breakdown');
  var catKeys = Object.keys(cats);
  if(catKeys.length>0){
    document.getElementById('breakdown-card').style.display='';
    breakdown.innerHTML='';
    catKeys.sort().forEach(function(k){
      var row = document.createElement('div');
      row.className='cat-row';
      var net = cats[k].income - cats[k].expense;
      row.innerHTML='<span class="cat-name">'+k+'</span><span class="cat-total" style="color:'+(net>=0?'var(--income)':'var(--expense)')+'">'+(net>=0?'+':'')+fmt(net)+'</span>';
      breakdown.appendChild(row);
    });
  } else { document.getElementById('breakdown-card').style.display='none'; }
}

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('btn-type-income').addEventListener('click',function(){
  state.entryType='income';
  this.classList.add('active');
  document.getElementById('btn-type-expense').classList.remove('active');
});
document.getElementById('btn-type-expense').addEventListener('click',function(){
  state.entryType='expense';
  this.classList.add('active');
  document.getElementById('btn-type-income').classList.remove('active');
});

document.getElementById('btn-add-entry').addEventListener('click',function(){
  var desc = document.getElementById('entry-desc').value.trim();
  var amt = parseFloat(document.getElementById('entry-amount').value)||0;
  var cat = document.getElementById('entry-cat').value;
  if(amt<=0) return;
  entries.push({ id: Date.now(), type:state.entryType, desc:desc||state.entryType, amount:amt, category:cat });
  save();
  document.getElementById('entry-desc').value='';
  document.getElementById('entry-amount').value='';
  render();
  maybeInterstitial();
});

document.getElementById('entries-list').addEventListener('click',function(e){
  var btn = e.target.closest('.del-btn');
  if(!btn) return;
  var id = parseInt(btn.dataset.id);
  entries = entries.filter(function(x){ return x.id!==id; });
  save();
  render();
});

load();
render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

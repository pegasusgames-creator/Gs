html[lang^="tr"]{--font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:2px;min-height:var(--appbar-h);padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;padding-inline-start:16px;background:var(--bg)}
.appbar.has-back{padding-inline-start:4px}
.ab-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ab-title{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sub{font-size:.82rem;font-weight:600;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:3rem;height:3rem;min-width:48px;min-height:48px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-grid;place-items:center;padding:0;transition:background .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.tint{color:var(--accent)}
[dir="rtl"] .flip{transform:scaleX(-1)}
#view:focus,.sheet:focus,.dialog:focus{outline:none}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:auto}
.page{max-width:760px;margin:0 auto;padding:4px 16px 28px}
/* Bottom nav = the utility 'footer': symmetric padding + safe-area inset + 6px buffer above
   the native banner (the banner lives outside the WebView, below it). */
.nav{flex:0 0 auto;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding:clamp(2px,.6vh,6px) 8px calc(clamp(2px,.6vh,6px) + env(safe-area-inset-bottom,0px) + 6px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav-btn{flex:1 1 0;min-width:0;min-height:var(--nav-h);border:0;background:transparent;color:var(--text-mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;padding:6px 2px}
.nav-btn .pill{display:grid;place-items:center;width:3.6rem;height:2rem;border-radius:1rem;transition:background .2s,color .2s}
.nav-btn[aria-current="page"]{color:var(--text)}
.nav-btn[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.nav-btn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cards, lists, rows */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card+.card,.group+.group{margin-top:14px}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.sec-h:first-child{margin-top:10px}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:3.5rem;padding:10px 16px;border:0;background:transparent;text-align:start;color:var(--text);font-size:1rem}
.group .row+.row,.group .row+.row-x,.group .row-x+.row{border-top:1px solid var(--border)}
button.row:active{background:var(--surface-2)}
.row .ri{width:2.25rem;height:2.25rem;border-radius:11px;display:grid;place-items:center;background:var(--menu-tile-bg);color:var(--menu-tile-fg);border:1px solid var(--menu-tile-border);flex:none}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rl{font-weight:650;overflow-wrap:break-word}
.row .rs{font-size:.84rem;color:var(--text-mute);overflow-wrap:break-word}
.row select.inp{width:42%;max-width:240px;min-height:2.75rem;flex:none;padding-inline:12px}
.row .rv{color:var(--text-mute);font-weight:650;font-size:.92rem;flex:none;max-width:45%;text-align:end}
.row .chev{color:var(--text-faint)}
.row-x{padding:12px 16px}
.row.danger,.row.danger .ri{color:var(--danger)}
.row.danger .ri{background:transparent;border:1.5px solid currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:transparent;color:var(--success);border:1.5px solid currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;min-width:48px;padding:0 20px;border-radius:14px;border:0;font-weight:750;font-size:1rem;line-height:1.15;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--g-play);color:var(--on-accent);box-shadow:0 6px 18px -6px var(--accent)}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-neutral{background:var(--btn-neutral-bg);color:var(--text)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}

/* form controls */
.field{display:block;margin:0 0 16px}
.field>.fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.inp{width:100%;min-height:3rem;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:1rem}
.inp::placeholder{color:var(--text-faint)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:6.5rem;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface-2);width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:2.75rem;border:0;border-radius:11px;background:transparent;color:var(--text-mute);font-weight:750;font-size:.88rem;line-height:1.15;padding:4px;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.switch{position:relative;flex:none;width:3.25rem;height:2rem;min-width:52px;border-radius:1rem;border:0;background:var(--border-strong);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(2rem - 6px);height:calc(2rem - 6px);border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(1.25rem)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-1.25rem)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:3rem;height:3rem;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center}
.sw i{width:2.1rem;height:2.1rem;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--text)}
.sw .lk{position:absolute;inset-inline-end:2px;bottom:2px;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.stepper button{width:2.75rem;height:2.75rem;min-width:44px;border-radius:11px;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper output{min-width:2.6rem;text-align:center;font-weight:800;font-size:1.15rem}

/* layers: sheets, dialogs, onboarding, toast */
.layer{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center}
.layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;border:0;padding:0;width:100%}
.layer.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.in .sheet{transform:none}
.sheet.full{height:calc(100% - 24px)}
.sheet-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0;padding-inline-start:20px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:1.2rem;font-weight:800;min-width:0}
.grab{position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px 20px 16px;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1 1 140px}
.layer.center{align-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:400px;background:var(--surface);color:var(--text);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:22px 20px 16px;transform:scale(.94);opacity:0;transition:transform .2s,opacity .2s}
.layer.in .dialog{transform:none;opacity:1}
.dialog h2{margin:0 0 8px;font-size:1.2rem;font-weight:800}
.dialog p{margin:0 0 18px;color:var(--text-mute)}
.dialog .btn-row{justify-content:flex-end}
.dialog .btn-row .btn{flex:0 1 auto}
#toast{position:fixed;left:50%;bottom:calc(var(--toast-b,16px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);z-index:var(--z-critical);width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;padding-inline:18px 8px;min-height:3.25rem;border-radius:16px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:650;font-size:.95rem}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .tm{flex:1;min-width:0;padding:6px 0}
#toast .ta{border:0;background:transparent;color:var(--bg);font-weight:850;min-height:44px;padding:0 14px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
.onb{position:fixed;inset:0;z-index:var(--z-tutorial);background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.onb-top{display:flex;justify-content:flex-end;padding:0 8px}
.onb-track{flex:1;display:flex;overflow:hidden;touch-action:pan-y}
.onb-card{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.onb-art{width:min(68vw,260px);height:min(68vw,260px);margin-bottom:28px}
.onb-art svg{width:100%;height:100%}
.onb h2{margin:0 0 10px;font-size:1.6rem;font-weight:850;letter-spacing:-.015em;max-width:440px}
.onb p{margin:0;color:var(--text-mute);font-size:1.05rem;max-width:400px}
.onb-foot{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border-strong);transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--accent)}
.onb-foot .btn{width:min(100%,420px)}
.empty{text-align:center;padding:28px 18px 8px}
.empty .ea{width:132px;height:132px;margin:0 auto 14px}
.empty h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.empty p{margin:0 auto 18px;color:var(--text-mute);max-width:360px}
.pro-hero{text-align:center;padding:2px 0 8px}
.pro-hero .em{width:84px;height:84px;margin:0 auto 10px}
.pro-hero h3{margin:0;font-size:1.4rem;font-weight:850}
.pro-hero p{margin:6px 0 0;color:var(--text-mute)}
.feat{list-style:none;margin:14px 0 6px;padding:0}
.feat li{display:flex;align-items:center;gap:12px;padding:9px 2px;font-weight:650}
.feat li .ri{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fine{font-size:.82rem;color:var(--text-mute);text-align:center;margin:10px 0 0}
.about-foot{text-align:center;color:var(--text-mute);font-size:.82rem;margin:22px 0 4px}
.lock-chip{display:inline-flex;align-items:center;gap:4px}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (min-width:600px){html{font-size:calc(17px * var(--fs))}.page{padding:8px 24px 32px}.appbar{padding-inline:20px 12px}.sheet-body,.sheet-foot{padding-inline:28px}}
@media (min-width:900px){html{font-size:calc(18px * var(--fs))}:root{--appbar-h:4rem}.ab-title{font-size:1.5rem}}

/*@@REGION TOOL_CSS*/
/* Budget Planner tool styles. Tokens only; logical properties for RTL. */
.bpmb{display:flex;align-items:center;gap:6px;margin:2px 0 12px}
.bpmbb{flex:none;width:3rem;height:3rem;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.bpmbb[disabled]{opacity:.4}
.bpmt{flex:1;min-height:3rem;border:0;background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.1rem;text-align:center}
.bpmt small{font-size:.76rem;font-weight:700;color:var(--accent)}
.bphero{padding:20px 18px 16px;margin-bottom:14px;border-radius:var(--r);background:var(--g-play);color:var(--on-accent);box-shadow:0 10px 26px -12px var(--accent)}
.bphero.bad{background:var(--danger);box-shadow:none}
.bphero .hl{font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;opacity:.95;margin:0 2px 6px}
.bphero .tot{font-size:clamp(2.1rem,11vw,3.1rem);line-height:1.08;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bphero .sub{display:flex;align-items:flex-start;gap:8px;margin:8px 2px 0;font-weight:650;font-size:.92rem;overflow-wrap:anywhere}
.bphero .sub svg{flex:none;margin-top:1px}
.bphero .hst{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bphero .hst span{flex:1 1 7rem;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.18);font-size:.78rem;font-weight:700}
html[data-theme="dark"] .bphero .hst span{background:rgba(0,0,0,.16)}
.bphero .hst b{font-size:1rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bphero .bpbar-w{margin-top:12px}
.bphero .bpbar{background:rgba(255,255,255,.28)}
.bphero .bpbar i{background:var(--on-accent)}
.bpact{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.bpact .btn{flex:1 1 11rem;height:auto;min-height:3rem;padding:8px 14px;line-height:1.2;text-align:center}
.bpmsg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;margin:0 0 12px;border-radius:var(--r-sm);background:var(--surface);border:1.5px solid var(--danger);color:var(--text);font-weight:650;font-size:.92rem}
.bpmsg span{flex:1 1 10rem;min-width:0;overflow-wrap:anywhere}
.bpmsg svg{flex:none;color:var(--danger)}
.bpmsg .btn{min-height:2.75rem;padding:0 14px}
.bper{display:flex;align-items:stretch;border-bottom:1px solid var(--border)}
.bper:last-child{border-bottom:0}
.bpeb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 16px;padding-inline:16px 6px;border:0;background:transparent;color:var(--text);text-align:start;min-height:4.4rem}
.bpdot{flex:none;width:.9rem;height:.9rem;border-radius:50%}
.bpet{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bpl1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bpl1 b{min-width:0;overflow-wrap:anywhere;font-size:1.02rem}
.bpav{flex:none;font-weight:800;font-variant-numeric:tabular-nums;max-width:48%;text-align:end;overflow-wrap:anywhere}
.bpav.neg,.neg{color:var(--danger)}
.bpl2{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:.8rem;font-weight:600;color:var(--text-mute)}
.bpl2 > span:first-child{overflow-wrap:anywhere}
.bpst{display:inline-flex;align-items:center;gap:4px;font-weight:750}
.bpst.bad{color:var(--danger)}.bpst.warn{color:var(--text)}.bpst.ok{color:var(--success)}
.bpst.warn svg{color:var(--flame)}
.bpea{flex:none;width:3.4rem;border:0;border-inline-start:1px solid var(--border);background:transparent;color:var(--accent);display:grid;place-items:center}
.bpea.on{color:var(--success);background:var(--accent-soft)}
.bpbar{height:.55rem;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bpbar i{display:block;height:100%;border-radius:999px;background:var(--accent);min-width:0}
.bpbar.near i{background:var(--flame)}
.bpbar.over i{background:var(--danger)}
.bpkv .rv{font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bptx .rv{font-weight:800;font-variant-numeric:tabular-nums;max-width:40%;text-align:end;overflow-wrap:anywhere}
.bptx .rl{overflow-wrap:anywhere}
.bpx{flex:none;min-width:48px;min-height:48px;border:0;background:transparent;color:var(--text-mute);display:grid;place-items:center;border-radius:12px}
.bpgl{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.inpw{position:relative;margin-bottom:6px}
.inpw .inp{padding-inline-end:3.4rem;font-variant-numeric:tabular-nums}
.inpw .un{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);color:var(--text-mute);font-weight:800;pointer-events:none}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.quick .btn{min-height:2.75rem;padding:0 14px}
.bpcols{display:flex;flex-wrap:wrap;gap:10px}
.bpcol{width:2.75rem;height:2.75rem;border-radius:50%;border:2px solid var(--surface);outline:2px solid transparent;display:grid;place-items:center}
.bpcol[aria-pressed="true"]{outline-color:var(--text)}
.bp2{display:flex;gap:10px}.bp2 select{flex:1;min-width:0}
.bpchip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-weight:750;font-size:.78rem;background:var(--surface-2);color:var(--text)}
.bpchip.ok{background:var(--accent-soft);color:var(--success)}
.bpchip.bad{background:var(--surface-2);color:var(--danger)}
.bpbell{vertical-align:-2px}
.bpgoal{padding:16px;margin-bottom:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1)}
.bpgh{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:transparent;color:var(--text);text-align:start;padding:0 0 8px;min-height:2.75rem}
.bpgh b{font-size:1.08rem;overflow-wrap:anywhere}.bpgh small{font-size:.82rem;font-weight:650;color:var(--text-mute)}
.bpgm{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-variant-numeric:tabular-nums;font-weight:800;flex-wrap:wrap}
.bpgm span:last-child{color:var(--text-mute);font-weight:650}
.bpgf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.bpgf .btn{min-height:2.75rem;padding:0 14px}
.bpneed{display:flex;flex-direction:column;flex:1 1 9rem;min-width:0}
.bpneed b{font-size:1rem;overflow-wrap:anywhere}.bpneed small{font-size:.8rem;color:var(--text-mute);font-weight:600;overflow-wrap:anywhere}
.bpsum{padding:10px 14px;margin-bottom:12px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--text);font-weight:750;font-size:.92rem}

function grant(id) {

    case 'pro_lifetime': S.pro = true; S.removeAds = true; break;
    default: return false;
  }
  persist(); Ads.banner(); applyTheme();
  if (was.ads !== S.removeAds || was.pro !== S.pro) {
    UI.toast(t('thanks')); haptic('success');
    if (UI.layers.length && $('.layer:last-child .pro-hero')) UI.closeLayer(true);
    if (TOOL.onGrant) TOOL.onGrant(id);

  }

}
function iapDeferGrant(id) {
  try { const p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); p[id] = NOW(); localStorage.setItem('pendingGrants', JSON.stringify(p)); } catch (e) {}
}

// Java billing bridge → here for every PURCHASED (and every restored) SKU. Never throws.
window.onPurchaseSuccess = function (id) {
  try { if (!grant(String(id))) iapDeferGrant(String(id)); }

};
window.onPurchaseComplete = window.onPurchaseSuccess;
// Unknown SKUs bought before their mechanic existed are replayed once it does.
window.replayPendingGrants = function () {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch (e) { return; }
  const ids = Object.keys(p); if (!ids.length) return;
  const left = {};
  ids.forEach(id => { let ok = false; try { ok = grant(id); } catch (e) {} if (!ok) left[id] = p[id]; });
  try { if (Object.keys(left).length) localStorage.setItem('pendingGrants', JSON.stringify(left)); else localStorage.removeItem('pendingGrants'); } catch (e) {}
};

// Ads: banner always (unless ad-free); interstitial ONLY at natural breaks,
// never in the first session, >= 3 min apart, >= 2 breaks between ads,

const Ads = {

  banner() { callA(adsRemoved() ? 'hideBannerAd' : 'showBannerAd'); },
  naturalBreak(reason) {
    if (!APP.interstitials || adsRemoved() || !bridge()) return false;

    S.ads.breaks = (S.ads.breaks | 0) + 1;
    const sinceInterstitialMs = NOW() - (S.ads.last || 0);
    if (S.ads.breaks >= 2 && sinceInterstitialMs >= 180000) {  // >=2 breaks AND >=3 min since the last one

// ── Reminders (Java NotificationHelper; slot 0 = app-wide daily) ─────
// Permission is asked IN CONTEXT only — after the user switches a reminder on.
const Reminders = {
  _res: null,
  ensurePermission() {
    return new Promise(res => {
      if (!bridge()) return res(true);
      if (callA('hasNotificationPermission') === true) return res(true);
      this._res = res; callA('requestNotificationPermission');
    });
  },
  set(slot, h, m, daysMask, title, body) {
    const A = bridge();
    if (A && typeof A.scheduleReminder === 'function') callA('scheduleReminder', slot, h, m, daysMask & 127, title, body);
    else if (slot === 0) callA('scheduleDailyReminder', h, m);
  },
  // One-shot (yearly=false) or yearly reminder at a local date-time —
  // birthdays, bills, events. `when` = Date or epoch ms.
  setAt(slot, when, yearly, title, body) {
    const ms = (when instanceof Date) ? when.getTime() : +when;
    if (!isFinite(ms)) return;
    callA('scheduleDatedReminder', slot, ms, !!yearly, title, body);
  },
  async enableAt(slot, when, yearly, title, body) {
    const ok = await this.ensurePermission();
    if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return false; }
    this.setAt(slot, when, yearly, title, body); return true;
  },
  cancel(slot) { callA('cancelReminder', slot); },
  // Turn one on: permission first; false (and a settings hint) when refused.
  async enable(slot, h, m, daysMask, title, body) {
    const ok = await this.ensurePermission();
    if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return false; }
    this.set(slot, h, m, daysMask, title, body); return true;
  },
  syncDaily() {
    if (!APP.reminder) return;
    const d = S.settings.daily;
    if (d.on) this.set(0, d.h, d.m, 127, APP.name, t(APP.reminder.body)); else this.cancel(0);
  },
};
window.onNotificationPermissionResult = function (g) { const r = Reminders._res; Reminders._res = null; if (r) r(!!g); };

// ── Screen: keep the display awake during a timer / guided session ──
// Native flag first (reliable in the WebView), browser wake lock as fallback.
const Screen = {
  _lock: null,
  keepOn(on) {

      else if (!on && this._lock) { this._lock.release(); this._lock = null; }
    } catch (e) {}
  },
};

// ── Data: local-only; export = JSON text via the share sheet / clipboard ──
const Data = {

const Onboarding = {
  i: 0,
  show(replay) {
    if (!APP.onboarding.length) return;
    this.i = 0;
    const L = document.createElement('div');
    L.className = 'onb'; L.id = 'onb'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true');
    L.innerHTML = '<div class="onb-top"><button class="btn btn-ghost" data-act="onb-done">' + esc(t('skip')) + '</button></div>' +
      '<div class="onb-track">' + APP.onboarding.map((c, i) => '<section class="onb-card" aria-hidden="' + (i ? 'true' : 'false') + '"><div class="onb-art">' + (ART[c.art] || '') + '</div><h2>' + esc(t(c.title)) + '</h2><p>' + esc(t(c.body)) + '</p></section>').join('') + '</div>' +
      '<div class="onb-foot"><div class="dots">' + APP.onboarding.map((c, i) => '<i class="' + (i ? '' : 'on') + '"></i>').join('') + '</div><button class="btn btn-primary" id="onb-next" data-act="onb-next">' + esc(t('next')) + '</button></div>';
    document.body.appendChild(L);
    let x0 = null;
    const tr = L.querySelector('.onb-track');
    tr.addEventListener('pointerdown', e => { x0 = e.clientX; });
    tr.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { const fwd = (dx < 0) !== (document.documentElement.dir === 'rtl'); this.step(fwd ? 1 : -1); } });
    this.paint();
  },
  step(d) { const n = APP.onboarding.length; const j = this.i + d; if (j >= n) { this.done(); return; } this.i = clamp(j, 0, n - 1); this.paint(); },
  paint() {
    const L = $('#onb'); if (!L) return;
    const rtl = document.documentElement.dir === 'rtl', n = APP.onboarding.length;
    $$('.onb-card', L).forEach((c, k) => { c.style.transform = 'translateX(' + ((rtl ? 100 : -100) * this.i) + '%)'; c.setAttribute('aria-hidden', k === this.i ? 'false' : 'true'); });
    $$('.dots i', L).forEach((d, k) => d.classList.toggle('on', k === this.i));
    $('#onb-next').textContent = this.i === n - 1 ? t('get_started') : t('next');
  },
  done() {
    const L = $('#onb'); if (L) L.remove();
    if (!S.onboarded) { S.onboarded = true; persist(); if (TOOL.afterOnboarding) TOOL.afterOnboarding(); }
  },
};
ACT['onb-next'] = () => Onboarding.step(1);

function buildCsv() {
  const T = S.tool, rows = [['month', 'type', 'envelope', 'date', 'amount', 'note']], A = c => moneyTxt(c);
  Object.keys(T.months).filter(BE.okKey).sort().forEach(k => {
    const m = T.months[k], nm = id => (envOf(id) || {}).name || '';
    m.income.forEach(x => rows.push([k, 'income', '', '', A(x.c), x.name]));
    Object.keys(m.plan).forEach(id => { if (envOf(id)) rows.push([k, 'planned', nm(id), '', A(m.plan[id]), '']); });
    m.spend.slice().sort((a, b) => (a.d < b.d ? -1 : 1)).forEach(s => rows.push([k, 'spent', nm(s.e), s.d, A(s.c), s.note]));
    m.moves.forEach(v => rows.push([k, 'move', nm(v.f) + ' > ' + nm(v.t), v.d, A(v.c), '']));
  });
  T.goals.forEach(g => rows.push(['', 'goal', g.name, g.due, A(g.saved) + ' / ' + A(g.target), '']));
  return rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n';
}

// ---- currency (Settings) ----
function rescaleAll(f) {
  const T = S.tool, g = c => Math.min(BE.MAX_C, f(c));
  Object.keys(T.months).forEach(k => {
    const m = T.months[k];
    m.income.forEach(x => { x.c = g(x.c); });
    Object.keys(m.plan).forEach(id => { m.plan[id] = g(m.plan[id]); });
    m.spend.forEach(s => { s.c = g(s.c); }); m.moves.forEach(v => { v.c = g(v.c); });
  });
  T.bills.forEach(b => { b.c = g(b.c); }); T.goals.forEach(x => { x.target = g(x.target); x.saved = g(x.saved); });
}
CHANGE['b-cur'] = el => {
  const nc = el.value, oc = S.tool.cc; if (nc === oc || !nc) return;
  const prev = clone(S.tool), e1 = curExp(oc), e2 = curExp(nc);
  S.tool.cc = nc;
  if (e1 !== e2) rescaleAll(c => (e2 > e1 ? c * Math.pow(10, e2 - e1) : Math.round(c / Math.pow(10, e1 - e2))));
  persist(); syncBillReminders(); UI.refresh();
  UI.toast(t(e1 !== e2 ? 'cur_rescaled' : 'cur_changed', { cur: nc }), { action: t('undo'), onAction: () => { S.tool = prev; persist(); syncBillReminders(); UI.refresh(); } });
};

// ===== TOOL contract =====
const TOOL = {
  defaults: () => ({ cc: defaultCur(), envs: [], months: {}, bills: [], goals: [] }),
  migrate(tool, from) {
    const o = Object.assign(TOOL.defaults(), tool && typeof tool === 'object' ? tool : {});
    const str = (v, n) => String(v == null ? '' : v).slice(0, n);
    const amt = v => (Number.isInteger(v) && v >= 0 && v <= BE.MAX_C ? v : 0);
    const pos = v => (Number.isInteger(v) && v > 0 && v <= BE.MAX_C ? v : 0);
    o.cc = typeof o.cc === 'string' && /^[A-Z]{3}$/.test(o.cc) ? o.cc : defaultCur();
    const seen = new Set();
    o.envs = (Array.isArray(o.envs) ? o.envs : []).filter(e => e && e.id && !seen.has(e.id) && seen.add(e.id)).slice(0, MAX_ENV)
      .map(e => ({ id: str(e.id, 40), name: str(e.name, 30), roll: e.roll === 'carry' ? 'carry' : 'reset', color: Number.isInteger(e.color) && e.color >= 0 ? e.color % COLORS.length : 0 }));
    const ids = new Set(o.envs.map(e => e.id)), months = {}, src = o.months && typeof o.months === 'object' ? o.months : {};
    Object.keys(src).filter(BE.okKey).forEach(k => {
      const m = src[k] && typeof src[k] === 'object' ? src[k] : {}, plan = {};
      Object.keys(m.plan && typeof m.plan === 'object' ? m.plan : {}).forEach(id => { if (ids.has(id) && pos(m.plan[id])) plan[id] = m.plan[id]; });
      const dd = (d, def) => (okDate(d, k) ? d : def);
      months[k] = {
        income: (Array.isArray(m.income) ? m.income : []).filter(x => x && pos(x.c)).slice(0, MAX_INC).map(x => ({ id: str(x.id || uid('n'), 40), name: str(x.name, 40), c: x.c })),
        plan: plan,
        spend: (Array.isArray(m.spend) ? m.spend : []).filter(s => s && ids.has(s.e) && pos(s.c)).map(s => ({ id: str(s.id || uid('s'), 40), e: s.e, c: s.c, d: dd(s.d, k + '-01'), note: str(s.note, 60) })),
        moves: (Array.isArray(m.moves) ? m.moves : []).filter(v => v && ids.has(v.f) && ids.has(v.t) && v.f !== v.t && pos(v.c)).map(v => ({ id: str(v.id || uid('v'), 40), f: v.f, t: v.t, c: v.c, d: dd(v.d, k + '-01') })),
      };
    });
    o.months = months;
    const slots = new Set();
    o.bills = (Array.isArray(o.bills) ? o.bills : []).filter(b => b && b.id && pos(b.c)).slice(0, MAX_BILLS).map(b => {
      let slot = Number.isInteger(b.slot) && b.slot >= 1 && b.slot < 64 && !slots.has(b.slot) ? b.slot : 0;
      if (!slot) for (let i = 1; i < 64; i++) if (!slots.has(i)) { slot = i; break; }
      slots.add(slot);
      const paid = {}; Object.keys(b.paid && typeof b.paid === 'object' ? b.paid : {}).forEach(k => { if (BE.okKey(k)) paid[k] = str(b.paid[k], 40) || 'x'; });
      return { id: str(b.id, 40), name: str(b.name, 40), c: b.c, day: clamp(b.day | 0, 1, 31) || 1, env: ids.has(b.env) ? b.env : '', lead: [-1, 0, 1, 3].indexOf(b.lead) >= 0 ? b.lead : -1, paid: paid, slot: slot };
    });
    o.goals = (Array.isArray(o.goals) ? o.goals : []).filter(g => g && g.id && pos(g.target) && BE.okKey(g.due)).slice(0, MAX_GOALS)
      .map(g => ({ id: str(g.id, 40), name: str(g.name, 40), target: g.target, saved: amt(g.saved), due: g.due }));
    return o;
  },
  validateImport: tool => !!(tool && typeof tool === 'object' && Array.isArray(tool.envs) && tool.months && typeof tool.months === 'object' && Array.isArray(tool.bills) && Array.isArray(tool.goals)),
  csv() { if (!Object.keys(S.tool.months).length && !S.tool.goals.length) { UI.toast(t('months_empty_t')); return ''; } return buildCsv(); },
  settingsHtml() {
    const cc = S.tool.cc, curs = CURRENCIES.indexOf(cc) >= 0 ? CURRENCIES : CURRENCIES.concat([cc]);
    return '<div class="sec-h">' + esc(APP.name) + '</div><div class="group"><label class="row"><span class="ri">' + icon('coin', 20) + '</span><span class="rt"><span class="rl">' + esc(t('currency')) + '</span><span class="rs">' + esc(t('currency_sub')) + '</span></span>' +
      '<select class="inp" style="width:auto;max-width:9rem" data-change="b-cur" aria-label="' + esc(t('currency')) + '">' + curs.map(c => '<option value="' + c + '"' + (c === cc ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></label></div>';
  },
  syncReminders() { syncBillReminders(); },
  onBoot() { TD.m = curKey(); },
  onNewDay() { TD.m = curKey(); syncBillReminders(); },
  onGrant() {},
  afterOnboarding() { UI.refresh(); },
  screens: {
    plan: {
      title: () => t('tab_plan'),
      subtitle: () => monthName(viewKey(), true),
      actions: () => [{ icon: 'plus', label: t('add_spend'), act: 'sp-new', tint: true }, { icon: 'swap', label: t('move_money'), act: 'mv-new' }],
      render: el => planScreen(el),
    },
    bills: {
      title: () => t('tab_bills'),
      actions: () => [{ icon: 'plus', label: t('add_bill'), act: 'bill-new', tint: true }],
      render: el => billsScreen(el),
    },
    goals: {
      title: () => t('tab_goals'),
      actions: () => [{ icon: 'plus', label: t('add_goal'), act: 'goal-new', tint: true }],
      render: el => goalsScreen(el),
    },
    months: {
      title: () => t('tab_months'),
      render: el => monthsScreen(el),
    },
    env: {
      title: p => envName(envOf(p.id)),
      subtitle: () => monthName(viewKey(), true),
      actions: p => [{ icon: 'edit', label: t('env_edit'), act: 'env-edit', arg: p.id }],
      render: (el, p) => envScreen(el, p),
      onLeave: () => Ads.naturalBreak('env_closed'),
    },
  },
};
ACT['env-edit'] = el => openEnv(el.dataset.arg);
//@@END TOOL_CORE
// ── Boot ─────────────────────────────────────────────────────────────
(function boot() {
  mergeI18n();
  loadSave();
  touchSession();
  lastDayKey = todayKey();
  applyLang(); applyTheme(); applyFontScale();
  checkTrial();
  UI.buildNav();
  if (TOOL.onBoot) TOOL.onBoot();
  UI.tab(APP.tabs[0].id);
  persist();
  window.replayPendingGrants();
  Ads.banner();
  Reminders.syncDaily();
  if (TOOL.syncReminders) TOOL.syncReminders();
  if (!S.onboarded) Onboarding.show();
})();
</script>

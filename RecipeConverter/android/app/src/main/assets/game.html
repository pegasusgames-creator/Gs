<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recipe Converter</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#26A69A; --accent2:#00695C; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
.convert-row { display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
.convert-block { flex:1; }
input[type=number] { width:100%; background:var(--card); border:none; color:var(--text); font-size:1rem; padding:10px 12px; border-radius:8px; outline:none; }
input[type=number]:focus { box-shadow:0 0 0 2px var(--accent); }
select { width:100%; background:var(--card); border:none; color:var(--text); font-size:0.9rem; padding:10px 10px; border-radius:8px; outline:none; margin-top:6px; }
#btn-swap-vol, #btn-swap-wt { min-width:44px; min-height:44px; background:var(--card); border:none; color:var(--accent); font-size:1.4rem; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#btn-swap-vol.btn-pressed, #btn-swap-wt.btn-pressed { opacity:0.7; }
.result-box { background:var(--card); border-radius:10px; padding:12px 16px; margin-top:8px; display:flex; justify-content:space-between; align-items:center; }
.result-val { font-size:1.5rem; font-weight:700; color:var(--accent); }
.result-unit { font-size:0.85rem; color:var(--muted); }
.factor-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.factor-btn { flex:1; min-height:44px; min-width:44px; background:var(--card); border:2px solid transparent; color:var(--text); font-size:0.9rem; font-weight:700; border-radius:8px; cursor:pointer; }
.factor-btn.active { border-color:var(--accent); color:var(--accent); }
.factor-btn.btn-pressed { opacity:0.7; }
.custom-factor-wrap { display:none; margin-bottom:10px; }
.custom-factor-wrap.show { display:block; }
.recipe-result-row { display:flex; justify-content:space-between; align-items:center; padding:8px; background:var(--card); border-radius:8px; margin-bottom:6px; font-size:0.85rem; }
.recipe-ingredient { color:var(--muted); flex:1; margin-right:8px; }
.recipe-original { color:var(--text); width:80px; text-align:right; }
.recipe-converted { color:var(--accent); font-weight:700; width:80px; text-align:right; }
.add-ingr-row { display:flex; gap:8px; margin-bottom:8px; }
.add-ingr-row input { flex:2; }
.add-ingr-row input:last-of-type { flex:1; max-width:90px; }
#btn-add-ingr { min-height:44px; background:var(--accent); border:none; color:#fff; font-size:0.9rem; font-weight:700; border-radius:8px; cursor:pointer; padding:0 14px; }
#btn-add-ingr.btn-pressed { opacity:0.8; }
.del-btn { background:transparent; border:none; color:#c44; font-size:0.9rem; cursor:pointer; min-width:32px; min-height:32px; }
.del-btn.btn-pressed { opacity:0.6; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Recipe <span>Converter</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">

    <!-- Volume Converter -->
    <div class="card">
      <div class="card-title">Volume Converter</div>
      <div class="convert-row">
        <div class="convert-block">
          <label>Amount</label>
          <input type="number" id="vol-from-amt" value="1" min="0" step="any">
          <select id="vol-from-unit">
            <option value="cup">Cup</option>
            <option value="tbsp">Tablespoon (tbsp)</option>
            <option value="tsp">Teaspoon (tsp)</option>
            <option value="floz">Fluid oz (fl oz)</option>
            <option value="ml">Milliliter (mL)</option>
            <option value="l">Liter (L)</option>
          </select>
        </div>
        <button id="btn-swap-vol">⇄</button>
        <div class="convert-block">
          <label>Converted</label>
          <input type="number" id="vol-to-amt" value="" min="0" step="any">
          <select id="vol-to-unit">
            <option value="cup">Cup</option>
            <option value="tbsp">Tablespoon (tbsp)</option>
            <option value="tsp">Teaspoon (tsp)</option>
            <option value="floz">Fluid oz (fl oz)</option>
            <option value="ml" selected>Milliliter (mL)</option>
            <option value="l">Liter (L)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Weight Converter -->
    <div class="card">
      <div class="card-title">Weight Converter</div>
      <div class="convert-row">
        <div class="convert-block">
          <label>Amount</label>
          <input type="number" id="wt-from-amt" value="1" min="0" step="any">
          <select id="wt-from-unit">
            <option value="oz">Ounce (oz)</option>
            <option value="lb">Pound (lb)</option>
            <option value="g" selected>Gram (g)</option>
            <option value="kg">Kilogram (kg)</option>
          </select>
        </div>
        <button id="btn-swap-wt">⇄</button>
        <div class="convert-block">
          <label>Converted</label>
          <input type="number" id="wt-to-amt" value="" min="0" step="any">
          <select id="wt-to-unit">
            <option value="oz" selected>Ounce (oz)</option>
            <option value="lb">Pound (lb)</option>
            <option value="g">Gram (g)</option>
            <option value="kg">Kilogram (kg)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Recipe Scaler -->
    <div class="card">
      <div class="card-title">Recipe Scaler</div>
      <label>Scale Factor</label>
      <div class="factor-row" id="factor-row">
        <button class="factor-btn" data-factor="0.5">0.5×</button>
        <button class="factor-btn active" data-factor="1">1×</button>
        <button class="factor-btn" data-factor="2">2×</button>
        <button class="factor-btn" data-factor="3">3×</button>
        <button class="factor-btn" data-factor="custom">Custom</button>
      </div>
      <div class="custom-factor-wrap" id="custom-factor-wrap">
        <label>Custom Factor</label>
        <input type="number" id="custom-factor-val" placeholder="e.g. 1.5" min="0.01" step="0.1">
      </div>
      <div class="add-ingr-row">
        <input type="text" id="ingr-name" placeholder="Ingredient name">
        <input type="number" id="ingr-amt" placeholder="Amount" min="0" step="any">
        <button id="btn-add-ingr">Add</button>
      </div>
      <div id="ingr-list"></div>
    </div>

  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, volLastChanged:'from', wtLastChanged:'from', scaleFactor:1 };

// Volume conversions to mL
var VOL_TO_ML = { cup:236.588, tbsp:14.7868, tsp:4.92892, floz:29.5735, ml:1, l:1000 };
// Weight conversions to grams
var WT_TO_G = { oz:28.3495, lb:453.592, g:1, kg:1000 };

function fmtNum(n){
  if(n===0) return '0';
  if(Math.abs(n)>=100) return n.toFixed(1);
  if(Math.abs(n)>=10) return n.toFixed(2);
  return parseFloat(n.toPrecision(4)).toString();
}

function convertVol(){
  var fromU=document.getElementById('vol-from-unit').value;
  var toU=document.getElementById('vol-to-unit').value;
  if(state.volLastChanged==='from'){
    var amt=parseFloat(document.getElementById('vol-from-amt').value)||0;
    var ml=amt*VOL_TO_ML[fromU];
    document.getElementById('vol-to-amt').value=fmtNum(ml/VOL_TO_ML[toU]);
  } else {
    var amt2=parseFloat(document.getElementById('vol-to-amt').value)||0;
    var ml2=amt2*VOL_TO_ML[toU];
    document.getElementById('vol-from-amt').value=fmtNum(ml2/VOL_TO_ML[fromU]);
  }
  maybeInterstitial();
}

function convertWt(){
  var fromU=document.getElementById('wt-from-unit').value;
  var toU=document.getElementById('wt-to-unit').value;
  if(state.wtLastChanged==='from'){
    var amt=parseFloat(document.getElementById('wt-from-amt').value)||0;
    var g=amt*WT_TO_G[fromU];
    document.getElementById('wt-to-amt').value=fmtNum(g/WT_TO_G[toU]);
  } else {
    var amt2=parseFloat(document.getElementById('wt-to-amt').value)||0;
    var g2=amt2*WT_TO_G[toU];
    document.getElementById('wt-from-amt').value=fmtNum(g2/WT_TO_G[fromU]);
  }
  maybeInterstitial();
}

document.getElementById('vol-from-amt').addEventListener('input',function(){ state.volLastChanged='from'; convertVol(); });
document.getElementById('vol-to-amt').addEventListener('input',function(){ state.volLastChanged='to'; convertVol(); });
document.getElementById('vol-from-unit').addEventListener('change',convertVol);
document.getElementById('vol-to-unit').addEventListener('change',convertVol);
document.getElementById('wt-from-amt').addEventListener('input',function(){ state.wtLastChanged='from'; convertWt(); });
document.getElementById('wt-to-amt').addEventListener('input',function(){ state.wtLastChanged='to'; convertWt(); });
document.getElementById('wt-from-unit').addEventListener('change',convertWt);
document.getElementById('wt-to-unit').addEventListener('change',convertWt);

document.getElementById('btn-swap-vol').addEventListener('click',function(){
  var f=document.getElementById('vol-from-unit').value;
  var t=document.getElementById('vol-to-unit').value;
  document.getElementById('vol-from-unit').value=t;
  document.getElementById('vol-to-unit').value=f;
  state.volLastChanged='from';
  convertVol();
});
document.getElementById('btn-swap-wt').addEventListener('click',function(){
  var f=document.getElementById('wt-from-unit').value;
  var t=document.getElementById('wt-to-unit').value;
  document.getElementById('wt-from-unit').value=t;
  document.getElementById('wt-to-unit').value=f;
  state.wtLastChanged='from';
  convertWt();
});

// Recipe scaler
var ingredients = [];
var nextId = 0;

document.getElementById('factor-row').addEventListener('click',function(e){
  var btn=e.target.closest('.factor-btn');
  if(!btn) return;
  document.querySelectorAll('.factor-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var f=btn.dataset.factor;
  if(f==='custom'){
    document.getElementById('custom-factor-wrap').classList.add('show');
    state.scaleFactor=parseFloat(document.getElementById('custom-factor-val').value)||1;
  } else {
    document.getElementById('custom-factor-wrap').classList.remove('show');
    state.scaleFactor=parseFloat(f);
  }
  renderIngredients();
});

document.getElementById('custom-factor-val').addEventListener('input',function(){
  state.scaleFactor=parseFloat(this.value)||1;
  renderIngredients();
});

document.getElementById('btn-add-ingr').addEventListener('click',function(){
  var name=document.getElementById('ingr-name').value.trim();
  var amt=parseFloat(document.getElementById('ingr-amt').value)||0;
  if(!name||amt<=0) return;
  ingredients.push({id:nextId++,name:name,amount:amt});
  document.getElementById('ingr-name').value='';
  document.getElementById('ingr-amt').value='';
  renderIngredients();
  maybeInterstitial();
});

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderIngredients(){
  var list=document.getElementById('ingr-list');
  if(ingredients.length===0){ list.innerHTML=''; return; }
  list.innerHTML='';
  ingredients.forEach(function(ing){
    var scaled=ing.amount*state.scaleFactor;
    var div=document.createElement('div');
    div.className='recipe-result-row';
    div.innerHTML='<span class="recipe-ingredient">'+escH(ing.name)+'</span>'+
      '<span class="recipe-original">'+fmtNum(ing.amount)+'</span>'+
      '<span class="recipe-converted">→ '+fmtNum(scaled)+'</span>'+
      '<button class="del-btn" data-id="'+ing.id+'">✕</button>';
    list.appendChild(div);
  });
}

document.getElementById('ingr-list').addEventListener('click',function(e){
  var btn=e.target.closest('.del-btn');
  if(!btn) return;
  ingredients=ingredients.filter(function(x){ return x.id!==parseInt(btn.dataset.id); });
  renderIngredients();
});

// Init
convertVol();
convertWt();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
// ── IAP safety net (added by portfolio-wide IAP fix rollout) ─────
// 1. Java's bridge calls window.onPurchaseSuccess; alias it to the
//    existing onPurchaseComplete handler so SKUs aren't silently
//    dropped (the original bug class).
// 2. Wrap the bridge function in try/catch — a thrown exception in
//    the bridge looks identical to a failed purchase to the user.
// 3. Defer unknown SKUs to localStorage.pendingGrants and replay on
//    next launch via window.replayPendingGrants(), called on load.
(function(){
  var inner = window.onPurchaseComplete;
  function deferGrant(id){
    try {
      var p = JSON.parse(localStorage.getItem('pendingGrants') || '{}');
      p[id] = Date.now();
      localStorage.setItem('pendingGrants', JSON.stringify(p));
    } catch(e){}
  }
  function thanksToast(){
    try {
      if (typeof showToast === 'function') showToast('Thank you for your purchase!');
      else if (typeof xToast === 'function') xToast('Thank you for your purchase!');
    } catch(e){}
  }
  window.iapDeferGrant  = deferGrant;
  window.iapThanksToast = thanksToast;
  window.onPurchaseSuccess = function(id){
    try {
      if (typeof inner === 'function') { inner(id); return; }
      deferGrant(id);
      thanksToast();
    } catch(e) {
      try { console && console.warn && console.warn('IAP grant error', id, e); } catch(e2){}
      deferGrant(id);
    }
  };
  window.replayPendingGrants = function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch(e){ return; }
    var ids = Object.keys(p);
    if (!ids.length) return;
    try { localStorage.removeItem('pendingGrants'); } catch(e){}
    ids.forEach(function(id){ try { window.onPurchaseSuccess(id); } catch(e){} });
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(window.replayPendingGrants, 0);
  } else {
    window.addEventListener('load', window.replayPendingGrants);
  }
})();
// ── end IAP safety net ───────────────────────────────────────────
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

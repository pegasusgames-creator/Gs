<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sobriety Counter</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0a1e2a; --surface:#0f2a3a; --card:#0d3545; --accent:#26C6DA; --text:#eaeaea; --muted:#88aaaa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
.ig { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
.ig label { font-size:0.72rem; color:var(--muted); }
.ig input { background:var(--card); border:1px solid rgba(38,198,218,0.2); border-radius:8px; color:var(--text); padding:10px 12px; font-size:0.95rem; width:100%; }
.row2 { display:flex; gap:8px; } .row2 .ig { flex:1; }
.btn-p { background:var(--accent); border:none; color:#0a1e2a; font-size:1rem; font-weight:700; padding:12px; border-radius:10px; cursor:pointer; width:100%; margin-top:4px; }
.counter-main { text-align:center; padding:10px 0; }
#big-count { font-size:3.5rem; font-weight:900; color:var(--accent); line-height:1; }
#big-label { font-size:0.85rem; color:var(--muted); margin-top:6px; }
#live-time { font-size:1.1rem; font-weight:700; color:var(--accent); margin-top:10px; }
.units-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
.unit-box { background:var(--card); border-radius:10px; padding:10px; text-align:center; }
.unit-val { font-size:1.2rem; font-weight:700; color:var(--accent); }
.unit-lbl { font-size:0.65rem; color:var(--muted); margin-top:2px; }
.stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.stat-box { background:var(--card); border-radius:10px; padding:12px; text-align:center; }
.stat-lbl { font-size:0.65rem; color:var(--muted); margin-bottom:4px; }
.stat-val { font-size:1.1rem; font-weight:700; color:var(--accent); }
.milestone { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(38,198,218,0.08); }
.milestone:last-child { border-bottom:none; }
.ms-icon { font-size:1.4rem; }
.ms-info { flex:1; }
.ms-name { font-size:0.9rem; font-weight:700; }
.ms-desc { font-size:0.72rem; color:var(--muted); }
.ms-done { color:var(--accent); font-size:0.8rem; font-weight:700; }
.ms-pend { color:var(--muted); font-size:0.8rem; }
.quote-card { text-align:center; }
.quote-text { font-size:0.9rem; font-style:italic; line-height:1.7; color:var(--muted); }
.quote-auth { font-size:0.75rem; color:var(--accent); margin-top:6px; }
.btn-reset { background:rgba(239,83,80,0.15); border:none; color:#ef5350; font-size:0.85rem; font-weight:600; padding:10px; border-radius:10px; cursor:pointer; width:100%; margin-top:6px; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Sobriety <span>Counter</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="scroll">
    <div class="card" id="setup-card">
      <div class="card-title">Start Tracking</div>
      <div class="ig"><label>Sobriety Start Date &amp; Time</label><input type="datetime-local" id="i-date"></div>
      <div class="row2">
        <div class="ig"><label>Daily spend before ($)</label><input type="number" id="i-spend" value="10" min="0" step="0.50"></div>
        <div class="ig"><label>Substance (optional)</label><input type="text" id="i-subst" placeholder="Alcohol..."></div>
      </div>
      <button class="btn-p" id="btn-save">Start Counter</button>
    </div>
    <div class="card" id="counter-card" style="display:none">
      <div class="counter-main">
        <div id="big-count">0</div>
        <div id="big-label">Days Sober</div>
        <div id="live-time">0d 0h 0m 0s</div>
      </div>
      <div class="units-grid">
        <div class="unit-box"><div class="unit-val" id="u-hours">0</div><div class="unit-lbl">Hours</div></div>
        <div class="unit-box"><div class="unit-val" id="u-mins">0</div><div class="unit-lbl">Minutes</div></div>
        <div class="unit-box"><div class="unit-val" id="u-secs">0</div><div class="unit-lbl">Seconds</div></div>
      </div>
    </div>
    <div class="card" id="savings-card" style="display:none">
      <div class="card-title">Money Saved</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-lbl">Total Saved</div><div class="stat-val" id="st-saved">$0</div></div>
        <div class="stat-box"><div class="stat-lbl">This Month</div><div class="stat-val" id="st-month">$0</div></div>
      </div>
    </div>
    <div class="card" id="milestones-card" style="display:none">
      <div class="card-title">Milestones</div>
      <div id="milestones-list"></div>
    </div>
    <div class="card quote-card" id="quote-card" style="display:none">
      <div class="quote-text" id="quote-text"></div>
      <div class="quote-auth" id="quote-auth"></div>
    </div>
    <div id="reset-area" style="display:none">
      <button class="btn-reset" id="btn-reset">Reset Counter</button>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();
var state={useCount:0,removeAds:false};
document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';

var QUOTES=[
  {q:'One day at a time. You are stronger than you think.',a:'Recovery Wisdom'},
  {q:'Recovery is not a race. You don\'t have to feel guilty if it takes you longer than you thought.',a:''},
  {q:'The secret to change is to focus all of your energy not on fighting the old, but on building the new.',a:'Socrates'},
  {q:'You were given this life because you are strong enough to live it.',a:''},
  {q:'Every morning you have two choices: continue to sleep with your dreams or wake up and chase them.',a:''},
  {q:'It does not matter how slowly you go, as long as you do not stop.',a:'Confucius'}
];
var MILESTONES=[
  {hours:24,label:'24 Hours',icon:'⭐',desc:'Your first 24 hours. Incredible start!'},
  {hours:72,label:'3 Days',icon:'🌟',desc:'72 hours clean. The hardest part is over.'},
  {hours:168,label:'1 Week',icon:'🏅',desc:'One full week. Real change is happening.'},
  {hours:720,label:'1 Month',icon:'🥇',desc:'30 days! A full month of freedom.'},
  {hours:2160,label:'3 Months',icon:'🏆',desc:'90 days! A new chapter begins.'},
  {hours:8760,label:'1 Year',icon:'🎉',desc:'365 days. You are an inspiration!'}
];

var data=JSON.parse(localStorage.getItem('sob_data')||'null');
var ticker=null;

function initDateInput(){
  var now=new Date();
  var s=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'T'+pad(now.getHours())+':'+pad(now.getMinutes());
  document.getElementById('i-date').value=s;
}
function pad(n){return n<10?'0'+n:''+n;}

function showTracker(){
  document.getElementById('setup-card').style.display='none';
  ['counter-card','savings-card','milestones-card','quote-card','reset-area'].forEach(function(id){document.getElementById(id).style.display='';});
  var qi=Math.floor(Date.now()/3600000)%QUOTES.length;
  document.getElementById('quote-text').textContent=QUOTES[qi].q;
  document.getElementById('quote-auth').textContent=QUOTES[qi].a;
  if(ticker)clearInterval(ticker);
  ticker=setInterval(update,1000);
  update();
}

function update(){
  var elapsed=(Date.now()-data.start)/1000;
  if(elapsed<0)elapsed=0;
  var days=Math.floor(elapsed/86400);
  var h=Math.floor((elapsed%86400)/3600);
  var m=Math.floor((elapsed%3600)/60);
  var s=Math.floor(elapsed%60);
  var totalH=Math.floor(elapsed/3600);
  var totalM=Math.floor(elapsed/60);
  document.getElementById('big-count').textContent=days;
  document.getElementById('live-time').textContent=days+'d '+h+'h '+m+'m '+s+'s';
  document.getElementById('u-hours').textContent=totalH;
  document.getElementById('u-mins').textContent=totalM;
  document.getElementById('u-secs').textContent=Math.floor(elapsed);
  if(data.spend){
    var saved=(days*data.spend).toFixed(2);
    var monthSaved=(Math.min(days,30)*data.spend).toFixed(2);
    document.getElementById('st-saved').textContent='$'+saved;
    document.getElementById('st-month').textContent='$'+monthSaved;
  }
  renderMilestones(totalH);
}

function renderMilestones(h){
  document.getElementById('milestones-list').innerHTML=MILESTONES.map(function(ms){
    var done=h>=ms.hours;
    return '<div class="milestone"><span class="ms-icon">'+ms.icon+'</span><div class="ms-info"><div class="ms-name">'+ms.label+'</div><div class="ms-desc">'+ms.desc+'</div></div><span class="'+(done?'ms-done':'ms-pend')+'">'+(done?'Achieved!':'Pending')+'</span></div>';
  }).join('');
}

document.getElementById('btn-save').addEventListener('click',function(){
  var dVal=document.getElementById('i-date').value;
  if(!dVal){alert('Select your sobriety start date.');return;}
  var start=new Date(dVal).getTime();
  var spend=parseFloat(document.getElementById('i-spend').value)||0;
  var subst=document.getElementById('i-subst').value.trim();
  data={start:start,spend:spend,subst:subst};
  localStorage.setItem('sob_data',JSON.stringify(data));
  showTracker();
});

document.getElementById('btn-reset').addEventListener('click',function(){
  if(confirm('Reset your sobriety counter? This cannot be undone.')){
    data=null;localStorage.removeItem('sob_data');
    if(ticker)clearInterval(ticker);
    document.getElementById('setup-card').style.display='';
    ['counter-card','savings-card','milestones-card','quote-card','reset-area'].forEach(function(id){document.getElementById(id).style.display='none';});
    initDateInput();
  }
});

initDateInput();
if(data)showTracker();
</script>
</body>
</html>

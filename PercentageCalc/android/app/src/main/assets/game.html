<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Percentage Calculator</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#795548; --accent2:#4E342E; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:16px 16px 0; }
header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; }
header h1 span { color:var(--accent); }
#btn-remove-ads { background:var(--accent2); border:none; color:#fff; font-size:0.7rem; font-weight:600; padding:5px 10px; border-radius:20px; cursor:pointer; }
#scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:12px; }
.card { background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.card-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:10px; }
.tabs { display:flex; gap:0; background:var(--card); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.tab { flex:1; min-height:44px; background:transparent; border:none; color:var(--muted); font-size:0.78rem; font-weight:600; cursor:pointer; padding:4px; line-height:1.3; }
.tab.active { background:var(--accent); color:#fff; }
.tab.btn-pressed { opacity:0.7; }
.mode-panel { display:none; }
.mode-panel.active { display:block; }
label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
input[type=number] { width:100%; background:var(--card); border:none; color:var(--text); font-size:1rem; padding:10px 12px; border-radius:8px; outline:none; margin-bottom:12px; }
input[type=number]:focus { box-shadow:0 0 0 2px var(--accent); }
.formula-text { font-size:0.85rem; color:var(--muted); font-style:italic; margin-bottom:10px; }
.result-box { background:var(--card); border-radius:12px; padding:16px; text-align:center; margin-top:4px; }
.result-label { font-size:0.75rem; color:var(--muted); margin-bottom:6px; }
.result-value { font-size:2rem; font-weight:700; color:var(--accent); }
.result-detail { font-size:0.82rem; color:var(--muted); margin-top:4px; }
.arrow-up { color:#4CAF50; }
.arrow-down { color:#F44336; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Percentage <span>Calc</span></h1>
    <button id="btn-remove-ads">Remove Ads</button>
  </header>
  <div id="scroll">
    <div class="card">
      <div class="tabs" id="tabs">
        <button class="tab active" data-mode="0">X% of Y</button>
        <button class="tab" data-mode="1">X is % of Y</button>
        <button class="tab" data-mode="2">% Change</button>
      </div>

      <!-- Mode 0: What is X% of Y? -->
      <div class="mode-panel active" id="mode-0">
        <div class="formula-text">What is X% of Y?</div>
        <label>X (percentage)</label>
        <input type="number" id="m0-x" placeholder="15" step="any">
        <label>Y (value)</label>
        <input type="number" id="m0-y" placeholder="200" step="any">
        <div class="result-box">
          <div class="result-label">Result</div>
          <div class="result-value" id="m0-result">—</div>
          <div class="result-detail" id="m0-detail"></div>
        </div>
      </div>

      <!-- Mode 1: X is what % of Y? -->
      <div class="mode-panel" id="mode-1">
        <div class="formula-text">X is what percent of Y?</div>
        <label>X (part)</label>
        <input type="number" id="m1-x" placeholder="30" step="any">
        <label>Y (whole)</label>
        <input type="number" id="m1-y" placeholder="200" step="any">
        <div class="result-box">
          <div class="result-label">Result</div>
          <div class="result-value" id="m1-result">—</div>
          <div class="result-detail" id="m1-detail"></div>
        </div>
      </div>

      <!-- Mode 2: Percentage change from X to Y -->
      <div class="mode-panel" id="mode-2">
        <div class="formula-text">Percentage change from X to Y</div>
        <label>From (X)</label>
        <input type="number" id="m2-x" placeholder="100" step="any">
        <label>To (Y)</label>
        <input type="number" id="m2-y" placeholder="125" step="any">
        <div class="result-box">
          <div class="result-label">Percentage Change</div>
          <div class="result-value" id="m2-result">—</div>
          <div class="result-detail" id="m2-detail"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var state = { useCount:0, removeAds:false, mode:0 };

function fmtNum(n){
  if(Number.isInteger(n)) return n.toString();
  return parseFloat(n.toFixed(6)).toString();
}

function calcMode0(){
  var x = parseFloat(document.getElementById('m0-x').value);
  var y = parseFloat(document.getElementById('m0-y').value);
  if(isNaN(x)||isNaN(y)){ document.getElementById('m0-result').textContent='—'; document.getElementById('m0-detail').textContent=''; return; }
  var r = x/100*y;
  document.getElementById('m0-result').textContent = fmtNum(r);
  document.getElementById('m0-detail').textContent = x+'% of '+y+' = '+fmtNum(r);
  maybeInterstitial();
}

function calcMode1(){
  var x = parseFloat(document.getElementById('m1-x').value);
  var y = parseFloat(document.getElementById('m1-y').value);
  if(isNaN(x)||isNaN(y)||y===0){ document.getElementById('m1-result').textContent='—'; document.getElementById('m1-detail').textContent=''; return; }
  var r = x/y*100;
  document.getElementById('m1-result').textContent = fmtNum(r)+'%';
  document.getElementById('m1-detail').textContent = x+' is '+fmtNum(r)+'% of '+y;
  maybeInterstitial();
}

function calcMode2(){
  var x = parseFloat(document.getElementById('m2-x').value);
  var y = parseFloat(document.getElementById('m2-y').value);
  if(isNaN(x)||isNaN(y)||x===0){ document.getElementById('m2-result').textContent='—'; document.getElementById('m2-detail').textContent=''; return; }
  var r = (y-x)/Math.abs(x)*100;
  var resEl = document.getElementById('m2-result');
  var detEl = document.getElementById('m2-detail');
  if(r>0){
    resEl.innerHTML='<span class="arrow-up">▲ '+fmtNum(r)+'%</span>';
    detEl.textContent='Increase of '+fmtNum(y-x)+' from '+x+' to '+y;
  } else if(r<0){
    resEl.innerHTML='<span class="arrow-down">▼ '+fmtNum(Math.abs(r))+'%</span>';
    detEl.textContent='Decrease of '+fmtNum(Math.abs(y-x))+' from '+x+' to '+y;
  } else {
    resEl.textContent='0% (no change)';
    detEl.textContent='';
  }
  maybeInterstitial();
}

['m0-x','m0-y'].forEach(function(id){ document.getElementById(id).addEventListener('input',calcMode0); });
['m1-x','m1-y'].forEach(function(id){ document.getElementById(id).addEventListener('input',calcMode1); });
['m2-x','m2-y'].forEach(function(id){ document.getElementById(id).addEventListener('input',calcMode2); });

document.getElementById('tabs').addEventListener('click', function(e){
  var tab = e.target.closest('.tab');
  if(!tab) return;
  var mode = parseInt(tab.dataset.mode);
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.mode-panel').forEach(function(p){ p.classList.remove('active'); });
  tab.classList.add('active');
  document.getElementById('mode-'+mode).classList.add('active');
  state.mode = mode;
});

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){state.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){state.useCount++;if(!state.removeAds&&state.useCount%8===0&&window.Android)Android.showInterstitial();}
function init(){if(!window.Android&&!state.removeAds)document.getElementById('admob-banner').style.display='flex';}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stopwatch</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root { --bg:#1a1a2e; --surface:#16213e; --card:#0f3460; --accent:#26C6DA; --text:#eaeaea; --muted:#8888aa; --radius:14px; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; padding:0; }
header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 10px; flex-shrink:0; }
header h1 { font-size:1.3rem; font-weight:700; } header h1 span { color:var(--accent); }
#btn-remove-ads { background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:0.7rem; padding:5px 10px; border-radius:20px; cursor:pointer; }
/* Big display */
#display-area { text-align:center; padding:22px 16px 16px; flex-shrink:0; background:var(--surface); }
#main-time { font-size:4rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:2px; line-height:1; }
#sub-time { font-size:1rem; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums; }
/* Buttons */
#btn-area { display:flex; gap:12px; padding:14px 16px; flex-shrink:0; }
.sw-btn { flex:1; padding:14px; border:none; border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer; }
#btn-start { background:#2E7D32; color:#fff; }
#btn-start.running { background:#c62828; }
#btn-lap { background:var(--card); color:var(--text); }
#btn-reset { background:var(--surface); color:var(--muted); border:1px solid var(--card); }
/* Laps */
#laps-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 12px; }
.lap-header { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--card); margin-bottom:6px; font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
.lap-row { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:var(--surface); border-radius:9px; margin-bottom:5px; }
.lap-row.best { background:#0D3321; border:1px solid #2E7D32; }
.lap-row.worst { background:#3D1111; border:1px solid #c62828; }
.lap-num { font-size:0.8rem; color:var(--muted); width:44px; }
.lap-time { font-size:1rem; font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent); flex:1; text-align:center; }
.lap-row.best .lap-time { color:#66BB6A; }
.lap-row.worst .lap-time { color:#EF5350; }
.lap-total { font-size:0.82rem; font-variant-numeric:tabular-nums; color:var(--muted); width:70px; text-align:right; }
.no-laps { text-align:center; color:var(--muted); padding:24px 0; font-size:0.9rem; }
#admob-banner { display:none; width:100%; height:50px; background:#000; align-items:center; justify-content:center; color:#555; font-size:0.7rem; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <header><h1>Stop<span>watch</span></h1><button id="btn-remove-ads">Remove Ads</button></header>
  <div id="display-area">
    <div id="main-time">00:00</div>
    <div id="sub-time">.00</div>
  </div>
  <div id="btn-area">
    <button class="sw-btn" id="btn-start" onclick="toggleStart()">Start</button>
    <button class="sw-btn" id="btn-lap" onclick="recordLap()">Lap</button>
    <button class="sw-btn" id="btn-reset" onclick="resetSW()">Reset</button>
  </div>
  <div id="laps-area">
    <div id="laps-list"></div>
  </div>
  <div id="admob-banner">Advertisement</div>
</div>
<script>
'use strict';
(function(){var P='btn-pressed';document.addEventListener('touchstart',function(e){var el=e.target.closest('button');if(el)el.classList.add(P);},{passive:true});function clr(){document.querySelectorAll('.'+P).forEach(function(e){e.classList.remove(P);});}document.addEventListener('touchend',clr,{passive:true});document.addEventListener('touchcancel',clr,{passive:true});})();

var S = { useCount:0, removeAds:false, elapsed:0, lapStart:0, running:false, last:0, iv:null, laps:[] };

function p2(n){return String(n).padStart(2,'0');}
function fmtMs(ms,showCenti) {
  ms=Math.max(0,ms);
  var cs=Math.floor((ms%1000)/10);
  var tot=Math.floor(ms/1000);
  var m=Math.floor(tot/60),s=tot%60;
  if(showCenti===false) return p2(m)+':'+p2(s);
  return p2(m)+':'+p2(s)+'.'+p2(cs);
}

function toggleStart() {
  if(S.running){
    S.running=false;clearInterval(S.iv);S.iv=null;
  } else {
    S.running=true;S.last=Date.now();
    S.iv=setInterval(tick,33);
  }
  render();
}

function recordLap() {
  if(!S.running&&S.elapsed===0)return;
  var lapMs=S.elapsed-S.lapStart;
  S.laps.unshift({num:S.laps.length+1,lap:lapMs,total:S.elapsed});
  S.lapStart=S.elapsed;
  render();
  maybeInterstitial();
}

function resetSW() {
  S.running=false;clearInterval(S.iv);S.iv=null;
  S.elapsed=0;S.lapStart=0;S.laps=[];
  render();
}

function tick() {
  var now=Date.now(), d=now-S.last; S.last=now;
  S.elapsed+=d;
  render();
}

function render() {
  var ms=S.elapsed;
  var cs=Math.floor((ms%1000)/10);
  var tot=Math.floor(ms/1000);
  var m=Math.floor(tot/60), s=tot%60;
  document.getElementById('main-time').textContent=p2(m)+':'+p2(s);
  document.getElementById('sub-time').textContent='.'+p2(cs);
  var bs=document.getElementById('btn-start');
  bs.textContent=S.running?'Stop':'Start';
  bs.className='sw-btn'+(S.running?' running':'');
  renderLaps();
}

function renderLaps() {
  var el=document.getElementById('laps-list');
  if(!S.laps.length){el.innerHTML='<div class="no-laps">No laps recorded.</div>';return;}
  // find best/worst
  var times=S.laps.map(function(l){return l.lap;});
  var best=Math.min.apply(null,times), worst=Math.max.apply(null,times);
  var multi=S.laps.length>1;
  var html='<div class="lap-header"><span>Lap</span><span>Lap Time</span><span>Total</span></div>';
  html+=S.laps.map(function(l){
    var cls='lap-row';
    if(multi&&l.lap===best)cls+=' best';
    else if(multi&&l.lap===worst)cls+=' worst';
    return '<div class="'+cls+'"><span class="lap-num">Lap '+l.num+'</span><span class="lap-time">'+fmtMs(l.lap)+'</span><span class="lap-total">'+fmtMs(l.total)+'</span></div>';
  }).join('');
  el.innerHTML=html;
}

render();

document.getElementById('btn-remove-ads').addEventListener('click',function(){if(window.Android)Android.purchase('remove_ads');});
window.onPurchaseComplete=function(id){if(id==='remove_ads'){S.removeAds=true;document.getElementById('admob-banner').style.display='none';document.getElementById('btn-remove-ads').style.display='none';if(window.Android)Android.hideBannerAd();}};
function maybeInterstitial(){S.useCount++;if(!S.removeAds&&S.useCount%8===0&&window.Android)Android.showInterstitial();}
window.onAdMobLoaded=function(){};
if(!window.Android&&!S.removeAds)document.getElementById('admob-banner').style.display='flex';
</script>
</body>
</html>

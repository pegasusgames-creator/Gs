html[lang^="tr"]{--font:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:2px;min-height:var(--appbar-h);padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;padding-inline-start:16px;background:var(--bg)}
.appbar.has-back{padding-inline-start:4px}
.ab-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ab-title{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-sub{font-size:.82rem;font-weight:600;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:3rem;height:3rem;min-width:48px;min-height:48px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-grid;place-items:center;padding:0;transition:background .15s}
.icon-btn:active{background:var(--surface-3)}
.icon-btn.tint{color:var(--accent)}
[dir="rtl"] .flip{transform:scaleX(-1)}
#view:focus{outline:none}
#view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:auto}
.page{max-width:760px;margin:0 auto;padding:4px 16px 28px}
/* Bottom nav = the utility 'footer': symmetric padding + safe-area inset + 6px buffer above
   the native banner (the banner lives outside the WebView, below it). */
.nav{flex:0 0 auto;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding:clamp(2px,.6vh,6px) 8px calc(clamp(2px,.6vh,6px) + env(safe-area-inset-bottom,0px) + 6px)}
.nav-in{display:flex;width:100%;max-width:560px}
.nav-btn{flex:1 1 0;min-width:0;min-height:var(--nav-h);border:0;background:transparent;color:var(--text-mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;padding:6px 2px}
.nav-btn .pill{display:grid;place-items:center;width:3.6rem;height:2rem;border-radius:1rem;transition:background .2s,color .2s}
.nav-btn[aria-current="page"]{color:var(--text)}
.nav-btn[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.nav-btn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cards, lists, rows */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card+.card,.group+.group{margin-top:14px}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute)}
.sec-h:first-child{margin-top:10px}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:3.5rem;padding:10px 16px;border:0;background:transparent;text-align:start;color:var(--text);font-size:1rem}
.group .row+.row,.group .row+.row-x,.group .row-x+.row{border-top:1px solid var(--border)}
button.row:active{background:var(--surface-2)}
.row .ri{width:2.25rem;height:2.25rem;border-radius:11px;display:grid;place-items:center;background:var(--menu-tile-bg);color:var(--menu-tile-fg);border:1px solid var(--menu-tile-border);flex:none}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rl{font-weight:650;overflow-wrap:break-word}
.row .rs{font-size:.84rem;color:var(--text-mute);overflow-wrap:break-word}
.row select.inp{width:42%;max-width:240px;min-height:2.75rem;flex:none;padding-inline:12px}
.row .rv{color:var(--text-mute);font-weight:650;font-size:.92rem;flex:none;max-width:45%;text-align:end}
.row .chev{color:var(--text-faint)}
.row-x{padding:12px 16px}
.row.danger,.row.danger .ri{color:var(--danger)}
.row.danger .ri{background:transparent;border:1.5px solid currentColor}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:800;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:transparent;color:var(--success);border:1.5px solid currentColor}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;min-width:48px;padding:0 20px;border-radius:14px;border:0;font-weight:750;font-size:1rem;line-height:1.15;text-align:center;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--g-play);color:var(--on-accent);box-shadow:0 6px 18px -6px var(--accent)}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-neutral{background:var(--btn-neutral-bg);color:var(--text)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}

/* form controls */
.field{display:block;margin:0 0 16px}
.field>.fl{display:block;font-size:.85rem;font-weight:750;color:var(--text-mute);margin:0 2px 8px}
.inp{width:100%;min-height:3rem;padding:10px 14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:1rem}
.inp::placeholder{color:var(--text-faint)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:6.5rem;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:var(--surface-2);width:100%}
.seg button{flex:1 1 0;min-width:0;min-height:2.75rem;border:0;border-radius:11px;background:transparent;color:var(--text-mute);font-weight:750;font-size:.88rem;line-height:1.15;padding:4px;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.switch{position:relative;flex:none;width:3.25rem;height:2rem;min-width:52px;border-radius:1rem;border:0;background:var(--border-strong);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:calc(2rem - 6px);height:calc(2rem - 6px);border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(1.25rem)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-1.25rem)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:3rem;height:3rem;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center}
.sw i{width:2.1rem;height:2.1rem;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--text)}
.sw .lk{position:absolute;inset-inline-end:2px;bottom:2px;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:14px;padding:4px}
.stepper button{width:2.75rem;height:2.75rem;min-width:44px;border-radius:11px;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.stepper output{min-width:2.6rem;text-align:center;font-weight:800;font-size:1.15rem}

/* layers: sheets, dialogs, onboarding, toast */
.layer{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center}
.layer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;border:0;padding:0;width:100%}
.layer.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);color:var(--text);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer.in .sheet{transform:none}
.sheet.full{height:calc(100% - 24px)}
.sheet-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0;padding-inline-start:20px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:1.2rem;font-weight:800;min-width:0}
.grab{position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong)}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px 20px 16px;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.sheet-foot .btn{flex:1 1 140px}
.layer.center{align-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:400px;background:var(--surface);color:var(--text);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:22px 20px 16px;transform:scale(.94);opacity:0;transition:transform .2s,opacity .2s}
.layer.in .dialog{transform:none;opacity:1}
.dialog h2{margin:0 0 8px;font-size:1.2rem;font-weight:800}
.dialog p{margin:0 0 18px;color:var(--text-mute)}
.dialog .btn-row{justify-content:flex-end}
.dialog .btn-row .btn{flex:0 1 auto}
#toast{position:fixed;left:50%;bottom:calc(var(--toast-b,16px) + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);z-index:var(--z-critical);width:calc(100% - 32px);max-width:520px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;padding-inline:18px 8px;min-height:3.25rem;border-radius:16px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:650;font-size:.95rem}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .tm{flex:1;min-width:0;padding:6px 0}
#toast .ta{border:0;background:transparent;color:var(--bg);font-weight:850;min-height:44px;padding:0 14px;border-radius:12px;text-decoration:underline;text-underline-offset:3px}
.onb{position:fixed;inset:0;z-index:var(--z-tutorial);background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.onb-top{display:flex;justify-content:flex-end;padding:0 8px}
.onb-track{flex:1;display:flex;overflow:hidden;touch-action:pan-y}
.onb-card{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 32px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.onb-art{width:min(68vw,260px);height:min(68vw,260px);margin-bottom:28px}
.onb-art svg{width:100%;height:100%}
.onb h2{margin:0 0 10px;font-size:1.6rem;font-weight:850;letter-spacing:-.015em;max-width:440px}
.onb p{margin:0;color:var(--text-mute);font-size:1.05rem;max-width:400px}
.onb-foot{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 24px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--border-strong);transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--accent)}
.onb-foot .btn{width:min(100%,420px)}
.empty{text-align:center;padding:28px 18px 8px}
.empty .ea{width:132px;height:132px;margin:0 auto 14px}
.empty h3{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.empty p{margin:0 auto 18px;color:var(--text-mute);max-width:360px}
.pro-hero{text-align:center;padding:2px 0 8px}
.pro-hero .em{width:84px;height:84px;margin:0 auto 10px}
.pro-hero h3{margin:0;font-size:1.4rem;font-weight:850}
.pro-hero p{margin:6px 0 0;color:var(--text-mute)}
.feat{list-style:none;margin:14px 0 6px;padding:0}
.feat li{display:flex;align-items:center;gap:12px;padding:9px 2px;font-weight:650}
.feat li .ri{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.fine{font-size:.82rem;color:var(--text-mute);text-align:center;margin:10px 0 0}
.about-foot{text-align:center;color:var(--text-mute);font-size:.82rem;margin:22px 0 4px}
.lock-chip{display:inline-flex;align-items:center;gap:4px}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (min-width:600px){html{font-size:calc(17px * var(--fs))}.page{padding:8px 24px 32px}.appbar{padding-inline:20px 12px}.sheet-body,.sheet-foot{padding-inline:28px}}
@media (min-width:900px){html{font-size:calc(18px * var(--fs))}:root{--appbar-h:4rem}.ab-title{font-size:1.5rem}}

/*@@REGION TOOL_CSS*/
/* Habit Tracker tool styles. --hc = the habit's own colour (user data). */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:4.4rem;padding:6px 0 7px;border-radius:16px;border:0;background:transparent;color:var(--text-mute)}
.wd .wn{font-size:.72rem;font-weight:750;text-transform:uppercase;letter-spacing:.02em}
.wd .wr{position:relative;width:2.3rem;height:2.3rem;display:grid;place-items:center;font-weight:800;font-size:.95rem;color:var(--text)}
.wd .wr svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.wd .wr .tr{stroke:var(--border)}
.wd .wr .pr{stroke:var(--accent);transition:stroke-dashoffset .4s}
.wd[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow-1)}
.wd[aria-pressed="true"] .wn{color:var(--accent)}
.wd.full .wr{background:var(--accent);color:var(--on-accent);border-radius:50%}
.sum{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.sum .ring{position:relative;width:4.6rem;height:4.6rem;flex:none}
.sum .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.sum .ring .tr{stroke:var(--surface-2)}
.sum .ring .pr{stroke:var(--accent);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.sum .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem;font-weight:850}
.sum h2{margin:0;font-size:1.12rem;font-weight:850;line-height:1.25}
.sum p{margin:3px 0 0;color:var(--text-mute);font-size:.9rem}
.sum.alldone{background:var(--g-play);color:var(--on-accent);border-color:transparent}
.sum.alldone p{color:var(--on-accent);opacity:.92}
.sum.alldone .ring .tr{stroke:rgba(255,255,255,.28)}
.sum.alldone .ring .pr{stroke:var(--on-accent)}
.backtoday{margin:-6px 0 12px}
.hlist{display:flex;flex-direction:column;gap:10px}
.hrow{--hc:#5B48D9;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 0;padding-inline:0 6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1);transition:opacity .2s}
.hrow.isdone{background:var(--surface)}
.hmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:3.75rem;padding:6px 6px 6px 12px;padding-inline:12px 6px;border:0;background:transparent;text-align:start;border-radius:var(--r)}
.hic{width:2.9rem;height:2.9rem;border-radius:15px;display:grid;place-items:center;background:var(--hc);color:#fff;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.htx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hnm{font-weight:780;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow.isdone .hnm{color:var(--text-mute)}
.hmt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--text-mute);font-weight:650}
.hmt .fl{display:inline-flex;align-items:center;gap:2px}
.hmt .fl svg{color:var(--flame)}
.chk{position:relative;width:3.6rem;height:3.6rem;min-width:56px;min-height:56px;border-radius:50%;border:0;background:transparent;padding:0;display:grid;place-items:center;flex:none;touch-action:manipulation;-webkit-touch-callout:none}
.chk .rg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transform:rotate(-90deg)}
.chk .rg .tr{stroke:var(--surface-3)}
.chk .rg .pr{stroke:var(--hc);transition:stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1)}
.chk .fill{position:absolute;inset:6px;border-radius:50%;background:var(--hc);transform:scale(0);transition:transform .32s cubic-bezier(.3,1.6,.5,1)}
.chk .tk{position:relative;width:1.7rem;height:1.7rem;color:#fff;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .08s}
.chk .ct{position:absolute;font-weight:850;font-size:.92rem;color:var(--text)}
.chk.on .fill{transform:scale(1)}
.chk.on .tk{stroke-dashoffset:0}
.chk.on .ct{display:none}
.chk.bump{animation:bump .28s}
.chk.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{50%{transform:scale(.88)}}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--hc);animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:var(--z-toast);overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.6}}
.collapse{display:flex;align-items:center;gap:8px;width:100%;min-height:3rem;margin:18px 0 8px;padding:0 4px;border:0;background:transparent;color:var(--text-mute);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.collapse svg{transition:transform .2s}
.collapse[aria-expanded="true"] svg{transform:rotate(90deg)}
.later .hrow{opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug{display:inline-flex;align-items:center;gap:8px;min-height:2.9rem;padding:0 14px 0 6px;padding-inline:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow-1)}
.sug .hic{width:2.1rem;height:2.1rem;border-radius:50%}
.planbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:var(--r);background:var(--accent-soft);color:var(--text);font-weight:650;font-size:.9rem}
.planbar span{flex:1;min-width:0}
.planbar .btn{min-height:2.6rem;padding:0 14px;font-size:.9rem}
.mrow{display:flex;align-items:center;gap:2px;background:var(--surface);transition:transform .15s,box-shadow .15s}
.mrow+.mrow{border-top:1px solid var(--border)}
.mrow .hmain{border-radius:0}
.mrow.dragging{position:relative;z-index:var(--z-overlay-dim);box-shadow:var(--shadow-2);transition:none}
.drag{width:2.75rem;height:3.5rem;min-width:44px;border:0;background:transparent;color:var(--text-faint);display:grid;place-items:center;touch-action:none;cursor:grab}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-1);min-width:0}
.tile .tv{font-size:1.6rem;font-weight:850;line-height:1.1;letter-spacing:-.01em}
.tile .tl{font-size:.8rem;font-weight:700;color:var(--text-mute);margin-top:4px}
.tile .tv small{font-size:.9rem;font-weight:700;color:var(--text-mute)}
.bars{display:flex;align-items:flex-end;gap:4px;height:7.5rem;padding-top:6px}
.bar{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.bar .bt{flex:1;width:100%;display:flex;align-items:flex-end;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar .bf{width:100%;background:var(--accent);border-radius:7px 7px 0 0;min-height:2px;transition:height .4s}
.bar .bl{font-size:.68rem;font-weight:700;color:var(--text-mute);white-space:nowrap}
.bar.cur .bl{color:var(--accent)}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
.hero .hic{width:3.8rem;height:3.8rem;border-radius:20px}
.hero h2{margin:0;font-size:1.08rem;font-weight:800;overflow-wrap:break-word}
.hero p{margin:2px 0 0;color:var(--text-mute);font-size:.9rem}
.cal-h{display:flex;align-items:center;gap:4px;margin:0 auto 6px;max-width:460px}
.cal-h b{flex:1;text-align:center;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:460px;margin:0 auto}
[dir="rtl"] .collapse svg{transform:scaleX(-1)}
[dir="rtl"] .collapse[aria-expanded="true"] svg{transform:rotate(90deg)}
.cal .dn{text-align:center;font-size:.7rem;font-weight:800;color:var(--text-mute);padding:4px 0;text-transform:uppercase}
.cd{position:relative;aspect-ratio:1;min-height:2.6rem;border:0;border-radius:12px;background:var(--surface-2);color:var(--text);font-weight:750;font-size:.88rem;display:grid;place-items:center;padding:0}
.cd.off{background:transparent;color:var(--text-faint);font-weight:600}
.cd.l1{background:var(--hc);color:#fff;opacity:.45}
.cd.l2{background:var(--hc);color:#fff;opacity:.7}
.cd.l3{background:var(--hc);color:#fff}
.cd.today{box-shadow:inset 0 0 0 2.5px var(--text)}
.cd.fut{opacity:.35}
.cd .nt{position:absolute;top:4px;inset-inline-end:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
.cd.pad{visibility:hidden}
.year{overflow-x:auto;padding-bottom:6px}
.yg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:3px;width:max-content}
.yg i{border-radius:3px;background:var(--surface-2)}
.yg i.l1{background:var(--hc);opacity:.45}.yg i.l2{background:var(--hc);opacity:.7}.yg i.l3{background:var(--hc)}
.notes{list-style:none;margin:0;padding:0}
.notes li{padding:10px 2px;border-top:1px solid var(--border)}
.notes li:first-child{border-top:0}
.notes b{display:block;font-size:.78rem;color:var(--text-mute);font-weight:750}
.notes span{overflow-wrap:anywhere;white-space:pre-wrap}
.lockcard{position:relative;overflow:hidden}
.lockcard .blur{filter:blur(5px);opacity:.55;pointer-events:none}
.lockcard .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;background:var(--surface-2);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.lockcard .lk p{margin:0;color:var(--text);font-weight:650;max-width:320px}
.rank{display:flex;align-items:center;gap:12px;padding:8px 0}
.rank .hic{width:2.3rem;height:2.3rem;border-radius:12px}
.rank .rn{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:block;flex:none;width:100%;margin:6px 0 4px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mini i{display:block;height:100%;background:var(--hc,var(--accent));border-radius:3px}
.pct{flex:none;min-width:2.8rem;text-align:end;font-weight:800;font-size:.9rem}
.icons{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,3rem);grid-auto-columns:3rem;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.ip{width:3rem;height:3rem;border-radius:14px;border:0;background:var(--surface-2);color:var(--text);display:grid;place-items:center;padding:0}
.ip[aria-pressed="true"]{background:var(--hc);color:#fff;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--hc)}
.cols{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 8px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dy{min-height:3rem;border-radius:12px;border:1.5px solid var(--border);background:transparent;color:var(--text-mute);font-weight:800;font-size:.85rem;padding:0}
.dy[aria-pressed="true"]{background:var(--hc);border-color:var(--hc);color:#fff}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pre{min-height:2.5rem;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:.82rem}
.pre[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.goal{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.goal .inp{flex:1 1 120px;width:auto}
.remrow{display:flex;align-items:center;gap:12px;min-height:3rem}
.remrow .rl{flex:1;font-weight:700}
.remrow .rs{display:block;font-size:.8rem;color:var(--text-mute);font-weight:600}
.edit-prev{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:16px;border-radius:var(--r);background:var(--surface-2)}
.edit-prev .hic{width:3.2rem;height:3.2rem}
.edit-prev b{font-size:1.08rem;overflow-wrap:anywhere}
.dsheet .big{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 18px}
.dsheet .chk{width:5rem;height:5rem}
.dsheet .chk .tk{width:2.3rem;height:2.3rem}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.bars{height:9rem}.yg{grid-template-rows:repeat(7,13px);grid-auto-columns:13px}}
@media (min-width:900px){.page[data-screen="today"] .hlist{display:grid;grid-template-columns:1fr 1fr}}
/*@@END TOOL_CSS*/
</style>

// ── Actions: every tappable element is <… data-act="name" data-arg="…">.

// ── Navigation / app bar / layers ────────────────────────────────────
const SHELL_SCREENS = {};
const UI = {
  stack: [], layers: [], _toastT: 0,
  cur() { return this.stack[this.stack.length - 1]; },
  def(id) { return SHELL_SCREENS[id] || TOOL.screens[id]; },
  tab(id) { this.stack = [{ id: id, params: {} }]; this.render(true); },
  go(id, params) { const c = this.cur(); if (c) c.scroll = $('#view').scrollTop; this.stack.push({ id: id, params: params || {} }); this.render(true); },
  back() {
    if (this.layers.length) { this.closeLayer(); return true; }
    if (this.stack.length > 1) { const leaving = this.stack.pop(); const d = this.def(leaving.id); if (d && d.onLeave) d.onLeave(leaving.params); this.render(true, true); return true; }
    if (this.cur() && this.cur().id !== APP.tabs[0].id) { this.tab(APP.tabs[0].id); return true; }
    return false;
  },
  refresh() { this.render(false); },
  render(reset, popped) {

    bb.hidden = depth < 2; $('#appbar').classList.toggle('has-back', depth > 1);
    bb.innerHTML = icon('back', 24, 'flip'); bb.setAttribute('aria-label', t('back'));
    $('#ab-title').textContent = d.title ? d.title(e.params) : APP.name;
    const sub = d.subtitle ? d.subtitle(e.params) : '';
    $('#ab-sub').textContent = sub || ''; $('#ab-sub').hidden = !sub;
    const acts = (d.actions ? d.actions(e.params) : []).slice();
    if (depth === 1) acts.push({ icon: 'gear', label: t('settings'), act: 'go', arg: 'settings' });
    $('#ab-actions').innerHTML = acts.map(a => '<button class="icon-btn' + (a.tint ? ' tint' : '') + '" data-act="' + a.act + '"' + (a.arg != null ? ' data-arg="' + esc(a.arg) + '"' : '') + ' aria-label="' + esc(a.label) + '">' + icon(a.icon) + '</button>').join('');
    const showNav = depth === 1 && APP.tabs.length > 1;

    $$('.nav-btn').forEach(b => { b.setAttribute('aria-current', b.dataset.arg === e.id ? 'page' : 'false'); b.setAttribute('aria-selected', b.dataset.arg === e.id ? 'true' : 'false'); });
    document.documentElement.style.setProperty('--toast-b', showNav ? 'calc(var(--nav-h) + 14px)' : '16px');

    view.scrollTop = reset ? (popped ? (e.scroll || 0) : 0) : keep;

  },
  empty(o) {
    return '<div class="empty">' + (o.art ? '<div class="ea">' + o.art + '</div>' : (o.icon ? '<div class="ea" style="display:grid;place-items:center;color:var(--accent)">' + icon(o.icon, 64) + '</div>' : '')) +

      (o.cta ? '<button class="btn btn-primary" data-act="' + o.act + '"' + (o.arg ? ' data-arg="' + esc(o.arg) + '"' : '') + '>' + icon('plus', 20) + esc(o.cta) + '</button>' : '') + '</div>';
  },
  // Bottom sheet. o: {title, body (html), foot (html), full, cls, onClose}. Returns the sheet element.
  sheet(o) {

      '<div class="grab"></div><div class="sheet-head"><h2>' + esc(o.title || '') + '</h2><button class="icon-btn" data-act="close-layer" aria-label="' + esc(t('close')) + '">' + icon('close') + '</button></div>' +
      '<div class="sheet-body">' + (o.body || '') + '</div>' + (o.foot ? '<div class="sheet-foot">' + o.foot + '</div>' : '') + '</div>';

  _push(L, o) {

  closeAll() { while (this.layers.length) this.closeLayer(true); },
  // Promise<boolean>. o: {title, body, ok, cancel, danger}
  confirm(o) {
    return new Promise(res => {

      this.dialog({ html: '<h2>' + esc(o.title) + '</h2>' + (o.body ? '<p>' + esc(o.body) + '</p>' : '') +
        '<div class="btn-row"><button class="btn btn-ghost" data-act="cf-' + id + '" data-arg="0">' + esc(o.cancel || t('cancel')) + '</button>' +
        '<button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-act="cf-' + id + '" data-arg="1">' + esc(o.ok || t('ok')) + '</button></div>',

ACT.go = el => UI.go(el.dataset.arg);

// ── Monetization ─────────────────────────────────────────────────────
// Catalog == metadata/iaps.json == MainActivity.VALID_PRODUCTS. Both are
// non-consumable; Pro includes ad-free. No subscriptions in the utility shell.
const PRICES = Object.assign({}, APP.prices);
function isPro() { return S.pro === true; }
function adsRemoved() { return S.removeAds === true || isPro(); }
function grant(id) {
  const was = { ads: S.removeAds, pro: S.pro };
  switch (id) {
    case 'remove_ads': S.removeAds = true; break;
    case 'pro_lifetime': S.pro = true; S.removeAds = true; break;
    default: return false;
  }
  persist(); Ads.banner(); applyTheme();
  if (was.ads !== S.removeAds || was.pro !== S.pro) {
    UI.toast(t('thanks')); haptic('success');
    if (UI.layers.length && $('.layer:last-child .pro-hero')) UI.closeLayer(true);
    if (TOOL.onGrant) TOOL.onGrant(id);
    UI.refresh();
  }
  return true;
}
function iapDeferGrant(id) {
  try { const p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); p[id] = NOW(); localStorage.setItem('pendingGrants', JSON.stringify(p)); } catch (e) {}
}
window.iapDeferGrant = iapDeferGrant;
// Java billing bridge → here for every PURCHASED (and every restored) SKU. Never throws.
window.onPurchaseSuccess = function (id) {
  try { if (!grant(String(id))) iapDeferGrant(String(id)); }
  catch (e) { try { console.warn('IAP grant error', id, e); } catch (x) {} iapDeferGrant(String(id)); }
};
window.onPurchaseComplete = window.onPurchaseSuccess;
// Unknown SKUs bought before their mechanic existed are replayed once it does.
window.replayPendingGrants = function () {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('pendingGrants') || '{}'); } catch (e) { return; }
  const ids = Object.keys(p); if (!ids.length) return;
  const left = {};
  ids.forEach(id => { let ok = false; try { ok = grant(id); } catch (e) {} if (!ok) left[id] = p[id]; });
  try { if (Object.keys(left).length) localStorage.setItem('pendingGrants', JSON.stringify(left)); else localStorage.removeItem('pendingGrants'); } catch (e) {}
};
let restoreAsked = false;
window.onRestoreComplete = function (n) { if (restoreAsked) { restoreAsked = false; UI.toast((n | 0) > 0 ? t('restored') : t('nothing_restore')); } };
window.onLocalizedPrices = function (map) { try { Object.assign(PRICES, map || {}); if ($('.pro-hero')) Pro.fill(); } catch (e) {} };
window.onPurchaseUnavailable = function () { UI.toast(t('store_unavail')); };

}

// Ads: banner always (unless ad-free); interstitial ONLY at natural breaks,
// never in the first session, >= 3 min apart, >= 2 breaks between ads,
// never for Remove-Ads / Pro owners. Rewarded = opt-in only.
const Ads = {
  pending: null,
  banner() { callA(adsRemoved() ? 'hideBannerAd' : 'showBannerAd'); },
  naturalBreak(reason) {
    if (!APP.interstitials || adsRemoved() || !bridge()) return false;
    if (S.sessions < 2) return false;                         // never in the first session
    S.ads.breaks = (S.ads.breaks | 0) + 1;
    const sinceInterstitialMs = NOW() - (S.ads.last || 0);
    if (S.ads.breaks >= 2 && sinceInterstitialMs >= 180000) {  // >=2 breaks AND >=3 min since the last one
      S.ads.breaks = 0; S.ads.last = NOW(); persist();
      callA('showInterstitial');
      return true;
    }
    persist();
    return false;
  },
  // Opt-in rewarded video. type must be in MainActivity.VALID_REWARD_TYPES.
  rewarded(type, onReward) {
    if (!bridge()) { UI.toast(t('ad_not_ready')); return; }
    this.pending = { type: type, cb: onReward };
    callA('showRewarded', type);
  },
  preload() { callA('preloadRewarded'); },
};

window.onAdReward = function(type) {

  if (p && p.type === type && p.cb) { try { p.cb(); } catch (e) {} }
};

// ── Reminders (Java NotificationHelper; slot 0 = app-wide daily) ─────
// Permission is asked IN CONTEXT only — after the user switches a reminder on.
const Reminders = {
  _res: null,
  ensurePermission() {
    return new Promise(res => {
      if (!bridge()) return res(true);
      if (callA('hasNotificationPermission') === true) return res(true);
      this._res = res; callA('requestNotificationPermission');
    });
  },
  set(slot, h, m, daysMask, title, body) {
    const A = bridge();
    if (A && typeof A.scheduleReminder === 'function') callA('scheduleReminder', slot, h, m, daysMask & 127, title, body);
    else if (slot === 0) callA('scheduleDailyReminder', h, m);
  },
  cancel(slot) { callA('cancelReminder', slot); },
  // Turn one on: permission first; false (and a settings hint) when refused.
  async enable(slot, h, m, daysMask, title, body) {
    const ok = await this.ensurePermission();
    if (!ok) { UI.toast(t('notif_off'), { action: t('open_settings'), onAction: () => callA('openNotificationSettings') }); return false; }
    this.set(slot, h, m, daysMask, title, body); return true;
  },
  syncDaily() {
    if (!APP.reminder) return;
    const d = S.settings.daily;
    if (d.on) this.set(0, d.h, d.m, 127, APP.name, t(APP.reminder.body)); else this.cancel(0);
  },
};

// ── Data: local-only; export = JSON text via the share sheet / clipboard ──
const Data = {
  payload() {
    return JSON.stringify({ app: APP.pkg, kind: 'backup', v: SAVE_VERSION, at: new Date(NOW()).toISOString(), settings: S.settings, tool: S.tool });
  },
  share(text, subject) { if (bridge()) callA('shareText', text); else this.copy(text); },
  copy(text) {
    let ok = false;
    if (bridge()) { callA('copyToClipboard', text); ok = true; }
    else if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); ok = true; }
    UI.toast(ok ? t('copied') : t('store_unavail'));
  },
  async paste() {
    const v = callA('readClipboard');

    return '';
  },
  parse(text) {

const Onboarding = {
  i: 0,
  show(replay) {
    if (!APP.onboarding.length) return;
    this.i = 0;
    const L = document.createElement('div');
    L.className = 'onb'; L.id = 'onb'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true');
    L.innerHTML = '<div class="onb-top"><button class="btn btn-ghost" data-act="onb-done">' + esc(t('skip')) + '</button></div>' +
      '<div class="onb-track">' + APP.onboarding.map((c, i) => '<section class="onb-card" aria-hidden="' + (i ? 'true' : 'false') + '"><div class="onb-art">' + (ART[c.art] || '') + '</div><h2>' + esc(t(c.title)) + '</h2><p>' + esc(t(c.body)) + '</p></section>').join('') + '</div>' +
      '<div class="onb-foot"><div class="dots">' + APP.onboarding.map((c, i) => '<i class="' + (i ? '' : 'on') + '"></i>').join('') + '</div><button class="btn btn-primary" id="onb-next" data-act="onb-next">' + esc(t('next')) + '</button></div>';
    document.body.appendChild(L);
    let x0 = null;
    const tr = L.querySelector('.onb-track');
    tr.addEventListener('pointerdown', e => { x0 = e.clientX; });
    tr.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { const fwd = (dx < 0) !== (document.documentElement.dir === 'rtl'); this.step(fwd ? 1 : -1); } });
    this.paint();
  },
  step(d) { const n = APP.onboarding.length; const j = this.i + d; if (j >= n) { this.done(); return; } this.i = clamp(j, 0, n - 1); this.paint(); },
  paint() {
    const L = $('#onb'); if (!L) return;
    const rtl = document.documentElement.dir === 'rtl', n = APP.onboarding.length;
    $$('.onb-card', L).forEach((c, k) => { c.style.transform = 'translateX(' + ((rtl ? 100 : -100) * this.i) + '%)'; c.setAttribute('aria-hidden', k === this.i ? 'false' : 'true'); });
    $$('.dots i', L).forEach((d, k) => d.classList.toggle('on', k === this.i));
    $('#onb-next').textContent = this.i === n - 1 ? t('get_started') : t('next');
  },
  done() {
    const L = $('#onb'); if (L) L.remove();
    if (!S.onboarded) { S.onboarded = true; persist(); if (TOOL.afterOnboarding) TOOL.afterOnboarding(); }
  },
};
ACT['onb-next'] = () => Onboarding.step(1);
ACT['onb-done'] = () => Onboarding.done();

const MEMO = new Map();

function freeSlot() { const used = new Set(S.tool.habits.map(h => h.slot)); for (let s = 1; s <= 63; s++) if (!used.has(s)) return s; return 0; }
function syncHabitReminder(h) {
  if (!h.slot) return;
  if (h.rem && h.rem.on && !h.archived) Reminders.set(h.slot, h.rem.h, h.rem.m, h.days & 127, h.name, t('rem_habit_body', { name: h.name }));

ACT['ed-save'] = () => {

  if (!(ED.days & 127)) { UI.toast(t('days_needed')); haptic('reject'); return; }
  let h;
  const fields = { name: name, icon: HICON[ED.icon] ? ED.icon : 'check', color: ED.color, days: ED.days & 127, target: clamp(ED.target | 0, 1, 99), unit: String(ED.unit || '').trim().slice(0, 16), rem: { on: !!ED.rem.on, h: ED.rem.h | 0, m: ED.rem.m | 0 } };

    S.tool.habits.push(h);

  MEMO.clear(); persist(); syncHabitReminder(h);

async function deleteHabit(h) {
  const ok = await UI.confirm({ title: t('del_t'), body: t('del_b'), ok: t('delete'), danger: true });
  if (!ok) return false;
  const idx = S.tool.habits.indexOf(h), log = S.tool.log[h.id], notes = S.tool.notes[h.id];
  S.tool.habits.splice(idx, 1); delete S.tool.log[h.id]; delete S.tool.notes[h.id];
  MEMO.clear(); persist(); if (h.slot) Reminders.cancel(h.slot); haptic('reject');
  UI.closeAll(); if (UI.cur().id === 'habit') UI.back(); UI.refresh();
  UI.toast(t('habit_deleted'), { action: t('undo'), onAction: () => {
    S.tool.habits.splice(Math.min(idx, S.tool.habits.length), 0, h); if (log) S.tool.log[h.id] = log; if (notes) S.tool.notes[h.id] = notes;
    MEMO.clear(); persist(); syncHabitReminder(h); UI.refresh();
  } });
  return true;
}
ACT['ed-delete'] = () => { const h = HB.get(ED.id); if (h) deleteHabit(h); };

const CAL = { id: '', y: 0, m: 0 };
function calHtml(h) {
  if (CAL.id !== h.id) { const n = today(); CAL.id = h.id; CAL.y = n.getFullYear(); CAL.m = n.getMonth(); }
  const first = new Date(CAL.y, CAL.m, 1, 12), dim = new Date(CAL.y, CAL.m + 1, 0).getDate(), tk = todayKey(), n = today();
  const atNow = CAL.y === n.getFullYear() && CAL.m === n.getMonth();
  let g = '<div class="cal-h"><button class="icon-btn" data-act="cal-prev" aria-label="' + esc(t('prev_month')) + '">' + icon('back', 22, 'flip') + '</button><b>' + esc(fmtDate(first, { month: 'long', year: 'numeric' })) + '</b>' +
    '<button class="icon-btn" data-act="cal-next" aria-label="' + esc(t('next_month')) + '"' + (atNow ? ' disabled style="opacity:.3"' : '') + '>' + icon('chev', 22, 'flip') + '</button></div><div class="cal" style="--hc:' + h.color + '">' +
    dowOrder().map(i => '<span class="dn">' + esc(weekdayName(i, 'narrow')) + '</span>').join('');
  const pad = (first.getDay() - wkStart() + 7) % 7;
  for (let i = 0; i < pad; i++) g += '<span class="cd pad"></span>';
  for (let day = 1; day <= dim; day++) {
    const d = new Date(CAL.y, CAL.m, day, 12), k = dkey(d), L = lvl(h, k), fut = k > tk;
    const cls = 'cd' + (fut ? ' fut' : '') + (L ? ' l' + L : (!HB.sched(h, d) ? ' off' : '')) + (k === tk ? ' today' : '');
    g += '<button class="' + cls + '"' + (fut ? ' disabled' : ' data-act="cal-day" data-arg="' + k + '"') + ' aria-label="' + esc(fmtDate(d, { day: 'numeric', month: 'long' }) + ' — ' + (L === 3 ? t('done_state') : t('not_done_state'))) + '">' + fmtNum(day) + (HB.note(h, k) ? '<span class="nt"></span>' : '') + '</button>';
  }
  return g + '</div>';
}
ACT['cal-prev'] = () => { CAL.m--; if (CAL.m < 0) { CAL.m = 11; CAL.y--; } UI.refresh(); };
ACT['cal-next'] = () => { CAL.m++; if (CAL.m > 11) { CAL.m = 0; CAL.y++; } UI.refresh(); };
ACT['cal-day'] = el => openDay(UI.cur().params.id, el.dataset.arg);
function barsHtml(items, color) {
  return '<div class="bars"' + (color ? ' style="--accent:' + color + '"' : '') + '>' + items.map(b => '<div class="bar' + (b.cur ? ' cur' : '') + '" role="img" aria-label="' + esc(b.aria || b.label) + ' ' + fmtPct(b.v) + '"><div class="bt"><div class="bf" style="height:' + Math.round((b.v || 0) * 100) + '%"></div></div><span class="bl">' + esc(b.label) + '</span></div>').join('') + '</div>';
}
function weeksTrend(h) {
  const ws = weekOf(today()), out = [];
  for (let w = 11; w >= 0; w--) { const a = addDays(ws, -7 * w); out.push({ v: HB.rate(h, a, addDays(a, 6)) || 0, label: w % 3 === 0 ? fmtDate(a, { day: 'numeric', month: 'numeric' }) : '', aria: fmtDate(a, { day: 'numeric', month: 'short' }), cur: w === 0 }); }
  return out;
}
function weekdayPattern(list) {
  const tally = [0, 0, 0, 0, 0, 0, 0].map(() => [0, 0]), tk = todayKey(), end = today();
  list.forEach(h => { for (let d = HB.start(h); d <= end; d = addDays(d, 1)) { if (!HB.sched(h, d)) continue; const k = dkey(d), dn = HB.done(h, k); if (k === tk && !dn) continue; tally[d.getDay()][1]++; if (dn) tally[d.getDay()][0]++; } });
  return dowOrder().map(i => ({ v: tally[i][1] ? tally[i][0] / tally[i][1] : 0, label: weekdayName(i, 'short').replace(/\.$/, ''), aria: weekdayName(i, 'long') }));
}
function yearHtml(h) {
  const end = today(), start = addDays(weekOf(end), -52 * 7); let g = '<div class="year"><div class="yg" style="--hc:' + h.color + '" role="img" aria-label="' + esc(t('year_map')) + '">';
  for (let d = start; d <= end; d = addDays(d, 1)) { const L = lvl(h, dkey(d)); g += '<i' + (L ? ' class="l' + L + '"' : '') + '></i>'; }
  return g + '</div></div>';
}
function lockCard(inner, reason) {

function monthsTrend() {
  const n = today(), out = [];
  for (let i = 11; i >= 0; i--) { const a = new Date(n.getFullYear(), n.getMonth() - i, 1, 12), b = new Date(n.getFullYear(), n.getMonth() - i + 1, 0, 12); out.push({ v: rateOver(a, b > n ? n : b) || 0, label: i % 3 === 0 ? fmtDate(a, { month: 'short' }).replace(/\.$/, '') : '', aria: fmtDate(a, { month: 'long', year: 'numeric' }), cur: i === 0 }); }
  return out;
}

const TOOL = {
  defaults: () => ({ habits: [], log: {}, notes: {}, weekStart: -1, lastVisit: '' }),
  migrate(tool, from) {
    const d = TOOL.defaults(), o = Object.assign(d, tool && typeof tool === 'object' ? tool : {});
    o.habits = (Array.isArray(o.habits) ? o.habits : []).filter(h => h && h.id && typeof h.name === 'string').map((h, i) => ({
      id: String(h.id), name: String(h.name).slice(0, 40), icon: HICON[h.icon] ? h.icon : 'check',
      color: /^#[0-9a-fA-F]{6}$/.test(h.color) ? h.color : COLORS[i % COLORS.length],
      days: (h.days & 127) || 127, target: clamp(h.target | 0 || 1, 1, 99), unit: String(h.unit || '').slice(0, 16),
      created: /^\d{4}-\d\d-\d\d$/.test(h.created) ? h.created : todayKey(), archived: !!h.archived,

    return o;

        const adv = '<div class="sec-h" style="margin-top:0">' + esc(t('year_map')) + '</div>' + yearHtml(h) + '<div class="sec-h">' + esc(t('by_weekday')) + '</div>' + barsHtml(weekdayPattern([h]), h.color);
        x += '<div class="sec-h"><span>' + esc(t('advanced')) + '</span>' + (isPro() ? '' : '<span class="badge">Pro</span>') + '</div>' + (isPro() ? '<div class="card card-pad">' + adv + '</div>' : lockCard(adv, 'advanced_b'));
        const N = S.tool.notes[h.id] || {}, keys = Object.keys(N).sort().reverse().slice(0, 30);
        x += '<div class="sec-h">' + esc(t('notes')) + '</div><div class="card card-pad">' + (keys.length ? '<ul class="notes">' + keys.map(k => '<li><b>' + esc(fmtDate(pkey(k), { weekday: 'short', day: 'numeric', month: 'long' })) + '</b><span>' + esc(N[k]) + '</span></li>').join('') + '</ul>' : '<p style="margin:0;color:var(--text-mute)">' + esc(t('no_notes')) + '</p>') + '</div>' +
          '<div class="sec-h">' + esc(t('f_reminder')) + '</div><div class="group">' + sRow({ icon: 'bell', label: h.rem && h.rem.on ? fmtTime(h.rem.h, h.rem.m) : t('off'), sub: h.rem && h.rem.on ? schedText(h) : t('f_reminder_sub'), act: 'edit-habit', arg: h.id }) + '</div>';
        el.innerHTML = x;
        // Year heatmap opens on the most recent weeks (RTL scrolls the other way).
        $$('.year', el).forEach(y => { y.scrollLeft = document.documentElement.dir === 'rtl' ? -y.scrollWidth : y.scrollWidth; });
      },
    },
  },
};
ACT['toggle-arc'] = () => { TD.arc = !TD.arc; UI.refresh(); };
CHANGE['week-start'] = el => { S.tool.weekStart = +el.value; persist(); MEMO.clear(); UI.refresh(); };

// Drag-to-reorder (grip handle; ArrowUp/ArrowDown on a focused grip also moves).
function moveHabit(id, to) {
  const act = HB.active(), from = act.findIndex(h => h.id === id); if (from < 0 || to === from) return;
  const [m] = act.splice(from, 1); act.splice(clamp(to, 0, act.length), 0, m);
  S.tool.habits = act.concat(HB.archived()); persist(); haptic('tap');
}
function initDrag(list) {
  if (!list) return;
  list.addEventListener('keydown', e => {
    const g = e.target.closest('.drag'); if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault(); const id = g.closest('.mrow').dataset.hid, i = HB.active().findIndex(h => h.id === id);
    moveHabit(id, i + (e.key === 'ArrowUp' ? -1 : 1)); UI.refresh(); const ng = $('.mrow[data-hid="' + id + '"] .drag'); if (ng) ng.focus();
  });
  list.addEventListener('pointerdown', e => {
    const g = e.target.closest('.drag'); if (!g) return;
    e.preventDefault();
    const row = g.closest('.mrow'), rows = $$('.mrow', list), i0 = rows.indexOf(row), hgt = row.getBoundingClientRect().height, y0 = e.clientY;
    let cur = i0;
    row.classList.add('dragging'); try { g.setPointerCapture(e.pointerId); } catch (x) {}
    const mv = ev => {
      const dy = ev.clientY - y0; row.style.transform = 'translateY(' + dy + 'px)';
      const tgt = clamp(i0 + Math.round(dy / hgt), 0, rows.length - 1);
      if (tgt !== cur) { cur = tgt; haptic('tap'); rows.forEach((r, i) => { if (r === row) return; let s = 0; if (i0 < cur && i > i0 && i <= cur) s = -hgt; if (i0 > cur && i < i0 && i >= cur) s = hgt; r.style.transform = s ? 'translateY(' + s + 'px)' : ''; }); }
    };
    const up = () => {
      g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
      row.classList.remove('dragging'); rows.forEach(r => { r.style.transform = ''; });
      if (cur !== i0) { moveHabit(row.dataset.hid, cur); UI.refresh(); }
    };
    g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
  });
}

  if (TOOL.syncReminders) TOOL.syncReminders();
  if (!S.onboarded) Onboarding.show();
})();
